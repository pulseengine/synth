project:
  name: synth
  version: "0.1.0"
  description: >
    WebAssembly-to-ARM Cortex-M AOT compiler with mechanized correctness
    proofs in Rocq. Produces bare-metal ELF binaries for embedded targets
    with formal verification via Z3 SMT and Rocq proof suites.
  schemas:
    - common
    - stpa
    - aspice
    - stpa-aspice.bridge

sources:
  - path: artifacts
    format: generic-yaml
  - path: safety/stpa
    format: stpa-yaml

docs:
  - docs

commits:
  format: trailers
  trailers:
    Implements: satisfies
    Fixes: fixes
    Verifies: verifies
    Trace: traces-to
  skip-trailer: "Trace: skip"
  exempt-types:
    - chore
    - style
    - ci
    - docs
    - build
  traced-paths:
    - crates/
    - coq/
    - safety/

externals:
  kiln:
    git: https://github.com/pulseengine/kiln.git
    ref: main
    prefix: kiln

  meld:
    git: https://github.com/pulseengine/meld.git
    ref: main
    prefix: meld

  sigil:
    git: https://github.com/pulseengine/sigil.git
    ref: main
    prefix: sigil

  loom:
    git: https://github.com/pulseengine/loom.git
    ref: main
    prefix: loom

  gale:
    git: https://github.com/pulseengine/gale.git
    ref: main
    prefix: gale

  scry:
    git: https://github.com/pulseengine/scry.git
    ref: main
    prefix: scry

  # jess hosts the hermetic Renode silicon oracles synth artifacts trace to
  # (e.g. TEST-PIX-013, GI-MEM-002's OOB-trap verification). Declared in #1012
  # when federated resolution was repaired — it had been referenced by
  # traces-to links but never declared, so the refs could not resolve.
  # NOTE (#1012): externals deliberately carry NO `path:` — a declared local
  # path takes precedence over `git:`, and a dead one (the /Volumes/Home
  # entries removed in #1012) poisons resolution for everyone else: rivet
  # reports "0 broken cross-refs" beside dozens of link errors because it
  # never resolves the graph at all. Sync via `rivet sync` (git fallback).
  jess:
    git: https://github.com/pulseengine/jess.git
    ref: main
    prefix: jess
