artifacts:
  - id: RQ-87-CLOSEWINDOW
    type: system-req
    release: v0.87
    status: implemented
    title: "A record cannot declare an already-closed issue held open without a gate reading it"
    description: >
        A record can declare `issue-scope: outlives` over an issue that is ALREADY
        CLOSED, and NO required CI context reads that field against live issue state.
        v0.86 shipped exactly that falsehood (DISPVOCAB3 over #1458, closed a week
        before the release opened) and it was caught only because the closure gate was
        asked EARLY, out of its scripted position — in the ritual it runs after the tag
        push and is ADVISORY, printing into a log nobody re-reads. A gate says nothing
        outside its window, and this one's window is after the only moment it could have
        blocked.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: Plant an `outlives` over a closed
        issue on a scratch branch and run every required context by name; if any reds,
        the lane is moot. Then check the other edge: the gate TRACEBACKS when asked
        before any tag exists, because `--since-tag` resolves through a remote commit
        lookup — so "ask it earlier" has a floor, and the fix is a reachable window
        rather than an earlier call.
        CITATION: #1478 is the issue that INTRODUCED `issue-scope: outlives` to express an
        honest half-delivery. This lane is the follow-on failure of that same mechanism — the
        field it added can now carry a falsehood no required gate reads. The number names where
        the mechanism was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1478"
      verification-track: manual
      landed: "PR #1543 - #1478 - DELIVERED: the issue-closure gate now runs on the LIVE tree inside the `Claim Check` REQUIRED context, so a record declaring `issue-scope: outlives` over an already-closed issue reds a merge instead of printing into a post-push advisory log. The refuting command ran FIRST and CONFIRMED the premise rather than refuting it: with an `outlives` planted over a CLOSED issue (#1183) against an OPEN #1476 paired control, every artifact-READING step of every required context is GREEN on both arms - all five in the claim-check job plus `rivet validate`, the other seven required contexts containing no step that touches artifacts/ at all - while the advisory gate reds and names #1183. Three flags were each paid for by a measurement: --from-anchor so a CI invocation does not become a seventh anchor site; --allow-vacuous-authorised because the VACUOUS AUTHORISED SET failure is unconditional and red all four invocation modes on the honest plan-time tree, which is why no mode could be wired before; and --require-state because with the state read broken the gate falls back to the window, an empty window flags nothing, and it exited ZERO on the planted falsehood - loud but not blocking, potent locally and inert in the venue that matters. The tag ritual still calls the gate WITHOUT --allow-vacuous-authorised, so v0.85 vacuous-authorised finding stays a failure where it is actionable. Both halves of the new self-test are asserted and both negative controls were EXECUTED: a no-op flag reds the downgrade case, an over-suppressing flag reds the held-open case. AND THE GUARD EARNED ITSELF TWICE BEFORE THE STEP WENT GREEN: --require-state REFUSED on exit 2 on its first two CI runs rather than passing blind, and the second refusal carried the cause because the first correction made it print one - FileNotFoundError No such file or directory gh. The gh BINARY IS ABSENT from the self-hosted pool, which REFUTED the hypothesis that the token could not read issues, and it also condemned the first fix: a gh api second surface beside gh issue list is not a second surface, since both shell out to the same missing binary. Corrected to urllib-over-REST primary with gh as the local fallback - the order stale_pin_check.py already documents in this same job - and the step is now GREEN, reporting REST api.github.com one page no gh binary needed, SIXTY open issues read, and one authorised zero held open zero failures."
      verified-by: >
        DELIVERED — the gate is wired into a REQUIRED context, so its window of
        positions now includes one from which it can block. Measured, with the
        refuting command run first and reported either way.

        THE PREMISE WAS CONFIRMED, NOT REFUTED. Plant an `issue-scope: outlives`
        over a CLOSED issue (#1183) on an otherwise-valid claiming artifact, with an
        identical arm over OPEN #1476 as the paired control, so a verdict
        difference can only come from the closed-ness. The population of gates is
        DERIVED rather than assumed: mapping the nine required contexts to their
        jobs by `name:`, all nine resolve and only TWO contain any step touching
        `artifacts/` — `Claim Check` (five of its forty-five steps) and `Rivet
        Validation` (one of six). The other seven have ZERO, so they are
        structurally incapable of reading `issue-scope`. Every one of the six that
        CAN was run on both arms and on the unplanted tree, and all are GREEN
        everywhere. Only `issue_closure_check.py` separates the arms, and it was
        not required.

        ONE ROW WAS NEARLY REPORTED WRONG, which is this release's theme landing
        on the lane's own instrument. `rivet validate` first read RED on BOTH
        arms, which looks like "reds but is blind to the difference". It reds on
        the UNPLANTED tree too: `.rivet/repos` holds the seven federated sibling
        checkouts and is gitignored, so it is absent from every fresh worktree —
        FAIL with forty errors and `cross-refs NOT CHECKED — externals failed to
        load`, against PASS in the main checkout. The red carried no information
        about the plant. Only once the externals were made visible did that row
        become a measurement.

        BOTH EDGES OF THE WINDOW ARE REAL, which is why the remedy is a reachable
        window rather than an earlier call. Asked with the tag of the release
        being cut the gate TRACEBACKS — an unhandled CalledProcessError from a
        remote commit lookup, not a diagnostic. Asked with no window argument at
        all it refuses at argparse. And asked in any of its four existing modes on
        the honest plan-time tree it reds on VACUOUS AUTHORISED SET, the
        legitimate state of a planning PR — so wiring any mode as it stood would
        have red every planning PR, the trap this repository has already measured
        once and declined to build.

        THE REMEDY WOULD HAVE BEEN INERT WHERE IT RUNS. Before the third flag
        existed, the CI invocation was measured with only `gh`'s auth broken and
        the plant still over a CLOSED issue (#1183). It exited ZERO and never printed the
        finding: the live-state read returns None, the held-open direction falls
        back to the WINDOW, and an empty window flags nothing. The script is LOUD
        about it — the notice prints — but loud is not blocking, and a step reading
        the exit code would have been green on exactly the falsehood it was added
        to catch. `--require-state` makes that exit 2, reusing the script's own
        "the gate could not run" convention, and the step grep-pins the state
        read's own population so a future edit dropping the flag cannot read as a
        pass.

        A BROKEN CONTROL ON THE WAY THERE, recorded because it nearly read as the
        finding: the first attempt broke the state read with a temporary HOME and
        died on a missing `yaml` module — user site-packages live under HOME, so it
        measured a broken interpreter rather than a broken state read, and its
        silence would have read as blindness. A sanity probe showing `gh issue
        list` asking for `gh auth login` is what established that the intended
        thing, and only it, was broken.

        POTENCY, EXECUTED NOT CLAIMED. Both halves of each new self-test case are
        asserted, and two mutants were run against the shipped gate: making the
        downgrade flag a NO-OP reds the "vacuity is a warning with the flag" case,
        and making it ALSO swallow the held-open direction reds the
        "held-open-over-closed still fails" case. Each mutant reds the case that
        names it, and the gate was restored byte-identically after each. The
        mutant harness itself needed three repairs first — a detector matching the
        word FAILURE inside a test's own LABEL rather than the verdict token, an
        anchor typed from memory that matched nothing, and a regex requiring two
        spaces after the verdict where the source prints ONE after FAIL and three
        after ok, so it was blind to precisely the verdict it was hunting and
        reported a potent mutant as inert.

        THE CI VERDICT, written after the measurement and not before it. The step
        REFUSED twice on exit 2 before it went green, which is the guard doing its
        job — visibly broken rather than falsely green. The first refusal said only
        that state was unavailable; the correction that made it print a reason is
        what diagnosed it, in one line: `FileNotFoundError: [Errno 2] No such file
        or directory: 'gh'`. **The `gh` binary is ABSENT from the self-hosted pool
        where `claim-check` runs.** Not a permission problem, not a token problem,
        not GraphQL versus REST — and the hypothesis that it WAS a permission
        problem came from this release's own theme, which is what the theme warns
        about.

        THAT ALSO CONDEMNED THE FIRST FIX. A `gh api` "second surface" added beside
        `gh issue list` is not a second surface: both shell out to the same missing
        binary, so the fallback shared the primary's single point of failure and
        the agreement self-test compared two dead paths. A fallback that shares the
        failure mode is worse than none, because it reads like redundancy. And the
        repository already knew — `stale_pin_check.py`, in the SAME job, documents
        "NOT `gh` first: it is absent from the self-hosted pool where this runs",
        RQ-72-CIPOOL measured it, and the pool tripwire's degradation message
        lists "no gh" FIRST, a line this lane had already read and passed over.

        CORRECTED AND MEASURED GREEN: `_open_issues_api` over `urllib` against
        `api.github.com` is the PRIMARY and `gh` the local fallback — the order
        the sibling gate uses for the same reason. The CI log reads
        `issue-closure-state-source: REST api.github.com (1 page(s), no gh binary
        needed)`, `issue-closure-state: 60 open issue(s) read`, and
        `issue-closure: v0.87 — 1 authorised, 0 held open, 0 closed, 0 failures`,
        with the step's `[1-9][0-9]*` pin satisfied. In a CI-shaped local
        environment the paired arms hold: a token with no `gh` on PATH exits 0 via
        REST; neither token nor `gh` still FAILS CLOSED at exit 2 with the reason
        printed.

        THE SELF-TEST POPULATION, split by venue rather than quoted as one number:
        NINE `closewindow` cases run locally and ZERO skip. In CI SEVEN run and the
        API-surface agreement pair SKIPS — `SKIP closewindow: API-surface
        agreement — rest=60, gh=None` — because that case needs BOTH a token and
        the binary. So it is exercised locally and is NOT CI potency evidence,
        which the step's own comment says. Its SKIP line names `gh=None`, the
        absent binary attesting to itself a third time.

        RESIDUALS, stated rather than left to be found. The CI invocation runs the
        HELD-OPEN direction only (`--closed ''`): with a window, the
        closed-but-not-authorised direction would run on every PR, so an unrelated
        issue closed mid-release would red every open PR for something its diff
        did not do. Both directions still run at the tag. And `gh issue list`
        enumerates ISSUES, so an artifact whose `issue:` field names a PULL
        REQUEST — this artifact's own #1478 is one, a merged PR rather than an
        issue — can never appear in the open set, leaving the authorised-but-open
        direction structurally silent for it. Neither is closed by this lane.
      done-when: >
        manual:2027-03-31 a record cannot declare an already-closed issue held open
        without a gate reading it — delivered with measured numbers, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST and its
        result reported either way
