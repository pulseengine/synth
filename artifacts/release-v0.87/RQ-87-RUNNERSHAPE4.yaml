artifacts:
  - id: RQ-87-RUNNERSHAPE4
    type: system-req
    release: v0.87
    status: implemented
    title: "The no-show and cancel states are distinguishable, or the non-derivability is pinned"
    description: >
        Detection is covered; the no-show/cancel SPLIT remains non-derivable from the
        job object.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: Sample a window; if any field
        combination separates a no-show from an ordinary queued job, the split is
        derivable after all.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1451"
      verification-track: manual
      issue-scope: outlives
      landed: "PR #1548 - #1451 - DELIVERED AS A REFUTATION OF THIS LANE OWN FIRST ATTEMPT, which concluded non-derivable, PINNED and should not have. THREE THINGS WERE WRONG WITH IT, each found by re-measuring rather than re-reading. ONE, THE SAMPLE NUMBERS WERE WRONG: the helper returned None on failure and the caller turned that into an EMPTY JOB LIST, so two passes over IMMUTABLE data disagreed, 49 unserved then 41 - the tell. HTTP 502 on that endpoint was then observed live. Re-measured in one pass with retries and a raise on exhaustion: SIXTY-EIGHT cancelled jobs, SIXTY-SEVEN unserved, per-run 18/9/5/18/18 which SUMS to its own total, the consistency check the first numbers failed. TWO, A CANDIDATE SEPARATOR WAS MEASURED AND THEN LEFT OUT OF THE FIELD SET: the job own SPAN, completed minus started, was computed in the very first probe and never carried into the comparison. Every cancelled-unserved job measured spans 1246 to 14421 seconds while the no-show this repository has on record is described in ci.yml as 600s - BELOW the entire observed range of both other populations. The original conclusion was reached with the one field most likely to carry the answer excluded. THREE, THE COMPARISON HAS A THIRD ARM NOBODY COUNTED: hunting a real no-show across 52 readable runs of 60 listed, with one api failure recorded so the population states its own incompleteness, found FOUR cancelled-and-unstarted jobs inside runs concluding FAILURE - a fail-fast cascade, neither a no-show nor a superseded-run cancel, and TWO of them LONE, which per v0.85 own straggler finding means lone-ness does not identify a no-show either. A two-way framing cannot be completed when there are at least THREE causes and the question names two. AND THE NO-SHOW ARM WAS NEVER MEASURED AT ALL: the first attempt NO_SHOW fixture was HAND-TYPED FROM PROSE while its docstring claimed it was captured from the live API, which was false. No real no-show job object was obtainable in this window. So the verdict is NOT ESTABLISHED rather than pinned or refuted. WHAT IS SETTLED is the one thing the refuting command literally asked: a no-show IS separable from an ORDINARY QUEUED job by status and conclusion alone, that half is REFUTED, and it is retained as the positive control. Two measuring traps are asserted rather than described: runner_name is the EMPTY STRING on all 67, not null, and the started_at predicate is a TOLERANCE on which 62 of 67 collide where exact equality wrongly showed a separator."
      verified-by: >
        NOT ESTABLISHED, and that verdict is a REFUTATION OF THIS LANE OWN FIRST ATTEMPT
        rather than an absence of work. The first attempt concluded "non-derivable, PINNED".
        It was wrong in three ways and the no-show arm was never measured at all; all four
        facts are recorded because a pin that asserts the wrong verdict confidently is worse
        than no pin.

        ONE — THE SAMPLE NUMBERS WERE WRONG, by a mechanism this repository already has a
        memory about. The first passes used a helper returning None on failure and a caller
        doing `(api(...) or {}).get("jobs", [])`, so a failed page became an EMPTY JOB LIST
        silently. The tell was that two passes over IMMUTABLE data disagreed — FORTY-NINE
        unserved, then FORTY-ONE. HTTP 502 was subsequently observed live on that very
        endpoint. Re-measured in ONE pass, with retries and a raise once they are exhausted:
        SIXTY-EIGHT cancelled jobs and SIXTY-SEVEN unserved, with per-run counts of
        eighteen, nine, five, eighteen and eighteen that SUM to the stated total — the
        internal consistency check the original numbers could not have passed, and which the
        shipped self-test now asserts.

        TWO — A CANDIDATE SEPARATOR WAS MEASURED AND THEN LEFT OUT OF THE FIELD SET. The
        job own SPAN, completed_at minus started_at, was computed in the very first probe of
        this lane and never carried into the comparison. Every cancelled-unserved job
        measured here spans between 1246 and 14421 seconds, while the no-show this
        repository has on record is described in ci.yml as "600s, zero steps" — BELOW the
        entire observed range of both other populations. So the original conclusion was
        reached with the one field most likely to carry the answer excluded from
        consideration, and the shipped field set now contains it.

        THREE — THE COMPARISON HAS A THIRD ARM NOBODY COUNTED. Hunting a real no-show across
        FIFTY-TWO readable runs out of SIXTY listed — with ONE api failure recorded so the
        population declares its own incompleteness rather than passing as whole — found FOUR
        cancelled-and-unstarted jobs inside runs whose conclusion is FAILURE. That is a
        FAIL-FAST CASCADE: neither a no-show nor a superseded-run cancel, and a third cause
        the question as posed does not name. TWO of the four are LONE in their run, which
        matters because v0.85 own record already measured that a cancel wave teardown is NOT
        atomic and that an exact-equality classifier reports the straggler as a lone
        no-show. So lone-ness does not identify a no-show either, and the first attempt
        listed it as one of the separators that do exist.

        AND THE ARM THE QUESTION TURNS ON WAS NEVER MEASURED. The first attempt NO_SHOW
        fixture was HAND-TYPED FROM PROSE, and its docstring said it was "captured from the
        live API" — which was false, and is the kind of claim that makes a self-test
        unfalsifiable against reality. No real no-show job object was obtainable in this
        window. With one arm absent, the split is NOT ESTABLISHED: not pinned, and not
        refuted either.

        WHAT IS GENUINELY SETTLED is exactly what the refuting command literally asked. A
        no-show IS separable from an ORDINARY QUEUED job, and trivially: a queued job reads
        `queued` and null while any cancelled job reads `completed` and `cancelled`. That
        half is REFUTED, measured against a live arm — PR #1543 Clippy job while the
        self-hosted rust-cpu pool was starved, all seven rust-cpu runners busy and the idle
        runners carrying only lean-mem or light labels, so they structurally could not serve
        it. It is retained as the POSITIVE CONTROL, because an instrument that cannot see
        the separation that does exist has no standing to report on one that may not.

        TWO MEASURING TRAPS ARE ASSERTED IN THE SELF-TEST rather than described, because
        either would manufacture a separator that is not there. An unserved job runner_name
        is the EMPTY STRING and not null — all sixty-seven carry it — so a collision test
        spelled `runner_name is None` reports a DIFFERENCE between jobs identical in that
        field. And the started_at predicate is a TOLERANCE, "within a second of run
        creation": tested as exact equality it reported a separator, and measured as the
        tolerance it actually is, SIXTY-TWO of SIXTY-SEVEN collide.

        WHAT THE NEXT PASS NEEDS, stated so it is not rediscovered: a real no-show job
        object, with its SPAN, from the 2026-09-02 light-pool incident or any later
        occurrence. CI gates the self-test, not the report, which is a window sample.
      done-when: >
        manual:2027-03-31 the no-show and cancel states are distinguishable, or the non-
        derivability is pinned — delivered with measured numbers, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST and its
        result reported either way
