        uncovered subject now reds, the sweep's own population moved.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1515"
      verification-track: manual
      issue-scope: outlives
      landed: "PR #1547 - #1515 - DELIVERED AS A REFUTATION PLUS A DERIVED CLASSIFICATION. The refuting command ran FIRST - leave-one-out again - and the population moved further than this record bound allows: the EIGHT becomes SEVENTEEN on its own nine hand-listed files and FORTY-SEVEN on the derived thirteen, so the eight does not hold on the population it was taken over, and the attached six-one-two classification describes a set of eight and cannot describe forty-seven. The 47 are classified by a DERIVED signal rather than forty-seven hand-written reasons: whether the self-test body NAMES the function, stated as a PROXY because a function reached indirectly reads as unnamed - SEVEN named and coverable in principle, FORTY outside the self-test reach, and the partition sums. AND UNDETECTED MEANS PER-FILE, measured not asserted: with a VALID baseline of both self-tests at rc=0, neutralising merge_gate gate and main is UNDETECTED by merge_gate own self-test and DETECTED by test_merge_gate_callsite.py in both cases, reproducing exactly what that sibling own docstring records about ten mutations. So at least two of the seven are demonstrably covered by a different file, and the 47 counts per-file non-detection rather than repository-wide uncovered subjects. A CONTAMINATED FIRST ATTEMPT IS WITHDRAWN: it passed a stripped environment, merge_gate self-test shells out to git and reds at rc=1 under it, so both arms were noise and one would have published a false venue-sensitive finding - proven by a paired control in the SAME checkout at rc=1 stripped against rc=0 full, plus six further runs all rc=0."
      verified-by: >
        DELIVERED AS A REFUTATION PLUS A DERIVED CLASSIFICATION — the stated
        figure does not reproduce, and what replaces it is a partition rather
        than a list of hand-written reasons.

        THE REFUTING COMMAND RAN FIRST. Its own test is "if a previously-uncovered
        subject now reds, the sweep's own population moved". It moved, and further
        than this record's bound allows: EIGHT becomes SEVENTEEN on its own nine
        hand-listed files, and FORTY-SEVEN on the derived thirteen. So the eight
        does not hold on the population it was taken over — and the classification
        attached to it, six crossing a process boundary plus one pure fixture
        branch plus two genuinely coverable, describes a set of eight and cannot
        describe forty-seven.

        THE FORTY-SEVEN, CLASSIFIED BY A DERIVED SIGNAL. Hand-writing forty-seven
        reasons would be the mirror this programme's North Star names first. The
        derived question is whether a subject is reachable from its own self-test
        at all, and the signal is whether that self-test's body NAMES the
        function. It is stated as a PROXY, because a function reached only
        indirectly reads as unnamed: SEVEN named and therefore coverable in
        principle, FORTY outside the self-test's reach, and 7 + 40 = 47 so the
        partition sums rather than being two numbers printed together. Twenty of
        the forty unnamed are a single file.

        AND "UNDETECTED" MEANS PER-FILE — measured, not asserted. The sweep asks
        whether THIS file's own `--self-test` notices, never whether anything in
        the repository notices. Measured on the two subjects where the repository
        already documents the answer, with a VALID baseline of both self-tests at
        rc=0 unmutated: neutralising `merge_gate.gate` and `merge_gate.main` is
        UNDETECTED by merge_gate's own self-test and DETECTED by
        `test_merge_gate_callsite.py`, in BOTH cases. That reproduces exactly what
        the sibling's own docstring records — ten mutations to `gate()` and
        `main()`, all ten passing `--self-test`. So at least two of the seven
        "real gaps" are demonstrably covered, by a different file, and the
        forty-seven counts per-file non-detection rather than repository-wide
        uncovered subjects. This record's done-when should be read against that
        distinction.

        A CONTAMINATED MEASUREMENT, WITHDRAWN RATHER THAN REINTERPRETED. The first
        run of that sibling probe passed a STRIPPED environment. `merge_gate.py
        --self-test` shells out to git and reds at rc=1 UNMUTATED under it, so
        both arms were noise — and one of them read in a way that would have
        published a false "venue-sensitive self-test" finding. Proven by a paired
        control in the SAME checkout: stripped rc=1, full rc=0; plus six further
        runs, three in the main checkout and three in a fresh detached worktree,
        all rc=0. Neither flaky nor venue-sensitive; the stripped env was the whole
        cause. The measurement above is the redone one, with the full environment
        inherited and a baseline check that REFUSES to read the arms at all if
        either self-test is non-zero unmutated.

        A stripped environment is a broken control for any script that shells out
        to git. That is the third environment self-contamination of this release,
        after a temporary HOME broke Python's import path.

        RESIDUAL: the done-when asks that every subject be covered or its
        non-coverage stated with a reason. What is delivered is the DERIVED
        partition plus the per-file caveat, not forty-seven individual reasons —
        and the seven NAMED subjects are the actionable remainder, of which two
        are already covered elsewhere. Five remain genuinely unexamined.
      done-when: >
        manual:2027-03-31 every self-test subject is covered, or its non-coverage is
        stated with a reason — delivered with measured numbers, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST and its
        result reported either way
