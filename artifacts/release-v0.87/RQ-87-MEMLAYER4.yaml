artifacts:
  - id: RQ-87-MEMLAYER4
    type: system-req
    release: v0.87
    status: implemented
    title: "The multi-memory layering is scoped to the widths the reporter actually uses"
    description: >
        The layering is the whole remaining blocker (sizing shipped in v0.83), and its
        phase-one reach is the i32 access family ONLY — so lifting the two refusals
        moves the blocker for any other width.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: Re-read the downstream answer with
        `git grep -n "static_data_addend" -- artifacts/`; then measure which WIDTHS the
        reporter's memory-k accesses actually use before costing the lift.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1145"
      verification-track: manual
      issue-scope: outlives
      landed: "PR #1546 - #1145 - DELIVERED, and the lane premise is HALF-REFUTED by its own measurement. THE REFUTING COMMAND, run first, both halves. Half one, the downstream answer: git grep for static_data_addend over artifacts/ returned FOUR hits across THREE files before this record was written (this record's own text adds more), but only ONE is substantive - release-v0.84 line 58, the actual downstream answer - and the rest are lanes QUOTING THE COMMAND ITSELF, including this artifact. v0.86 recorded TWO hits; the growth since is pure self-citation, so a census whose needle is a command text counts its own callers. Half two, the widths: the reporter entire #1145 thread AND the fixture adopted verbatim from their kill criterion exercise exactly i32.load8_u twice and i32.store8 once, and NOTHING ELSE - zero non-i32 accesses. Phase one reach, derived from the selector MultiMemory arm, is EIGHT ops: five loads including the two sign-extending ones and three stores. The reporter widths are a strict SUBSET, so the WIDTH refusal never reaches them and costing a width lift would spend effort on input they never exercise. THE TWO REFUSALS ARE NOT SYMMETRIC, which is the scoping conclusion: --safety-bounds software or mask declines ANY memory-k access REGARDLESS of width, because the guard compares against R10, which holds MEMORY ZERO size by the register contract, and memory k has no size register at all. It is width-independent, so for that refusal the lift to cost is a per-memory size source, not width coverage. It is NOT the reporter whole remaining blocker: their latest comment (2026-10-06) compiles without --safety-bounds and names the --native-pointer-abi memory-0-only refusal, the static-data region having no per-memory layering, and gale isolation path is --safety-bounds mpu --embedder-mpu, which is accepted. Grounded in EXECUTION: the pinned repro compiles this fixture on the plain --relocatable path at a version-matched binary and records software/mask loud-skipping memory 1 and the cross-tenant write landing. Both negative controls EXECUTED against mutated copies; one fired by RAISING rather than over-reading, and the instrument records that mechanism rather than the one it was written to expect."
      verified-by: >
        DELIVERED, with the refuting command run FIRST in both halves, and the lane own
        premise HALF-REFUTED by the measurement it asked for.

        HALF ONE, THE DOWNSTREAM ANSWER, re-read rather than assumed. Before this
        record was written the grep returned FOUR hits across THREE files (this record's
        own text adds more), and only ONE of them is a substantive answer -
        release-v0.84 line 58, which names the selector own accessor. The rest
        are lanes QUOTING THE REFUTING COMMAND, this artifact among them. v0.86 recorded
        TWO hits for the same command, so every increment since has been SELF-CITATION:
        a census whose needle is a command text counts its own callers, and the count
        will keep rising for as long as the lane is carried. The substantive answer has
        not moved.

        HALF TWO, THE WIDTHS, and this is where the premise breaks. The premise was that
        phase one reaching the i32 access family ONLY leaves the blocker standing for
        any other width. Measured: the reporter entire #1145 thread, and the two-tenant
        fixture adopted VERBATIM from their own kill criterion, exercise i32.load8_u
        twice and i32.store8 once and nothing else. ZERO non-i32 accesses anywhere.
        Phase one reach, DERIVED from the selector MultiMemory arm rather than copied
        from it, is EIGHT ops - five loads, including the two sign-extending ones no
        fixture exercises, and three stores. The reporter widths are a strict SUBSET of
        it, with SIX ops of reach they never use. So the WIDTH refusal does not bite
        this reporter at all, and costing a width lift would spend the release effort on
        input nobody in this thread has ever compiled.

        TWO OBJECTIONS TO THE ABOVE, BOTH MEASURED RATHER THAN WAVED OFF. First, is the
        fixture simply too small — does the reporter REAL workload use a width it omits?
        Their actual kernel is available locally at
        .rivet/repos/gale/benches/gust/wasm-kernel/fused.wasm, and a walk of its section
        table shows it declares exactly ONE memory. A single-memory module has no memory-k
        access at any width, so it contributes nothing to this census and cannot be a
        counter-example. The two-tenant fixture is NOT the only multi-memory evidence for
        this reporter: the thread names gale's run-two-tenant.sh module (full-width
        i32.load and i32.store, both inside phase-one reach) and a --domain fused module
        with two memories (comment of 2026-10-06). Second, is "the two refusals" even the pair analysed
        here? It is read off the SOURCE rather than inferred: the selector own phase-1
        comment names exactly two, the non-i32 widths and --safety-bounds on memory k. The
        configuration refusals in multi_memory_pages, non-relocatable and native-pointer
        ABI, are a different pair and are not what a claim about WIDTH can be about.

        THE TWO REFUSALS ARE NOT SYMMETRIC, and that asymmetry is the scoping answer
        the artifact asked for. The WIDTH refusal declines i64, f32, f64 and v128 on
        memory k. The BOUNDS refusal declines --safety-bounds software or mask for ANY
        memory-k access REGARDLESS OF WIDTH, and its root cause has nothing to do with
        width: the software guard compares against R10 and mask derives size-minus-one
        from R10, both MEMORY ZERO size by the register contract, and memory k has no
        size register for a guard to read. That refusal is NOT the reporter whole
        remaining blocker: their 2026-10-06 comment names the --native-pointer-abi
        memory-0-only refusal instead. FOR THE SOFTWARE/MASK REFUSAL THE LIFT TO COST IS
        A PER-MEMORY SIZE SOURCE, not width coverage - and a lane that had scoped width work would have shipped reach the
        reporter cannot use while leaving the thing blocking them untouched.

        GROUNDED IN EXECUTION, not in reading the arm. The pinned repro was run at a
        version-matched binary, with no crate source newer than the binary: the fixture
        compiles on the plain --relocatable path today, software and mask loud-skip
        memory 1, mpu refuses while mpu with --embedder-mpu is accepted byte-identically,
        and tenant A write LANDS in tenant B memory with no fault - the outcome the
        reporter criterion names.

        BOTH SIDES OF THE SHIPPED PIN ARE DERIVED, which is the first invariant: the
        reporter widths are parsed from the committed fixture and phase one reach out of
        the selector own match arm, so neither is a hand-written mirror. Moving the
        fixture moves the number; narrowing the selector does NOT always move it,
        because the pattern also matches the arm's inner mapping lines, so removing
        I32Load8U from the dispatch pattern leaves the family at eight and the
        self-test green. BOTH NEGATIVE CONTROLS WERE EXECUTED against mutated copies,
        the real files untouched. Growing the fixture an i64.load breaks the subset pin
        as intended. Removing the selector `other` cut does NOT make the family slice
        over-read - it RAISES, so the derivation fails closed and the self-test ERRORS
        rather than FAILS. Both red CI, so the gate is potent either way, but the written
        claim was about a mechanism that is not the one that fires, and the instrument now
        records the measured one. An unexecuted control would have shipped the wrong
        claim about its own potency.
      done-when: >
        manual:2027-03-31 the multi-memory layering is scoped to the widths the reporter
        actually uses — delivered with measured numbers, or REFUTED with the measurement
        that refutes it; and the refuting command above is RUN FIRST and its result
        reported either way
