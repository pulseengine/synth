        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1236"
      done-when: "manual: varve.toml resolves against the rotated realm from the PUBLISHED realms asset (not a pasted key), `varve install` verifies signatures and digests, `varve which` reports a layer for the loop's tools, and the layer identity is recorded with the release; or the step is declared UNPINNED with the reason"
      verified-by: >-
        Layer 2026.09.2, manifest digest
        sha256:67d585476be898dcd6c7f0e31fb8abe9c6548f708b3cb44804ad61cc5d999025,
        realm `pulseengine`, registry `oci://ghcr.io/pulseengine/layers`,
        trust-root `7d3b892e…da1a0`. `varve-realms.toml` is byte-identical to
        the asset in the pulseengine/varve v0.33.0 release (diffed). `varve
        install` + `varve verify` both run clean (signature OK, 12/12 tools
        match signed digests) against the checked-in pin from the repo root
        under the v0.33.0 client. Negative control run: a shim installed into
        an isolated `VARVE_ROOT` and invoked from a directory with no
        `varve.toml` anywhere up its ancestry refuses —
        "no varve.toml found walking up from ... this project has no pinned
        layer" — exit 1, confirmed still true after the rotation. `varve
        which`/`varve verify` confirm the PATH-shadowing refusal
        (REQ-SHADOW-001) still fires on this machine post-rotation (loom,
        meld, rivet, spar, synth all shadowed, wider drift than
        pre-rotation). CI: the advisory `rivet-federated` job in
        `.github/workflows/ci.yml` now installs varve v0.33.0, runs `varve
        install`/`varve verify`, and dispatches rivet via `varve run` instead
        of a hand-typed `cargo install --git --tag`; local dry-run under the
        resulting rivet 0.35.0 reproduces the required job's own pass
        conditions (0 non-cross-repo errors, 551≥526 artifacts) and a full
        federated sync+validate (1032 cross-repo backlinks, PASS). REAL CI,
        measured (run 34381378564, job 102566804680, first attempt): ghcr.io
        IS reachable from the self-hosted `rust-cpu` fleet (`varve install`
        fetched layer 2026.09.2 cleanly) and `varve verify` caught a REAL
        cross-job shadow — `rivet` on that runner's PATH resolves to the
        required job's own `~/.cargo/bin/rivet`, not the pin (REQ-SHADOW-001,
        exact verbatim error in the PR). The job went red from a genuine bug
        in this PR's own YAML (`varve run rivet -- sync` — wrong `--`
        position per `varve run --help`; fixed to `varve run -- rivet sync`)
        plus a related `if:` condition bug on the new "Shadowing gate" step
        (missing `always()`, so it silently didn't run once a later step
        failed for an unrelated reason; fixed). Both fixes verified locally
        before a follow-up push. Expect the re-run to still be red — for the
        RIGHT reason this time (the real shadow REQ-SHADOW-001 found), which
        is the check working, not the conversion failing; final re-run
        result recorded in the PR thread. The required `rivet` job remains
        on its hand-typed `cargo install --git --tag v0.23.0` pin — NOT
        converted in this PR; UNPINNED w.r.t. varve, by choice, pending a
        team decision to move the merge-blocking gate's toolchain source.
