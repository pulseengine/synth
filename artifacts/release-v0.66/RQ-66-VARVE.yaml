artifacts:
  - id: RQ-66-VARVE
    type: system-req
    title: "The pulseengine rolling root rotated and the registry moved — the loop's step 0 is unverifiable until the pin is refreshed"
    description: >
      Filed as #1236 on 2026-09-09, the day v0.65 shipped.

      Step 0 of the feature loop is resolving the toolchain through **varve**, so
      that every artifact the loop produces is traceable to an exact, signed
      layer rather than to whatever happened to be on PATH. The realm's rolling
      channel is explicitly provisional and its root ROTATES at the v1.0
      ceremony — that rotation, plus a registry move, has now happened.

      WHY THIS IS NOT COSMETIC. The pin's value is entirely in its verifiability:
      `varve which <tool>` printing a layer and manifest digest is what makes
      "which toolchain produced this?" answerable later. A pin whose trust root
      no longer resolves is not a weaker pin, it is a claim with no checker
      behind it — the same shape as a ledger pin bound to the wrong layer
      (v0.65's `SYNTH-ARCH-LOUD-DECLINE`, green by construction) or a gate whose
      evidence cannot fail.

      THE HANDLING IS THE POINT AND IT IS WRITTEN DOWN ALREADY: take the realm
      definitions from the PUBLISHED ASSET rather than pasting a key
      (`gh release download --repo pulseengine/varve -p varve-realms.toml`), and
      prefer the realm over `VARVE_TRUST_ROOT` because the realm is
      authoritative and cannot be overridden by the ambient environment. **A
      refusal is the feature**: outside a pinned project a shim exits 1 rather
      than silently falling back to an ambient binary. Do not "fix" a refusal by
      bypassing varve — fix the pin.

      REPORT THE LAYER IDENTITY WITH THE RESULT. A release that says it ran
      pinned without stating which layer has asserted the thing it cannot show.
      If the new root or registry cannot be resolved at all, say so plainly and
      record the release as UNPINNED for that step rather than implying
      otherwise — an honest gap is a finding.

      RESOLUTION (PR against #1236, RQ-66-VARVE lane). Three additional things
      were measured beyond the nominal pin bump, because the pin bump alone was
      furniture:

      1. **Client-version floor.** The realm's rotated `varve-realms.toml`
         (published in the varve v0.33.0 release) adds a `retired-roots =`
         diagnostic field. varve 0.32.0 and earlier HARD-REFUSE it
         (`unknown field 'retired-roots'`) — measured directly. The v0.33.0
         client was installed additively (`install.sh`, cosign-verified
         SHA256SUMS, `~/.varve/bin`), leaving the ambient `~/.cargo/bin/varve`
         0.32.0 untouched as rollback. The floor is recorded in `varve.toml`
         itself (a comment on the pin, read every time someone edits it) and
         in this PR body.

      2. **`varve self-update` friction reproduced** exactly as briefed: run
         with the ambient 0.32.0 binary against a repo that already has
         `realm = "pulseengine"` in `varve.toml` and a valid `varve-realms.toml`
         beside it, it refuses and asks the caller to configure precisely what
         is already configured (`no trust root configured` /
         "add `realm = \"pulseengine\"` ..."). Filed upstream — see PR body /
         report for the issue URL.

      3. **The pin governed nothing before this PR, in either environment —
         confirmed, and worse than briefed in one respect.** Locally, `varve
         verify` (not a hand-written parser — this is varve's OWN
         REQ-SHADOW-001 check) exits 1: 5 of 12 dispatched tools (loom, meld,
         rivet, spar, synth) resolve to an ambient `~/.cargo/bin` copy instead
         of the pinned one. Measured drift on the rotated layer (2026.09.2) is
         WIDER than the pre-rotation baseline: loom ambient 0.1.0 vs pinned
         **1.4.1** (was 1.2.0), rivet ambient 0.32.0 vs pinned **0.35.0**. In
         CI, `varve` appeared in zero of `.github/workflows/*.yml` or the Bazel
         files — confirmed by grep — while `ci.yml` hand-installed rivet twice
         at two different tags (`v0.23.0` line ~727 required job, `v0.32.0`
         line ~955 advisory federated job). **The clearest demonstration of why
         this matters is spar, not rivet or loom**: the ambient
         `~/.cargo/bin/spar` (dated 2026-06-15, months stale) still exhibits
         the exact `--version`/`-V` failure pulseengine/spar#422 tracked
         (`Unknown command`, exit 1) — but that was already FIXED upstream in
         spar 0.36.0 (#419), and the varve-PINNED spar (0.40.0, from this
         rotation's layer) is fully compliant: `--version`/`-V`/bare `version`
         all print `spar 0.40.0` and exit 0, and an unknown command exits 2.
         Measuring the ambient copy alone would have produced a FALSE report
         of a long-fixed bug — the pin isn't just about drift, it is about
         which answer is even true.

      CI CONVERSION (one job, real, not a plan). Before touching CI, `varve
      install` (layer 2026.09.2, digest `sha256:67d585…999025`) was run against
      this repo, then rivet 0.35.0 from the resulting pinned core was run
      locally through the SAME filters the required `rivet` job applies
      (foreign-prefix exemption, artifact-load floor): non-cross-repo errors =
      0, artifacts loaded = 551 (floor 526) — and a full `rivet sync` +
      federated `rivet validate` passed clean (Cross-repo backlinks: 1032,
      matching the count recorded at #1012's authoring). The advisory
      `rivet-federated` job (chosen over the required `rivet` job precisely
      because it is advisory) was converted to install the varve client,
      `varve install` the pinned layer, run `varve verify` (a new
      "Shadowing gate" step turns the job red — non-blocking, since the job
      is advisory — if a dispatched tool is shadowed on the self-hosted
      runner's PATH, which is plausible given it is a PERSISTENT machine
      shared with the `rivet` job's own `~/.cargo/bin` install), and dispatch
      `rivet sync`/`rivet validate` via `varve run` rather than a hardcoded
      binary path. The required `rivet` job was deliberately left unconverted
      in this PR — the local dry-run above says it would likely pass, but
      changing the toolchain source for the gate that actually blocks merges
      is a bigger claim than one lane should make unilaterally; recorded here
      as a validated next step, not done.

      REAL CI RESULT, first attempt (run 34381378564, job 102566804680): RED,
      but the two most important steps for THIS artifact both PASSED —
      `varve install` fetched layer 2026.09.2 from `oci://ghcr.io/pulseengine/layers`
      cleanly (ghcr.io IS reachable from the self-hosted `rust-cpu` fleet —
      the open question this PR's CI comment named is answered), and `varve
      verify` found EXACTLY the hazard predicted: `rivet` on this runner's
      PATH resolves to `/var/lib/runners/runner9/.cargo/bin/rivet`, not the
      pinned copy — the required `rivet` job's `cargo install --force --git`
      (no `--root`, so it lands in the default cargo bin dir) leaking onto a
      shared self-hosted runner and shadowing the pin for a DIFFERENT job.
      REQ-SHADOW-001 (varve's own oracle, not a hand-written parser) caught a
      real, previously-invisible cross-job toolchain hazard on the first run
      it was wired into.

      What actually reddened the job was a bug in THIS PR's own workflow
      syntax, unrelated to varve or ghcr.io: `varve run rivet -- sync` is
      wrong argument order (`varve run`'s own `--help` says "tool and its
      arguments, after `--`", i.e. the `--` goes immediately after `run`,
      not between the tool name and its args) — rivet's clap parser then saw
      a literal `--` positional and refused `sync` with `unexpected argument
      'sync' found` / `tip: subcommand 'sync' exists; to use it, remove the
      '--' before it`. Fixed to `varve run -- rivet sync` /
      `varve run -- rivet validate`, verified locally (`rivet sync`: 7
      externals synced, exit 0) before pushing the fix. A second, related bug
      found and fixed in the same pass: the new "Shadowing gate" step's
      `if: steps.varve_verify.outcome == 'failure'` carries an IMPLICIT
      `success()` from Actions when no status-check function is present, so
      it never ran once `Sync externals` also failed — it reported `skipped`
      even though `varve verify` genuinely failed. Fixed to
      `if: always() && steps.varve_verify.outcome == 'failure'`.

      EXPECTED STATE AFTER THE FIX: the job should now reach `varve verify`,
      `Sync externals`, `Validate the federated graph` and the non-vacuity
      guard, all real functionality — and the new "Shadowing gate" should
      correctly turn the JOB red (non-blocking; advisory) because the
      cross-job rivet shadow is a REAL condition on this runner, not a false
      alarm. A red `rivet-federated` after this fix is the check WORKING,
      not the conversion failing — see the PR for the actual re-run result,
      recorded there rather than predicted here.

      The layer carries **synth 0.61.0**; this repo ships 0.65.0 (moving to
      0.66 this release) — the layer is behind its own consumer, so the next
      `pulseengine-layers` deposit should bump it. Stated, not fixed here.
    status: implemented
    release: v0.66
    tags:
      - toolchain
      - varve
      - provenance
      - feature-loop
    links:
