    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1236"
      done-when: "manual: varve.toml resolves against the rotated realm from the PUBLISHED realms asset (not a pasted key), `varve install` verifies signatures and digests, `varve which` reports a layer for the loop's tools, and the layer identity is recorded with the release; or the step is declared UNPINNED with the reason"
      verified-by: >-
        Layer 2026.09.2, manifest digest
        sha256:67d585476be898dcd6c7f0e31fb8abe9c6548f708b3cb44804ad61cc5d999025,
        realm `pulseengine`, registry `oci://ghcr.io/pulseengine/layers`,
        trust-root `7d3b892e…da1a0`. `varve-realms.toml` is byte-identical to
        the asset in the pulseengine/varve v0.33.0 release (diffed). `varve
        install` + `varve verify` both run clean (signature OK, 12/12 tools
        match signed digests) against the checked-in pin from the repo root
        under the v0.33.0 client. Negative control run: a shim installed into
        an isolated `VARVE_ROOT` and invoked from a directory with no
        `varve.toml` anywhere up its ancestry refuses —
        "no varve.toml found walking up from ... this project has no pinned
        layer" — exit 1, confirmed still true after the rotation. `varve
        which`/`varve verify` confirm the PATH-shadowing refusal
        (REQ-SHADOW-001) still fires on this machine post-rotation (loom,
        meld, rivet, spar, synth all shadowed, wider drift than
        pre-rotation). CI: the advisory `rivet-federated` job in
        `.github/workflows/ci.yml` now installs varve v0.33.0, runs `varve
        install`/`varve verify`, and dispatches rivet via `varve run` instead
        of a hand-typed `cargo install --git --tag`; local dry-run under the
        resulting rivet 0.35.0 reproduces the required job's own pass
        conditions (0 non-cross-repo errors, 551≥526 artifacts) and a full
        federated sync+validate (1032 cross-repo backlinks, PASS). REAL CI,
        measured (run 34381378564, job 102566804680, first attempt): ghcr.io
        IS reachable from the self-hosted `rust-cpu` fleet (`varve install`
        fetched layer 2026.09.2 cleanly) and `varve verify` caught a REAL
        cross-job shadow — `rivet` on that runner's PATH resolves to the
        required job's own `~/.cargo/bin/rivet`, not the pin (REQ-SHADOW-001,
        exact verbatim error in the PR). The job went red from a genuine bug
        in this PR's own YAML (`varve run rivet -- sync` — wrong `--`
        position per `varve run --help`; fixed to `varve run -- rivet sync`)
        plus a related `if:` condition bug on the new "Shadowing gate" step
        (missing `always()`, so it silently didn't run once a later step
        failed for an unrelated reason; fixed). Both fixes verified locally,
        then pushed. RE-RUN, MEASURED (run 34381956416, job 102568731138,
        current head, landed on a DIFFERENT runner `pulseengine-ci-01-12`):
        `varve install`, `Sync externals` (7 externals), `Validate the
        federated graph` (PASS, 381 warnings) and the non-vacuity guard
        (Cross-repo backlinks: 1032) ALL PASSED. Job still RED because the
        Shadowing gate correctly fired — the SAME shadow class on this
        second runner too (`rivet` -> `runner12`'s `~/.cargo/bin/rivet`).
        Two runners sampled, same hazard on both; not claiming fleet-wide.
        Baseline: the pre-PR job was green on `main` only because it never
        checked PATH (dispatched its own privately-rooted binary) — this red
        is a new, previously-invisible signal, not a regression; `varve run`
        bypasses PATH so this job's own dispatch was never at risk. The
        required `rivet` job remains on its hand-typed
        `cargo install --git --tag v0.23.0` pin — NOT converted in this PR;
        UNPINNED w.r.t. varve, by choice, pending a team decision to move
        the merge-blocking gate's toolchain source. A natural follow-up
        (not done here): give that job's `cargo install` a `--root` so it
        stops leaking into the shared runners' default cargo bin dir.
        POST-REVIEW CORRECTION: the hard-fail "Shadowing gate" was replaced
        with a KNOWN-OPEN pin (`scripts/check_varve_shadow_pins.py`,
        `KNOWN_OPEN = {"rivet": (issue, note, path_pattern)}`, scoped to
        tool name AND ambient-path shape, not name alone) after the
        coordinator correctly flagged that a hard fail on this real,
        not-fixable-here hazard would leave the job red forever, violating
        this release's own "watched, fixed, or deleted" rule. Both real CI
        runs above now replay GREEN against the pin (14 unit tests,
        `scripts/test_check_varve_shadow_pins.py`, using the real captured
        output from both runs plus a real clean run and a real 5-tool local
        shadow run). That test suite is wired as a step in the REQUIRED
        `claim-check` job — so the corrected answer to "which required
        context is affected" is **Claim Check**, not none. NOT wired into
        `known_open_pins` (RQ-66-PINDEBT): PR #1242 is confirmed OPEN, not
        merged, not an ancestor of this branch's base — the coordinator's
        "currently 104, has just landed" does not hold here; noted as a
        one-line follow-up once #1242 merges.

        LIVE CONFIRMATION (run 34384697392, job 102577926865, current head
        910a06cb): landed on a THIRD distinct runner, `pulseengine-ci-01-11`.
        `varve verify` found the SAME known hazard again
        (`rivet` -> `/var/lib/runners/runner11/.cargo/bin/rivet`) — three
        different runners now, same mechanism, strengthening rather than
        weakening the case that this is fleet-wide, not a one-off. The
        Shadowing gate step's own output: "varve shadow pins: 1 known-open
        (rivet), all present at their pinned path shape, no new or
        different hazard." Every step in the job, INCLUDING the Shadowing
        gate, reports `success` — the job's overall conclusion is
        **SUCCESS**. `Claim Check` also passed on the same commit, with the
        new `test_check_varve_shadow_pins.py` step included. The known-open
        pin design is confirmed working end-to-end in real CI, not just
        locally.

        SECOND CORRECTION (post-rebase onto main 499c3895, which now
        carries RQ-66-PINDEBT #1242): the coordinator reported the
        Shadowing gate RED again on a fresh run and correctly suspected the
        pin's SHAPE, not a regression. Confirmed: run 34395957454, job
        102615600973, a FOURTH distinct runner (`pulseengine-ci-01-6`),
        same commit, same pin — `varve verify` came back COMPLETELY CLEAN
        (`layer 2026.09.2 ... verified: signature OK, 12 tool(s) match
        their signed digests`, zero `REQ-SHADOW-001` lines). The exact-match
        design (green iff the shadow set == the pinned set, red if a pinned
        tool ever goes unobserved) was WRONG for this hazard: the
        observable is RUNNER STATE (whether that specific shared,
        persistent machine has run the required `rivet` job's cargo
        install before), not a repo property, so gating on presence/absence
        made the check FLAKY — green or red depending on which of the
        fleet's machines happened to pick up the job. A flaky gate is worse
        than either a clean green or an honest red: it is exactly how a
        real regression gets waved through as "just the runner again."

        REDESIGNED (third cut): `scripts/check_varve_shadow_pins.py` now
        REPORTS the already-known (tool, path) observation every run,
        present or absent, and GATES only on genuinely new information a
        runner-state story cannot explain — a shadowed tool not in
        KNOWN_OPEN at all, or the known tool shadowed via a path that does
        NOT match its pinned shape. All four real captured runs (three
        shadowed — runner9, runner12, runner11 — one clean — runner6) now
        replay green; 17 unit tests (`scripts/test_check_varve_shadow_pins.py`).

        Also checked, as asked: whether `KNOWN_OPEN` in this file needed
        registering under claims.yaml's now-landed `known_open_pins`
        ratchet. Verified directly rather than assumed — `python3
        scripts/claim_check.py claims.yaml` (65/65 hold) and `--metric`
        (`known_open_pins 104 104 +0`) are BOTH unaffected by this file's
        presence, because the population tripwire's glob
        (`scripts/repro/**/*.py`) does not reach `scripts/check_varve_shadow_pins.py`
        at all — it lives directly under `scripts/`. Beyond the glob
        technicality, the conceptual case against registering it is
        stronger: `known_open_pins`'s population is REPRODUCIBLE CODE
        DEFECTS (a given WASM shape produces the same wrong bytes on every
        run, everywhere) — the varve-shadow hazard is a THIRD kind again,
        non-deterministic SHARED-INFRASTRUCTURE state, and belongs in that
        ratchet no more than a flaky network timeout would (the ratchet's
        own claims.yaml comment already excludes loud-decline pins and
        ci.yml floors as different kinds of thing). Not wired in, by
        reasoned choice, not oversight.
