artifacts:
  - id: RQ-72-ISSUEGATE
    type: system-req
    title: "v0.71 built a closure gate, proved every rule fires, and never wired it to anything — the gate nobody asks"
    description: >
      RQ-71-ISSUESCOPE shipped `scripts/issue_closure_check.py`. Its rules were
      proven to fire by mutation — nine planted defects, eight killed — and it
      replays v0.70's real five-issue closure correctly. It has NO INVOCATION
      SITE.

      MEASURED 2026-09-23, repo-wide excluding `.git`: the only references are
      its own docstring, its unit test, one prose line inside
      `status_evidence_check.py`, and the ci.yml step that runs
      `test_issue_closure_check.py` — which runs the TEST, not the CHECK.

      THAT REFERENCE USED TO CARRY A LINE NUMBER, and the v0.72 cold review
      REMOVED it rather than correcting it. It read `ci.yml:514`, which was true
      at 87fb06d7 and was ALREADY 533 when this artifact landed — RQ-72-CIPOOL
      added 19 lines above it in the SAME release — and is 574 now. A line
      number in an artifact that the same release keeps editing is a number
      measured before the last edit to the thing it counts, this programme's
      most repeated defect, so the step is named instead of located. Its `done-when` reads
      `contains:.github/workflows/ci.yml:test_issue_closure_check.py`, so it pins
      THE TEST'S PRESENCE IN A YAML FILE. The comparison it exists to perform is
      run by a human, by hand, at the tag.

      That is v0.70's "counted declarations and printed them as evaluation" one
      layer out. Not a gate that cannot fail — a gate nothing ever asks.

      AND ITS SIBLING RULE HAS NO COVERAGE. R12, added to
      `status_evidence_check.py` by the same release, is the ONLY rule in that
      file without a unit test: R0 has 11, R1 7, R2 7, R3 4, R4 32, R5 6, R6 2,
      R7 20, R8 17, R9 10, R10 10, R11 7, R12 ZERO. Measured from the repo root
      with sha-verified restore, disabling R12's vocabulary branch leaves BOTH
      suites rc=0.

      RECORDED BECAUSE THE WRONG MEASUREMENT WAS THE COMFORTABLE ONE: the first
      attempt at that check ran the suites from the scratchpad rather than the
      repo root, both went red for an unrelated reason, and it LOOKED like the
      finding was refuted. Re-run correctly it confirmed it. A measurement that
      happens to exonerate you is the one to repeat.

      FOUR DELIVERABLES, all from the v0.71 cold review, all measured:
        (a) INVOKE the closure check at the tag, from the documented release
            process, and re-point its done-when at the invocation rather than at
            the test's presence;
        (b) give R12 unit coverage;
        (c) pin the `issue-scope:` census line in ci.yml — it is the ONLY line in
            that step without a grep pin, while `status-evidence:`,
            `programme-status:`, `programme-staleness:`, `floor-prose:`,
            `status-evidence-anchor:` and `status-evidence-window:` all have one.
            It could print "0 issue(s) authorised" and nothing would notice;
        (d) the v0.70 "frozen replay" is not frozen. It reads live, editable
            artifacts, and v0.71 is what made it pass, by retroactively adding
            `issue-scope: outlives` to two shipped v0.70 artifacts. It IS
            load-bearing — deleting those two lines reds four assertions — but
            the docstring's claim that it "cannot go vacuous as the programme
            moves on" is false of the mechanism. Freeze it or restate it.

        (e) AND THE GATE MAKES A FALSE STATEMENT, found by RUNNING IT at the
            v0.71 tag rather than by reading it. `closed` comes from
            `closed_since(tag)` — "issues closed AT OR AFTER the tag's
            creation". An authorised issue closed BEFORE the tag is therefore
            absent from that set, and the gate reports

              FAIL AUTHORISED BUT NOT CLOSED: #1250 — RQ-71-ISSUESCOPE is
              delivered and entitles the release to close it

            while `gh issue view 1250 --json state` says CLOSED (2026-09-17).
            The sentence is false about the issue; it is true only about the
            window. The docstring anticipated the opposite skew — "a closure can
            legitimately lag a tag by minutes" — and `--allow-unclosed`
            downgrades it to a warning, which HIDES the false statement rather
            than correcting it. Fix: an authorised issue that is CLOSED, whenever
            it closed, satisfies the obligation; compare STATE, and keep the
            window only for the closed-but-not-authorised direction, where "who
            closed it during this release" is the question actually being asked.

      ALSO NOTED, not a deliverable: `issue: "#1250"` on RQ-71-ISSUESCOPE points
      at an issue CLOSED 2026-09-17 for a different defect (RQ-68-STATUSGATE's).
      The lane has no live tracker. Decide whether it needs one before the field
      is used to authorise anything else.

      DELIVERED, all five, each proven rather than asserted:

      (a) `docs/release-process.md` now has a "Closing issues on the tag" section
      that RUNS the gate, with both directions and the state-vs-window caveat
      written down. It had NO issue-closing section at all, which is why the
      gate had no invocation site.

      (b) R12 has unit coverage: 0 mentions in the test file before, 9 after,
      113 tests passing (was 108). PROVEN POTENT by disabling R12's three
      branches — 3 tests then fail, where v0.71's cold review measured that
      disabling it left BOTH suites rc=0. `status_evidence_check.py` restored
      byte-identical (sha compared).

      (c) The `issue-scope:` census line is pinned in ci.yml, the last census
      line in that step without one.

      CORRECTED BY THIS RELEASE'S OWN GATE-POTENCY COLD REVIEW, and the
      correction is more interesting than the deliverable. The pin shipped as
      `[0-9]+` on the AUTHORISED COUNT, and this artifact said: "Verified the
      pattern MATCHES the live output rather than merely existing — a pin that
      never matches is worse than none." Every word of that is true, and it
      names only ONE of the two questions. `[0-9]+` matches `0`, so the pin
      passed on precisely the vacuous census it was added to catch:

        echo 'issue-scope: v0.72 — 0 issue(s) authorised ...' \
          | grep -qE '^issue-scope: v[0-9]+\.[0-9]+ — [0-9]+ issue\(s\) authorised'
        -> MATCHES

      A lane whose whole subject is "the gate nobody asks" shipped a pin nobody
      asked the second question of. "Can it pass?" and "can it fail?" are not
      one check, and v0.71 shipped the mirror failure — a musl gate that could
      never PASS — one release earlier.

      THE NAIVE REPAIR IS ALSO WRONG, and measuring is what says so.
      `[1-9][0-9]*` is the shape the 17 sibling pins in that step use, but zero
      authorised is the LEGITIMATE plan-time state: across v0.72's own history
      the claiming count went 0 at the planning commit 1e9236d7, then
      1 -> 2 -> 3 -> 4 -> 5. That pin would red every future planning PR.

      What must never be zero is the POPULATION the close-set was derived OVER.
      An empty population and a genuinely empty answer print the same count and
      mean opposite things. So `status_evidence_check.py` now prints
      `over N artifact(s)` on that line, CI pins N with `[1-9][0-9]*` and keeps
      `[0-9]+` on the authorised count, and the HELD-OPEN count — previously
      unpinned entirely, with RQ-72-ISLANDS' `outlives` on #1331 riding on it —
      is pinned too. This is the repo's own RQ-65-FLOORSHAPE idiom: pin that
      the derivation RAN over a non-empty set, not that its answer was non-zero.

      Both directions are now demonstrated, not asserted: the pin matches the
      live line (`v0.72 over 8 artifact(s) — 4 ... 1 held open`), and it refuses
      a zero population, the old unpinned shape, and a line whose held-open
      count has been dropped.

      (d) The replay's "frozen, so it cannot go vacuous" sentence was FALSE and
      is corrected in place rather than deleted. It reads LIVE artifacts, and
      v0.71 is what made it pass by retroactively adding `issue-scope: outlives`
      to two shipped v0.70 artifacts. Kept live deliberately — the property
      worth asserting is that the SHIPPED artifacts still express v0.70's
      decision — and the real property PROVEN: removing one `outlives` line reds
      FOUR assertions (measured, then restored byte-identical).

      (e) The gate no longer states a falsehood. `closed_since` answers "who
      closed this DURING the release", which is right for the
      closed-but-not-authorised direction and WRONG for the other two. At the
      v0.71 tag it printed `AUTHORISED BUT NOT CLOSED: #1250` while the issue
      was CLOSED — closed before the tag, so outside the window — and
      `--allow-unclosed` hid that rather than correcting it. Those directions
      now compare STATE. Re-run on v0.71.0: 0 failures. The same fix closed a
      blind spot in the mirror direction: an `outlives` issue closed BEFORE the
      window was previously invisible, and now reds as HELD OPEN BUT ALREADY
      CLOSED. When live state cannot be read the gate SAYS so and falls back to
      the window instead of dressing a sentence about timing as one about state.

    status: implemented
    release: v0.72
    tags:
      - gate-potency
      - release-gate
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: differential
      issue: "#1250"
      landed: "#1250 (PR #1365)"
      done-when: "contains:docs/release-process.md:issue_closure_check.py"
      verified-by: "The mechanical half names the RELEASE PROCESS step, not the script and not its test — because the whole finding is that the script exists and nothing asks it. R12's coverage is evidenced red-first the way every other rule in that file is: disable the rule, watch the suite red, restore with a sha check."
