artifacts:
  - id: RQ-72-CIPOOL
    type: system-req
    title: "Four required contexts stall every release on a pool that idles beside twelve free machines — five others finish in four minutes"
    description: >
      RAISED BY THE MAINTAINER during the v0.71 cut ("Any reasons why you choose
      the gh runners and not ours this is queuing up") and then MEASURED on
      v0.71's own rounds rather than assumed.

      THE MEASUREMENT, run 35823595867, 66 jobs. The 8 self-hosted jobs ALL
      completed between 05:44:43 and 05:48:47 — about four minutes. Then nothing
      started for 25 minutes with 55 queued. Two samples 45s apart both read
      queued=55 running=0 done=11, so a sustained stall and not a point reading.
      It recurred: on run 35837258069, three samples 50s apart all read
      queued=57 running=0 done=9, with ONE job completing in eleven minutes.

      THE SHARPEST DATUM, taken on run 35837258069 while v0.71's last lane sat
      blocked: of ELEVEN completed jobs, EIGHT were self-hosted and THREE were
      macOS/arm. ZERO were `ubuntu-latest`. All FIFTY-FIVE queued jobs were
      `ubuntu-latest`. The hosted x64 Linux pool contributed nothing to that
      round at all, while holding 4 of the 9 required contexts.

      AND IT IS NOT A DEAD POOL, which is the part that makes this a capacity
      problem rather than an outage: the SAME branch's Spec Suite run had an
      `ubuntu-latest` job complete at 09:51:41, six minutes before that reading.
      The pool schedules; this run simply gets no slots. Checked and excluded:
      the Spec Suite run was already finished (queued=0 running=0) and is NOT a
      required context, so it was not the competitor either.

      THE SPLIT IS THE FINDING. Of the nine required contexts:

        self-hosted, ALL GREEN IN FOUR MINUTES
          Format, Clippy, Claim Check, Version Pin Sweep, Rivet Validation
        hosted, ALL STALLED
          Test, Z3 Verification, Bazel Build & Proofs, Kani Verification

      Those four are EXACTLY the residual RQ-61-CICAP (#1062) named and
      deliberately did not move: "per-toolchain questions (apt llvm, bazel+nix,
      z3, kani), each needing its own proof on that pool". That scoping was right
      when it was written. What changed is that it is now the critical path.

      WHY IT IS A MUST AND NOT A CONVENIENCE. CHECK3b requires ZERO non-advisory
      pending, so a release waits on ALL 66 jobs, not merely the required nine.
      v0.71 needed FOUR full rounds after rebases and not one completed inside a
      working session. The bottleneck is the GitHub-hosted quota, not the fleet:
      56 of ci.yml's 67 jobs target a pool that stalls while a dozen machines
      sit idle.

      MEASURED ON THIS RELEASE, not inferred: RQ-71-MUSL's new job was written
      for `ubuntu-latest` out of habit, moved to
      `[self-hosted, linux, x64, rust-cpu]` after the maintainer's question, and
      passed first time on `pulseengine-ci-01-12` in 3m38s.

      WHY IT IS NOT A BATCH, and the reason this lane is careful rather than
      quick: retargeting a REQUIRED context is the one move that can DEADLOCK
      merges — a required name that never runs blocks every PR forever. So it is
      ONE TOOLCHAIN PER PR, each proven green on the pool for several
      consecutive main runs before the next, exactly as RQ-61-CICAP moved
      Clippy. Order by stall cost, cheapest toolchain first.

      AND THE NON-REQUIRED ORACLE JOBS ARE NOT THE EASY HALF. They
      `pip install wasmtime unicorn pyelftools capstone` and need
      `arm-none-eabi-ld` — system-package installs, which is precisely the
      predicate RQ-61-CICAP used to exclude them. Moving them needs the same
      per-toolchain proof; a non-required job that silently never runs blocks
      CHECK3b just as hard.

      A TRIPWIRE IS PART OF THE DELIVERABLE, not an afterthought: a NEW job
      defaulting to `ubuntu-latest` makes this worse for every other lane, and
      v0.71 added one by copying the surrounding convention without thinking
      about capacity. Nothing catches that today.

      RE-MEASURED AT THE v0.72 CUT, AND THE MEASUREMENT RESHAPED THE LANE. Three
      samples 50 s apart on run 35888386080 all read `queued={}`. The v0.71 readings
      (55 queued/0 running; 57 queued/0 running) are NOT refuted — they were real.
      What is refuted is reading either as a STEADY STATE. The pool is not saturated,
      it is BURST-SENSITIVE, and that decides what a gate may assert: a queue-depth
      check would be red during a burst and green ten minutes later on an UNCHANGED
      repo — the "rate read off one INSTANT" defect v0.61 already recorded. So the
      tripwire pins a STRUCTURAL fact about ci.yml instead.

      A MISCOUNT I MADE AND CORRECTED, recorded because a gate inherits it
      permanently otherwise: a first pass matched the SUBSTRING `ubuntu` and reported
      56/67. That also caught `ubuntu-24.04-arm`, a DIFFERENT hosted pool with its own
      queue, and inflated the number this lane exists to reduce — in the flattering
      direction. The tripwire matches the runner label EXACTLY.

      THE BRIEF'S PRECONDITION WAS ALREADY MET, measured rather than assumed. It says
      the four required contexts move "only after the tripwire proves the pool serves
      them". On run 35888386080, FIVE of the nine required contexts ALREADY ran on
      self-hosted and passed — Format, Clippy, Claim Check, Version Pin Sweep and
      Rivet Validation, on pulseengine-ci-01-8/-9/-10. The pool demonstrably serves
      required checks today.

      WHY THE REMAINING FOUR STILL DO NOT MOVE, checked individually rather than
      deferred as a group: Test and Z3 Verification both `sudo apt-get`, Kani installs
      a verifier toolchain, Bazel installs Nix + Bazel. Every one carries an
      external-toolchain marker, which is exactly the hold-back #1062 increment 2
      already wrote down. A hypothesis that `Test` was plain cargo like `Clippy` was
      checked and REFUTED — it installs llvm-dwarfdump via apt.

      WHAT THIS INCREMENT ACTUALLY MOVES. Of 55 ubuntu-latest definitions, 43 are
      non-required with no external toolchain; of those, exactly THREE are PURE cargo
      (checkout + rust-toolchain + cache, the shape Clippy runs on this pool with).
      Those three moved: 55 -> 52 definitions, 81% -> 76%, self-hosted 10 -> 13. The
      other 40 need python/pip, which v0.72 proved works on this pool ONLY with the
      PEP 668 guard the islands job needed; they are a NAMED follow-up, not a silent
      omission.

      THE TRIPWIRE IS PROVEN ABLE TO FAIL in all three directions, on copies, with the
      worktree restored to a 0-line diff afterwards: adding an ubuntu-latest job trips
      the CEILING; moving one off trips the RATCHET, which demands the ceiling be
      lowered in the SAME PR so a win cannot be silently given back; renaming a
      required job trips the DEADLOCK guard — the one genuinely unsafe move here,
      because a required NAME that never runs blocks every merge with no red to
      revert.

      AND THE GUARD ITSELF FIRST FAILED THE WAY THE LANE IS ABOUT. Its first
      version read the required-context list through `gh` and "skipped" when that
      was unavailable. No other job in ci.yml calls `gh`, so on the self-hosted
      runner the step did not skip gracefully — it FAILED `Claim Check`, a
      REQUIRED context, on its first CI round. A guard that cannot execute where
      it is installed is exactly the "gate nobody asks" shape RQ-72-ISSUEGATE
      records, reproduced by the lane meant to fix the pool. The contract is now
      PINNED in the script and the guard runs offline; the API is a cross-check
      that reports DRIFT between the pin and branch protection when reachable and
      says plainly when it could not look. Re-proven offline: renaming a required
      job still trips the guard with no network at all.

    status: implemented
    release: v0.72
    tags:
      - ci-capacity
      - release-gate
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      verification-track: measurement
      issue: "#1062"
      landed: "#1062 (PR #1364)"
      # RQ-71-ISSUESCOPE (#1250): the artifact's scope shipped; the ISSUE is
      # wider, and a measurement taken AFTER RQ-72-CIPOOL merged proves it.
      # Under a real four-PR burst on 2026-09-23, three samples 45 s apart read
      # ubuntu-latest QUEUED=155 (constant), RUNNING=0, DONE=1, while the
      # self-hosted pool drained beside it (done 28 -> 29 -> 30, queue 10 -> 9
      # -> 8). #1062 asks for the CAPACITY problem; this release delivered a
      # tripwire that stops it worsening and moved three jobs (55 -> 52
      # definitions, 81% -> 76%). That is increment 3 of a programme, not the
      # answer. Closing #1062 on this tag would assert a fix the queue
      # contradicts.
      issue-scope: outlives
      done-when: "contains:scripts/ci_pool_tripwire.py:ubuntu-latest"
      verified-by: "The MECHANICAL half names the tripwire, because it is the half that survives this lane: a new job defaulting to the stalled pool must be caught by something other than a maintainer noticing. The MOVE itself cannot have a file-existence predicate — `runs-on` changing in ci.yml proves the edit, not that the toolchain works there — so it is evidenced by the queue-wait measured before and after on the same PR shape, and by the retargeted context being green on several consecutive main runs BEFORE it is relied on."
