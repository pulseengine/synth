artifacts:
  - id: RQ-72-ARM64MUSL
    type: system-req
    title: "#1349 names two musl triples and v0.71 shipped one — the arm64 payload still sets the varve layer's portability floor the x86_64 one no longer does"
    description: >
      HELD OPEN ON THE v0.71 TAG via `issue-scope: outlives` on RQ-71-MUSL, so
      `issue_closure_check` refuses to close #1349 while this is outstanding.

      WHAT #1349 ASKED FOR, quoted rather than summarised: "Add the two musl
      targets to this repo's release matrix, alongside the existing gnu ones:
      x86_64-unknown-linux-musl / aarch64-unknown-linux-musl."

      WHAT v0.71 SHIPPED, measured at the cut by reading the matrix rather than
      the artifact's prose:

        python3 - <<'PY'   # every `target:` in .github/workflows/release.yml
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-unknown-linux-musl     <- the one that landed
        x86_64-apple-darwin
        aarch64-apple-darwin
        linux-x86
        PY

      There is no `aarch64-unknown-linux-musl`. So an arm64 Alpine or
      `distroless-static` consumer — the case #1349 was filed from, by the varve
      side where the floor is visible — is still unserved.

      WHY IT IS NOT "HALF THE WIN". A varve layer's portability is the MAXIMUM
      floor across its payloads, not the average. The arm64 payload is still
      `aarch64-unknown-linux-gnu` with a glibc floor, so the layer's floor is
      unchanged by v0.71 for any consumer that needs both arches. The x86_64
      musl asset removes the floor for x86_64-only consumers and for nobody
      else. Stating that plainly is the difference between an honest partial and
      a claimed win.

      WHAT THIS NEEDS THAT v0.71's LANE DID NOT. The x86_64 musl job builds
      natively on `[self-hosted, linux, x64, rust-cpu]`. aarch64 musl needs a
      cross path, and the release workflow's existing aarch64 story is
      `gcc-aarch64-linux-gnu` + `qemu-user` under `SYNTH_RUNNER` — a GNU
      sysroot, which is the wrong libc for this target. So this is a new
      toolchain question, not a matrix row: either a musl cross toolchain, or
      `cross`, or an arm64 runner. MEASURE WHICH BEFORE SCOPING.

      REUSE, DO NOT REINVENT: `scripts/elf_static_check.py` already reads
      PT_INTERP from the ELF directly rather than grepping `file`'s wording —
      which is the correction v0.71's cold review forced, because rustc's musl
      target sets `crt-static-default` + `static-position-independent-executables`
      and so emits a `-static-pie` that `file` never calls "statically linked".
      That checker is arch-agnostic and is the verification for this target too.

      WHAT WOULD MAKE THIS WRONG TO BUILD (written before the work; the
      outcome is recorded below). If the aarch64 musl binary cannot be EXECUTED
      in CI (the existing arm64 assets are exercised under `qemu-aarch64`), then
      the asset ships unverified beyond its ELF shape, and an unexecuted release
      asset is how a broken artifact reaches a consumer. Check that
      `qemu-aarch64` can run a static-pie musl binary WITHOUT the
      `-L /usr/aarch64-linux-gnu` sysroot before promising execution evidence;
      if it cannot, say so and ship the ELF-property check alone, named as the
      weaker claim it is.

      OUTCOME: the contingency did NOT fire, and the reason it appeared to is
      the lane's main finding — see "THE THIRD ASSERTION WENT RED" below. The
      asset ships with execution evidence STRONGER than the qemu leg would have
      produced: it runs natively on arm64 with no emulator at all. No weaker
      claim is needed, and none is made.
      PARTIAL, AND THE SEQUENCING IS THE REASON. `create-release` depends on
      `build-binaries`, so a release-matrix entry that cannot build means NO
      RELEASE AT ALL — v0.71 shipped exactly that shape (a musl gate that could
      never pass) and only the cold review caught it before the tag. So the
      per-PR CI job goes in FIRST and proves the build; the matrix entry, which
      is what this artifact's `done-when` names, follows once that job is green.
      Until then the predicate is FALSE and the status is honestly non-claiming.

      THE LOCAL ATTEMPT WAS MADE, AND IS RECORDED FOR WHAT IT DOES NOT SHOW.
      `aarch64-unknown-linux-musl` IS installed on the dev host, so the cross
      build was tried rather than assumed. It compiled the entire dependency
      graph and failed at LINK:

        ld: unknown options: --as-needed -Bstatic -Bdynamic --eh-frame-hdr -z
            --gc-sections -z -z --strip-all
        clang: error: linker command failed with exit code 1

      Two routes around it also failed: `-C link-self-contained=+linker` is
      unstable, and `-C linker=<rust-lld> -C link-arg=-flavor` is rejected by
      rust-lld.

      That failure is the HOST's linker — rustc drove the link through `cc`,
      which on macOS is clang driving Apple's `ld`, and Apple's `ld` does not
      accept GNU linker options. It is therefore NOT evidence about the Linux
      runner, where `cc` is gcc and consumes those options natively. Reading it
      as a prediction would repeat v0.71's own error of treating
      `file | grep 'statically linked'` as a property of musl binaries rather
      than of `file`'s wording.

      IT ALSO LEAVES v0.71's RECORDED UNVERIFIED NOTE UNCHANGED: whether rust's
      bundled musl crt + rust-lld make `musl-gcc` unnecessary for a pure-Rust
      workspace is still unanswered, because this host could not run the
      experiment that would answer it. Saying so is the point; v0.71 wrote that
      note precisely so a later release would not quietly assume either way.

      AND CI ANSWERED THE FIRST TWO. Run on pulseengine-ci-01-10:

        Build synth for aarch64-unknown-linux-musl (rust-lld)  SUCCESS  199 s
        The issue's acceptance property (elf_static_check)     SUCCESS

      So the cross build DOES work on Linux, and the artifact IS static. The
      first attempt failed and the difference is the whole finding: leaving the
      linker to `cc` has no driver, because Debian/Ubuntu ship no
      `aarch64-linux-musl-gcc`. Naming `-C linker=rust-lld
      -C link-self-contained=yes` made it link.

      THAT RESOLVES v0.71's RECORDED UNVERIFIED NOTE, which asked exactly this:
      whether rust's bundled musl crt + rust-lld make `musl-gcc` unnecessary
      for a pure-Rust workspace. The answer is YES, measured — and the note in
      ci.yml is updated in place rather than left standing, because an
      UNVERIFIED that has been verified is a false statement the moment the
      measurement exists.

      THE POTENCY LEG THEN FAILED, AND IT WAS THE CONTROL, NOT THE ARTIFACT.
      The control built `aarch64-unknown-linux-gnu` and could not link: rust-lld
      can self-contain a MUSL link because rustc ships the musl crt, but it
      cannot conjure a glibc sysroot. That failure said nothing about the musl
      binary, which had already passed the check two steps earlier — it only
      made a green result unobtainable, which is the "gate that cannot pass"
      shape v0.71 shipped and the cold review caught. The control is now a
      NATIVE x86_64 gnu build: `elf_static_check.py` reads PT_INTERP and GLIBC_
      references, both architecture-independent — which is precisely why it was
      written that way instead of grepping `file`'s wording — so a native
      dynamically linked binary exercises both assertions and needs no cross
      toolchain.

      WHAT THE CI JOB ASSERTS, so nothing is implied that was not run:
        1. the cross build succeeds on Linux;
        2. the artifact is genuinely static — `scripts/elf_static_check.py`,
           arch-agnostic, reading PT_INTERP and GLIBC_ rather than `file`'s
           wording, WITH the aarch64 gnu build as a potency control that must
           be REFUSED by the same check;
        3. the asset RUNS — NATIVELY, on an arm64 Linux runner, with no
           emulator and no sysroot anywhere. See below: this is not the check
           the artifact originally planned, and the reason it changed is the
           lane's main finding.

      THE THIRD ASSERTION WENT RED AND THE RED WAS NOT ITS LABEL. The step was
      named "Execution — qemu-aarch64 with NO gnu sysroot", and read at its
      label it says the artifact's own contingency fired: qemu cannot run a
      static-pie musl binary without the sysroot, so ship the ELF shape alone
      as the weaker claim. THAT READING IS FALSE. The step failed with

        qemu-aarch64: command not found      (exit 127)

      so qemu was never invoked and the step produced ZERO evidence about
      qemu's capability in either direction. Promoting a shell error into a
      fact about an emulator that never ran would have shipped an unfalsifiable
      sentence — and this is the FOURTH time in v0.72 that a red was not the
      defect its label named (Clippy: wrong invocation; the islands job: PEP
      668; the mutation survey: region loss). The rule that catches all four is
      the same one: read the failure, never the failure's name.

      WHAT ACTUALLY FAILED WAS THE STEP THAT REPORTED SUCCESS.

        sudo: The "no new privileges" flag is set, which prevents sudo from
              running as root.
        install failed; letting the build be the judge

      `no_new_privs` is set on the self-hosted pool's containers, so NO
      self-hosted job can `apt-get install` anything — and the step's
      `|| echo "install failed; letting the build be the judge"` turned that
      into a green tick. The fallback is CORRECT for the linker (the build is
      genuinely the judge there, and it succeeded with no cross-gcc at all) and
      WRONG for an interpreter nothing else checks: a precondition step that
      cannot fail its own precondition is this project's recurring "can this
      gate fail?" class, which v0.71 shipped as a musl gate that could never
      PASS. Both halves of that question have now bitten within two releases.

      That measurement also SHARPENS RQ-72-CIPOOL rather than refuting it.
      CIPOOL declined to move `Test`, `Z3 Verification`, `Kani` and `Bazel`
      because each carries "an external-toolchain marker" — a heuristic.
      `no_new_privs` upgrades it to a structural impossibility: a job needing
      `apt-get` can NEVER run on that pool, however the migration plan evolves.
      CIPOOL's named follow-up (the other 40 jobs, which need python/pip) is
      unaffected, because pip works there without sudo under the PEP 668 guard
      the islands job proved.

      WHAT SHIPS INSTEAD, AND WHY IT IS STRONGER. `ubuntu-24.04-arm` is a
      GitHub-hosted arm64-Linux pool ALREADY used in this file by
      `arm64-linux-native` (RQ-64-ARM64LINUX), green on main at this cut. On a
      real arm64 host the binary is EXECUTED DIRECTLY: no qemu, no sysroot, and
      the question the artifact told the lane to answer first is retired rather
      than answered. The host is ASSERTED (`uname -m | grep -qx aarch64`), never
      skipped, for the reason RQ-64-ARM64LINUX gives: an execution gate that
      silently skips on the wrong host is vacuous.

      AND IT CORRECTED A DISCREPANCY THE GREEN LEG WAS HIDING. The cross job
      builds with `RUSTFLAGS="-C linker=rust-lld -C link-self-contained=yes"`.
      `release.yml` sets NO RUSTFLAGS ANYWHERE — checked by grepping the file,
      not assumed — so its musl entries link through `musl-gcc` from
      `musl-tools`. CI was therefore proving a link the release would not
      perform. A job that proves the wrong path is worth less than no job,
      because it reports green about something nobody ships. The native job
      uses the release's host class, packages, flags and command, so the matrix
      entry is proven as shipped; the rust-lld cross result KEEPS its own job
      and remains the measured answer to v0.71's UNVERIFIED note, stated as
      what it is — a cross-build fact, not the shipping path.

    status: implemented
    release: v0.72
    tags:
      - release-engineering
      - portability
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: differential
      issue: "#1349"
      landed: "#1368"
      done-when: "contains:.github/workflows/release.yml:aarch64-unknown-linux-musl"
      verified-by: >-
        The predicate names the RELEASE MATRIX, because the ask is an asset that
        ships and a matrix entry is what makes one. It is deliberately not a
        grep for the triple anywhere in the repo, which a comment would satisfy.
        The asset's static-ness is verified by scripts/elf_static_check.py,
        already proven in both directions at v0.71 (it refuses the real v0.70.0
        gnu asset on PT_INTERP + 17 GLIBC_ symbols, and accepts a synthesised
        static-pie at rc=0).
