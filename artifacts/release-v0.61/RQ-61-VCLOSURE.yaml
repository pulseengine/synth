artifacts:
  - id: RQ-61-VCLOSURE
    type: system-req
    title: "The traceability completeness gate has never fired: rivet coverage prints 40.1% and exits 0"
    description: >
      #1091. `release-execution` names the traceability completeness gate as
      THE release blocker: every `implemented` artifact must carry a `verifies`
      link. Measured on main with the CI-pinned rivet 0.23.0:

        release-v0.56   8/8  artifacts with NO linked sys-verification
        release-v0.57  16/16
        release-v0.58  11/11
        release-v0.59  17/17
        release-v0.60   8/8
                       -----
                       60/60   five consecutive releases, 100%

        sys2-has-verification   system-req   61/152   40.1%

      `rivet coverage` DOES run inside the required Rivet Validation job. It
      exits 0 at 40.1%: it PRINTS, it does not ASSERT. Third instance of "a
      validator reporting success about work it never did" (#1012, #1064), and
      the first where the un-run work is the gate the methodology calls the
      release blocker.

      WHAT IS NOT TRUE: that the work is unverified. Every artifact carries
      unicorn differentials, ld.lld-linked execution, Rocq proofs, mutation-
      killed gates. What is missing is the TYPED LINK that makes it queryable —
      "invisible to the trace graph", not "unverified". 61 of 152 non-release
      system-reqs ARE covered, so the pattern works and release artifacts
      simply never adopted it.

      INCREMENT 1: make the coverage step ASSERT — a floor on
      `sys2-has-verification`, pinned like ARTIFACT_FLOOR and raised in the PR
      that improves it. Without this any backfill silently rots again.
      INCREMENT 2: backfill v0.61's own artifacts as the pilot (each already
      names its evidence, so the sys-verification artifact is a transcription),
      and MEASURE the per-artifact cost before committing to the other 52.
      Then decide the historical 52 deliberately — backfill, or state in the
      methodology that shipped release artifacts are exempt and why. Either is
      defensible; a documented gate that has never once fired is not.

      DECIDED (increment 2): the 52 pre-v0.60 release artifacts (v0.56–v0.59)
      are EXEMPT from backfill. Reason, measured not asserted: they predate
      the mandatory `done-when`/`verified-by` fields (RQ-60-FLIPCOUPLE), so
      linking them is archaeology (~15–25 h, measured by the increment-1
      lane), not transcription (~5–7 min/artifact on the v0.60 pilot,
      re-confirmed ~10 min/artifact on v0.61). Their verification exists in
      their release notes; it is not queryable by the trace graph, and that
      is a recorded limitation, not a debt being serviced. The exemption is
      recorded where future readers meet it: here, in the
      sys-verification-v0.61.yaml header, and in the ci.yml coverage-step
      comment that owns the per-release backfill discipline.
    status: implemented
    release: v0.61
    tags: [traceability, rivet, gates, methodology]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      verification-track: review
      issue: "#1091"
      landed: "PR #1115 (increment 1: the coverage step ASSERTS — SYS2_VERIFIED_FLOOR, red-first at 62-vs-61 — plus the v0.60 backfill pilot VER060-001..008, covered 61 -> 69) and the #1091 increment-2 PR (sys-verification-v0.61.yaml, VER061-001..013, covered 69 -> 82, both floors re-derived under the pinned rivet 0.23.0; the historical-52 exemption recorded in three places)."
      verified-by: >-
        Both done-when clauses, each against the artifact not the intent.
        CLAUSE 1 (the step FAILS below a pinned floor): PR #1115's red-first
        transcript — pinned at 62 with 61 measured, the Check coverage step
        exits 1 with the below-floor error; at 61 it exits 0; on output
        missing the sys2 row, the unmeasurable branch exits 1 (recorded in
        the ci.yml step comment, dated 2026-09-01). CLAUSE 2 (v0.61's own
        artifacts carry verifies links): sys-verification-v0.61.yaml links
        all 13 implemented RQ-61-* requirements (VER061-001..013), each
        citing the concrete evidence the requirement's own
        verified-by/done-when names and carrying its stated residual
        verbatim; re-measured under CI's exact conditions (pinned rivet
        0.23.0, externals stripped): sys2-has-verification 69 -> 82,
        artifacts 496 -> 509, both pinned as the new floors in the same
        commit. DELIBERATELY UNLINKED, so the coverage number is not
        overstated: RQ-61-CICAP (still proposed — `Test` remains on
        ubuntu-latest) and RQ-61-VCLOSURE itself (its flip happens on this
        evidence; a self-link authored in the same commit would be the
        metric-gaming shape this artifact exists to remove — a later
        increment may add it once the flip has survived review).
      done-when: "manual: the coverage step FAILS below a pinned floor (red-first demonstrated by lowering the floor's input), and v0.61's own artifacts carry verifies links"
