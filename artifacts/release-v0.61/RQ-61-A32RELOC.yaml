artifacts:
  - id: RQ-61-A32RELOC
    type: system-req
    title: "cortex-r5 relocatable objects label A32 BL calls R_ARM_THM_CALL (10) instead of R_ARM_CALL (28)"
    description: >
      #1040, found while building the #1021 execution differential. A
      `--target cortex-r5 --relocatable` object's in-module direct call
      carries reloc **type 10 (R_ARM_THM_CALL)** on a word that is an A32
      `BL` (`0xEB000000`, ARM state). Expected **type 28 (R_ARM_CALL)**;
      R_ARM_THM_CALL belongs only on Thumb BL sites.

      Repro: `scripts/repro/popcnt_r11_clobber_1021.wat` with
      `--target cortex-r5 --all-exports --relocatable --no-optimize`;
      `.rel.text` shows `type 10 func_2` against an `eb000000` word.

      CONSEQUENCE, and why this is a soundness item rather than cosmetics:
      any consumer that TRUSTS the declared type — a real linker, or a
      harness — will patch Thumb halfwords into an ARM-state instruction, or
      emit an interwork veneer, producing an invalid instruction. The #1021
      harness died `UC_ERR_INSN_INVALID` on exactly this and now patches by
      EXECUTION MODE as a workaround, documented in `load_elf`'s docstring.

      THAT WORKAROUND IS THE PART TO NOTICE. A harness that compensates for a
      wrong declaration is a harness that can no longer detect it — and the
      compensation is load-bearing enough to be documented, which means the
      wrong type is now depended upon locally. Fix the emitted type AND
      remove the workaround in the same change; leaving the workaround would
      preserve a second consumer of the wrong contract.

      A32 is a shipped target (cortex-r5, #615), so this is emitted bytes a
      downstream linker consumes, not an internal label.
    status: implemented
    release: v0.61
    tags: [arm, a32, relocations, elf, cortex-r5]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#1040"
      verified-by: >-
        PR #1116. `RelocKind::ArmCall` joins `AArch64Call26` and
        `RiscvCallPlt` as its ISA's call relocation; `arm_backend.rs` selects
        it from `config.target.isa` (the only site that knows the ISA state)
        and the ELF emitter merely maps it to `ArmRelocationType::Call` (28) —
        deliberately NOT decided at the emitter, where `config.target` is out
        of scope and the ISA would have to be re-derived, which is the shape
        that produced the bug. A SECOND, UNFILED defect was found by asking
        `arm-none-eabi-as` rather than reasoning about the ABI: the A32
        placeholder was `eb000000` (addend 0) where gas emits `ebfffffe`
        (addend -8); since A32 BL computes `P + 8 + (imm24 << 2)`, a 0 addend
        resolves TWO INSTRUCTIONS PAST the callee entry — the A32 twin of the
        Thumb #174 bug, masked because the type was wrong too. Verified with a
        REAL LINKER: `arm-none-eabi-ld` on the pre-fix object produced
        `eaca0000`, the opcode itself corrupted from `eb` (BL) to `ea` (B) so
        the link register was never set and the target was garbage; the fixed
        object links to `ebffffe3` -> 0x80bc == `func_2` exactly. Measured
        both directions: cortex-r5 type=28/`ebfffffe`, cortex-m4 type=10/`f7ff
        fffe` UNCHANGED. The #1021 harness's execution-mode workaround is
        removed AND INVERTED into an assertion (a type/mode disagreement is now
        a hard failure), so it is an oracle FOR the reloc type rather than a
        consumer routing around it — proven potent by reverting the backend
        fix and observing `#1040 REGRESSION: reloc type 10 ... declares Thumb
        state but this leg executes in ARM state`. Locked by
        `test_encode_arm32_bl_placeholder_addend_1040`, which asserts the
        literal word AND re-derives the addend so a future edit cannot satisfy
        it by accident.
      landed: >-
        PR #1116 — complete. Every feature set built (default, riscv,
        all-features) because a new `RelocKind` variant can break feature-gated
        match sites a default build never compiles.
      done-when: "manual: A32 BL sites emit R_ARM_CALL (28), Thumb sites keep type 10, and the #1021 harness's execution-mode workaround is REMOVED"
