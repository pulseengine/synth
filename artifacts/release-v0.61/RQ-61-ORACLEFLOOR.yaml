artifacts:
  - id: RQ-61-ORACLEFLOOR
    type: system-req
    title: "An oracle's ci-checks floor cannot see its decline half — 2 oracles could lose that half and stay green"
    description: >
      #1113, found while repairing the aarch64 import-dispatch oracle in
      #1112. `scripts/oracle_run.py` requires exactly one `# ci-checks:`
      floor per repro oracle, and `oracle_wiring_check.py` sums those floors
      into a claims.yaml-pinned total. That machinery works. But an
      `emulations` floor counts ONLY emulator entries.

      TWO oracles assert a DECLINE direction (run a compile, treat exit 0 as
      the failure) IN ADDITION TO emulating differentials. A failed compile
      produces no object to emulate, so the decline half contributes ZERO to
      the counter its own oracle is floored on. Delete or neuter that half and
      `measured == floor` still holds; the job stays green.

        aarch64_import_dispatch_1017_differential.py   >= 6    #1112
        multi_segment_static_data_differential.py      >= 27   #1112 (the
                                                               #1041 red-first
                                                               refusal)

      THE COUNT WAS FIRST PUBLISHED AS FOUR AND IS WRONG; recorded because the
      error is the more useful artifact. The derivation was a regex — a
      `# ci-checks: emulations >= N` header plus an `if <proc>.returncode == 0:`
      failure branch — and it matched two RISC-V oracles
      (`riscv_extern_call_871`, `rv32_label_882`) whose `returncode == 0`
      branch is a TOOLCHAIN PROBE ("does this clang accept rv32imac?"), not a
      decline assertion at all. Reading the four sites reduced the class to
      two. A grep is a hypothesis; the code is the oracle. The wider proxy
      (any returncode assertion) matched 60 files, almost all "the compile must
      succeed" preconditions.

      Both members are FIXED IN #1112, so this artifact ships closed rather
      than as a backlog entry.

      HOW IT WAS FOUND MATTERS MORE THAN THE COUNT. Not by audit. #1104 added
      a driver-level refusal that preempts the aarch64 ELF builder's, so the
      probe — pinned to the builder's WORDING — went red. The wording pin is
      the only reason this was visible; had #1104 deleted the probe instead,
      the floor would still have been met and nothing would have reddened.
      The failure mode of the remaining three is SILENCE.

      This is the release's recurring shape one level up: the check exists, is
      wired, and is pinned — and the pin cannot see half of what the check
      asserts. Same family as #1085 (evidence that cannot fail) and #1091 (a
      gate that prints instead of asserting).

      Fix as applied in #1112: keep the `emulations` floor (it is the stronger
      assertion for the executing half, and only one header is permitted), and
      give the decline half its own in-script non-vacuity floor mirroring the
      `VACUOUS:` idiom these scripts already use for trap/value coverage —
      count refusals, print `refusals: N`, return 1 on zero, and grep it in
      ci.yml. While there, assert the decline's DURABLE property rather than a
      message string: exit != 0, no panic, the symbol is named, and NO OBJECT
      IS WRITTEN — the wording is what drifted, the written-object check is
      wording-free and is the actual safety property.

      DELIBERATELY NOT IN SCOPE, recorded so it is not re-litigated: allowing
      multiple `ci-checks:` headers in oracle_run.py. It would move a floor
      out of the file that describes it and admit two floors that can
      disagree; oracle_run.py's own docstring makes the locality argument
      against it.
    status: implemented
    release: v0.61
    tags: [oracle, non-vacuity, ci, evidence]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#1113"
      verified-by: >-
        PR #1112, both members of the class. Each oracle's decline half now
        carries its own in-script non-vacuity floor (`refusals: N`, returning
        non-zero with a `VACUOUS:` line at zero) mirroring the trap/value idiom
        these scripts already use, plus a `grep -Eq` in ci.yml. The
        `# ci-checks:` header was deliberately LEFT at `emulations >= N`: only
        one header is permitted per oracle and the emulation floor is the
        stronger assertion for the executing half. Each proven RED-FIRST.
        multi_segment, simulating the probe's deletion: `VACUOUS: refusals=0 —
        the #1041 refusal half asserted nothing`, EXIT=1 (before the change the
        same deletion left `measured=27 floor=27` and printed ORACLE: PASS).
        aarch64_import_dispatch, run against a module whose callee does NOT
        decline: three independent assertions fire, including `an object was
        written despite the refusal (736 bytes)`. Both probes additionally
        gained two WORDING-FREE assertions — the refusal must not PANIC, and it
        must write NO OBJECT — because a pinned message string is exactly what
        drifted when #1104 moved the refusal to an earlier guard.
      landed: >-
        PR #1112 — complete; the class is swept, not sampled. The count was
        first published as FOUR and corrected to TWO in the same PR:
        `riscv_extern_call_871` and `rv32_label_882` matched the derivation
        regex because their `returncode == 0` branch is a TOOLCHAIN PROBE
        ("does this clang accept rv32imac?"), not a decline assertion. A grep
        is a hypothesis; the code is the oracle. Corrected publicly on #1113.
      done-when: "manual: both oracles print a counted decline floor (`refusals: N`), return non-zero when that count is zero, and ci.yml greps it — each proven RED-FIRST by simulating the decline probe's deletion and observing the oracle exit 1 with VACUOUS"
