artifacts:
  - id: RQ-61-MCDCFLOOR
    type: system-req
    title: "The MC/DC gate's report-side floors are layout-coupled — adding code anywhere moves them, and re-stating a number each time is not a gate"
    description: >
      #1100, filed from RQ-61-MVPANIC's second red and its manifest diff.

      Adding the #1093 arity guard moved witness's REPORT-side reconstruction
      on functions the change never touched: 32 dec / 141 cond / 60 proved ->
      27 / 132 / 56, with the loss decomposing onto `sp_slot_store` (-2, its
      full_mcdc decision vanishing from the report),
      `validate_final_allocation_rv32` (-4 on a 13->12 regrouping),
      `build_options` (-1) and `validate_reloc_resolutions` (-1).

      THE INSTRUMENT SIDE SAYS NOTHING WAS LOST — verified independently with
      the gate's own extraction: 175 -> 176 scored branches across 20
      functions, exactly ONE population differing
      (`compile_function_with_opts` 9 -> 10, the intended guard), and 19/19
      of the equal-count functions carrying byte-identical
      `(kind, instr_index)` signatures.

      So the report-side floors measure witness's layout-sensitive decision
      reconstruction as much as they measure synth's coverage. This is the
      SECOND instance (after #990/RQ-59-ZEROINIT) and it was handled the same
      way — a re-statement WITH evidence, FLOOR_PROVED 57 -> 56, zero slack,
      per the protocol already written into `scripts/mcdc_gate.py`.

      THE PROBLEM WITH THAT BEING THE STANDING ANSWER: a floor re-stated on
      every unrelated-code PR is a number being maintained, not a property
      being asserted. The deletion-sensitive check already lives on the
      stable surface (`BRANCH_POPULATION`, exact per-function instrument-side
      counts); the report-side floors are the part that keeps moving. Options,
      to be decided with evidence rather than taste: express the report-side
      assertion as a DELTA against the same run's instrument-side population
      instead of an absolute; or scope the floors per-function where the
      population is pinned; or retire the absolutes and let BRANCH_POPULATION
      plus the row-driver sanity test carry the gate. Upstream fix in
      witness#208 would remove the need entirely — a fresh instance is
      already commented there.

      NOT A LICENCE TO LOWER FLOORS. Every re-statement so far carried the
      manifest diff that proved nothing real was lost; that requirement stays
      whatever shape the gate ends up in.

      DECISION (the increment that landed, chosen from the options above with
      the reasoning written down): the absolute floors are KEPT — they are
      the only check that notices a row-set or harness regression that stops
      driving outcomes — and the #990 protocol is made ENFORCED and
      AUDITABLE instead of folklore. scripts/mcdc_gate.py now (1) classifies
      every floor miss: WITH a BRANCH_POPULATION mismatch it exits 1
      (FAIL[branch-population], the real alarm, no re-statement offered);
      WITHOUT one it exits 2 (FAIL[reconstruction-drift]) and attributes the
      movement per-function against a pinned REPORT_SHAPE baseline — naming
      the functions whose report-side counts moved while their instrument
      population did not, with the paste-able evidence block pre-filled, so
      the re-statement is mechanical rather than archaeological. (2) Every
      floor movement must land as an append to the RESTATEMENTS ledger in
      the gate (date, refs, all five constants, mandatory
      population_evidence, and a per-function drift decomposition whenever a
      floor loosens) — check_restatement_ledger() refuses ANY run whose live
      constants disagree with the newest entry, and the ledger is seeded
      with the three historical movements (#912 statement, #990 and #1093
      re-statements). (3) claims.yaml SYNTH-MCDC-FLOOR-RESTATEMENT binds the
      constants' exact values, so the movement is a visible claims.yaml diff
      checked on every PR without the wasm toolchain — the RQ-58-METRIC
      "permission is per-movement" shape, with the waiver channel living in
      the gate's own ledger rather than duplicated in claims.yaml (a second
      channel would be a hand-maintained mirror). Both failure modes carry
      committed red-first tests (scripts/test_mcdc_gate.py, 15 cases,
      including exit-code separation, alarm-dominates-mixed, and a
      gate-copy potency test that a floor edit without a ledger append
      refuses to run). Green shape drift with floors met prints an ADVISORY
      per-function note — the audit trail — never a red, because failing on
      layout noise would red every unrelated-code PR (the recurrence this
      issue documents).

      HONEST RESIDUAL: the floors will still re-state on unrelated-code PRs
      until witness#208 lands upstream — that is now a classified exit-2
      event with a mechanical, ledgered path, not archaeology. And the drift
      attribution is baseline-relative (REPORT_SHAPE from the last
      re-statement's run), so between re-statements it decomposes the
      CUMULATIVE movement, not this PR's alone; per-PR decomposition needs
      witness#208's stable decision identities (named there as the field the
      report side does not carry).
    status: implemented
    release: v0.61
    tags: [mcdc, witness, gates, fragility]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1100"
      # Re-stated when the increment landed: the original manual predicate
      # ("no longer needs re-stating on an unrelated-code PR") is witness#208's
      # to satisfy, not this repo's — the in-repo property this artifact can
      # own is that a re-statement is CLASSIFIED, ENFORCED and AUDITABLE, and
      # that has a machine signature.
      done-when: "contains:scripts/mcdc_gate.py:FAIL[reconstruction-drift]"
      landed: >-
        PR #1126 (v0.61): failure-mode classifier (exit 1 alarm / exit 2
        drift), RESTATEMENTS ledger + check_restatement_ledger(),
        REPORT_SHAPE attribution baseline, claims.yaml
        SYNTH-MCDC-FLOOR-RESTATEMENT exact-value pins, 15 committed
        red-first cases
