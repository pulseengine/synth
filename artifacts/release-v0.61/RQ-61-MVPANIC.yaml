artifacts:
  - id: RQ-61-MVPANIC
    type: system-req
    title: "Two of three backends PANIC on a spec-suite multi-value `if`; the third declines cleanly with a named reason"
    description: >
      #1093 (gale), reproduced on v0.60.0 (`4e7a179c`). A block type that takes
      PARAMETERS — `(if (param i32 i32) (result i32) ...)`, valid wasm,
      `params(1) = 3` under wasmtime — makes the selector split more values off
      the operand stack than it believes are there:

        --cortex-m     exit 101  select_with_stack.rs:3674:65
        -b riscv rv32  exit 101  synth-backend-riscv/src/selector.rs:3164:40
                       both: "`at` split index (is 2) should be <= len (is 1)"
        -b aarch64     exit   1  clean decline naming the condition (VCR-A64-CF-001)

      CORRECTION TO THE REPORT, measured: the issue states rv32 declines
      cleanly. It does NOT — it panics at its own site with the identical
      message. So this is the SAME DEFECT INDEPENDENTLY PRESENT IN TWO
      SELECTORS, not one backend missing a guard two others have.

      BLAST RADIUS, measured over the invocation matrix: 7 of 8 paths panic —
      `--cortex-m`, plain, `--relocatable` (which forces the OTHER ARM codegen
      path, #197), and rv32, each with AND without `--no-optimize`. Only
      aarch64 declines. `(param i32 i32)` appears 10 times in
      `tests/spec-testsuite/if.wast`, which v0.60.0 vendors, so the input is
      already in the tree.

      DOCUMENTATION FINDING, not to survive the fix: `tests/spec/run_supported.sh`
      says "Compile PANIC ... (optimizer regalloc — all pass with
      --no-optimize)". False for this class — the panic is in instruction
      SELECTION, before the optimizer, on both ARM paths.

      THE FIX IS A LOUD DECLINE, NOT MULTI-VALUE SUPPORT. Port aarch64's
      `(params, results)` arity check to the ARM and RV32 selectors. Lowering
      parameter-taking block types is a real capability question with its own
      design; converting a panic into a decline is not, and mixing them is how
      a fix ships a half-lowered construct. Same policy as #1013, where
      AArch64 panicked and ARM/RISC-V declined and we matched the EXISTING
      refusal rather than inventing one.
    status: proposed
    release: v0.61
    tags: [robustness, decline-honesty, multi-value, arm, riscv, spec-suite]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1093"
      done-when: "manual: both ARM paths and rv32 exit non-101 with a NAMED decline on the if.wast `params` shape; the run_supported.sh --no-optimize claim corrected; red-first = the panic itself"
