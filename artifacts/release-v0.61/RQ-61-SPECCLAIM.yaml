artifacts:
  - id: RQ-61-SPECCLAIM
    type: system-req
    title: "README and FEATURE_MATRIX advertise a CI-tracked spec-suite compile rate that no job produces, over a submodule CI never checks out"
    description: >
      #1095 (gale), verified independently. Two user-facing documents advertise
      a number that does not exist:

        README.md:122          "CI-tracked compile rate" over the wasm spec suite
        docs/status/FEATURE_MATRIX.md  "Compile-rate tracked by CI (tests/spec-testsuite)"

      The FEATURE_MATRIX row is the more specific — it names the path — which
      makes it the more misleading.

      TWO INDEPENDENT REASONS THE NUMBER CANNOT EXIST, and the second is the
      one that makes this structural rather than a missing job:
        1. No workflow runs the suite. `ci.yml:742` RECORDS this honestly
           ("that 257-file suite is checked out and entirely unrun") — credit
           where due; the note is why the issue was findable at all.
        2. `tests/spec-testsuite` is a SUBMODULE and no workflow passes
           `submodules: recursive` to `actions/checkout`, so the directory is
           EMPTY on every runner. Adding a job today would measure nothing.

      WHAT ci.yml's NOTE DID NOT RECORD: that the advertised claims were left
      standing. Deferring the gate is a reasonable scheduling call; leaving the
      claim is not, and the claim is what a reader meets first.

      THE SHAPE, and why it belongs in this release: v0.61's theme is gates
      pointed at the wrong thing. This is the sharper variant — a load-bearing
      public claim with NO gate at all, while `claims.yaml` + `claim_check.py`
      exist precisely to pin claims like it (`SYNTH-README-STATUS-BADGES` is
      already pinned there). The mechanism exists and this claim is not in it.

      TWO HONEST END STATES, and the choice is a real fork: either wire the
      job (checkout with `submodules: recursive`, run the suite, pin a
      baseline the way kiln's wast-conformance workflow does) and the claim
      becomes true; or correct both documents to say what is actually
      measured. Do NOT ship a third state where the claim is softened enough
      to be unfalsifiable.
    status: implemented
    release: v0.61
    tags: [claims, docs, ci, spec-suite, honesty]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      verification-track: review
      issue: "#1095"
      done-when: "manual: either a CI job produces the rate over a CHECKED-OUT suite and claims.yaml pins it, or both documents state what is actually measured; not a softened middle"
      verified-by: >-
        The done-when's first arm holds, verified against the artifacts not
        the intent: (1) a CI job produces the rate over a CHECKED-OUT suite —
        .github/workflows/spec-suite.yml passes `submodules: recursive` and
        runs scripts/spec_compile_census.py, which was run locally over the
        real 257-file checkout and PASSES with every bucket equal to its pin;
        (2) claims.yaml pins it — SYNTH-SPEC-SUITE-CENSUS-README and
        SYNTH-SPEC-SUITE-CENSUS-MATRIX bind the two doc rows' numbers to the
        script's PINS table and the workflow's checkout/run lines, and
        claim_check is green; (3) not a softened middle — both rows now name
        the workflow, the script, and the exact numbers, and the census can
        FAIL: an empty suite dir, a +1 ok-pin, a -1 all_declined-pin, and a
        drifted README number were each demonstrated red (exit 1 / claim FAIL)
        before this status flip. Evidence transcripts in the PR body.
      landed: >-
        Fork (a) taken — the gate was wired, chosen on measurement, not from
        the armchair: the full census runs in ~10 s of compiles per backend
        after one cargo build, so a job is cheap. The `Spec Suite` workflow
        (.github/workflows/spec-suite.yml) is the FIRST workflow to check out
        the submodule (`submodules: recursive`) and it runs
        scripts/spec_compile_census.py, which exact-pins a nine-bucket census
        per backend over all 257 top-level .wast files — declines counted
        separately from errors per the compliance envelope. Measured baseline
        (suite commit 3453673): full-module compile 23 ARM / 13 RV32 / 27
        AArch64, at-least-one-export 92/82/60, panics 0/0/0 (the #1093 if.wast
        panic the issue measured is gone). Non-vacuity: exactly-257-files
        floor makes an empty checkout RED, never a 0/0 pass. Red-first at
        authoring: empty dir, an ok-pin +1, and an all_declined-pin -1 all
        exit 1; a drifted README number fails SYNTH-SPEC-SUITE-CENSUS-README
        (demonstrated). Both doc rows rewritten to cite the workflow + script;
        claims.yaml binds doc <-> script <-> workflow
        (SYNTH-SPEC-SUITE-CENSUS-README / -MATRIX) and its header comment no
        longer lists the census as "gated elsewhere". ci.yml:759 note updated.
