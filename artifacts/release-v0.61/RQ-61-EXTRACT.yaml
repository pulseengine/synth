artifacts:
  - id: RQ-61-EXTRACT
    type: system-req
    title: "19 checked-in coq/*.ml extraction snapshots are regenerated by CI into a sandbox and never compared — one is nine months stale"
    description: >
      #1080, measured rather than assumed, and HALF THE ORIGINAL PREMISE IS
      REFUTED. Extraction is NOT orphaned: `Synth/Extraction/CompilerExtract.v`
      is a real Bazel target and a dependency of the proof test
      (`coq/BUILD.bazel:329`, in `rocq_proof_test(name = "rocq_proofs")`). So
      `bazel test //coq:verify_proofs` re-runs extraction on EVERY CI run —
      into the sandbox. It never looks at the 19 `.ml` files committed in
      `coq/`.

      THAT IS WORSE THAN "unreferenced". They are not dead files nobody
      builds; they are a copy of a DERIVED artifact that the build
      regenerates and discards, while the committed version drifts:

        WasmInstructions.ml   last changed 2025-11-20   source 2026-08-27   2 commits since
        Compilation.ml        2026-08-21                2026-08-27         1
        WasmSemantics.ml      2026-08-21                2026-08-27         1

      `WasmInstructions.ml` is NINE MONTHS behind its source, so the
      checked-in extraction of the WASM instruction type **does not contain
      `BrIf`** — the model's only control-flow constructor, added this
      release by #1079. Anyone reading it as "the extracted model" reads a
      model that has not existed since November. Two of the 19 are cited by
      `docs/validation/VALIDATION_STATUS.md`, which is the worst possible
      place for a stale artifact.

      THE CLASS: derive-what-you-check-against with the arrow REVERSED — a
      derived artifact committed as if it were a source, with nothing
      comparing the committed copy to what the build derives.

      TWO HONEST DISPOSITIONS, and they are not equivalent. (1) DELETE them:
      extraction runs in CI, the sandbox output is the truth, and a committed
      copy adds only the opportunity to be wrong; update the two docs to cite
      the Bazel target. (2) GATE them: regenerate and byte-compare in CI,
      exactly as `VcrSelRulesGenerated.v` (#667) and `proof-inventory.json`
      (#1057) are gated. Choose deliberately — (2) is defensible only if the
      extracted OCaml is meant to be reviewable evidence for an assessor,
      which is a real use and the only reason to keep it.
    status: proposed
    release: v0.61
    tags: [rocq, extraction, generated-artifacts, staleness]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1080"
      done-when: "manual: the 19 snapshots are either deleted with the docs corrected, or regenerated-and-byte-compared in CI; a stale committed copy cannot survive either way"
