artifacts:
  - id: RQ-61-EXTRACT
    type: system-req
    title: "61 checked-in extraction snapshots across FOUR directories are regenerated by CI into a sandbox and never compared — the copies disagree with each other, and nothing runs the dune units that consume two of them"
    description: >
      #1080, measured rather than assumed, and HALF THE ORIGINAL PREMISE IS
      REFUTED. Extraction is NOT orphaned: `Synth/Extraction/CompilerExtract.v`
      is a real Bazel target and a dependency of the proof test
      (`coq/BUILD.bazel:329`, in `rocq_proof_test(name = "rocq_proofs")`). So
      `bazel test //coq:verify_proofs` re-runs extraction on EVERY CI run —
      into the sandbox. It never looks at the 19 `.ml` files committed in
      `coq/`.

      THAT IS WORSE THAN "unreferenced". They are not dead files nobody
      builds; they are a copy of a DERIVED artifact that the build
      regenerates and discards, while the committed version drifts:

        WasmInstructions.ml   last changed 2025-11-20   source 2026-08-27   2 commits since
        Compilation.ml        2026-08-21                2026-08-27         1
        WasmSemantics.ml      2026-08-21                2026-08-27         1

      `WasmInstructions.ml` is NINE MONTHS behind its source, so the
      checked-in extraction of the WASM instruction type **does not contain
      `BrIf`** — the model's only control-flow constructor, added this
      release by #1079. Anyone reading it as "the extracted model" reads a
      model that has not existed since November. Two of the 19 are cited by
      `docs/validation/VALIDATION_STATUS.md`, which is the worst possible
      place for a stale artifact.

      THE CLASS: derive-what-you-check-against with the arrow REVERSED — a
      derived artifact committed as if it were a source, with nothing
      comparing the committed copy to what the build derives.

      SCOPE CORRECTION, measured after the above was written: it is not 19
      files in one directory, it is 61 `.ml` files across FOUR, and they
      DISAGREE WITH EACH OTHER.

        coq/          19 .ml
        extracted/    18 .ml + .mli   — a dune LIBRARY, `synth_extracted`
        validation/   23 .ml          — THREE dune EXECUTABLES (simple_test,
                                        validation_suite, comprehensive_suite)
        compiler/      1 .ml

      `coq/` and `extracted/` share 18 basenames and DIFFER on 8 of them.
      Not drift — different eras: `Compilation.ml` is 316 lines in `coq/` and
      72 in `extracted/` (258 differing lines). So "the extracted model" is
      not one artifact with a staleness problem; it is several mutually
      inconsistent artifacts, and a reader cannot tell which is meant.

      AND NOTHING RUNS DUNE. `dune` appears in no workflow, no `*.bazel`, no
      Makefile, and no script — checked across all four, not by one grep,
      because the build files are the oracle here. So `extracted/` is a
      library nothing links and `validation/` is three executables nothing
      executes. The dispositions below are unchanged in shape but the "keep
      and gate" option is now much weaker: there is no consumer to keep them
      correct FOR.

      THE DOC IS SELF-CONTRADICTING, which is how this survived.
      `docs/validation/VALIDATION_STATUS.md` opens with a corrective note —
      "This document describes planned validation infrastructure that has not
      been implemented ... do not exist" — and then the body says
      "Successfully implemented the executable validation strategy", "40 files
      total, ~80KB", and marks sections "Status: Complete and ready for use"
      with green check marks. A reader who scrolls past the header meets a
      wall of completed-looking claims. A disclaimer that the body then
      contradicts is not a correction; it is two claims, and the louder one
      wins. Same class as #1095 (docs advertising a CI-tracked number no job
      produces) — that one at least does not argue with itself.

      TWO HONEST DISPOSITIONS, and they are not equivalent. (1) DELETE them:
      extraction runs in CI, the sandbox output is the truth, and a committed
      copy adds only the opportunity to be wrong; update the two docs to cite
      the Bazel target. (2) GATE them: regenerate and byte-compare in CI,
      exactly as `VcrSelRulesGenerated.v` (#667) and `proof-inventory.json`
      (#1057) are gated. Choose deliberately — (2) is defensible only if the
      extracted OCaml is meant to be reviewable evidence for an assessor,
      which is a real use and the only reason to keep it.
    status: proposed
    release: v0.61
    tags: [rocq, extraction, generated-artifacts, staleness]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1080"
      landed: >-
        PR #1121 (Refs #1080) — disposition (1) executed with the census
        re-verified independently: all four directories deleted (98 snapshot
        files — the 61 .ml plus 37 .mli, coq/ carrying 19 .mli the census
        missed — with the dune tree, root dune-project, and root
        BUILD.bazel's zero-consumer //:test_data filegroup that globbed only
        validation/**), VALIDATION_STATUS.md's body REWRITTEN so it no
        longer contradicts its own header, historical-note headers on
        COMPREHENSIVE_VALIDATION_REPORT.md, COQ_DUNE_SETUP_GUIDE.md and
        COMPILER_DEMO.md, and the .v extraction target untouched —
        `bazel test //coq:verify_proofs` still exercises it every CI run.
      done-when: "manual: all 61 snapshots across the four directories are either deleted (with VALIDATION_STATUS.md rewritten so its body no longer contradicts its own header) or regenerated-and-byte-compared in CI; the mutually-inconsistent copies cannot survive either way, and `bazel test //coq:verify_proofs` must still pass after the change"
