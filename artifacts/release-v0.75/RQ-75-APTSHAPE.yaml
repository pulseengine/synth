artifacts:
  - id: RQ-75-APTSHAPE
    type: system-req
    release: v0.75
    status: implemented
    title: "`APT_RE` only ever sees an installer that is the FIRST TOKEN of its `run:` value, because `str(job)` is a dict repr"
    description: >
      v0.74 widened this detector from `apt-get` to `apt(-get)?` and added a
      `SCRIPT_RE` for one level of `bash scripts/x.sh`, and enumerated NINE spellings
      it still misses.

      ROUND 2 FOUND SOMETHING DEEPER THAN A SPELLING. The body being scanned is
      `str(job)` — a dict REPR — so newlines render as a backslash and an `n`, and a
      quote precedes the command. The detector therefore only ever matches an
      installer that is the FIRST TOKEN of its `run:` value. Swapping two lines flips
      CAUGHT to MISSED:

          run: |                          run: |
            apt-get install -y x            set -euo pipefail
            set -euo pipefail               apt-get install -y x
          -> CAUGHT                       -> MISSED

      MEASURED AGAINST v0.74's NINE SPELLINGS, because "subsumes most of them" was
      the first draft here and is FALSE: `job_text()` changes the verdict on
      exactly ONE of the nine — the heredoc. aptitude, dpkg, two script levels,
      `./scripts/x.sh`, `bash .github/x.sh`, a python wrapper, a make wrapper and
      the `uses:` surface are all still unmatched, which `job_text`'s own
      disclosure and six assertions in the test module already say. The position
      defect and the spelling list are DIFFERENT holes; this lane closes the
      first and leaves the second measured.

      Widening the alternation is still the wrong shape: the real check is whether
      the job's install step can RUN under `no_new_privs`, which needs executing
      it, not grepping it.

      WHAT IS LATENT, CORRECTED: an earlier draft of this artifact said "no
      required context is on the self-hosted pool today". That is FALSE — FIVE
      are (Clippy, Format, Version Pin Sweep, Claim Check, Rivet Validation) —
      and `ci_pool_tripwire.py` itself refutes it 240 lines below the sentence
      the claim was copied from. The empty set is the INTERSECTION this guard
      exists for: a required context that is self-hosted AND needs apt. The
      `should` priority rests on that intersection being empty, which is true;
      it does not rest on the pool being empty, which is not.

      AT DELIVERY this artifact must carry `issue-scope: outlives` — #1062 is a
      standing capacity issue that no single lane closes. Not set while `proposed`
      (R12).
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      landed: "#1397"
      priority: should
      issue-scope: outlives
      issue: "#1062"
      done-when: "contains:scripts/ci_pool_tripwire.py:RQ-75-APTSHAPE"
      verified-by: >-
        The line-swap mutation must go from MISSED to CAUGHT, and the mutation shown to have applied.
