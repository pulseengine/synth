    description: >
      RE-VERIFIED AT THIS CUT, not recalled:

        gh issue view 445 --repo pulseengine/spar
        -> OPEN, last updated 2026-09-03, unchanged since the v0.71, v0.72 and
           v0.73 cuts

      Feature-loop steps 1 (model the architecture in spar) and 2 (generate WIT
      from spar) are N/A for a TWELFTH consecutive release, for the same
      unchanged upstream reason. This artifact exists so that
      `loop_conformance_check`'s steps-1-2 slot reports NA-FILED rather than a
      silent gap.

      THE ORDINAL IS WALKED, NOT CARRIED. RQ-74 -> RQ-73 -> ... -> RQ-63 is a
      chain of twelve. v0.72 asserted SIXTH twice and SEVENTH twice against a
      walked length of ten, and the v0.73 BRIEF itself carried "SEVENTH" — so
      the number is derived from the `carried-from` chain every time, never
      incremented from memory.

      TAGS ARE LOAD-BEARING: `[process, carried, spar, aadl, feature-loop]`.
      v0.69 lost `feature-loop` and the filing that exists to keep a deferral
      VISIBLE became invisible to the conformance gate.

      DO NOT REINTRODUCE "release artifacts only exist from v0.63". It is FALSE
      — `artifacts/release-v0.56.yaml` onward exist — and it has come back once
      already.
