artifacts:
  - id: RQ-74-STALEMSG
    type: system-req
    release: v0.74
    status: implemented
    title: "The compiler points users at a CLOSED issue: `LdrSym literal pool out of range (#345)` cites an issue closed and silicon-verified in June"
    description: >
      REFUTING COMMAND RUN AT THIS CUT, and it did NOT refute:

        grep -rn 'literal pool out of range (#345)' crates/ --include='*.rs'
        -> crates/synth-backend/src/arm_backend.rs:424

        gh issue view 345 --repo pulseengine/synth
        -> CLOSED 2026-06-14, stateReason COMPLETED

      #345's own asks were a bounded `.data` and no absolute MOVW relocs, and
      they were VERIFIED ON SILICON: `MOVW_ABS` relocs 22 -> 0, `.data` 65548 ->
      4 on a NUCLEO-G474RE, in v0.11.43. The issue is correctly closed. The
      decline message REUSES its number for an unrelated function-size limit.

      THIS COST REAL TIME IN v0.73, twice. An external reporter asked "is #345
      already tracked for large functions, or should this be filed separately?"
      — a question that only arises because the message points at a closed
      issue. And the v0.73 coordinator read #345's body, concluded its asks were
      untouched, and marked it to be HELD OPEN; only `issue_closure_check`
      caught that the issue was not open at all.

      THIS IS THE STALE-PIN CLASS ONE LEVEL OUT. v0.73 shipped
      `stale_pin_check.py` for a PIN whose issue is closed. A user-facing
      DIAGNOSTIC whose issue is closed is the same debt with a wider audience,
      and nothing looks at it.

      DELIVERABLES. (a) A census of every `#N` in a user-facing diagnostic
      string across `crates/`, with each one's live issue state. (b) A tripwire
      that refuses a diagnostic citing a CLOSED issue — the same shape as the
      pin tripwire, over a different population. (c) Re-point or drop the
      stale citations found by (a).

      WHAT WOULD MAKE THIS WRONG. If most cited issues are closed-but-still-the
      -best-explanation, a refusal is noise and the honest output is the census
      plus a documented convention. Run (a) FIRST and publish the distribution
      before building (b).

      OUTCOME: THAT IS EXACTLY WHAT HAPPENED. The census ran first and REFUTED
      the tripwire. Measured at the v0.74 cut over non-test code, excluding ARM
      immediate syntax: 117 numbers, 389 sites — 105 numbers / 363 sites (93%)
      cite a CLOSED issue, 9 numbers / 21 sites an OPEN one. A refusal would
      have red 363 sites on the day it landed.

      The reason is not sloppiness: a `#N` in a diagnostic names WHERE THE
      LIMITATION WAS ANALYSED, and that issue is normally closed precisely
      because the analysis finished. #345 is a correctly-formed citation a
      reader reasonably misread as "open and tracked". So the defect was never
      the citations — it was that nothing said what they mean.

      (a) SHIPPED: scripts/repro/diagnostic_issue_census_345.py, re-runnable,
          with a refusal when the board cannot be read (an unreadable board is
          not an empty one) and when the scan matches nothing.
      (b) REFUTED, with the measurement, and NOT shipped.
      (c) DELIBERATELY NOT DONE. The #345 message's exact text is PINNED by
          islandpass_1331_execution_differential.py as PINNED_REFUSAL — it is
          the gate proving the spanning-island fixed point landed. Rewording it
          inside a census lane would break that oracle to improve a sentence.
          What ships instead is the convention, recorded in CLAUDE.md.

      A FIRST PASS OF THE CENSUS WAS WRONG AND IS RECORDED AS SUCH: it counted
      663 sites, because it swept test-module assertions and ARM immediates
      (`AND R12,#31`, `ldr r0,[ip,#4095]`) as issue references. The headline was
      computed off that contaminated denominator before it was checked. Excluding
      both gives 389 sites — and the 93% held, which is why the conclusion stands
      rather than the first number.
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#345"
      landed: "#1386"
      done-when: "file:scripts/repro/diagnostic_issue_census_345.py"
      verified-by: >-
        The predicate points at something a REFUTATION would not create, so
        a lane that ends by refuting its own premise cannot satisfy it by
        writing the refutation down.
