# =============================================================================
# sys-verification backfill for the v0.60 release artifacts (#1091, pilot).
#
# WHAT THIS FILE IS: the TYPED `verifies` links that make v0.60's existing
# verification evidence queryable by the trace graph. It is a TRANSCRIPTION,
# not new verification — every RQ-60-* artifact already named its evidence in
# `done-when`/`verified-by`; these artifacts cite that evidence (the script,
# the job, the proof, the transcript) so `rivet coverage`'s
# `sys2-has-verification` rule can see it. #1091 measured 60/60 release
# artifacts across v0.56-v0.60 with NO linked sys-verification while the
# evidence itself was real and in-tree.
#
# WHAT THIS FILE IS NOT: a restatement of requirement titles to move a number.
# Each artifact below names concrete evidence with a path or a dated external
# record; if that evidence disappears, status_evidence_check.py's rules on the
# RQ-60-* side and the differential jobs themselves go red — this file only
# adds the graph edge.
#
# Deliberately NOT named `release-v0.60-*.yaml`: scripts/status_evidence_check.py
# sweeps `artifacts/release-v*` and applies release-REQUIREMENT rules
# (done-when/R7 archaeology/R8 release-field agreement) that are shaped for
# system-reqs, not for evidence-citation artifacts. These live beside
# verification.yaml / e2e-verification.yaml, the existing home of the
# sys-verification pattern.
# =============================================================================

artifacts:
  - id: VER060-001
    type: sys-verification
    title: "Pseudo-op expansion canary gate (#1021) — emulated scratch-contract differential"
    description: >
      scripts/repro/expansion_canary_gate_1021.py executes all 77 rule-emitted
      pseudo-op expansion instances on BOTH Thumb-2 and A32 under register
      canaries (R11 = 0xB11B11B1) and asserts nothing outside
      {results} u {declared contract} u {R12} moved, SP restored, memory
      confined to the expansion's own red-zone, full byte decode, and no
      declared contract register unexercised. Non-vacuity floor: >= 1200
      emulations per run (pinned in the RQ-60-CANARY done-when). Potency is
      re-proven on every run by two committed old-encoder fixtures that must
      red on exactly the pinned registers (pre-#1039: Popcnt r11 + operand
      tier; pre-#1054: operand tier only) — the gate discriminates WHICH fix
      is present. Shipped in v0.59.0 (PR #1061); v0.60 carries the
      traceability closure, which is what this artifact records.
    status: implemented
    tags: [canary, pseudo-op, emulation, differential, v060-backfill]
    links:
      - type: verifies
        target: RQ-60-CANARY
    fields:
      method: automated-test
      steps:
        run: "python3 scripts/repro/expansion_canary_gate_1021.py"
        coverage: "77 expansion instances x {Thumb-2, A32}, >= 1200 emulations; 2 red-first fixtures"

