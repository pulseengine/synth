    title: "Status-evidence coupling gate wired required — seven measured misses replayed"
    description: >
      scripts/status_evidence_check.py runs in the required Claim Check job
      (wired in .github/workflows/ci.yml, the requirement's done-when): every
      release artifact >= v0.60 declares `done-when`; a claiming status with
