artifacts:
  - id: RQ-73-PINDEBT
    type: system-req
    title: "known_open_pins went 27 -> 85 against a ratchet that says it must FALL — the board cannot answer whether anything is still broken"
    description: >
      THE HEADLINE, and it is the question the maintainer asked directly:
      "we have a lot of issues and I have no clue if we fixed them".

      MEASURED at the v0.72.0 cut, with the tool's own derivation
      (`claim_check._pin_table`, NOT a hand count — a hand-rolled parser
      disagreed with it three times while preparing this plan, which is the
      recurring lesson about measuring this codebase):

        known_open_pins          85 entries   baseline 27   +58   must FALL
        known_open_pinned_cases 158 cases

        selector_parity_197_differential.py          20 entries /  40 cases
        invalid_accept_1207_differential.py          39        /  39
        false_reject_1229_differential.py            12        /  12
        self_contained_boot_sweep_1189_differential   6        /  59
        ra003_join_1230_differential.py               4        /   4
        aarch64_operand_class_1231_differential.py    3        /   3
        home_alias_class_1189_differential.py         1        /   1

      WHY THE NUMBER IS THE ANSWER. Each pin is a CI-wired oracle that OBSERVES
      a divergence on the LIVE compiler and passes over it, keyed to an issue
      with an exact count. So the pin count is the still-broken count; it is not
      an opinion about the board. Several of the suppressed issues are titled
      SILENT MISCOMPILE or "accepts an INVALID module".

      RQ-66-PINDEBT exists to stop exactly this: "a release that ends with more
      pins than it began is red; adding a pin is paid for by closing one, or by
      a `waivers:` entry with a written reason in the same PR". The ratchet has
      been satisfied by WAIVERS rather than by fixes, and the number nearly
      tripled while every release stayed green.

      AND THE BOARD IS NOT OLD, which is the part that surprised. 40 open
      issues; exactly ONE older than 30 days (#242, an epic) and NOTHING over
      six months. The problem is not age — 28 of 40 have not been touched since
      the day they were filed, most from a two-week burst during the v0.65/v0.66
      oracle work.

      THREE DELIVERABLES.
      (a) Drive `known_open_pins` DOWN. Every removed pin is a fix or a pin
          proven obsolete, and either way the oracle must still DISCRIMINATE
          afterwards — shown by mutation, not by the suite staying green.
      (b) Re-verify the 28 UNPINNED open issues against the v0.72.0 binary.
          The pin method says nothing about them, so each needs "still fails,
          repro attached" or "no longer reproduces, closing with the command".
      (c) Make a STALE pin visible: a pin whose issue is already CLOSED is debt
          with no owner and nothing notices today. `scripts/stale_pin_check.py`
          is that tripwire and is this artifact's `done-when`.

      WHAT (c) FOUND, and it is the theme's own answer. The tripwire has
      exactly ONE specimen in the whole pin population, and it is the
      sharpest possible form of "is it still broken?":

        #1229 was CLOSED, stateReason COMPLETED, on 2026-09-10T02:37:12Z —
        while `false_reject_1229_differential.py` pinned, and still pins,
        130 false rejections of VALID spec functions across 12 (file,
        backend) cells. RE-RUN on a binary built from main at 6d167f0f with
        CI's own `cargo build -p synth-cli`: 12/12 cells, TOTAL=130, every
        cell equal to its pin. The pins are exact in BOTH directions, so the
        oracle being green IS the statement that nothing moved.

      HOW IT CLOSED, which is the mechanism worth keeping. PR #1246 —
      "four v0.65 findings WATCHED" — shipped that oracle and says in its own
      body "filed as watched, not fixed". Its explicit reference line is
      correct (`Refs #1207 #1229 #1230 #1231`). But two lines above, a
      sentence describing what a HYPOTHETICAL future fix would achieve
      contains a closing keyword immediately followed by this issue's number.
      GitHub's parser does not read tense, intent, or the sentence around it.
      The merge landed at 02:37:11Z; the close event is 02:37:12Z, one second
      later, with no comment. The other three issues in the SAME PR are all
      still open — only this one contained the substring. `stateReason:
      COMPLETED` here is GitHub's default for a keyword-close, not a human
      judgement: nobody ever asserted this was done.

      This is the repo's own documented failure mode (a PR body once
      auto-closed a live external blocker from inside a DENIAL), recurring
      two weeks after the oracle that could see it was already running.
      ACTION TAKEN: the evidence was posted to #1229 and the issue REOPENED,
      which is what moved this gate red -> green. The red half is therefore a
      REAL state change, not a planted fixture.

      TWO DERIVATION DEFECTS CAUGHT BY REFUTING COMMANDS, both recorded
      because each would have shipped a false number:
        - A first pass reported #539 as a second stale pin. The parity table
          holds `('#539-grow-fails', 1)` in the SAME tuple position a real
          issue reference occupies, and its own comment reads "Recorded with
          this reason, NO ISSUE: the divergence is a capability boundary, not
          a miscompile". #539 IS closed, so an unanchored `#(\d+)` reports 14
          deliberate, documented envelope pins as debt. The match is now
          anchored at both ends.
        - A first pass printed "105 pins" against a `known_open_pins` ratchet
          of 85, because a table serving two issues was counted at full size
          against each. The checker now ASSERTS 68 issue-charged + 17
          reason-charged == 85, reconciling against the independent ratchet —
          and that assertion immediately caught it silently dropping 3
          entries whose value referenced a named constant, not a literal.

      WHAT WOULD MAKE THIS WRONG TO BUILD. If the pins are mostly CORRECT
      suppressions of intended declines rather than wrong answers, the number is
      not debt and driving it down is theatre. AUDIT THAT FIRST: sample the
      tables and confirm each entry records a DIVERGENCE the oracle observed,
      not an `EXPECTED_DECLINE`. The population's stated inclusion criterion
      says divergence — the criterion itself has never been audited against the
      entries.
    status: implemented
    release: v0.73
    tags:
      - process
      - pin-debt
      - issue-board
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1373"
      verification-track: differential
      done-when: "file:scripts/stale_pin_check.py"
      verified-by: >-
        The predicate names the TRIPWIRE rather than the pin count, because the
        count is a ratchet in claims.yaml that already has its own gate, and a
        `contains:` on a number would go true the moment the number is written
        rather than when it is earned. Deliverables (a) and (b) are enforced by
        that existing ratchet and by the issue's own closure audit; (c) is the
        new mechanism and is the thing that can be pointed at.
