artifacts:
  - id: RQ-73-ISLANDPASS
    type: system-req
    title: "cpetig's 4 KB+ functions with spanning control flow still refuse — branch resolution and island placement need ONE fixed point"
    description: >
      HELD OPEN ON THE v0.72 TAG via `issue-scope: outlives` on RQ-72-ISLANDS.

      RE-MEASURED at the v0.72.0 cut, on the committed fixture:

        synth compile scripts/repro/litpool_islands_345_branchspan.wat \
          --target cortex-m7 --relocatable --all-exports --native-pointer-abi
        -> LdrSym literal pool out of range (#345): imm12=9900 > 4095

      WHAT v0.72 SHIPPED, and what it did not. Inline constant islands place a
      pool where the 12-bit unsigned `LDR(literal)` offset can reach it, so a
      function larger than 4 KB compiles — PROVIDED no local branch spans the
      placement. Branch offsets are byte-resolved BEFORE the encode loop, so an
      island inserted between a branch and its target moves the target and not
      the branch. v0.72 REFUSES such placements rather than mis-targeting, which
      is correct and is why the shape above still declines.

      THE FIX IS A REAL PASS, and saying so is the point: islands change sizes,
      which change positions, which change which branches need 32-bit encodings,
      which change sizes again. That is LLVM's `ARMConstantIslandPass` shape and
      it needs its own execution oracle. v0.72 deliberately did NOT invent it at
      a release cut, because inventing it at a release cut is how the two silent
      miscompiles below shipped in the first place.

      TWO MEASURED MISCOMPILES v0.72 CAUGHT, carried here so the successor does
      not re-learn them. Both compiled at rc=0 on modules v0.71 refused loudly:

        an 8-byte island left a `br_if` pointing 8 bytes EARLY, into the block
        it was meant to skip;

        R_ARM_THM_CALL@0x1014 -> hw1=0xe002, the island's own `b.n +8` rather
        than a BL, with the real BL at 0x101c still an unpatched `bl .`;

        LDR.W lit@0x1010 imm12=0 — the imm12 patch landed INSIDE the island, so
        the load returned code as a pointer.

      The second and third were in the FIX for the first, found by a second cold
      review run specifically to attack it.

      WHAT SHIPPED, and the order it shipped in. The ORACLE LANDED FIRST, per
      the gating rule, and it is written to ACTIVATE ITSELF: while the shape
      refused it asserted only the pinned #345 decline, and the moment the
      module COMPILES it requires bit-exact execution against wasmtime. So the
      pass could not land and leave its own gate trivially green.

        scripts/repro/islandpass_1331_spanning.wat
        scripts/repro/islandpass_1331_execution_differential.py

      The fixture closes the gap the v0.72 review named: the one module that
      execution leg actually RAN "had no calls and one literal", and the two
      miscompiles were exactly there. This one has a direct CALL inside the
      spanned region and THREE literals — one before the span, one inside, one
      after.

      THE PASS. `place_literal_islands_fixedpoint` resolves branch offsets
      against ISLAND-INCLUSIVE positions. The circularity is smaller than it
      looks: an island only moves code AFTER it, so `island_walk` decides every
      placement in ONE left-to-right pass; the iteration that remains is the
      branch-encoding one that was always there. The emit loop no longer
      decides anything — it OBEYS the plan, with a drift guard that refuses if
      the pending-literal count at a planned placement differs from the
      prediction. `island_branch_over` is the single source for an island's
      byte length, used by both the walk and the emitter.

      DELETED, because the North Star says the replacement is not done until
      the thing it replaces is gone: `label_branch_spans` and the
      `island_declined_for_branch` refusal, whose own message ended "serving
      this shape needs branch resolution and island placement in one fixed
      point". Keeping that sentence would have made it a false statement.

      SC-5 CAUGHT THE INCOMPLETE VERSION, and it is worth recording. The first
      build resolved branches in island-inclusive coordinates while
      `validate_branch_targets` still sized the stream island-free, so the gate
      FALSE-REJECTED a correctly-resolved branch ("targets 0x26c2, which is not
      an instruction start"). A gate and the thing it gates must measure in the
      same units; it now shares `island_walk`.

      MEASURED after the change:

        litpool_islands_345_branchspan.wat  REFUSED since v0.72 -> COMPILES
        islandpass_1331_spanning.wat        5/5 args bit-exact vs wasmtime
        litpool_islands_345_differential    165 byte-identical, 0 MOVED
        island_offset_invariant_345.py      306 objects, 0 violations

      POTENCY, proven by mutation on the shipped pass rather than asserted:
      placing an island one instruction late is caught by the non-spanning
      CONTROL; over-counting an island by 2 bytes leaves the control and the
      compile intact and is caught by EXECUTION. An earlier mutation — the
      v0.72 span guard disabled outright — was caught by execution while INV1
      PASSED on the same object, which is the concrete demonstration that an
      invariant check cannot see a branch that is mis-targeted but still lands
      on an instruction boundary.

      ONE DEFECT FOUND IN THE ORACLE ITSELF, recorded because it nearly
      convicted a correct compiler: the harness resolved only R_ARM_ABS32 and
      never patched R_ARM_THM_CALL, so the fixture's `bl` branched nowhere and
      `big(0)` — the only argument whose path reaches the call — came back
      wrong while the other four were bit-exact. A differential is only as good
      as its own link step.

      WHAT WOULD MAKE THIS WRONG. A fixed point that moves emitted bytes without
      an execution oracle proving the new bytes correct is REFUSED, not
      explained. `island_offset_invariant_345.py` (304 objects, 304 clean) and
      the byte-identity differential (165 identical, 0 MOVED) are the floor, not
      the ceiling: neither can see a branch that is mis-targeted but still lands
      on an instruction boundary, so the pass owes an EXECUTION differential
      over modules with control flow spanning a placement.
    status: implemented
    release: v0.73
    tags:
      - arm-backend
      - codegen
      - external-reporter
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: system
      priority: must
      issue: "#1331"
      landed: "#1377"
      verification-track: differential
      done-when: "contains:crates/synth-backend/src/arm_backend.rs:fn place_literal_islands_fixedpoint"
      verified-by: >-
        The predicate names a FUNCTION that exists only if the fixed point was
        built, not a fixture or a comment. A refutation of this lane — deciding
        the pass is not worth its trusted-base cost this release — leaves the
        function absent, the predicate FALSE, and the artifact honestly
        non-claiming, which is why it is expressed this way rather than as a
        `file:` on an oracle a refutation would also produce.
