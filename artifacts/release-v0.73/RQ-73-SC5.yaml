artifacts:
  - id: RQ-73-SC5
    type: system-req
    title: "SC-5 no longer gates the final stream — validate_branch_targets runs BEFORE island insertion"
    description: >
      FOUND BY v0.72's ROUND-2 COLD REVIEW. `validate_branch_targets` is called
      at `arm_backend.rs` immediately after `resolve_label_branches`, and its own
      docstring says it "hard-gate[s] every branch target onto the
      instruction-start set of THE FINAL STREAM".

      Since v0.72 the stream it gates is no longer final: inline literal islands
      are inserted afterwards, inside the encode loop, and nothing re-validates.
      The #740/#930 belt-and-braces gate was silently weakened to cover a PREFIX
      of the pipeline.

      WHY THAT MATTERS PARTICULARLY HERE. The island placement guard is now the
      ONLY protection against a mis-targeted branch, and v0.72 shipped TWO
      demonstrations that a first attempt at such a guard is incomplete: the
      branch-span guard missed four offsets recorded from `code.len()` (the `Bl`
      relocation, `MovwSym`, `MovtSym` and `LdrSym`'s `ldr_offset`), and both
      resulting miscompiles compiled at rc=0. A defence-in-depth gate that has
      quietly stopped covering the shipped bytes is the wrong thing to be
      relying on a single guard instead of.

      SCOPE: re-run the SC-5 boundary check over the FINAL byte stream — or over
      `arm_instrs` plus the island offsets — after the encode loop, and prove it
      fires by constructing a target that lands mid-instruction. The v0.72
      reproduction is the starting point: an 8-byte island left a `br_if`
      pointing 8 bytes early.

      WHAT SHIPPED. Two things, and the first was already done by
      RQ-73-ISLANDPASS: `validate_branch_targets` now derives positions from
      `island_walk`, the SAME walk the branch offsets are resolved against, so
      it measures in post-island coordinates. It also FIRED on exactly this
      class during that lane, observed rather than argued — with the fixed
      point half-applied (offsets island-inclusive, gate still island-free) it
      refused on exactly that class. NOTE the wording: the in-compiler gate
      says "not an instruction BOUNDARY". An earlier draft quoted it as
      "not an instruction start", which is this file's own oracle's phrasing
      and something the compiler has never emitted
      (`git log -S "not an instruction start"` -> no commit).
      THE SECOND THING IS THIS ARTIFACT'S OWN `done-when`, because the artifact
      is explicit that moving the call site without a demonstration "would
      restore the wording and not the guarantee":
      `scripts/repro/sc5_postisland_345.py` DECODES the emitted `.text` by
      Thumb-2 rules and builds the instruction-start set INDEPENDENTLY of
      anything the compiler recorded, then requires every branch target to be a
      member. It consults the bytes, not the bookkeeping — the v0.72 lesson
      that "a checker which consults the same bookkeeping that was wrong will
      agree with it".

      POTENCY IS FROZEN, NOT ARGUED. It carries the `.text` of the branch-span
      fixture emitted by a build with `island_walk`'s size arithmetic perturbed
      by +2, which drives targets two bytes into the SECOND halfword of a
      32-bit instruction; the oracle must FLAG it, and CI greps for that line.
      Producing those bytes ALSO required neutering the in-compiler SC-5 gate,
      which is itself the evidence that gate now covers the post-island stream:
      nothing else would emit such an object.

      THE REFUTATION THE ARTIFACT ALLOWS WAS CHECKED AND DOES NOT APPLY. This
      does not duplicate `island_offset_invariant_345.py`: that oracle checks
      RELOCATION and LITERAL invariants and says nothing about branch targets.
      The v0.72 miscompile proves the gap in the other direction too — INV1
      PASSED on an object whose `br_if` pointed 8 bytes early.

      WHAT WOULD MAKE THIS WRONG. If re-validating the final stream duplicates
      what `island_offset_invariant_345.py` already proves from the emitted ELF,
      then the honest deliverable is to say so and DELETE the stale docstring
      claim rather than add a second checker — SC-5 is a system constraint, and
      a constraint enforced twice badly is worse than once well.
    status: implemented
    release: v0.73
    tags:
      - arm-backend
      - safety
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: system
      priority: should
      issue: "#345"
      landed: "#1378"
      verification-track: differential
      done-when: "file:scripts/repro/sc5_postisland_345.py"
      verified-by: >-
        The predicate names a NEW oracle rather than a source string, because
        the deliverable is a demonstration that the check fires on a
        post-island mis-target — moving the existing call site without such a
        demonstration would restore the wording and not the guarantee.
