      green 43/43 because the freshness gate compares the RENDER to the
      TEMPLATE and never the template to the CODE.
      VCR-ISA-001 already proved the fix works — #667 made the shipped
      sel_dsl::RULES table EMIT the Rocq model, so selector/model drift became
      unrepresentable rather than merely tested-for.
      DO: inventory all 57, rank by rot-risk (does a stale copy cause a wrong
      ANSWER, or only a wrong doc?), and convert the top-ranked ones to
