      assembly; the WIRING was deliberately left, because rewiring the rule
      table is a verification-surface change and not release work.
      Route the shift rules to the modelled ops and remove the decline, or
      narrow it to whatever sub-case genuinely remains and state THAT reason.
      RED-FIRST, and the trap is specific: "verify still passes" is not the
      evidence. The evidence is the DECLINED COUNT dropping and the newly
      checked rules returning Verified FOR THE RIGHT REASON — #975's own
      measurement is the template, since it found i32.add returning Verified
      when it should not have.
      Worth stating because it is the general lesson: a decline that is too
      conservative is INVISIBLE. Nothing reds, no test fails, the tool quietly
