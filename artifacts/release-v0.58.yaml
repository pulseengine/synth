      priority: must
      verification-track: frozen-anchor
      issue: "#242"

  - id: RQ-58-WILDCARD
    type: system-req
    title: "105 wildcard arms in the instruction selector — the same class as #946, unmeasured"
    description: >
      instruction_selector.rs carries 105 `_ =>` arms. v0.57 fixed exactly one
      instance of this class (writes_sp, 175 of 222 variants absorbed, #969) and
      found it was LIVE — three priced ops reached it — while the numbers
      happened to be right for a reason nothing checked.
      The selector's wildcards are the same shape with a worse consequence: a
      missed op there is a MISCOMPILE or a silent decline, not a loose bound.
      #615 (the A32 silent-NOP class) is the precedent and the pattern to reuse:
      expand-or-loud-reject, plus a no-wildcard tripwire that fails to COMPILE
      when a new variant appears.
      DO NOT sweep all 105 blindly. Rank them first: which absorb WasmOp
      variants (miscompile risk), which absorb internal enums (lower risk),
      which are genuinely total. Convert the miscompile-risk set; state the
      count converted and the count deliberately left with a reason. A partial
      conversion with an honest denominator beats a claimed sweep — that is the
      #935 lesson applied to refactoring.
      EXPECT to find live holes. v0.57's writes_sp lane expected latent and
      found live.
    status: proposed
    release: v0.58
    tags: [soundness, exhaustiveness, tripwire, wildcard, selector]
    links:
