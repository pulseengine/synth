    title: "synth verify still declines shift rules for a gap #975 closed"
    description: >
      #981. `i32.shl` reports `declined immediate-shift-encoding`, and the
      stated reason — "SMT modeling of the variable-shift register encoding is
      an open gap" — became false in v0.57: #975 modelled LslReg/LsrReg/AsrReg/
      RorReg faithfully as Rm<7:0> (ARMv7-M A7.7.68/70/12/117) and moved five
