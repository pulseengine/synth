    title: "57 files say 'mirror', 1 says 'single source of truth' — generate, don't mirror"
    description: >
      The rot class this repo keeps paying for, now counted. 57 source files
      mention a mirror, 11 a hand-maintained list, exactly ONE claims a single
      source of truth.
      v0.57 alone: the aarch64 decline list went stale TWICE and still named a
      capability that release SHIPPED; exec_trap_subset_op's allowlist drifted
      so three ops delegated to a model that did not implement them;
      `referenced_locals` existed in THREE backend copies until #974 collapsed
