  - id: RQ-58-SPLIT
    type: system-req
    title: "instruction_selector.rs is 29,616 lines — split it along the seam that already exists"
    description: >
      18,481 lines of code plus 11,135 of tests in ONE file. Nobody can hold it,
      which is why wildcards accumulate in it and why two selectors could
      diverge inside it unnoticed (#946's own scanner got this wrong: it claimed
      `--relocatable` forces `select_default`, when it forces the DIRECT
      selector, which IS `select_with_stack` — direct is not default).
      The seam is not invented, it is already there: the two-selector split
      (#197). Separate the shared lowering core from the two path-specific
      layers so the difference between them is READABLE rather than
      archaeological.
      GATE: byte-identical output across all frozen anchors and differentials.
      A pure move must not change a single emitted byte, and if it does the
      move is wrong. Commit per moved unit so a bisect is meaningful.
      SEQUENCING: runs AFTER RQ-58-RETIRE, so the file is smaller and the
      dual-path residual it names is known before anything moves.
      SCOPE HONESTY: this is the lane most likely to be partially completed. A
      half-finished split with a stated boundary is acceptable; an unstated one
      is not.
    status: proposed
