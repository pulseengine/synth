# =============================================================================
# v0.58 — "Delete the thing you replaced"
# =============================================================================
#
# THE THEME, and it is a CORRECTION to the North Star rather than a new one.
#
# Epic #242 says: replace the patch-accreting code generator — correctness from
# construction, not an ever-growing pile of locally-correct patches.
#
# The goal is right. The strategy is not working, and the numbers say so.
# Measured across v0.42.0 -> v0.57.0 (15 releases, 2026-08-14):
#
#   workspace source                  130,658 -> 174,578 lines   (+34%)
#   instruction_selector.rs            24,909 ->  29,616 lines   (+19%)
#     of which code (pre-test-module)                 18,481
#     wildcard `_ =>` arms                               105
#   selector churn since v0.42          5,515 added / 808 deleted  (6.8 : 1)
#   VCR-SEL-001 verified rules             40 ->      50   (FLAT since v0.50)
#   files saying "mirror"                                  57
#   files saying "hand-maintained"                         11
#   files saying "single source of truth"                   1
#
# Read those together. The thing the epic exists to REPLACE grew by 4,707 lines
# while the replacement gained ten rules and then stalled for seven releases.
# We are not replacing the patch-accreting selector. We are building a verified
# path ALONGSIDE it, and the unverified one is winning on volume.
#
# The mechanism is visible in v0.57. VCR-SEL-001 made 50 ops' lowering
# Rocq-proved through a BYTE-INVISIBLE FLIP — the proofs are real and the
# shipped path did change, but the hand-written arms STAYED. So each release
# adds a proof, plus a checker for the proof, plus a doc claim about the
# checker, plus a ledger pin for the doc — every one of them hand-maintained.
# v0.57 then found three of those had rotted while the gate showed green, and
# five of its ten artifacts were defects in checkers rather than in compiled
# code. Verification machinery has become a defect surface of its own, and it
# is growing because nothing is ever retired.
#
# THE CORRECTION, one sentence:
#
#     A rule is not done when it is proven. It is done when the hand-written
#     arm it replaces is DELETED.
#
# That turns the North Star into a metric that CAN GO THE WRONG WAY — which is
# this repo's own standard for whether a gate is worth anything. Right now it
# is going the wrong way and nothing notices, because nothing measures it.
#
# WHAT THIS RELEASE IS NOT. It is not "clean up the codebase". Refactoring
# 29,616 lines of instruction selector without a per-step execution oracle is
# exactly how you inject the miscompiles this project exists to prevent — and
# v0.57 supplies the cautionary case: the gpio differential could not have
# caught its own miscompile, so "the tests pass" would have been meaningless.
# Every subtraction lane below is gated on byte-identity or an execution
# differential. A deletion that changes emitted bytes without an oracle proving
# the new bytes correct is REFUSED, not explained.
#
# HONEST RISK, stated up front: byte-identity is the strong gate but it only
# proves we did not change behaviour on the inputs we HAVE. For the covered-op
# retirement that is sufficient (the DSL path already ships those bytes). For
# the wildcard and split lanes it is not, and those carry differentials.
# =============================================================================

artifacts:
  - id: RQ-58-METRIC
    type: system-req
    title: "Make subtraction measurable — pin the numbers that are currently going the wrong way"
    description: >
      FIRST, because without it every other lane in this release is a vibe.
      Nothing in CI currently measures whether the patch pile is growing. The
      epic's own thesis is therefore unfalsifiable in practice, which is how it
      drifted for seven releases without anyone noticing.
      Pin, in claims.yaml and a CI step: instruction_selector.rs line count
      (29,616 at v0.57.0), its wildcard-arm count (105), the VCR-SEL-001 rule
      count (50), and the count of hand-maintained-mirror markers (57 files).
      Direction matters and differs per number: the selector count and the
      wildcard count are CEILINGS that must fall; the rule count is a FLOOR
      that must rise.
      RED-FIRST: adding a hand-written lowering arm without deleting one must
      turn the gate red. Demonstrate it by adding one, watching it red, and
      reverting — do not assert it. A ceiling set at "current + slack" would be
      the vacuous version and is explicitly out of scope.
      NOT a code-golf gate: the point is not fewer characters, it is fewer
      hand-maintained decisions. If a lane legitimately needs to grow the file,
      the ceiling moves WITH a stated reason in the same PR — the #911 rule
      applied to size.
      IMPLEMENTED. Seven `kind: ratchet` pins in claims.yaml, derived once each
      in `status_fields:` and printed every CI run by
      `claim_check.py claims.yaml --metric`; engine + escape hatch documented in
      scripts/claim_check.py, unit-tested in scripts/test_claim_check.py (32
      cases, mutation-verified: stubbing check_ratchet kills 18 of them).
      NUMBERS RE-DERIVED, and two differ from the figures above — those figures
      stand as written since they are the plan of record, but the LEDGER carries
      these:
        * DSL rules have been flat since v0.45.0 (40 at v0.42/v0.43, 41 at
          v0.44, 50 since), i.e. twelve releases of stall, not seven.
        * 43 of the 105 wildcard arms are in the selector's OWN TEST MODULE;
          the lowering code carries 62. Both are pinned, region-scoped and
          whole-file, because a whole-file-only ceiling would let a lane
          "progress" by deleting test arms and would fire on every PR that adds
          coverage.
        * Selector non-test code grew 14,694 -> 18,480 (+25.8%) v0.42 -> v0.57,
          so the thesis survives the honest denominator (the test module grew
          10,215 -> 11,136 over the same span).
        * 18,481 in the plan is the grep LINE NUMBER of `#[cfg(test)]`; the
          region is 18,480 lines.
      RED-FIRST DEMONSTRATED, not asserted: a hand-written `rn == rm` special
      case added to the `I32Add` lowering arm without deleting one turned
      SYNTH-SUBTRACTION-SELECTOR red on both selector pins (18,480 -> 18,485).
      The probe was BYTE-INVISIBLE — the compiled ELF hash was unchanged and all
      10 frozen-anchor tests passed — which is the point: this gate catches the
      growth that byte-identity and frozen-anchor oracles structurally cannot
      see. Adding a matching `waivers:` entry turned it green (escape hatch
      works); reverting restored green with the ELF hash byte-identical to
      baseline.
    status: implemented
    release: v0.58
    tags: [north-star, metric, falsifiability, vcr-sel-001]
    links:
      - type: derives-from
        target: BR-001
      - type: refines
        target: NFR-002
    fields:
      req-type: functional
      priority: must
      verification-track: static-analysis
      issue: "#242"

  - id: RQ-58-RETIRE
    type: system-req
    title: "Retire the hand-written arms for the 50 DSL-covered ops — the first deletion"
    description: >
      THE HEADLINE. VCR-SEL-001's 50 rules are the SHIPPED lowering path for
      their covered ops (CLAUDE.md, byte-invisible flip). The hand-written arms
      they replaced are still in instruction_selector.rs. Delete them.
      This is the safest possible deletion and that is precisely why it goes
      first: the DSL path ALREADY emits these bytes on main, so removing the
      superseded arm must be BYTE-IDENTICAL across every frozen anchor and every
      differential. If it is not byte-identical, that is a finding — it means
      the flip did not cover what it claims, and the finding outranks the
      deletion.
      METHOD: one op per commit, anchors + differentials green per commit, so a
      bisect lands on a single op. Report lines deleted per op and the running
      selector total.
      EXPECTED RESIDUAL, named in advance: some arms will be reachable from the
      OTHER selector (#197 — `--relocatable` forces the direct path,
      `select_with_stack`). An arm that is dead on one path and live on the
      other is NOT deletable yet; say which those are rather than deleting them
      and discovering it downstream. That set is the input to RQ-58-SPLIT.
      LANDED (v0.58): all 36 flag-guarded sites deleted (21 select_default +
      15 select_with_stack; one op/group per commit), each commit gated on a
      688-row corpus byte-identity manifest (156 scripts/repro fixtures x 4
      configs — m4f/m4 relocatable, m4f self-contained, r5 relocatable —
      declines pinned too) against the pre-deletion origin/main baseline plus
      the 10 frozen anchors. BYTE-IDENTICAL THROUGHOUT — no finding of the
      "flip does not cover what it claims" class surfaced. The SYNTH_SEL_DSL
      lever and the four mirror-pin tests retired as vacuous in the final
      functional commit; the #258 imm-fold holdout re-pinned as
      cmp_imm_fold_residual_path_stays_handwritten_258. Selector code region
      18,582 -> 17,897 (-685), absorbing wildcards 63 -> 56 (-7), whole file
      29,839 -> 28,495; ratchet re-banked. RESIDUAL (the RQ-58-SPLIT input,
      measured not guessed): select_with_stack's i32 add/sub/mul/and/or/xor
      arms (hand-written imm-fold shapes, never DSL-wired), its i32.rotl arm,
      and its i32-comparison imm-fold (#258 cmp/cmn) fallback emission;
      select_default's blind-Cmp i32 comparison + i32.eqz arms and its
      fixed-pair i64 mul/shl/shr_u/shr_s/rotl/rotr/clz/ctz/popcnt arms
      (production-unreachable via compile paths — select_with_stack matches
      those ops before its fallthrough — but live via the pub select() API).
    status: implemented
    release: v0.58
    tags: [north-star, subtraction, vcr-sel-001, byte-identical]
    links:
