artifacts:
  - id: RQ-63-LADDER
    type: system-req
    title: "Acceptance is a ladder, not a number — the published census used one invocation and under-reports ARM by ~3x"
    description: >
      Increment 1 of v0.63, and it must land before any capability work cites a
      figure, because the figure v0.62 published is wrong in a specific and
      correctable way.

      WHAT WAS PUBLISHED: RQ-62-REACH's census reported arm 11%, riscv 16%,
      aarch64 19% over a 243-module local corpus, measured with ONE fixed
      invocation (`--all-exports --relocatable`).

      WHAT A LADDER SHOWS on the same corpus (60-module sample):

        arm     default 8  | +embedder-ack 18 | +allow-skipped 2 | NEVER 32
        riscv   default 11 | +embedder-ack  0 | +allow-skipped 7 | NEVER 42
        aarch64 default 13 | +embedder-ack  0 | +allow-skipped 3 | NEVER 44

      `--embedder-data-init` / `--embedder-global-init` MORE THAN TRIPLE arm
      (8 -> 26). Sampled directly: 22 of 22 modules declining on #1041/#1052
      ACCEPT once the flags are passed; 0 remain. Those modules compile today.

      WHY THAT IS A REPORTING DEFECT AND NOT A SETTING. The flag is an
      ACKNOWLEDGEMENT of an embedder obligation — the #952/#1041/#1052
      honest-refusal pattern jess named as unusually good design ("refuse by
      default; the flag is an acknowledgement, not a behaviour change; emitted
      code byte-identical either way"). Counting an unacknowledged obligation
      as a CAPABILITY decline says synth cannot compile work it demonstrably
      can, and it is the same corpus and the same compiler producing both
      numbers.

      THE RUNGS MEAN DIFFERENT THINGS and must not be summed:
        * default            — the envelope a consumer gets with no promises made
        * +embedder-ack      — compiles, IF the embedder accepts a stated duty
        * +allow-skipped     — a PARTIAL object; a third state, not a pass
        * NEVER              — the only honest denominator for "unsupported"
      `--no-optimize` adds ZERO on all three backends: the two selector paths
      (#197) differ in output, not in acceptance. Worth publishing as a
      negative result.

      DELIVERABLE: replace the single-number census with a flag-aware matrix
      over the FULL 243, per backend, with the NEVER bucket broken down by root
      cause. Correct the figures on #1017 and in RQ-62-REACH's record rather
      than leaving two incompatible numbers in the tree. State the denominator
      and its provenance as prominently as the rates, per the compliance
      envelope.

      THE SAMPLE IS NOT THE MEASUREMENT. The ladder above is 60 of 243, and it
      was produced after TWO attempts that returned confident wrong numbers (a
      `break` that never fired; `-o /dev/null` breaking synth's
      safety-manifest sidecar so every aarch64 compile "failed" AFTER emitting
      a valid ELF — a regression was nearly reported that did not exist). Run
      the full corpus, and make the harness's own failure modes visible rather
      than trusting an exit code.

      NOT IN SCOPE: fixing anything the matrix reveals. Report and stop — the
      capability artifacts in this release cite this measurement, not the
      sample.
    status: implemented
    release: v0.63
    tags: [reach, acceptance, census, measurement, compliance-envelope]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      verification-track: review
      issue: "#1017"
      done-when: "manual: a flag-aware acceptance matrix over the full 243-module corpus is published per backend with the NEVER bucket attributed by root cause, the rungs are reported separately rather than summed, and #1017 plus RQ-62-REACH's figures are corrected rather than left contradictory"
      landed: >-
        PR #1169 (harness: `--ladder` mode on partial_census_1017.py, reusing
        its discovery/classify/primary_blocker rather than adding a second
        census) + PR #1173 (the measurement, published as
        docs/status/ACCEPTANCE_LADDER.md).
      verified-by: >-
        FULL 243-MODULE CORPUS measured on the final v0.63 binary (e3a09ac2,
        all capability work merged), all three backends, rungs reported
        SEPARATELY:
          arm      default 27 (11.1%) | +embedder-ack +72 -> 99 (40.7%)
                   | +allow-skipped +3 | +no-opt +0 | NEVER 141
          riscv    default 50 (20.6%) | +embedder-ack +0
                   | +allow-skipped +11 | +no-opt +0 | NEVER 182
          aarch64  default 49 (20.2%) | +embedder-ack +0
                   | +allow-skipped +1 | +no-opt +0 | NEVER 193
        THE HEADLINE: acknowledging the embedder obligation nearly QUADRUPLES
        arm — 27 -> 99 modules. v0.62 published 11% measured with one fixed
        invocation; the 60-module sample in this release's descriptor
        predicted "more than triple" and the full corpus gives 3.7x.
        `--no-optimize` adds ZERO on every backend.
        The NEVER bucket is attributed from the MOST PERMISSIVE invocation, so
        a blocker surviving every flag is a real gap and not a missing
        acknowledgement; the per-backend breakdowns are in the published doc.
        CORRECTION TO THE PRIOR FIGURES, stated rather than left contradictory:
        arm stays 27 (RQ-63-ARMI64OFF cleared 46 blocked modules and gained
        ZERO reach), riscv 40 -> 50 (RQ-63-RVGLOBAL), aarch64 46 -> 49
        (RQ-63-A64STACK). A BLOCKER COUNT IS NOT A REACH ESTIMATE — the census
        records only the first decline per function, so clearing a top blocker
        reveals the next layer rather than adding its count. aarch64's
        MemoryCopy went 45 -> 106 without anyone touching MemoryCopy.
