artifacts:
  - id: RQ-63-SPECFAM
    type: system-req
    title: "The spec-suite census publishes ONE aggregate that hides the number governing the roadmap — MVP core is 14 of 114, and nothing says so"
    description: >
      Measured 2026-09-06 on v0.62.0 (fdcefa67) while planning this release,
      by grouping the existing census by WASM feature family. No new
      classifier was written — `scripts/spec_compile_census.py`'s own
      `classify()` was imported and reused, because a second classifier is a
      second source of truth to forget to update.

      `spec_compile_census.py` reports nine buckets summed over all 257
      top-level `.wast` files and the docs cite ONE derived number:
      `at-least-one-export = 92`. That number is correct, CI-gated, and
      pinned. It is also the wrong number to plan from, because it averages
      two populations that should never be averaged: features synth TARGETS
      and features synth has never implemented at all.

      Split by family (arm / riscv / aarch64, files fully-`ok`):

        MVP core             114 files    15 / 12 / 21
        SIMD                  59 files     0 /  0 /  0
        reference types       27 files     2 /  1 /  1
        GC                    16 files     0 /  0 /  0
        bulk memory           15 files     5 /  0 /  1
        memory64              14 files     1 /  0 /  4
        relaxed SIMD           4 files     0 /  0 /  0
        exception handling     4 files     0 /  0 /  0
        tail call              3 files     0 /  0 /  0

      TWO FACTS THE AGGREGATE HIDES, and they point in opposite directions.

      (1) **MVP CORE IS 15 OF 114 FULLY-OK ON ARM.** The scalar foundation
      every other family rests on is 13 % complete by this measure. That is
      the single most decision-relevant number in the project and it appears
      nowhere — not in the README, not in FEATURE_MATRIX, not in claims.yaml.
      Every "should we add X" conversation is currently held without it.

      (2) **86 FILES — 33 % OF THE SUITE — ARE FAMILIES WITH ZERO SUPPORT ON
      ANY BACKEND** (SIMD 59, GC 16, relaxed 4, EH 4, tail-call 3). Those
      files depress the aggregate while representing work that was never
      scoped. A reader cannot tell the 92/257 apart from a compiler that
      tries everything and half-fails; the truth is a compiler that does one
      family deliberately and declines the rest, which is the loud-decline
      stance the compliance envelope already claims as a differentiator.

      SAME CLASS AS RQ-63-LADDER, one level up. That artifact found the
      acceptance rate under-reported because it was measured with ONE
      invocation. This one finds the spec-compile rate MIS-reported because it
      is published as ONE population. In both cases the number is honest and
      the aggregation is what misleads — and in both cases the fix is to
      publish the denominator's structure, not to move the number.

      NOT A NEW MEASUREMENT SYSTEM. The census already computes everything
      needed; the family grouping is a presentation the script does not emit.
      Add the per-family breakdown to its output and to the docs it feeds, and
      pin the MVP-core figure specifically so it cannot rot behind a green
      aggregate — the #1095 failure this census was built to fix, recurring
      one level in.
    status: implemented
    release: v0.63
    tags: [census, spec-suite, measurement, denominator]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      verification-track: review
      issue: "#1095"
      done-when: "contains:scripts/spec_compile_census.py:per-family"
      landed: >-
        PR #1173 — `spec_compile_census.py` emits the per-family split
        (`report_by_family`, reporting only — the existing pins remain THE
        gate, because a second gate on the same measurement would be a second
        source of truth for it); published as
        docs/status/SPEC_FAMILY_CENSUS.md; the MVP-core figure pinned in
        claims.yaml as SYNTH-SPEC-FAMILY-MVP-CORE.
      verified-by: >-
        MEASURED on the final v0.63 binary (e3a09ac2), all 257 spec files,
        three backends, POST-#1168 — the pre-v0.63 figures were taken on a
        path that under-compiled and are not comparable.
        MVP core 114 files: arm 14 ok / 39 partial, riscv 11 / 38,
        aarch64 21 / 17. SIMD 59 files: 0 ok on every backend. GC 16: 0 ok.
        relaxed SIMD 4, exception handling 4, tail call 3: 0 ok.
        THE TWO FACTS THE AGGREGATE HID, now both pinned:
        (a) MVP CORE IS 14 OF 114 ON ARM — 12 %, the scalar foundation every
        other family rests on, and the reason VCR-SIMD-001 is gated on the
        core rather than on appetite;
        (b) 86 FILES — 33 % OF THE SUITE — are families with ZERO support on
        any backend, which is a declared BOUNDARY and not a failure, and
        stating it as one is more honest than leaving it inside an average.
        The census still RESULT: PASS on all three backends with the family
        split emitted, so the split did not perturb the gate. claim_check
        59/59 with SYNTH-SPEC-FAMILY-MVP-CORE added.
        NOT COMPARABLE TO THE ACCEPTANCE LADDER, and the doc says so: this is
        the 257-file conformance suite under one invocation; the ladder is the
        243-module reachable corpus, flag-aware. Quoting one as the other is
        the error the pair exists to prevent.
