artifacts:
  - id: RQ-70-PAGELIB
    type: system-req
    title: "The custom-page-size refusal lives only in the CLI; a caller of the PUBLISHED synth-core still gets it silently ignored"
    description: >
      DISCLOSED IN v0.69 rather than discovered now — RQ-69-PAGESIZE carries a
      `layer-residual:` field saying exactly this, and the v0.69 cold review
      flagged that the CHANGELOG's "refused on every path" reads wider than the
      code.

      VERIFIED AT SOURCE on the v0.69.0 tree: `refuse_custom_page_size` and
      `refuse_shared_memory` live in `crates/synth-cli/src/main.rs`.
      `synth-core/src/wasm_decoder.rs` DECODES `page_size_log2` into
      `WasmMemory` and does not refuse on it — its own comment says the field is
      "Consumed by `refuse_custom_page_size` in `synth-cli`".

      WHY IT MATTERS AND WHY IT IS THE SAME BUG TWICE: RQ-69-PMPLIB, in that
      same release, closed exactly this shape for `--safety-bounds pmp` on the
      stated principle that the published library is a user-visible surface. The
      two artifacts applied opposite standards. gale asked for the CLI refusal
      first and page-granular sizing second, so the ordering was right; the
      residual is that the library layer never followed.

      SCOPE NOTE: this belongs WITH gale's page-granular sizing work
      (REQ-OS-MULTITENANT-001, #1145), not ahead of it. Consult the downstream
      before scoping — v0.68's MPUHONEST rested on a stale premise for want of
      that.
    status: proposed
    release: v0.70
    tags:
      - published-library
      - refusal-honesty
      - multi-memory
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#1315"
      done-when: "manual: a library caller of synth-core gets the same refusal the CLI gives for a custom page size and a shared memory — red-first, by a test that passes today and fails once the refusal moves down a layer — or gale confirms on #1145 that the CLI-only refusal is sufficient for the sizing work, and that is recorded"
