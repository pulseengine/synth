    issue: '#1331'
    done-when: file:scripts/repro/npa_static_f32_1331.wat
    landed: '#1331'
    verified-by: |-
      The fixture's presence in scripts/repro/ arms the outcome gate:
      `arm_corpus_sweep_973.py` (`# ci-status: wired`) compiles every scripts/repro/*.wat
      and reds on any decline not on EXPECTED_DECLINES, and this module is deliberately
      not on that list. Verified red-first by compiling the same fixture with a pre-fix
      binary (2 of 2 skipped, rc=1) and post-fix (rc=0, 813-byte object). A `contains:`
      into select_with_stack.rs was rejected as the signature for the reason R9 states:
      code-existence cannot fail on this artifact's own definition of failure.
