artifacts:
- id: RQ-70-NPA
  type: system-req
  title: Static-data f32.load/f32.store now relocate under the native-pointer ABI — cpetig's blocked exports
    go 4 of 6 to 2, and the two that remain hit a DIFFERENT, named wall
  description: |-
    REPRODUCED first, on the reporter's own command line
    (`--target cortex-m7 --relocatable --all-exports --native-pointer-abi`) and their
    module — and the issue's own excerpt UNDERCOUNTS, exactly as #1318's did:

      reported in the issue:   2 functions
      [REPORTER-ONLY — the module is an issue attachment (input.zip), not committed;
       the committed `npa_static_f32_1331.wat` reproduces the SHAPE, not these counts.
       RQ-70-FALCONCORPUS makes this criticism of v0.69 and it applies here too.]
      measured on fb9af784:    6 of 22 functions, 4 of 6 EXPORTS, rc=1 via #952,
                               NO object emitted
      reasons:                 4x f32.load and 3x f32.store "from/to the static-data
                               region under the native-pointer ABI"

    AFTER, same command line, same module:

      2 of 22 functions, 2 of 6 EXPORTS skipped
      `rate#tick` and `attitude#tick` now compile; ZERO f32 static-data declines remain

    REPORTER-CONFIRMED 2026-09-19, AND THE PREDICTED NEXT WALL IS THE ONE THEY HIT.
    cpetig rebuilt from c18c185e and reported: "The f32 static-data declines are
    gone ... the `GI-FPU-002 phase 1b` messages from the original report are gone."
    They also name what now blocks `--native-pointer-abi` on their module:
    `LdrSym literal pool out of range (#345)` in a single 50722-byte function —
    which is exactly the wall this artifact predicted rather than a surprise.
    #1331 therefore STAYS OPEN, and it stays open on the reporter's own evidence.

    THE ASKED-AND-UNANSWERED QUESTION WAS ANSWERED BY DEMONSTRATION. v0.70 asked
    whether `--native-pointer-abi` is load-bearing for their build or merely
    preferred; no reply came, and the artifact was scoped without one. The
    2026-09-19 comment settles it: they are shipping via
    `--embedder-data-init --embedder-global-init`, which gives them rc=0 with 0
    skipped today. So the NPA route is a PREFERENCE blocker, not a hard one — a
    fact that should have lowered this lane's priority against ALIAS had it
    arrived in time, and is recorded here so the v0.71 ranking starts from it
    rather than re-deriving it.

    THE MACHINERY ALREADY EXISTED AND THE FLOAT ARMS WERE SIMPLY NEVER GIVEN IT.
    `emit_wasm_data_addr` relocates a base to `__synth_wasm_data + offset` (the ELF
    builder retargets it to the owning segment symbol); the i32 sub-word arms got it
    in #744 and the i64 arms in #746, both under #739. The float arms declined
    LOUDLY instead — and that decline was RIGHT, not lazy: the raw
    `[R11 + addr + #offset]` path BAKES the linmem offset as an un-relocated
    MOVW/MOVT immediate, which mis-addresses the moment the linker places the region
    and is invisible to BOTH the #678 `--shadow-stack-size` down-shift and the
    post-link in-range oracle, because each walks RELOCATIONS. Baking would have
    been the #739 silent OOB. So this ships the relocation, not the bake.

    AND NO FLOAT ADDRESS MACHINERY WAS NEEDED. Both arms already route the 4 bytes
    through a CORE register and bit-cast (`VMOV Sd,Rd` / `VMOV Rn,Sn`) — the
    existing comment says why: "VLDR takes only a `[Rn,#imm]` address ... so rather
    than reinvent the address machinery we LOAD the 4-byte word with the PROVEN
    integer path". Only HOW THE ADDRESS IS FORMED changed; the bit-cast tail is
    untouched, so the loaded and stored bytes are identical by construction.

    THE TWO THAT REMAIN, AND WHY THIS IS NOT CLAIMED CLOSED. `position#tick` and
    `ekf#estimate` now reach a DIFFERENT ceiling:

      LdrSym literal pool out of range (#345): imm12=11744 > 4095 for symbol __synth_globals
      LdrSym literal pool out of range (#345): imm12=4344  > 4095 for symbol __synth_globals

    The f32 decline was HIDING this. Did the relocation's own pool entries cause it?
    The magnitude answers: `imm12` is the PC-to-pool distance, so 11744 means the
    function is roughly 11 KB of code, and each relocated access adds at most ONE
    4-byte pool word. Even a generous 50 added entries (200 bytes) leaves ~11.5 KB —
    still ~3x over the 4095 limit. This is a FUNCTION-SIZE wall (#345), pre-existing
    and merely unmasked. Reported to the reporter as a named ceiling they can act on
    rather than as a closed gap.

    RED-FIRST, committed: `scripts/repro/npa_static_f32_1331.wat`, a 12-code-line
    reduction carrying one dynamic-index `f32.load` and one `f32.store` at a memarg
    offset above the SP global's initializer. Pre-fix it skips 2 of 2 functions with
    exactly the two decline strings from the reporter's module and fails via #952;
    post-fix it emits an 813-byte object. It is NOT on EXPECTED_DECLINES, so the
    wired ARM corpus sweep reds if this regresses.

    The CONST static-data address declines (#237, `try_fold_const_addr`) are
    deliberately left as they are: a different address mode, and measured to fire on
    none of the seven.

    COMPLIANCE ENVELOPE — STATED BECAUSE IT CHANGED. The new f32 branches emit a raw
    `Ldr`/`Str [base,#0]` and bypass `generate_load_with_bounds_check` /
    `generate_store_with_bounds_check` entirely. So under `--native-pointer-abi
    --safety-bounds software|mask`, an f32 static-data access that previously
    LOUD-DECLINED now emits an UNGUARDED access. This is a CLASS EXTENSION, not a new
    class: the i32 (#744) and i64 (#746) static-data arms have always done exactly
    this, and the relocated address is compiler-derived rather than attacker-derived.
    It is recorded here because CLAUDE.md requires the envelope be stated whenever it
    moves, and because trading a loud decline for a silent unguarded access is
    precisely the shape this project refuses to let pass unnoticed. Narrowing it —
    routing the relocated base through the guard path — is follow-up on #1331, not
    something this release claims.
  status: implemented
  release: v0.70
  tags:
  - downstream-blocker
  - external-reporter
  - arm
  - relocatable
  - feature-loop
  links:
  - type: derives-from
    target: BR-001
  fields:
    req-type: functional
    priority: must
    verification-track: differential
    issue: '#1331'
    done-when: file:scripts/repro/npa_static_f32_1331.wat
    landed: '#1331'
    # RQ-71-ISSUESCOPE (#1250): the artifact's scope shipped; the ISSUE is
    # wider — --native-pointer-abi still hits the #345 literal-pool wall, which is RQ-71-ISLANDS and deferred with measurements.
    issue-scope: outlives
    verified-by: |-
      The fixture's presence in scripts/repro/ arms the outcome gate:
      `arm_corpus_sweep_973.py` (`# ci-status: wired`) compiles every scripts/repro/*.wat
      and reds on any decline not on EXPECTED_DECLINES, and this module is deliberately
      not on that list. Verified red-first by compiling the same fixture with a pre-fix
      binary (2 of 2 skipped, rc=1) and post-fix (rc=0, 813-byte object). A `contains:`
      into select_with_stack.rs was rejected as the signature for the reason R9 states:
      code-existence cannot fail on this artifact's own definition of failure.
