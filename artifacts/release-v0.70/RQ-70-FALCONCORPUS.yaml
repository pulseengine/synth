    verified-by: |-
      The signature names the SECOND of the two committed reductions, because that is
      the one this PR lands (the first, spill_slot_alias_1321.wat, ships with
      RQ-70-ALIAS). Both are compiled by `arm_corpus_sweep_973.py` (`# ci-status:
      wired`) on every run and neither is on EXPECTED_DECLINES, so a regression in
      either reporter-facing gap reds CI with the fixture named — which is precisely
      the property v0.69's numbers lacked. The three-population census is re-derivable
      by globbing scripts/repro/ and grepping the thirteen scripts named above.
