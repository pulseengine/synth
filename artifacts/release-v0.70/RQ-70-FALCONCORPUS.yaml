artifacts:
- id: RQ-70-FALCONCORPUS
  type: system-req
  title: v0.69's headline numbers were not re-derivable, and "the corpus" names THREE different populations
    — two reduced fixtures land, the ambiguity is measured
  description: |-
    TWO FINDINGS, both re-derived at source rather than restated.

    ## 1. The reporter's modules were never committed, so FALCON's figures stand
    alone

    `git diff --name-status v0.68.0..v0.69.0 -- scripts/repro` adds FOUR files, not
    the two this artifact first claimed: PAGESIZE's `custom_page_size_1315.wat` and
    `shared_memory_1315.wat`, plus `prose_status_claim_1319.py` and
    `proven_safe_fixture_race_1309.py`. The correction does not soften the finding —
    none of the four is a falcon module.
    cpetig's `fused.wasm` and `opt.wasm` live on an issue attachment, so FALCON's
    826 identical / 209 identically failing / 0 changed, and
    its 1-of-21 and 7-of-17 skip counts, cannot be reproduced from this repository by
    anyone — and FALCON was one of v0.69's TWO `must` artifacts (RQ-69-FALCON and
    RQ-69-PAGESIZE, the latter `implemented` with a `landed:`).

    WHAT v0.70 DOES ABOUT IT: the honest route B, taken twice. Both of this release's
    downstream blockers now have a COMMITTED REDUCTION that reproduces the reporter's
    decline:

      scripts/repro/spill_slot_alias_1321.wat   54 lines — reproduces the VCR-RA-003
          SpillSlotAliased refusal on `falcon-cascade#step`. Pre-fix: rc=1, no
          object. Post-fix: an 830-byte object.
      scripts/repro/npa_static_f32_1331.wat     12 code lines (41 total) — reproduces the
          native-pointer static-data f32.load/f32.store decline, both strings.
          Pre-fix: 2 of 2 skipped via #952. Post-fix: an 813-byte object.

    Neither is on `EXPECTED_DECLINES`, so the wired ARM corpus sweep reds if either
    regresses — verified by running that sweep against the pre-fix binaries, which
    fails with `PHASE A NEW DECLINE` naming the fixture.

    RESIDUAL, NAMED RATHER THAN CLOSED: the reduction reproduces the DECLINE, not the
    reporter's whole module. FALCON's 826/209/0 remain non-re-derivable, and this
    artifact does not claim otherwise. Committing the modules themselves still needs
    the reporter's agreement and has not been asked for.

    ## 2. "The corpus" names THREE populations, and prose never says which

    The v0.69 planning noted two; the census finds three. Measured over every
    committed script that walks `scripts/repro/`:

      POPULATION A — `*.wat` only (193 modules AT v0.69.0):  7 scripts
          byte_triage_242.py, determinism_check.py, gen_home_alias_class_1189.py,
          arm_corpus_sweep_973.py, home_alias_audit_corpus_1189.py,
          macho_host_link_rq64_differential.py, tier_census_1021.py
      POPULATION B — `*.wat` + `*.wasm` (209 modules AT v0.69.0):  5 scripts
          mutation_survey.py, self_contained_boot_sweep_1189_differential.py,
          vcr_dec_001_join_alloc_measure.py, vcr_ver_004_shipping_path_audit.py,
          tied_web_census_242.py
      POPULATION C — `*.wasm` only:  1 script
          partial_census_1017.py

    That is how FALCON's "1035 = 207 x 5" and SUBTRACT's "965 = 193 x 5" were both
    called "the corpus" in the SAME release and differ by 70 compiles.

    AND EVERY ONE OF THOSE FIGURES IS ALREADY STALE, which is the point. Counted
    with the SAME non-recursive glob the scripts use (`REPRO.glob("*.wat")` — a
    recursive count differs again, because scripts/repro has subdirectories):

        at v0.69.0        A=193  B=209    x5 = 965 / 1045
        at main today     A=194  B=210    x5 = 970 / 1050
        with this PR      A=195  B=211    x5 = 975 / 1055

    So the plan's "1035 = 207 x 5" was right for the tree it was measured on and
    wrong two releases later, and even "965" moves every time a fixture lands —
    including the two this release adds. A number attributed to "the corpus"
    cannot be checked, because "the corpus" is not one thing and is not fixed.

    NOT UNIFIED, DELIBERATELY. The populations differ for reasons: byte-triage needs
    two binaries per module and a `.wasm` has no second source, while the mutation
    survey wants every module it can reach. Collapsing them would move measured
    numbers across a dozen pinned gates for no correctness gain. The defect is the
    unnamed attribution in PROSE, not the existence of two globs — so the deliverable
    is the census, published here and citable, rather than a refactor that would
    churn every pin in claims.yaml.
