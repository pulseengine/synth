artifacts:
- id: RQ-70-RIVETNOTES
  type: system-req
  title: The CHANGELOG is hand-written prose about a typed artifact set rivet can diff — and the diff
    nobody ran reports 22 new warnings v0.69 shipped unseen
  description: |-
    The CHANGELOG's per-release section is hand-written prose ABOUT A TYPED SET rivet
    can diff. Every release someone re-types which artifacts landed — and v0.66 filed
    two of its OWN artifacts under `[Unreleased]` because the list was remembered
    rather than derived. The artifacts are structured data; the diff is a command.

    WHAT SHIPS: `scripts/release_notes_from_rivet.py`, which extracts the previous
    tag's rivet sources with `git archive` (bounded by the paths rivet.yaml itself
    declares, so a moved source is a loud extract failure and not a silently narrower
    diff), runs `rivet diff`, and emits the CHANGELOG section — the artifact list AND
    the trace-graph delta.

    THE DELTA IS THE PART NOBODY HAD LOOKED AT. Measured with the pinned rivet 0.37.0
    between v0.69.0 and this tree: 8 added, 0 removed, 0 modified, 0 new ERRORS —
    and 22 NEW WARNINGS, in three classes this release had shipped unseen:

      - `id 'RQ-70-X' can't be used as a commit-trailer reference` — one per
        artifact. The RQ-NN-NAME convention is not trailer-shaped, so rivet cannot
        trace these through commits. The SAME convention RQ-70-WINDOWVAC just had to
        teach status_evidence, found independently from the other side.
      - `field 'req-type' has value 'process', allowed: [functional, performance,
        interface, constraint, safety]` — five artifacts use a value the schema does
        not define.
      - `Every system requirement should be verified by at least one verification
        measure` — no incoming `verifies` link, on every one.

    None is fixed here; all are now REPORTED, which is the difference between a
    release that knows whether it improved the trace graph and one that does not.

    THE VERSION CHECK IS THE LOAD-BEARING PART, and it is not hygiene. A developer
    machine's `~/.cargo/bin/rivet` is routinely stale — this session's was 0.32.0
    while CI pins 0.37.0, the #1236/#1308 PATH-shadow class — and an old rivet does
    not merely miss findings: 0.32 reports "0 broken cross-refs" on a tree where
    resolution never RAN, which reads as a clean bill of health. So the generator
    REFUSES a rivet older than the CI pin, demonstrated live:

      $ python3 scripts/release_notes_from_rivet.py --base v0.69.0 --rivet rivet
      FAIL: rivet 0.32.0 is older than the CI pin 0.37.0 ...

    and the pin is RE-DERIVED from ci.yml by
    `test_release_notes_from_rivet.py::test_pin_is_not_below_ci` rather than
    restated, so the two cannot drift apart behind a green gate — the
    second-source-of-truth failure this repo keeps finding.

    ANTI-VACUITY: a derivation that finds ZERO added artifacts REFUSES rather than
    emitting an empty section. Zero added means the base tag is wrong, the sources
    moved, or the extract failed — never that a release shipped nothing. An empty
    section that read as "nothing shipped" is precisely the silent-success shape.
  status: implemented
  release: v0.70
  tags:
  - traceability
  - release-notes
  - gate-potency
  - rivet
  - feature-loop
  links:
  - type: derives-from
    target: BR-001
  fields:
    req-type: process
    priority: should
    verification-track: differential
    issue: '#1337'
    done-when: contains:scripts/release_notes_from_rivet.py:PINNED_RIVET
    landed: '#1337'
    verified-by: |-
      The signature names the version pin because that is the part whose failure is
      SILENT: a wrong artifact list is visible in review, while a stale rivet emits a
      confidently clean graph nobody would question. Pinned by
      `scripts/test_release_notes_from_rivet.py` (8 tests, wired in ci.yml beside the
      loop-conformance and status-evidence potency tests), whose load-bearing case
      re-derives PINNED_RIVET from ci.yml so the generator cannot drift below the
      version CI installs. Both refusals were demonstrated live before this was
      written: the stale 0.32.0 on PATH is refused, the pinned 0.37.0 emits.
