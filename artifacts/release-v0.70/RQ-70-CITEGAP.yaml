artifacts:
- id: RQ-70-CITEGAP
  type: system-req
  title: artifact_citation_check globs artifacts/*.yaml NON-recursively, so it has never scanned a single
    release artifact since v0.61
  description: |-
    THREE defects, each re-derived at source before this was written — and the third
    was found only BECAUSE the first two were fixed first.

    1. THE GLOB IS NON-RECURSIVE. `artifacts/*.yaml` sees 30 of 135 artifact files.
       Every release since v0.61 files under `artifacts/release-vX.Y/`, so 105 files
       are invisible — including ALL 10 of v0.69's and ALL 8 of v0.70's.

    2. IT READS ONLY `run:` KEYS. No release artifact has ever had one; they cite
       under `done-when:` and `verified-by:`. This hid a citation even in a file the
       old glob COULD see.

    3. IT HAS ONE CITATION FORM, AND RELEASE ARTIFACTS USE TWO. `--test <target>`
       names an integration-test FILE (`crates/*/tests/<target>.rs`); `--lib
       <filter>` and `-- <filter>` are substrings over test PATHS. Measured on
       v0.69's five citations: `--lib ra003` resolves as a substring, the four
       `--test` target names do NOT. Widening the glob ALONE would have produced
       FOUR FALSE FAILURES on perfectly valid citations.

    RED-FIRST, run before any of this landed: planting
    `--test this_test_does_not_exist_9999` into `implemented`
    artifacts/release-v0.69/RQ-69-ELFNAMES.yaml left the gate at rc=0, still printing
    "every cited test filter resolves to at least one test." After the fix the same
    plant reds with the artifact, its status and the missing target file named.

    A FALSE FAILURE THE WIDENING CAUSED, AND THE SCAN BUG BEHIND IT. With the glob
    and keys fixed, SWVER-016 reported `--lib dwarf_line::` as dangling. It is
    valid: `crates/synth-core/src/dwarf_line.rs` holds 3 `#[test]` fns and lib.rs
    declares `pub mod dwarf_line`, so the real path is `dwarf_line::tests::<fn>`.
    The scan built module paths only from `mod` DECLARATIONS, never from the FILE,
    so it recorded `tests::<fn>` and missed it. Fixed by recording the file-derived
    module path too — test names 5233 -> 7224. That is the header's promised safe
    direction working exactly as documented: the approximation failed LOUDLY.

    WHY CLAIM-BEARING KEYS AND NOT ALL PROSE: RQ-69-PROSEGATE refuted the
    prose-scanning shape one release ago — a gate reading DESCRIPTION cannot tell a
    CLAIM from a MENTION, and flagged its own artifact four times. `run`/`done-when`/
    `verified-by` are where an artifact POINTS AT evidence; `description` is where it
    talks about it. This artifact names test filters in its own prose and must not be
    held to them.

    AFTER: 135 files scanned, 33 citations (15 target, 18 filter) over 7224 test
    names and 133 test targets, 0 false claims, 1 pre-existing planned-but-unwritten
    note. BEFORE: 30 files, 12 citations, and no release artifact ever looked at.
  status: implemented
  release: v0.70
  tags:
  - gate-potency
  - release-gate
  - cold-review-finding
  - feature-loop
  links:
  - type: derives-from
    target: BR-001
  fields:
    req-type: process
    priority: should
    verification-track: differential
    issue: '#1333'
    done-when: contains:scripts/artifact_citation_check.py:CARGO_TEST_TARGET
    verified-by: |-
      The signature names the target/filter split (#1333 defect 3) because that is the
      part a regression would silently undo: reverting the recursive glob reds
      immediately via the planted-citation test, but conflating the two namespaces
      again would produce false failures that invite widening an exemption instead.
      `artifact_citation_check.py` is `Claim Check`-wired in ci.yml.
    landed: '#1333'
