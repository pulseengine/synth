artifacts:
- id: RQ-70-DONEWHEN
  type: system-req
  title: Every done-when has been `manual:` since v0.66, so R3 cannot fire — and the conformance gate
    counts declarations, not evaluations
  description: |-
    THE MEASURED ANSWER THE BRIEF ASKED FOR: the 100% is mostly a property of the
    HABIT, and the compound predicates are genuinely good. Both halves are true, and
    that is why this is not a call to ban `manual:`.

    Manual share per release, derived: v0.61 12/15, v0.62 7/10, v0.63 8/12,
    v0.64 7/10, v0.65 5/8, v0.66 8/8, v0.67 7/7, v0.68 9/9, v0.69 9/9.

    READING ALL NINE v0.69 PREDICATES: each is a COMPOUND acceptance statement —
    red-first AND a class sweep AND a named ceiling AND an execution differential.
    No single `contains:` could carry one, and flattening them would lose the part
    that makes them good. That is the habit's honest half.

    But most carry a MECHANICAL CONJUNCT that was written in prose and checked by
    nothing: ELFNAMES names `--test every_section_header_is_named_1307`, PAGESIZE
    `--test refuses_custom_page_size_1315`, PMPLIB `--test mpu_honest_1284` and
    `--test pmp_is_not_an_alias_1317`, VFPUNKNOWN `--lib ra003`, and SUBTRACT's
    "`selector_lines_code` falls by the measured amount" IS a claims.yaml ratchet.
    Five real test citations, none under a key any gate read — which is precisely
    what RQ-70-CITEGAP measured from the other side. The evidence existed; `manual:`
    was where it went to not be checked.

    SO THE DELIVERABLE IS NOT A BAN, IT IS HONEST OUTPUT. `loop_conformance_check`
    step 3 printed `{total} artifacts, {total}/{total} done-when` from FIELD
    PRESENCE. A `manual:` signature is present and evaluated by nothing —
    status_evidence's R3 fires only on `contains:`/`file:` — so four releases in
    which NOTHING was machine-checked printed the same line as one in which
    everything was. It now prints, on v0.69.0:

      9 artifacts, 9/9 done-when DECLARED — 0 mechanically evaluable
      (contains:/file:), 9 manual: (declared only; R3 cannot fire on these)

    v0.69.0 still CONFORMS; nothing about the verdict changed, only what the gate
    admits it measured.

    THE OUTCOME, MEASURED ON THIS RELEASE RATHER THAN PREDICTED. Running the new
    census over each release's artifacts:

        v0.66  8 artifacts — 0 evaluable, 8 manual (100%)
        v0.67  7 artifacts — 0 evaluable, 7 manual (100%)
        v0.68  9 artifacts — 0 evaluable, 9 manual (100%)
        v0.69  9 artifacts — 0 evaluable, 9 manual (100%)
        v0.70  9 artifacts — 7 evaluable, 2 manual ( 22%)

    So the answer to "is the 100% a property of the work or of the habit" is: the
    HABIT, and the evidence is that it broke the moment something pushed back.
    Nothing here bans `manual:`. What changed the number is that the STANDARD R9
    states — "a predicate that cannot fail on the artifact's own definition of
    failure" — was applied by hand to RQ-70-ALIAS's first `contains:` signature and
    then to the rest, moving them onto wired oracles.

    THE GATE ITSELF WOULD NOT HAVE FORCED THIS, and saying otherwise would be the
    exact error this release is named against. MEASURED on this tree: set ALIAS's
    done-when to `contains:crates/synth-synthesis/src/liveness.rs:...` and, with its
    `verified-by` present, status_evidence exits 0 — R9 never fires. Delete the
    `verified-by` and the same signature reds it (rc=1). R9 is disarmed by ANY
    non-empty `verified-by`, and `is_crate_source()` is
    `parts[0] == "crates" and "tests" not in parts[1:]` — this artifact quoted only
    the first conjunct until the cold review restored the second. The conclusion
    below re-derives either way, but a truncated quote of a predicate is not a quote
    of it. So a
    `contains:scripts/...` — which is 4 of this release's 7 evaluable signatures — is
    outside its reach entirely. The 22% is a convention this release adopted, not a
    gate it was compelled by; R9's enforceable perimeter is filed as follow-up. The two that remain `manual:` are the two DEFERRALS (ARCHMODEL and
    PAGELIB), where no mechanical predicate exists because nothing landed.

    That is the shape worth keeping: a gate that refuses a weak signature changes
    behaviour where a rule banning a FORM would have flattened the compound
    predicates that are the honest half.

    THE RECOMMENDED PRACTICE, demonstrated in this release rather than asserted:
    keep the compound `manual:` predicate AND record its mechanical conjunct in
    `verified-by:`, which RQ-70-CITEGAP now checks. RQ-70-ALIAS is the worked
    example — its done-when started as `manual:` and ended up pointing at the wired
    corpus sweep's fixture, because a code-existence `contains:` cannot fail on that
    artifact's own definition of failure. That judgement was applied by the author
    against R9's stated standard, NOT enforced by R9 (see the measurement above).
    v0.70 is the first release since v0.65 with a non-`manual:` signature, and it got
    there by a standard applied, not by a gate compelling it.
  status: implemented
  release: v0.70
  tags:
  - gate-potency
  - release-gate
  - cold-review-finding
  - feature-loop
  links:
  - type: derives-from
    target: BR-001
  fields:
    req-type: process
    priority: should
    verification-track: review
    issue: '#1335'
    done-when: contains:scripts/loop_conformance_check.py:mechanically evaluable
    verified-by: |-
      The signature names the gate's own OUTPUT string, because the deliverable IS the
      output: the fix changes nothing about conformance, only about what the gate
      admits it checked. Pinned against regression by
      `test_done_when_declared_is_not_evaluated_1335` and
      `test_done_when_all_manual_is_zero_evaluable_1335` in
      scripts/test_loop_conformance_check.py, which ci.yml runs.
    landed: '#1335'
