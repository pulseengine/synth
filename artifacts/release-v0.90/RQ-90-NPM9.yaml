artifacts:
  - id: RQ-90-NPM9
    type: system-req
    release: v0.90
    status: proposed
    title: "The npm package publishes the release version, or its blocker is re-measured and named"
    description: >
        Carried from v0.89 (RQ-89-NPM8, blocked outside this repository). The
        npm package has not published since 0.69.0. The blocker moved at
        v0.89: the auth preflight now passes, and the publish step fails
        because the organisation's token can only publish to a staging area.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Read the
        registry (`https://registry.npmjs.org/@pulseengine/synth`,
        dist-tags.latest, and the 0.89.0, 0.89.2 and 0.69.0 version URLs) and
        the last four Release NPM runs' failing step (`gh run list --workflow
        "Release NPM"`, `gh run view --log-failed`).

        MEASURED 2026-11-06 on main 7f038605 (the v0.89.2 tag commit), synth
        0.89.2 debug build from this tree: LIVE. latest 0.69.0, 39 versions;
        0.89.0 and 0.89.2 return HTTP 404 and the control 0.69.0 returns 200.
        The last four Release NPM runs failed: 2026-11-05, 2026-10-29 and
        2026-10-22 at step 7 Publish to npm, the 2026-11-05 run with `npm
        error code E403 ... This token can only publish to a staging area. Run
        npm stage publish ... (E_STAGE_REQUIRED)`; the earlier 2026-10-22 run
        at step 4, the auth preflight.

        CITATION: #1460 is where the matter was analysed. The number names
        where it was analysed, not an open scope.

        RE-MEASURED AT RELEASE PREP, 2026-11-07T10:56Z, on main eb137389:
        BLOCKED outside this repository, carried to v0.91. The registry, read
        with the User-Agent `synth-release-check
        (+https://github.com/pulseengine/synth)`: dist-tags latest 0.69.0,
        39 versions, last modified 2026-09-18; 0.89.0, 0.89.2 and 0.90.0 each
        HTTP 404; the control 0.69.0 HTTP 200. `gh run list --workflow
        "Release NPM"`: the last publish attempt, run 42084323724
        (2026-11-05), failed in "Publish @pulseengine/synth" with `npm error
        code E403 ... This token can only publish to a staging area. Run npm
        stage publish ... (E_STAGE_REQUIRED)`. The three runs after it,
        42162764670, 42165218247 and 42182856898 (all 2026-11-06,
        workflow_run), concluded `skipped`: their publish job did not run, so
        they are not evidence either way. release-npm.yml still publishes
        with `npm publish --access public`. Still blocked: either the token
        type or the publish command has to change, and both are the
        maintainer's.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1460"
      verification-track: manual
      disposition: blocked
      done-when: >
        manual:2027-03-31 the package publishes the release version, or the
        blocker is re-measured against the live registry and the specific
        credential or workflow change that unblocks it is named — delivered
        with an execution-verified result where the lane is a wrong-code fix,
        or REFUTED with the measurement that refutes it; and the refuting
        command above is RUN FIRST and its result reported either way
