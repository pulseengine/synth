artifacts:
  - id: RQ-90-ARCHMODEL11
    type: system-req
    release: v0.90
    status: proposed
    title: "The architecture model step of the feature loop is filed for v0.90, not inherited"
    description: >
        The feature loop's architecture steps (spar AADL model and the WIT
        derived from it) have been marked not applicable release after
        release; a recurring not-applicable is a backlog item, not an
        exemption. This record files it for v0.90. Its blocker is spar#445
        (undeclared property sets are accepted silently).

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Run
        `python3 scripts/recurring_na_filing_check.py` and `gh -R
        pulseengine/spar issue view 445 --json state,updatedAt`. A current
        filing or the step performed, or spar#445 closed, changes the
        disposition.

        MEASURED 2026-11-06 on main 7f038605 (the v0.89.2 tag commit), synth
        0.89.2 debug build from this tree: FILED, NOT PERFORMED. spar#445 is
        OPEN, last updated 2026-09-03; #1136 is OPEN, last updated 2026-09-22.
        Before this record existed the filing check refused (`the release
        under cut is ambiguous: anchor+1 says v0.90 while the artifact tree's
        max says v0.89.2`); this record is the v0.90 filing it looks for.

        CITATION: #1136 is where the matter was analysed. The number names
        where it was analysed, not an open scope.

        RE-MEASURED AT RELEASE PREP, 2026-11-07T10:56Z, on main eb137389:
        FILED, NOT PERFORMED, carried. `python3
        scripts/recurring_na_filing_check.py` exits 0 with failures 0 and
        reports `steps-1-2 filing VISIBLE: RQ-90-ARCHMODEL11 (#1136, status
        proposed) scoped to v0.90`. It passes BECAUSE this record exists, so
        it says the not-applicable is visible, not that the step was done.
        No spar AADL model and no derived WIT was produced in v0.90. `gh -R
        pulseengine/spar issue view 445 --json state,updatedAt`: OPEN,
        updated 2026-09-03T10:57:37Z. #1136 is OPEN, updated
        2026-09-22T21:53:10Z. Awaited: spar#445 upstream, or a maintainer
        decision to model without it.
    tags:
      - feature-loop
      - process
      - aadl
      - spar
    links:
