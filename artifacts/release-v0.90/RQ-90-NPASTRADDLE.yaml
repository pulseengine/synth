        why the contiguous-image row was added; (C) the boundary test off by
        one (`b < last`): 70 refusal misses, exit 1. Neighbouring oracles
        on this branch, each exit 0: npa_const_addr_differential,
        npa_const_addr_matrix_1568 --expect ok=99,refused=63,guard=59,wrong=0,
        npa_offset_cross_segment_1580, verwidth_1563, static_above_sp_739,
        wide_static_746, wide_static_copy_757, mem757_rawvec_memcopy,
        mem757_gale, multi_memory_406, mem_isolation_red_1145,
        npa_multi_memory_1145, multi_memory_bulk_1145 and memk_i64_1622.
        cargo test -p synth-synthesis -p synth-cli: 1533 passed, 0 failed
        (vcr_ver_003_addr_777 15 of 15 and multi_memory_406 23 of 23 among
        them). Pins moved, each with a paired control: the exact emulation
        floor rises by the oracle's declared 88 over the superseded 398507
        (v0.89.2 cold review) to the total oracle_wiring_check.py reports;
        that total gives rc=0 and 398507 gives rc=1 on this tree, and the
        reverse holds on main c20d37b2;
        selector_lines_code 21360 -> 21509, waived, where c20d37b2 derives
        21360 and this tree 21509; selector_lines_total 32163 -> 32312. No
        wildcard arm was added, and the oracle defines no KNOWN or PINNED
        table. The mutation ledger was re-anchored: 6 sites moved, 0 not
        found. WHY outlives, chosen on purpose: the issue's two rows are
        refused, but three shapes of the same class still compile silently,
        because none has a static byte range to check. (1) A run-time base
        whose memarg offset is NOT relocated (no stack-pointer global): that
        is #1568 shape 2, carried by RQ-90-NPASHAPE2. (2) A memory.fill or
        memory.copy with a non-constant length. (3) A constant that reaches
        the access through arithmetic. #1616 named all three; this lane did
        not re-measure them. Also not measured: execution of non-relocatable
        --native-pointer-abi, which ships a dense ROM copy (#758). And the
        guard does not mirror the ELF builder's all-Abs32 condition; where
        that condition fails the image is contiguous and the guard
        over-refuses, loudly, never silently.
