artifacts:
  - id: RQ-90-SPECEXEC
    type: system-req
    release: v0.90
    status: implemented
    title: "The spec suite executes its assert_return and assert_trap directives against an exact ratchet baseline"
    description: >
        spec-suite.yml is a compile census over the 257 spec files: it
        executes none of their directives, so execution correctness has no
        external oracle in CI. The two oracles that do execute spec directives
        (#197 on cortex-m4, #928 on tests/wast) set floats aside and do not
        account for the directives they skip. This artifact makes the suite's
        own assert_return / assert_trap directives an executed gate: every
        directive is accounted for by reason, every failing one is pinned
        exactly, and the executed count can never be 0.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: `grep -c
        spec_exec .github/workflows/spec-suite.yml .github/workflows/ci.yml`
        and `git ls-files scripts/repro | grep -c spec_exec`. Any executing
        step refutes it.

        MEASURED 2026-11-06 on main 7f038605 (the v0.89.2 tag commit), synth
        0.89.2 debug build from this tree: LIVE. Both workflow counts are 0
        and no spec_exec script is tracked.

        CITATION: #1636 is where the matter was analysed. The number names
        where it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1636"
      verification-track: manual
      issue-scope: closes
      landed: "PR #1638 - #1636 - DELIVERED, the execution gate. scripts/repro/spec_exec_1636_differential.py is wired as the spec-suite.yml job `spec-suite execution (#1636)`. It accounts for all 57588 top-level assert_return/assert_trap directives of the 257 spec files on cortex-m4 (default bounds) and cortex-m7dp (--safety-bounds software). Each directive is a pass, a fail, or not-representable with a named reason, and the accounted positions must equal an independent per-file census as a SET. synth-test stats (the Rust wast crate) re-counts assert_return per file and agrees on 256 files; it cannot parse names.wast. Executed 11636 on cortex-m4 and 24044 on cortex-m7dp. The 67 failing directives are pinned in KNOWN by (leg, file, line, col, outcome). 53 are the #539 fixed-SRAM grow envelope and 14 are new wrong code: #1643 (12, call_indirect type-mismatch traps missing under iso-recursive or subtyped function types) and #1642 (2, reads after an f64.store that wrote its low word before its high-word bounds guard trapped). KNOWN joins known_open_pin_tables. On the tree rebased onto main f28f29b0: known_open_pins 78 -> 145 with a waiver, known_open_pinned_cases 144 -> 211, the KNOWN/PINNED population 12 -> 13, and the exact emulation floor rises by this oracle's declared 49125. No compiler code changed."
      verified-by: >
        DELIVERED, the execution gate. On the tree rebased onto main f28f29b0
        (after EST1206, R0CLOBBER and A32BRANCH), a full run is green: 67 failures,
        all 67 in the baseline, and no baseline movement. The runner executes
        Thumb-2 images only, so the A32 fix cannot reach it. It measured 49125
        emulations, the same count as every earlier full run; seven full runs
        across the lane gave identical counts on every leg and bucket.
        POTENCY CONTROLS, each rc 1:
        (1) An emptied suite directory reports CORPUS 0 files against a pin of 257.
        (2) A planted miscompile in the shipped Thumb-2 encoder (EOR.W reg
        encoded as ORR.W) produces 10 NEW FAILURE lines on i32.wast xor. It
        was reverted and rebuilt, with a clean tree.
        (3) Removing a still-failing KNOWN entry reports NEW FAILURE.
        (4) A KNOWN entry for a passing directive reports BASELINE ENTRY NOW PASSES.
        (5) A KNOWN entry with the wrong outcome reports BASELINE ENTRY MOVED.
        (6) An executor that silently drops one directive fails ACCOUNTING on
        the count.
        (7) A dropped directive balanced by one stray position fails ACCOUNTING
        on the position set.
        (8) A census that drops assert_trap fails ACCOUNTING.
        PAIRED CONTROLS on the rebased tree and on main f28f29b0, for the
        exact emulation floor and for known_open_pins / known_open_pinned_cases,
        are recorded in the PR #1638 body.
        REQUIRED, the criterion this record held open: #1636's last
        acceptance criterion, making the context required, was the maintainer's
        branch-protection decision, and it is made. On 2026-11-07 protection on
        main lists 10 contexts, the tenth being `spec-suite execution (#1636)`.
        PR #1669 taught ci_pool_tripwire.py's deadlock guard to resolve
        contexts across every file under .github/workflows/ and carried the
        context as PENDING_REQUIRED_CONTEXTS. Once protection listed it, the
        live tripwire failed PROMOTE on main 175af4f3. The promotion moves it into
        REQUIRED_CONTEXTS, leaves PENDING empty, and makes
        runner_redundancy_check.py import that list instead of keeping its own
        copy of nine, which it resolved in ci.yml only. A required context
        defined in no workflow still fails DEADLOCK in both scripts.
        With that, all four of #1636's acceptance criteria are met: directives
        executed on the emulated path, an exact ratchet baseline, an executed
        count asserted non-zero, and the context required. issue-scope is
        therefore `closes`.
        RESIDUALS, disclosed for a follow-up, and not #1636 acceptance criteria:
        RV32 and AArch64 legs are not built. call.wast's module at line 3 is
        refused whole on cortex-m7dp (#1102), so its float directives execute
        on no leg. Default-bounds float memory accesses execute on no leg.
      done-when: >
        manual:2027-03-31 the spec suite's assert_return and assert_trap
        directives are executed against an exact baseline with the executed
        count asserted non-zero, and whether the job joins the required checks
        is decided by the maintainer and recorded — delivered with an
        execution-verified result where the lane is a wrong-code fix, or
        REFUTED with the measurement that refutes it; and the refuting command
        above is RUN FIRST and its result reported either way
