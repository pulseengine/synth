artifacts:
  - id: RQ-90-MEMKFIXTURE
    type: system-req
    release: v0.90
    status: proposed
    title: "The memory-k i64 differential catches a dropped high word by value"
    description: >
        The v0.89.1 cold review found the memory-k i64 differential catches
        the infer_i64_locals regression only because its rev6 function runs
        out of registers and refuses. On a minimal function, an i64 local set
        from i64.load on memory 1 and returned, the same mutant compiles at rc
        0 and returns the low word in both registers, and no oracle catches
        it. Add that fixture.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Generate
        the committed fixtures (build_fixture over FIXTURES in
        scripts/repro/memk_i64_1622_differential.py) and count functions of
        the shape `(result i64) (local $x i64) (local.set $x (i64.load $m1 ...
        (local.get $p))) (local.get $x)`. A count above 0 refutes it. Positive
        control: the same pattern matches a planted line of that shape.

        MEASURED 2026-11-06 on main 7f038605 (the v0.89.2 tag commit), synth
        0.89.2 debug build from this tree: LIVE. 2 fixtures, 198 functions, 0
        of the minimal shape. The positive control matches 1.

        CITATION: #1654 is where the matter was analysed. The number names
        where it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1654"
      verification-track: manual
      issue-scope: closes
      done-when: >
        manual:2027-03-31 the differential carries the minimal i64-local
        memory-1 fixture, and the review's infer_i64_locals mutant reds it by
        value, not by a refusal — delivered with an execution-verified result
        where the lane is a wrong-code fix, or REFUTED with the measurement
        that refutes it; and the refuting command above is RUN FIRST and its
        result reported either way
