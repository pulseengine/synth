artifacts:
  - id: RQ-76-CLOSUREMAIN
    type: system-req
    release: v0.76
    status: implemented
    title: "`issue_closure_check.main()` and `open_issues_now()` are the undriven callers — an EMPTY `gh` read makes one direction vacuous and the other state a falsehood"
    description: >
      v0.75 drove `closed_since` against a recorded `gh` response and closed that gap.
      Two callers stayed undriven, and the function's own docstring says so: `main()`,
      whose EXIT CODE is what every caller consumes, and `open_issues_now()`, the live
      state source the authorised and held-open directions are judged against.

      THE DOCSTRING STATES THE FAILURE MODE MORE LOOSELY THAN THE CODE SUPPORTS, and
      the correction is the interesting part. `open_issues_now` returns None on every
      failure it anticipates — OSError, non-zero rc, parse failure — and `main()`
      guards `is None` and falls back. The unhandled case is `gh` SUCCEEDING and
      returning an empty array: a silent auth downgrade, a pagination change, a repo
      rename. Then it returns `set()`, which is not None, so no fallback fires.

      The docstring predicts "every issue would read as closed". Measured against
      `check()` it SPLITS: the authorised direction goes VACUOUS AND SILENT, because
      `n in open_issues` is false for every n so no warning is ever raised; and the
      held-open direction goes RED FOR THE WRONG REASON, asserting of a live issue that
      it "is not open". One half checks nothing and the other half states a falsehood
      about an external reporter's issue. That is worse than disclosed.

      DELIVERABLE: drive `main()` against a recorded response and assert its EXIT CODE
      in both directions, and make `open_issues_now` distinguish EMPTY from UNREADABLE
      — or make the gate refuse to judge the state-dependent directions on an empty
      read.

      NOT THE FIX: extracting the empty-check into a tested helper. v0.73 extracted
      `decide()`, v0.74 extracted `fidelity_exit()`, and v0.75 was a whole release
      about that reflex.
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      landed: "#1410"
      issue: "#1404"
      done-when: "contains:scripts/test_issue_closure_check.py:RQ-76-CLOSUREMAIN"
      verified-by: >-
        DELIVERED, and the harm is more concrete than the plan stated. `main()` is now driven and its EXIT CODE asserted in three directions: 0 for a clean judgement, 1 for a real failure (naming the issue), and a NEW exit 2 for a refusal — distinguished on purpose, because a caller must be able to tell "the gate ran and found nothing" from "the gate could not run". Red-first, applied and verified applied by diff: disabling the refusal turns three assertions RED, and the gate then prints, verbatim, `FAIL HELD OPEN BUT ALREADY CLOSED: #1318 — RQ-75-REPLAY declares issue-scope: outlives, but the issue is not open.` #1318 IS OPEN and belongs to an external reporter, so the pre-fix behaviour asserts a falsehood about a live issue of someone outside this project — worse than the vacuous pass on the other direction, and worse than the docstring predicted. The refusal covers the `--open` path too, because the hazard is in the DATA, not in where it came from. AND RUNNING THE GATE AT THE CUT FOUND A SECOND FALSE SENTENCE IN THE SAME FILE, which is why this lane grew: the release ritual closes issues AFTER the tag, because the tag is the evidence the closure comment cites, while `closed_since` opens its window AT the tag. So every release's own closure wave lands inside the NEXT release's window, where `authorised_close_set(artifacts, version)` — scoped `version != only_version` — cannot see the artifact that authorised it. Measured at this cut: v0.75.0's commit is 2026-09-25T06:52:31Z; #1223 and #1391 closed at 07:27:31Z and 07:27:33Z, 35 minutes later, by v0.75's own ritual, named by RQ-75-PROBEINPUT and RQ-75-CLOSEWINDOW. The gate reported both as `CLOSED BUT NOT AUTHORISED`, whose prescribed remedy is "Reopen it" — the SECOND time this file was one step from causing a wrong REOPENING, the first being the v0.74 day-truncated window already documented in `closed_since`. It had never fired because it needs a preceding release that actually closed issues post-tag. Closures are now ATTRIBUTED to the release whose artifact names them, and the laundering half is refused red-first: a prior release that declared `issue-scope: outlives` said explicitly DO NOT close this, so that stays a FAILURE (`HELD OPEN BY v0.70 BUT CLOSED`) and is never reported as attribution. Red-first, applied and verified applied by running the NEW tests against the PRE-FIX script: 3 of the 5 assertions go RED, including the laundering one; the two that pass pre-fix are the negative controls (an issue no release accounts for, and a LATER release's artifact) which exist to stop the fix over-reaching. Live: the gate went from rc=1 with 2 failures to rc=0 with 2 attributions naming v0.75 and its exact artifacts.
