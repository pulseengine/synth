artifacts:
  - id: RQ-76-RECORDSHAPE
    type: system-req
    release: v0.76
    status: implemented
    title: "The pool tripwire's driver can only build a job shape the real workflow never has — 262 `uses:`, 133 `with:` and 54 `if:` steps are untested, not unreachable"
    description: >
      v0.75's RQ-75-APTSHAPE fixed a POSITION blindness in the tripwire and drove its
      decision against recorded job dicts for the first time. The recording is the
      residual.

      MEASURED on the shipped tree. The only job factory in
      `scripts/test_ci_pool_tripwire.py` produces `{name, runs-on, steps}` with steps
      of `{name, run}`. `yaml.safe_load` of the live `.github/workflows/ci.yml` gives
      71 jobs and 750 steps carrying, by count: `uses` 262, `with` 133, `if` 54,
      step-level `env` 41, job-level `env` 7, `needs` 1, `timeout-minutes` 7+2,
      `id` 1, `continue-on-error` 1.

      STATED AS COUNTS DELIBERATELY. An earlier draft of this measurement reported the
      key UNIONS as though every job carried them; re-derived, ZERO of 71 jobs carry
      all six job keys and ZERO of 750 steps carry all nine. Quoting a union as if it
      described an instance is the v0.70 class and is corrected here rather than
      shipped.

      AND THE DEFECT IS NOT WHERE IT FIRST APPEARED TO BE. `job_text()` is a fully
      general recursion and WOULD collect a string sitting in a step's `with:` or a
      job-level `env:` — confirmed by execution: a synthetic job carrying
      `steps[0].with.run = "sudo apt-get install -y z"` IS flagged, as is one carrying
      it in a job-level `env:`. So those paths are UNTESTED, NOT UNREACHABLE, and the
      recording is the only thing between the gate and its own coverage.

      DELIVERABLE: drive the decision against job shapes the real file actually
      contains, including a `uses:`+`with:` installer and a job-level `env:`. Carries
      the remaining disclosure too — the `apt` spelling question is settled only by
      EXECUTING the install step under `no_new_privs`, which is a separate ask and is
      to be disclosed if not delivered.
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      landed: "#1408"
      issue: "#1062"
      # THE PLAN SAID THIS LANE "CARRIES #1062's CLOSURE". READING THE ISSUE
      # REFUTES THAT, and the correction belongs here rather than in a later
      # audit. #1062 asks for CAPACITY RELIEF — move the non-required oracle
      # sweep to `rust-cpu`, stagger lane pushes, or retarget required checks —
      # and names option 1 as the right first move. `ci_pool_tripwire.py` is the
      # SAFEGUARD built around that decision, not the relief itself: it pins the
      # ubuntu-latest share and guards the required-context deadlock. Improving
      # the tripwire's own test, which is what this lane did, moves no job off
      # ubuntu-latest. So the issue outlives the artifact and the tag must not
      # close it. v0.75 held it open for the same reason.
      issue-scope: outlives
      done-when: "contains:scripts/test_ci_pool_tripwire.py:RQ-76-RECORDSHAPE"
      verified-by: >-
        DELIVERED, and the plan's own prediction was HALF WRONG — corrected here rather than restated. Prediction: narrowing `job_text` to the `steps[].run` surface "must go RED under the new shapes and stay GREEN under the v0.75 recordings". Measured: the narrowing produces FOUR failures, THREE from the new real shapes (`uses-with`, `job-env`, `step-env`, each naming the surface `job_text` stopped reading) and ONE from a v0.75 assertion about match offset. So the v0.75 recordings were NOT blind to this narrowing; they caught it once, without naming which surface broke. The `guarded` shape correctly does NOT fail, because its command sits in `steps[].run`, which the narrowing still reads. THE ACCEPTANCE MUTATION IS THE OTHER ONE, and it is the one the theme actually demands: adding a job-level `strategy:` to the live `ci.yml` — a key no recorded shape can produce — turns the coverage check RED with `uncovered ['strategy'] (live counts {'strategy': 1})`. That is a shape check that reds when the LIVE file gains a field the recording lacks, rather than an assertion that the recording has more fields. Both mutations were applied and verified applied by diff, and the tree restored. Derived at run time from `ci.yml`: 71 jobs carrying 6 distinct job keys, 750 steps carrying 9 distinct step keys — quoted as POPULATIONS, because 0 of 71 jobs carry all six and 0 of 750 steps carry all nine.
