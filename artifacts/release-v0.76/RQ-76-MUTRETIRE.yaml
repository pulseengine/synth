artifacts:
  - id: RQ-76-MUTRETIRE
    type: system-req
    release: v0.76
    status: implemented
    title: "The mutation survey has no RETIRED state, so a site legitimately eliminated by a fix can only be recorded as something it is not"
    description: >
      The survey's outcome vocabulary cannot express "this mutation site no longer
      exists because the code it mutated was correctly deleted". A site removed by a
      fix must therefore be recorded under a state that misdescribes it, and the
      `mutants_untested` ratchet reads that record.

      WHY IT BELONGS TO THIS THEME. The survey's frames and oracle outcomes are
      hand-authored tables driven by a hand-authored driver — one of the drivers the
      census judged CI-wired (that count is a JUDGEMENT, not a derivation; see
      RQ-76-GHSHAPE's UNVERIFIED note). A vocabulary that cannot express a
      real outcome is the same defect as a recording that cannot express a real input:
      the instrument constrains what the measurement is allowed to say, and the
      constraint is invisible in the result.

      DELIVERABLE: either add the state and re-derive the ratchet against it, or
      publish the measurement showing how many sites are currently mis-stated and why
      no state change is warranted. Both are acceptable outcomes; asserting the
      vocabulary is adequate without measuring is not.
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      landed: "#1412"
      issue: "#1257"
      # REPOINTED by v0.76 round 1 Pass B. This predicate previously named
      # `scripts/mutation_survey.py`, where all three matches of the literal are
      # COMMENTS — so Pass B gutted `validate_retired` to `return []` and the
      # conformance gate still reported "8/8 done-when DECLARED".
      #
      # ROUND 2 CORRECTED TWO CLAIMS MADE HERE. First, "8/8 done-when DECLARED"
      # counts DECLARATIONS, not evaluations: with the literal removed from the
      # tree entirely, conformance STILL prints 8/8. What fails is the live
      # status-evidence run, via R2 — measured as `FAIL R2 RQ-76-MUTRETIRE:
      # status `implemented` but done-when evidence is ABSENT on this tree`.
      # An earlier version named R3, which was a category error: R3 governs
      # NON-claiming statuses and this artifact is `implemented`, i.e. CLAIMING.
      # Second, the repoint does NOT make the marker inseparable from the tests:
      # both matches land in the test class's DOCSTRING, and round 2 deleted all
      # seven test BODIES while keeping class and docstring — suite "Ran 35
      # tests OK", every gate green. The repoint buys proximity, not coupling.
      # R2 is what gates this lane, and R2 is potent.
      done-when: "contains:scripts/test_mutation_survey.py:RQ-76-MUTRETIRE"
      verified-by: >-
        DELIVERED, with the count derived rather than asserted. MEASURED on the shipped ledger: 34 live mutants and 4 retired entries, so 38 sites were DRAWN — while `survey_sampled` reads 34. Four sites were mis-stated, and the deeper finding is that `scripts/mutation_survey.py` contained ZERO references to the `retired` list it was supposed to maintain: a hand-kept list beside a tool that could not see it, which is the same mirror defect as RQ-76-CAPTURE one directory over. The tool now reads it. A new `retire` subcommand records the disposition the tool could not express (id, classification WHEN DRAWN, retiring release, and a mandatory written reason), `reanchor` prints the decomposition `38 drawn = 34 live + 4 retired` so a reader can see the drawn sample is stable when a site moves between columns, and a NOT FOUND site now names `retire` as its remedy instead of leaving delete-or-stay-red as the only options. FOUR refusals were demonstrated red-first, none of which the tool could make before: a retired id ALSO present in `mutants` (double-counts the drawn sample), a retired entry missing a required field, the same id listed twice, and retiring a site whose anchoring text is STILL PRESENT — that last one refused on a real live id and left the ledger byte-unchanged. The control, the real ledger, validates clean. NO DATA CHANGED: this lane edits the tool only, so no derived rate moves in it. ROUND 1 PASS B FOUND THE LANE'S EVIDENCE STRUCTURALLY UNABLE TO FAIL, and it is fixed here rather than disclosed. `validate_retired` shipped with NOTHING executing it: Pass B corrupted the real ledger three ways at once and both CI-wired steps stayed green — `test_mutation_survey.py` (34 tests, zero references to `retired`) and `claim_check.py` at 75/75 — then gutted the validator to `return []` and the conformance gate STILL reported "8/8 done-when DECLARED", because this artifact's done-when named `scripts/mutation_survey.py` where all three matches of the literal are COMMENTS. A done-when whose subject is a comment cannot fire; that is the v0.69 ARCHMODEL class. TWO FIXES, both proven: (1) seven tests now drive `validate_retired` and `drawn_counts` — a clean entry, each of Pass B's three corruptions singly, all three AT ONCE so one report cannot mask the others, and the real shipped ledger as a control; red-first verified by re-applying Pass B's own mutation, which takes the suite from 41 passing to `FAILED (failures=4)` naming each corruption test, with the tree restored after. (2) the done-when now names the TEST file rather than the tool. ROUND 2 REFUTED THE STRENGTH CLAIMED FOR (2): both matches sit in the test class's DOCSTRING, and deleting all seven test BODIES while keeping class and docstring leaves the suite at "Ran 35 tests OK" with every gate green — so the repoint buys proximity, not coupling. What actually gates this lane is R2 (`status: implemented` is CLAIMING, so absent done-when evidence is an over-report), measured as `FAIL R2 RQ-76-MUTRETIRE: ... done-when evidence is ABSENT on this tree`. An earlier version of this record named R3, a category error — R3 governs NON-claiming statuses — and also read "8/8 done-when DECLARED" as an evaluation when it counts DECLARATIONS: with the literal absent from the tree, conformance still prints 8/8 and fails via the live status-evidence run instead. ACCEPTED LIMITATION, pinned rather than papered over: Pass B's FOURTH case — a structurally perfect entry naming a site that never existed — still validates clean and silently raises `drawn` 38 -> 39. `validate_retired` cannot catch it AS THE SCHEMA STANDS, and round 2 corrected the word "structural" that stood here: `cmd_retire` HOLDS `hit["file"]` at the moment it retires a site and simply does not record it, so this is a SCHEMA CHOICE a later release can revisit, not an impossibility. What remains true is that the check is not free: a retired id carries only a BASENAME, and a site legitimately retired because a fix DELETED its file would have no file to resolve against, so a naive "the file must exist" rule would red on exactly the case the list exists for. Recording the path at retire time is the cheap fix, named for v0.77 rather than described as impossible. A test asserts the CURRENT behaviour on purpose, so teaching the validator later makes that test FAIL — which is the signal, not a regression. Filed for v0.77.
