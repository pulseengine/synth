artifacts:
  - id: RQ-76-FALCON
    type: system-req
    release: v0.76
    status: implemented
    title: "cpetig's reported module still declines: six functions carry a value-carrying branch at f32, which AArch64 lowers and ARM misreports as an integer-path error"
    description: >
      EXTERNAL REPORTER (cpetig). Three releases have hardened the ORACLE around this
      issue; the REPORTED defect is still open, and v0.75's own measurement says the
      decline matrix is IDENTICAL on all three legs after its fixture-nonce work. v0.75
      held the issue open rather than letting the tag close it, which is correct and is
      not delivery.

      CURRENT REMAINING FAILURE, as last measured: `opt.wasm` compiles 10 of 17
      functions. One decline is #1069 (VFP spill-slot pool); the other SIX are
      GI-FPU-002 on functions that each contain a `block` with an f32 RESULT — a
      value-carrying branch at float type. ARM handles this at i32, names it at i64
      (#509), and MISREPORTS it at f32/f64 as an integer-path error. AArch64 handles
      all four. A minimal eight-line repro compiles and runs under wasmtime and synth
      refuses it.

      THE PROVENANCE PROBLEM IS THIS RELEASE'S OWN THEME. The 10-of-17 figure was
      measured at v0.72 and RESTATED unchanged since, and it is NOT re-derivable in
      this repository: the modules live only in the reporter's `errors.zip`, which
      RQ-70-FALCONCORPUS named exactly. The committed proxy is a hand-written `.wat`
      plus a twelve-cell decline matrix that is itself hand-authored. So the repo's
      evidence about an external reporter's module is a recording nobody can refresh —
      which is why this lane belongs to this theme and not merely to the backlog.

      DELIVERABLE, in priority order: (a) re-derive the figure against the reporter's
      attached modules and publish the date and commit, or state plainly that it is
      UNVERIFIED and stop restating it; (b) move the f32/f64 value-carrying-branch
      decline, or correct the DIAGNOSTIC so it names the real cause instead of an
      integer-path error.

      The reporter has said this no longer blocks them and that the target axis is
      irrelevant — m7, m7dp and m4f behave identically. It is scoped on correctness
      merit, not urgency.
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      landed: "#1406"
      issue: "#1318"
      # The issue asks for the reporter's module to COMPILE. This release moved
      # six of its seven declines; `controller@0.10.0#step` still refuses on
      # #1069 (VFP spill-slot pool), a different defect. So the issue outlives
      # the artifact and the TAG MUST NOT CLOSE IT. Set here, at delivery,
      # because R12 refuses `outlives` beside `status: proposed`.
      issue-scope: outlives
      done-when: "contains:scripts/repro/falcon_opt_1318_differential.py:RQ-76-FALCON"
      verified-by: >-
        DELIVERED, and measured rather than asserted. On the reporter's own `opt.wasm` (sha256 7065f112..., from `errors.zip` on the issue), re-measured AT THE CUT on 2026-09-29 with the LITERAL command line from the issue body (`--target cortex-m7 --relocatable --all-exports --embedder-data-init --embedder-global-init`), across the two ADJACENT commits 2f185e3e (the parent) and ffcddbcd (the shipping commit), whose only `crates/` delta is this fix: 7 of 17 functions skipped BEFORE, 1 of 17 AFTER. THIS SENTENCE PREVIOUSLY SAID "with his exact command line" against a 2026-09-25 measurement at b369aeea. The measurement was sound; the WORDING was not CHECKABLE, because the flag string appeared nowhere in this repository — a reader auditing the claim would find only the repro's `BACKENDS["arm"]` (`--target cortex-m7dp --relocatable`, neither embedder flag), which drives the SYNTHETIC `falcon_opt_1318.wat` fixture and is not, and does not claim to be, the reporter's line. The distinction is not cosmetic: re-running the reporter's modules under the repro's flag set at the cut, `fused.wasm` is REFUSED by #1041 (active data segments unmaterialized on the ARM relocatable path — a v0.59 decline, unrelated to this lane) where under the reporter's own flags it is rc=0. So an auditor who took the nearest committed flag set for the quoted one would have measured a different thing and read it as a regression. The literal string is therefore recorded above rather than described, which is this release's own theme applied to its own evidence. The six that moved are exactly func_4, func_5, func_8, func_10, func_11 and func_12, all with primary code `GI-FPU-002`; the one that remains is `#1069` on `controller@0.10.0#step` and is a different defect, which is why `issue-scope: outlives` is set. Execution, not acceptance: `carried_float_branch_1318_differential.py` runs six shapes over 60 emulations under unicorn on Cortex-M4F and compares BIT-EXACT against wasmtime (`wasmtime_calls=60`, so it cannot be comparing the compiler with itself), with -0.0 in the argument set because the cheap no-new-instruction copy is an arithmetic identity and -0.0 + 0.0 is +0.0. Potency: reloading BEFORE the join label, and storing to a slot other than the one reloaded, were each APPLIED and each turned the oracle RED at 25 of 60. Confinement: `fused.wasm` compiles 21 of 21 exports at rc=0 on BOTH commits — that is the figure a reader can reproduce from the issue's own command line — and a MANUAL measurement additionally found 24 of 24 function BODIES byte-identical between the pre-fix and post-fix objects, a larger denominator because it counts every emitted body and not only exports. THAT SECOND FIGURE IS NOT PRODUCED BY ANYTHING COMMITTED, and calling it an "oracle" — as this sentence did — asserted machinery that does not exist: no committed script takes two synth binaries or two commits, and `replay_control_1318.py` is a replay adversary, not a cross-commit body comparison. ROUND 2 CAUGHT THIS SENTENCE'S OWN VERIFICATION COMMAND: it used to read "`grep -rn 'confinement' scripts/ crates/ docs/` is empty", and that command returns FOUR hits — all of them in `docs/reviews/v0.76-cold-review.md`, added by the SAME commit as this correction. A verification command falsified by the document that records the finding is worse than no command, so it is removed rather than re-scoped: the claim to check is that no TOOLING produces the figure, and the greps that establish that are `grep -rln 'fused' scripts/` (empty) and the absence of any script taking two binaries. It is reproducible, and the method is the disclosure: compile `fused.wasm` at 2f185e3e and at ffcddbcd, then compare the `STT_FUNC` symbol bodies of the two objects via pyelftools (`llvm-dwarfdump`/`objdump` are absent locally, and `synth disasm` lands on the vector table). A cold reviewer re-derived 24 of 24 independently that way. Recorded like this because the paragraph above corrects a flag string for exactly this defect — a true claim a reader cannot check — and naming a nonexistent oracle beside it would have been the same error twice. The two numbers are not interchangeable, and only the 21-of-21 export figure was quoted to the reporter. `opt.wasm` has NO pre-fix baseline, because the old compiler refused to emit any object for it under #1102, so byte-identity there is blind BY CONSTRUCTION and is not claimed.
