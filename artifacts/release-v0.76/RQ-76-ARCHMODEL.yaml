artifacts:
  - id: RQ-76-ARCHMODEL
    type: system-req
    release: v0.76
    status: proposed
    title: "Recurring N/A: feature-loop steps 1-2 (spar AADL -> WIT) deferred again on spar#445 — filed, not waived"
    description: >
      Feature-loop steps 1-2 generate WIT from an AADL model in spar. They have been
      N/A every release since the dependency was recorded, blocked upstream on
      spar#445. This artifact exists so the deferral stays VISIBLE to the conformance
      gate rather than becoming an exemption by habit.

      DELIVERABLE: re-verify spar#445 at the v0.76 cut and record the DATE, the state
      and the last-updated stamp. If it is still open and unchanged, the N/A is filed
      again with its consecutive count; if it has moved, steps 1-2 come back into
      scope and this artifact says so.
    tags:
      # THE TAG SET, NOT THE PROSE, IS WHAT THE GATE READS. The step 1-2 matcher in
      # loop_conformance_check.py requires `"feature-loop" in tags AND tags & {aadl,
      # spar}` AND a non-empty `issue:`. An artifact missing `spar`/`aadl` is
      # INVISIBLE to the very gate it is filed for, and the release then reports no
      # filed steps-1-2 decision at all.
      #
      # This has now happened THREE times — v0.65, v0.69 and v0.75 — each time to
      # this same artifact, and v0.75's own body already carried the warning from
      # v0.69 while losing the tag a third time. Carrying the warning is not what
      # prevents it; carrying these five tags is.
      - process
      - carried
      - spar
      - aadl
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      disposition: deferred
      landed: "#1411"
      issue: "#1136"
      carried-from: RQ-75-ARCHMODEL
      done-when: "manual: spar#445 re-verified 2026-09-25 — OPEN, created AND last updated 2026-09-03T10:57:37Z, so unchanged since it was filed; feature-loop steps 1-2 N/A for the FOURTEENTH consecutive release on that same unchanged upstream reason"
      verification-track: manual
      verified-by: >-
        Deliberately `manual:`. The deliverable is a re-verification carrying a DATE; a `contains:` predicate pointing at this artifact's own file goes TRUE the moment the file exists, which reds R3 as status under-reporting. RE-VERIFIED 2026-09-25 (`date -u`, the only timestamp source): spar#445 is OPEN, and its `updatedAt` EQUALS its `createdAt` at 2026-09-03T10:57:37Z — it has not been touched since it was filed, so this is not merely "still open" but "untouched". THE CONSECUTIVE COUNT IS DERIVED, not incremented from v0.75's prose: `ls artifacts/release-v*/RQ-*-ARCHMODEL.yaml` returns 14 filings, v0.63 through v0.76, this being the fourteenth. And the shared cause was CHECKED rather than assumed — all 14 cite spar#445, so "the same unchanged upstream reason" holds across the whole run rather than only the recent part. The five tags [process, carried, spar, aadl, feature-loop] are intact; this artifact has gone invisible to its own gate three times (v0.65, v0.69, v0.75) by losing them.
