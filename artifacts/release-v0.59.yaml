  - id: RQ-59-WCETI64
    type: system-req
    title: "Price the i64 residual ops the WCET model still declines on"
    description: >
      SAME OP FAMILY, DIFFERENT SUBSYSTEM — which is why it rides with
      RQ-59-REACH rather than waiting.

      #936 priced `I64Const`/`I64Ldr`/`I64Str` in the WCET model and recorded
      an HONEST RESIDUAL: `I64Sub` (a saturating trunc-sat conversion
      sequence), `I64ExtendI32S`/`I64ExtendI32U`, and `I32WrapI64` are ALSO
      real direct-selector emissions with NO price. Measured consequence: a
      function that narrows an i64 read to i32 (`i64.load` + `i32.wrap_i64` —
      a plausible OS shape) still LOUD-DECLINES a bound, now on `I32WrapI64`
      instead of `I64Ldr`.

      Price them the way #936 did and NOT the way it first tried: size each
      from the REAL Thumb-2 encoder's own byte length per instance
      (`straightline_expansion_real`), never a hand-mirrored predicate. #936
      tried an exact hand mirror of `i64_effective_base`'s offset-fold
      threshold first and found it UNSOUND at authoring, because the
      address-materialization ADD can need its own MOVW for a large offset,
      which only the real encoder's output reflects.

      Remember `scan_for_decline` reports only the FIRST decline per function,
      so the residual set must be re-derived after each op is priced, not
      assumed from the previous run.

      Gate: the bound must stay SOUND (>= actual) on the unicorn cross-check,
      and `.text` must be unchanged — the sidecar is byte-invisible.
    status: implemented
    release: v0.59
    tags: [wcet, i64, decline-honesty, soundness]
    links:
      - type: derives-from
        target: VCR-WCET-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#936"

  - id: RQ-59-CRSWEEP
    type: system-req
    title: "The requirements board advertises 11 critical/high findings that are not open"
    description: >
      `artifacts/code-review-findings.yaml` carries 11 artifacts at status
      `proposed` labelled critical (CR-C1..C5) or high (CR-H2..H8). SPOT-CHECKED
      2026-08-20 against HEAD, three are demonstrably ALREADY FIXED:

        CR-C1 "division by zero not trapped" — the div-by-zero trap idiom
              exists in the selector; #494 phase 2b elides it ONLY under a
              proven divisor-nonzero fact. CLAUDE.md records all four i32
              div/rem trap guards discharged (#73).
        CR-C4/C5 "allocator wraps through R10/R11" — `ALLOCATABLE_POOL = 9`,
              the pool is R0-R8; R10 (memory size) and R11 (memory base) are
              not allocatable.
        CR-H3 "no callee-saved preservation" — `abi_contract.rs` exists and
              VCR-VER-004 (ABI observable-contract validator) is `implemented`.

      This is the SAME defect class the last six releases kept finding, one
      level up: a record that is locally coherent, looks rigorous, and stopped
      being true. A board claiming eleven open criticals it does not have is
      not a cosmetic problem — it makes the release-readiness query, which
      v0.58 just started relying on, untrustworthy.

      Do the whole set, not the three spot-checked. For EACH: reproduce against
      the current binary, then either close with the evidence and the shipping
      ref, or keep it open with a precise "remaining:" note. TRUST THE BINARY
      OVER THE TRACKER — an entry saying `proposed` is not evidence a defect
      exists, exactly as `implemented` was not evidence one was fixed.
    status: proposed
    release: v0.59
    tags: [traceability, stale-record, verify-dont-assume]
    links:
      - type: derives-from
        target: NFR-002
    fields:
      req-type: process
      priority: should
      verification-track: static-analysis

  - id: RQ-59-MINORHOLD
    type: system-req
    title: "Enforce the 0.x-minor dependency hold instead of commenting it"
    description: >
      #965. The hold is DOCUMENTED and not ENFORCED; auto-merge has been
      disabled BY HAND three times (#938, #997, #998). `object` 0.39 -> 0.40 is
      the fresh specimen: semver called it minor (major = 0) and it broke 16
      call sites across THREE unrelated newtype surfaces — `Rel::r_type()` ->
      `elf::RelocationType`, the `RelocationFlags::Elf { r_type }`
      DESTRUCTURING sites (which no `.r_type(` search finds, because it is a
      struct pattern), and `st_bind()`/`st_type()` -> `SymbolBind`/`SymbolType`
      — in the crate the ELF differentials read symtabs with. Without the hand
      disable that lands on main red.

      The enforcement must gate on CI, not on a maintainer's read of the diff.
      A method note from fixing #938 is the reason: the sweep was asserted
      complete from a grep and was WRONG TWICE (2 sites -> 6 -> 16). A grep is
      a hypothesis about where a change lands; the compiler is the oracle.

      Prior art to honour: the ordeal 0.9 -> 0.12 bump auto-merged as "minor"
      and hung Test + Z3 for 4-6 hours across days. Solver and
      binary-format deps deserve the full suite green, including the separate
      `--features z3-solver` path, before merge.

      RED-FIRST: the gate must be shown REFUSING a 0.x-minor bump, not merely
      present. A gate that cannot fail is indistinguishable from one that
      passes.
    status: implemented
    release: v0.59
    tags: [ci, dependencies, gate-potency, enforcement]
    links:
      - type: derives-from
        target: NFR-002
    fields:
      req-type: process
      priority: should
      verification-track: static-analysis
      issue: "#965"

  - id: RQ-59-FRESHNESS
    type: system-req
    title: "48 of 58 compile-then-parse sites still cannot notice a stale artifact"
    description: >
      RQ-58-FLAKE's stated residual. Its survey found 58 compile-then-parse
      sites across 34 files, and the shape is sharp: EXIT STATUS is checked at
      all 58, but FRESHNESS at only 7. The loud direction is covered almost
      everywhere and the silent one almost nowhere — a stale-but-valid artifact
      read as fresh does not fail, it re-confirms the previous run's digest as
      this run's evidence.

      v0.58 converted 10, deliberately including all 9 sites in
      `frozen_codegen_bytes.rs` because those SHA-256 anchors are what every
      other byte gate leans on. The remaining 48 are NAMED in #1006 with the
      reason each was left: several split the compile and the read into
      separate helpers taking a `&str` path, so no scan can attribute a read to
      its compile, and refactoring ~30 gate files without a per-file oracle is
      the failure mode this project exists to prevent.

      So this is not a sweep — convert in batches WITH a per-batch oracle, and
      state what remains. Reuse `artifact_guard::compile_artifact`. The
      sensitivity demonstration that matters is the SILENT one: plant a valid
      ELF, prove the counterfactual (it parses and carries `.text`, so the old
      shape WOULD have passed), then fail the compile and require the harness
      to refuse and leave nothing behind.
    status: implemented
    release: v0.59
    tags: [harness, stale-artifact, silent-direction, class-fix]
    links:
      - type: derives-from
        target: NFR-002
    fields:
      req-type: process
      priority: should
      verification-track: static-analysis
      issue: "#977"

  - id: RQ-59-SUBTRACT
    type: system-req
    title: "Keep the ratchet falling — the v0.58 thesis does not get one release"
    description: >
      v0.58 made the selector shrink for the first time (code region 18,480 ->
      17,961; wildcards 62 -> 55; rules 50 -> 74). The failure mode this
      guards against is a metric that moves once and is then quietly abandoned
      — the exact shape of VCR-SEL-001 reaching 50 rules at v0.45.0 and sitting
      flat for twelve releases while the file grew.

      So every release from here carries a subtraction obligation. For v0.59:
      more Rocq-proved DSL rules with the hand-written arms DELETED (never
      added alongside), and/or the next SPLIT unit.

      RQ-58-SPLIT stated its boundary precisely and that boundary is the input:
      helpers are NOT partitioned by path-exclusivity (bounds-check generators
      are genuinely shared; `pop_call_args` and the spill machinery are
      direct-path-only today but stay in the core), and the 10,621-line test
      module stays in the parent.

      GATES UNCHANGED: byte-identical across all 10 frozen anchors per moved
      unit; the family-aware ratchet means relocation earns ZERO credit, so
      only real deletion moves the ceiling. A deletion that moves emitted bytes
      without an oracle proving the new bytes correct is REFUSED, not explained.

      LANDED (v0.59): VCR-SEL-001 increment 6 — SIX new Rocq-proved rules
      (74 -> 80, all Qed on the generated model), each with its hand-written
      emission DELETED, never alongside: the sign-extension family
      (i32.extend8_s/16_s via new SXTB/SXTH model instructions with
      DEFINED — not axiomatized — semantics; i64.extend8/16/32_s via new
      narrow pseudo-ops; axiom count unchanged at 93) plus rule_i64_const,
      the first rule over a dynamic i64 immediate (new imm64 DSL concept).
      select_default's I64ExtendI32S / I32WrapI64 hand constructions
      delegated to their increment-5 rules; I64ExtendI32U delegation
      REFUSED on byte-identity (its rule lowers to the MOV+MOVW pair, the
      sd path emits the single pseudo — different bytes, no oracle, arm
      stays, refusal documented at the arm). Ratchet: code region
      18,291 -> 18,278, wildcards 56 -> 55 (the family match's
      `_ => unreachable!()` went with its arm), rules floor 74 -> 80,
      all banked. Evidence: the prior corpus had ZERO extendN_s coverage —
      sign_extend_family.wat ADDED FIRST, then a 704-row corpus manifest
      (176 fixtures x 4 configs, declines pinned with reasons) identical
      to the pre-deletion baseline per deletion commit; 10/10 frozen
      anchors; #973 ARM corpus sweep PASS (2,502 emulated vectors, 0
      mismatches, incl. the new fixture). Residual: the tracked coq/*.ml
      extraction snapshots were found stale since #697 and refreshed;
      they have no consumer and no freshness gate — wiring one is a
      policy call left to the hub.
    status: implemented
    release: v0.59
    tags: [north-star, subtraction, ratchet, selector]
    links:
      - type: derives-from
        target: BR-001
      - type: refines
        target: VCR-SEL-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#242"

  - id: RQ-59-A64PANIC
    type: system-req
    title: "aarch64 ELF builder PANICS (exit 101) where ARM and RISC-V decline cleanly"
    description: >
      #1013. The aarch64 ELF builder PANICS — exit 101 with a RUST_BACKTRACE
      note — when a retained function holds a relocation against a function the
      backend legitimately declined. The DECISION is right: it must not ship an
      unrelocated placeholder. The MECHANISM is wrong: a panic is not a decline.

      This is a cross-backend PARITY gap with a known-good reference, the same
      shape as RQ-59-WARALIAS: ARM and RISC-V already do the right thing on the
      IDENTICAL module (clean exit 1, machine-readable reason). So the fix is to
      make aarch64 refuse the way its siblings already refuse, not to invent a
      policy.

      PROVENANCE, which is why it earns a slot in a release it was not planned
      for: it is the ONLY panic across a corpus of 805 REAL-WORLD wasm modules
      (toolchain output and wasm.directory components, not spec fixtures) —
      the other 787 aarch64 refusals were clean. One unhandled path in an
      otherwise honest frontier.

      RED-FIRST: the repro is a 4.7 KB real-world `httparse` fixture with 5
      functions, already named in #1013 and present at
      `loom/tests/corpus/httparse.wasm`. Land a test that FAILS on the panic
      (asserting a clean non-zero exit and a reason string, NOT merely
      "does not crash") before the fix. A test that only asserts absence of a
      panic passes for the wrong reasons the moment the code path moves.

      SCOPE DISCIPLINE: fix the mechanism, not the surrounding aarch64 gaps.
      #1017 ranks import dispatch (~121 modules) and active data segments (44)
      far above this one module — those are a v0.60 capability push, not this.
    status: proposed
    release: v0.59
    tags: [soundness, aarch64, panic, cross-backend-parity, real-world-corpus]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1013"

  - id: RQ-59-PARTIALCENSUS
    type: system-req
    title: "Measure how much of the real-world decline rate is one-function-blocks-the-module"
    description: >
      #1017 surfaced a POLICY question synth has never answered, and asked it
      without assuming the answer: when a module has one unsupported function,
      should synth emit the functions that DID compile plus a machine-readable
      manifest of what was skipped, or keep refusing the whole module?

      Its own framing is worth preserving verbatim, because it names the fork:
      "I can see the argument that a partially-compiled object must never ship
      for a safety target — in which case the answer is 'no, by design', and
      that is worth stating explicitly somewhere, because from outside it
      currently looks like a capability gap when it is a policy."

      THE DECISION IS DEFERRED PENDING MEASUREMENT (maintainer's call,
      2026-08-21). This artifact is the measurement, NOT the feature.

      WHAT TO MEASURE, and why the existing number is not enough: #1017 reports
      ~151 of arm's 265 declines are of the form "N of M functions were skipped"
      versus ~6 genuine feature refusals — but states plainly that this covers
      only the TOP-12 decline reasons and is therefore a LOWER BOUND. Re-derive
      it over the FULL decline set, per module:
        a. how many modules decline solely because of one-function-blocks-module,
        b. what fraction of FUNCTIONS in those modules compiled successfully,
        c. the distribution — is it one bad function in hundreds, or half the
           module? The policy answer differs sharply between those.
        d. how many are components (of 101 pulled from wasm.directory, 101
           declined, 88 for import dispatch) versus plain modules.

      REPORT THE NUMBERS AND STOP. Do not implement `--allow-partial`. The
      output of this artifact is the census that lets the policy question be
      answered on evidence rather than intuition — and if the census shows the
      one-function case is a small minority, the honest answer is that the
      refusal is policy and should be DOCUMENTED as such rather than softened.
    status: proposed
    release: v0.59
    tags: [measurement, real-world-corpus, policy, decline-honesty]
    links:
      - type: derives-from
        target: NFR-002
    fields:
      req-type: process
      priority: should
      verification-track: static-analysis
      issue: "#1017"

  - id: RQ-59-POPCNT
    type: system-req
    title: "i32.popcnt clobbers R11 — the linear-memory base — and R11 leaks to the caller"
    description: >
      #1021, found by RQ-59-CRSWEEP as CR-H7: the ONLY one of eleven
      critical/high code-review findings still live, and it EXECUTES. A
      memory-safety miscompile shipped in v0.58.0.

      The Thumb-2 i32 Popcnt expansion takes R11 as a second scratch — its own
      comment says "We need a second scratch register. Use R11." — with six R11
      writes. R11 is the WASM LINEAR MEMORY BASE, materialized at entry and
      relied on by every subsequent LDR/STR. The A32 transcription (#615)
      deliberately mirrors "the Thumb-2 arm's register contract (R11 + R12 as
      scratch)" and inherits the same defect.

      EXECUTED, not inferred (unicorn vs wasmtime, --cortex-m):
        (i32.store (i32.const 0) (i32.const 1234)) then
        (i32.add (i32.popcnt (local.get 0)) (i32.load (i32.const 0)))
        f(0xFF) expected 1242, OBSERVED 0x20020008 — popcnt(0xFF)=8 plus the
        word at ADDRESS 0 (the vector table's initial SP), because R11 ended as
        r5>>16 = 0.

      WORSE THAN A WRONG ANSWER IN ONE FUNCTION: R11 is not in the pushed set,
      so it LEAKS TO THE CALLER and every later [R11] access in the whole call
      chain reads through the garbage base. Reachable from BOTH selector paths.
      i64.popcnt is NOT affected (R3/R4/R5/R12, all pushed) — that asymmetry is
      a useful control, and a fix should explain why i64 got it right.

      RED-FIRST with the repro above as an execution differential. Rework the
      expansion to avoid R11 entirely; do not "save and restore" R11 around the
      expansion without arguing why that is safe on every path including the
      trap edges.

      SCOPE NOTE: the maintainer chose to fold this into v0.59 rather than cut a
      v0.58.1 patch (2026-08-21). The precedent for the other choice was
      v0.56.2, cut mid-v0.57 for the ARM identity-mask OOB (#959).
    status: proposed
    release: v0.59
    tags: [soundness, memory-safety, arm, a32, popcnt, fix-first]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1021"

  - id: RQ-59-TIERCENSUS
    type: system-req
    title: "Census: which Rocq-proved rules sit above an unproven encoder expansion?"
    description: >
      The architectural finding behind #1021, and it is bigger than the instance.

      `rule_i32_popcnt` IS Rocq-proved. It emits the `ArmOp::Popcnt` PSEUDO-OP,
      and the defect lives in that pseudo-op's ENCODER EXPANSION. The proof is
      stated at PSEUDO-OP TIER, ABOVE the expansion — so a genuine proof sits
      above a defective lowering and cannot see it. The verified path certifies
      "the selector emits Popcnt correctly" while the thing Popcnt BECOMES
      destroys the memory base.

      This is the same shape as v0.57's `ArmSemantics::encode_op` silently
      no-oping 87 of 222 ops (a Rocq-proved rotl rule "validated" by a model
      executing neither instruction), one layer lower: there the MODEL did not
      reach the instructions; here the PROOF does not reach the expansion.

      MEASURE THE GAP — this artifact is a census, NOT a fix (maintainer's call,
      2026-08-21; the fix is a v0.60 program):
        a. Of the 80 rules in the VCR-SEL-001 manifest, how many emit a
           PSEUDO-OP rather than real encodable instructions?
        b. For each such rule, is the expansion itself proved, byte-oracled by a
           frozen anchor, or covered by an execution differential — or is it
           unguarded?
        c. Report the UNGUARDED set explicitly. That number is the real size of
           the gap and it is currently unknown.
        d. Note which pseudo-ops use registers outside the pushed set as scratch
           — #1021's mechanism — since that is the subset that can corrupt state
           beyond its own result.

      REPORT AND STOP. Do not rework the tier boundary here. A census that finds
      the unguarded set is SMALL is as valuable as one that finds it large — it
      would mean #1021 is close to a one-off rather than a systemic hole, and
      that changes how v0.60 should be scoped.
    status: proposed
    release: v0.59
    tags: [verification, proof-tier, census, vcr-sel-001]
    links:
      - type: derives-from
        target: NFR-002
    fields:
      req-type: process
      priority: should
      verification-track: static-analysis
      issue: "#1021"

  - id: RQ-59-DATASEG
    type: system-req
    title: "ARM relocatable path silently drops active data segments — refuse the way aarch64 does"
    description: >
      #1041. The Thumb-2/A32 `--relocatable` path (and the import-forced
      ET_REL path — the same builder) accepted a module carrying active data
      segments, emitted NONE of the initializer bytes, emitted no data symbol,
      printed no warning, and exited 0. Every static initialised by a data
      segment then reads whatever the target memory happens to contain — 0xFF
      on unwritten flash/RAM. Same fixture, three backends: RV32 ships the
      bytes as `.wasm_data` records (#798), aarch64 REFUSES LOUDLY (#851),
      ARM silently dropped. ARM was the only backend that neither ships the
      data nor says it did not — a loud decline costs a build failure; this
      cost a wrong answer at runtime, arbitrarily far from its cause. It
      completely explains gale#278's `state(0) == 255` (0xFF is what you read
      from memory never written) with no runtime bug required.

      THE FIX (this release): the ARM relocatable object REFUSES a
      data-carrying module unless the path actually materializes the region
      (the `--native-pointer-abi` geometry, which ships PROGBITS `.data`,
      is untouched). The non-const-offset memory-0 segment (legacy-dropped at
      decode, #851 records the reason) is refused on the same arm, matching
      aarch64. `--embedder-data-init` is the explicit escape hatch (the #952
      `--allow-skipped-exports` shape): it declares that the embedder
      populates memory 0's segments at instantiation — the contract the
      differential harnesses always implemented implicitly ("the embedder
      populates its init segments", multi_segment_static_data_differential) —
      and changes no emitted byte. RED-FIRST: the test asserts a clean
      non-zero exit AND a reason string naming the data segments — never mere
      byte absence, which was already true on the broken behaviour.

      SHIPPING the data on this path is deliberately NOT this artifact:
      RISC-V's sparse `.wasm_data` records placed by the generated linker
      script and copied at reset are the known-good reference, and that
      capability work belongs to v0.60 (VCR-REACH-002).
    status: implemented
    release: v0.59
    tags: [soundness, arm, relocatable, data-segments, honest-frontier, fix-first]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1041"
