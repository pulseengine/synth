  - id: RQ-59-PARTIALCENSUS
    type: system-req
    title: "Measure how much of the real-world decline rate is one-function-blocks-the-module"
    description: >
      #1017 surfaced a POLICY question synth has never answered, and asked it
      without assuming the answer: when a module has one unsupported function,
      should synth emit the functions that DID compile plus a machine-readable
      manifest of what was skipped, or keep refusing the whole module?

      Its own framing is worth preserving verbatim, because it names the fork:
      "I can see the argument that a partially-compiled object must never ship
      for a safety target — in which case the answer is 'no, by design', and
      that is worth stating explicitly somewhere, because from outside it
      currently looks like a capability gap when it is a policy."

      THE DECISION IS DEFERRED PENDING MEASUREMENT (maintainer's call,
      2026-08-21). This artifact is the measurement, NOT the feature.

      WHAT TO MEASURE, and why the existing number is not enough: #1017 reports
      ~151 of arm's 265 declines are of the form "N of M functions were skipped"
      versus ~6 genuine feature refusals — but states plainly that this covers
      only the TOP-12 decline reasons and is therefore a LOWER BOUND. Re-derive
      it over the FULL decline set, per module:
        a. how many modules decline solely because of one-function-blocks-module,
        b. what fraction of FUNCTIONS in those modules compiled successfully,
        c. the distribution — is it one bad function in hundreds, or half the
           module? The policy answer differs sharply between those.
        d. how many are components (of 101 pulled from wasm.directory, 101
           declined, 88 for import dispatch) versus plain modules.

      REPORT THE NUMBERS AND STOP. Do not implement `--allow-partial`. The
      output of this artifact is the census that lets the policy question be
      answered on evidence rather than intuition — and if the census shows the
      one-function case is a small minority, the honest answer is that the
      refusal is policy and should be DOCUMENTED as such rather than softened.

      CENSUS RESULT (2026-08-25, scripts/repro/partial_census_1017.py, synth
      main @ v0.58.0-26-ge2102518, backend=arm, --all-exports --relocatable).
      CORPUS: 307 unique modules (sha256-dedup, 489 MB; 183 core + 124
      components), every *.wasm in the org's own repos on this machine — the
      org-repo stratum of #1017's 805; the wasm.directory components are NOT
      in it, and per-module verdicts are on CURRENT MAIN, not v0.58.0 (e.g.
      loom's httparse.wasm, arm rc=1 in #1017, is ACCEPT_FULL today).
        a. Skip-only share is even HIGHER than #1017's top-12 lower bound:
           50 of 56 hard declines (89%; core 34/38, components 16/18) have
           NO module-level blocker — the sole cause is per-function skips.
        b/c. But "one bad function in hundreds" is FALSE on this corpus: the
           median skip-only decline compiles 77% of its requested functions
           (core; components 75%), histogram core 4x(25-50] 9x(50-75]
           20x(75-90] 1x(90-100) — unimodal around "a quarter of the module
           fails", never a single-function tail. The skips are SYSTEMATIC
           (top core causes: AAPCS i64/f64 register-pair call args 27 mod /
           179 fn; f64/f32 FPU target policy 117+ fn; i64/f64 stack args 59
           fn; i64 imm12 offset 54 fn; LdrSym Thumb-only 44 fn; register
           exhaustion 62 fn; plus three defect classes: rule_i32_rotl side
           condition, VCR-RA JoinValueNotAvailable, encode_operand2 rotated
           immediates). One function is not blocking the module; dozens are,
           sharing a few root causes.
        d. Components (org-built): 106/124 ACCEPT on arm — import dispatch
           does NOT dominate this stratum (that was aarch64-specific).
      PRUNE-THEN-COMPILE (DO-178C shape, conservative call graph incl.
      indirect-target over-approximation): converts only 2 of 34 core
      skip-only declines to FULL compiles; 14 are entry-poisoned (the sole
      real export, usually _start, itself declines) and 18 have a surviving
      export that reaches a skipped function. Components unresolved (16).
      ALSO MEASURED: synth ALREADY ships exit-0 partial objects when only
      internal helpers decline — 125 of 307 modules (41%) are
      ACCEPT_INTERNAL_SKIPS (median 93% of functions present); #952 gates
      EXPORTS only. And 77 of 249 accepts carry active data segments that
      ARM --relocatable currently DROPS silently (#1041): ACCEPT here means
      "functions compiled", not "image complete".
      WHAT THIS CORPUS CANNOT SUPPORT: the 805-module distribution, the
      wasm.directory component stratum, and v0.58.0-exact verdicts.
      RECOMMENDATION: keep the refusal, document it as policy (it is already
      policy at export granularity and already NOT policy for internals);
      the evidence-backed lever is the short systematic-cause list above,
      not --allow-partial (which would ship objects missing ~a quarter of
      their functions) and not prune tooling (2/34 today).
    status: implemented
    release: v0.59
    tags: [measurement, real-world-corpus, policy, decline-honesty]
    links:
      # derives-from must target a stakeholder-req (#1064). BR-001: the policy
      # fork the measurement informs is stated in safety terms ("a partially-
      # compiled object must never ship for a safety target"). NFR-002 KEPT as
      # refines — "handle all valid WebAssembly inputs" is precisely the
      # requirement whose real-world shortfall this census measures.
      - type: derives-from
        target: BR-001
      - type: refines
        target: NFR-002
    fields:
      req-type: process
      priority: should
      verification-track: static-analysis
      issue: "#1017"

  - id: RQ-59-POPCNT
    type: system-req
    title: "i32.popcnt clobbers R11 — the linear-memory base — and R11 leaks to the caller"
    description: >
      #1021, found by RQ-59-CRSWEEP as CR-H7: the ONLY one of eleven
      critical/high code-review findings still live, and it EXECUTES. A
      memory-safety miscompile shipped in v0.58.0.

      The Thumb-2 i32 Popcnt expansion takes R11 as a second scratch — its own
      comment says "We need a second scratch register. Use R11." — with six R11
      writes. R11 is the WASM LINEAR MEMORY BASE, materialized at entry and
      relied on by every subsequent LDR/STR. The A32 transcription (#615)
      deliberately mirrors "the Thumb-2 arm's register contract (R11 + R12 as
      scratch)" and inherits the same defect.

      EXECUTED, not inferred (unicorn vs wasmtime, --cortex-m):
        (i32.store (i32.const 0) (i32.const 1234)) then
        (i32.add (i32.popcnt (local.get 0)) (i32.load (i32.const 0)))
        f(0xFF) expected 1242, OBSERVED 0x20020008 — popcnt(0xFF)=8 plus the
        word at ADDRESS 0 (the vector table's initial SP), because R11 ended as
        r5>>16 = 0.

      WORSE THAN A WRONG ANSWER IN ONE FUNCTION: R11 is not in the pushed set,
      so it LEAKS TO THE CALLER and every later [R11] access in the whole call
      chain reads through the garbage base. Reachable from BOTH selector paths.
      i64.popcnt is NOT affected (R3/R4/R5/R12, all pushed) — that asymmetry is
      a useful control, and a fix should explain why i64 got it right.

      RED-FIRST with the repro above as an execution differential. Rework the
      expansion to avoid R11 entirely; do not "save and restore" R11 around the
      expansion without arguing why that is safe on every path including the
      trap edges.

      SCOPE NOTE: the maintainer chose to fold this into v0.59 rather than cut a
      v0.58.1 patch (2026-08-21). The precedent for the other choice was
      v0.56.2, cut mid-v0.57 for the ARM identity-mask OOB (#959).
    status: implemented
    release: v0.59
    tags: [soundness, memory-safety, arm, a32, popcnt, fix-first]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1021"

  - id: RQ-59-TIERCENSUS
    type: system-req
    title: "Census: which Rocq-proved rules sit above an unproven encoder expansion?"
    description: >
      The architectural finding behind #1021, and it is bigger than the instance.

      `rule_i32_popcnt` IS Rocq-proved. It emits the `ArmOp::Popcnt` PSEUDO-OP,
      and the defect lives in that pseudo-op's ENCODER EXPANSION. The proof is
      stated at PSEUDO-OP TIER, ABOVE the expansion — so a genuine proof sits
      above a defective lowering and cannot see it. The verified path certifies
      "the selector emits Popcnt correctly" while the thing Popcnt BECOMES
      destroys the memory base.

      This is the same shape as v0.57's `ArmSemantics::encode_op` silently
      no-oping 87 of 222 ops (a Rocq-proved rotl rule "validated" by a model
      executing neither instruction), one layer lower: there the MODEL did not
      reach the instructions; here the PROOF does not reach the expansion.

      MEASURE THE GAP — this artifact is a census, NOT a fix (maintainer's call,
      2026-08-21; the fix is a v0.60 program):
        a. Of the 80 rules in the VCR-SEL-001 manifest, how many emit a
           PSEUDO-OP rather than real encodable instructions?
        b. For each such rule, is the expansion itself proved, byte-oracled by a
           frozen anchor, or covered by an execution differential — or is it
           unguarded?
        c. Report the UNGUARDED set explicitly. That number is the real size of
           the gap and it is currently unknown.
        d. Note which pseudo-ops use registers outside the pushed set as scratch
           — #1021's mechanism — since that is the subset that can corrupt state
           beyond its own result.

      REPORT AND STOP. Do not rework the tier boundary here. A census that finds
      the unguarded set is SMALL is as valuable as one that finds it large — it
      would mean #1021 is close to a one-off rather than a systemic hole, and
      that changes how v0.60 should be scoped.
    status: implemented
    release: v0.59
    tags: [verification, proof-tier, census, vcr-sel-001]
    links:
      # derives-from must target a stakeholder-req (#1064). BR-001: the census
      # measures where "formal verification of synthesis correctness" does not
      # reach (a genuine proof above a defective expansion). NFR-002 KEPT as
      # refines — the unguarded set is exactly where wrong-code defects like
      # #1021's R11 clobber hide, which is NFR-002's correctness concern.
      - type: derives-from
        target: BR-001
      - type: refines
        target: NFR-002
    fields:
      req-type: process
      priority: should
      verification-track: static-analysis
      issue: "#1021"

  - id: RQ-59-DATASEG
    type: system-req
    title: "ARM relocatable path silently drops active data segments — refuse the way aarch64 does"
    description: >
      #1041. The Thumb-2/A32 `--relocatable` path (and the import-forced
      ET_REL path — the same builder) accepted a module carrying active data
      segments, emitted NONE of the initializer bytes, emitted no data symbol,
      printed no warning, and exited 0. Every static initialised by a data
      segment then reads whatever the target memory happens to contain — 0xFF
      on unwritten flash/RAM. Same fixture, three backends: RV32 ships the
      bytes as `.wasm_data` records (#798), aarch64 REFUSES LOUDLY (#851),
      ARM silently dropped. ARM was the only backend that neither ships the
      data nor says it did not — a loud decline costs a build failure; this
      cost a wrong answer at runtime, arbitrarily far from its cause. It
      completely explains gale#278's `state(0) == 255` (0xFF is what you read
      from memory never written) with no runtime bug required.

      THE FIX (this release): the ARM relocatable object REFUSES a
      data-carrying module unless the path actually materializes the region
      (the `--native-pointer-abi` geometry, which ships PROGBITS `.data`,
      is untouched). The non-const-offset memory-0 segment (legacy-dropped at
      decode, #851 records the reason) is refused on the same arm, matching
      aarch64. `--embedder-data-init` is the explicit escape hatch (the #952
      `--allow-skipped-exports` shape): it declares that the embedder
      populates memory 0's segments at instantiation — the contract the
      differential harnesses always implemented implicitly ("the embedder
      populates its init segments", multi_segment_static_data_differential) —
      and changes no emitted byte. RED-FIRST: the test asserts a clean
      non-zero exit AND a reason string naming the data segments — never mere
      byte absence, which was already true on the broken behaviour.

      SHIPPING the data on this path is deliberately NOT this artifact:
      RISC-V's sparse `.wasm_data` records placed by the generated linker
      script and copied at reset are the known-good reference, and that
      capability work belongs to v0.60 (VCR-REACH-002).
    status: implemented
    release: v0.59
    tags: [soundness, arm, relocatable, data-segments, honest-frontier, fix-first]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1041"
  - id: RQ-59-I64SHIFT
    type: system-req
    title: "i64 variable shifts CLOBBER their own shift-amount operand — both selectors, executed"
    description: >
      #1048, found by the RQ-59-TIERCENSUS measurement (#1047) — the census that
      was scoped to COUNT, not to hunt. It executed every rule-emitted encoder
      expansion under unicorn and diffed the register state, and this fell out.

      The Thumb-2 and A32 expansions of `ArmOp::I64Shl` / `I64ShrU` / `I64ShrS`
      open by masking the shift amount IN PLACE (`& 63`) and writing `amt-32`
      into the amount's HOME HIGH REGISTER. Re-read the amount after the shift
      and you get a mangled value. Executed on main, both selectors, with and
      without `--relocatable`:

        (func (export "f") (param $x i64) (param $amt i64) (result i64)
          local.get $x  local.get $amt  i64.shl
          local.get $amt  i64.add)      ;; read the amount AGAIN

        amt=3   -> 11                    correct 11               (control)
        amt=35  -> 47244640291           correct 34359738403      MISMATCH
        amt=64  -> 1                     correct 65               MISMATCH
        amt=67  -> 11                    correct 75               MISMATCH
        amt=127 -> 9223372169998762047   correct 9223372036854775935  MISMATCH

      SAME CLASS AS #1021, DIFFERENT REGISTER TIER. #1021 clobbered a RESERVED
      GLOBAL (R11, the linear-memory base); this clobbers the CALLER'S OWN
      OPERAND. That is why TIERCENSUS's reserved-register subset was `{Popcnt}`
      and still did not bound the risk — the operand tier was outside what that
      subset measures.

      THE OBSERVATION THAT MATTERS MOST: the wired `i64_shr_599` differential
      PASSES on the very binary where this miscompiles. The existing oracle is
      structurally blind to the class, which is precisely the argument for
      VCR-TIER-001's canary gate (v0.60) — a guard that would have caught BOTH
      #1021 and this one.

      RED-FIRST with the repro above as an execution differential asserting the
      VALUE. Fix all three shift expansions on BOTH backends. Then say why
      `i64_shr_599` could not see it, and whether the fix makes it able to.
    status: implemented
    release: v0.59
    tags: [soundness, i64, operand-clobber, arm, a32, fix-first]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1048"

  - id: RQ-59-STARTFN
    type: system-req
    title: "All three backends SILENTLY DROP the (start) function — no decoder arm at all"
    description: >
      #1046, found by the RQ-59-DATASEG class check (#1049) while looking for
      siblings of the data-segment silent drop.

      The decoder has NO `Payload::StartSection` arm. A module's `(start f)`
      is discarded outright: wasmtime returns 42 on the repro, synth-compiled
      code returns 0, exit 0, no warning — on ARM, RISC-V AND AArch64.

      THIRD SILENT-DROP OF THE SAME SHAPE found in one session, after #1041
      (ARM relocatable discarding active data segments) and alongside #1048.
      Synth accepts the input, discards part of its semantics, and reports
      success. That is the one behaviour the honest-frontier philosophy exists
      to prevent: a loud decline costs a build failure, a silent drop costs a
      wrong answer arbitrarily far from its cause.

      MINIMUM: refuse loudly, the way aarch64 already refuses active data
      segments (#851) and the way #1049 made ARM refuse them. Implementing
      start-function invocation is a capability question and NOT this artifact.

      RED-FIRST: the test must assert a non-zero exit and a reason naming the
      start section — NOT the absence of a call, which passes today on the
      broken behaviour.

      WHILE THERE: the DATASEG lane reported two softer same-class observations
      it did not file — non-zero global initializers and active element-segment
      table images also never reach the plain-relocatable object, though both
      are arguably inside the documented R9/R11 embedder contract. Determine
      which side of the contract each falls on and say so; if either is outside
      it, that is a fourth silent drop and it outranks this fix.
    status: implemented
    release: v0.59
    tags: [soundness, silent-drop, start-section, all-backends, fix-first]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1046"

  - id: RQ-59-GLOBALINIT
    type: system-req
    title: "ARM plain --relocatable SILENTLY DROPS nonzero global initializers"
    description: >
      #1052, found by the RQ-59-STARTFN lane resolving an observation the
      RQ-59-DATASEG lane had flagged but not filed.

      `(global (mut i32) (i32.const 42))` with a `global.get` export compiles
      exit-0 on the ARM plain `--relocatable` path to an object whose ENTIRE
      text is `push; ldr.w r0,[r9]; pop`. **0x2A appears nowhere in the ELF** —
      no `.data`, no `__synth_globals`. wasmtime returns 42; synth returns
      whatever the embedder left at R9.

      IT IS OUTSIDE THE EMBEDDER CONTRACT, established rather than assumed. The
      contract documents R9 as the globals-table BASE only. There is no sentence
      anywhere assigning initializer EVALUATION to the embedder — in explicit
      contrast to the data-segment sentence ("the embedder populates its init
      segments") that justified #1041's refuse-with-flag. Every other path
      ships inits, materializes them at reset (#649 treated this exact class as
      a bug there), or loud-skips (RV32). The plain relocatable path alone does
      none of the three.

      WHY IT SURVIVED, and this is the part worth carrying: the sole
      relocatable-path globals harness maps a ZEROED region, annotated
      `# zeroed globals table (inits are 0)`. It passes — correctly — because
      that fixture's initializers happen to be zero. A harness that cannot
      distinguish "the initializers were written" from "the initializers were
      all zero anyway" has been green over this bug for its whole existence.
      Same family as #1055 (the param-clobber fuzz harness checking "before
      FIRST read") and #1054's expansion-validator comment ("the expansion may
      clobber it freely"): three checkers encoding a property easier to state
      and weaker than the one that matters.

      MINIMUM: refuse loudly, matching the house style now used three times —
      aarch64's #851, #1049's ARM data-segment refusal, #1053's start-section
      refusal. Materializing initializers is capability work and NOT this
      artifact.

      RED-FIRST, and the assertion shape is the whole point: the test must
      assert a NON-ZERO EXIT and a reason naming the global initializers. It
      must NOT assert "the initializer value is absent from the object" — that
      passes today, on the broken behaviour, which is exactly how this survived.

      WHILE THERE: strengthen the zeroed-globals harness so it could notice.
      A fixture with a NONZERO initializer is the minimum; better, assert the
      served image equals the runtime image the way VCR-VER-003 does for data
      segments. If a refusal makes that harness unrunnable, say so and follow
      #1049's shape (default refuses; any escape hatch is explicit, and emitted
      bytes identical either way).
    status: implemented
    release: v0.59
    tags: [soundness, silent-drop, globals, arm, relocatable, fix-first]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1052"
