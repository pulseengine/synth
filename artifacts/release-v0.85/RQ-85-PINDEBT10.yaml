artifacts:
  - id: RQ-85-PINDEBT10
    type: system-req
    release: v0.85
    status: proposed
    title: "The pin-debt ratchet's inclusion criterion is derived, not named"
    description: >
        The ratchet derives its population from an explicit list of tables while the tripwire meant
        to catch an unlisted table derives from a NAME-SCOPED pattern. A suppression table named
        outside that pattern is in NEITHER population, which was demonstrated by entering a
        byte-identical table under a non-matching name and watching both layers stay silent.

        The deliverable is an inclusion criterion derived from what the oracles actually CONSULT
        rather than from what the tables are CALLED, so a rename cannot move a table out of the
        population. Note the known silent-undercount shape as well: a table built by update calls
        after an empty literal matches the pattern and is read as zero entries without raising, so
        it sits inside the pinned population contributing nothing.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome, reported with numbers: add a byte-identical suppression table under a name outside the pattern and run the ledger
        check; it must go RED. If it already reds, the escape is closed and this lane is moot.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1428"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the escape is CONFIRMED LIVE with a byte-identical paired control, and no
        inclusion criterion ships.

        Refuting command run in a detached worktree, three readings:

          baseline, no extra table                                 ledger GREEN
          a twelve-entry suppression table under a name OUTSIDE
            the tripwire's name pattern                            ledger STILL GREEN  <<<
          THE SAME BYTES under a name the pattern MATCHES          ledger RED, and the
                                                                   failing claim is the
                                                                   pin-debt entry itself

        Identical bytes, identical entry count; only the NAME differs. So the name-scoped tripwire
        is the only thing standing between an unlisted suppression table and the ratchet, and a
        rename defeats both layers at once — the explicit table list does not see it because the
        list is by name, and the tripwire does not see it because the pattern is by name too.

        The deliverable is therefore an inclusion criterion derived from what the oracles actually
        CONSULT rather than from what the tables are CALLED. Also noted for whoever builds it: the
        ratchet's own list carries a per-table index for case-weighting, and one entry deliberately
        omits it because that table's value tuple is ordered the other way round — so a criterion
        derived from structure must not assume a uniform tuple shape.
      done-when: "manual:2027-03-31 the pin-debt ratchet's inclusion criterion is derived, not named — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
