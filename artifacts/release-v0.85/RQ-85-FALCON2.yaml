artifacts:
  - id: RQ-85-FALCON2
    type: system-req
    release: v0.85
    status: proposed
    title: "An op the falcon-cascade binary needs is lowered, or the gap is named with a live measurement"
    description: >
        The reporter's own still-open synth blocker, and a v0.85 MUST on the maintainer's explicit
        direction of 2026-10-09. It is the synth link in a toolchain chain that a public write-up
        would showcase, and the loop carried it for two releases with no work on it at all — not
        even oracle hardening, so the conduct rule about oracle-only progress does not even apply,
        which is a worse position than if it did.

        THE SCOPE IS DELIBERATELY NOT INHERITED. The last reading — the reporter's optimized module
        skipping one function of seventeen, down from seven, the six that moved being the FPU
        decoder class — was taken at the v0.83 cut and is a LIVE NUMBER against a compiler that has
        shipped twice since. Re-measure it before scoping, and scope from the re-measurement.

        THE CHAIN CONTEXT, WHICH THIS LANE MUST NOT RE-DERIVE: the two sibling-repo defects filed
        beside this one are a fusion-time address-rebase aliasing bug and an arena-reset bug in a
        runtime, neither of which is synth codegen. The maintainer directed STAYING SYNTH-SIDE, so
        this lane opens no work in those repositories and does not re-litigate their causes.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome, reported with numbers: re-run the acceptance measurement on the reporter's attached module with the SHIPPED
        v0.84.0 binary and compare the skipped-function count against the v0.83 reading. If the
        count is now ZERO the blocker has already moved and this lane is moot; if the binary's
        reported version does not match the workspace, record UNPROVEN rather than inferring —
        v0.83 met exactly that condition and inferring would have invented a result.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1318"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the gap is NAMED WITH A LIVE MEASUREMENT and no lowering ships. The figure the
        plan was told to re-measure HELD. Refuting command run at synth 0.84.0, built from the
        release commit of the planning PR, using the REPORTER'S OWN command line taken from the
        issue body rather than one invented here (`--target cortex-m7 --relocatable --all-exports
        --embedder-data-init --embedder-global-init`):

          his optimized module  rc=1  ONE of seventeen functions skipped
                                      the single skip is the `controller@0.10.0#step` export
          his fused module      rc=0  CLEAN

        So "one of seventeen, down from seven" survives re-measurement two releases later, and the
        residual is now identified BY NAME as the frame-home export rather than left as a count.
        It is NOT a float decline: the class oracle passes every cell it pins, and within it the
        f32 value-carrying branch on ARM now COMPILES while the f64 one still declines — which is
        what "the six that moved were the float ones" means, measured rather than asserted.

        THE MODULE WAS ALREADY OBTAINABLE AND THE PLAN SHOULD NOT HAVE TREATED IT OTHERWISE. The
        reduced shape is committed in this repository, but the reporter's own module lives in the
        issue attachment; a test file in this tree has recorded since an earlier release that the
        attachment contains the modules themselves rather than only logs. Fetched on the
        maintainer's explicit approval, listed and traversal-checked before extraction, and
        treated as untrusted input: compiled, never executed.

        ALSO MEASURED, and it corrects the oracle's own prose rather than its pins: that script's
        header described the float value-carrying branch as a loud ARM decline, which its own
        pinned matrix contradicted. Doc rot behind a green gate, in the gate's own file.

        AND IT IS NOW CORRECTED, as a RECORD correction and not a lowering — this lane's one
        shipped change. The header carried TWO stale claims and this file's own matrix refuted
        the first: `("vbr_f32", "arm")` has been pinned to COMPILE since RQ-76-FALCON, so "at
        FLOAT type" was false at one of the two widths, and on ARM only f64 still declines. The
        second was the count: the six GI-FPU-002 declines in the reporter's module are GONE, the
        single remaining skip being the `controller@0.10.0#step` export, which is the #1069 cell
        and not a float cell. NO PIN MOVED — the matrix reads 12/12 (export, backend) cells, 5
        pinned declines and 7 pinned compiles, identically before and after, so the change is
        prose-only and behaviour-identical, and the diff is one hunk inside the module docstring.
      done-when: "manual:2027-03-31 an op the falcon-cascade binary needs is lowered, or the gap is named with a live measurement — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
