artifacts:
  - id: RQ-85-FIRSTTOKEN4
    type: system-req
    release: v0.85
    status: proposed
    title: "The verdict-prose gate's remaining dead branch is wired or declined"
    description: >
        Part one DELIVERED in v0.84: the classifier now calls the unclassified-lead detector when no
        leading verdict is found, with a three-way control measured — wired and clean, wired and
        escaping, and unwired and escaping, where the escaping artifact LEAVES the population rather
        than failing, which is why the hole read as empty for three releases.

        Part two is DONE and load-bearing: emptying the not-a-verdict set moves the population and
        produces failures, which is the potency evidence that the set is consulted. PART THREE
        REMAINS — the dead disposition branch, which no artifact has ever reached. Decide it: wire it
        with a red-first control, or DECLINE it with the measurement showing the branch is
        unreachable from any legal artifact, and say which.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome, reported with numbers: empty the not-a-verdict set and confirm the population moves and failures appear; then
        construct an artifact that reaches the disposition branch. If no legal artifact can reach
        it, that is the measurement the decline rests on and must be reported as such rather than
        left as a fourth refusal.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1476"
      verification-track: manual
      done-when: "manual:2027-03-31 the verdict-prose gate's remaining dead branch is wired or declined — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
