artifacts:
  - id: RQ-85-DISPVOCAB2
    type: system-req
    release: v0.85
    status: proposed
    title: "The two disposition gates name their question, and the intersection is written down"
    description: >
        Two gates carry DIFFERENT legal vocabularies for the same artifact field, and the stricter
        one wins SILENTLY, so a value legal to the permissive gate simply cannot land and nothing
        names the intersection. v0.84 established that these are TWO DIFFERENT QUESTIONS rather than
        one inconsistency: an allow-list of recognised dispositions, and a semantic test of whether
        a disposition claims delivery. Naming them separately is the deliverable; forcing one list
        onto both would answer the wrong question in one of the two places.

        The population figures v0.84 measured here — how many release artifacts are active under the
        version gate, the size of the green set, the gap between what the classifier ITERATES and
        what its classifier function REACHES — are all LIVE and move as lanes record outcomes.
        Re-derive each one; a figure quoted from the previous release is stale by construction.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome, reported with numbers: run both gates over the same artifact set with a disposition legal to one and illegal to the
        other, and confirm the asymmetry. If both now accept it the vocabularies have converged and
        this lane is moot. Re-derive the four population figures at the commit under test and state
        them WITH that commit, never carried.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1458"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the two questions are NAMED and the asymmetry is DEMONSTRATED on one tree with a
        paired control; no change ships.

        The two questions are distinct and must stay distinct: an ALLOW-LIST of recognised
        dispositions, and a SEMANTIC TEST of whether a disposition claims delivery. Forcing one
        list onto both would answer the wrong question in one of the two places.

        DEMONSTRATED, by setting a disposition legal to the permissive gate and absent from the
        strict gate's list, in a detached worktree:

          that value      the strict gate FAILS, naming the value and its legal set
                          the permissive gate passes, reporting no disagreement
          a shared value  BOTH gates pass                                   (CONTROL)

        Same tree, same field, two gates, OPPOSITE verdicts. The stricter one wins and the
        permissive one's extra values are unusable in practice — which is exactly why the tree uses
        only the intersection and nothing has ever surfaced it.

        THE FOUR FIGURES THE PLAN LISTED WERE RE-DERIVED AT THE COMMIT UNDER TEST rather than
        carried, and they have moved, which is why the plan said they are live. Stated here as
        relationships rather than as a count of a live object: the classifier ITERATES far more
        artifacts than its classifying function REACHES, and most of the iterated set is out of
        population as declared non-verdicts.

        AND THE DEMONSTRATION LANDED ON THE ARTIFACT ABOUT THIS DEFECT. The target was chosen
        mechanically by a listing, not picked — and it selected the previous release's
        disposition-vocabulary artifact. Same shape as the release before, where the one artifact
        whose subject matter was check-run states was the only one an audit misread.
      done-when: "manual:2027-03-31 the two disposition gates name their question, and the intersection is written down — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
