artifacts:
  - id: RQ-85-MEMLAYER2
    type: system-req
    release: v0.85
    status: proposed
    title: "An op on a non-zero memory lowers under the native-pointer ABI, or the layering gap is named"
    description: >
        The relayed reporter's ONLY remaining blocker, third release running. The conduct rule binds
        without qualification: v0.84 SIZED this gap and did not close it, and sizing is not progress
        the reporter can observe.

        MEASURED AT v0.84, so the lane starts from evidence rather than a survey: the refusal is
        live in the multi-memory page path; the emitter already carries a per-memory data symbol;
        the selector's static-data addend is address-only across nine call sites; and the bounding
        constraint is that memory zero has NO index-suffixed alias BY DESIGN, asserted in the
        multi-memory test. The binding flag is the native-pointer ABI and NOT the bounds-check mode
        the issue is framed around, and the refusal lives in the SELECTOR, so a CLI-level probe
        misses it entirely.

        THE HALF THE REPORTER THOUGHT DECISIVE ALREADY SHIPPED in v0.83 — per-memory extent sizing,
        with a region symbol emitted for every memory rather than memory zero alone. So this lane
        scopes ONLY the layering, and the reply that says so is drafted and awaiting release.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome, reported with numbers: grep the selector for the addend's call sites and re-read the design assertion in the
        multi-memory test before writing any code, then attempt the lowering on a two-domain module.
        If the assertion that memory zero has no suffixed alias has been removed since v0.84, the
        bounding constraint is gone and the scope is wrong. The compile half needs a matching
        binary; if the build is not possible at the available disk, record UNPROVEN with the figure.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1145"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the compile half is PROVEN rather than unproven, and no layering ships. THREE
        CARRIED CLAIMS ARE CORRECTED, each measured.

        FIRST, THE BLOCKER WAS PRICED AGAINST THE WRONG OPERATION. The previous release recorded
        this half unproven because "a matching binary needs a full build" against a disk budget.
        Building only the CLI crate produces a binary reporting the workspace version in under
        twenty seconds and under a gigabyte of target, and it compiles a real module to a valid
        object. The multi-gigabyte figure prices a full TEST build — all targets plus
        dev-dependencies — and the lane needed a BINARY. The cost figure and the requirement were
        two different populations. (The binary on PATH reports a long-superseded version, so the
        previous release was right to refuse it; the answer was to build one.)

        REFUTING COMMAND, run on this repository's own multi-memory fixture with two controls:

          memory-k ops + the native-pointer flag      REFUSED, and the refusal reproduces
          same module WITHOUT that flag               a DIFFERENT refusal — the skipped-export
                                                      guard, several exports not in the object
          the flag on a SINGLE-memory module          succeeds  (CONTROL)

        SECOND, "the refusal lives in the selector, not the CLI, so a CLI-level probe misses it"
        is FALSE. There are TWO refusals for this condition. A CLI pre-flight check bails BEFORE
        any function is compiled, and that is what a CLI probe hits on the first attempt; the
        selector's own refusal sits behind it. Whether the selector arm is reachable AT ALL through
        the CLI once pre-flight exists is NOT measured here — if it is not, it is an inert guard,
        which is the self-test lane's class one tier down.

        THIRD, the design assertion that BOUNDS this lane is intact but was cited at the wrong
        path. It lives under the CLI crate's own tests, not at the repository root. A wrong path
        looks EXACTLY like a deleted assertion, and reading the abbreviation literally would have
        concluded the bounding constraint was gone and rewritten the scope on a typo.

        AND A COUNT THIS LANE ALMOST GOT WRONG THE SAME WAY: a plain grep for the addend helper
        returns more lines than there are call sites, because the population includes the
        definition and two comments. The carried call-site figure is correct about call sites.
        Caught before it became a correction.
      done-when: "manual:2027-03-31 an op on a non-zero memory lowers under the native-pointer abi, or the layering gap is named — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
