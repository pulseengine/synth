# v0.85 release scope — COMMENTS ONLY.
#
# This file carries NO STATISTICS by rule. Every number about this release lives
# in the artifact that derives it, or in the CHANGELOG at the cut. A figure here
# would be a second copy with no derivation behind it, and this release is named
# after what happens to a second copy.
#
# THEME — "A correction is an unreviewed claim."
#
# THIS THEME IS EARNED RATHER THAN ASSERTED, and it is the only property this
# programme has measured identically in two consecutive releases. Each of the last
# two cold reviews found twelve false statements in the release it reviewed, and in
# each case three quarters of them were introduced by the loop's OWN corrections and
# addenda rather than by the original work. Same ratio, two releases, measured after
# the fact and predicted by nobody.
#
# The mechanism is not carelessness. A correction is written in the confident
# register of a fix, it arrives after the reviewing attention has moved on, and the
# numbers it introduces have had ZERO review passes. The previous release's
# instances, each measured:
#
#   - An arithmetic identity subtracted a classifier's iteration count from a count
#     of release artifacts — two populations — and the clause that was supposed to
#     reconcile them double-counted the same files a third time.
#
#   - A claim that nothing in the plan reads an issue's state was contradicted by a
#     line in the plan that does exactly that.
#
#   - A retraction landed more than a hundred lines BELOW the claim it retracted, so
#     in reading order the record asserted a thing and then withdrew it.
#
#   - A correction fixed one assertion site and a second survived it, missed by the
#     first review round and found by the second.
#
#   - An addendum closed by stating that it changed none of the counts above, which
#     was false of the counts it had just changed.
#
# AND THE TWO SIDES OF A SPLICE ARE BOTH LIVE. The previous release found a
# correction that replaced a PREFIX and left the original TAIL re-asserting the error,
# so the artifact announced its own fix while restating the thing it fixed. This
# release produced the MIRROR: a splice that replaced a SUFFIX and broke the HEAD it
# left behind, producing a sentence that was neither the old claim nor the new one. A
# splice must be read against BOTH sides it leaves behind.
#
# So the second review round attacks the first round's corrections FIRST, by name,
# with the names derived mechanically from the first round's record rather than listed
# from memory — and the derivation scrubs commit hashes, timestamps, runner names,
# issue references, version strings and file citations, because an unscrubbed pass
# reported a two-digit runner fragment as a finding nineteen times.
#
# CARRIED FORWARD AS A STANDING OBLIGATION, because it kept firing after it was
# named: a check and its subject drawn from DIFFERENT POPULATIONS, where neither side
# is wrong about its own set and the comparison between them is meaningless. The
# previous release found this inside the loop's own most-repeated check — a standing
# derivation about an external reporter was scoped to ONE repository, re-derived its
# bounded-complete answer correctly every tick for an entire release, and was blind to
# open threads the same reporter had filed in two sibling repositories. It was found
# again in the derivation written FOR the theme, where a classifier grouped a constant
# with the values that move because the constant contains a digit. And it was found in
# a gate-potency measurement where the same guard read INERT in one environment and
# POTENT in another, both readings correct, which means a potency verdict without its
# environment is not a verdict.
#
# WHAT THIS DOES NOT MEAN: stop deriving. It means the check and the thing checked
# need INDEPENDENT populations, and that independence is a property to be PROVEN
# rather than assumed.
#
# CARRIED, AND WHY EACH IS CARRIED RATHER THAN RETIRED: the external and
# externally-relayed defects remain open because the work done on them was analysis
# and oracle-hardening rather than a change the reporter would notice, which does not
# count as progress on them. One of them had NO work at all for two releases, which is
# a worse position than oracle-only progress and is recorded as such. Three further
# lanes are blocked OUTSIDE this repository on maintainer actions — a credential
# rotation, a coverage-backlog decision, and a one-line key append so a corpus volume
# can be mounted. Attempting passwords stays declined.
#
# TWO REPLIES TO EXTERNAL REPORTERS ARE DRAFTED AND UNPOSTED, held for the
# maintainer's word rather than sent on the loop's own judgement.
#
# EVERY ARTIFACT CARRIES A REFUTING COMMAND, to be RUN BEFORE the artifact is built
# on. A refutation is a legitimate outcome reported with numbers, and a lane that
# refutes its own premise has worked rather than failed.
