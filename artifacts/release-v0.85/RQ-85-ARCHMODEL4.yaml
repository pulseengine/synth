artifacts:
  - id: RQ-85-ARCHMODEL4
    type: system-req
    release: v0.85
    status: proposed
    title: "File the recurring architecture-step non-applicability with its ordinal derived from the tree"
    description: >
        The upstream blocker remains OPEN, so the architecture step is non-applicable again and the
        recurring non-applicability is filed rather than waived — a recurring N/A is a backlog item,
        not an exemption.

        THE ORDINAL IS DERIVED BY ARTIFACT IDENTITY from the git tree, never counted by hand and
        never incremented from the previous release's number: refuse on a duplicate identifier and
        refuse on an EMPTY population, and state the ordinal WITH the commit it was derived at. This
        artifact must carry BOTH the loop tag AND an architecture tag, because the step matcher reads
        the architecture tag and goes blind without it — a lane that drops it reports the step as
        unscoped rather than as deliberately non-applicable.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome, reported with numbers: derive the ordinal from the tree and assert the population is non-empty and free of
        duplicate identifiers before writing it anywhere. A population of zero here is a REFUSAL,
        not a first filing. Then confirm the step matcher sees this artifact by running the
        conformance gate and reading the step's printed line, not by inspecting the tags.
    tags:
      - feature-loop
      - aadl
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1136"
      verification-track: manual
      disposition: deferred
      verified-by: >
        DEFERRED — the upstream blocker is still OPEN, so the architecture step is non-applicable
        again and the recurring non-applicability is FILED rather than waived.

        THE ORDINAL IS DERIVED BY ARTIFACT IDENTITY FROM THE GIT TREE, stated with its commit and
        never counted by hand: the population is non-empty, carries ZERO duplicate identifiers, and
        this is the twenty-third filing counting itself, DERIVED AT COMMIT
        74c5e0f9be2cd55493728ac3b9cc14477db3c561 and stated with it here. The earlier wording
        deferred the commit to the release record while the release record deferred it back, so
        the ordinal was stated with its commit in NEITHER document - found by this release's round
        1. The deferral's reasoning was sound about the COUNT and wrong about the COMMIT: a count
        of the artifact it lives in is invalidated by the edit that writes it, but a commit that is
        an ANCESTOR of the default branch can be named, and re-deriving at that commit reproduces
        23 over a population with zero duplicate identifiers.

        THE UPSTREAM CONDITION, read rather than remembered: the blocking issue is OPEN and is that
        the architecture tool accepts property associations from UNDECLARED property sets silently,
        so a typo'd or invented property is indistinguishable from a satisfied one. That is exactly
        the class this programme refuses to build evidence on.

        TAG CONJUNCTION VERIFIED BY THE GATE'S OWN OUTPUT, not by reading the tags: this artifact
        carries both the loop tag and the architecture tag, and the conformance gate's step 1-2 line
        NAMES it as the filed decision. A lane that drops either tag reports the step as unscoped
        rather than as deliberately non-applicable, which is why the check is the gate's line.
      done-when: "manual:2027-03-31 file the recurring architecture-step non-applicability with its ordinal derived from the tree — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
