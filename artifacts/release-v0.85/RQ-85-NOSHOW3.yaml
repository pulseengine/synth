artifacts:
  - id: RQ-85-NOSHOW3
    type: system-req
    release: v0.85
    status: proposed
    title: "Decide whether an empty no-show population across two releases is grounds to decline"
    description: >
        THE DELIVERABLE IS A DECISION, not another measurement. The no-show population has been
        EMPTY in the sampled window for two consecutive releases. An empty derived population is a
        REFUSAL rather than a pass by this programme's own rule, so measuring it a third time and
        reporting the same emptiness is not progress — it is the instrument reporting that it cannot
        answer the question.

        Either the window is wrong and must be widened until the population is non-empty, or the
        condition no longer occurs and the issue should be declined on that basis with the window
        stated. Both are acceptable outcomes. Carrying it unresolved a third release is not.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome, reported with numbers: widen the sampled window until the population is NON-EMPTY or until the widening exhausts
        the available history, and state the window with the result. If a non-empty population
        appears, the decline is refuted and the lane has real work; if the history is exhausted, the
        decline is grounded and must say over what window.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1484"
      verification-track: manual
      disposition: refuted
      verified-by: >
        REFUTED — the decline this lane was asked to consider is NOT available: the population is
        NON-EMPTY once the window is widened and the classifier stops splitting cancel waves.

        WINDOW STATED WITH THE RESULT, because a window is part of a population claim: two hundred
        workflow runs spanning a day and a half, jobs fetched for ninety-five of them. Whole-run
        cancellations are their own class and excluded. TWO GENUINE LONE NO-SHOWS remain, each a
        single unstarted job inside a run that FAILED rather than was cancelled — a provenance
        reconciliation gate, and a register-allocation validator.

        So "an empty no-show population across two releases" was a WINDOW-AND-CLASSIFIER ARTIFACT
        rather than a property of the system, and declining on that basis would have been wrong.
        THE DECISION: do not decline; the condition occurs.

        ### THE FIRST TALLY WAS RIGHT BY ACCIDENT AND IS RECORDED AS A DEFECT

        The first classifier grouped unstarted cancelled jobs by EXACT completion timestamp. In one
        run, fifteen such jobs share a timestamp and a coverage job sits fifty-five seconds later;
        exact grouping put it alone and reported it as a no-show, when that run's own conclusion is
        CANCELLED with thirty-two jobs cancelled — one operator action whose teardown is not
        atomic. The classifier's population was "jobs sharing an exact timestamp"; its subject was
        "jobs cancelled by one action". TWO POPULATIONS, inside a classifier written FOR a lane
        about classifying. Fixed by clustering on PROXIMITY and giving whole-run cancellation its
        own class. The corrected total is unchanged, but NEITHER instance is one the broken version
        named — a right answer for wrong reasons is not a measurement.

        AN EMPTY SUBCLASS, REPORTED RATHER THAN HIDDEN: "operator-cancel cluster inside a run that
        is not itself cancelled" is ZERO in this window. Legitimately empty given that every
        cluster observed belonged to a cancelled run — stated so a later tick does not read the
        zero as potency.
      done-when: "manual:2027-03-31 decide whether an empty no-show population across two releases is grounds to decline — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
