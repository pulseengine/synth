artifacts:
  - id: RQ-78-ARCHMODEL
    type: system-req
    release: v0.78
    status: proposed
    title: "Recurring N/A: feature-loop steps 1-2 (spar AADL -> WIT) deferred again on spar#445 — filed, not waived"
    description: >
      Feature-loop steps 1-2 generate WIT from an AADL model in spar. They have been N/A
      every release since the dependency was recorded, blocked upstream on spar#445. This
      artifact exists so the deferral stays VISIBLE to the conformance gate rather than
      becoming an exemption by habit.

      DELIVERABLE: re-verify spar#445 at the v0.78 cut and record the DATE, the state and
      the last-updated stamp. If it is still open and unchanged, the N/A is filed again
      with its consecutive count; if it has moved, steps 1-2 come back into scope and
      this artifact says so.

      REFUTING COMMAND: read the upstream issue's STATE before its BODY, and compare
      `updatedAt` against `createdAt` rather than trusting the previous release's claim
      that it is untouched.

      DERIVE THE CONSECUTIVE COUNT BY ARTIFACT IDENTITY, NOT BY TAG SET. v0.77 learned
      this the hard way: a tag-keyed census returned FOURTEEN filings where the answer
      was FIFTEEN, because v0.65's filing predates the five-tag vocabulary and six of the
      run lack two of those tags. Applying today's tags retroactively measures a
      different population. Walk the release directories and match on artifact ID.
    tags:
      # THE TAG SET, NOT THE PROSE, IS WHAT THE GATE READS. The step 1-2 matcher in
      # loop_conformance_check.py requires `"feature-loop" in tags AND tags & {aadl,
      # spar}` AND a non-empty `issue:`. An artifact missing `spar`/`aadl` is INVISIBLE
      # to the very gate it is filed for.
      #
      # This has happened THREE times — v0.65, v0.69 and v0.75 — each a COMMITTED
      # version the matcher cannot see: f33002d1 and 15f2f887 had lost `feature-loop`;
      # d51ce79f and a030db47 kept it and lost BOTH `spar` and `aadl`. EITHER HALF of
      # the conjunction has been dropped in practice, which is why all five are listed
      # and none is treated as the load-bearing one. Every incident was caught before
      # its tag: tested at all fifteen shipped tags, all fifteen satisfy the matcher, so
      # no release ever SHIPPED an invisible filing.
      - process
      - carried
      - spar
      - aadl
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1136"
      carried-from: RQ-77-ARCHMODEL
      done-when: "manual:2026-09-30 spar#445 re-verified at the v0.78 cut with its state and updatedAt recorded, and the consecutive N/A count DERIVED from the filed artifacts BY ARTIFACT IDENTITY rather than by today's tag vocabulary"
