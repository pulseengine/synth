artifacts:
  - id: RQ-78-LADDER
    type: system-req
    release: v0.78
    status: proposed
    title: "Re-measure the acceptance ladder — reach has had no live number for fourteen releases"
    description: >
      `docs/status/ACCEPTANCE_LADDER.md` as shipped at v0.77.0 is headed "Acceptance
      ladder — v0.63", measured 2026-09-06 at `e3a09ac2`. FOURTEEN releases have shipped
      since (v0.64.0 through v0.77.0, derived by listing tags after v0.63.0), including
      RV32 globals, AArch64 bounds-checked linear memory, and v0.76's f32 carried-value
      fix that moved six of seven declining functions in a real customer module.

      CLAUDE.md's own rule: "If the ladder predates the build being compared, re-measure
      before publishing." So every statement about synth's reach made today is a
      statement about a tree from 2026-09-06.

      THIS GOES FIRST because the ladder is the DENOMINATOR. The compliance envelope
      requires publishing the acceptance rate beside any performance comparison, per
      rung, with its date and commit; a stale denominator makes everything derived from
      it stale. It is also the scoping input for reach work — the last measured picture
      says 141 of 243 modules NEVER compile on ARM, and whether that still holds is
      unknown.

      DELIVERABLE: a ladder re-measured on the shipping tree by the COMMITTED tool
      (`scripts/repro/partial_census_1017.py --ladder`), carrying its own date and
      commit — not a hand-edited table. Plus the reach FLOOR pinned in claims.yaml as a
      `direction: up` ratchet, so a release that reduces reach is red.

      AND ONE HONESTY REQUIREMENT the current file already meets and must keep meeting:
      a rung that CANNOT move is labelled structurally inert, never reported as a
      measured `+0`. The `+no-optimize` rung is in that state — every ladder invocation
      passes `--relocatable`, which forces the direct selector, so it can only ever
      report +0. A rung that cannot move reported as zero is the gate-that-cannot-fail
      class inside a measurement harness.

      REFUTING COMMAND: `head -6 docs/status/ACCEPTANCE_LADDER.md` and
      `git tag --list 'v0.*' --sort=creatordate | awk 'f;/v0.63.0/{f=1}' | wc -l`.
      If the header names a recent release and the count is small, this premise is dead
      — check BEFORE building on it, the way v0.77 found two of its own `must` premises
      already delivered.
    tags:
      - process
      - reach
      - measurement
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1432"
      # Dated `manual:` predicate, QUOTED. A `contains:` pointing at this artifact's
      # own file goes TRUE the moment the file exists and reds R3; and v0.76 proved a
      # `contains:` naming a COMMENT cannot fail. The delivering lane replaces this
      # with a `contains:` naming EXECUTED code in a test file when it flips status.
      # PARTIAL. The re-measurement is BLOCKED on a corpus this machine cannot
      # reach, so the predicate is rewritten to what was actually delivered —
      # the PROVENANCE defect that blocked it, fixed — with the measurement half
      # named as blocked rather than left to look undone-for-no-reason. R11
      # requires a disposition beside `landed:` on a non-claiming status.
      disposition: partial
      landed: "#1438"
      verification-track: manual
      done-when: "manual:2026-09-30 the PROVENANCE defect is fixed — the ladder header and partial_census_1017.py's own --help both record that the 243-module corpus is EXTERNAL to this repo and name its last known location — and the re-measurement is recorded as BLOCKED with the blocker named; the reach FLOOR is explicitly NOT pinned this release, with the reason stated"
      verified-by: >-
        PARTIAL, and the part delivered is the one that was blocking the other. THE RE-MEASUREMENT DID
        NOT HAPPEN: the 243-module corpus is on an unmounted external volume, last known at
        `/Volumes/Work/corpora/wasm-243`; the host that carries it resolves and answers on port 22 but
        returned `Permission denied (publickey,password,keyboard-interactive)` on 2026-09-30, and
        attempting passwords was declined rather than tried. So the ladder still reads v0.63 and every
        reach statement in this release is scoped to a 2026-09-06 tree, which is now SAID in the file
        rather than inferable from its title.
        WHAT WAS DELIVERED IS A PROVENANCE DEFECT, and it is the reason the block took so long to
        diagnose. The ladder header cited its manifest as `corpora/wasm-243/MANIFEST.sha256` — a BARE
        RELATIVE PATH that reads as repo-relative. It is not: `corpora/` is absent from this repo, is
        tracked by zero files, and is not even gitignored, and `partial_census_1017.py` took the corpus
        as a positional `roots` argument whose help said only ".wasm files or directories", so the path
        the ladder cites was DEFINED NOWHERE IN THE TREE. This lane was one command from publishing that
        the corpus was UNOBTAINABLE — an extra refuting command found it on a volume instead. It is not
        lost, it is unmounted, and the difference is the whole finding. Both ends now record it: the
        ladder header carries an explicit "THE CORPUS IS EXTERNAL TO THIS REPO" note with the last known
        absolute path and the auth failure's date, and the script's own `--help` says the same where an
        operator will actually read it. This is the half of the deliverable that does NOT need the mount,
        and it is what makes the next attempt cheap.
        THE REACH FLOOR IS DELIBERATELY NOT PINNED THIS RELEASE, and saying so is the point rather than
        an omission. The theme pins a reach FLOOR that must rise against a cost CEILING that must fall,
        slack-free, so neither can be bought with the other. Pinning a floor at the v0.63 figures would
        pin a number measured on a tree fourteen releases old — and pinning a cost ceiling ALONE, with
        no floor beside it, is exactly the alternating the theme forbids: it would let a release buy
        cost wins with reach losses and stay green. So neither half is pinned, and the artifact says
        which and why, rather than shipping the half that happened to be reachable.
