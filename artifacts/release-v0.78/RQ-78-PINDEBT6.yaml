artifacts:
  - id: RQ-78-PINDEBT6
    type: system-req
    release: v0.78
    status: proposed
    title: "Pin debt, sixth consecutive measurement — and this time the count itself is known to include five non-debt entries"
    description: >
      The known-open pin count is a `direction: down` ratchet that has not moved since
      v0.74.0. v0.77 measured it again (delta ZERO) and added the question no previous
      lane had asked: would a pin going STALE — its defect fixed — be DETECTED? The
      answer was a positive one: all six non-empty tables are exact in BOTH directions
      and go red when a pinned defect is fixed, so the count is live debt rather than a
      mixture of debt and fossils.

      The live value is NOT restated here. Read it from claims.yaml on the tree being
      planned with `claim_check.py claims.yaml --metric`; a second copy of a pinned
      number in prose is how the "first reduction" falsehood survived v0.74 in four
      places at once, including inside a 75/75-passing ledger.

      WHAT v0.78 INHERITS THAT PREVIOUS LANES DID NOT, filed as #1428: FIVE of the
      entries pin CORRECT behaviour — regression guards at 0, and one pinned `decline` —
      so "close the pin" is undefined for them and they can never fall by being fixed.
      About 6% of a must-FALL debt figure is not debt. And the selector-parity VANISHED
      check is gated on `key[0] in ran_files` from a corpus glob, so a pin whose fixture
      is renamed or removed is neither confirmed nor refuted; the arm corpus sweep has an
      explicit "PHASE A STALE" rule for that class and parity does not.

      A SEPARATE UNIT PROBLEM, also inherited: `known_open_pinned_cases` sums cases where
      `cases_at:` is declared and 1-per-entry otherwise, so `false_reject_1229`
      contributes 12 to a total named "cases" while ci.yml independently pins the SAME
      population at 130. One repo, one population, two numbers, both green — and the
      repo's own standing rule forbids summing tallies with different denominators.

      DELIVERABLE, and it may legitimately be a refutation: either close a pin with a
      compiler fix, or publish the measured reason none in the current population is
      closable within a release, naming the cheapest candidate and what its predicate
      would have to be. Every remaining entry is an oracle observing a live wrong answer
      on the shipped compiler, so each is closed by a COMPILER FIX and nothing else;
      re-attribution does not move it, and a case-preserving pin merge is a REVIEW-TIME
      obligation the ratchet cannot catch.

      REFUTING COMMAND: `python3 scripts/claim_check.py claims.yaml --metric` and derive
      the per-table decomposition with the tool's own `_pin_table` — never a hand-rolled
      AST walk, which returned 0 for all ten tables in v0.76 and located one of ten in
      v0.77.
    tags:
      - process
      - carried
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1373"
      # The REPORT shipped; the pin closure did not, so the artifact does not
      # claim the outcome. R11 requires this beside a `landed:` on a
      # non-claiming status. v0.75's PINDEBT3, v0.76's PINDEBT4 and v0.77's
      # PINDEBT5 carried the same shape for the same reason.
      disposition: deferred
      landed: "#1438"
      verification-track: manual
      verified-by: >-
        Deliberately `manual:`. THIS IS A REPORT OF NON-DELIVERY on the count, which is the deliverable
        when it is true. RE-DERIVED at the v0.78 cut with the tool's OWN report rather than a
        hand-rolled walk — `claim_check.py claims.yaml --metric`, because v0.77 recorded that a
        hand-rolled AST walk returned 0 for all ten tables and was simply wrong: `known_open_pins` = 84
        (baseline 27, +57, must FALL, 6 waivers), `known_open_pinned_cases` = 157. THE DELTA ACROSS
        v0.78 IS ZERO, derived by reading `git show v0.77.0:claims.yaml` rather than quoting last
        release's prose: 84 / 157 there, 84 / 157 here. The tool's own `held` column says FIVE releases
        now carry this value, and its `last-change` column says it last MOVED at v0.74.0 — both derived
        from claims.yaml, not from this record.
        WHY NO PIN CLOSED, and the ground is short and DERIVED: this release contains no change to
        shipped compiler code. `git diff --name-only v0.77.0..HEAD -- '*.rs'` returns exactly ONE file,
        `crates/synth-backend/tests/vfp_local_pressure_1069.rs`, and it is under a `tests/` directory —
        so no emitted byte can move and no pinned wrong answer could. (Derived with `--name-only` and
        not `--stat | wc -l`, which gave v0.77 THIRTEEN files where there were twelve because 13 is the
        summary row.)
        TWO CANDIDATES WERE REJECTED, and unlike previous PINDEBT lanes one of them was ATTEMPTED
        rather than reasoned about. (1) The #1426 residual — `controller@0.10.0#step` on the VFP
        frame-home spill-slot pool — carried forward from v0.77 on the same measured ground: the
        recovery ladder's rungs are insufficient for that function's float-local pressure, so the
        remaining work is register-allocator work. (2) NEW THIS RELEASE: RQ-78-WIDEFILE found that the
        ladder's last rung has no pool-grow retry, BUILT the retry, measured a real reach gain (the
        wall for a synthetic family moved 60 -> 66) and then REVERTED it, because the #1069 execution
        differential showed the newly-accepted code disagreeing with wasmtime in exactly the sign bit
        on every negative input. Filed as #1439. A reach increment that would have shipped a silent
        miscompile is not a pin closure, and taking it would have added defects rather than removing
        debt.
        CARRIED, NOT FIXED, and named so the figure is read correctly: #1428 records that FIVE of the
        84 entries pin CORRECT behaviour (regression guards pinned at 0, plus one pinned `decline`), so
        roughly 6% of a must-FALL debt figure is not debt; and the selector-parity VANISHED check is
        gated on `key[0] in ran_files`, so a pin whose fixture leaves the corpus is neither confirmed
        nor refuted. Both are v0.78-untouched and both remain the honest qualifications on the 84.
      done-when: "manual:2026-09-30 the pin count is re-derived at the v0.78 cut with claim_check's own _pin_table, the delta against v0.77.0's ledger is stated, and either a pin CLOSES or the refusal names the rejected candidate and the ground for rejecting it"
