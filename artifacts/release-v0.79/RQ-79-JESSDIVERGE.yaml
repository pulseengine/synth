artifacts:
  - id: RQ-79-JESSDIVERGE
    type: system-req
    release: v0.79
    status: proposed
    title: "An externally reported SILENT MISCOMPILE: the quaternion integrates correctly, then the rotation sees identity"
    description: >
      PROMOTED TO THE v0.79 HEADLINE by the maintainer on 2026-10-01, over the PAGESIZE
      capability, because a silent miscompile reported from outside is the class this project
      exists to prevent and it outranks a reach gain.

      THE REPORT (#1436, jess). A synth-lowered `falcon-cascade/ekf@0.10.0#estimate`
      (synth 0.64.0) diverges from wasmtime over the same module: 10 of 14 state words
      bit-exact, FOUR wrong — and they are exactly the ones the accelerometer reaches THROUGH
      the quaternion rotation. On ARM `vel-n` is EXACTLY `ax*dt` and `vel-e` exactly `ay*dt`:
      the UNROTATED values. The quaternion INTEGRATION is bit-exact. So the lowered code
      integrates attitude correctly and then applies an IDENTITY rotation.

      THE ELIMINATION IS UNUSUALLY COMPLETE AND SHOULD NOT BE REDONE: argument passing (6 flat
      f32, the args demonstrably arrive), loom (the pre-loom module diverges bit-identically),
      a 93-value `az` sweep (best 10/14; no single value explains it), the harness's memory
      paint, and THE EMULATOR — QEMU 11.1.1 `mps2-an500` and Renode 1.16.1 on an RT1176 model
      agree BIT-FOR-BIT on all 31 parked words, including the four wrong ones. Two
      independently written Cortex-M7 implementations, same bits, both disagreeing with
      wasmtime. Repro digest-pinned in jess; record AFD-125.

      WHAT THIS RELEASE RULED OUT, measured rather than argued. The obvious hypothesis was the
      home-register alias class (#1189) on the VFP path: an identity rotation from a correctly
      integrated quaternion is what reading an INITIAL-value copy looks like, since the identity
      quaternion (1,0,0,0) rotates nothing. It is REFUTED on every shape synth accepts —
      `select` with a re-read, a `block` result with a re-read, a `br_if`-carried value with a
      re-read, `get`-`set`-`use`, an f32 local carried through a loop, and an f32 local live
      across a call are ALL bit-exact against wasmtime (24 executions, 0 divergences, with a
      passing i32 twin and an f32 passthrough as positive controls IN the run).
      THAT RUN IS NOT COMMITTED, and this is stated here rather than left for a reader to
      discover: it happened in-session and nothing in the tree reproduces it. `grep -rl 1436
      scripts/repro/ crates/*/tests/` is empty, and the shipped `join_alias_1189_*` and
      `home_alias_class_1189_*` differentials carry no f32 leg at all (main/i64/call in the
      join family, promo in the home-alias family). So
      the figures above are a RECORD, not a re-derivable fact, and the refutation they
      support cannot currently be checked by anyone else. Committing that oracle is a v0.80
      obligation — and under rule 4 it would still not be progress on #1436.
      THE FIRST done-when CLAUSE IS UNMET. It asks that the divergence be re-measured on the
      CURRENT compiler rather than inherited from the 0.64.0 report, and it sits BEFORE the
      either/or, so the honest-reporting escape does not cover it. No such re-measurement
      was performed. Nothing in the gate notices — and the reason first given here was
      itself false, in the same commit that added the field it denied: this artifact DOES
      carry `landed: "#1449"`. The real reason is that R11's failure branch requires a
      `landed:` with NO `disposition:`, and this artifact has both, so the rule is satisfied
      and never looks at whether a done-when clause was met.

      AND THE "MISSING f32 LEG" OF THE ALIAS DIFFERENTIAL IS A REAL GAP. This paragraph
      first claimed the opposite — that it was a CONSEQUENCE rather than an oversight,
      because `(if (result f32))` does not compile (#1447) so an f32 fixture would be
      entirely `EXPECTED_SKIPS` with nothing to execute. A cold review refuted that and the
      detail is recorded in `verified-by:` below: the generator enumerates nine join shapes
      and only one is an `if`, so an f32 port would have six or seven EXECUTING legs. The
      families also differ and were collapsed here: `join_alias_1189_*` carries main, i64
      and call fixtures, while the `promo` fixture belongs to `home_alias_class_1189_*`.
      Neither family has any f32 leg, which is what makes the gap real.
      Writing that leg would have produced a green oracle measuring nothing.

      SO THE SEARCH SPACE NARROWED RATHER THAN CLOSED, and the remaining candidate is named:
      the 14-field / 56-byte RETURN AREA marshalling. The four wrong fields are adjacent in the
      record and the correct ones are too, which is a layout-shaped signature rather than an
      arithmetic one. NOT YET TESTED, and it must not be asserted until it is.

      RULE 4 APPLIES AND IS THE REASON THIS ARTIFACT EXISTS. jess's defect is STILL OPEN; a
      release whose only work on it was hardening oracles around it does not count as progress.
      So this artifact reports what was RULED OUT and what was not reached, rather than
      presenting the elimination as delivery. Nothing was posted to #1436 — the finding is a
      refutation of an internal hypothesis, which belongs in the release notes and not in a
      reporter's inbox (rule 1).

      REFUTING COMMAND: re-run jess's own oracle on the CURRENT compiler before building on any
      of this — `hardware/renode/cascade-invoke/run-ekf-oracle.sh` in jess, plus
      `tools/cascade-differential/ekf_ref.py <module> 16` for the wasmtime reference. The report
      is against synth 0.64.0 and the tree is now fifteen releases later; if the four fields are
      bit-exact today the premise is dead and jess should hear THAT, briefly and first.
    tags:
      - process
      - reach
      - quality
      - measurement
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1436"
      disposition: partial
      landed: "#1449"
      verification-track: manual
      verified-by: >-
        PARTIAL, AND UNDER RULE 4 THIS IS NOT PROGRESS ON #1436. The externally reported divergence is
        NOT fixed and its cause was NOT found. What was delivered is one REFUTATION and one filing.
        REFUTED: the leading hypothesis, the home-register alias class on the VFP path. Every f32 join
        shape probed accepts and agrees with wasmtime — `select` with a re-read, a `block` result with
        a re-read, a `br_if`-carried value, `get`-`set`-`use`, a local carried through a loop, and a
        local live across a call. THE HONEST LIMIT OF THAT EVIDENCE, stated because the sweep is the
        load-bearing half of the refutation: it was run in-session and is NOT COMMITTED. Nothing in the
        tree cites #1436 (`grep -rl 1436 scripts/repro/ crates/*/tests/` is empty) and the shipped
        `join_alias_1189_*` differentials carry main, i64 and call fixtures with no f32 leg
        (the `promo` fixture is the separate `home_alias_class_1189_*` family). So the
        refutation is not reproducible by anyone else, and committing that oracle is a v0.80
        obligation. AND ONE EXCUSE WITHDRAWN, because a cold review refuted it: it was going to be
        recorded that the alias differentials' missing f32 leg is a CONSEQUENCE rather than an
        oversight, on the ground that `(if (result f32))` does not compile (#1447) so an f32 port
        would be entirely `EXPECTED_SKIPS`. THAT IS FALSE. `scripts/gen_home_alias_class_1189.py`
        enumerates NINE control-flow JOIN shapes and only ONE is an `if` (`:89`): the others are
        three `select` forms (`:67`, `:69`, `:71`), a function-level `br_if` (`:74`), a `br_if`
        into a value-carrying block (`:78`), a `br_table` on a home index (`:82`), a block
        fall-through result (`:93`) and a loop (`:97`). TWO of those eight cannot take an f32
        home for a SPEC reason, not a synth one — `sel_cond` uses the home as `select`'s
        condition and `brtab` as `br_table`'s index, both i32 by definition — so an f32 port
        would have SIX or SEVEN executing legs, not eight. "Nine" is also the count of join
        shapes rather than of what the generator emits, which is three modules carrying 117
        exported FUNCTIONS (59/49/12 `(export "` lines minus one `(memory (export ...))` per
        module). And of the two that cannot be ported, `brtab` has no f32 form at all rather
        than merely a skipped one: the home IS the `br_table` index. so the
        missing f32 leg is a REAL GAP in the oracle and not a justified absence. ALSO FILED: #1450, the multi-result return convention is undocumented and unexercised.
        IT WAS THE REMAINING CANDIDATE AND IT IS NOW ELIMINATED, from the reporter's own data
        rather than from any oracle this release built. #1450 measures, at arity 14 (matching
        the 14-field record), that multi-result returns land in `s2..` with the LAST
        duplicated into `s0` and the caller-supplied return area never written. That cannot
        produce the reported symptom: any marshalling defect — wrong register, wrong order,
        unwritten buffer — corrupts most or all of a record, and cannot leave TEN words
        bit-exact IN PLACE while four are wrong in a semantically coherent pattern. Ten exact
        means the marshalling delivered faithfully whatever was computed, so those four values
        were already wrong before they were stored. #1450 stays real and open; it is not this
        defect.
        AND THE MECHANISM IS NOW ARITHMETIC RATHER THAN INFERRED. The four diverging words
        decode as an identity rotation and nothing else: `vel-d` = `3c20ba20` = 0.0098100007 =
        9.81 x 0.001, one tick of UNROTATED gravity, and `pos-d` = `36a495a2` = 4.9050004e-06,
        the matching one-tick free-fall distance, with north and east receiving nothing.
        THE EVIDENCE ALSO ESCALATED AFTER THIS ARTIFACT WAS FIRST WRITTEN: the reporter
        confirmed it on the ACTUAL i.MX RT1176 over SWD, so THREE independent ARM
        implementations (Renode 1.16.1, QEMU 11.1.1, real silicon) agree bit-for-bit and all
        three disagree with wasmtime. "Emulation artefact" and "two emulators share a bug" are
        both retired.
        STILL NOT NAMED, and the release claims no progress: the step between a correctly
        integrated quaternion (its words are among the ten that are exact) and a rotation
        behaving as though it read the initial one. Naming the instruction requires reading
        synth's output against its input; the module is not in the thread and has been asked
        for.
      done-when: "manual:2026-10-01 the divergence is re-measured on the CURRENT compiler rather than inherited from the 0.64.0 report; the ruled-out hypotheses are recorded WITH their execution counts and their positive controls; and either the cause is named with a reaching module, or the lane states plainly that it did not reach the cause and names the untested candidate — never presenting elimination as progress on an open external defect"
