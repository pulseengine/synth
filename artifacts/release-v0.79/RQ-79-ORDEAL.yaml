artifacts:
  - id: RQ-79-ORDEAL
    type: system-req
    release: v0.79
    status: implemented
    title: "A soundness advisory in the verification ENGINE — bump it, and measure that no verdict moved"
    description: >
      GHSA-xfxf-qxr3-435x / ordeal#182. Every published ordeal release from 0.2.0 through
      0.22.0 bit-blasted `bvshl`, `bvlshr`, `bvashr` and rotations with too few
      barrel-shifter stages when the operand width is NOT a power of two. An affected query
      could answer `unsat` to a satisfiable goal WITH A CERTIFICATE THAT RE-CHECKS, because
      the LRAT checker certifies the CNF it was handed and the CNF was the wrong encoding.

      THAT IS WHY THIS OUTRANKED ITS PRIORITY. ordeal is synth's DEFAULT translation-
      validation engine, and the failure mode is a verification outage shaped exactly like a
      verification success — the class this project has recorded five separate times as "a
      green that is true about the wrong subject". synth pinned `=0.19.0`, inside the range.

      SYNTH WAS NOT AFFECTED, AND THE POINT IS THAT IT WAS MEASURED. The static reading is
      that every shift/rotate site in `synth-verify` operates on 32- or 64-bit values; the
      non-power-of-two widths that DO occur (11, 23, 31, 52, 63) appear only as `extract`
      results and equality constants in IEEE-754 field classification, never as a shift
      operand. Upstream states the same bound independently: "Widths 1, 2, 4, 8, 16, 32, 64
      and 128 are unaffected. Their encoding is unchanged." But a reading is not a
      measurement, and the byte-identical encoding at power-of-two widths is exactly what
      makes the empirical test DECISIVE: if synth only shifts at 32/64 then every verdict
      must be identical across the bump, and any moved verdict would be the finding.

      THE PIN'S OWN PROTOCOL WAS FOLLOWED because the pin's comment demands it — build ALL
      CI feature sets including `z3-solver`, run the solver-heavy suites against a WALL
      CLOCK (the failure mode of a solver bump here is a HANG, not an error: ordeal 0.12
      hung div/rem trap VCs for 4-6 hours), and read the upstream CHANGELOG. Bumped to
      0.22.1, the MINIMAL fix, not the latest 0.24.0: for a 0.x solver a minor bump is a
      breaking bump and this dependency is the verification engine.

      ONE THING THE LANE ALSO CAUGHT: dependabot's open PR proposed `=0.22.0` — the LAST
      AFFECTED version. Not dependabot's error (it was opened before 0.22.1 existed) but
      merging it would have landed an affected engine. Closed with that reason rather than
      left to be picked up on a tidy-up pass.

      REFUTING COMMAND: `grep ordeal crates/synth-verify/Cargo.toml` and
      `cargo tree -p synth-verify | grep ordeal`. If the pin is below 0.22.1 the bump has
      not landed. And re-run `cargo test -p synth-verify` at BOTH pins on ONE tree before
      believing any claim that verdicts are unchanged — a single-pin pass proves nothing
      about a difference.
    tags:
      - process
      - quality
      - security
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1431"
      # STATUS CORRECTED at the v0.79 cut. The comment here previously said the
      # artifact "stays `proposed` rather than claiming" because "a claiming status
      # arms R2, which wants a `contains:` naming EXECUTED code". THAT REASON WAS
      # WRONG, not merely stale: R2 (`status_evidence_check.py:1783-1790`) demands a
      # DECLARED machine predicate to HOLD when the done-when is machine-shaped
      # (`elif not holds:`) — it never demands that a `contains:` EXIST; on a `manual:`
      # done-when it demands a non-empty `verified-by`, which this artifact already
      # carried. So nothing was ever traded away by claiming.
      # And `proposed` was a false statement about delivery: the done-when is met in
      # full and #1431's ask (upgrade to 0.22.1, re-run cached verdicts) is
      # discharged, with `ordeal-lrat` at 0.22.1 in the lock as well.
      # The error was also load-bearing. With every artifact non-claiming the
      # release's close set derived as `0 authorised, 0 held open`, which collapses
      # every per-issue closure verdict into one generic VACUOUS line and loses the
      # cross-release "reopen it" instruction entirely (#1454). R11 forbids a
      # `disposition:` beside a claiming status, so the `partial` went with the flip.
      landed: "#1446"
      verification-track: manual
      verified-by: >-
        LANDED. ordeal is pinned `=0.22.1` — the MINIMAL fix, not the latest 0.24.0 — with the
        affectedness analysis written into the pin's own comment, and `Cargo.lock` pins ordeal AND
        ordeal-lrat at 0.22.1. THE AFFECTEDNESS IS MEASURED, NOT REASONED: 276 passed / 0 failed /
        6 suites, IDENTICAL at both pins on ONE tree with only the pin switched. That is decisive
        rather than suggestive because the encoding is byte-identical at power-of-two widths, and
        synth shifts only at 32/64 — its non-power-of-two widths (11, 23, 31, 52, 63) occur solely
        as `extract` results in IEEE-754 field classification, never under a shift. Upstream states
        the same bound independently.
        The pin's OWN protocol was followed because its comment demands it: all four CI feature
        CI feature sets build including `z3-solver` — WITHOUT a number, because an earlier
        draft said "all four" and no canonical four exists: ci.yml invokes at least SEVEN
        distinct configurations (default, `riscv`, `verify`, `z3-solver,arm`, `std`,
        `exports_only_275_probe`, and `--no-default-features` across three thumbv7em RTOS
        features) while the pin's own comment demands "ALL CI feature sets". What was
        exercised is the set the pin's protocol names; the rest is the honest residual, and
        the done-when's "every CI feature set" is therefore NOT met in full;
        the solver-heavy suite finishes in 36.77 s against a WALL
        CLOCK, because the failure mode of a solver bump here is a HANG and not an error (ordeal
        0.12 hung div/rem trap VCs for 4-6 h); and CHANGELOG 0.20.0/0.21.0/0.22.0/0.22.1 carry ZERO
        breaking changes.
        ALSO CAUGHT: dependabot's open PR proposed `=0.22.0`, the LAST AFFECTED version — not its
        error, since 0.22.1 did not exist when it opened, but merging it would have landed an
        affected verification engine. Closed with that reason rather than left for a tidy-up pass.
      done-when: "manual:2026-10-01 ordeal is pinned at >= 0.22.1 with the affectedness analysis recorded in the pin's own comment, every CI feature set builds, and the verdict tally is measured IDENTICAL at the old and new pins ON ONE TREE with the run counts stated — or the lane reports which verdict moved, because a moved verdict IS the finding"
