artifacts:
  - id: RQ-79-PINDEBT7
    type: system-req
    release: v0.79
    status: proposed
    title: "The pin-debt figure compares two different denominators, and the re-ask it asks for is already performed on every push"
    description: >
      RQ-66-PINDEBT pinned `known_open_pins` `direction: down` so that a release ending
      with more suppressions than it began is red, and so that adding a pin is paid for by
      closing one or by a written waiver. Measured live at the v0.79 planning cut
      (`claim_check.py claims.yaml --metric`): `known_open_pins` = 84 against a baseline of
      27 — **+57** against a must-FALL ratchet, with **6 waivers** carrying it. The
      companion `known_open_pinned_cases` tracks at 157.

      AND THE "SAFEGUARD BECOME A TOLL BOOTH" READING THIS ARTIFACT FIRST CARRIED IS REFUTED
      BY THE WAIVERS' OWN TEXT. Four of the six record pins being CLOSED BY FIXES — roughly
      120 pins in total: RQ-66-BOTHWRONG closed 77 (104 -> 27), RQ-67-CALLEESAVE 38 across
      three tables (321 cases), RQ-67-HIGHWORD 4 (26 cases), RQ-74-PINDEBT2 one more
      (85 -> 84, "the number went DOWN because a pin was CLOSED BY A FIX"). The two RISES are
      each labelled measurement expansion in the ledger's own words — "THE PIN DEBT DID NOT
      GROW -- ITS MEASUREMENT DID" — because previously-unoracled findings (prose only, not
      pinned, not in ci.yml, not tested) gained red-first oracles.
      SO THE REAL DEFECT IS THE COMPARISON, NOT THE TREND. `baseline: 27` was set when the
      population was NARROWEST, immediately after those 77 closed, and the measurement has
      since widened by about 106 counted wrong answers across six new oracles. "84 against a
      baseline of 27" therefore sets a WIDE population against a NARROW one — two tallies with
      different denominators, which this repo's own rules forbid. The figure is not evidence of
      accumulation; quoting it as debt growth without saying the denominator moved is the
      error.

      #1373 CARRIES THE OTHER HALF and it is the one that makes this actionable: of 40 open
      pinned issues, **28 were never revisited**. A pin says "this returns the wrong answer
      today, issue #N" — exact in both directions, which is its virtue — but nothing
      re-asks whether it is STILL wrong. Some fraction of the 84 are plausibly already
      fixed by unrelated work, and a suppression that hides a fixed bug also hides whatever
      else goes wrong behind it.

      THE RE-ASK AS FIRST SCOPED IS ALREADY PERFORMED — CONTINUOUSLY, BY THE ORACLES
      THEMSELVES — and that is the lane's most useful result. Every one of the six non-empty
      tables pins EXACT IN BOTH DIRECTIONS, in their own words: `invalid_accept_1207` reds on
      "a cell that moves in EITHER direction (a false accept fixed, or a decline that
      regresses to an accept)"; `selector_parity_197` "is RED when a pinned count MOVES in
      either direction"; `ra003_join_1230` and `self_contained_boot_sweep_1189` say the same.
      And the oracles RAN and PASSED on main `e0cfef85` — `RQ-66-UNWATCHED`, `selector
      parity`, `RQ-66-WATCHED` and `Claim Check` all success — checked rather than assumed,
      because a green that never ran is not evidence.
      A PIN THEREFORE CANNOT BE STALE WHILE ITS ORACLE IS GREEN. "All 84 still wrong" is not
      a measurement waiting to be made; it is the continuously verified present state, and
      re-running the oracles would re-derive what CI already asserts on every push.

      SO THE REAL GAP IS #1373's OTHER HALF: 28 OF 40 OPEN PINNED ISSUES WERE NEVER
      REVISITED. The pins prove the defects REPRODUCE; nothing tracks whether a FIX was ever
      ATTEMPTED, and an exact self-verifying pin is precisely what makes leaving one
      comfortable. That is the original RQ-66-PINDEBT worry — "nothing made a pin TEMPORARY" —
      now carrying evidence instead of suspicion. `stale_pin_check.py` covers only the
      adjacent case, a pin whose ISSUE closed while the divergence persists (RQ-73, built
      from the #1229 specimen where the board said fixed and the oracle disagreed).

      AND THE FIGURE'S COMPOSITION MATTERS MORE THAN ITS SIZE, derived with the checker's own
      `_pin_table` and `_top_level_bindings` after a hand-rolled walk disagreed three times.
      Nine dict-LITERAL tables contribute 45 entries; ONE DictComp contributes 39 —
      `invalid_accept_1207`'s `KNOWN` is a 13-fixture x 3-backend product whose `DECLINES` set
      holds exactly one cell, so 38 are real false-accepts and 1 is a correct decline. FOUR of
      the ten declared tables are EMPTY, and THREE of those four are from the original
      population — not all four, which a cold review showed is arithmetically impossible:
      the original population has four members and one of them (`selector_parity_197`'s
      `KNOWN`, 20 entries) is NON-empty, so at most three empties can come from it. The
      fourth empty table is `i64_result_pair_1189_differential`'s `KNOWN`, which entered
      the population in v0.66 via RQ-66-WATCHED and is empty because RQ-67-HIGHWORD closed
      #1240 and deleted its entries. THREE of the four emptied because a fix closed the
      pins. THE FOURTH DID NOT, and an earlier draft of this sentence said "in every case
      the pins were closed by fixes", which read an emptied suppression table as progress —
      inside the artifact whose whole subject is pin-debt honesty.
      `home_alias_audit_corpus_1189.py:41-43` says it in its own words: the #1222
      declared-width gate "removed the HIT, not the miscompile — `checkRange` still compares
      `$to` at R1:R2 ... so #1226 stays OPEN and is simply no longer visible to this audit;
      no line here can see it". #1226 is OPEN today. `:165-173` adds that "the write that
      made #1226 visible is gone while the wrong homing remains. A #1226 fix will not flip
      anything HERE." So one empty table means the defect became INVISIBLE to its oracle,
      which is the opposite of debt being paid. `_pin_table`'s docstring calls each key "one hand-written decision", which
      is not what it counts for a comprehension — 14 decisions there produce 39 keys, so 84
      entries correspond to roughly 59 decisions. THIS IS NOT GROUNDS TO LOWER THE NUMBER:
      every one of those 38 cells is an observed wrong answer. Quote the figure as OBSERVED
      WRONG ANSWERS, never as hand-written decisions.

      THE TRIPWIRE IS LOCATED AND CLAUDE.md WAS NOT ACCURATE (see `verified-by:`) — the "could not find it" note this
      artifact first carried was a true statement about the WRONG LAYER. It is not code in
      `scripts/claim_check.py`; it is a `count-eq` pin at `claims.yaml:3133`, inside
      `SYNTH-KNOWN-OPEN-PINS-RQ66`:
      `^(?:KNOWN|PINNED)[A-Z0-9_]*\s*(?::[^=\n]*)?=\s*\{` over `scripts/repro/**/*.py`,
      `expect: 12`. In this repo a tripwire of this kind is DATA in the ledger interpreted by
      a generic engine, so grepping the implementation for it finds nothing and invites
      exactly the wrong conclusion. VERIFIED POTENT, three mutations each applied against a
      backup copy: a matching `KNOWN_NEWTHING = { ... }` turns it RED ("count drifted: derived
      13 != documented 12"); `SUPPRESSED_CASES = { ... }` stays GREEN; and
      `KNOWN_VIA_DICT = dict(...)` stays GREEN. The documentation named THREE escapes, not
      two, and only ONE of the three is real as described: `dict(...)` genuinely escapes the
      regex. A dict COMPREHENSION escapes neither layer, and `.update()` escapes neither but
      is silently counted as ZERO — see `verified-by:`. So "both documented escapes are REAL", and the
      pin's own comment already says so — "NARROW ON PURPOSE, documented so the narrowness is
      a choice and not a blind spot" — naming the review obligation. So the documentation
      describes a mechanism that IS there, and the re-ask is NOT outranked.

      REFUTING COMMAND: `python3 scripts/claim_check.py claims.yaml --metric | grep
      known_open`. If `known_open_pins` is at or below its baseline, this premise is dead.
    tags:
      - process
      - quality
      - measurement
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1373"
      # PARTIAL. The tripwire question is ANSWERED and the figure is decomposed, but
      # the attention gap this lane uncovered is not closed. R11 requires a disposition
      # beside `landed:` on a non-claiming status.
      disposition: partial
      landed: "#1452"
      verification-track: manual
      verified-by: >-
        PARTIAL, and three of this artifact's own statements were measured WRONG and corrected.
        ONE: the tripwire is LOCATED — a `count-eq` pin at `claims.yaml:3133`, not code in
        `claim_check.py`; the earlier note was true about the wrong LAYER. Shown POTENT by three
        mutations against a backup copy: a matching `KNOWN_*` literal reds ("derived 13 !=
        documented 12"), while `SUPPRESSED_CASES` and `KNOWN_VIA_DICT = dict(...)` stay green. The two escapes TESTED
        are REAL. BUT THE CERTIFICATION WAS WRONG, and a cold review caught it: this lane
        named THREE escapes and tested two. The third — a dict COMPREHENSION — does NOT
        escape either layer. `_pin_table` reads a DictComp through `_count_dict_comp`, which
        RQ-66-PINDEBT added for exactly that purpose, and the tripwire regex matches its
        opening `= {` like any literal's; all 12 hits were re-derived and
        `invalid_accept_1207_differential.py:133` is one of them. The counter-example is the
        LARGEST table in the population: that DictComp contributes 39 of the 84 entries, so
        the documentation told a reader the biggest table was invisible to both layers when
        it is visible to both. So CLAUDE.md was NOT accurate, and the false sentence was
        corrected in CLAUDE.md and in the `claims.yaml` comment above the tripwire, which
        carried the same error ("requires an `ast.Dict` node"). What remains true is
        narrower: `dict(...)` and `.update()` genuinely escape both. This outranked nothing
        — the re-ask still stands — but a lane that certifies documentation must test every
        claim the documentation makes, not the subset it happened to probe.
        TWO: the "toll booth" reading is REFUTED by the waivers' own text. Four of six record pins
        CLOSED BY FIXES, about 120 in total (RQ-66-BOTHWRONG 77, RQ-67-CALLEESAVE 38/321 cases,
        RQ-67-HIGHWORD 4/26, RQ-74-PINDEBT2 one more). Both rises are labelled measurement
        expansion in the ledger's own words. The real defect is the COMPARISON: baseline 27 was set
        when the population was NARROWEST, and it has since widened by ~106 counted wrong answers,
        so "84 vs 27" spans two denominators.
        THREE: the re-ask as scoped is ALREADY PERFORMED, continuously. Every non-empty table pins
        EXACT IN BOTH DIRECTIONS (each says so), and the oracles RAN and PASSED on main `e0cfef85`
        — checked, not assumed. A pin cannot be stale while its oracle is green, so "all 84 still
        wrong" is the verified present state rather than a measurement to make.
        COMPOSITION, via the checker's own `_pin_table`/`_top_level_bindings` after a hand-rolled
        walk disagreed three times: nine dict-LITERAL tables give 45 entries, ONE DictComp gives 39
        (13 fixtures x 3 backends, `DECLINES` holding one cell — 38 real false-accepts, 1 correct
        decline), and FOUR of ten tables are EMPTY — THREE from the original population, the fourth
        (`i64_result_pair_1189_differential`'s `KNOWN`) added in v0.66 by RQ-66-WATCHED; an
        earlier draft said "all four from the original population", which is impossible
        because one original member is non-empty. 84
        entries are ~59 hand-written decisions; quote the figure as OBSERVED WRONG ANSWERS.
        ALSO DELIVERED BY THIS LANE, and previously missing from this record even though
        `status_evidence_check.py`'s own comment attributes it here: the release-window
        recognizer. The window scan walks `--first-parent` from the PR MERGE COMMIT, so a
        PR's own commits are invisible to it; with no id-leading subject already on main the
        VACUOUS floor fired on every PR and no PR could fix it. `LANE_SUBJECT` /
        `lane_artifact_id` now recognize the `v0.79 PAGESIZE lane:` shape in both the R4 and
        R10 loops, held to the same acknowledgment and attribution demands. It is the only
        substantive instrument change in v0.79, and it ships with NO committed test and no
        negative control — `scripts/test_status_evidence_check.py` has no case for either
        direction — which is a real gap against this repo's own rule that a gate is proven
        only by being made to go red.
        NOT DONE: the attention gap. In #1373's own words, measured 2026-09-24 on the
        v0.72.0 tag and not derivable from this tree, "28 of 40 open issues have not been
        touched since the day they were filed". An earlier draft wrote "open PINNED issues",
        which inverts the issue's point — it says the opposite: "28 open issues have NO pin,
        so the method above says nothing about them". Nothing committed covers the attention
        gap, and this lane did not close it.
      done-when: "manual:2026-10-01 the tripwire is LOCATED (claims.yaml:3133) and EVERY claim the documentation makes about it is tested — confirmed where true and CORRECTED where false, the dict-comprehension escape being false while `dict(...)` and `.update()` are real; the '84 vs baseline 27' framing is corrected to say the DENOMINATOR moved and that four of six waivers record ~120 pins CLOSED BY FIXES; and the re-ask is reported as what it is — already continuous, because every pin is exact in both directions and its oracle ran green on a named commit — with the REAL gap named instead: in #1373's own words, 28 of 40 open issues untouched since filing, which no committed check covers"
