artifacts:
  - id: RQ-79-PAGESIZE
    type: system-req
    release: v0.79
    status: proposed
    title: "No backend reads the declared page size — and the >=32 B scoping asked for is SPEC-INVALID, so the whole capability is (pagesize 1)"
    description: >
      synth REFUSES `(pagesize N)` and the refusal is correct and well-worded; it is not
      to be reverted. But it closed by making a silent wrong answer loud, not by
      implementing the capability, and the capability is now a binding constraint on a
      decision gale has already made.

      WHY IT IS A REACH LANE AND NOT A FEATURE REQUEST. gale's seam decision keeps the
      Component Model boundary as the privilege boundary, and meld established that
      unforgeability is a property of the DOMAIN boundary rather than of the handle — so
      tenant and supervisor must sit in SEPARATE memory domains. Separate domains cost a
      whole 64 KiB page each because nothing reads the declared size, so two tenants cost
      128 KiB before anything else. On the reporter's bench that means the WB55 (192 KiB)
      holds two and the **G474 (96 KiB) cannot** — and the G474 is the board attached to
      the developer machine. Packing is NOT the lever: `--pack-rebase` was measured to
      recover ONE page, because the payload's reserved extent dominates by two orders of
      magnitude.

      SCOPED BY THE REPORTER, AND TAKE THE CHEAP VERSION: powers of two >= 32 bytes is
      sufficient, because ARMv7-M PMSA requires an MPU region to be a power of two >= 32 B
      and size-aligned anyway, so a finer page buys nothing. `__synth_mem_size_N` and the
      RESERVATION must move TOGETHER — that symbol is what an embedder programs one MPU
      region from (#1145), so moving one without the other turns the over-grant from
      silent into subtle.

      NOT ASKED FOR, on the reporter's own reasoning, and do not substitute it:
      `__synth_mem_used_N` is better for fitting and worse for trust, because a derived
      extent needs a derivation an embedder has to believe while a declared page size is
      stated by the module and needs none.

      MEASURED PREMISE at the v0.78 cut: `page_size_log2` is ALREADY decoded onto
      `WasmMemory` (`synth-core/src/wasm_decoder.rs:67`) and used ONLY to refuse
      (`synth-cli/src/main.rs:3704`), so nothing needs re-parsing. BUT IT CHANGES EMITTED
      CODE: `memory.size` lowers to a division by a literal `65536`
      (`synth-backend-aarch64/src/selector.rs:2557`) and `synth-memory` sizes every
      descriptor from a hardcoded `WASM_PAGE_SIZE`. THE ORACLE LANDS FIRST — this is a
      reach increment, and accepting more while checking less is refused by name.

      THE SCOPING ABOVE IS REFUTED BY THE SPEC, MEASURED 2026-10-01, AND THE LANE IS
      RESCOPED RATHER THAN RE-AIMED. "Powers of two >= 32 B" is not implementable, because
      the custom-page-sizes proposal does not permit it. The authority is this repo's OWN
      vendored suite, not a third-party validator:
      `tests/spec-testsuite/proposals/custom-page-sizes/custom-page-sizes-invalid.wast`
      asserts `(memory 0 (pagesize 32))` INVALID by name, alongside 2, 4, 8, 16, 64, 128,
      256, 512, 1024, 2048, 4096, 8192, 16384 and 32768. Across the proposal's four `.wast`
      files the only sizes exercised as LEGAL are `pagesize 1` (19 occurrences) and
      `pagesize 65536` (14). So the permitted set is exactly {1, 65536}, and 65536 is the
      default — meaning THE ENTIRE CAPABILITY IS `(pagesize 1)`, byte-granular sizing.

      Checked against implementations too, with the lineage stated rather than implied:
      `wasm-tools validate --features all` and `wasmtime 41.0.0 -W custom-page-sizes=y`
      both reject every intermediate power of two — but wasmtime VENDORS wasmparser from
      wasm-tools, so those are two front-ends on ONE validator and are not independent
      readings. The vendored spec suite is what makes this a spec fact. Note also that
      `wasm-tools parse` ASSEMBLES all of them: the declaration reaches the bytes
      (`flags=0x09`, `log2` byte appended) and only VALIDATION rejects it, so "it
      assembles" is not evidence of legality.

      WHAT SURVIVES, AND IT IS THE PART THAT MATTERS TO THE BOARD. `(pagesize 1)` sizes a
      memory in BYTES, so a tenant declaring N pages gets N bytes instead of a 64 KiB page.
      That is a finer lever than the rejected ask, not a coarser one, and it still answers
      the G474: two tenants of roughly 20 KiB each fit in 96 KiB where two 64 KiB pages
      cannot. The ARMv7-M PMSA constraint does NOT go away — an MPU region must still be a
      power of two >= 32 B and size-aligned — so the RESERVATION must round the declared
      byte count UP to an MPU-legal extent while the module's declared size does not.
      THAT TENSION IS THE LANE'S REAL DESIGN QUESTION and it must be answered explicitly,
      because `__synth_mem_size_N` is what an embedder programs one region from: reporting
      the declared byte count while reserving a rounded extent re-creates #1315's
      over-grant in miniature, and reporting the rounded extent tells the module something
      it did not declare. Name the choice and its consequence; do not let it be implicit.

      MEASURED STARTING POINT, two memories, `-t cortex-m3 --relocatable --all-exports`:
      `__synth_mem_count = 0x2`, `__synth_mem_size_0 = __synth_mem_size_1 = 0x10000`. The
      region table is emitted for MULTI-memory modules only; a single-memory module gets no
      `__synth_mem_*` symbols at all, so any oracle asserting over that table needs two
      memories or it measures nothing.

      REFUTING COMMAND, CORRECTED — and the correction is the point. The original said
      "compile a module declaring `(pagesize 1)`; if it no longer refuses, this premise is
      stale", which CANNOT DISCRIMINATE: 1 byte is below the 32 B floor the lane first
      asked for, so under that scoping `(pagesize 1)` would have had to keep refusing even
      after the capability landed, and the command would report "still refuses" in both
      worlds. Under the corrected scope `(pagesize 1)` IS the capability, so it is now the
      right probe for the opposite reason. Use BOTH legs: `(pagesize 1)` must flip from
      REFUSE to ACCEPT with `__synth_mem_size_N` equal to the declared byte count, and
      `(pagesize 32)` must refuse FOREVER — as spec-invalid input, with a diagnostic that
      says so rather than repeating the "no backend reads it" text, because after the
      capability lands that sentence is false.
    tags:
      - process
      - reach
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1441"
      # PARTIAL and named as such. What landed is the REFUTATION of this lane's own
      # scoping plus the oracle that must precede the capability; the capability itself
      # did not. R11 requires a disposition beside `landed:` on a non-claiming status,
      # and `proposed` is the honest status for a capability nobody shipped.
      disposition: partial
      landed: "#1445"
      verified-by: >-
        PARTIAL. WHAT LANDED: the spec-permitted set is DERIVED, this lane's own scoping is
        REFUTED, and the oracle is wired. The vendored
        `custom-page-sizes-invalid.wast` asserts `(pagesize 32)` INVALID by name, so the legal set
        is exactly {1, 65536} and the entire capability is `(pagesize 1)` — "powers of two >= 32
        B" was never implementable. `scripts/repro/pagesize_oracle_1441.py` DERIVES that set from
        the suite by paren-balanced removal of negative assertions (a flat regex reads
        `(pagesize 0)` out of the POSITIVE file as legal, which is how its first run failed), runs
        28 assertions, and AUTO-STRENGTHENS when the capability lands because its mode is PROBED
        rather than switched. Wired into spec-suite.yml and not ci.yml, because the suite is a
        submodule only that workflow checks out. Potency: 6 of 7 mutations RED, the survivor
        documented in place rather than hidden.
        WHAT DID NOT LAND: the capability. `(pagesize 1)` still refuses, and the
        declared-size-versus-MPU-rounded-reservation choice is NAMED (two symbols, maintainer's
        decision 2026-10-01) but not implemented. REACH DID NOT MOVE, and saying so is the point.
      done-when: "manual:2026-10-01 the SPEC-PERMITTED set is established from the vendored suite rather than assumed (measured: exactly {1, 65536}, so the capability is `(pagesize 1)` alone and the >= 32 B scoping is REFUTED), the execution oracle for `(pagesize 1)` LANDS FIRST and is shown potent, `(pagesize 1)` is honoured with `__synth_mem_size_N` equal to the declared byte count, the declared-size-vs-MPU-rounded-reservation choice is NAMED with its over-grant consequence, the `memory.size` lowering no longer divides by a literal 65536, and spec-invalid sizes keep refusing with a diagnostic that does NOT repeat the now-false \"no backend reads it\" text — or the lane reports plainly which of these it could not do"
