artifacts:
  - id: RQ-79-ARCHMODEL
    type: system-req
    release: v0.79
    status: proposed
    title: "Recurring N/A, seventeenth filing: feature-loop steps 1-2 (spar AADL -> WIT) skipped again, blocker still open"
    description: >
      The feature loop's rule on itself: if a conditional step is marked N/A for the same
      reason THREE features running, file it — that pattern is how a real MC/DC gap and a
      missing attestation chain stayed hidden across roughly twenty features. Steps 1-2
      (model the architecture in spar, GENERATE the WIT from it) have now been skipped for
      SEVENTEEN consecutive releases.

      THE ORDINAL IS DERIVED, NOT COUNTED BY HAND, AND THE DERIVATION IS STATED WITH THE
      COMMIT IT IS TRUE AT, because the first version of this sentence was itself wrong.
      It said `ls artifacts/release-v*/RQ-*ARCHMODEL*.yaml | wc -l` "returns 16". That was
      true only before THIS artifact's own file existed; run at any commit that contains
      it, the same command returns 17. The reproducible form: there are 16 PRIOR filings,
      v0.63 through v0.78 inclusive with no gaps, so this is the SEVENTEENTH, and the
      command returns 17 at this commit. The derivation is written here because an ordinal
      asserted from memory is the kind of number this project has had to correct — and the
      correction needed was the repo's own "a number is invalidated by the edit that
      writes it", landing on the sentence that exists to prevent it.

      THE BLOCKER IS STILL OPEN AND WAS RE-CHECKED AT THIS CUT, state before body:
      **pulseengine/spar#445 is OPEN** — "spar accepts property associations from
      UNDECLARED property sets silently (rc=0) — a typo'd or invented property is
      indistinguishable from a satisfied one". That is not an inconvenience, it is a
      disqualifying one for this purpose: synth's whole case is that the model DRIVES the
      build rather than sitting beside it, and a modelling tool that cannot distinguish an
      invented property from a satisfied one would let synth generate WIT from an
      architecture nobody validated. Adopting it in that state would manufacture exactly
      the untraceable-evidence problem the loop exists to prevent.

      SO THE DEFERRAL IS CORRECT AND THE FILING IS THE DELIVERABLE. What this artifact
      must NOT become is a silent annual ritual: the honest form is a visible `feature-loop`
      tagged artifact naming the blocker, its state, and the date it was re-checked. KEEP
      THE `feature-loop` TAG — v0.69's ARCHMODEL lost it, and the filing that exists to
      keep a deferral VISIBLE became invisible to the conformance gate, which is the exact
      failure this artifact is a defence against.

      AND IT HAPPENED AGAIN, TO THIS ARTIFACT, BETWEEN THE PLANNING PR AND THIS CORRECTION.
      As first written it carried only [process, feature-loop] — satisfying HALF the
      conjunction — so `find_filed_steps12_decision("v0.79")` returned `RQ-63-ARCHMODEL`,
      a SIXTEEN-release-old filing, marked stale. That is the FOURTH occurrence (v0.65,
      v0.69, v0.75, v0.79) and the fourth to be caught before a tag. The tags are not
      decoration: the matcher is deliberately SHAPE-based rather than id-based so the
      citation goes to an artifact that actually exists, and the cost of that design is
      that an incomplete tag set fails SILENTLY by matching someone else's filing. Do not
      assert the tag set from memory — run the matcher.

      REFUTING COMMAND: `gh issue view 445 --repo pulseengine/spar --json state`. If it is
      CLOSED, the deferral's stated ground is gone and steps 1-2 must be attempted or
      declined on a NEW ground — never carried on a stale one.
    tags:
      - process
      - carried
      - spar
      - aadl
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1136"
      # The filing itself IS this artifact's deliverable, and it landed in #1444
      # together with the tag-conjunction fix that made it visible to the matcher.
      # Still `proposed` because the DEFERRAL continues: spar#445 is open, so
      # steps 1-2 remain skipped. R11 requires a disposition beside `landed:`.
      disposition: partial
      landed: "#1444"
      verification-track: manual
      verified-by: >-
        PARTIAL. The deferral is FILED and, for the first time in four occurrences, the filing is
        VISIBLE to the gate that exists to see it. As first written this artifact carried only
        [process, feature-loop] — HALF of what `find_filed_steps12_decision` requires — so the
        matcher returned `RQ-63-ARCHMODEL`, a SIXTEEN-release-old filing, marked stale. That is
        the FOURTH occurrence (v0.65, v0.69, v0.75, v0.79) and the fourth caught before a tag.
        Tags restored to v0.78's working five and the done-when now requires the full conjunction
        be verified by RUNNING the matcher and asserting `stale=False`, never by reading the tag
        list. Verified: `find_filed_steps12_decision(docs, "v0.79")` returns RQ-79-ARCHMODEL with
        `stale=False`.
        BLOCKER RE-CHECKED, state before body: pulseengine/spar#445 is OPEN — spar accepts
        property associations from UNDECLARED property sets silently (rc=0), so an invented
        property is indistinguishable from a satisfied one. Generating WIT from an architecture
        nobody validated would manufacture exactly the untraceable-evidence problem the loop
        exists to prevent, so steps 1-2 stay skipped and the deferral stands on a CURRENT ground
        rather than a stale one.
      done-when: "manual:2026-10-01 the seventeenth consecutive skip of feature-loop steps 1-2 is filed on #1136 with the ordinal DERIVED from the artifact set, spar#445's state RE-CHECKED and dated, and the matcher's FULL CONJUNCTION satisfied — `feature-loop` in tags AND tags intersecting {aadl, spar} AND a non-empty `issue:` — verified by RUNNING `loop_conformance_check.find_filed_steps12_decision` for THIS release and asserting it returns this artifact with `stale=False`, never by eye"
