# =============================================================================
# synth v0.60 — "Derive what you check against"
#
# THE THEME, in one sentence: no hand-written mirror of a shipped thing, and a
# proof about input we refuse is worth nothing.
#
# Both halves were EARNED this cycle rather than asserted:
#
#   * v0.59 shipped a canary gate (VCR-TIER-001 increment 1) whose immediate
#     finding was that the census's OWN hand-maintained `declared_temps` column
#     declared the #1048 miscompile LEGAL — `&[R5]` (rm_hi) for the i64 shifts
#     and `&[R3]` (rnhi) for the bit-counts are exactly the registers the
#     defect clobbered. A checker that MIRRORS the defect it exists to catch is
#     the sharpest possible argument for deriving contracts from one
#     declaration site beside the shipped artifact.
#
#   * The same release found FIVE silent drops of one shape (#1041 data
#     segments, #1046 the start section, #1052 global initializers, #1048 the
#     i64 operand clobber, #1021 popcnt/R11) — all exit 0, none caught by an
#     existing differential. AArch64 refusing LOUDLY on identical input is what
#     made the class visible.
#
# WHAT WOULD FALSIFY THE THEME: if the derived-contract discipline produces no
# new finding across this release's increments, then "derive, don't mirror" was
# a tidiness argument rather than a defect-finding one. That is a result, and it
# outranks the increments.
#
# SEQUENCING: VCR-TIER-001 increment 1 is already delivered (PR #1061, stacked
# on #1054). The reach work (VCR-REACH-002) is the largest single correctness
# win available and is deliberately NOT gated on the allocator work.
# =============================================================================

# RELEASE METADATA — comments, NOT YAML keys.
# rivet's generic-yaml source format DENIES unknown top-level fields and
# accepts only `artifacts:`. A `metadata:` key makes rivet SKIP THE WHOLE
# FILE with a WARN carrying no `ERROR:` prefix, so the required gate stays
# green because the file is INVISIBLE — that is #1064, which hid all 16
# v0.59 artifacts from the release-readiness query for the entire release.
#   project: synth
#   release: v0.60
#   theme: "DERIVE WHAT YOU CHECK AGAINST — no hand-written mirror of a shipped thing"

artifacts:
  - id: RQ-60-CANARY
    type: system-req
    title: "Canary gate over pseudo-op encoder expansions — the proof stops at the pseudo-op, the machine does not"
    description: >
      VCR-TIER-001 increment 1. 52 of the 80 Rocq-proved VCR-SEL-001 rules emit
      a PSEUDO-OP whose multi-instruction ENCODER EXPANSION the proof never
      sees. `ArmSemantics` executes e.g. `POPCNT` atomically (writes rd only),
      so a scratch register borrowed by the expansion is UNREPRESENTABLE in the
      model. An atomic model of a multi-instruction expansion is a SILENT CLAIM
      that the expansion is scratch-free — and that claim shipped false twice,
      on two different register tiers: #1021 (R11, the linear-memory base — a
      RESERVED GLOBAL, memory corruption) and #1048 (the operand's own home
      registers — a CALLER OPERAND).

      DELIVERED as PR #1061: `expansion_scratch_contract` in
      `crates/synth-backend/src/arm_encoder.rs` is the single declaration site;
      the contract is DECLARED, not derived from observed behaviour, because a
      contract read off the bytes would rubber-stamp any clobber. The gate
      executes all 77 rule-emitted instances on BOTH Thumb-2 and A32 under
      register canaries (R11 = 0xB11B11B1) and asserts nothing outside
      {results} u {contract} u {R12} moved, SP is restored, memory is confined
      to the expansion's own red-zone, the bytes decode fully, and NO DECLARED
      CONTRACT REGISTER GOES UNEXERCISED — so an over-broad contract cannot
      hollow the gate.

      POTENCY IS RE-PROVEN ON EVERY RUN, not just at authoring: two committed
      fixtures hold the REAL old encoders' bytes and must red on exactly the
      pinned registers. Coordinator-verified independently: the pre-#1039
      fixture reds Popcnt:['r11'] AND the operand tier; the pre-#1054 fixture
      reds the operand tier ONLY, with Popcnt ABSENT — so the gate discriminates
      WHICH fix is present rather than merely failing on old bytes. One red from
      one tier is exactly what the wired `i64_shr_599` differential already had,
      and it was structurally blind to the class.

      Derived unguarded set: EMPTY, pinned at empty — stronger than the census
      header's "does not grow".
    status: implemented
    release: v0.60
    tags: [soundness, pseudo-op, encoder-expansion, canary, derive-dont-mirror]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1021"
      # The single declaration site the delivered gate hangs off (#1061).
      done-when: "contains:crates/synth-backend/src/arm_encoder.rs:expansion_scratch_contract"

  - id: RQ-60-CFOBLIG
    type: system-req
    title: "The WASM model has no control-flow syntax — 48% of a real object is covered by neither proof half"
    description: >
      #1057, measured by gale (fathom) over three verified thin drivers:
      477 applied rule instances, 22 SMT-verified (4.6%), 226 declined-but-
      Rocq-Qed, so the UNION is 248/477 = 52% and 229 = 48% is covered by
      NEITHER half. The 48% is not arithmetic — it is control flow (178
      instances) and byte-level memory (30). Every arithmetic and comparison
      rule those objects use is already covered by one half or the other.

      THE CAUSE IS ONE LEVEL DEEPER THAN THE ISSUE COULD SEE, and the
      coordinator verified it before scoping: gale matched theorem names and
      found none for `End`/`BrIf`/`Block`/`Br`/`Call`/`Unreachable`/
      `I32Load8U`/`I32Store8`, and caveated that this might be a naming-scheme
      artifact. It is not. `Inductive wasm_instr` in
      `coq/Synth/WASM/WasmInstructions.v` runs from `I32Const` to `Nop` and
      contains NO control-flow constructor at all, and no sub-word memory form
      (memory is full-width `I32Load : nat -> wasm_instr` / `I32Store` only).
      There is no obligation for `BrIf` because THE MODEL HAS NO `BrIf`.

      So increment 1 is a MODEL EXTENSION, not a proof effort — larger up front,
      and far less exposed to the failure mode this project keeps finding (a
      proof that is real, a model faithful to what it models, and a machine that
      still does something else). It is also smaller than the table suggests:
      the ARM half ALREADY has a branch-taking executor, `exec_program_br`
      (`coq/Synth/ARM/ArmSemantics.v:1194`), load-bearing for all four #73 i32
      div/rem trap guards precisely because a trap guard IS a conditional
      branch. The target semantics for a taken branch are modelled and used in
      anger; what is missing is a WASM-side `BrIf` to correspond to it.

      SCOPE: `BrIf` FIRST, not all eight kinds — gale's own suggestion, and the
      subject of three closed miscompiles (#483, #500, #509, #930 were all in
      this area, which argues these are the rules most worth an obligation).

      THE METRIC IS THE UNION, NOT A THEOREM COUNT. A `BrIf` obligation that
      does not move gale's 477-instance denominator has not delivered what the
      issue asked for. Report the post-change number from the Rocq KERNEL
      (`//coq:verify_proofs` + claim_check), not from a grep over `.v` files —
      gale's own caveat #2 is that it read Qed/Admitted from source without
      re-running the kernel, and that gap applies to us too.
    status: proposed
    release: v0.60
    tags: [proof, wasm-model, control-flow, reach, union-metric]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: proof
      issue: "#1057"
      # Increment 1 is a MODEL EXTENSION: done means the WASM model gains a
      # BrIf constructor (today `Inductive wasm_instr` has no control flow).
      done-when: "contains:coq/Synth/WASM/WasmInstructions.v:BrIf"

  - id: RQ-60-A64IMPORT
    type: system-req
    title: "AArch64 accepts 1.6% of real modules — import dispatch is the top blocker, and synth already implements the pattern"
    description: >
      VCR-REACH-002. Measured over 805 REAL-WORLD modules (#1017 — toolchain
      output and wasm.directory components, not spec fixtures): ARM accepts
      531/805 (66%), RISC-V 113 (14%), AArch64 13 (1.6%). A verified compiler
      that accepts 1.6% of real AArch64 input is verified about almost nothing.
      Reach is part of correctness.

      The top blocker is AArch64 IMPORT DISPATCH — ~121 modules, and 88 of 101
      real components. This is the Wasker/wasm2c undefined-symbol pattern, and
      critically IT IS SYNTH'S OWN ARM `--relocatable` DESIGN PORTED (#197:
      `--relocatable` forces the direct selector `select_with_stack`, which
      emits direct `func_N` imports as undefined symbols resolved at link).
      So this is a port of a shipped, proven-in-anger pattern, not a design
      question — which is exactly why it is the first reach increment.

      SECOND (separate increment, not this one): multi-memory, 124 modules.
      Declining it stopped being "we only do standardized wasm" when multi-
      memory became a Wasm 3.0 STANDARD on 2025-09-17.

      HONESTY REQUIREMENT: the acceptance number is the deliverable. Re-run the
      805-module census after the change and report the new AArch64 figure
      against the 13/805 baseline. A change that adds a code path without moving
      the census has not delivered. If some subset cannot be accepted, name the
      subset and the reason — an honest frontier beats a widened one, and this
      release has already spent five findings on the cost of a silent decline.
    status: implemented
    release: v0.60
    tags: [reach, aarch64, imports, relocatable, census]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1017"
      # #1071's delivered surface: the driver-supplied SHN_UNDEF externals
      # allowlist on the aarch64 relocatable ELF builder.
      done-when: "contains:crates/synth-backend-aarch64/src/elf.rs:undefined_externals"

  - id: RQ-60-RACOST
    type: system-req
    title: "The allocator's remaining wins are the cost model and tied operands, not a better search"
    description: >
      VCR-RA-011. The research verdict and synth's own measurement agree, and
      this artifact exists partly to stop the search-algorithm question being
      re-litigated: LLVM moved to greedy in 2011 and WebKit recently replaced
      Air's IRC graph colouring with a greedy allocator at similar quality and
      much higher speed; both converged on COST MODEL, COALESCING/HINTS and
      SPLITTING as the real levers. RQ-59-MEASURE found the same thing
      independently — the regression tail traced to the COST METRIC, which
      prices a 2-byte register copy and a 4-byte frame reload IDENTICALLY.

      TWO CONCRETE INCREMENTS:

      (1) TIED OPERANDS. Merge tied use/def webs so an rmw colour mismatch is
      UNREPRESENTABLE rather than detected — 49 of 71 single-block declines.
      Making a defect class unrepresentable is worth more than a check for it,
      the same argument the canary gate's empty-contract default makes.

      (2) REAL-ENCODER BYTE COSTS. Replace occurrence counts with measured
      costs: copy = 2B, wide reload = 4B, scaled x10^loop_depth, normalized by
      live-range length. Fried et al. (CC 2023) has the exact arithmetic. Take
      the BYTES FROM THE REAL ENCODER, not from a hand-written size table —
      #936 already established that a hand mirror of the encoder's own offset-
      fold threshold was UNSOUND at authoring, and this release's theme is that
      lesson generalized.

      RULED OUT, WITH REASONS, so they are not re-proposed: porting regalloc2's
      backtracking engine (its wins are pressure-at-scale wins), ILP/SMT in the
      compile path (trusted-base cost), SSA-chordal (optimizes the non-binding
      constraint; synth is not SSA), ML-guided eviction (non-deterministic
      quality, antithetical to a proof-carrying compiler).

      GATE: VCR-RA-003's whole-function validator is the ACCEPTANCE ORACLE —
      build against it. Byte-changing, so frozen anchors and the execution
      differentials gate every step; a deletion that moves emitted bytes without
      an oracle proving the new bytes correct is REFUSED, not explained.
    status: proposed
    release: v0.60
    tags: [allocator, cost-model, tied-operands, measured, byte-changing]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#242"
      # Done is a measured allocator verdict (VCR-RA-003 acceptance oracle +
      # frozen anchors + execution differentials), not a single in-repo
      # signature. Direction-A protection rests on the delivery-commit floor.
      done-when: "manual: acceptance is VCR-RA-003's whole-function validator plus the byte-changing differentials; no single file/symbol is the verdict"

  - id: RQ-60-ARTIFACTSPLIT
    type: system-req
    title: "The per-release artifact file is a single write surface for every parallel lane"
    description: >
      #1059, filed after the class caused a real trace-graph corruption during
      the v0.59 wave. Six lanes appending to `artifacts/release-v0.59.yaml`
      produce conflicts BY CONSTRUCTION, and the conflict is in a hand-merged
      TYPED artifact — the worst place for one.

      WHAT IT COST: a "keep both sides" resolution spliced a new artifact INTO a
      sibling's mapping, between `RQ-59-DATASEG`'s `tags:` and its
      `links:`/`fields:`, so DATASEG silently LOST its `derives-from BR-001`
      link and the new artifact inherited it — plus a duplicate `issue:` key.
      Only the duplicate key was caught, and only because `Rivet Validation` is
      required. The dropped trace link would have SHIPPED: a requirement reading
      `implemented` with no link to the business requirement it derives from,
      inside a release whose readiness is a QUERY over exactly these fields.

      WHY THE CHECK MISSED IT: the resolution was verified with `yaml.safe_load`
      plus an id count, which reported "16 artifacts, no duplicates, YAML OK".
      All three statements were true. PyYAML SILENTLY KEEPS THE LAST VALUE on a
      duplicate key so it cannot see the first defect, and an id count cannot see
      the second because the ids are unaffected. A permissive parser is not an
      oracle for a typed schema.

      FIX: one file per requirement (`artifacts/release-v0.60/RQ-60-FOO.yaml`)
      with the release `metadata:` in its own `_release.yaml` — rivet already
      scans directories. A lane then CREATES a file and touches nothing another
      lane touches; the class disappears at the source instead of being handled
      more carefully each time.

      SMALLER MITIGATIONS if the split is not taken: a duplicate-key-strict YAML
      check in CI (~8 lines), and a STRUCTURAL assertion that every requirement
      carries its own `links:`/`fields:` with a non-empty `issue:`. The second is
      the more valuable — it catches the defect that would have shipped.
    status: proposed
    release: v0.60
    tags: [infrastructure, rivet, parallel-lanes, typed-oracle]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1059"
      # The fix SHAPE is deliberately undecided (per-artifact files vs the
      # strict-loader mitigation), so pre-naming one shape's signature would
      # bias the decision. NOTE: scripts/status_evidence_check.py already
      # parses release files duplicate-key-strict — the smaller mitigation
      # exists for THIS surface; the artifact stays open for the decision.
      done-when: "manual: shape undecided — either artifacts/release-v0.61/ splits into per-requirement files or the duplicate-key-strict check generalizes; decide, then pin the chosen signature"

  - id: RQ-60-WCETKEY
    type: system-req
    title: "The --wcet-hints seam has no key for internal functions — 7 of 13 loop declines are unaddressable"
    description: >
      #1063, measured by gale (fathom) on the E2 dissolved `gust:os` composite
      (meld 0.48.0 -> loom 1.2.0 -> synth 0.57.0, cortex-m3 --relocatable
      --native-pointer-abi --emit-wcet), 31 functions, 3 bounded / 28 declined:

        wcet fn names: 31   named = 23   anonymous (func_<N>) = 8
        named wcet fns that ARE exports:     23 / 23
        anonymous wcet fns that are exports:  0 /  8

      `synth-wcet-v1` takes its `name` from the EXPORT SECTION and falls back to
      `func_<index>` for every internal function. `--wcet-hints` keys on the
      name, so **7 of the 13 `loop` declines cannot be hinted at all** — and
      `loop` is 13 of 28 declines with 11 `callee-unbounded` cascades behind it,
      i.e. most of the leverage the hints seam exists to unlock.

      THE PART THAT IS WORSE THAN "NOT HINTABLE": a hint written against
      `func_22` SILENTLY RETARGETS the moment an edit adds or removes a function
      earlier in the index space. It still parses, and it still keys onto a
      function — just not the one the author verified. synth always emits its
      OWN derived ceiling rather than the raw hint, so the emitted bound stays
      synth-derived; what a mis-keyed hint corrupts is the OPT-IN, converting a
      decline for a function whose shape nobody looked at. An index is not an
      identity.

      THE NAMES ALREADY EXIST AND ARE NOT CONSULTED. gale pre-empted the obvious
      dismissal: they rebuilt the whole chain with `meld fuse --preserve-names`
      and got a BYTE-IDENTICAL `.wcet.json` while the name section went from 0 to
      59 of 68 functions populated. So this is not a missing-input problem on
      their side — synth carries the names and ignores them.

      THE BLOCKER (their point 1): when the name section is present, use it for
      functions with no export name, and accept it symmetrically as a
      `--wcet-hints` key. Keep `func_<index>` strictly as the last resort when
      there is no name at all.

      THE CAVEAT THEY STATED RATHER THAN LET US DISCOVER, and it must shape the
      design: those names are v2 Rust mangling carrying a CRATE DISAMBIGUATOR
      (`Cs942N1ctoMYm_`) which is NOT content-derived — scry measured 43-45% of
      their function identities churning per build for exactly this reason
      (scry#123; two-tier fix in scry#137: strip the disambiguator where the
      result is unique in the module, flag it build-local where it is not). So
      the name section is BETTER THAN AN INDEX BUT STILL NOT STABLE. Fixing the
      blocker with a key that churns every build would trade an unaddressable
      decline for an unreliable one.

      Their point 2 is a SUGGESTION, not a request, and it is the better shape:
      emit per function the key `--wcet-hints` will actually match on, plus a
      build-local flag, so consumers join against what synth accepts instead of
      reconstructing it from mangled symbols. Decide it deliberately.

      KILL-CRITERION (gale's, adopted verbatim): a hints file keyed on the
      name-section name of one of those seven functions converts its `loop`
      decline into `hint-verified` — or is rejected with a NAMED reason, which
      is equally fine. Being ignored because the key never matches is the
      failure.
    status: proposed
    release: v0.60
    tags: [wcet, hints-seam, function-identity, gale, honest-frontier]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1063"
      # Done is gale's conversion kill-criterion on the E2 composite (a
      # name-section-keyed hint converts or is rejected with a NAMED reason)
      # — an external-input differential, not an in-repo signature.
      done-when: "manual: kill-criterion runs against gale's gust:os E2 composite; the hints-key surface has no pre-nameable in-repo symbol until the design (their point 2) is decided"

  - id: RQ-60-FLIPCOUPLE
    type: system-req
    title: "Three status flips were orphaned in one release — the fix-merges/status-flips coupling is too manual"
    description: >
      Measured on v0.59, in a release where the maintainer loop was EXPLICITLY
      watching for this class because v0.58 had been burned by it:

        RQ-59-TIERCENSUS    #1047 merged; NO open PR flipped it
        RQ-59-GLOBALINIT    #1058 merged; NO open PR flipped it
        RQ-59-PARTIALCENSUS #1051 merged and did not flip ITS OWN status

      All three were caught by hand and folded into unrelated PRs. Three misses
      in one supervised release is not an attention problem — it is a coupling
      problem. Nothing mechanically ties "the code landed" to "the artifact says
      so".

      WHY IT MATTERS RATHER THAN BEING TIDINESS: v0.58 made release readiness a
      QUERY over rivet statuses. A status left `proposed` over shipped code makes
      that query UNDER-REPORT scope at the cut — the release looks smaller than
      it is, and an artifact that shipped can be omitted from the notes,
      the traceability audit, and the evidence package. It fails SILENTLY and in
      the direction that looks like less work rather than more, which is the
      shape this project keeps finding (#1012, #1064).

      COMPOUNDING FACTOR, and the reason this is not simply "add a checklist":
      #1064 showed the v0.59 artifact file was never even LOADED by rivet, so
      for most of the release the readiness query could not have caught a stale
      status even if someone ran it. The two defects hid each other — the file
      was invisible, so the statuses inside it were unfalsifiable.

      SHAPE OF A FIX, to be decided rather than assumed:
        * derive the status from evidence instead of asserting it — an artifact
          whose `issue:` is CLOSED, or whose named test/oracle exists on main,
          is implemented. This is the release's own theme ("derive what you
          check against") applied to the trace graph itself.
        * or: a CI check that an artifact referencing a MERGED PR is not still
          `proposed` — cheaper, and it fails in the noticing direction.
        * or: require the flip in the PR that lands the work, enforced rather
          than conventional (a PR touching `crates/**` for issue #N must move
          #N's artifact) — closest to today's intent, but it cannot catch work
          that lands without an artifact at all.

      The first is the most in keeping with v0.60's theme; the second is the
      cheapest thing that would have caught all three. A NEGATIVE result is
      acceptable: if status genuinely cannot be derived from evidence without
      guessing, say so and take the cheap check.

      KILL-CRITERION: replay v0.59's three misses against whatever is built. A
      fix that would not have caught all three has not addressed the measurement
      that motivated it.

      DELIVERED: `scripts/status_evidence_check.py`, wired in the required
      Claim Check job — a composition of the first two shapes, enforced per
      the third. Every release artifact >= v0.60 declares `done-when` (a
      machine-evaluable signature of its OWN definition of done, or an
      honest `manual: <reason>`); a claiming status whose evidence is absent
      is red (Direction B — a `manual:` claim additionally requires a written
      `verified-by` basis, which the reverted RQ-60-VFPPRESSURE flip did not
      have); a non-claiming status whose evidence exists is red (Direction A
      for work shipped under a different program id, the RQ-60-CANARY shape);
      and a first-parent commit whose subject starts with a release-artifact
      id must be acknowledged — status flipped, or the PR recorded in
      `fields.landed` as "increment landed, outcome does not yet hold". By
      the time of delivery the measured instance count had grown from three
      to SEVEN across both directions; all seven are replayed as committed
      fixtures in `scripts/test_status_evidence_check.py` on every CI run.
      STATED RESIDUAL: work landing with no artifact and no id-first commit
      subject is invisible (warned on when the id is unknown); a false
      `verified-by` basis passes — the gate forces the basis to be written,
      it cannot judge it.
    status: implemented
    release: v0.60
    tags: [rivet, release-readiness, derive-dont-assert, process, measured]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1064"
      done-when: "contains:.github/workflows/ci.yml:status_evidence_check.py"

  - id: RQ-60-VFPPRESSURE
    type: system-req
    title: "Three named functions are the whole remaining gap to a complete falcon M7 cascade — both are VFP pressure"
    description: >
      #1069, filed by jess with a FULLY PUBLIC repro (six components pulled
      anonymously from ghcr, fused with meld, lowered with synth) and measured on
      a real RT1176 Renode model: linear memory byte-exact, 214,696 instructions
      retired, PC in the export region. A working image missing three functions,
      not a paper artifact.

        attitude#tick   GI-FPU-002 phase 1  S0..S15 all live
        ekf#estimate    GI-FPU-002 phase 1  S0..S15 all live
        position#tick   GI-FPU-002 phase 2  D0..D7 all live

      2 of 5 cascade stages export. The cascade cannot close a control loop on
      target without the other three.

      COORDINATOR-VERIFIED against current code before scoping (jess measured
      0.55.0; we shipped 0.59.0):

        * `alloc_vfp_temp(used: &mut [bool; 16])` — the S pool IS 16 slots,
          S0..S15. S16..S31 (aliased D8..D15) are absent from it. Those are
          AAPCS CALLEE-saved: using them costs a prologue/epilogue push/pop and
          roughly DOUBLES the file. Claim confirmed.
        * NO `__aeabi_ul2f` / `l2f` / `ul2d` / `l2d` routing exists anywhere in
          crates/. #869's acceptance comment described exactly this route
          ("through the existing `--builtins` mechanism", core-register based,
          ZERO VFP pressure) and inline-f64 was implemented instead. The
          `--builtins` flag that does exist links a kiln-builtins object and is
          unrelated. Claim confirmed.
        * `has_double_fpu()` is `matches!(self.fpu, Some(FPUPrecision::Double))`,
          so f64 lowering requires m7dp. Claim confirmed.

      REPRODUCED ON 0.59.0, and the minimal case is SHARPER than the cascade:

          (func (export "conv") (param i64) (result f32)
            (f32.convert_i64_u (local.get 0)))

          m4f  -> DECLINED "GI-FPU-002 phase 2: scalar f64 requires a
                  double-precision FPU target (cortex-m7dp)"
          m7dp -> compiles, 124 bytes

      A function whose signature contains NO f64 ANYWHERE is refused for needing
      f64 — purely because synth's own lowering introduces it. That is the whole
      of sub-problem 2 in eight lines, and it is a REACH failure of our own
      making: the estimator cannot be built for the single-precision M4 core it
      is architecturally assigned to, not for lack of hardware capability but
      from the lowering strategy for one conversion.

      HONEST RESIDUAL IN OUR OWN VERIFICATION: sub-problem 1 (S-exhaustion) is
      confirmed only by CODE INSPECTION. The deep-f32 fixture written to
      reproduce it compiled fine at 60 bytes — not deep enough to exhaust
      S0..S15. A lane must build a fixture that actually reddens phase 1 before
