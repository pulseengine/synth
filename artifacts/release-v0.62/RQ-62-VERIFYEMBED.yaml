artifacts:
  - id: RQ-62-VERIFYEMBED
    type: system-req
    title: "The embedder side of the ABI has no gate — a consumer conformed correctly by luck, twice, and was green both times"
    description: >
      jess's top-priority ask on #1132, and the residual RQ-62-EMBEDDER named
      when it closed. It outranks reach for the consumers synth actually has.

      #1131 turned the embedder contract from folklore into prose, and prose is
      a gate for OUR side only: `claims.yaml` + the audit script make the
      emitter's conformance checkable. NOTHING CHECKS THE EMBEDDER'S SIDE, and
      the consequence is measured rather than imagined. jess conformed
      correctly BY LUCK ON TWO INDEPENDENT COUNTS and discovered it only by
      reading the document after their code was green and committed:

        LUCK 1, the values. They read R11 out of synth's self-contained reset
        handler and treated it as authoritative. That image also carries
        OPTIMIZED_LINMEM_BASE = 0x2000_0100, 0x100 above the handler's R11 — a
        1-in-2 guess, won. Their harness then matched relay's SIL reference
        bit-exact, which felt like confirmation and only meant the reading was
        not DETECTABLY wrong on that graph.

        LUCK 2, the clobber. Their C shim sits between boot.S establishing the
        registers and synth's code reading them, and GCC is free to allocate
        R11 as a frame pointer there. It did not — the shim compiled to a bare
        `b.w` tail-branch. Conformance by OPTIMISATION OUTCOME, not by
        conformance. One more local variable and the guarantee evaporates
        silently, and the symptom is a wrong torque rather than a build error.

      THE ASK: a check that REFUSES when any linked object writes R9/R10/R11 —
      `synth verify-embedder <elf>`, or at minimum a documented objdump recipe
      in the same document. synth owns the register assignment and is the only
      party that can check conformance to it. jess's own fix is ~10 lines of
      objdump over the emitted code (not over the -ffixed-* flags, since a flag
      that silently stopped applying looks exactly like one that works), and
      they observe that every embedder will need it and most will not think to
      write it.

      CONSUMER OFFER, on the record: jess will run any prototype against
      `hardware/renode/cascade-invoke/` — a real fused falcon image on an
      emulated RT1176 — and report before we ship it. Take it; an embedder
      check validated only against fixtures we wrote is the shape this artifact
      exists to remove.

      SECONDARY, cheap, and from the same thread: export names contain `@`,
      which is a comment character in ARM assembly, so
      `pulseengine:falcon-cascade/rate@0.7.0#tick` cannot be used as a GCC
      `__asm__` label — it does not error, it TRUNCATES SILENTLY mid-name and
      yields an undefined symbol whose name looks almost right. A draft reply
      claimed the `func_N` alias already solves this; MEASURED, IT DOES NOT —
      the alias is emitted STB_LOCAL, so an external `bl func_0` cannot resolve
      to it (`nm --extern-only` lists only the `@`-bearing name). jess's
      `objcopy --redefine-sym` workaround is still load-bearing. Either emit
      the alias GLOBAL or document the hazard; do not repeat the claim that it
      is already handled.

      WHY THIS IS THE HONEST-REFUSAL PATTERN EXTENDED, not a new idea: jess
      names #952 / #1041 / #1052 as unusually good design — refuse by default,
      the flag is an ACKNOWLEDGEMENT rather than a behaviour change, emitted
      code byte-identical either way, so the flag cannot mask a bug and can
      only record that a human accepted an obligation. Their question is where
      else an obligation goes unrefused. Reserved-register clobber is one.
      Anything a document marks INCIDENTAL is another, by construction.
    status: implemented
    release: v0.62
    tags: [embedder, abi, conformance, consumer-contract, jess]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#1132"
      landed: "PR #1149 — subcommand + negative-controlled CI gate + @-hazard documented-unsolved (with the #656 receipt) + SYNTH-VERIFY-EMBEDDER-1132 pin. Status stays implemented: the done-when's jess-validation leg is theirs to confirm on #1132, not ours to assert."
      done-when: "manual: a mechanical check refuses an embedder object that writes R9/R10/R11, negative-controlled against a deliberately clobbering object, and validated by jess against their RT1176 harness before it ships; the `@`-alias hazard is either fixed GLOBAL or documented as unsolved"
      verified-by: >-
        IMPLEMENTED, NOT VERIFIED — the done-when's jess-validation clause is
        deliberately outstanding, which is why the status stops at
        implemented. What holds, measured: `synth verify-embedder <elf>`
        REFUSES on writes to R9/R10/R11 in any form (dest operands, pop/ldm
        reglists, writeback, long-multiply second dests, mrc/mrrc/vmov
        forms), fail-closed on unknown mnemonics and undecodable bytes, with
        a non-vacuity floor (0 instructions scanned = refusal) and a
        refused misspelled --allow-writer. Negative-controlled BOTH
        directions on real toolchain objects, re-proven every CI run by
        scripts/repro/verify_embedder_gate_1132.py (9 pinned checks: exact
        write count 5 on the 4-shape clobber .s naming all three registers;
        the jess luck-2 shape — a plain -O2 C shim GCC gives `mla r9/sl` —
        refused locally and accepted when rebuilt -ffixed-r9/-r10/-r11;
        synth's own Thumb-2 + A32 --relocatable objects accepted).
        The `@`-alias hazard took the DOCUMENTED-UNSOLVED arm, on measured
        grounds: re-globalizing func_N would regress #656 (GLOBAL func_N =
        multiple-definition collision co-linking two dissolved objects, a
        consumer-filed defect), so the doc now says never to use the
        @-bearing name as an asm label and blesses the asserted
        objcopy --redefine-sym workaround; SYNTH-VERIFY-EMBEDDER-1132 pins
        the UNSOLVED heading TO the #656 STB_LOCAL binding so re-globalizing
        reddens the claim and forces the doc rewrite in the same PR.
        REMAINING before verified: jess runs the prototype against
        hardware/renode/cascade-invoke/ (their standing offer, accepted; the
        ask is posted on #1132) and reports; flip to verified on THEIR
        confirmation, not ours — the RQ-62-EMBEDDER closure shape.
