artifacts:
  - id: RQ-62-REACH
    type: system-req
    title: "Reach is part of correctness — AArch64 accepts 1.6% of real modules, and multi-memory has been a Wasm 3.0 standard since 2025-09-17"
    description: >
      VCR-REACH-002, scoped to a release for the first time. CLAUDE.md's North
      Star extension states the argument and this release exists to act on it:
      "A proof about input we refuse is worth nothing."

      Measured on 805 REAL-WORLD modules (#1017 — toolchain output and
      wasm.directory components, not spec fixtures):

        ARM      531 / 805   66 %
        RV32     113 / 805   14 %
        AArch64   13 / 805    1.6 %

      A verified compiler that accepts 1.6 % of real AArch64 input is verified
      about almost nothing. The top blocker (~121 modules, and 88 of 101 real
      components) is AArch64 import dispatch — which is synth's OWN ARM
      `--relocatable` undefined-symbol pattern ported, the same thing wasm2c
      and Wasker do, and which #1017/RQ-60-A64IMPORT already landed for the
      call and funcref-table shapes. The census should therefore be RE-RUN
      before choosing the next blocker: the denominator moved under us, and
      picking work off a stale acceptance number is the error this release is
      trying not to make.

      SECOND BLOCKER, and the reason the framing changed: MULTI-MEMORY (124
      modules) became a **Wasm 3.0 standard on 2025-09-17**. Declining it is no
      longer "we only implement standardized wasm" — it is declining the
      standard. `VCR-MEM-002` exists `proposed` for the structural-isolation
      lowering and is the natural home.

      INCREMENT 1 IS MEASUREMENT, NOT IMPLEMENTATION: re-run the 805-module
      census on v0.61.0 and publish the three acceptance rates with the blocker
      histogram. Report and STOP. A moved number is as valuable a result as a
      stalled one, and the ranked blockers are the input to every later
      increment. gale was asked for this re-run on #1017; if their numbers
      arrive first, use theirs and say so.

      SCOPE DECIDED 2026-09-04, after a consumer argued against this being
      the release's headline. jess (#1132) measured synth's reach at 100% for
      the falcon cascade — 5/5 stages lowering on both cortex-m7dp and
      cortex-m4f, executing bit-exact against relay's SIL reference on
      emulated RT1176 — and said plainly: "the compile rate was never the
      binding constraint. Publishing it as the headline risks optimizing the
      number a flight consumer doesn't feel."

      THAT IS CORRECT ABOUT JESS AND IS N=1. Their pipeline is curated on a
      pinned toolchain; the 805-module census measures modules nobody curated
      for us. The maintainer's test — "would it hurt anyone, or might others
      be in need of it" — resolves the first half: reach work is additive, and
      a consumer who has not filed yet cannot argue for it. Reach stays.

      BUT THE SECOND HALF HAS A REAL ANSWER, AND IT IS NOT "NO". Reach can
      hurt, and #1072 is the proof rather than the worry: its own framing is
      that "increasing reach converts latent encoder defects into reachable
      ones, and a backend that accepts 1.6% of real input has most of its
      encoder untested by real programs". The release-invisible immediate-range
      defect — a NULL table slot passing the §4.4.8 type check it must trap on
      — was latent ONLY because those modules declined at module level before
      reaching the encoder. Widening acceptance made it live. We found it by
      going to look; a consumer would have found it by flying it.

      SO THE GATING RULE, general rather than per-artifact: EVERY REACH
      INCREMENT SHIPS WITH THE ORACLE THAT MAKES THE NEWLY-ACCEPTED INPUT
      SAFE, and the oracle lands first. An accepted module that silently
      returns a wrong value is strictly worse for a consumer than a loud
      decline — that is synth's whole differentiator, and trading it for an
      acceptance percentage would be the flattery the compliance-envelope
      section forbids. RQ-62-MVLOWER already has this shape (the param-block
      guard may be relaxed only for a shape whose lowering makes #1097's four
      silent-wrong vectors CORRECT); it is written here so it applies to
      multi-memory and AArch64 import dispatch too, not just the one artifact
      that happened to need saying.

      HEADLINE DEMOTED, WORK KEPT: reach is no longer "the one number", and
      the acceptance rate is published as the DENOMINATOR beside every
      capability claim rather than as an objective in itself. jess's ask —
      the embedder contract made mechanically checkable — outranks it for the
      consumers we actually have.

      THE COMPLIANCE ENVELOPE IS PART OF THIS ARTIFACT, not an afterthought:
      CLAUDE.md requires the acceptance rate to be published AS THE
      DENOMINATOR whenever performance is discussed. Loud-decline-over-silent-
      miscompile is the actual differentiator — disclosed, selection bias
      becomes a soundness story; undisclosed, it is the flattery the 2026
      wasm2c-performance findings called out.

      CENSUS RESULT — increment 1, MEASURED 2026-09-05
      (scripts/repro/partial_census_1017.py with its new ranked-blocker
      extension; synth 0.61.0, main @ ae92a35f; per backend, --all-exports
      --relocatable, timeout 60s, zero timeouts/anomalies).

      THE DENOMINATOR FIRST, because it is NOT #1017's 805: 243 unique
      modules by sha256 (131 core + 112 components, 447 MB) — every *.wasm
      reachable on this machine: .rivet/repos/{gale,kiln,loom,meld,scry,
      sigil}, the sibling checkouts ../loom and ../kiln, and synth itself
      (first-path-wins dedup; target/.git/node_modules/worktrees/.claude
      excluded below each root). Per source: kiln 124 (75 core + 49 comp),
      meld 56 (all comp), synth 19, scry 16, loom sibling 15, gale 6, loom
      rivet-mirror 6, kiln rivet-mirror 1. This is org-built fixtures and
      composites — the wasm.directory component stratum and the external
      toolchain-output modules of #1017's 805 are ABSENT and UNREACHABLE
      here; the full 805 re-run remains gale's (asked on #1017; if their
      numbers arrive, cite theirs). NO delta against 66%/14%/1.6% is
      computed in this artifact — those rates are over a corpus this machine
      does not hold, and the done-when's "805-module census on v0.61.0" is
      therefore NOT satisfied by this measurement; what is satisfied is the
      honest subset with its denominator stated.

      PER-BACKEND, accepted / partial / declined / errored (core; comp):
        arm      core 21/0/110/0 of 131 ; comp 6/0/106/0 of 112 -> 27/243 (11%)
        riscv    core 35/0/ 96/0 of 131 ; comp 5/0/107/0 of 112 -> 40/243 (16%)
        aarch64  core 41/0/ 90/0 of 131 ; comp 5/0/107/0 of 112 -> 46/243 (19%)

      RANKED BLOCKER HISTOGRAM (one primary blocker per non-accepted module;
      the #952/#1102 policy refusals attributed to the modal per-function
      skip reason synth's own stderr names behind them):
        arm core (110): 46 i64 load/store offset out of imm12 range; 25
        global initializers not materialized (#1052); 15 active data
        segments (#1041); 15 AAPCS i64/f64 even-aligned register-pair call
        args; 5 encode_operand2 non-rotated immediate; 2 undecodable; 1
        LdrSym Thumb-only; 1 no exports.
        arm comp (106): 30 active data; 27 register exhaustion (no free
        callee-saved for call result while reloading preserved param); 25
        AAPCS pair args; 7 start section not invoked; 5 rule_i32_rotl side
        condition; 5 call_indirect (closed-world check / sidecar range); 4
        f32-requires-FPU-target policy; 1 global-init; 1 stack underflow; 1
        f64 AAPCS-VFP boundary.
        riscv core (96): 86 GlobalGet unsupported in RV32 skeleton; 3 memory
        offset immediate too large; 2 undecodable; 1 each I64Store32 /
        multi-memory (#406) / br_table threshold / CallIndirect / no exports.
        riscv comp (107): 50 multi-memory (#406); 46 GlobalGet; 7 start
        section; 4 memory-offset immediate.
        aarch64 core (90): 41 MemoryCopy unsupported; 35 call value-stack
        discipline loud-decline; 7 active data; 2 undecodable; 2 br_table
        threshold; 1 temp-reg exhaustion; 1 multi-memory; 1 no exports.
        aarch64 comp (107): 50 multi-memory; 42 call value-stack; 7 start
        section; 4 active data; 4 MemoryCopy.

      WHAT MOVED, on the one stratum where comparison is honest — v0.59's
      2026-08-25 run (same script, same flags, same org-repos-on-this-
      machine stratum, arm backend; snapshot differs, 307 then vs 243 now,
      overlap unquantifiable because v0.59's per-module records were not
      preserved): arm accepts went 249/307 (81%, of which 125 were partial
      objects with internal skips, and 77 accepts carried active data
      segments that were being DROPPED silently) -> 27/243 (11%, partial 0).
      The fall is the v0.59–v0.61 honesty hardening doing its job: the #1041
      active-data refusal, the #1052 global-init refusal, and the #1102
      dangling-reloc refusal converted silent-drop "accepts" into loud
      declines, and the partial bucket collapsed into them. An ACCEPT today
      excludes every known silent-drop class; v0.59's larger number included
      them. Anyone reading 81% -> 11% (or #1017's 66% -> anything) as a
      capability regression is comparing an honest number to a flattered one
      — the envelope section above exists for exactly this.

      INVERSION WORTH NAMING: aarch64 — 1.6% on #1017's 805 — is the
      HIGHEST-accepting backend on this corpus (19% overall, 31% of core
      modules) now that RQ-60-A64IMPORT's import dispatch has landed; arm is
      the LOWEST because the relocatable path carries the strictest
      completeness refusals. multi-memory blocks 50 of 112 components on
      riscv AND aarch64 but ZERO on arm (VCR-MEM-002 phase 1 is ARM-only) —
      and those same components then decline on arm for active-data /
      exhaustion / AAPCS causes deeper in their bodies, so no single
      capability un-blocks the component stratum. The two undecodable
      modules are 38- and 55-byte fixtures (kilnd loop.wasm, synth
      examples/wasm/minimal.wasm). Later increments cite THIS measurement
      for org-corpus scoping and gale's #1017 re-run for the 805.
    status: proposed
    release: v0.62
    tags: [reach, acceptance, aarch64, multi-memory, north-star]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: review
      issue: "#242"
      done-when: "manual: the 805-module acceptance census is re-run on v0.61.0 with per-backend rates and a ranked blocker histogram published; any capability increment that follows cites that measurement rather than the v0.60-era numbers"
