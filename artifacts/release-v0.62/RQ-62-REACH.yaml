artifacts:
  - id: RQ-62-REACH
    type: system-req
    title: "Reach is part of correctness — AArch64 accepts 1.6% of real modules, and multi-memory has been a Wasm 3.0 standard since 2025-09-17"
    description: >
      VCR-REACH-002, scoped to a release for the first time. CLAUDE.md's North
      Star extension states the argument and this release exists to act on it:
      "A proof about input we refuse is worth nothing."

      Measured on 805 REAL-WORLD modules (#1017 — toolchain output and
      wasm.directory components, not spec fixtures):

        ARM      531 / 805   66 %
        RV32     113 / 805   14 %
        AArch64   13 / 805    1.6 %

      A verified compiler that accepts 1.6 % of real AArch64 input is verified
      about almost nothing. The top blocker (~121 modules, and 88 of 101 real
      components) is AArch64 import dispatch — which is synth's OWN ARM
      `--relocatable` undefined-symbol pattern ported, the same thing wasm2c
      and Wasker do, and which #1017/RQ-60-A64IMPORT already landed for the
      call and funcref-table shapes. The census should therefore be RE-RUN
      before choosing the next blocker: the denominator moved under us, and
      picking work off a stale acceptance number is the error this release is
      trying not to make.

      SECOND BLOCKER, and the reason the framing changed: MULTI-MEMORY (124
      modules) became a **Wasm 3.0 standard on 2025-09-17**. Declining it is no
      longer "we only implement standardized wasm" — it is declining the
      standard. `VCR-MEM-002` exists `proposed` for the structural-isolation
      lowering and is the natural home.

      INCREMENT 1 IS MEASUREMENT, NOT IMPLEMENTATION: re-run the 805-module
      census on v0.61.0 and publish the three acceptance rates with the blocker
      histogram. Report and STOP. A moved number is as valuable a result as a
      stalled one, and the ranked blockers are the input to every later
      increment. gale was asked for this re-run on #1017; if their numbers
      arrive first, use theirs and say so.

      SCOPE DECIDED 2026-09-04, after a consumer argued against this being
      the release's headline. jess (#1132) measured synth's reach at 100% for
      the falcon cascade — 5/5 stages lowering on both cortex-m7dp and
      cortex-m4f, executing bit-exact against relay's SIL reference on
      emulated RT1176 — and said plainly: "the compile rate was never the
      binding constraint. Publishing it as the headline risks optimizing the
      number a flight consumer doesn't feel."

      THAT IS CORRECT ABOUT JESS AND IS N=1. Their pipeline is curated on a
      pinned toolchain; the 805-module census measures modules nobody curated
      for us. The maintainer's test — "would it hurt anyone, or might others
      be in need of it" — resolves the first half: reach work is additive, and
      a consumer who has not filed yet cannot argue for it. Reach stays.

      BUT THE SECOND HALF HAS A REAL ANSWER, AND IT IS NOT "NO". Reach can
      hurt, and #1072 is the proof rather than the worry: its own framing is
      that "increasing reach converts latent encoder defects into reachable
      ones, and a backend that accepts 1.6% of real input has most of its
      encoder untested by real programs". The release-invisible immediate-range
      defect — a NULL table slot passing the §4.4.8 type check it must trap on
      — was latent ONLY because those modules declined at module level before
      reaching the encoder. Widening acceptance made it live. We found it by
      going to look; a consumer would have found it by flying it.

      SO THE GATING RULE, general rather than per-artifact: EVERY REACH
      INCREMENT SHIPS WITH THE ORACLE THAT MAKES THE NEWLY-ACCEPTED INPUT
      SAFE, and the oracle lands first. An accepted module that silently
      returns a wrong value is strictly worse for a consumer than a loud
      decline — that is synth's whole differentiator, and trading it for an
      acceptance percentage would be the flattery the compliance-envelope
      section forbids. RQ-62-MVLOWER already has this shape (the param-block
      guard may be relaxed only for a shape whose lowering makes #1097's four
      silent-wrong vectors CORRECT); it is written here so it applies to
      multi-memory and AArch64 import dispatch too, not just the one artifact
      that happened to need saying.

      HEADLINE DEMOTED, WORK KEPT: reach is no longer "the one number", and
      the acceptance rate is published as the DENOMINATOR beside every
      capability claim rather than as an objective in itself. jess's ask —
      the embedder contract made mechanically checkable — outranks it for the
      consumers we actually have.

      THE COMPLIANCE ENVELOPE IS PART OF THIS ARTIFACT, not an afterthought:
      CLAUDE.md requires the acceptance rate to be published AS THE
      DENOMINATOR whenever performance is discussed. Loud-decline-over-silent-
      miscompile is the actual differentiator — disclosed, selection bias
      becomes a soundness story; undisclosed, it is the flattery the 2026
      wasm2c-performance findings called out.
    status: proposed
    release: v0.62
    tags: [reach, acceptance, aarch64, multi-memory, north-star]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: review
      issue: "#242"
      done-when: "manual: the 805-module acceptance census is re-run on v0.61.0 with per-backend rates and a ranked blocker histogram published; any capability increment that follows cites that measurement rather than the v0.60-era numbers"
