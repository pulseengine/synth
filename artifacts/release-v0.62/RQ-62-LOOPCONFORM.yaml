artifacts:
  - id: RQ-62-LOOPCONFORM
    type: system-req
    title: "Release authorization is now standing and CONDITIONAL on the feature loop — so loop conformance must be derivable, not asserted by whoever is cutting"
    description: >
      The maintainer granted STANDING approval (2026-09-02) to cut and tag every
      release, replacing per-release approval, with one condition: "yes it
      stands for all releases IF they run through the feature loop."

      THE CONDITION IS THE ENTIRE POINT, AND IT IS CURRENTLY UNCHECKABLE. Today
      the only evidence a release ran the loop is that whoever cut it says so in
      the release notes. A standing authorization gated on a self-assessment is
      precisely the shape this project has spent two releases removing:

        #1085  evidence that could not fail on the failure it defines
        #1091  a gate that printed instead of asserting
        #1113  a floor blind to half its own oracle
        #1119  a rule blind to a whole delivery-commit shape
        #1133  a gate whose scope excluded the file recording programme status

      Adding a sixth instance — at the exact point where human approval was
      just removed — would be the worst possible place to put one.

      DERIVE CONFORMANCE FROM ARTIFACTS THAT ALREADY EXIST. Every step of the
      loop already leaves a machine-readable trace; nothing new needs inventing,
      only joining:

        step 3  rivet          artifacts/release-vX.Y/ populated; statuses
                               evidenced (status_evidence_check already does
                               this — the join is what is missing)
        step 4  oracle-gated   oracle_wiring_check green; the release's own
                               repro scripts wired
        step 5  witness MC/DC  the mcdc gate RAN on the release commit and its
                               BRANCH_POPULATION pins held
        step 6  sigil          the TAG's `Signing E2E` workflow concluded
                               success (v0.61.0: it did)
        step 7  clean-room     an independent cold review ran BEFORE the tag,
                               with its findings recorded (v0.61.0: no
                               blockers, 2 SHOULD-FIXes, both fixed pre-tag)
        step 8  release-exec   pin sweep OK, PR-head-vs-merge diff = 0 lines,
                               every published crate verified live

      STEPS 1-2 ARE THE HARD PART AND MUST NOT BE QUIETLY PASSED. spar/WIT have
      been recorded N/A every release and were never filed until #1136. The
      loop's own rule is that a recurring N/A is a BACKLOG ITEM, not an
      exemption — and the precedent proves it: witness MC/DC was N/A four
      releases running, filed as #912, and #978 made it REAL. So this check
      must treat an N/A as a FILED, REFERENCED decision, never as a blank.

      RED-FIRST, and it is cheap: v0.61.0 conformed on steps 3-8, so it is the
      GREEN corpus. The RED corpus is any earlier release that did not — v0.57
      and earlier predate the witness gate entirely, so a conformance check
      must FAIL when pointed at them. A check that passes on every release ever
      cut is not checking anything.

      SCOPE BOUND, stated because this could sprawl: this does NOT re-litigate
      what the loop should contain, and does NOT gate the merge path. It
      answers exactly one question — "did THIS release run the loop?" — at
      exactly one moment, before a tag.
    status: implemented
    release: v0.62
    tags: [release-process, feature-loop, non-vacuity, authorization]
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      verification-track: review
      issue: "#1136"
      done-when: "contains:scripts/repro/loop_conformance_1136_gate.md:verdict=DOES-NOT-CONFORM"
      verified-by: >-
        scripts/loop_conformance_check.py run both directions on 2026-09-05
        (transcripts in scripts/repro/loop_conformance_1136_gate.md): GREEN
        v0.61.0 exit 0 (steps 3-8 derived — 15 artifacts 15/15 done-when,
        Claim Check / MC-DC / Version Pin Sweep check-runs success on
        d4f935c1, Signing E2E success on the tag, 12/12 crates live); RED
        v0.56.2 exit 1 (predates the witness gate entirely: mcdc_gate.py
        absent, no MC/DC check-run) and RED v0.57.0 exit 1 (16/16 artifacts
        lack done-when, status_evidence_check absent, mcdc gate present but
        BRANCH_POPULATION-unpinned — correcting the brief's "v0.57 predates
        the witness gate" premise: RQ-57-MCDC shipped IN v0.57.0). Steps 1-2
        counted as a real step: N/A accepted only citing the filed
        RQ-62-ARCHMODEL decision, matched by shape not id; an unfiled N/A is
        red (unit-tested). Derivation branches + verdict vacuity refusal in
        scripts/test_loop_conformance_check.py (30 tests, wired in the Claim
        Check job).
