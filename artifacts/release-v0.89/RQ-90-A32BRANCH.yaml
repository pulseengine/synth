artifacts:
  - id: RQ-90-A32BRANCH
    type: system-req
    release: v0.89
    status: implemented
    title: "A32 branches are resolved in A32 word units, and a branch the A32 encoder would get wrong is refused"
    description: >
        SILENT MISCOMPILE, live in v0.89.0 (dd2b791a) and main (df847a16) on
        every A32 build: --target cortex-r5, and every ARM build with no
        --target (the default ISA is Arm32). Two halves of one unit mismatch.
        (1) #1639: arm_backend resolved local label branches only under
        use_thumb2, so on A32 every B/Bcc/Bhs/Blo shipped as the encoder's
        placeholder (imm24 = 0, `b pc+8`) with no relocation. br_if landed one
        instruction past itself, a loop back-edge became a forward skip, and
        br_table / if / else took the wrong arm, all with exit 0.
        (2) #1641: the NUMERIC branches the selectors write are in Thumb
        units, (target - branch - 4) / 2 halfwords, sized against Thumb
        encodings. The A32 encoder reads the same field as (target - branch)
        / 4 words. A guard's `offset: 0` therefore encoded as a branch to
        itself. That covers every --safety-bounds software guard, and, found
        while fixing #1639 and not named in either issue, the i32 div/rem
        trap guards: every A32 i32.div_u/div_s/rem_u/rem_s with a non-zero
        runtime divisor spun forever. The optimized path's pre-resolved
        branches, reached on a self-contained A32 build, are the same class.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact. A
        refutation is a legitimate outcome, reported with numbers. Compile the
        #1639 reproducer with --target cortex-r5 --relocatable and run f(1)
        and sum(3) under unicorn UC_MODE_ARM against wasmtime. If both match,
        the defect is gone.
        CITATION: #1639 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - bug
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1639"
      verification-track: manual
      issue-scope: closes
      done-when: >
        manual:2027-03-31 every A32 label branch and every selector-written
        numeric branch reaches the A32 encoder in A32 word units, a branch
        that cannot be expressed is refused rather than encoded, and an
        execution differential against wasmtime covers block/br_if, loop
        back-edges, br_table, if/else, a call in a loop, the div/rem guards and
        --safety-bounds software on cortex-r5 and no-target. That is delivered
        execution-verified, or REFUTED with the measurement that refutes it.
        The refuting command above is RUN FIRST and its result is reported
        either way.
      landed: "PENDING-PR - #1639 and #1641 - DELIVERED: a wrong-code fix. The refuting command was run first and the defect was LIVE on df847a16: f(1) returned 0 instead of 5 and sum(3) returned 0 instead of 6. Fix, in crates/synth-backend/src/arm_backend.rs: the A32 arm of the emit pipeline now runs resolve_a32_branches and validate_a32_branch_targets. A label branch is resolved against the A32 byte position of its label. A numeric branch is RETARGETED: its Thumb-unit offset is decoded into a target instruction by walking the span with the real Thumb-2 encoder's sizes, then re-expressed as the A32 word distance to that instruction. The gate refuses any surviving label branch (A32 records no relocation for one), any target that is not an A32 instruction start, and any imm24 overflow. The Thumb-2 path is untouched. The A32 encoder comment that said a backward branch of N instructions is offset -(N + 2) now states the units its arithmetic uses: offset = (target - branch) / 4, so that branch is offset -N. No literal islands are involved: A32 has no LdrSym lowering."
      verified-by: >
        DELIVERED, execution-verified against wasmtime-py. New wired oracle
        scripts/repro/a32_control_flow_1639_differential.py, with fixtures
        a32_control_flow_1639.wat and a32_safety_bounds_1641.wat, declares
        `emulations >= 261`. It covers cortex-r5 --relocatable and no-target
        --relocatable (linked with arm-none-eabi-ld), the cortex-r5
        self-contained image (optimized path, entered at symbol & ~1 in ARM
        state and NOT booted, because of #1640), cortex-r5 and no-target with
        --safety-bounds software, and cortex-m4 controls. Red on df847a16: 142
        of the 191 A32 vectors wrong or hung. The cortex-m4 controls are green.
        Green on the fix: 261 of 261. Potency: an off-by-one word offset
        planted in resolve_a32_branches reds every A32 leg. The
        safety-bounds legs are refused at compile time by the new gate. Unit
        tests pin the label resolution, the guard retarget and the gate's
        refusals. The census is base df847a16 vs the fix, 471 inputs (214
        repro .wat + 257 spec .wast) x 21 configurations. Newly refused: 0.
        Newly accepted: 0. Every Thumb-2 (cortex-m3/m4/m4f/m7/m7dp, self-
        contained and --relocatable, --cortex-m, m4 --safety-bounds software),
        RV32 and AArch64 output is byte-identical. A32 functions whose bytes
        changed, all with the same length: 459 of 2077 (cortex-r5 and
        no-target --relocatable), 693 of 1991 (the same with --safety-bounds
        software), 179 of 869 (cortex-r5 self-contained) and 137 of 1119
        (no-target self-contained). The repro corpus was executed on cortex-r5
        --relocatable through an A32 adaptation of the #973 sweep: 58 modules
        and 3747 vectors, 0 mismatches and 0 faults. On df847a16 the same sweep
        gives 889 mismatches and 14 faults, with 167 vectors over budget.
        The same adaptation was also run in two more modes. First, on the
        cortex-r5 SELF-CONTAINED image (the optimized path, entered at
        symbol & ~1 and not booted; a vector that reaches a `bl` is skipped).
        It ran 3144 vectors with 12 mismatches. All 12 are
        i64_width_vstack_946.wat:f_brif, which returns an uninitialised R9
        through `mov r0, r9`, and the cortex-m4 build of that function emits
        the same instruction sequence. On df847a16 this mode gives 610
        mismatches and 18 faults, with 186 vectors over budget. Second, on
        cortex-r5 --relocatable --safety-bounds software with memory-only
        modules admitted. It ran 5432 vectors with 36 mismatches, all
        mem_grow_539 (memory.grow on a fixed memory, the #539 envelope),
        identical on df847a16. On df847a16 this mode gives 1044 mismatches
        and 38 faults, with 785 vectors over budget. Every changed A32
        function contains an A32 B/Bcc word. Functions with B words that did
        NOT change carry only encoder-internal expansion branches (e.g.
        `bpl` in the i64 expansions), which never went through a
        placeholder.
        NOT FIXED, out of scope and recorded for triage: the self-contained
        cortex-r5 image leaves an A32 `bl` unpatched (`bl` to itself), and a
        bottom-tested loop (`loop ... br_if 0`) on the optimized path
        mis-targets its back-edge on Thumb-2 cortex-m4 as well. Both are
        identical before and after this change.
