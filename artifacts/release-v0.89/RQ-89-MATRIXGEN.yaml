artifacts:
  - id: RQ-89-MATRIXGEN
    type: system-req
    release: v0.89
    status: implemented
    title: "The #1568 matrix generator is committed and its figures re-derive from the tree"
    description: >
        The #1568 fix's before/after figures came from a generator that was
        never committed, so they cannot be re-run, and the published
        decomposition of its 162 modules was false.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Search the
        tree for the generator; if it is present and reproduces the published
        figures, report that and close.
        CITATION: #1574 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1574"
      verification-track: manual
      issue-scope: closes
      landed: "PR #1598 - #1574 - DELIVERED. The refuting command, run first, found NO generator in the tree or in git history (git log --all -S'1568' -- scripts/ hits only the NPACONST/NPARESIDUE/VERWIDTH commits, none a generator; no scripts/repro file matches 1568 or a probe matrix). It was not lost, only uncommitted: the v0.88 NPACONST lane's two scratch scripts (probe_matrix.py, exec_matrix.py) were recovered from that lane's session record in their final state and merged, unchanged in what they measure, into scripts/repro/npa_const_addr_matrix_1568.py. Run against binaries built from their commits, the published figures REPRODUCE exactly: the pre-fix f982481f gives 162 cells, 81 WRONG, 75 ok, 6 refused; the post-fix 85914929 gives 0 WRONG, 99 ok, 63 refused, and the per-cell transitions are 75 ok to ok, 24 WRONG to ok, 57 WRONG to refused and 6 refused to refused, with no previously-ok cell changed. The published decomposition is NOT right, which settles R2-3: two axes are partial and the shape axis has five values, not four. The three memory.* families have no memarg and skip every offset-carrying shape, and the third module kind uses only a fifth shape (sliver, i32.const 0x1800 offset=0x1000). That gives nosp 16x4+3x3=73, sp 73, spsliver 16x1=16, total 162. Main 9f123a65 is identical to 85914929 cell for cell."
      verified-by: >
        DELIVERED. Binaries built in detached worktrees from f982481f (the parent
        of the fix), 85914929 (the fix) and 9f123a65 (main). Refusal reasons are
        now classified per cell. All 57 WRONG-to-refused cells carry the
        npa_const_addr_guard needle. Of the 6 cells refused before the fix, all 6
        were GI-FPU-002 float declines; after it, 2 carry the npa guard and 4 are
        still GI-FPU-002, so 59 of 63 refusals are by the guard. WRONG at the
        pre-fix binary, by kind: nosp 65, spsliver 16, sp 0. The script is wired
        into the trap-semantics-oracle job with --expect
        ok=99,refused=63,guard=59,wrong=0, exact in both directions, and declares
        `emulations >= 99` (99 measured through oracle_run.py on main; the 63
        refused cells emulate nothing). RED-FIRST: on the f982481f binary it
        exits 1 with 81 WRONG and all four expectations missed (156 emulations).
        On 85914929 and main it exits 0. Pins moved: the job's --min-oracles
        33 to 34, and the exact emulation floor by +99 over the superseded
        382495 (v0.89 FLOATZERO) in ci.yml and claims.yaml, the total
        oracle_wiring_check.py reports. Paired control: the new floor rc=0 and
        382495 rc=1 on this tree; the new floor rc=1 and 382495 rc=0 on main
        9f123a65. No Rust was touched.
        NOT done: the CHANGELOG [0.88.0] sentence and the 85914929 message
        still state the false 19 x 4 x 3 product. A shipped release's notes are
        not rewritten here.
      done-when: >
        manual:2027-03-31 the #1568 matrix generator is committed and its
        figures re-derive from the tree — delivered with an execution-verified
        result where the lane is a wrong-code fix, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST
        and its result reported either way
