artifacts:
  - id: RQ-89-MATRIXGEN
    type: system-req
    release: v0.89
    status: proposed
    title: "The #1568 matrix generator is committed and its figures re-derive from the tree"
    description: >
        The #1568 fix's before/after figures came from a generator that was
        never committed, so they cannot be re-run, and the published
        decomposition of its 162 modules was false.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Search the
        tree for the generator; if it is present and reproduces the published
        figures, report that and close.
        CITATION: #1574 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1574"
      verification-track: manual
      done-when: >
        manual:2027-03-31 the #1568 matrix generator is committed and its
        figures re-derive from the tree — delivered with an execution-verified
        result where the lane is a wrong-code fix, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST
        and its result reported either way
