artifacts:
  - id: RQ-89-PAGESIZEAPI
    type: system-req
    release: v0.89
    status: proposed
    title: "A custom page size is refused by the published synth-core API, not only by the CLI"
    description: >
        A custom page size is refused only by the CLI. A caller of the published
        synth-core library still has it silently ignored. Custom page sizes
        permit only 1 and 65536.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Call synth-
        core's compile entry point directly with a page-size-1 module, without
        the CLI; if it returns an error naming the page size, the defect is
        gone.
        CITATION: #1339 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - bug
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      issue: "#1339"
      verification-track: manual
      done-when: >
        manual:2027-03-31 a custom page size is refused by the published synth-
        core API, not only by the CLI — delivered with an execution-verified
        result where the lane is a wrong-code fix, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST
        and its result reported either way
