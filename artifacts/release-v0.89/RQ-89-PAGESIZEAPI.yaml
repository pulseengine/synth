artifacts:
  - id: RQ-89-PAGESIZEAPI
    type: system-req
    release: v0.89
    status: implemented
    title: "A custom page size is refused by the published synth-core API, not only by the CLI"
    description: >
        A custom page size is refused only by the CLI. A caller of the published
        synth-core library still has it silently ignored. Custom page sizes
        permit only 1 and 65536.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Call synth-
        core's compile entry point directly with a page-size-1 module, without
        the CLI; if it returns an error naming the page size, the defect is
        gone.
        CITATION: #1339 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - bug
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      issue: "#1339"
      verification-track: manual
      issue-scope: closes
      landed: "PR #1586 - #1339 - DELIVERED. The refuting command, run FIRST through the published Backend API (not the CLI), CONFIRMED the defect: ArmBackend::compile_module on a decoded 20000-byte (pagesize 1) module returned Ok on every path with memory.size lowered as R10 >> 16, because CompileConfig::default() carries memory0_page_log2 16 and nothing derived it from the module; RiscVBackend and AArch64Backend returned Ok with memory.size = 20000 / 65536 = 0. The ARM backend now DERIVES memory 0's page size from the module it is handed and HONOURS (pagesize 1) where the CLI does (relocatable, the direct selector #1441 fixed), and refuses it naming the page size where the CLI does (off relocatable, in both compile_module and compile_function). RV32 and AArch64 refuse it in compile_module and compile_function. Measuring the CLI on the way found the same wrong code LIVE in the shipped binary: refuse_custom_page_size honoured (pagesize 1) on --relocatable for EVERY backend, so -b riscv --relocatable emitted li t0, 0 and -b aarch64 --relocatable emitted mov w9, #0, executed in unicorn as memory.size = 0 where wasmtime answers 20000. The CLI honour is narrowed to -b arm --relocatable. Nothing moves into the synth-core decoder (RQ-71-PAGELIB, RQ-81-PAGESIZE3): the decoder still reports every declaration and only a backend that cannot lower one refuses it."
      verified-by: >
        DELIVERED, red-first through the published API and execution-checked against
        wasmtime. Eleven new Rust tests across synth-backend (5), synth-backend-riscv (3) and
        synth-backend-aarch64 (3) call decode_wasm_module and Backend::compile_module or
        compile_function directly. At the base commit 7 of the 11 fail (ARM 3 of 5, RV32 2 of
        3, AArch64 2 of 3) and the 4 controls pass; all 11 pass after. The ARM test pins the
        exact MOV.W r0, r10 word (4f ea 0a 00) and the absence of LSR.W #16 (4f ea 1a 40). In
        unicorn that MOV, from the CLI's -b arm -t cortex-m3 --relocatable object with
        R10 = 20000, returns 20000, which matches wasmtime; the base -b riscv --relocatable
        and -b aarch64 --relocatable objects return 0. The CLI test refused_on_non_arm_relocatable_1339
        compiles at the base binary on both backends and refuses after. The backend guard
        alone also holds: with the CLI narrowing reverted, both backends still decline the
        function rather than emit 0. Byte identity: 227 fixtures (every scripts/repro and
        tests .wat plus four probes) on 8 paths, 1816 compiles. Exactly 6 differ, and all 6
        are (pagesize 1) modules on riscv or aarch64 --relocatable going from rc 0 to a
        refusal. Every other object hash and every other diagnostic text is identical,
        including all four existing (pagesize 1) refusals. A second sweep covers the paths
        the first did not reach: -t cortex-m3 --relocatable without --all-exports (the #1577
        single-function route), -t cortex-r5 with and without --relocatable (the A32 encoder),
        and a .wast input (the merge call site). The only differences are again the (pagesize 1)
        modules on riscv and aarch64 --relocatable. NEWLY REFUSED: in the repo corpus,
        custom_page_size_1315.wat on those two paths. That moves the macho_host_link
        differential's byte-identical population from 153 to 152 (its floor is 3 digits, still
        PASS). In the unwired spec proposal custom-page-sizes, 21 modules: custom-page-sizes.4 on
        both paths and custom-page-sizes.11 on rv-reloc. .4 declares a 0-byte memory, so its
        memory.size was right by coincidence; .11 has 3 bytes and returned 0. memory_max.1
        moves on both paths from a debug-build overflow panic (rc 101) to the refusal.
        pagesize_oracle_1441.py, with the spec submodule checked out, reports
        32 assertions ACCEPTED size=20000 region=32768 at both binaries. MEASURED, NOT FIXED: an
        IMPORTED (memory 20000 20000 (pagesize 1)) is still silently compiled on every path,
        because the decoder discards imported memory types; ARM --relocatable emits LSR #16
        and riscv/aarch64 emit 0. This needs the imported-memory type list of #1581 and must
        land after it, so #1339 was held open by issue-scope outlives (re-scoped below). KNOWN STALE HINT, kept
        byte-identical on purpose: the CLI refusal on -b riscv and -b aarch64 WITHOUT
        --relocatable still says "Add --relocatable". That advice now leads to the new
        refusal, not to wrong code. MC/DC (RQ-57-MCDC): the RV32 check_page_log2 is in the
        scored synth_backend_riscv::backend surface. Its first draft, a match on the integer,
        lowered to a jump table scored as 18 conditions with 17 DEAD, which pushed dead past
        the ceiling of 51. It is now two single-condition ifs, driven by three new
        rv_page_size_gate harness rows (16 compiles, 0 and 5 refuse). BRANCH_POPULATION adds
        check_page_log2 = 2 and moves compile_function_with_opts 10 -> 11, both from the
        gate's own REPIN output. Paired controls under witness 0.42.0 / rustc 1.96.1: the main
        gate passes the main build and fails the lane build, and the lane gate passes the lane
        build and fails the main build. Locally, dead is 49 on BOTH builds; the lane adds
        +1 decision, +2 conditions, +1 proved and 0 dead, and moves no floor or ceiling. The
        mutation ledger was reanchored by text on the tree rebased onto 0b9fce74: 14 sites, 0 not found, all moved by this lane — 7 in
        arm_backend.rs by +75 and 7 in main.rs by +21, each matching its file's net added
        lines above the site. Mutants 34, controls 3, ci_subset 10 and retired 4 are
        unchanged. Also out of scope: memory.grow on a
        relocatable byte-paged memory returns -1, the pre-existing grow-fails envelope; and
        main.rs logs initial_pages * 64 KB, which overflows in a debug build on a 4294967295-page
        declaration (memory_max.1 still panics on -t cortex-m3 --relocatable in debug).
        RE-SCOPED AT RELEASE PREP, 2026-10-28, from outlives to closes. The residual
        named above, the IMPORTED (pagesize 1) memory, was delivered after this lane by
        RQ-89-IMPSIZE (PR #1592, #1584): every per-memory page-size check now walks the
        memory index space, so an imported (pagesize 1) is refused or honoured exactly like
        a defined one. Its library tests are red-first: synth-backend
        tests/library_imported_pagesize_1339.rs fails 2 of 3 on the d4c0b232 backend
        sources and passes after. Its execution oracle, imported_memory_size_1584, has 0
        disagreements after the change, where the imported 20000-byte (pagesize 1) memory
        had compiled rc=0 on all 7 legs with ARM --relocatable answering memory.size 0.
        Re-probed on the synth 0.89.0 debug binary: an imported (memory 20000 20000
        (pagesize 1)) compiles on -b arm --relocatable to mov.w r0, r10, and returns 20000
        under unicorn with R10 = 20000. It is refused, naming the page size, on ARM
        self-contained and on riscv and aarch64, with and without --relocatable.
        #1339's asks, read from its body and comments, and who delivered each.
        (1) A caller of the published library must not have a custom page size silently
        ignored: delivered for defined memories by THIS record (Backend::compile_module
        and compile_function on ARM, RV32 and AArch64), and for imported memories by
        RQ-89-IMPSIZE. The awsm and wasker Backend impls are stubs that return an error
        for every module, so they ignore nothing.
        (2) __synth_mem_size_N must not inherit the over-grant: the region table is
        emitted only by synth-cli, not by any library backend. The CLI reports the
        declared byte count since #1441, re-run here as pagesize_oracle_1441's 32
        assertions, ACCEPTED size=20000 region=32768.
        (3) Refused or honoured: gale (fathom, 2026-09-22) asked for honoured. It is
        honoured where it is lowered (ARM --relocatable) and loudly refused everywhere
        else, which is what the theme counts as delivered.
        Not a remaining ask: the 2026-09-24 comment says "the refusal belongs at the
        synth-core boundary". The published compile boundary is the Backend trait, and
        that is where the refusal now sits. The decoder is unchanged on purpose
        (RQ-71-PAGELIB, RQ-81-PAGESIZE3): it reports every declaration, and only a backend
        that cannot lower one refuses it.
      done-when: >
        manual:2027-03-31 a custom page size is refused by the published synth-
        core API, not only by the CLI — delivered with an execution-verified
        result where the lane is a wrong-code fix, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST
        and its result reported either way
