        Round 2 of the v0.88 cold review found three gaps in the round-1 number
        extractor beyond the two #1553 named: hex quantities are missed, the end
        line of a ranged citation leaks, and finding labels are read as numbers.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Run the
        extractor's self-test with a hex quantity, a ranged citation and a
        finding label added; if each is handled, the lane is moot.
        CITATION: #1575 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
