artifacts:
  - id: RQ-89-NPM8
    type: system-req
    release: v0.89
    status: proposed
    title: "The npm package publishes the release version, or its blocker is re-measured and named"
    description: >
        The npm package has not published since 0.69.0; 0.86.0 and 0.87.0 return
        404, re-measured at the v0.88 cut. The blocker sits outside this
        repository and must be re-measured, not carried.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Read the
        registry for the current release version with a User-Agent; if it is
        published, the lane is delivered. Use an older published version as the
        positive control.
        CITATION: #1460 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1460"
      verification-track: manual
      done-when: >
        manual:2027-03-31 the npm package publishes the release version, or its
        blocker is re-measured and named — delivered with an execution-verified
        result where the lane is a wrong-code fix, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST
        and its result reported either way
