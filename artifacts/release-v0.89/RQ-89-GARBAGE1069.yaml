artifacts:
  - id: RQ-89-GARBAGE1069
    type: system-req
    release: v0.89
    status: implemented
    title: "The #1069 VFP-pressure oracle runs in garbage-stack and garbage-register states, not only zeroed"
    description: >
        The #1069 frame-homed VFP locals oracle started every emulated call on
        a zeroed stack with zeroed registers, a state blind to any
        uninitialised read. #1594 (a float local written on one branch only,
        read at the join) shipped from v0.60 on the very rung this oracle
        covers and stayed invisible to it.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Read
        scripts/repro/vfp_local_pressure_1069_differential.py at origin/main
        and look for a non-zero stack or register initialisation; if it
        already runs a garbage mode, report that and close.
        CITATION: #1613 is where the matter was analysed; #1594 carries the
        defect. The numbers name where it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1613"
      verification-track: manual
      issue-scope: closes
      landed: "PR for #1613 - DELIVERED. The refuting command, run first, found no garbage mode: new_uc mapped a fresh zero stack and wrote only SP, FPEXC and CPACR, and no register was seeded. vfp_local_pressure_1069_differential.py now runs every vector in three states (zz zeroed; gz garbage stack, three patterns 0x41414141 / 0x7FC00001 / seeded random; zg garbage R0..R12 and S0..S31, seeded 0x1069), the naming float_local_zero_init_1594_differential.py uses. What is compared is unchanged. Its fixture reached no one-branch-written float local, so a new fixture vfp_local_pressure_1069_zeroinit.wat re-seats the #1594 p_cond, p_brif (f32) and p_cond (f64, exported d_cond) bodies verbatim, gated onto the vfp-frame-locals rung from SYNTH_RECOVERY_STATS. Population: 98 original rows plus 126 new rows is 224 vectors, 1120 emulations (zz 224, gz 672, zg 224). No Rust was touched."
      verified-by: >
        DELIVERED. POSITIVE CONTROL: a binary built from ee994d6c^ (the commit
        before #1594's fix merged) in a detached clone. The extended oracle
        exits 1 at the first gz row, p_cond(0.0, 0) got 0x41414141 want 0. On
        the new fixture's 630 emulations that binary scores zz 0 of 126 wrong
        (the old zeroed-only state is green), gz 80 of 378 wrong (p_cond 26,
        p_brif 27, d_cond 27) and zg 0 of 126 wrong. The current binary scores
        0 wrong in every state and the whole oracle exits 0 with 1120
        emulations. Pin moved: the oracle's declared floor 98 to 1120, and the
        exact emulation floor by +1022 over the superseded 382876 (v0.89
        NPAOFFSET) in ci.yml and claims.yaml, the total
        oracle_wiring_check.py reports. Paired control: the new floor rc=0 and
        382876 rc=1 on this tree; the new floor rc=1 and 382876 rc=0 on main
        d048b523.
      done-when: >
        manual:2027-03-31 the #1069 oracle runs every vector in garbage-stack
        and garbage-register states with a positive control red on the
        pre-#1594-fix binary — delivered with an execution-verified result,
        and the refuting command above is RUN FIRST and its result reported
        either way
