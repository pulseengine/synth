artifacts:
  - id: RQ-89-JOINALIAS
    type: system-req
    release: v0.89
    status: proposed
    title: "An if/else join register no longer aliases a local's home register"
    description: >
        SILENT MISCOMPILE: an if/else join register can alias a local's home
        register, so f(0) returns 18 where wasmtime returns 9. Its relation to
        #1566 is to be measured, not assumed: they may share one cause or be
        two.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Run the #1189
        reproducer and the home-alias class differential against the current
        binary; if the reproducer matches wasmtime, report that with its
        outputs, and state whether #1566's fix is what moved it.
        CITATION: #1189 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - bug
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1189"
      verification-track: manual
      done-when: >
        manual:2027-03-31 an if/else join register no longer aliases a local's
        home register — delivered with an execution-verified result where the
        lane is a wrong-code fix, or REFUTED with the measurement that refutes
        it; and the refuting command above is RUN FIRST and its result reported
        either way
