        REBASED over #1602 (NPAOFFSET, d048b523) and #1607 (REINTERP,
        8e1097f6). #1602 is the #1580 effective-address rewrite of a constant
        plus memarg offset under --native-pointer-abi.
        That rewrite folds an offset into the constant that feeds a
        memory-0 access. Such a constant is charged to memory 0 by the
        provenance pass, so it can never be one kept raw as a memory-k
        offset. A guard makes that explicit: if the rewrite ever touched a
        raw-kept constant, the function is refused. All #1145 oracles and
        #1580's npa_offset_cross_segment_1580_differential (42 calls) pass on
        the rebased tree. The home-register write audit's corpus pins are
        re-measured on each base. Over ff0b1395 (#1618 BRF32) they are
        functions 7443 -> 7461, homes 8916 -> 8942 and attributed
        instructions 240971 -> 241265, with hits 0. Decomposed by isolation:
        codegen accounts for +6 / +18 / +130, the spec suite's memory_copy0
        `copy`, memory_copy1 `copy` and memory_fill0 `fill`, each newly
        compiling on the two relocatable legs; fixture growth (the two flag
        fixtures) accounts for +12 / +8 / +164. Those three spec functions
