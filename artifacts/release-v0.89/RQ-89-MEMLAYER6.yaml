        trap-preserving bounds mode, because software/mask refuse every
        memory-k op.
        RE-RUN AT RELEASE PREP, 2026-10-29, on the synth 0.89.0 debug binary
        built from main 9032f76a plus the version bump, with this lane's
        execution script and the spec suite at the pinned submodule. The
        result is the same on cortex-m4 and cortex-m4f --relocatable, and it
        includes the supporting load8_u rows the paragraph above leaves out.
        memory_copy0: copy 9 rows (7 bit-identical, 2 trap rows not trapped),
        load8_u 19 of 19 bit-identical. memory_copy1: copy 7 rows (5 and 2),
        load8_u 6 of 6. memory_fill0, plain and NPA: fill 6 rows (3
        bit-identical, 3 divergent), and the follow-on load8_u 9 rows (7
        bit-identical, 2 divergent, at 0xff00 and 0xffff, reading the bytes
        the untrapped out-of-bounds fill wrote). Both modules are refused
        under --native-pointer-abi, as stated above. memory-multi.wast is NOT
        among the newly compiling functions the audit counts. The missing trap
        mode for memory-k
        bulk ops is filed as #1619 for v0.90.
        THE OPT-IN ASSERTION, maintainer decision 2026-10-28. Under
        --native-pointer-abi the provenance pass is field-insensitive per
        memory, so a cross-memory copy joins the two memories' contents. A
        module that stores pointers in BOTH memories and copies across them
        is therefore refused by default, although no value is shared. That
        default stays. The refusal now NAMES the escape hatch,
        --embedder-copies-carry-no-pointers, and what it asserts: a
        cross-memory memory.copy never carries a value later used as an
        address in the DESTINATION memory. That is the Canonical-ABI
        property; meld adapters copy payload bytes and re-derive pointers.
        Under the flag the pass does not join contents at a cross-memory
        copy, and nothing else changes: a value that addresses both memories
        through any other route is still refused. The flag is named in the
        --embedder-* family because, like --embedder-mpu and
        --embedder-data-init, it records an obligation synth cannot check
        and the producer of the module must meet. It is refused without
        --native-pointer-abi. The obligation, who guarantees it, and the
        failure mode if it is false (a copied pointer silently dereferenced
        in the wrong memory) are documented in
        docs/embedder-abi-relocatable-arm.md. EXECUTED in
        npa_multi_memory_1145_differential.py.
        scripts/repro/npa_xcopy_merge_1145.wat is the Rust-like adapter
        module: a tenant keeping a static pointer in its frame, a supervisor
        following a pointer in memory 1, and one memory.copy $m1 $m0.
        Without the flag it is refused, and the message must name the flag.
        With it, it executes bit-identical to wasmtime under the isolation
        hook, 5 of 5 calls; memory 0 is compared pointer-aware, because a
        stored memory-0 pointer is native by the ABI.
        scripts/repro/npa_xcopy_violate_1145.wat VIOLATES the assertion: it
        copies the tenant's static pointer into memory 1 and dereferences it
        there. Without the flag it is refused. With the flag it diverges
        from wasmtime, as the oracle requires: memory 1 holds the native
        pointer, and the supervisor's read faults on an unmapped address
        where wasmtime returns 0xa4a3a2a1. REMAINING on #1145, so it
        outlives this release. First, the reporter's own fused module, which
        is unpublished, was not compiled; whether its adapters meet the
        assertion is meld's to guarantee and gale's to confirm. Second,
        __synth_mem_used_N. Third, the per-memory data-base contract
        (gale#398). Fourth, used-extent sizing as a fallback; the reporter's
        2026-10-28 comment says it is not needed if meld#530 declares exact
        extents through (pagesize 1), which this lane shows is honoured per
        memory.
