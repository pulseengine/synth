artifacts:
  - id: RQ-89-MEMLAYER6
    type: system-req
    release: v0.89
    status: proposed
    title: "The reporter's multi-memory --native-pointer-abi blocker is re-measured from their latest comment"
    description: >
        #1145's reporter names --native-pointer-abi's missing per-memory
        layering as the blocker. Name it from their latest comment, not from our
        summary.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Read the
        reporter's latest comment on #1145 and compile their two-tenant shape
        with --native-pointer-abi; report whether it is refused, compiled, or
        executes correctly.
        CITATION: #1145 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1145"
      verification-track: manual
      done-when: >
        manual:2027-03-31 the reporter's multi-memory --native-pointer-abi
        blocker is re-measured from their latest comment — delivered with an
        execution-verified result where the lane is a wrong-code fix, or REFUTED
        with the measurement that refutes it; and the refuting command above is
        RUN FIRST and its result reported either way
