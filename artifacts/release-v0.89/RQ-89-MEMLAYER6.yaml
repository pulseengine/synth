        relocatable legs.
        memory_copy0 `copy` (plain): 9 rows, 7 bit-identical and 2 trap rows
        not trapped (zero-length copies at 0x10001, memories unchanged).
        memory_copy1 `copy` (plain): 7 rows, 5 bit-identical and 2 trap rows
        not trapped the same way. Both modules are refused under
        --native-pointer-abi by the existing #1041 data-segment refusal.
        memory_fill0 `fill` (NPA and plain): 6 rows, 3 bit-identical and 3
        divergent, all caused by the out-of-bounds row fill(0xff00, 1,
        0x101). wasmtime traps and writes nothing; synth writes 0x100
        in-bounds bytes and one byte past memory 2. That is the documented
        default no-trap envelope (--safety-bounds none): main's memory-0
