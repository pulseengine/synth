      done-when: >
        manual:2027-03-31 the reporter's multi-memory --native-pointer-abi
        blocker is re-measured from their latest comment — delivered with an
        execution-verified result where the lane is a wrong-code fix, or REFUTED
        with the measurement that refutes it; and the refuting command above is
        RUN FIRST and its result reported either way
      landed: "PR #1605 - #1145 - DELIVERED: --native-pointer-abi is accepted on a multi-memory ARM --relocatable module, layered per memory. The refuting command was run first on main 7e170d62: the reporter's shape, synthesised as two memories with data in both and a memory-0 stack pointer, is REFUSED rc 1 at the CLI gate (memory-0-only in phase 1), and the single-memory control compiles. Design: memory 0 stays native; memory k stays a wasm offset through its own __synth_wasm_data_k region, lowered exactly as without the flag. A new module-level value-provenance pass, crates/synth-core/src/npa_multi_memory.rs, runs in the CLI before selection. It keeps every constant inside memory 0's static window that may reach a memory-k address RAW, via a per-function op-index set threaded through CompileConfig and remapped across the memory.grow(0) fold and fact-spec specialisation. It picks memory 0's stack pointer only among globals that never reach memory k, and refuses, naming it, any constant, stack pointer, export parameter or import result that may be an address in memory 0 AND memory k. Both refusals of the old gate (CLI main.rs and the selector's multi_memory_pages) are deleted. Byte census, base 7e170d62 vs lane, every repo .wat/.wasm outside the spec suite (261 files x 4 configs: cortex-m3 self-contained, relocatable, relocatable+NPA, cortex-m7dp relocatable+NPA = 1044 cells), measured at the shipped head: 1040 identical, 4 moved (re-measured against main 8e1097f6 after the rebase: 263 files x 4 configs, 1048 of 1052 identical, the same 4 moved), all four the two_mem_npa.wat and two_sp_npa.wat NPA cells (relocatable cortex-m3 and cortex-m7dp), refused before and now compiled and executed correct. mem406_multi_memory.wat stays refused under the flag (rc 1 on both binaries, so it counts as identical), now with the layering's message, because an export parameter is used as an address in both memories."
