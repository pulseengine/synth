        CITATION: #1136 is where the matter was analysed. The number names where
        it was analysed, not an open scope.

        RE-MEASURED AT RELEASE PREP, 2026-10-28: FILED, NOT PERFORMED.
        scripts/recurring_na_filing_check.py, rc 0, failures 0, finds this artifact as
        the visible v0.89 filing. It passes BECAUSE this record exists, so it says the
