artifacts:
  - id: RQ-89-SELWRAP
    type: system-req
    release: v0.89
    status: proposed
    title: "The optimized path's i64 select feeding i32.wrap_i64 returns the right value"
    description: >
        On the optimized path, an i64 select whose result feeds i32.wrap_i64
        returns the wrong value (spec select.wast, as-convert-operand).

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: Execute the
        as-convert-operand case from select.wast through the optimized path and
        wasmtime; if they agree, report it and close.
        CITATION: #1213 is where the matter was analysed. The number names where
        it was analysed, not an open scope.
    tags:
      - feature-loop
      - bug
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      issue: "#1213"
      verification-track: manual
      disposition: refuted
      issue-scope: closes
      landed: "PR #1583 - #1213 - REFUTED: the refuting command, run first, found the defect already gone. select.wast as-convert-operand agrees with wasmtime on both legs (default and --no-optimize), 2 of 2 vectors each, on the v0.88.0 binary at 0161dee1. Nothing was built."
      verified-by: >
        REFUTED, and stated precisely about WHY it is right, because the reason is not that
        the optimized lowering was repaired. The default leg's path for the function is the
        RQ-65-DECLINE (v0.65, PR #1228) fallback: `wasm_to_ir`'s `Select` arm declines an i64
        select (register-pair operands) and the function is lowered by the direct selector
        (`direct (fallback: ...)` under SYNTH_PATH_DEBUG). So it is correct because the
        optimized path REFUSES the shape, not because ir_to_arm handles it.
        THE MEASUREMENT: the spec vectors are weak (results 0 and 1), so the issue's own
        distinguishing probe was also run against wasmtime: an i64 select between
        0x1122334455667788 and 0x1899aabbccddeeff feeding i32.wrap_i64, its high word via
        i64.shr_u, and the full i64 result. Through the parity oracle's own boot-and-call
        machinery (default and --no-optimize images), the three functions for condition 0
        and non-zero: 12 rows, 12 agree. As bare objects on all three legs, default,
        --no-optimize and --relocatable, the wrap and high-word functions for conditions
        0, 1 and 7: 18 rows, 18 agree (0xccddeeff compared as a 32-bit word). A fourth
        probe function with two i64 params and an i32 condition was NOT executed: it needs
        five AAPCS argument words and the harness declines stack arguments, so it is not
        counted. The parity oracle's full run on this lane's tree has no select.wast
        divergence other than the two pre-existing as-memory.grow-value assertions, which
        are a different matter (#539 envelope) and stay pinned under it.
        RE-CHECKED AT RELEASE PREP, 2026-10-28, on the synth 0.89.0 debug binary built from
        origin/main 44cbfe12 plus the version bump. No commit since 0161dee1 touches
        optimizer_bridge.rs. SYNTH_PATH_DEBUG on a self-contained cortex-m4 compile of the
        issue's probe (wrap of an i64 select of 0x1122334455667788 / 0x1899aabbccddeeff)
        and of as-convert-operand still prints `direct (fallback: ... i64 select ...
        issue #1213)` for both functions. As --relocatable objects, with and without
        --no-optimize, under unicorn against wasmtime for conditions 0, 1 and 7: 12 rows,
        12 agree. Both of those legs take the direct selector (#197), so they re-check
        the lowering the fallback lands on, not a repaired optimized lowering.
      done-when: >
        manual:2027-03-31 the optimized path's i64 select feeding i32.wrap_i64
        returns the right value — delivered with an execution-verified result
        where the lane is a wrong-code fix, or REFUTED with the measurement that
        refutes it; and the refuting command above is RUN FIRST and its result
        reported either way
