      landed: "PR #1564 - #1453 - REFUTED: the carried blocked disposition is stale. The release: published trigger has not fired since v0.43.0 (2026-07-15), because bot-published releases raise no workflow events. But the workflow_call path RQ-81 added, which is #1453's own fix option 1, generated a compliance report for every recent release: v0.85.0 4,770,546 bytes, v0.86.0 4,883,339, v0.87.0 4,990,991. The defect #1453 names, a release with no report, no longer occurs."
