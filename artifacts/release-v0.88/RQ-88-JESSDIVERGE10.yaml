artifacts:
  - id: RQ-88-JESSDIVERGE10
    type: system-req
    release: v0.88
    status: implemented
    title: "The reporter's measured divergence PCs are used to localise the lowering defect"
    description: >
        The reporter answered on the thread with the six measured PCs and slot
        addresses; that reply post-dates the v0.87 lane and is unanswered. The held
        reply drafted before it predicts something their measurement refutes, so it must
        not be posted as written. The lane is to use their figures to localise the
        defect in this repository's lowering, which is progress on it, not a re-hardened
        oracle around it.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers:
        Read the reporter's latest comment and check whether its slot addresses resolve
        against the lowered module at this release's binary; if they do not resolve, say
        why with numbers before building on them. Never correct the reporter's figures;
        work from them.
        CITATION: #1436 carries the reporter's measurement. The number names where the matter was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1436"
      verification-track: manual
      issue-scope: closes
      landed: "PR #1564 - #1436 - DELIVERED: a wrong-code fix. The first divergent op, found by comparing every wasm store under wasmtime against every ARM write to linear memory, is 28 stores into tick 1: func 2 f32.store offset=1448 writes 0x411cf5c3 (+9.81) where wasmtime writes 0. Cause: try_lower_f32 pushes a REFERENCE to a float local's home register, and a second local.tee rewrites that register while the first value is still on the stack (the float twin of #989). Fix: detach_vfp_home_aliases copies every stack entry naming a float home before the home is written, and at every if/block/loop entry. On the reporter's own module, sha256 matched, every return word and every one of 16384 linear-memory words now matches wasmtime at 16 and 1024 ticks."
      verified-by: >
        DELIVERED, with the reporter's own measurement as the positive control. On the
        UNFIXED object the harness reproduces their QEMU trace exactly: all 36 gravity-block
        words, all 1024 vel-d words ending at 41221afe, and every read of slots
        0x1358/5c/60 from object 0x30dc (their ELF 0x33c0). Only then was the fix measured.
        The new differential, vfp_home_alias_1436_differential.py, is wired into ci.yml:
        88 of 136 vectors and 15 of 17 exports wrong before, 0 after; its negative
        controls are green both before and after. Mutations: removing only the boundary
        detach reds exactly the 6 control-flow exports, removing both reproduces 88/136.
        Byte identity with the detach toggled: 382 module builds, 4177 functions, 0 differ;
        on the reporter's module only estimate changes (15300 to 15270 bytes). All 17
        existing oracles, fmt, clippy and 3159 workspace tests pass. UNPROVEN: the fixed
        object has not run on QEMU, Renode or silicon, and only one IMU vector was run.
        The maintainer authorised closing execution-verified fixes at the release
        without waiting for the reporter's re-measurement (2026-10-21); the issue
        closes at the tag and reopens if the reporter's hardware disagrees. A
        separate integer twin of this defect was found and is filed on its own.
      done-when: >
        manual:2027-03-31 the reporter's measured divergence PCs are used to localise
        the lowering defect — delivered with measured numbers, or REFUTED with the
        measurement that refutes it; and the refuting command above is RUN FIRST and its
        result reported either way
