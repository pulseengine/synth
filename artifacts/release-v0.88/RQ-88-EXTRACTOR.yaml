artifacts:
  - id: RQ-88-EXTRACTOR
    type: system-req
    release: v0.88
    status: proposed
    title: "The round-two number extractor sees spelled-out numbers and drops citation line numbers"
    description: >
        The extractor that round two uses to attack round one's figures leaks file-
        citation line numbers into its queue as quantities, because the artifact-id
        scrubber runs first, and never sees a number written as a word, although this
        programme writes its load-bearing counts that way.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers:
        Run the extractor on the v0.87 cold-review record and check whether any spelled-
        out count or any citation line number reaches the queue; if neither does, the
        lane is moot.
        CITATION: #1553 is where the two gaps were measured, by the v0.87 round-two audit. The number names where the matter was analysed, not an open scope.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1553"
      verification-track: manual
      done-when: >
        manual:2027-03-31 the round-two number extractor sees spelled-out numbers and
        drops citation line numbers — delivered with measured numbers, or REFUTED with
        the measurement that refutes it; and the refuting command above is RUN FIRST and
        its result reported either way
