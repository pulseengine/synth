        globals, wohl's door engine, the M0 cycle table.

        SYNTH CAN CLOSE ALONE: `synth compile gust_wdg_thin.loom.wasm
        --target cortex-m0plus --relocatable --all-exports` exits 0 with no
        export skipped and every byte of .text decodes as ARMv6-M; on the
        emulator's Cortex-M0 model, read back, the MMIO write sequence of
        each scripted scenario (enumerated from the module's exports)
