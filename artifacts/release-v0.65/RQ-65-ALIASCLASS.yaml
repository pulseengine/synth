        ENUMERATION (docs/analysis/HOME_REGISTER_ALIAS_CLASS_1189.md):
        producers on all four legs — ARM direct (params r0-r3, promoted
        r4-r8, VFP homes), ARM optimized (`vreg_to_arm[dest] = param_reg`),
