artifacts:
  - id: RQ-65-ARCHMODEL
    type: system-req
    title: "Feature-loop steps 1-2 (spar AADL -> WIT) — carried again on an EXTERNAL blocker, re-verified at plan time"
    description: >
      CARRIED FROM v0.64, which carried it from v0.63. The substance is
      unchanged; see RQ-63-ARCHMODEL for the analysis, which is not restated
      here so there is one source for it.

      BLOCKER RE-VERIFIED AT v0.65 PLAN TIME, not carried forward on the
      previous record: spar#445 — "spar accepts property associations from
      UNDECLARED property sets silently" — is still OPEN with no activity since
      2026-09-03.

      This is an EXTERNAL blocker in a sibling repository, and that is a
      different kind of deferral from a scope decision. Nothing here went
      stale, nothing got harder, no measurement expired. It cannot proceed
      because the tool it depends on silently ACCEPTS input it should refuse —
      and building an architecture model on a parser that will not tell you
      when you got it wrong produces exactly the unfalsifiable artifact this
      programme exists to avoid.

      FIFTH CONSECUTIVE RELEASE recording steps 1-2 as N/A, tracked by #1136.
      The loop's own rule says a recurring N/A is a backlog item, not an
      exemption, and the precedent it cites paid off: witness MC/DC was N/A
      four releases running, was filed as #912, and #978 made it real.

      Worth restating because it is easy to miss: the conformance gate does NOT
      accept this prose as evidence. `loop_conformance_check` derives its step
      1-2 slot as NA-FILED only when a release-SCOPED artifact exists — so the
      N/A is discharged by this artifact being FILED and SCOPED, never by
      asserting "synth is a Rust compiler, not AADL-architected". That
      assertion is true, and has still never been examined, which is the point
      of #1136.

      OBSERVED AT v0.64 AND WORTH CHECKING THIS RELEASE: the conformance check
      resolved its step 1-2 slot by citing `RQ-63-ARCHMODEL` in
      `artifacts/release-v0.63/`, not the v0.64 artifact. The slot was
      satisfied either way, but a check that matches the FIRST
      programme-scoped artifact rather than the one for the release under test
      would let a future release inherit a satisfied slot without filing its
      own. That is the "gate that cannot fail" shape and it should be measured.
    status: proposed
    release: v0.65
    tags:
      - spar
      - feature-loop          # REQUIRED by loop_conformance_check's steps-1-2
                              # matcher (feature-loop + aadl|spar + an issue).
                              # Without it this release's own filing is
                              # INVISIBLE to the slot and an earlier release's
                              # artifact silently discharges it — measured at
                              # v0.65, where the unscoped matcher returned
                              # RQ-63-ARCHMODEL for a v0.65 run.
      - recurring-na
      - external-blocker
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1136"
      carried-from: RQ-64-ARCHMODEL
      landed: >-
        PR #1224 — the SECOND half of done-when only. `loop_conformance_check`
        step 1-2 is now RELEASE-SCOPED: measured with the real loader, a v0.65
        run was matching RQ-63-ARCHMODEL (two releases back), and RQ-65-ARCHMODEL
        was itself invisible to the matcher for want of a `feature-loop` tag —
        so the recurring N/A could have lapsed entirely with the slot green.
        The matcher now takes the release under test, returns an older match
        marked `stale`, and the caller fails LOUDLY naming it. Discriminates
        three ways on the real tree (v0.65 PASS / v0.64 PASS / v0.99 stale FAIL);
        tests 33 -> 39 with three mutations each killed by the tests that claim
        them. The artifact stays `proposed`: the FIRST half — spar#445 re-verified
        and the deferral recorded — is cut-time work and has not happened.
      done-when: "manual: either spar#445 closes and the AADL -> WIT path is exercised, or the deferral is recorded again with the blocker RE-VERIFIED at cut time; and separately, loop_conformance_check's step 1-2 slot is checked for whether it matches the artifact of the release under test rather than the first programme-scoped one"
      verified-by: >-
        DEFERRED AGAIN, blocker re-verified AT CUT TIME as the done-when
        requires: spar#445 checked 2026-09-09, still OPEN, last updated
        2026-09-03 — six days before this cut. It is an EXTERNAL blocker in
        another repository; synth cannot close it, and generating WIT from an
        AADL model that spar will silently mis-validate would produce exactly
        the unearned confidence this programme exists to prevent. Fifth
        consecutive N/A for the same reason, filed rather than waved (#1136).

        THE SECOND HALF IS DISCHARGED, and it found a live defect. The question
        "does loop_conformance_check's step 1-2 slot match the artifact of the
        release UNDER TEST, or just the first programme-scoped one?" was
        MEASURED with rivet's own loader: for a v0.65 run the unscoped matcher
        returned RQ-63-ARCHMODEL — an artifact from two releases back — and
        RQ-65-ARCHMODEL was itself invisible to it, lacking the `feature-loop`
        tag. Together the recurring N/A could have lapsed entirely with the slot
        staying green forever, which is precisely the failure #1136 exists to
        prevent. Fixed in PR #1224: the matcher is release-scoped, an older
        match is returned marked `stale` so the caller fails LOUDLY naming it,
        and this artifact carries the tag. Discriminates three ways on the real
        tree — v0.65 PASS, v0.64 PASS, an unfiled release stale FAIL — with
        tests 33 -> 39 and three mutations each killed by the tests that claim
        them.
