artifacts:
  - id: RQ-84-ARCHMODEL3
    type: system-req
    release: v0.84
    status: proposed
    title: "The next recurring N/A filing, ordinal DERIVED by artifact identity and stated WITH its commit"
    description: >
        The architecture step stays blocked upstream. Derive the ordinal from the SAME predicate
        the step one-to-two matcher uses — the feature-loop tag together with a spar or aadl tag
        and a non-empty issue — over the artifact tree read out of git, refusing on a duplicate
        identity or an empty population, and state it WITH the commit it was derived at. Keep
        BOTH the feature-loop tag AND a spar or aadl tag, or the matcher goes blind: a previous
        release lost one of them and the filing that exists to be seen became invisible.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: check the upstream issue's STATE before its
        BODY. If it is CLOSED this is a DELIVERY lane and not a filing, which changes the whole
        shape of the work. Then run the matcher and read its own filed-decision line rather than
        reading the tags.
    tags:
      - feature-loop
      - spar
      - aadl
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1136"
      verification-track: manual
      disposition: deferred
      verified-by: >
        DEFERRED — the filing is made, the BUILD stays blocked, and the ordinal is DERIVED
        rather than tallied. Refuting command in its stated order: `gh issue view 445 --repo
        pulseengine/spar` reports state=OPEN with closedAt null, so the architecture step stays
        blocked upstream and this remains a FILING lane rather than a delivery lane. The
        matcher's own filed-decision line then reads NA-FILED `decided, artifact scoped, not yet
        built: RQ-84-ARCHMODEL3 (#1136, status proposed)`, so the matcher SEES this artifact and
        the tag-blindness hazard is not live; note its own bracket `evaluated at checkout`,
        which reads the WORKING TREE and not the ref.
        ORDINAL BY ARTIFACT IDENTITY, read out of git with the matcher's own predicate — a
        `feature-loop` tag AND a spar-or-aadl tag AND a non-empty issue: this is the 22nd of 22
        at `0c84a3b9`, unbroken across v0.63..v0.84, with no duplicate id and a non-empty
        population, so neither refusal fires. The loop skill's filing threshold is THREE
        releases running and this is the 22nd, which is a maintainer question about the step's
        status rather than something a lane can take, and it is surfaced rather than decided
        here.
      done-when: "manual:2027-03-31 the next recurring N/A filing, ordinal DERIVED by artifact identity and stated WITH its commit — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
