artifacts:
  - id: RQ-84-NOSHOW2
    type: system-req
    release: v0.84
    status: proposed
    title: "The no-show split is an operator judgement with evidence, not a derivation that cannot run"
    description: >
        The standing instruction is to distinguish a runner no-show from a genuine cancellation
        by the absent runner and the zero step count. v0.83 measured that those fields do not
        separate them: a no-show and an operator cancellation are IDENTICAL on conclusion,
        runner name, runner id, runner group, labels, step count, and on the start time
        equalling the creation time. What DOES separate them is the SHAPE — an operator cancel
        produces a CLUSTER of unstarted jobs sharing one completion instant, while a no-show is
        a LONE unstarted job inside a run whose other jobs ran to completion. The deliverable is
        to correct the standing instruction and give the operator that evidence, rather than a
        decision procedure the data cannot support.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: pull one known no-show and one known operator
        cancellation and diff their job objects field by field. If ANY field differs, the
        discrimination IS derivable and this lane is moot.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1484"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the refuting command is NOT RUNNABLE and the documented shape test is shown
        BRITTLE, AND THE ISSUE THIS ARTIFACT NAMES WAS ALREADY CLOSED ON 2026-10-08, before this
        measurement. The command requires one known no-show and one known operator cancellation
        diffed field by field. The window holds 13 cancelled jobs ALL IN ONE RUN and ZERO lone
        cancelled jobs, so the no-show population is ZERO and the diff is UNRUN rather than
        reported as "no fields differ" — a derived population of zero is a refusal, not a pass.
        THE PREMISE AS FIRST WRITTEN WAS FALSE, and the cold review's refutation is the better
        finding. It said "all 13 carry `steps=0`, `runner_name=''`, `runner_id=0` and
        `started_at == created_at`", and derived from the `completed_at` spread (12 jobs at
        09:57:26Z plus 1 at 09:57:58Z) that an exact-equality cluster test fails and the remedy
        is to CLUSTER BY A TIME WINDOW.
        MEASURED: run 37907716195 has 71 jobs, 13 cancelled, and only TWELVE with `steps == 0`.
        The thirteenth — `fact-spec elision oracle (#494 ...)` — carries `steps=33`,
        `runner_name='pulseengine-ci-01-9'`, `runner_id=10495` and `started_at != created_at`: a
        job that RAN on a named runner and was cancelled mid-flight. It is the sole job at
        09:57:58Z.
        So the `steps == 0` population is UNIFORM — 12 of 12 at one timestamp — and the
        "32-second spread inside a single cancellation" was manufactured by admitting a 33-step
        job into a population defined by `steps == 0`. A no-show test keyed on `steps == 0` with
        an empty `runner_name` EXCLUDES it before any clustering, so the `mixed` reading came
        from the population and not from equality-versus-window. The lane's stated deliverable
        was justified by a mis-specified population, which is the defect this release is named
        after, found against us.
        Provenance established rather than assumed: run 37907716195 was `CI` on head 4398fb0b of
        the same branch, created 08:53:00Z and cancelled 09:57:26..59Z while the run for the
        amended head was created 09:57:25Z, so it is a CONCURRENCY SUPERSEDE cancel — automatic
        and attributable — and neither an operator action nor a no-show.
      done-when: "manual:2027-03-31 the no-show split is an operator judgement with evidence, not a derivation that cannot run — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
