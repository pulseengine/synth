artifacts:
  - id: RQ-84-JESSDIVERGE6
    type: system-req
    release: v0.84
    status: proposed
    title: "The three runtime words, or a precise statement of what the reporter must run"
    description: >
        STILL OPEN and externally relayed. v0.83 read the gravity triple out of the object and
        recorded a FALSIFIABLE prediction about which slots discriminate; no runtime value was
        measured, and the drafted reply was surfaced for approval rather than posted. Conduct
        rule four binds: a release whose only work on an externally reported, still-open defect
        was hardening the oracle around it does not count as progress on it. The deliverable is
        the three runtime words, or a precise statement of what the reporter must run to produce
        them.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: `git grep -n "sp,#" -- artifacts/` and re-
        read the recorded operand analysis BEFORE writing code. The expression is already PROVEN
        FAITHFUL and everything addressable from the object is eliminated, so a lane that re-
        derives the object is repeating finished work rather than advancing it.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1436"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the words to sample are NAMED and nothing is posted. The refuting command
        FIRED in the direction this artifact predicted: `git grep -nF 'sp,#' -- artifacts/`
        returns hits in ELEVEN files — a count the cold review confirmed and a POPULATION it
        refuted. They span v0.69..**v0.84**, not v0.69..v0.83; two of the eleven
        (`artifacts/size_attribution_390.md`, `artifacts/verified-codegen-roadmap.yaml`) are not
        release artifacts at all; and one of the eleven is THIS ARTIFACT, which was already true
        when the sweep was first run. Removing the two non-release files and the self-inclusion,
        the set supporting "the object-level work is finished, so a lane that re-derives the
        object repeats it" is EIGHT prior lane records.
        v0.83's hypothesis three was then CONFIRMED OUT-OF-SAMPLE by the reporter's own 64x
        extended run, published AFTER that prediction was recorded. Re-derived independently
        rather than quoted: the `x 9.81` constant is f32 9.8100004, `g*dt` is bits 0x3C20BA20
        exactly as predicted, and vel-d/(n*g*dt) at n=1024 computes to 1.00862 against the
        reporter's stated 1.0086. The quaternion is bit-identical at tick 1024, which places the
        defect downstream of the rotation.
        THE WORDS STILL OWED ARE THE ACCUMULATORS — `[sp,#200]`, `[sp,#216]` and `[sp,#192]` at
        load pcs 0x2490, 0x24bc and 0x24e8 — each sampled AT ITS OWN LOAD PC, because the paired
        multiplicand slots alone are referenced 130, 20 and 34 times in the object. A reply
        naming them is DRAFTED AND SURFACED FOR APPROVAL, NOT POSTED. The residual GROWS with n
        (1.0000 at n=1) and is recorded UNEXPLAINED rather than attributed.
      done-when: "manual:2027-03-31 the three runtime words, or a precise statement of what the reporter must run — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
