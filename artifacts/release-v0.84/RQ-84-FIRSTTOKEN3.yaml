artifacts:
  - id: RQ-84-FIRSTTOKEN3
    type: system-req
    release: v0.84
    status: implemented
    title: "Whether an empty hole for three releases is grounds to decline the issue rather than refuse a fourth time"
    description: >
        The verdict-prose widening has now been refused three releases running, the last time
        because the hole it would close is EMPTY — the gate's own escape derivation returns a
        token for no artifact at all. A fourth refusal on the same ground is an accumulation of
        the shape this programme measures elsewhere. The deliverable is a DECISION: either the
        issue is declined with the empty-hole measurement as the reason, or a cost is named that
        the empty hole does not already answer.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: derive the escape count with the gate's OWN
        function over the gate's OWN population. If it is NON-ZERO the hole is no longer empty
        and the widening has a live justification — v0.83 nearly created exactly that condition
        with the lead words of its own outcome prose, which is why this command reads the gate
        rather than the artifacts.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1476"
      verification-track: manual
      issue-scope: outlives
      landed: "PR #1510 — #1476 — `verdict_prose_check.classify()` now calls `unclassified_lead` when `leading_verdict` returns None, so a verdict-shaped lead that no set classifies is a FAILURE of this gate rather than an exit from its population; proven by a three-way control, re-run at the review commit and stated with it: 109/0/rc=0 clean, 109/1/rc=1 with an escape, 108/0/rc=0 unwired — the 95/95/94 first written here was the v0.83.0-era population, superseded at `2123f729` before this lane landed — plus 17 red subtests that go green. PART THREE is not delivered, so it stays OPEN by `issue-scope: outlives`. A first version of this field said parts two AND three were undelivered, contradicting this artifact's own `verified-by`, which says the second was already addressed when `unclassified_lead` made `NOT_A_VERDICT` load-bearing. The `verified-by` is the one that holds: replacing that set with `set()` moves the population 109 -> 140 and produces 31 failures, which is what load-bearing means. No gate compares two prose fields of one artifact, so the contradiction was invisible by construction."
      verified-by: >
        DELIVERED — the module that NAMES an escape now REFUSES on it. `classify()` called
        `leading_verdict` and never `unclassified_lead`, so a verdict-SHAPED lead in no set left
        the population of the very module this issue names; it now returns that phrase as a
        FAILURE.
        THE DECISION THIS ARTIFACT ASKED FOR, and it is neither a fourth refusal nor a widening.
        Measured BEFORE the change with the gate's own function: ZERO escapes over a population
        of 216 AT `v0.83.0` AND AT THE PLAN COMMIT `0c84a3b9` — the figure became 230 against the
        gate's own 109 at `2123f729`, before this lane landed, so it is stated with its commit
        rather than refreshed — with the four documented escape phrases each returned as a
        POSITIVE CONTROL, so
        the hole is EMPTY OF CONTENT and a widening has no live justification from current
        content. Widening would also make those phrases LEGAL verdicts and thereby DELETE the
        escape report; wiring adds no vocabulary, so it cannot make an escape legal by
        classifying it.
        THREE-WAY CONTROL on live data rather than unit tests alone: wired with no escape is 95
        in population, 0 disagree, rc=0; wired with one planted escape is 95 in population, 1
        disagree, rc=1; the SAME escape against the UNWIRED module is 94 in population, 0
        disagree, rc=0. The third reading is the defect's whole signature — the escaping
        artifact LEAVES the population, so the only trace is a count decrementing from 95 to 94,
        and nothing watches that number for a decrement. Red-first: 17 subtest failures before
        the change and zero after, and the paired control in the same test class asserts that
        NOT_A_VERDICT members and non-all-caps prose still LEAVE the population, so this is an
        escape detector and not a blanket catch.
        ISSUE-SCOPE IS `outlives` BECAUSE THE ISSUE NAMES THREE THINGS AND THIS DELIVERS ONE.
        The allow-list escapes are closed here. The second — `NOT_A_VERDICT` being inert — was
        already addressed when `unclassified_lead` made that set load-bearing. The third, the
        disposition branch, belongs to RQ-84-DISPVOCAB and is NOT delivered here, so the issue
        is HELD OPEN.
      done-when: "manual:2027-03-31 whether an empty hole for three releases is grounds to decline the issue rather than refuse a fourth time — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
