artifacts:
  - id: RQ-84-DISPVOCAB
    type: system-req
    release: v0.84
    status: proposed
    title: "Two gates, two legal vocabularies for one field, and the stricter one wins silently"
    description: >
        One gate accepts three disposition values; another accepts five, including two the first
        refuses. A value legal to the permissive gate therefore cannot land, and nothing names
        the intersection, so an operator reading only the permissive vocabulary writes a value
        that reds a different gate. Met in practice at the v0.83 cut: a first write used a value
        in NEITHER set and the stricter gate is the one that refused.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: import both constants and compare the sets.
        If they are EQUAL the divergence is gone and this lane is moot; if not, the intersection
        is the only safe vocabulary and that is what the fix must name.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1458"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the divergence is MEASURED and its shape is sharper than recorded, no fix
        ships, AND THE ISSUE THIS ARTIFACT NAMES WAS ALREADY CLOSED ON 2026-10-07, before this
        measurement. By IMPORT rather than grep: `status_evidence_check.DISPOSITIONS` is
        {deferred, partial, refuted} and `verdict_prose_check.NON_DELIVERY_DISPOSITION` is that
        set plus {blocked, superseded}.
        `A - B` is EMPTY, so this is STRICT CONTAINMENT and not partial overlap. The safe
        vocabulary therefore EQUALS the stricter set and an operator can only err in ONE
        direction, which makes the remedy a one-way guard rather than a reconciliation of two
        vocabularies — a distinction this artifact's own framing did not draw. `blocked` and
        `superseded` have ZERO sites across 293 artifact files and 594 artifacts, so narrowing
        the permissive gate reds nothing today.
        CAVEAT against overclaiming: the v0.83 incident cited here used a value in NEITHER set,
        so the vocabulary fix does NOT address that incident.
        AND THE HARM CLAIM IS REFUTED, which a first draft of this paragraph got wrong by
        implying the legal set is named nowhere. `DISPOSITIONS` has exactly ONE use — R11, an
        allow-list of what may be WRITTEN — and its refusal NAMES the set. Controlled by
        planting and restoring one field: `FAIL R11 RQ-83-LADDER5: disposition: blocked is not
        one of ['deferred', 'partial', 'refuted']`, and removing the plant clears the line. So
        an operator who writes a value the permissive gate accepts is TOLD the landable
        vocabulary by the gate that refuses them.
        What survives is smaller and differently shaped. The two sets answer DIFFERENT QUESTIONS
        — an allow-list of what may be written, versus a semantic test of what MEANS non-
        delivery — so they were never meant to be equal, and `status_evidence_check` already
        IMPORTS the verdict classifier from `verdict_prose_check` rather than mirroring it,
        which makes a single-source fix in the other direction CIRCULAR. Unifying them would
        either loosen the strict gate or LOSE the "complete prose beside a non-delivery
        disposition" check. The residual finding is that the two extra members are UNREACHABLE
        on any tree that passes R11 — dead rather than dangerous.
      done-when: "manual:2027-03-31 two gates, two legal vocabularies for one field, and the stricter one wins silently — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
