# =============================================================================
# sys-verification for the v0.61 release artifacts (#1091, increment 2).
#
# WHAT THIS FILE IS: the TYPED `verifies` links that make v0.61's verification
# evidence queryable by the trace graph — the same transcription the v0.60
# pilot (sys-verification-v0.60.yaml) performed for the RQ-60-* set. Every
# RQ-61-* artifact below already names its evidence in `done-when` /
# `verified-by` / `landed`; these artifacts cite that evidence (the test, the
# CI job, the workflow, the red-first transcript) so `rivet coverage`'s
# `sys2-has-verification` rule can see it, and carry each requirement's stated
# RESIDUAL verbatim so no link overstates what was shown.
#
# WHAT THIS FILE IS NOT: a restatement of requirement titles to move a number
# — that is the gamed-metric class this release (#1091) is named for. If a
# cited referent disappears, the RQ-61-* side's own gates (the required Claim
# Check job, the oracle floors, the differential jobs) go red; this file only
# adds the graph edge.
#
# COVERAGE DECISIONS, recorded here because this file is where a reader will
# look for the missing links:
#   * RQ-61-CICAP and RQ-61-VCLOSURE carried status `proposed` when this file
#     was authored — a sys-verification link would claim a completion that
#     has not happened, so they are deliberately absent. (RQ-61-VCLOSURE
#     flips on this same PR's evidence; its link can be added by a later
#     increment once the flip itself has survived review.)
#   * The 52 pre-v0.60 release artifacts (v0.56–v0.59) are EXEMPT from
#     backfill, decided under #1091: they predate the mandatory
#     `done-when`/`verified-by` fields (RQ-60-FLIPCOUPLE), so linking them is
#     archaeology (~15–25 h measured by the #1091 lane), not transcription
#     (~5–7 min/artifact measured on the v0.60 pilot and re-confirmed at
#     ~10 min/artifact on this file). Their verification exists and is
#     described in their release notes; it is not queryable by the trace
#     graph, and that is a recorded limitation, not a debt being serviced.
#
# Deliberately NOT in artifacts/release-v0.61/: scripts/status_evidence_check.py
# applies release-REQUIREMENT rules (done-when/R7 archaeology/R8 release-field
# agreement) to `artifacts/release-v*` paths — rules shaped for system-reqs,
# not evidence-citation artifacts. Same placement rationale as the v0.60 pilot.
# =============================================================================

