artifacts:
  - id: RQ-77-FLOORREGEX
    type: system-req
    release: v0.77
    status: proposed
    title: "`[4-9][0-9]*` means 'first digit 4-9', not 'at least 4' — a CI floor whose subject is a digit rather than a magnitude"
    description: >
      The mutation-survey CI gate asserts its floors with character-class regexes.
      `[4-9][0-9]*` was written to mean "at least 4"; it means "first digit is 4
      through 9", so it accepts 4-9, 40-99 and 400-999 and REJECTS 10 through 39. The
      same shape sits in the `controls=` and `non-killed=` floors, which reject 10-19.

      WHY IT BELONGS TO THIS THEME. The regex matches a real string and reports
      truthfully about it — the subject is the FIRST DIGIT, not the magnitude the
      author meant. It has already reddened a healthy result once, when a pinned
      subset grew from 7 to 10.

      DELIVERABLE: the floors compare NUMBERS. A floor that reds on a healthy growth
      is the shape this programme calls a gate people route around, and a floor that
      silently accepts 400 when it meant 4 is the shape it calls a false pass.

      REFUTING COMMAND: the claim is that 10 through 39 are rejected. Run the live
      regex against `subset=10` and `subset=39` and confirm both fail while
      `subset=400` passes; if any of the three disagrees, re-derive before scoping.
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1243"
      disposition: refuted
      # RESOLVED BY v0.81's RQ-81-R11CONFLICT (#1430), and this field IS the
      # third remedy the comment below asked for. A refuting artifact that says
      # `issue-scope: closes` now authorises its issue's closure WITHOUT a
      # claiming status, so both gates are satisfiable at once and R11's rule is
      # untouched. Scoped to `refuted` only: `deferred` and `partial` did not
      # ship their scope, and closing their issue would be the v0.69 accident
      # with a field attached.
      issue-scope: closes
      # WHY THERE IS NO `landed:` AND NO CLAIMING STATUS, and why the close-set
      # gate consequently REDS on #1243 — recorded rather than worked around.
      # v0.77 delivered a REFUTATION: the defect was fixed in v0.66.0
      # (`1bfade3d`), eleven releases before this one scoped it as a `must`.
      # #1243 is CLOSED, correctly, citing that release.
      #
      # TWO COMMITTED GATES DISAGREE ABOUT THIS ONE ISSUE, and neither is wrong
      # on its own terms. `issue_closure_check` says #1243 is "CLOSED BUT NOT
      # AUTHORISED" and prescribes "reopen it, or name it in the artifact that
      # delivered it". Flipping this artifact to `implemented` to satisfy that
      # makes `status_evidence` R11 refuse: "status `implemented` claims the
      # outcome holds but `disposition: refuted` says it does not — pick one".
      # R11 is right. So the gate that wants a claiming status and the gate that
      # forbids one cannot both be satisfied here.
      #
      # THE GAP IS NOW CLOSED — see `issue-scope: closes` above. The paragraphs
      # below are kept as the RECORD OF THE CONFLICT, because the reasoning is
      # what justified the remedy, and a fix whose motivation is deleted is a fix
      # the next person undoes. What follows describes the state BEFORE v0.81.
      #
      # THE REAL GAP, FILED AS #1430: the closure gate has a category for an
      # issue a PREVIOUS release closed post-tag (RQ-76-CLOSUREMAIN added it),
      # but none for an issue closed on the evidence that an EARLIER release
      # delivered it where NO artifact could name it — because #1243 was FILED
      # AFTER v0.66.0 shipped the fix. Attribution scans every release below
      # this one, so the window is not the problem; the absence of any artifact
      # is, and that absence is a fact about when the issue was reported.
      #
      # REOPENING IS REFUSED. The issue is fixed, and leaving it open is exactly
      # what let v0.77 scope a dead premise as a `must`. The gate is ADVISORY at
      # the tag by its own design (tag_release.sh GATE5), so this reds visibly
      # and is acted on rather than silenced.
      verified-by: >-
        REFUTED — THE PREMISE WAS ELEVEN RELEASES DEAD, and the refuting command this artifact
        carries is what found it, on the first tick of the release. `.github/workflows/ci.yml` no
        longer asserts these floors with character classes: the step calls
        `scripts/ci_mutants_gate.py`, whose own docstring states the principle ("floor is arithmetic;
        a character class over digits is not a floor") and which compares NUMBERS
        (`value >= bound`, floors 4/2/2/1/1), printing the offending value instead of exiting
        silently. It landed in 1bfade3d on 2026-09-09 and is present in every release from v0.66.0
        onward; `grep -c` for a live assertion using the old form returns 0. The ISSUE was still
        OPEN, which is what made it look scopeable. The analysis in the issue was entirely correct
        and the pathology reproduces for the pattern AS WRITTEN — measured: 3 rejected, 4 and 9
        accepted, 10 and 39 REJECTED (the bug), 40 and 400 accepted — so this is not a bad report,
        it is a fixed one. #1243 is closed with that evidence. WHAT THIS LANE ACTUALLY CONTRIBUTES,
        and it is the more useful half: an open issue is a signal about the TRACKER, not about the
        TREE, and v0.77's own planning read it as the latter. The lane was scoped `must` after
        reading the issue's STATE (open) and its BODY (precise, well-evidenced) WITHOUT running the
        refuting command written into this very artifact. That is this release's theme committed by
        the release that named it — a true signal about the wrong subject — and the lane that looked
        most obviously correct got verified least. The actionable residual is not the regex: a fix
        that ships WITHOUT closing its issue leaves a scoping trap for whoever plans next, and this
        one cost a must-lane. NO CODE CHANGED, deliberately: there is nothing to fix, and
        manufacturing a change to make the lane look delivered is the failure mode this programme
        exists to prevent.
      # Dated `manual:` predicate, QUOTED. A `contains:` pointing at this
      # artifact's own file goes TRUE the moment the file exists and reds R3;
      # and a `contains:` naming a COMMENT is satisfied by a comment, which
      # v0.76's round 2 proved cannot fail (RQ-76-MUTRETIRE). The delivering
      # lane replaces this with a `contains:` naming EXECUTED code in a TEST
      # file when it flips the status.
      done-when: "manual:2026-09-29 the mutation-survey CI floors compare numerically, shown RED on a value below the floor and GREEN on subset=10 through 39 which the regex rejected"
