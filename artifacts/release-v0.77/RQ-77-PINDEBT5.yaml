artifacts:
  - id: RQ-77-PINDEBT5
    type: system-req
    release: v0.77
    status: proposed
    title: "Pin debt, fifth consecutive measurement — no pin closed, and an audit of whether a CLOSED pin would even be noticed"
    description: >
      The known-open pin count is a ratchet that must fall. It has not moved since
      v0.74.0, and v0.76 reported that plainly rather than waving it off. This lane
      measures it again and either closes a pin or reports the refusal with the
      candidate it rejected and why.

      The live value is NOT restated in this description. Read it from `claims.yaml`
      on the tree being cut, with `claim_check.py claims.yaml --metric`; a second copy
      of a pinned number in prose is how the "first reduction" falsehood survived
      v0.74 in four places at once, including inside a 75/75-passing ledger.

      WHY IT IS FILED RATHER THAN ASSUMED: a release that ends with more pins than it
      began is red, and adding a pin is paid for by closing one or by a written
      waiver. Filing the measurement keeps the debt VISIBLE to the conformance gate
      instead of becoming an exemption by habit.

      REFUTING COMMAND: derive the pin count from the oracle sources at the v0.77 cut
      rather than reading the previous release's figure. A count quoted from the last
      release is the "number invalidated by the edit that writes it" class, which
      v0.76 hit when a LATER lane in the same release moved a shared file's count.
    tags:
      - process
      - carried
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      # The REPORT shipped; the pin closure did not, so the artifact does not
      # claim the outcome. R11 requires this beside a `landed:` on a
      # non-claiming status: `landed:` alone cannot tell an increment from full
      # delivery left unflipped. v0.75's PINDEBT3 and v0.76's PINDEBT4 carried
      # the same shape for the same reason.
      disposition: deferred
      landed: "#1429"
      issue: "#1373"
      carried-from: RQ-76-PINDEBT4
      done-when: "manual: re-derived 2026-09-30 with claim_check's own _pin_table — 84 entries / 157 cases, the same pair `git show v0.76.0:claims.yaml` carries, so the delta across v0.77 is ZERO; no pin closed, the rejected candidate and its ground are named in verified-by, and this release ADDS the audit of whether a closed pin would be detected at all"
      verification-track: manual
      verified-by: >-
        Deliberately `manual:`. The deliverable is a DERIVED value with a dated delta; a `contains:` predicate pointing at this artifact's own file goes TRUE the moment the file exists and reds R3. THIS IS A REPORT OF NON-DELIVERY on the count, which is the deliverable when it is true — but it is NOT only that, see the audit below. RE-DERIVED 2026-09-30 by calling `claim_check._pin_table`, the tool's OWN derivation, because a hand-rolled AST walk returned 0 for all ten tables last release and was simply wrong. 84 entries / 157 cases; `git show v0.76.0:claims.yaml` carries 84 / 157; the delta across this release is ZERO, and the value has stood since v0.74.0 — four releases including this one, by the `held` column of `--metric`, which derives that span from claims.yaml rather than from prose. DECOMPOSITION, six non-empty tables of ten: 39 entries / 39 cases invalid-accept #1207; 20 / 40 selector-parity #197; 12 / 12 false-reject #1229; 6 / 59 self-contained boot sweep; 4 / 4 RA-003 join #1230; 3 / 3 aarch64 operand-class #1231. WHY NO PIN CLOSED, and this release's ground is short: v0.77 contains NO compiler change that alters an emitted byte. CORRECTED TWICE, AND THE FIRST CORRECTION WAS ALSO FALSE — which is this release's theme reproduced inside the repair of a previous instance of it. The original said "its one `crates/` edit". Round 1 replaced that with "THIRTEEN files (eleven `Cargo.toml` …)", derived from `git diff --stat … | wc -l`. THIRTEEN IS THE LINE COUNT OF THE `--stat` OUTPUT: twelve file rows plus the summary row. Round 2 caught it. The derived figure is `git diff --name-only v0.76.0 16893b2b -- crates/` = TWELVE files, of which TEN are `Cargo.toml` version bumps, plus the new `vfp_local_pressure_1069.rs` and `instruction_selector.rs`. A true count of the output's lines, reported as a count of files. The substance holds and was CHECKED rather than asserted: the only change to emitted text is RQ-77-FALCON2's citation, which edits a diagnostic STRING and no instruction; and `grep -rn '#1069:'` over `*.rs`/`*.py`/`*.yml` finds no oracle, no ci.yml grep and no frozen fixture pinning the old prefix (the sole hit is the new test's negative assertion), while `falcon_opt_1318_differential.py`'s `EXPECTED_DECLINES` needles do not include it. So "no pinned wrong answer could move" is a verified fact, not an inference from a miscount. The candidate that COULD have closed a pin was the #1318 residual — `controller@0.10.0#step` declining on VFP spill-slot pool exhaustion — and it was REJECTED as a v0.77 lane and FILED as #1426 instead, on the measured ground that the recovery ladder is already fully spent (pool-grow(218) reaches register-file exhaustion, wide-file reaches the pool exhaustion) so the remaining work is register-allocator work in the area this project guards against miscompiles. Rejecting it is recorded rather than hidden. WHAT THIS RELEASE ADDS, because "the count did not move" was becoming the whole report: an audit of whether a pin going STALE — its defect fixed — would be DETECTED, which no previous PINDEBT lane had asked. It matters because `stale_pin_check.py` checks a different subject (that the pin's ISSUE is open, RQ-73-PINDEBT) and nothing checked that the pin's DIVERGENCE still reproduces; if the oracles only verified "every observed divergence is pinned", a fixed defect would shrink the observed set and pass silently, and 84 would be an unknown mixture of live debt and fossils. RESULT, and it is a POSITIVE one: all six non-empty tables are exact in BOTH directions and go RED when a pinned defect is fixed — five by exact per-key count equality (`got != want` in invalid-accept and false-reject, `KNOWN[key][1] == n` in parity, `have != want` in the boot sweep, and a union-of-keys form in RA-003 join that also catches unpinned NEW keys; the `have != want_n` spelling quoted in the first draft occurs only in `i64_result_pair_1189_differential.py`, which is one of the EMPTY tables — a real shape, cited from the wrong file), one (invalid-accept) by exact verdict string, and two of them are independently pinned a second time by greps in ci.yml that restate the table's OWN pinned total — `#1207 CHECKS=39/39` against 39 pinned, and `#1229 CHECKS=12/12` against 12. Round 1 sharpened this: there are FIVE exact-shape greps, not two, and ALL FIVE sit under `set -euo pipefail`, so that qualifier does not narrow anything and should not have been offered as if it did; the other three restate quantities OTHER than the pinned entry count. So the 84 is live debt, not inflated by already-fixed pins, and that is now measured rather than hoped. TWO QUALIFICATIONS the headline number hides, both verified here and both FILED AS #1428 rather than fixed, because this release's scope refuses "audit every check in the repo" by name. (a) FIVE of the 84 entries pin CORRECT behaviour, so "close the pin" is undefined for them and they can never fall by being fixed: false-reject `('call.wast','riscv')` and `('return.wast','riscv')` at 0, RA-003 join `('br.wast','R4')` and `('br_table.wast','R4')` at 0 — that oracle's own comment says both are VERIFIED FIXED and pinned at zero deliberately so a regression is caught — and invalid-accept `('cu_add_tee','aarch64')` pinned `decline`, synth correctly refusing. They are regression guards wearing debt's clothing, and a must-FALL ratchet counts them. (b) The selector-parity VANISHED check is gated on `key[0] in ran_files`, where `ran_files` comes from `WAST_DIR.glob("*.wast") + OWN_FIXTURES` (the first draft quoted only the glob), so a pin whose fixture is renamed or removed from the corpus is neither confirmed nor refuted — silently retained. The arm corpus sweep has an explicit rule for exactly this class ("PHASE A STALE: … no longer exists … remove the entry"); parity does not. Of the four EMPTY tables the question is vacuous today, not negative; three would be exact if repopulated and `KNOWN_ARM_MISMATCHES` would be genuinely partial, catching a total disappearance but passing a per-vector partial fix, because its value carries an issue and no count. ONE NEAR-MISS IN THIS LANE'S OWN VERIFICATION, recorded because it is the release's theme: the first check of qualification (a) reported "0 entries pin correct behaviour" — from a walk that matched only `ast.Assign` and so located just ONE of the ten tables — NINE are `AnnAssign`, and the one it found is `arm_corpus_sweep_973.py::KNOWN_ARM_MISMATCHES`, which is empty, so it inspected zero entries. (This sentence itself said "located NONE" until round 1 of the cold review corrected it: an off-by-one inside a self-critical anecdote whose own moral is that a zero needs a floor.) Zero benign pins and zero tables inspected are the same output with opposite meanings; the figure of five comes from a re-run that REFUSES unless it locates all ten declared tables first, and which prints the non-literal table by name instead of skipping it — ONE by AST node type (`invalid_accept_1207_differential.py::KNOWN` is a `DictComp`); the earlier wording said two, counting a `Dict` literal whose values are not all constants as if it were a different node kind.
