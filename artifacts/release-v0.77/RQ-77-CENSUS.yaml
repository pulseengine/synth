artifacts:
  - id: RQ-77-CENSUS
    type: system-req
    release: v0.77
    status: implemented
    title: "The literal-table census is prose, not a script — v0.76 marked it UNVERIFIED and an independent reconstruction disagreed"
    description: >
      v0.76 asserted a census of module-level literal tables across `scripts/**/*.py`
      and marked the figures UNVERIFIED, because no census script is committed: the
      predicate exists only as prose. A cold reviewer re-implemented that stated
      predicate at the same commit and got a DIFFERENT answer, close enough to show
      the shape is right and far enough to show the prose does not pin it (module-level
      is ambiguous about class bodies and `if TYPE_CHECKING`; "of constants" is
      ambiguous about nested containers). Looser readings gave two further answers.
      The file-count half moved between two commits in the same release.

      WHY IT BELONGS TO THIS THEME. A hand-asserted count of hand-written tables is
      itself a hand-written table, and the number's subject is whatever the reader's
      reconstruction of the predicate happens to be.

      DELIVERABLE: commit the census so the number derives from the tree it describes,
      and let it replace the UNVERIFIED marking. The "N CI-wired drivers" split stays
      a JUDGEMENT unless the lane can derive it too — saying so is acceptable, quietly
      promoting it is not.

      REFUTING COMMAND: run the committed census at the v0.76 tag and at HEAD. If it
      cannot reproduce a figure this release publishes, the census is wrong or the
      published figure was; establish which BEFORE citing either.
    tags:
      - process
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1403"
      # HELD OPEN, MEASURED: #1403 frames itself as "a class, not one file" and
      # names FIFTEEN CI-wired drivers. Of the five it names, only TWO are
      # addressed — `test_merge_gate_callsite.py` (reads
      # `scripts/fixtures/gh_pr_view_rollup.captured.json`, refuses if absent)
      # and `test_ci_pool_tripwire.py` (RQ-76-RECORDSHAPE derives the live key
      # population from `ci.yml`). Exactly ONE captured fixture exists in the
      # tree. The other three are UNDETERMINED, and a grep for live-derivation
      # words is not a predicate. This lane derived the POPULATION #1403's prose
      # could not pin; it did not convert the class.
      issue-scope: outlives
      landed: "#1425"
      verified-by: >-
        DELIVERED — the population is now DERIVED, and the derivation's own finding is that no single
        number was ever available. `scripts/repro/literal_table_census_1403.py` enumerates
        `scripts/**/*.py` by an `ast` walk and reports the count under FIVE NAMED READINGS rather than
        one figure, because v0.76 established that the prose predicate did not pin the answer: it
        asserted 353 tables across 173 files, an independent reconstruction of the stated predicate got
        362 across 190, and looser readings gave 493 and 649. MEASURED at this cut over 266 parsed
        files: strict-dict 41 tables / 33 files; strict-any 200 / 113; guarded-any 200 / 113;
        nested-any 320 / 161; anywhere-any 414 / 183. THE SPREAD IS THE RESULT — 41 to 414, a factor
        of 10.1 — and it is why #1403's figure could not be reproduced: the ambiguous part was the
        PREDICATE, not the tree. The prose left three real questions, each of which moves the number,
        and none of which it answered: does "module-level" include a `class` body or an
        `if TYPE_CHECKING:` block; does "of constants" admit a container of containers; is a bare
        `list` of strings a table or only a `dict`. The original 353 sits between nested-any and
        anywhere-any, so the author was using a loose reading they never stated.
        ONE AMBIGUITY TURNS OUT NOT TO BE LIVE, which is the kind of thing only a derivation can tell
        you: `guarded-any` EQUALS `strict-any` at 200/113, so no module-level literal table in this
        tree sits inside an `if`/`try` block. The distinction is real in the abstract and empty here,
        and a reader can now see that instead of guessing.
        WHY IT REPORTS A SPREAD RATHER THAN PICKING ONE. A census that published a single number would
        recreate the defect #1403 is about, one level up: a figure whose subject is whichever
        reconstruction the reader happens to make. The readings are NAMED and NOT RANKED, and any
        citation must say which one it used — this record does. That is the v0.77 theme applied to a
        measurement rather than to a gate.
        NOT WIRED, and declared: `# ci-status: manual (measurement)`. It has no expected values and
        nothing for CI to fail on; the shapes it counts are gated elsewhere — `claim_check`'s
        `pin-table` kind walks the `KNOWN*`/`PINNED*` suppression tables the ledger names, and
        `known_open_pins` ratchets their 84 entries. Wiring a census that always exits 0 would be a
        green asserting nothing.
        TWO FALSE CLAIMS WERE CAUGHT IN THIS RECORD BEFORE IT SHIPPED, by running the consistency
        check it asserted instead of assuming it. A draft said the suppression tables are "a subset of
        the 41 strict-dict hits" — they are not: exactly ONE of the 41 is a `KNOWN*`/`PINNED*` table.
        Seven appear under `nested-any`; TWO of those seven (`release_notes_from_rivet.py::PINNED_RIVET` and `aarch64_operand_class_1231_differential.py::KNOWN`) already appear under `strict-any`, so "and not before" — which this record asserted until round 1 of the cold review — is false, which is a real structural fact the
        census surfaces rather than a quirk: those tables hold CONTAINERS of constants, not constants,
        so any "of constants" reading that forbids nesting cannot see them at all. The same draft
        credited `ci_pool_tripwire` with walking them; that script counts ci.yml JOB POOLS (71 job
        definitions — 46 ubuntu-latest, 21 self-hosted, 2 macos-latest) and has nothing to do with pin
        tables. Recorded because it is the lane's own class: two true-sounding sentences about the
        wrong subject, in the artifact whose subject is exactly that. AND A THIRD, found by round 1 of the
        cold review: this record said the correction had been applied, and it had reached `claims.yaml`
        but NOT the census script's own header, which still credited `ci_pool_tripwire` with walking the
        pin tables. An artifact claiming a fix it did not apply to the shipped file is the same class a
        third time, so the header is corrected too. Same KIND (`measurement`) and same recorded reason
        as `diagnostic_issue_census_345.py` — but NOT the same DISPOSITION as `partial_census_1017.py`,
        which this record also claimed: that file is `# ci-status: wired`, and has been since
        RQ-64-HISTOGRAM gave it a `--self-test` in the required `claim-check` job. Its census MODES are
        still a local measurement, which is the real resemblance; citing it as a manual-oracle
        precedent read the resemblance instead of the declaration. So the manual-oracle ceiling
        moves by one with this entry rather than silently.
        NON-VACUITY, proven rather than asserted: the census REFUSES if its glob matches no files
        ("every count below would be about the empty set") and REFUSES if every reading finds zero
        tables across a non-empty file set ("the predicate is broken, not the tree"). A census that
        reported "0 tables" from a broken glob would be a true statement about nothing.
        A BUG IN MY OWN FIRST DRAFT, recorded because it is the same class the lane is about: the
        element walk read `.values` on every container, which is a `Dict`-only attribute — `List`,
        `Tuple` and `Set` use `.elts`. It crashed rather than miscounting, which is the lucky case; had
        it silently skipped sequence literals the strict-dict reading would have looked authoritative
        while measuring a narrower population than its own name claims.
      # Dated `manual:` predicate, QUOTED. A `contains:` pointing at this
      # artifact's own file goes TRUE the moment the file exists and reds R3;
      # and a `contains:` naming a COMMENT is satisfied by a comment, which
      # v0.76's round 2 proved cannot fail (RQ-76-MUTRETIRE). The delivering
      # lane replaces this with a `contains:` naming EXECUTED code in a TEST
      # file when it flips the status.
      done-when: "contains:scripts/repro/literal_table_census_1403.py:RQ-77-CENSUS"
