artifacts:
  - id: RQ-82-WIDEFILE5
    type: system-req
    release: v0.82
    status: proposed
    title: "The wide-file sign loss is an ABS and the fixture contains none — identify the emitter from EMITTED BYTES"
    description: >
      CARRIED from v0.78/v0.79/v0.80/v0.81. The wide-file rung is still the only ladder rung
      with no pool-grow retry, because v0.78 BUILT the retry, found the newly-accepted code
      SIGN-WRONG, and reverted. The tripwire
      `wide60_declines_and_the_ladder_dies_on_the_wide_file_rung_1426` is armed and must
      stay armed.

      WHAT v0.81 SETTLED: the mechanism CLASS. `got ^ want == 0x8000_0000` with magnitudes
      BIT-IDENTICAL means exactly one factor's sign is wrong, and only an `abs` or a `neg`
      does that. For a NEGATIVE input the two are indistinguishable — so the POSITIVE rows
      decide it. The oracle carries 7 positive and 6 negative values and v0.78's failing
      set is EXACTLY the six negatives, so a `neg` is ruled out. It is an ABS. Those six
      rows are now pinned BY BIT PATTERN, after v0.81's round 2 found that pinning them
      with `in` left `-0.0` unfalsifiable because `-0.0 == 0.0`.

      WHAT v0.81 WITHDREW, and this is the open question: it claimed the sole scalar-f32
      `VABS` emitter is the `F32Copysign` expansion. `0xEEB00AC0` has THREE emitters —
      `arm_encoder.rs:1992` and `:6322`, both lowering `ArmOp::F32Abs` on two different
      encoder paths, plus `:7310` in copysign. The 2-register mis-encoding route IS dead
      (all three `VMOV.F32 Sd,Sm` emitters and the shared `encode_vfp_2reg` leave bit 7
      untouched), but the EMITTER is not identified.

      AND THE SOURCE HAS NO ABS AT ALL, which sharpens it rather than answering it:
      `scripts/repro/vfp_local_pressure_1069.wat` contains ZERO `f32.abs`, ZERO
      `f32.copysign` and ZERO `f32.neg` against 130 `f32.mul` operators. So whatever emits
      the abs emits it with no source operator to justify it, and none of the three
      emitters should be reachable from a pure product nest.

      WHAT WOULD SETTLE IT: re-apply v0.78's retry on a scratch branch, compile the wide60
      fixture, and DISASSEMBLE the newly-accepted function — looking for `0xEEB00AC0` in
      the emitted stream and, if present, which of the three sites produced it. A
      narrowing owes EXECUTION evidence; "the differential says FAITHFUL now" is a fact
      about the validator.

      THE REACH ON OFFER IS SIX LOCALS, wall 60 -> 66 — not twelve. Stating the real figure
      is part of the lane, because an inflated one is how a silent miscompile gets justified.

      REFUTING COMMAND RUN, PREMISE INTACT: the tripwire is present
      (`vfp_local_pressure_1069.rs:278`, `wide60_declines_and_the_ladder_dies_on_the_wide_file_rung_1426`),
      `git log -S"pool grow retry" -- crates/synth-backend/` returns ZERO commits so the
      retry is still out, and `0xEEB00AC0` still has exactly THREE occurrences in
      `arm_encoder.rs`.

      THE SIGN SURFACE IS WIDER THAN THREE VABS EMITTERS — enumerated, and the enumeration
      was previously defined by INSTRUCTION NAME rather than by EFFECT. An abs does not
      require a VABS: clearing bit 31 in a GPR does the same thing. All FIVE sign-editing
      sites in the backend, with what reaches each:

        arm_encoder.rs:1992   VABS from `ArmOp::F32Abs`, A32 path     | the F32Abs|F32Neg selector arm
        arm_encoder.rs:6322   VABS from `ArmOp::F32Abs`, Thumb path   | the same arm
        arm_encoder.rs:7310   VABS hand-assembled                     | the copysign expansion
        arm_encoder.rs:2450   AND #0x80000000 / BIC #0x80000000        | `encode_arm_f32_copysign`
        arm_encoder.rs:2691   the same splice on the hi word          | `encode_arm_f64_copysign`

      EVERY ONE requires a wasm `f32.abs`, `f32.neg` or `f32.copysign` operator, and the
      fixture contains ZERO of all three. The two GPR-masking sites are NEW to this
      enumeration; the carried claim counted only the VABS emitters.

      TWO MECHANISMS REFUTED THIS LANE, both with numbers.
      (1) THE SHARED SELECTOR ARM IS CLEAN. `instruction_selector.rs:3588` handles
      `F32Abs | F32Neg` in ONE arm, which is the shape that would let an abs be emitted for
      a neg. It does not: `if matches!(op, F32Abs) { ArmOp::F32Abs } else { ArmOp::F32Neg }`
      — no crossover.
      (2) `movt` IMMEDIATE TRUNCATION IS REFUTED, and it was the most seductive hypothesis
      this lane has had. synth materializes f32 constants as `movw`/`movt` pairs, and the
      f32 SIGN BIT IS BIT 15 OF THE `movt` IMMEDIATE — every negative has it set, every
      positive clear — so a 15-bit immediate field would clear exactly the sign, on
      CONSTANTS ONLY, failing precisely v0.78's six negatives and no positive, with no abs
      instruction anywhere. It predicted the observed failing set exactly. ALL FOUR `MOVT`
      paths nevertheless preserve bit 15: `encode_thumb32_movt_raw` (imm4=15..12, i=11,
      imm3=10..8, imm8=7..0), the A32 helper, the A32 inline site, and the `ArmOp::Movt`
      arm — each decomposing `((v >> 12) & 0xF) << 16 | (v & 0xFFF)`. A theory that explains
      the data perfectly is still wrong if the code does not do it.

      AND ONE INSTRUMENT ERROR WORTH THE RECORD: a first pass reported FOUR materializations
      of `9.81f` because the grep was truncated by `head -8`. There are NINE lines containing
      `0xf5c3`. Count before truncating.

      WHAT REMAINS is the step this artifact already names and this lane did not reach: build
      with v0.78's retry applied LOCALLY (it stays out of the tree) and disassemble the
      newly-accepted function. Not attempted here: RE-MEASURED at this commit the data volume
      is at 99% with 5.1 GiB available against a ~12 GiB workspace build, and it FELL from
      7.3 GiB during this session. An earlier draft said 27 GiB free, which was true when
      written and is not now.

      REFUTING COMMAND: `grep -n "wide60_declines" -r scripts/ tests/ crates/` and
      `git log --oneline -S"pool grow retry" -- crates/synth-backend/`. If the tripwire is
      gone or a retry has landed, this premise is dead. Then
      `grep -c -F '0xEEB00AC0' crates/synth-backend/src/arm_encoder.rs` — if that is no
      longer THREE, the emitter population moved and the enumeration must be re-derived.
    tags:
      - bug
      - carried
      - reach
      - vfp
