artifacts:
  - id: RQ-82-VALUELESSKEY
    type: system-req
    release: v0.82
    status: proposed
    title: "`str(None)` is the four-character string \"None\" — five sites fixed in one release is a CLASS, not five instances"
    description: >
      v0.81 fixed this shape FIVE times across TWO gates, in two separate cold-review
      findings, and never audited the class.

      THE SHAPE. A YAML key written with no value parses to `None`. `str(None)` is
      `"None"` — four characters, non-empty and TRUTHY. So the idiom
      `str(fields.get(k, "")).strip()` reads a VALUELESS key as a present value, and the
      idiom `k in fields` reads it as present too. The two failure directions are
      opposite and both wrong: the silent-artifact rule counted a valueless `landed:` as
      "an outcome was reported", while R11 FIRED on it, reporting a landing record that
      does not exist and — for `disposition:` — reporting the INVENTED value "none" as an
      illegal disposition.

      MEASURED IN v0.81: round 1 found the first direction in
      `loop_conformance_check.artifacts_reporting_nothing` and fixed it with
      `str(fields.get(k) or "")`. Round 2 then found that R11's own twin had been left
      standing — four more sites in `status_evidence_check.py`. Five sites, two gates, two
      rounds. Nobody asked how many more there are.

      WHY IT IS WORTH A LANE RATHER THAN A SWEEP: the gate surface reads artifact fields
      in dozens of places, and a valueless key is INDISTINGUISHABLE from a present one at
      every site that uses the idiom. It is also LATENT — zero of the live artifacts carry
      a valueless outcome key — which is exactly why it will not be noticed when it
      arrives.

      SCOPE IT BY DERIVATION, NOT BY GREP ALONE: `git grep -n 'fields.get('` finds the
      idiom, but the population that MATTERS is the sites whose result is then tested for
      truth or membership. Derive that set and fix the class, or state which sites are
      deliberately tolerant and why.

      POPULATION DERIVED AT THE LANE'S START, with `ast` and not a regex — a
      `git grep` for the literal `str(fields.get(` misses `str(art.get(`,
      `str(a.get(`, `str(fl.get(` and `str((a[4] or {}).get(`, so it UNDERCOUNTS the
      very class this artifact scopes. Walking every `scripts/**/*.py` for a
      `str(<expr>.get(...))` call whose argument is a bare `.get` (an `or ""` guard
      makes the argument a BoolOp, so already-fixed sites are excluded by
      construction, and that exclusion is controlled):

        32  total sites of the shape
        14  of them read a YAML ARTIFACT FIELD — the live defect class, because an
            author's bare key is what makes the value None
        13  read GitHub API JSON or config, where the None comes from the API
         2  are test fixtures and cannot surprise
         3  other (two reach an artifact field through a tuple)
        11  of the 32 are inside `status_evidence_check.py` itself

      TWO SITES ARE NAMED BECAUSE THEY SIT IN R12's OWN PATH:
      `str(fields.get("issue-scope", ""))` and `str(fields.get("issue", ""))`. A bare
      `issue-scope:` key there reads as the INVENTED string "none" and then fails R12's
      vocabulary check with a value no author wrote — directly beneath R11's own comment
      admitting "Round 1 fixed the same trap in `loop_conformance_check` and left R11's
      twin — the shape this programme has had to correct repeatedly."

      WHAT THIS LANE MUST NOT DO: patch 32 sites. The classes differ in whether None is
      reachable at all, so the deliverable is a DERIVATION plus a tripwire over the
      artifact-field class, not a sweep. v0.82's own R14 was written with `or ""` BEFORE
      `str()` and is therefore NOT in the population — verified by re-running the census
      after it landed.

      REFUTING COMMAND: `git grep -c -F 'str(fields.get(' -- scripts/` and
      `python3 -c "print(repr(str(None).strip()))"`. If the idiom is gone from the gate
      surface, or if a shared accessor now normalises it, the premise is dead. Then
      `python3 -c "import yaml; print(repr(yaml.safe_load('a:\n')['a']))"` — if PyYAML no
      longer yields None for a valueless key, the mechanism is gone.
    tags:
      - process
      - gate
      - traceability
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1458"
      verification-track: manual
      disposition: partial
      landed: "PR #1492 — #1458 — One shared accessor in scripts/artifact_fields.py, 26 call sites converted across FOUR gates, a declared-subset shrinkage floor for R13, and six tests; the two surviving sites are declared OUT OF CLASS with reasons."
      verified-by: >
        PARTIAL — THE CLASS IS CLOSED ON THE GATE SURFACE AND TWO SITES ARE DECLARED
        TOLERANT RATHER THAN FIXED. #1458 is already CLOSED (retired by v0.81), so this is
        carried analysis and the artifact is deliberately non-claiming.

        THE REFUTING COMMAND RAN FIRST AND DID NOT REFUTE: the idiom is live
        (`git grep -c -F 'str(fields.get('` returns 2 in loop_conformance_check.py and 15 in
        status_evidence_check.py), `str(None).strip()` is still `'None'`, and
        `yaml.safe_load('a:\n')['a']` is still `None`.

        THE POPULATION, RE-DERIVED WITH `ast` AND NOT A REGEX, and it REPRODUCED this
        artifact's own figure: 32 unguarded `str(<expr>.get(...))` calls across
        `scripts/**/*.py`, 15 already `or`-guarded and excluded BY CONSTRUCTION. The
        narrower population the done-when asks for — reads then TESTED for truth or
        membership — is 15 at one hop. THE WALKER IS ONE-HOP AND SAYS SO: a 16th,
        `str(art.get("status", ""))`, reaches `status in CLAIMING` through the loaded tuple
        at a SECOND hop, so 15 is a floor and not an exact figure. It is also IMMUNE,
        because neither `"None"` nor `""` is in the status vocabulary.

        AFTER: 17 unguarded tree-wide, and the truth-or-membership-tested set falls 15 -> 2.

        THE SECOND DEFECT, MEASURED, IN v0.81'S OWN REMEDY. v0.81 fixed all five sites with
        `str(x.get(k) or "")`. That form is wrong in the OPPOSITE direction — it reads a
        legitimate `0` or `False` as absent, the sentinel/value-`0` collision this project
        has corrected across three releases. HONEST SCOPE: no current site can receive a
        falsy non-None value, because every key in the population (`issue`, `issue-scope`,
        `verified-by`, `shipped-in`, `disposition`, `status`, `reason`, `drift`) is
        string-valued by schema. So this is a property of the IDIOM, not a live defect, and
        `field_str` removes the question instead of leaving it to the next author.

        AND ONE LATENT HOLE IN A REQUIRED GATE, which is the sharpest thing here. `Claim
        Check` refuses a `claims.yaml` waiver with no `reason:` via
        `if not str(w.get("reason", "")).strip()`. A waiver whose `reason:` is written BARE
        parses to None, reads as the four-character string `"None"`, and the waiver
        therefore reads as JUSTIFIED. Demonstrated both ways on the same input: old idiom
        `'None'` -> accepted, accessor `''` -> refused.

        THE FINDING THAT IS THIS RELEASE'S OWN THEME, IN THE MIRROR. Replacing the idiom
        BROKE R13. `_derive_field_keys` DERIVES R13's enforced key set by ast-walking the
        consumer files for `fields.get("literal")`, so removing that shape silently dropped
        `issue-scope`, `landed` and `disposition` from the population. Three of R13's four
        unit tests went red and the module's ANTI-VACUITY GUARD STAYED GREEN, because it
        tests only EMPTINESS — the exact defect `_derive_field_keys`'s own docstring names
        ("the anti-vacuity guard only tests non-emptiness ... that is the very 'cannot see
        population shrinkage' defect"), arriving through the fix for a different one.
        Satisfying one gate DISARMED another, and only somebody else's tests noticed.

        REMEDIES, BOTH OF THEM, because the floor alone would turn every future
        normalisation into a hard stop the author must widen: `FIELD_ACCESSORS` teaches the
        derivation that `field_str`/`field_text` ARE field reads, and `FIELD_KEYS_FLOOR` is
        a DECLARED SUBSET of the derived set — losing a key is a refusal naming the key,
        while ADDING one stays free.

        POTENCY, PAIRED, AND THE FIRST CONTROL WAS REJECTED. Mutating a single `landed` read
        produced rc=1 — but from R4, not the floor, because `landed` is read TWICE and the
        key was never lost. A changed output via a DIFFERENT rule is as misleading as an
        unchanged one. Re-run on `shipped-in`, the only key read exactly once: the floor
        fired with its own message naming `['shipped-in']`, and rc returned to 0 on restore.
        The tripwire forbidding the raw idiom in the gates was proven red-first ONCE PER GATE
        by reverting one site in each, and its recognizer carries a positive control because
        a tripwire asserting ZERO must be shown able to find one.

        WHAT IS DECLARED TOLERANT RATHER THAN FIXED, named so the exclusion is not silent:
        `loop_conformance_check.py` reads `cr["name"]` from GitHub check-run JSON, where a
        None means the API omitted the field rather than an author leaving it bare, and
        `.startswith` on `"None"` and on `""` both fail identically;
        `repro/bulk_mask_679_differential.py` tests `manifest["safety_bounds"]` for
        membership in a closed two-word vocabulary, which `"None"` and `""` both fail. Both
        are immune, and neither is in an artifact gate.

        ONE CONSTRAINT DISCOVERED AND RESPECTED: `test_mcdc_gate.py` runs a MUTATED COPY of
        `mcdc_gate.py` in a temp directory, so a sibling import does not resolve there. The
        sibling is now staged beside the copy — which keeps the normalisation
        single-sourced instead of mirroring it — and the mutation test was re-proven potent
        afterwards by breaking the gate's refusal string and watching it fail.
      done-when: "manual:2026-12-31 the population of sites that read an artifact field and then test it for truth or membership is DERIVED and reported with a number, every member either normalises a valueless key or declares itself deliberately tolerant at the site, and a test asserts the normalisation on at least one site per gate — proven red-first by reverting that site"
