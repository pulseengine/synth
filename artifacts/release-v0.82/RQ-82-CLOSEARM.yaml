artifacts:
  - id: RQ-82-CLOSEARM
    type: system-req
    release: v0.82
    status: implemented
    title: "Satisfying one gate ARMED another: a claiming status is both R3's remedy and the closer's permission, and nothing reads the conjunction"
    description: >
      v0.81 nearly closed an external reporter's live defect by machine, and neither gate
      involved was wrong.

      THE MECHANISM, from v0.81's own history. Two artifacts delivered a REFUTATION and a
      NARROWING, so their `verified-by` says the defect is unresolved. They were set
      `status: implemented` for exactly one reason: R3 reds a `proposed` status whose
      done-when evidence EXISTS ("the status under-reports shipped work"). But
      `authorised_close_set` reads a CLAIMING status as "this release may close the issue".
      So satisfying R3 silently entitled the tag to RETIRE #1436 — whose own artifact says
      it "REMAINS OPEN AND UNEXPLAINED" — and #1439, whose cause is not named.

      IT WAS CAUGHT BY AN OPERATOR RUNNING THE CLOSURE GATE BEFORE TAGGING, not by a gate.
      That is the same shape v0.81's own theme names one level up: not a case outside a
      rule's population, but a case that SATISFIES TWO RULES WHOSE CONJUNCTION IS FALSE.
      The remedy shipped (`issue-scope: outlives` on both) is correct and manual; nothing
      stops the next operator from satisfying R3 the same way and not noticing.

      WHAT A FIX LOOKS LIKE, named without being prescribed: the contradiction is derivable
      from two fields the gates already read. An artifact whose `verified-by` opens with an
      INCOMPLETE verdict (the existing `INCOMPLETE` set) while its status is CLAIMING and
      it carries no `issue-scope: outlives` is asserting both "the outcome holds" and "it
      does not" — about the ISSUE rather than about the scope. R11 already reds the
      disposition form of that contradiction; this is the `verified-by`-prose form, and
      v0.80's SENTENCE lane built the machinery to read it.

      DO NOT fix this by loosening R3. R3 is right: a `proposed` status over evidence that
      exists IS an under-report. The defect is that its only remedy is also a permission.

      REFUTING COMMAND: `python3 scripts/issue_closure_check.py --release v0.81.0
      --since-tag v0.81.0 --allow-unclosed` and
      `git grep -n -F 'issue-scope: outlives' -- artifacts/release-v0.81/`. If the v0.81
      artifacts no longer carry `outlives`, or the authorised set no longer contains an
      issue whose artifact disclaims progress, the instance is gone — re-derive the shape
      before building on it. Then
      `python3 -c "import sys; sys.path.insert(0,'scripts'); import verdict_prose_check as v; print(sorted(v.INCOMPLETE))"`
      — CORRECTED at the lane's start: `INCOMPLETE`/`COMPLETE` live in `verdict_prose_check`,
      NOT in `status_evidence_check` (which owns `CLOSES_WITHOUT_CLAIMING`); the wrong module
      raises AttributeError, which is the GOOD failure. Then derive the population with the
      GATE'S OWN classifier and never a hand-written regex: `leading_verdict(vb) in INCOMPLETE
      and status in CLAIMING` over `artifacts/**/*.yaml`. If that shape is ALREADY red, this
      premise is dead.
    tags:
      - process
      - gate
      - release
      - traceability
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1484"
      landed: "R14 landed in PR #1486 — the rule, seven unit tests, both potency mutants, and the day-one red (RQ-77-PROSEBLIND gains `issue-scope: closes`)."
      verified-by: >
        DELIVERED, AND THE RULE JUDGES ITS OWN ARTIFACT. R14 reds an artifact whose
        `verified-by` opens with a verdict in `LEGAL_BESIDE_CLAIMING` beside a CLAIMING
        status with no `issue-scope:` declared. THAT SET HAS ONE MEMBER, `REFUTED` — not
        all seven INCOMPLETE tokens, which is what this artifact said until v0.82's cold
        review re-derived it. R14 was NARROWED to one token by `39fd8226` (PR #1488) in
        this same release, and this artifact was not updated with it. The correction is to
        the ATTRIBUTION, not to the outcome: BLOCKED, DEFERRED, NOT DELIVERED, PARTIAL,
        PENDING and WITHDRAWN beside a claiming status are still RED, but by
        `verdict_prose_check` and R11 rather than by R14. This artifact is claiming, so its own verdict had to be a
        COMPLETE one — and it is, truthfully: the rule, seven tests, paired potency mutants
        in BOTH directions and the single day-one red are all in the tree.

        PROVEN POTENT WITH PAIRED MUTANTS, because the rule has two failure directions and
        each is invisible to the other's tests. Forcing the condition False kills the two
        red-first tests; dropping `not _iscope14` so it over-fires kills the two green-path
        tests; as shipped 7/7 pass and the live gate is rc=0. On real data R14 reds
        RQ-77-PROSEBLIND, and reds BOTH v0.81 artifacts when their `outlives` is stripped —
        the near-miss an operator caught by hand, reproduced by a gate.

        THE DESIGN WAS CONSTRAINED BY THE DEFECT IT FIXES. Demanding `outlives` would have
        reddened a legitimate artifact: R11 forbids a non-delivery `disposition:` beside a
        claiming status and R3 forbids a non-claiming status with done-when evidence, so
        claiming + prose-only refutation + no disposition is the FORCED configuration. R14
        therefore demands a DECLARATION in either direction, and R3 and R11 are untouched.

        THE VOCABULARY IS IMPORTED UNDER AN IDENTITY ASSERT: `INCOMPLETE` and
        `leading_verdict` come from `verdict_prose_check`, checked with `assertIs` and not
        `assertEqual`, because an equal-but-separate set passes today and drifts tomorrow.
        Asserted: zero `INCOMPLETE = {` literals in the gate.

        AND IT WAS NEARLY BORN WITH THE DEFECT ITS SIBLING LANE SCOPES: written as
        `str(fields.get("issue-scope", ""))` a bare key would read as the truthy string
        "None", so a declaration of NOTHING would have SATISFIED R14. It is written `or ""`
        before `str()`, and a test pins exactly that case.
      verification-track: manual
      done-when: "manual:2026-12-31 an artifact that claims its outcome holds while its own `verified-by` opens with a verdict in R14's one-member `LEGAL_BESIDE_CLAIMING` set (`REFUTED`, narrowed by #1488 in this release) and declares NO `issue-scope:` AT ALL is RED — and the other six INCOMPLETE tokens are red by `verdict_prose_check`/R11 rather than by R14, which is where this criterion previously mis-attributed them — EITHER value satisfies it, because R11 forbids a non-delivery `disposition:` beside a claiming status and R3 forbids a non-claiming status with done-when evidence, so claiming + prose-only refutation + no disposition is the FORCED configuration and demanding `outlives` specifically would red RQ-77-PROSEBLIND, whose issue IS resolved; proven red-first against v0.81's own two artifacts with the `outlives` field removed, proven NOT to red either of them as shipped, proven not to fire on a COMPLETE verdict or a non-claiming status, proven that a VALUELESS `issue-scope:` key still reds, and the verdict vocabulary IMPORTED from `verdict_prose_check` with an identity assert so no mirror can drift; R3's and R11's rules unchanged; and the live population measured before the rule lands so the day-one red count is known rather than discovered"
