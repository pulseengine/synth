artifacts:
  - id: RQ-82-FIRSTTOKEN
    type: system-req
    release: v0.82
    status: proposed
    title: "The verdict rule reads the FIRST ALL-CAPS TOKEN, so a generic opener in front of a delivery claim leaves both populations"
    description: >
      v0.81 NAMED this residual and deliberately did not close it. The naming is the
      starting point, not the finding.

      THE SHAPE. `verdict_prose_check` classifies a `verified-by` by its leading ALL-CAPS
      phrase. v0.81 added SIX measured exclusions to `NOT_A_VERDICT` — CLASSIFICATION,
      TRIAGE, EVERY, ADDED, BYTE, RULE — because a red-on-any-unclassified-lead rule would
      have red six innocent artifacts on day one. Those exclusions are load-bearing and
      correct. They also mean one of those words standing in FRONT of a delivery claim
      leaves the artifact outside BOTH the field-vs-prose comparison AND the escape
      detector. MEASURED: `unclassified_lead("RULE DELIVERED in full")` is None and
      `leading_verdict` is None; same for `EVERY ask SHIPPED` and for the pre-existing
      `THE work is DELIVERED`.

      THE DANGEROUS OPENERS ARE STILL CAUGHT — `NOT LANDED yet` yields `NOT LANDED` — so
      the hole is exactly the generic-opener shape the exclusions introduced. It is the
      price v0.81 paid for not redding six honest artifacts, paid knowingly.

      WHAT A FIX LOOKS LIKE, named without being prescribed: read the opening SENTENCE
      rather than its first token, so a verdict word anywhere in the first sentence puts
      the artifact in population. That is a WIDER rule than the one v0.81 measured, and
      the measurement is the lane: derive how many of the live artifacts it would red, and
      whether each is a real contradiction or an honest opener. A gate people cannot move
      honestly is a gate they route around (RQ-74-STALEMSG), and that is why v0.81 did not
      just widen it.

      REFUTING COMMAND:
      `python3 -c "import sys; sys.path.insert(0,'scripts'); import verdict_prose_check as v; print(v.unclassified_lead('RULE DELIVERED in full'), v.leading_verdict('RULE DELIVERED in full'))"`.
      If either is non-None the escape is already closed and this premise is dead. Then
      `python3 scripts/verdict_prose_check.py --census` to re-derive the live population
      before proposing a wider rule.
    tags:
      - process
      - gate
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1476"
      verification-track: manual
      disposition: refuted
      landed: "#1476 — PR #1489: The widening was IMPLEMENTED THREE WAYS and measured against the live tree; all three cost more than the hole, so the leading-token rule stays and the refusal ships with a potency-proven guard against re-attempting it naively."
      verified-by: >
        REFUTED — THE PROPOSED WIDENING IS WORSE THAN THE HOLE, and the numbers say so rather
        than the judgement. #1476 STAYS OPEN and this lane did not close it; it PRICED it.

        THE REFUTING COMMAND RAN FIRST AND DID NOT REFUTE THE PREMISE: `unclassified_lead` and
        `leading_verdict` are both None for `RULE DELIVERED in full`, `EVERY ask SHIPPED` and
        `THE work is DELIVERED`, so the generic-opener hole is live and those artifacts sit
        outside BOTH populations.

        THE DENOMINATOR, CORRECTED MID-MEASUREMENT: the gate iterates 562 artifacts, of which
        188 carry a `verified-by` and 67 are in population. My first report labelled 562 as
        "with verified-by", which was the wrong denominator by a factor of three.

        VARIANT 1 — BARE SENTENCE SCAN. +3 artifacts in population (RQ-64-CFOBLIG,
        RQ-68-REPRO, RQ-77-FALCON2), all three HONEST OPENERS, day-one red count ZERO. It
        would be shippable on those numbers alone. IT IS NOT, because it INVERTS NEGATION:
        `NOT LANDED yet` yields `LANDED`, a COMPLETE verdict, since the only negated phrase in
        the vocabulary is `NOT DELIVERED`. FIVE of six negated forms invert. Today those are
        VISIBLE ESCAPES that `unclassified_lead` names and `loop_conformance_check` slot 3
        FAILS on; the wider rule turns each into a CONFIDENT WRONG VERDICT, which is strictly
        worse than being out of population.

        AND MY FIRST TOKENIZER UNDERCOUNTED BY ONE, which is why the 3 is stated with its
        method. A greedy two-word match consumed `RULE DELIVERED`, found it was not a verdict,
        and DISCARDED THE `DELIVERED` WITH IT — so the artifact's own headline example came
        back None and the newly-in-population count read 2. Restructuring to tokenise first and
        then test pairs and singles gave 3. A positive control caught it; without one the lane
        would have reported the wrong number about its own example.

        VARIANT 2 — ADJACENT-NEGATOR AWARE. Fixes all six adjacent forms (`never DELIVERED`
        included). Still inverts `no work was SHIPPED`, because the negator is two words away,
        and unbounded-distance negation in prose is not decidable by a token rule at all.

        VARIANT 3 — DECLINE WHENEVER ANY NEGATOR APPEARS IN THE SENTENCE. Cannot invert, by
        construction. It drops THIRTEEN artifacts OUT of population: RQ-60-A64IMPORT,
        RQ-62-MEMISOLATE, RQ-62-VERIFYEMBED, RQ-65-PARITY, RQ-66-UNWATCHED, RQ-77-CENSUS,
        RQ-78-FEATURESET, RQ-78-RITUAL, RQ-79-ORDEAL, RQ-80-CLOSEGATE, RQ-80-STEP7,
        RQ-81-PINSWEEP and RQ-82-CLOSEARM — this release's own must-lane among them. Losing
        coverage on 13 to close a hole on 3 is a bad trade.

        A FOURTH OPTION WAS TRIED AND ALSO REFUSED, and it is the one that looked free. Adding
        the negated forms to INCOMPLETE — DERIVED from COMPLETE, not typed — has ZERO live
        effect: 0 artifacts enter the population, 0 leave, 0 newly red, and `unclassified_lead`
        reports 0 escapes both before and after. But it converts an UNCONDITIONAL tag-time
        DERIVED_FAIL in `loop_conformance_check` slot 3 into a per-PR comparison that PASSES on
        a NON-CLAIMING artifact. That is a weakening dressed as a closure. It also broke the
        canonical escape example in THREE separate test suites — `test_verdict_prose_check`,
        `test_loop_conformance_check` and `test_status_evidence_check` — which is evidence that
        keeping `NOT LANDED` unclassified is a DECISION, not an oversight. It was reverted.

        AND IT INVALIDATED A MEASURED NUMBER IN ANOTHER RULE'S TEST, which is worth recording:
        `test_R14s_population_IS_the_carve_out_and_nothing_wider` asserts R14 is narrower than
        INCOMPLETE by exactly SIX tokens. Growing INCOMPLETE made that 11 and the test failed.
        A hardcoded count of a set that another lane may extend is the same drift this
        programme keeps correcting.

        WHAT SHIPS INSTEAD: the refusal, with all four variants and their costs recorded at the
        decision site rather than in a release note, plus THREE GUARD TESTS so the next lane
        cannot widen naively. PROVEN POTENT by mutation — patching `leading_verdict` into a
        naive sentence scan fires all five inversion assertions AND the three
        hole-still-open assertions, rc=1, and rc returns to 0 on restore. One guard pins that
        the negated vocabulary is exactly {NOT DELIVERED}, so if a future lane changes it the
        refusal must be re-derived rather than inherited.

        THE HOLE IS STILL OPEN AND A TEST SAYS SO: the third guard asserts that
        `RULE DELIVERED in full` remains outside both populations, so if a later change were to retire
        the hole behind #1476, this artifact's REFUTED verdict fires rather than standing as a
        stale claim.
      done-when: "manual:2026-12-31 the number of live artifacts a sentence-scoped rule would newly put in population is DERIVED and reported, each one classified as a real contradiction or an honest opener, and either the wider rule ships with its day-one red count at zero or the lane states with numbers why widening is refused"
