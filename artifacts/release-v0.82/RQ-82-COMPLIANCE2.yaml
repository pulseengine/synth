artifacts:
  - id: RQ-82-COMPLIANCE2
    type: system-req
    release: v0.82
    status: proposed
    title: "Verify the compliance trigger actually fired at v0.81.0, and decide the backlog of releases with no report"
    description: >
      v0.81 found that `compliance.yml` had run NINETEEN TIMES EVER — one
      `workflow_dispatch` and eighteen `release` events, every one of the eighteen for a
      release a USER published — because GitHub raises no workflow runs for `GITHUB_TOKEN`
      events and this repo publishes with it. It wired `release.yml` to CALL the workflow
      and gated the CLASS with `scripts/release_trigger_check.py`.

      THE PART v0.81 COULD NOT DO, and said so rather than loosening its criterion: its
      done-when requires "a compliance report attached to a release's assets by an
      automated path again, verified by listing that release's assets", and that evidence
      can only exist AFTER a release. It recorded a tag-time obligation instead of
      rewriting the criterion to something satisfiable the same day — the better of the two
      patterns that release used.

      SO THE FIRST HALF OF THIS LANE IS A VERIFICATION, not a build: list v0.81.0's assets
      and confirm `synth-v0.81.0-compliance-report.tar.gz` is among them. If it is NOT, the
      `workflow_call` wiring did not work and the reason is the finding.

      THE SECOND HALF IS A MAINTAINER DECISION, named and not taken: the releases with no
      report could have one regenerated with `compliance.yml`'s `workflow_dispatch`, one tag
      at a time. That is a large number of outward-facing writes to already-published
      release pages, so it is a decision rather than a task. Derive the current count rather
      than carrying v0.81's figure forward.

      MEASURED AT THE v0.81.0 TAG, which MOVED the defect rather than removing it. The
      wiring WORKED: `Compliance report / Generate compliance report` RAN on the tag, 7
      steps, `Resolve tag` green — it had never fired at all before. It then FAILED at step
      4, so `Upload report to release` SKIPPED, and v0.81.0's release carries 13 assets with
      NO `synth-v0.81.0-compliance-report.tar.gz`. THE NEW CAUSE IS NAMED AND IS NOT THE OLD
      ONE: the job runs a single `actions/checkout`, so rivet reports `could not load
      externals: IO error: external project at ./.rivet/re...` and then every cross-repo
      `traces-to` link reads as a dangling target (GI-004 `gale:SWREQ-KILN-001`, CC-004
      `kiln:REQ_FUNC_014`, CM-004, KB-001 and more), which is the #1012 shape: link errors
      beside unloaded externals mean RESOLUTION NEVER RAN, not that the links are broken.
      So do NOT re-litigate the trigger; the trigger is fixed. The remaining work is giving
      that job the externals it needs, or having it decline loudly instead of erroring.

      DO NOT HAND-ATTACH THE TARBALL. Conduct rule 4's logic applies internally: making the
      oracle reachable is not delivery of the report, and an attached artifact nobody
      generated is worse than an absent one.

      REFUTING COMMAND:
      `gh release view v0.81.0 --json assets --jq '[.assets[].name]'` and
      `gh api --paginate repos/pulseengine/synth/actions/workflows --jq '.workflows[] | select(.path|test("compliance")) | .id'`
      then the runs for that id. If a report IS attached to v0.81.0, the first half is
      already satisfied and this lane is only the backlog decision. Paginate: `gh run list`
      UNDER-reports, and `gh release list --limit 100` stops at 100 on a longer list.
    tags:
      - process
      - release
      - compliance
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1453"
      verification-track: manual
      disposition: partial
      landed: "PR #1492 — #1453 — v0.81.0's assets LISTED (13, zero compliance reports) with the cause DERIVED; the externals-sync step added to compliance.yml and proven locally 7-of-7 with both refusal controls firing; the backlog RE-DERIVED as 130 of 149 and put to the maintainer as a DECISION, not actioned."
      verified-by: >
        PARTIAL — BOTH DONE-WHEN HALVES ARE DELIVERED AND THE FIX IS UNVERIFIABLE UNTIL A
        RELEASE RUNS IT. #1453 stays open: no report is attached to any release by an
        automated path yet, and this release will be the first test of the remedy.

        FIRST HALF, A VERIFICATION AND IT CAME BACK NEGATIVE. v0.81.0 carries THIRTEEN assets
        and ZERO matching `compliance` — derived with
        `gh release view v0.81.0 --json assets`, not inferred.

        THE REFUTING COMMAND'S SECOND HALF IS BLIND BY CONSTRUCTION, and that is worth more
        than the number it returns. It asks for the runs of `compliance.yml`'s workflow id; the
        answer is STILL 19 (1 `workflow_dispatch`, 18 `release`), newest `v0.43.0` — which
        reads as "the wiring did not work". IT DID. A `workflow_call` invocation does NOT
        create a run of the called workflow; it appears as a JOB INSIDE THE CALLER'S RUN. Found
        there: run 37654229482 ("Release", conclusion failure) contains
        `Compliance report / Generate compliance report`, 7 steps, and its step list is exactly
        step 2 `Resolve tag` SUCCESS, step 3 a single `actions/checkout@v7` SUCCESS, step 4
        `Generate compliance report` FAILURE, step 5 `Upload report to release` SKIPPED. So the
        trigger is fixed and must not be re-litigated; the job now runs and fails.

        THE CAUSE, DERIVED ON THIS TREE RATHER THAN CARRIED. `rivet.yaml` declares SEVEN
        externals — gale, jess, kiln, loom, meld, scry, sigil — each with `git:` and
        `ref: main` and deliberately NO `path:` (the #1012 rule: a declared local path takes
        precedence and a dead one poisons resolution for everyone). Their clones live under
        `.rivet/repos/<prefix>`, and `.rivet/` is GITIGNORED at `.gitignore:62` with ZERO
        tracked files. A single `actions/checkout` therefore CANNOT supply them, which is why
        rivet reported `could not load externals: IO error` and every cross-repo `traces-to`
        read as dangling. The job's own log is no longer retrievable — the API returns 0 bytes
        — so the quoted error is v0.81's recorded reading, not a re-derivation, and the step
        list above is what this release verified independently.

        AND THE REMEDY IS PROVEN END-TO-END ON THE SAME TREE, which is the part that makes this
        more than a plausible fix. With the seven clones PRESENT locally, `rivet validate`
        returns PASS with `Cross-repo backlinks: 1032 (external artifacts linking to local)`.
        That is the #1012 non-vacuity signature satisfied: resolution RAN. Absent externals
        give link errors beside zero backlinks; present externals give 1032. AND THE VERSIONS
        MATCH: the local binary reports `rivet 0.37.0 (6f9ef82c master 2026-09-22)` and the CI
        action pins `rivet-version: v0.37.0`, so this is the same rivet CI will run, not a
        near-enough one. An earlier draft of this sentence hedged about a version difference;
        the versions were then checked and are identical.

        WHAT SHIPPED, AND THE PATTERN IS NOT NEW. A `Sync rivet externals` step inserted
        BETWEEN the checkout and the report, lifted from `ci.yml`'s federated-graph job
        (#1143): AUTHENTICATE FOR QUOTA, NOT FOR ACCESS — all seven siblings are PUBLIC, but
        GitHub rate-limits ANONYMOUS git traffic hardest from datacenter address space, and a
        throttled response makes git fall back to interactive auth, surfacing on a tty-less
        runner as `fatal: could not read Username`, which reads like a permissions failure and
        is not one. The `url.insteadOf` rewrite is scoped to the step and removed by a `trap`
        rather than persisted.

        THE LIST IS DERIVED AT RUNTIME FROM `rivet.yaml`, not mirrored into the workflow, so
        adding an external never needs a second edit — the hand-written-mirror drift this
        project's North Star forbids. PROVEN by extracting the embedded script FROM THE
        WORKFLOW FILE and running it, so the test cannot drift from what ships: on the real
        tree it reports `synced 7 of 7 externals`; with `externals: {}` it REFUSES, because a
        zero population would otherwise succeed while syncing nothing; with an unclonable
        external it REFUSES. Both controls fired.

        SECOND HALF, A DECISION PUT AND NOT TAKEN. Re-derived BY PAGINATION (two pages, 149
        releases) rather than carried: 19 releases carry a compliance report and 130 DO NOT,
        with 45 CONSECUTIVE from the newest and the most recent report at v0.43.0. v0.81
        recorded 129 of 148 and 44 consecutive; each is one higher now because v0.81.0 itself
        shipped without one. The 19 matches the 19 workflow runs exactly, which corroborates
        the mechanism. Regenerating them is possible one tag at a time via
        `workflow_dispatch`, and it is 130 outward-facing writes to already-published release
        pages — SO IT IS THE MAINTAINER'S CALL AND NOTHING WAS ACTIONED. The tarball was NOT
        hand-attached: making the oracle reachable is not delivery of the report.

        THE RESIDUAL, NAMED: no per-PR static gate pins the STEP ORDER, so a future edit could
        move the sync after the report and nothing would red until a release. It was NOT bolted
        onto `release_trigger_check.py`, whose own docstring is explicit that it polices
        trigger reachability and that a different population belongs in a different gate. The
        in-step non-vacuity refusal is the gate that does exist, and it fires on zero or
        partial syncs.
      done-when: "manual:2026-12-31 v0.81.0's assets are LISTED and the presence or absence of its compliance report is reported as derived fact — with the cause named if absent — and the backlog count is re-derived by pagination and put to the maintainer as a decision rather than actioned unasked"
