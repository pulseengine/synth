artifacts:
  - id: RQ-82-DEPS
    type: system-req
    release: v0.82
    status: proposed
    title: "Five held dependabot PRs consolidated into one, because four of them are the SAME upstream release train"
    description: >
      MAINTAINER-REQUESTED, added to v0.82's scope after the plan was cut: land the open
      dependabot bumps in ONE change and close the individual PRs.

      WHY ONE PR IS THE RIGHT SHAPE AND NOT MERELY CONVENIENT. Four of the five are
      `wasmparser`, `wasm-encoder`, `wit-parser` and `wit-component`, all moving to
      **0.261.0** — one upstream wasm-tools release train that is versioned in lockstep.
      Bumping them one PR at a time asks cargo to resolve a graph where half the family is
      new and half is old, which is both slower and less likely to resolve than moving them
      together. The fifth, the `pulseengine/rivet` compliance ACTION 0.39.0 -> 0.40.0, is a
      different surface and carries its own evaluation below.

      THE HOLD'S OWN EXIT CONDITION IS WHAT THIS FOLLOWS, not an exception to it.
      RQ-64-DEPS recorded it: "merge a held bump BY HAND once the FULL suite is green", with
      base freshness part of "green", and a bump nobody evaluates needing a disposition
      because "still open" is not one. Three of these have been open since well before
      v0.82. This change is the hand merge, raised on a FRESH base off `origin/main` rather
      than by merging main into a dependabot branch — which RQ-64-DEPS names as the move
      that destroys the ability to freshen those branches at all.

      WHAT THE LOCK ACTUALLY SAID, measured rather than assumed, and it corrected a first
      reading. `0.261.0` is ALREADY IN THE LOCK for `wasmparser`, `wasm-encoder` and `wat` —
      pulled transitively — while synth's own `workspace.dependencies` declared the older
      floors 0.256/0.258/0.259/0.259. So these bumps raise synth's DECLARED floor to meet
      what the graph already builds, and they UNIFY it: whole-lock duplicate copies fall
      **13 -> 10**, with `wasmparser` collapsing from FIVE concurrent copies to three and
      `wasm-encoder` from three to two. A first pass read the lock with `head -1` and
      reported `wasmparser 0.252.0` as "the" version, which is a transitive copy and not
      the resolved one — the truncated-view trap.

      THE ACTION BUMP WAS EVALUATED AT ITS INTERFACE, not by its version number, because a
      renamed input would break `compliance.yml` silently at the `with:` level. Fetched
      `action.yml` at v0.40.0: it declares FOURTEEN inputs, and all SIX that
      `compliance.yml` passes (`theme`, `rivet-version`, `include-data-formats`,
      `report-label`, `archive`, `archive-name`) are among them; the `archive-path` OUTPUT
      that the Upload step reads is still declared. The precedent is RQ-64-DEPS's own #1107
      disposition: the action version is NOT the tool version — the rivet BINARY is pinned
      separately (`rivet-version: v0.37.0` in the `with:`, and `--tag v0.37.0` in ci.yml),
      and `compliance.yml` is NOT one of the nine required contexts.

      WHAT THIS LANE CANNOT ANSWER, stated plainly: whether synth's own source compiles
      against the newer API. The release machine is at 99% with ~5 GiB available against a
      ~12 GiB workspace build, so no local compile is possible. THE FULL SUITE IS THE
      ORACLE and that is exactly what the hold's exit condition requires. This change is
      merged only on green, by name, through the usual ritual.

      REFUTING COMMAND:
      `gh pr list --repo pulseengine/synth --state open --json number,author --jq '[.[]|select(.author.login|test("dependabot";"i"))]|length'`
      — if it returns 0 the PRs are already disposed and this lane has nothing to
      consolidate. Then `python3 -c "import re;print(sorted(set(re.findall(r'name = \"wasmparser\"\nversion = \"([^\"]+)\"', open('Cargo.lock').read()))))"`:
      if one version remains the unification already happened. And
      `cargo metadata --locked --format-version 1` must exit 0, or the lock does not match
      the manifest and nothing else here is meaningful.
    tags:
      - process
      - deps
      - carried
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#965"
      verification-track: manual
      disposition: partial
      landed: "PR #1492 — #965 — four wasm-tools bumps to 0.261.0 and the rivet action to v0.40.0 applied in ONE change on a fresh base; whole-lock duplicate copies 13 -> 10; the compile is CI's to answer and the five dependabot PRs close only once it is green."
      verified-by: >
        PARTIAL — THE CHANGE IS APPLIED AND THE COMPILE IS UNVERIFIED HERE BY CONSTRUCTION.
        The hold's own exit condition is "merge a held bump BY HAND once the FULL suite is
        green", so the suite is the oracle and this artifact does not pre-empt it.

        THE REFUTING COMMAND RAN FIRST AND DID NOT REFUTE: five dependabot PRs are open
        (#1472, #1471, #1468, #1346, #1344), `wasmparser` had FIVE concurrent versions in the
        lock, and `cargo metadata --locked` exits 0 on the result.

        THE FOUR CARGO BUMPS ARE ONE UPSTREAM TRAIN, which is why one PR is correct rather
        than merely convenient: `wasmparser`, `wasm-encoder`, `wit-parser` and `wit-component`
        all move to 0.261.0 in lockstep. Raised on a FRESH base off `origin/main`, never by
        merging main INTO a dependabot branch — the move RQ-64-DEPS names as destroying those
        branches' freshenability.

        MEASURED, AND IT CORRECTED A FIRST READING: 0.261.0 was ALREADY in the lock
        transitively for `wasmparser`, `wasm-encoder` and `wat`, while synth's own declared
        floors sat at 0.256/0.258/0.259/0.259. So the bumps raise the declaration to meet a
        graph that already builds, and they UNIFY it — whole-lock duplicate copies fall
        13 -> 10, `wasmparser` five copies -> three, `wasm-encoder` three -> two. The first
        pass read the lock with `head -1` and reported 0.252.0 as "the" version; that is a
        transitive copy, and the truncated view would have made the whole premise wrong.

        THE ACTION BUMP WAS EVALUATED AT ITS INTERFACE, not by its version number. Fetched
        `action.yml` at v0.40.0: FOURTEEN declared inputs, and all SIX `compliance.yml` passes
        are among them, with the `archive-path` output the Upload step reads still declared.
        So no silent `with:`-level break. Per RQ-64-DEPS's #1107 precedent the action version
        is NOT the tool version — the rivet binary is pinned separately at v0.37.0 in two
        places — and `compliance.yml` is not one of the nine required contexts.

        ONE INTERACTION NAMED RATHER THAN DISCOVERED LATER: RQ-82-COMPLIANCE2 adds an
        externals-sync step to the same workflow and has not merged yet. v0.40.0 declares an
        `offline` input that 0.39.0's interface did not expose to this caller, so a later lane
        may find the sync unnecessary. Nothing here depends on that; the two changes are
        independent and both are tested only at the next release's tag.

        WHAT IS NOT CLAIMED: that synth's source compiles against the newer API. The data
        volume is at 99% with ~5 GiB available against a ~12 GiB workspace build, so no local
        compile was possible, and a green `cargo fmt`/`claim_check`/`status_evidence`/
        `cargo metadata --locked` says nothing about `cargo build`. The five dependabot PRs
        stay OPEN until the suite is green, because closing them first would leave the bumps
        nowhere if it is not.
      done-when: "manual:2026-12-31 the four wasm-tools bumps and the rivet action bump are applied in ONE change on a fresh base, the FULL suite is green by name on that change, the five dependabot PRs are CLOSED with a reason naming the consolidating PR, and the lock's duplicate-copy reduction is reported as a measured number"
