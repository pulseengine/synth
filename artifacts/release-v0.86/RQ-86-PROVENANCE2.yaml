artifacts:
  - id: RQ-86-PROVENANCE2
    type: system-req
    release: v0.86
    status: implemented
    title: "A shipped record's METHOD is as checkable as its figures"
    description: >
        v0.85 established the defect in both directions. Its figures: a figure pinned to a pre-
        squash lane head is uncheckable, because squash merging guarantees the head is not an
        ancestor of the default branch, and the census that measures this must REPORT out-of-
        population tokens rather than drop them — a workflow-run identifier is valid hexadecimal
        and a naive check reports it as a broken commit citation.

        ITS METHODS: two shipped records cited a derivation script that was in no commit on any
        branch. v0.85 wrote and tracked that script, and its second round then found the
        correction's own claim about which records cited it was wrong. So the class is real at
        both the figure and the method level, and the fix at the method level introduced a new
        false claim while landing.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: take every commit AND every tool path cited
        in the last two review records and test each mechanically: ancestry for the commits,
        existence in the tree for the tools. Carry a POSITIVE CONTROL in both halves — a known
        non-ancestor and a known-absent path — because a check that passes everything is
        indistinguishable from one that tests nothing.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1516"
      verification-track: manual
      issue-scope: outlives
      landed: "PR #1531 - #1516 - DELIVERED: a check now proves, for a shipped record, that every commit it cites is an ancestor and every tool it names exists, with a POSITIVE CONTROL in BOTH halves because a check that passes everything is indistinguishable from one that tests nothing. Measured over the last three records before writing it: the ABSENT-TOOL half is CLEAN everywhere - the earlier defect of records citing a script that was in no commit on any branch is fixed by tracking it - while the ANCESTRY half is not, and the pattern is systemic: the third-most-recent record cites SEVEN pre-squash branch shas, the next ONE, the newest TWO. This repository squash-merges, so a branch head never becomes an ancestor and its content ships under a different sha; one of those citations is already flagged as a provenance caveat in its own record and the rest are not. CI gates the SELF-TEST and not the report, because the gating form defaults to the newest record and would red on day one over history it cannot change."
      verified-by: >
        DELIVERED — a check proves both halves for a shipped record, and each half carries a
        positive control.

        MEASURED BEFORE THE CHECK WAS WRITTEN, which is what made its shape obvious. Over the
        last three review records: every TOOL PATH cited exists, in every record — so the earlier
        defect, two shipped records citing a derivation script that was in no commit on any
        branch, is genuinely fixed by tracking that script, and this half is clean rather than
        untested. The ANCESTRY half is not clean, and the pattern is SYSTEMIC rather than a slip:
        the third-most-recent record cites SEVEN commits that are not ancestors of the main
        branch, the next record one, and the newest two.

        ALL OF THEM ARE PRE-SQUASH BRANCH SHAS, and that is the mechanism rather than
        carelessness: this repository squash-merges, so a branch head never becomes an ancestor
        and the content ships under a different sha. One of the citations is already flagged as a
        provenance caveat inside its own record; the others are not, and once a branch is deleted
        a reader cannot follow them at all.

        BOTH HALVES ARE POSITIVELY CONTROLLED, in the shipped self-test and not only at
        authoring: an all-zero sha must read as NOT an ancestor while a real commit must read as
        an ancestor of itself, and a known-absent path must read absent while a known-present one
        reads present. A hex token that is not a commit object is deliberately NOT counted as a
        citation — digests and register values are not provenance, and counting them is how a
        check becomes one people disable. The negative control was executed: forcing the ancestry
        predicate to return true reds the self-test by name.

        CI GATES THE SELF-TEST AND NOT THE REPORT, stated in the workflow rather than left to be
        inferred. The gating form defaults to the NEWEST record, which today carries two of those
        shas, so wiring it to gate would red on day one over history it cannot change — the trap
        this repository has already measured and declined to build. The obligation is
        FORWARD-ONLY: the record this release writes cites merged shas, and the gating form is
        run against it by hand at review time.
      done-when: "manual:2027-03-31 a check proves, for a shipped record, that every commit it cites is an ancestor and every tool it names exists — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
