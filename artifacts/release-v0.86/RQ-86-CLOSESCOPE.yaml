artifacts:
  - id: RQ-86-CLOSESCOPE
    type: system-req
    release: v0.86
    status: implemented
    title: "A release of only-partial lanes can either authorise a closure or says plainly that it cannot"
    description: >
        NEW, from v0.85's own tag. The strict closure gate failed on a VACUOUS AUTHORISED SET:
        no artifact both named an issue and claimed completion, so nothing in the release
        authorised any closure — and nothing was held open either, because holding open also
        requires a claiming status. The previous release at least held one issue open. This one
        holds none.

        THE QUESTION IS NOT HOW TO GREEN THE GATE. Flipping a status to satisfy it would claim a
        completion no lane reached, which is the ledger-loosening this programme refuses. The
        question is whether a release whose lanes are honestly all partial has any legal way to
        be non-vacuous, and if it does not, whether the gate's demand or the release's shape is
        the thing to change.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: read the authorised-and-held-open derivation
        and enumerate every status and disposition combination that produces a non-empty set. If
        a non-claiming disposition can authorise or hold open, the vacuity was avoidable and
        this lane is a fix; if none can, the gate demands something a partial-only release
        cannot supply and THAT is the finding. Carry the gate's own potency controls, which
        v0.85 confirmed fire.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1454"
      verification-track: manual
      landed: "PR #1537 - #1454 - DELIVERED on the done-when's SECOND branch: the gate's demand is SHOWN UNMEETABLE by a partial-only release, enumerated from the shipped derivation and then CHECKED BY EXPERIMENT, which is what caught the part reading alone got wrong. Four combinations produce a non-empty set and only ONE of them is open to a non-claiming artifact: a refuting disposition that also declares it closes its issue. A partial or deferred disposition has NO legal route, so a release whose lanes are honestly all partial cannot be non-vacuous - the gate asks for something such a release does not have, and the thing to change is the release's shape, not the gate's demand. THE EXPERIMENT MATTERED: declaring that an issue outlives a non-claiming artifact DOES enter the held-open set, the count moving from zero to one, so reading the derivation function alone says the route is open - but the enforcing rule REDS it, saying the issue of an undelivered artifact stays open anyway and declares nothing. Two places, and the enforcement wins. This release is NOT partial-only and escapes the vacuity its predecessor hit: run at this lane's OWN commit the gate reports THREE authorised, TEN held open, zero closed and ONE failure; later in the same pull request, after RQ-86-DISPVOCAB3 stopped declaring an already-closed issue held open, it reports FOUR authorised, NINE held open, zero closed and ZERO failures. TWO-AND-ZERO WAS NEVER THE READING AT ANY COMMIT - an earlier version of this record stated it, and the correction that moved the real figure amended the pull-request body without reopening this artifact, which is a correction failing to propagate rather than a figure gone stale. All four authorised issues are ALREADY CLOSED, so the authorisation is a no-op, and that is stated rather than counted as progress. The gate's own potency controls were re-run and both fire."
      verified-by: >
        DELIVERED — the done-when's SECOND branch: the gate's demand is shown unmeetable by a
        partial-only release, with the enumeration and an experiment that corrects it.

        THE REFUTING COMMAND, run first: the authorised-and-held-open derivation was read and
        every status-and-disposition combination enumerated. FOUR produce a non-empty set:
        a CLAIMING status authorises its issue by default; a claiming status that declares the
        issue OUTLIVES it holds it open instead; a NON-claiming artifact whose disposition is a
        REFUTATION and which also declares it closes its issue authorises the closure; and
        nothing else qualifies.

        SO EXACTLY ONE ROUTE IS OPEN TO A NON-CLAIMING ARTIFACT, and it is scoped to a
        REFUTATION on purpose — only a refutation says the question itself was answered, where a
        partial or deferred disposition says the scope did not ship. A release whose lanes are
        honestly ALL partial or deferred therefore has NO legal way to be non-vacuous. That is
        the artifact's second branch: the gate demands something such a release cannot supply.
        And the conclusion that follows is about the RELEASE's shape, not the gate's demand —
        flipping a status to green the gate would claim a completion no lane reached, which is
        the ledger-loosening this programme refuses, and the artifact says so itself.

        THE EXPERIMENT IS WHAT CAUGHT THE PART READING GOT WRONG, and it is worth recording as a
        method point rather than only as a result. Declaring that an issue OUTLIVES a
        NON-CLAIMING artifact DOES enter the held-open set — the gate's own printed count moved
        from zero to one — so reading the derivation function alone says that route is open to a
        partial lane. It is not: the ENFORCING rule reds it, on the ground that the issue of an
        undelivered artifact stays open anyway and the declaration therefore states nothing, and
        that the disposition field is where a non-landing is recorded. Two places answer the same
        question and the enforcement is the one that binds. A reading of the derivation alone
        would have reported the vacuity as avoidable, which is the opposite of the truth.

        THIS RELEASE IS NOT PARTIAL-ONLY AND ESCAPES THE VACUITY, measured by simulating the
        merged state rather than predicting it. At this lane's OWN commit the gate reports THREE
        authorised, TEN held open, zero closed and ONE failure; after a later commit in the same
        pull request stopped RQ-86-DISPVOCAB3 declaring an already-closed issue held open, it
        reports FOUR authorised, NINE held open, zero closed and ZERO failures - against the
        previous release's empty authorised set and its hard failure. TWO-AND-ZERO was never the
        reading at any commit: an earlier version of this record said so, and the commit that
        moved the real figure amended the pull-request body and never reopened this file. The escape is not a fix to the gate — it is that lanes this release
        genuinely reached a claiming status, which is exactly the shape the enumeration says is
        required. THE COUNT IN THAT SENTENCE WAS AN INFERENCE DRAWN FROM THE REFUTED FIGURE and
        survived the correction of it: derived at the shipped commit, THIRTEEN of the eighteen
        lanes reach a claiming status and FOUR of those carry no `issue-scope: outlives`, which
        is the authorised set the gate reports. Two was neither figure, and it was not the
        pre-correction reading either.

        AND THE HONEST CAVEAT, stated rather than counted as progress: BOTH authorised issues are
        ALREADY CLOSED, so the authorisation they carry is a no-op. The release is non-vacuous in
        the gate's terms without actually closing anything. One of the two is also the stale
        attribution recorded against its own lane, so its authorisation would be semantically
        wrong if the issue were open — it is left in place rather than relabelled, because the
        field vocabulary has no term for a mis-attribution and inventing one would be worse.

        THE GATE'S OWN POTENCY CONTROLS WERE RE-RUN AND BOTH FIRE. An issue nobody authorised,
        presented as closed, reds with the closed-but-not-authorised verdict naming it and citing
        the shape that once auto-closed an external reporter's live blocker. And the vacuous
        authorised set reds on its own, loudly, in both the nothing-closed and the
        allow-unclosed forms. The per-issue verdicts are no longer collapsed into one
        undifferentiated message — the gate says in as many words that they are still derived
        from earlier releases' attributions — so the defect this artifact's issue describes is
        itself already fixed.
      done-when: "manual:2027-03-31 a partial-only release either authorises or holds open at least one issue legally, or the gate's demand is shown unmeetable by such a release — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
