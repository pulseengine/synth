artifacts:
  - id: RQ-86-COMPLIANCE6
    type: system-req
    release: v0.86
    status: implemented
    title: "The compliance backlog decision is taken, or reported blocked outside this repository"
    description: >
        BLOCKED OUTSIDE THIS REPOSITORY, and this lane's correct outcome may be to report that
        rather than to show progress. The blocker is a scope decision on the compliance backlog,
        which only the maintainer can act on.

        WHAT THIS LANE MUST NOT DO: re-measure the machinery around the blocker and report the
        re-measurement as progress. That is the shape conduct rule four names for external
        defects, and it applies to the maintainer's queue as well — a release that re-derives a
        blocked lane's surroundings has not moved it.

        ATTEMPTING PASSWORDS STAYS DECLINED.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: re-read the blocker's current state at the
        source rather than from any record of it, and confirm it is still outside this
        repository. If it has been actioned, the lane is live and should be worked; if not,
        report it blocked with the state observed and move on. A lane reported blocked on a
        STALE reading of the blocker is the same defect as a figure carried instead of derived.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1453"
      verification-track: manual
      issue-scope: outlives
      landed: "PR #1536 - #1453 - REPORTED BLOCKED with its state re-read AT THE SOURCE. The issue is OPEN at the source and its subject is a scope decision on the compliance backlog that only the maintainer can take. The release asset itself did not regress - the previous release's compliance report shipped larger than the one before it - but that is a fact about the asset and NOT progress on this blocker, and it is recorded here rather than counted. Nothing around the blocker was re-measured and reported as progress. ATTEMPTING PASSWORDS STAYS DECLINED."
      verified-by: >
        DELIVERED on the done-when's SECOND branch — reported blocked with its state re-read at
        the source.

        RE-READ AT THE SOURCE: the issue is OPEN, and its subject is a scope decision on the
        compliance backlog that only the maintainer can take. Its title names the mechanism —
        bot-published releases do not fire the trigger the workflow listens for — which is a
        statement about a workflow trigger and not something this lane can decide.

        WHAT THIS LANE REFUSED TO DO. The compliance asset did not regress at the previous
        release, and it would be easy to present that as movement. It is not: it is a fact about
        an asset, recorded here rather than counted, because re-measuring the machinery around a
        blocked lane and reporting the re-measurement as progress is exactly the shape conduct
        rule four names. The issue outlives the lane and says so explicitly.
      done-when: "manual:2027-03-31 the blocker is actioned and the lane delivered, or it is reported blocked with its state re-read at the source — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
