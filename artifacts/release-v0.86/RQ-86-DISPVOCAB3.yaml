artifacts:
- id: RQ-86-DISPVOCAB3
  type: system-req
  release: v0.86
  status: proposed
  title: The disposition vocabulary's two questions are separated, and the classifier's reach is stated
    as a relationship
  description: 'Carried. v0.85 re-derived the live figures rather than trusting the plan''s, and its second
    round then refuted the correction''s own multiplier: the out-of-population remainder is dominated
    by artifacts carrying no verdict field at all, not by declared non-verdicts, and the factor by which
    the earlier wording was wrong is unstateable without naming a denominator.


    SO THE REMEDY IS TO SEPARATE THE TWO QUESTIONS — an allow-list membership test and a semantic test
    — and to state the classifier''s reach as a RELATIONSHIP rather than as a multiplier over an unnamed
    denominator.


    REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a legitimate outcome,
    reported with numbers: re-derive the iterated set, the reached set, and the composition of the remainder
    at this release''s commit, naming the denominator for every ratio stated. The figures are live and
    have moved every release they were measured; a carried figure here is a stale one.'
  tags:
  - feature-loop
  - process
  links:
  - type: derives-from
    target: BR-001
  fields:
    req-type: process
    priority: should
    issue: '#1458'
    verification-track: manual
    done-when: manual:2027-03-31 the two questions are separated and every stated ratio names its denominator
      — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting
      command above is RUN FIRST and its result reported either way
