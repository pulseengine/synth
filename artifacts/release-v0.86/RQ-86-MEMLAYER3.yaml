artifacts:
  - id: RQ-86-MEMLAYER3
    type: system-req
    release: v0.86
    status: proposed
    title: "The multi-memory layering ships, or the blocker is re-scoped against a re-read of the downstream answer"
    description: >
        fathom's only remaining blocker, carried into a fourth release. Conduct rule 4 BINDS and
        has bound for three releases: each one sized the gap and none closed it.

        WHAT IS ALREADY PROVEN, so this lane does not re-derive it: the compile half is PROVEN,
        not unproven — v0.85 built a version-matching binary and reproduced the refusal with
        controls on both sides, including a single-memory control that succeeds. The refusal
        exists at TWO levels, a CLI pre-flight and the selector's own arm, so a CLI probe hits
        the outer one first. The binding path is the native-pointer flag, not the safety-bounds
        mode the issue is framed around. The half the reporter thought decisive shipped two
        releases ago.

        SO THE WHOLE REMAINING BLOCKER IS THE LAYERING, and this lane scopes only that.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: before writing any code, re-read the
        downstream consumer's own answer with `git grep -n "static_data_addend" -- artifacts/`
        and re-count its call sites in the selector. If the bounding design assertion that
        memory zero carries no suffixed alias has been removed since v0.85, the constraint this
        scope rests on is gone and the scope is wrong. A refuting command that only re-measures
        the code is NOT enough here, because this lane touches a refusal's location that a
        downstream consumer was consulted about.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1145"
      verification-track: manual
      disposition: partial
      landed: "PR #1526 - #1145 - NOT LANDED as scoped, and no layering ships. The refuting command RAN FIRST and did NOT refute on its own terms - the downstream design answer survives in the artifact tree, the bounding assertion holds, and the call-site count still reads nine - but the re-read it demanded lands on the done-when's SECOND branch: the blocker is re-scoped against the downstream's own latest comment. Four measurements: the sizing this lane inherited points at a path memory k never reaches, because the memory-k arm relocates through its own per-memory region symbol and never consults the classifier whose call sites were counted; the classification window is already memory-0-scoped at both bounds, so a second memory cannot widen it; the reporter measured that the layering ALONE would leave them exactly as blocked, since two domains reserve more memory than any of their three boards has; and the phase-one reach is narrower than the premise assumed, covering the i32 access family only. Neither refusal is lifted. A RECOMMENDATION on the order the reporter asked for, and a TENSION between two of their own asks, are recorded for the maintainer rather than answered on the thread. Conduct rule four is stated against this lane: a corrected scope is NOT progress on an externally reported defect that is still open, and the reporter still cannot compile."
      verified-by: >
        PARTIAL — the refuting command ran first and did NOT refute on its own terms, but the
        re-read it demanded re-scopes the blocker, which is this lane's deliverable and the reason
        no layering ships. The done-when's second branch is the one met.

        THE REFUTING COMMAND, run before anything was written. `git grep -n "static_data_addend"
        -- artifacts/` returns two hits and the load-bearing one is the v0.84 answer itself, so
        the downstream design assertion has NOT been removed. The bounding constraint also holds:
        the multi-memory test still asserts memory 0 has no suffixed alias. The call sites still
        number nine, exactly as v0.84 recorded. On its own terms the scope was intact.

        BUT THE NINE CALL SITES ARE THE WRONG TARGET, and that is measurable without building
        anything. The index-carrying envelope is a WRAPPER, not a field: no load/store variant in
        the op enum carries a memory index, and the decoder wraps a load/store only when its
        memarg names a non-default memory — so memory 0 keeps the bare variants and single-memory
        streams stay bit-identical by construction. The selector's envelope arm spans one hundred
        and fifty-two lines and contains ZERO references to the classifier; it relocates through
        the per-memory region symbol instead, and neither helper it calls reaches the classifier
        either. Every one of the nine sites lies BEFORE that arm begins. So threading a memory
        index through them would unblock nothing: they are all on the memory-0 path, which the
        decoder's own invariant guarantees never carries memory k. Memory k ALREADY has its own
        relocation.

        AND THE CLASSIFICATION WINDOW IS ALREADY MEMORY-0-SCOPED, so the feared widening does not
        exist. The upper bound is the FIRST declared memory's initial size — the backend config
        field is assigned `all_memories.first()` in the compile driver, and that is the value
        handed to the selector's native-pointer setter — and the lower bound is the stack-pointer
        global's initializer. Both are memory-0 quantities, so declaring a second memory cannot
        widen the window or misclassify a memory-k address as a memory-0 static.

        A NARROWED SYMBOL CLAIM, because the first search could not have found its own
        counter-example: searching for the full region-symbol name cannot contain a prefix test
        spelled with a shorter one. Re-run over the short spellings, every match on the region
        symbol in shipped crate code compares for EQUALITY and a prefix or substring form appears
        for NO suffixed-symbol name at all. POSITIVE CONTROL for the search form: the same
        prefix-test spellings return eleven real matches elsewhere in the same crates, so the zero
        is a measurement and not a broken needle. The claim is scoped to shipped crate code; this
        lane did NOT locate the post-link in-range oracle the region doc names, and asserts
        nothing about it.

        THE RE-SCOPE comes from the downstream's own latest comment, which is what this lane's
        refuting command exists to force a reader to open. This artifact asserts that the whole
        remaining blocker is the layering. The reporter measured otherwise: granting the layering,
        their two domains reserve sixty-four and one hundred and twenty-eight kilobytes, and their
        three boards have eight, sixty-four and ninety-six. The two-domain image fits NONE of
        them, so phase two would land and they still could not ship it.

        THE ORDER THE REPORTER ASKED FOR IS A RECOMMENDATION, NOT A RULING. They asked for the
        maintainer's judgement rather than guessing it, and the held reply is where that answer
        belongs. The measured recommendation is that the SIZING half goes first: it is independent
        of the layering, it is already filed as its own OPEN issue — #1441, "no backend reads the
        declared page size, so a per-domain tenant costs 64 KiB minimum" — and by the reporter's
        own numbers it is what decides whether phase two is usable on hardware at all. The
        layering, delivered alone, changes nothing they can run.

        AND A TENSION BETWEEN TWO OF THE REPORTER'S OWN ASKS, recorded because resolving it is
        not this lane's call. #1441 explicitly DECLINES a derived used-extent symbol — "strictly
        better for fitting and strictly worse for trust", because an embedder must believe a
        derivation where a declared page size needs none — and asks for the DECLARED size instead.
        The later #1145 comment asks for each memory to be "sized to its used extent". Those are
        the two options #1441 weighed against each other, and the reporter chose the other one
        there. The maintainer should settle which before either is built; it is added to the held
        draft as a question rather than answered on the thread.

        A FOURTH MEASUREMENT bounds the layering even where it would apply. The envelope arm
        covers the i32 access family only — eight variants, load and store, byte and halfword and
        word — so an i64, f32, f64 or v128 access on memory k still declines loudly. Lifting the
        two refusals would therefore move the blocker rather than remove it for any module whose
        memory k is touched at another width.

        WHAT THIS LANE DELIBERATELY DID NOT DO. It did not lift either refusal. Both were located
        — a command-line pre-flight and the selector's own arm, the pre-flight being the one the
        reporter's transcript shows them hitting. Lifting them is gated on an execution
        differential under their exact flags, and per this repository's own rule that oracle lands
        FIRST; building it now would be building the oracle for the half the measurement says to
        do SECOND.

        CONDUCT RULE 4 IS STATED AGAINST THIS LANE: correcting a scope is not progress on an
        externally reported defect that is still open. Nothing the reporter runs behaves
        differently after this release than before it.
      done-when: "manual:2027-03-31 the layering ships with its oracle, or the blocker is re-scoped against a re-read of the downstream answer — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
