artifacts:
  - id: RQ-86-SPELLSCAN
    type: system-req
    release: v0.86
    status: implemented
    title: "A gate that scans for statistics catches them in BOTH spellings"
    description: >
        NEW, from v0.85's second round, and it is the recorded rule about spelling realised in a
        release gate. The scan that re-verifies the release file free of statistics reads
        DIGITS. The figure that round one had already proven false survived in that file spelled
        as a WORD, and the commit that fixed its twin reported the file re-verified clean —
        truthfully, by a scan that could not see it.

        A CENSUS IS BOUNDED BY ITS PATTERN'S SPELLINGS. And the widened scan is NOT an oracle:
        v0.86's own release file trips it on idioms, so the remedy must include the JUDGEMENT
        step and record it, rather than pretend a token match is a statistic.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
        legitimate outcome, reported with numbers: run a word-number scan over every release
        file in the tree and count the survivors, then classify each by hand. If the digit-only
        scan and the widened scan agree everywhere, the blindness is not live and this lane is
        moot — but they already disagreed once, so a zero disagreement needs a positive control
        showing the widened scan fires on the figure that escaped.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1515"
      issue-scope: outlives
      verification-track: manual
      landed: "PR #1537 - #1515 - DELIVERED: the release-file statistics scan now covers BOTH spellings, it is committed rather than typed into a commit message, and its judgement step is explicit in its own output. The refuting command ran first over every release file in the tree, and round two gave it a COMMITTED tree-wide mode so the figure can be re-derived: --all states its own population of TWENTY-SIX release directories, TWENTY-FIVE carrying a release file, and over it the word half returns THREE HUNDRED across TWENTY-FOUR and the digit half TWO HUNDRED AND THIRTY-FOUR across TWENTY - the word figure moving from three hundred and two as this same change-set removed two statistics, which is why it is stated against a commit and derived by the mode. The scan could only ever read ONE file, so every tree-wide number this lane reported came from an uncommitted loop until that mode existed. What round two then refuted was this record's own over-claim: a THIRTY-file set DOES exist - five flat release files plus the twenty-five nested ones - cold review's eleven-hundred-and-sixty-two across twenty-five re-derives on it to the digit, and the original word figure was right at the commit that wrote it. The only false half was ever the digit half's ZERO. Thirty is the wrong DENOMINATOR for a rule about a comments-only file, because the five flat files carry artifact bodies; it is not a population that fails to exist. The POSITIVE CONTROL is satisfied at the commits where the escaped figure was live: it is present at planning, at release prep and at cold-review round one, with the digit scan reading CLEAN at every one of the three, and round two removed it. The scan is deliberately NOT an oracle - the overwhelming majority of the word hits are idioms - so it REPORTS and the operator records the judgement. That judgement was WRONG for two of the five hits in this release's own file: they were classified by part of speech, and on the test the scan's own output states they are unsourced counts of a shipped release's outcomes. Per the report's own instruction a statistic is REMOVED rather than reworded, so both are gone and the file now carries THREE idioms - though a first attempt only REWORDED them, which round two caught: one count was weakened to a bound and the other became a singular definite still asserting exactly one, in a spelling the pattern cannot see. Relabelled into invisibility is the opposite of removed. Both facts also turned out to HAVE first copies in the previous release's own files, so cold review's stated ground for the removal was false even though the removal was right. THREE NEGATIVE CONTROLS were executed and ONE OF THEM FOUND A VACUOUS CASE IN THIS VERY SELF-TEST: the live-figure case asserted on the probe LINE rather than on the matched TOKEN, and stayed GREEN with the word removed from the pattern, because that same line also contains another number word. Fixed by asserting on what the instrument matched; the control now reds. CI gates the self-test, not the report."
      verified-by: >
        DELIVERED — the scan covers both spellings, it is committed and CI-gated, and its
        judgement step is stated in its own output rather than assumed.

        THE REFUTING COMMAND, run first over every release file in the tree — and the figure is
        now DERIVED BY A COMMITTED MODE, which is the whole correction. `--all` reports its own
        POPULATION: TWENTY-SIX release directories, TWENTY-FIVE carrying a release file, v0.70
        without one. Over that population the word-number scan returns THREE HUNDRED hits
        across TWENTY-FOUR files and the digit scan TWO HUNDRED AND THIRTY-FOUR across TWENTY,
        both non-zero in NINETEEN — at THIS commit, because the figure moves with any edit to
        any release file. It was THREE HUNDRED AND TWO when this correction was first written,
        and the removal of the two statistics described below — in the same change-set — moved
        it by two before the sentence was committed. THAT IS THIS RELEASE'S OWN CLASS CAUGHT A
        THIRD TIME, in the act of correcting the second instance of it, which is the argument
        for deriving the figure from a committed mode rather than quoting it anywhere at all. THE DENOMINATOR, NOT THE RE-DERIVABILITY, IS WHAT WAS WRONG — and an earlier
        version of this record got that backwards in both directions, which round two refuted.
        It said there is NO POPULATION OF THIRTY and that NONE of the circulating figures was
        re-derivable. Both are false. The thirty-file set EXISTS and is the one the original
        sentence was measured over: FIVE flat `artifacts/release-v0.5*.yaml` plus the TWENTY-FIVE
        nested release files. Driving the shipped `scan()` over it re-derives cold review's
        figure TO THE DIGIT — ONE THOUSAND ONE HUNDRED AND SIXTY-TWO digit hits across
        TWENTY-FIVE of the thirty — and the word half reads FIVE HUNDRED AND FIFTY-EIGHT across
        TWENTY-NINE, which is the original FIVE HUNDRED AND SIXTY less exactly the two hits this
        change-set removed. So the original's word figure was RIGHT at the commit that wrote it,
        and the only false half was ever "the digit scan returns ZERO in all thirty files" — the
        digit half is zero in exactly FIVE of the thirty, all of them nested files.
        RE-DERIVABILITY IS A PROPERTY OF A COMPUTATION, not a verdict on its denominator.
        WHAT IS ACTUALLY WRONG WITH THIRTY is that the five flat files are NOT comments-only —
        they carry artifact bodies, hundreds of non-comment lines each — so a rule about a
        comments-only release file does not reach them, and `--all`'s TWENTY-FIVE is the
        population the RULE targets. The two counts answer different questions rather than
        disagreeing. What was never derivable from the SHIPPED scan was any tree-wide figure at
        all: `release_file` returns ONE path, so every tree-wide number this lane reported came
        from an uncommitted ad-hoc loop until the mode above existed. The blindness itself is
        undisputed and is the PER-FILE escape the previous release measured.

        THE POSITIVE CONTROL IS SATISFIED, and getting there took two corrections of this lane's
        own instruments. Measured across the previous release's window, the escaped figure is
        present in the release file at planning, at release prep and at cold-review round ONE —
        three commits — and absent after round two, while the digit scan reads CLEAN at every one
        of those commits. So the word scan sees exactly what the digit scan could not, at the
        commits where it mattered.

        THE FIRST CORRECTION: THIS LANE'S OWN POSITIVE CONTROL WAS VACUOUS AND SAID SO. The first
        run reported zero occurrences at every commit in the window, which would have read as
        "the figure was never there". The cause was the shell: an unbraced variable followed by a
        colon had its colon read as a parameter MODIFIER, so the revision-and-path argument
        became a mangled absolute path, the command failed, and a redirect of standard error hid
        it while the count came back zero. An empty positive control is the finding, so it was
        debugged rather than reported. Braced, the control fires.

        THE SECOND CORRECTION: THE DIGIT SCAN'S OWN IDENTIFIER STRIPPER HAD A FALSE POSITIVE. It
        matched only three-component versions, so a release file's own title line — carrying a
        two-component version — read as a digit survivor. Versions and issue references are
        IDENTIFIERS, not statistics, and the shipped pattern now accepts both shapes.

        THE SCAN IS DELIBERATELY NOT AN ORACLE, which the artifact requires it to say. The
        overwhelming majority of the word hits are IDIOMS, not figures. THIS RELEASE'S OWN FILE
        CARRIED FIVE AND NOW CARRIES THREE, because TWO OF THE FIVE WERE NOT IDIOMS. The earlier
        classification was BY PART OF SPEECH — "a repetition count in prose", "a determiner" —
        and a word class is not an argument about the test the scan's own output states, which is
        whether the token is a figure standing in for a measured number. Judged on THAT test, the
        hit reading "it fired twice inside a single anchor derivation" IS a count of a shipped
        release's measured findings, and the hit reading "a single lane carried that release's
        only delivery" IS a count of its deliveries. BOTH ARE SECOND COPIES, AND THE GROUND
        FIRST GIVEN FOR SAYING SO WAS FALSE: cold review reported NO first copy of either in the
        tree, but its needles were three spellings of THIS release's own sentence rather than of
        the facts, so the census was bounded by the very text it was testing. Widened to the
        facts, both have a first copy — the previous release's own release file ENUMERATES the
        classifier firing, and its review record carries the delivery count in the window gate's
        own printed line. That makes the removal right for a better reason than the one recorded,
        and it also shows the sentence UNDERCOUNTED: the earlier file enumerates THREE firings of
        that class where this one named two.
        A FIRST ATTEMPT AT THE REMOVAL ONLY REWORDED THEM, which round two caught. "Twice"
        became "more than once" — a count weakened to a bound, defensible — but the delivery
        sentence became "the delivery that release carried", a singular definite still asserting
        exactly one, in a spelling `WORD_NUMBERS` cannot see. Relabelled into invisibility is the
        opposite of removed, and it is this lane's own named class applied by its author to their
        own gate. BOTH ARE NOW GENUINELY GONE, replaced by pointers to where the measurement
        lives, and the scan reports THREE: a universal quantifier, a demonstrative, and a
        hyphenated adjective, each an idiom on the stated test and not merely by its word class. A gate that red on a token match would be refused the day it landed
        and routed around, which this repository has already measured once. So the scan REPORTS
        the population and tells the reader in as many words that a token match is not a
        statistic and that the classification is theirs to record.

        THREE NEGATIVE CONTROLS WERE EXECUTED, AND ONE FOUND A VACUOUS CASE IN THIS VERY
        SELF-TEST — which is the release's theme landing on the release's own work. Disabling the
        identifier stripper reds two cases; narrowing the identifier pattern back to
        three-component versions reds one. But narrowing the WORD LIST to drop the escaped figure
        left the self-test GREEN at zero failures: the live-figure case asserted that the word
        appeared in the reported LINE, and that same probe line contains ANOTHER number word, so
        the scan still matched once and the word was still present in the text being inspected.
        The case was true about the wrong subject. It now asserts on the TOKENS THE INSTRUMENT
        MATCHED, exposed for exactly that purpose, and the control reds. Found by negative-
        controlling a self-test rather than by reading it.

        WHAT CI GATES is the SELF-TEST and not the report, because the report is a judgement aid
        with a five-hundred-strong idiom population. The self-test asserts that the blindness is
        still reproduced, that an idiom still fires so the reporter cannot quietly become an
        oracle, that identifiers are not counted, and that the tree-wide mode REFUSES an empty
        population instead of reporting a clean zero over nothing — TWELVE cases. THREE negative
        controls were executed, named above; the claim that every case was shown to fail under
        removal of its own subject was broader than what was run, and is withdrawn.
      done-when: "manual:2027-03-31 the release-file statistics scan covers both spellings with its judgement step recorded, or the blindness is shown absent — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
