artifacts:
  - id: RQ-64-SCOPEGAP
    type: system-req
    title: "synth has TWO artifact systems and one of them is unread — 124 artifacts get a status check and nothing else"
    description: >
      Measured while planning v0.64, and it explains a class of drift rather
      than one instance.

      `status_evidence_check` reports two populations:

        status-evidence:    97 artifacts across 42 RELEASE files
        programme-status:  391 artifacts across 67 artifact files

      The first gets the full R-rules — R2 (claiming a status needs evidence),
      R4 (the delivery commit must be acknowledged), R7/R8 (evidence belongs to
      the release), R10 (every delivery commit is attributable). The second
      gets P0–P2 only: the status key must exist and be legal. That is all.

      So **124 artifacts carry no `release:` field**, live in 30 top-level
      topic files (`cross-compilation.yaml`, `gale-integration.yaml`,
      `verified-codegen-roadmap.yaml`, …), and are invisible to every release
      query the planning skill defines. Among them are SIX `must` items,
      including **VCR-TQ-001 and VCR-TQ-002 — tool qualification across
      DO-178C / IEC 61508**, which the North Star names as the moat that
      certification actually consumes.

      THEY HAVE ALREADY DRIFTED, and nothing could have caught it: `VG-009`
      and `VCR-REACH-002` still state aarch64 accepts **1.6 %** of real
      modules. v0.63 measured 20.2 % on the reachable corpus and published a
      full ladder. Two artifacts assert a superseded figure inside a repo whose
      whole discipline is that load-bearing numbers are pinned.

      THIS IS NOT "TRIAGE THE BACKLOG". The 124 are not a backlog anyone chose;
      they are what falls through the gap between two systems, and adding a
      `release:` to each would only move the problem. The decision this
      artifact forces is: **what obligations does an UNSCOPED artifact carry?**
      Plausible answers, to be chosen deliberately rather than drifted into:
      (a) unscoped artifacts get a staleness rule — any measured figure they
      cite must be pinned or dated; (b) they get folded into the release system
      with an explicit `release: backlog`; (c) the topic files are declared
      NARRATIVE and stripped of measured numbers entirely, so nothing in them
      can go stale.

      The v0.62 precedent applies: RQ-62-ROADMAPGATE brought the roadmap's 39
      artifacts into P0–P2 scope after finding two with no status key at all.
      This is the same finding one rule-tier up — the scope widened, the
      OBLIGATIONS did not.

      CORRECTION AT IMPLEMENTATION (2026-09-07), kept beside the finding
      rather than edited into it: VG-009 is NOT a drifted acceptance figure.
      Its only "1.6" is the substring of "41.6 %" — a LINE-COVERAGE number
      the artifact frames as "measured at v0.54.0", unchanged since #918.
      That is a grep hit on a correctly dated historical figure, exactly the
      framing error this artifact warns against; a rule that flagged it
      would be a false red, so none does. The measured corpus is ONE
      acceptance instance — VCR-REACH-002's TITLE, undated present tense
      over a description already dated by #1017 — plus the class the survey
      found beside it. Survey: 293 unscoped artifacts (124 is the
      NON-CLAIMING subset; 169 more are implemented/verified), 104 carrying
      a figure token, and every genuinely stale one has ONE shape: a
      REPO-DERIVED proof count restated as undated present-tense fact —
      VG-002 /
      ARCH-004 / SWVER-005 / TR-005 "188 Qed / 52 Admitted" (2026-03 numbers;
      kernel recount 630 / 2), VER-001 "39 Qed", VER-002 "95 Qed",
      VCR-ISA-001 "9 admits", undated increment-log sentences in VCR-SEL-001
      / VCR-WASM-001 / SWVER-020 / SWVER-021, and VCR-X86-001's
      undated-but-currently-equal "630 Qed" (correct today and ambiguous to
      a reader at v0.70 — the point RQ-64-FLOORPROSE's correction, #1178,
      kept). The rest of the
      104 are threshold/ABI constants in requirements or measured results
      that ARE a verification record's content.

      DECISION: (a), narrowed to what is mechanically decidable — an
      unscoped artifact is a RECORD: it cites a moving figure only as DATED
      history (a version, an issue/PR number or an ISO date in the same
      sentence) or names the derivation instead of the number. (b) rejected:
      `release: backlog` mislabels the requirements base (BR-001 is the
      trace root, not backlog work) and buys no rule — every R-rule presumes
      a release window or evidence scoping these items lack, the false-red
      argument RQ-62-ROADMAPGATE already made. (c) rejected on the survey:
      stripping numbers destroys evidence to prevent staleness. "Pinned"
      read as EQUALITY with the live pin rejected: it turns every citing
      topic artifact into one more LIVE file that must move with the number
      — and RQ-64-FLOORPROSE's correction (#1178) measured that v0.63's
      largest merge cost sat on exactly the LIVE files (ci.yml, claims.yaml),
      never on a dated transcript. Enforced in status_evidence_check.py as
      S1 (an
      undated repo-derived count in description or field prose) and S2 (an
      undated measured figure in a title) over every artifact with no
      version-shaped `release:` in a non-version-named topic file, with an
      S-VACUOUS floor and a CI-pinned `programme-staleness:` line.
      Description-level percentages stay human-reviewed: a threshold
      ("shall achieve at least 80%") and a measurement are not mechanically
      separable, and six threshold percentages in the requirements base
      would be false reds. Stated as a residual, not a gap closed.
    status: implemented
    release: v0.64
    tags:
      - traceability
      - gate
      - scope
      - staleness
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      verification-track: review
      issue: "#1085"
      landed: "PR #1182"
      done-when: "contains:scripts/test_status_evidence_check.py:test_replay_vcr_reach_002_title_figure_is_red"
      verified-by: >-
        Red-first transcript on the untouched tree: 23 undated citations across
        13 unscoped artifacts, exit 1 — S2 on the titles of VCR-REACH-002 and
        VG-002; S1 on VG-002 x3, ARCH-004 x2, SWVER-005, SWVER-020, SWVER-021,
        TR-005, VER-001 x2, VER-002 x2, VCR-SEL-001 x2, VCR-ISA-001 x3,
        VCR-WASM-001 x2, VCR-X86-001. After the corrections: 34 citations
        scanned, 0 undated, exit 0. VG-009 flagged neither before nor after,
        by design (see CORRECTION). rivet validate unchanged at the 40-error /
        349-warning baseline; claim_check 59/59; 12 new unit tests (corpus
        replay, every anchor form, per-sentence framing, ARM immediates, field
        prose, dated-by-construction exemptions, floor, live-tree green)
        mutation-verified; ci.yml pins `programme-staleness: ... 0 undated`.
