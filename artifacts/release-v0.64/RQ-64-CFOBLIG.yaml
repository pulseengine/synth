artifacts:
  - id: RQ-64-CFOBLIG
    type: system-req
    title: "The Block/End correspondence obligation \u2014 where all 180 of gale's remaining\
  \ uncovered instances live"
    description: >
      CARRIED FROM v0.63, where it was deferred with the reason below. The
      substance is unchanged; see RQ-63-CFOBLIG for the full analysis, which is
      not restated here so there is one source for it.

      DEFERRAL REASON AS RECORDED AT v0.63:
      DEFERRED from v0.63 on scope, stated rather than quietly dropped. This is Rocq proof work on the Block/End correspondence obligation — the shape behind 64 of gale's 180 uncovered instructions — and it is neither started nor blocked. v0.63's capacity went to the reach lanes and to four defects found while cutting it (#1167 A32 wrong-address, #1168 unlinkable objects, #1171 non-determinism, RQ-63-FLOOREQ), three of which were silent miscompiles that outranked planned work. NOT DEFERRED FOR A BAD REASON: no measurement here went stale and nothing about it got harder. It is simply unstarted, and shipping a partial correspondence obligation would put a T3/admitted claim into the proof ledger to make a release look complete — the ledger is CI-gated precisely so that cannot happen quietly.
    status: implemented
    release: v0.64
    tags:
      - proofs
      - control-flow
      - rocq
      - consumer-contract
      - gale
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      verification-track: proof
      issue: "#1057"
      carried-from: RQ-63-CFOBLIG
      done-when: "manual: either Block/End carry a kernel-checked correspondence obligation reflected\
  \ semantically in proof-inventory.json, or the obstruction is stated precisely enough\
  \ to be VCR-ISA-001 input \u2014 with no existence-only theorem named `*_correct`"
      verified-by: >-
        DONE-WHEN BRANCH B, taken deliberately: the obstruction is stated
        precisely enough to be VCR-ISA-001 input, with no existence-only
        theorem named `*_correct` and no Admitted/admit — and the WASM half
        of the obligation, which was never blocked, LANDED with the kernel.

        WHAT THE KERNEL CHECKED (`bazel test //coq:verify_proofs`,
        `//coq:rocq_proofs` PASSED executed-not-cached after each step,
        `//coq:vcr_sel_rules_coverage` PASSED; the constructor addition
        rebuilt the 16 downstream files and the only exhaustive match it
        broke was `compile_wasm_to_arm`, which now carries LOUD-DECLINE
        `[UDF 255]` arms). (1) `WasmInstructions.v`: `Block`/`Loop`/`Br`/
        `End_` mirroring the shipped `WasmOp` variants in the FLAT op-stream
        form (`End_` only because `End` is a reserved Rocq keyword).
        (2) `WasmBlocks.v`, 11 Qed, WASM-only by design: `split_block`
        (nesting-aware), `unwind_to` (a taken branch restores the target
        block's entry stack), the fuel-bounded `exec_wasm_blocks`;
        `exec_wasm_blocks_structured_free` proves it IS `exec_wasm_seq` on
        programs without the four constructors, so every existing theorem's
        executor is unchanged by construction; the Block/Loop/Br unfolding
        lemmas; and computed non-vacuity — the SAME block lands with an
        unwound empty stack or a 7 on top depending only on the branch
        constant, a counting loop reaches local 0 = 0, and with fuel for
        one pass it declines rather than reporting a one-iteration result.
        (3) `BlockEndObligation.v`, 4 Qed, no correctness theorem: the
        index executor runs `B` and `BL` as fall-throughs writing only the
        PC register (`exec_program_pc_B_not_taken`/`_BL_not_taken`), a
        backward `BCondOffset`'s taken and not-taken targets coincide
        (`exec_program_pc_bcond_backward_falls_through`), and
        `ADD;CMP #10;BNE -3` from R0 = 0 exits with R0 = 1 under
        `exec_program_br` (`arm_count_loop_body_runs_once`) where the WASM
        executor iterates. Each stops compiling when VCR-ISA-001 closes its
        gap.

        THE OBSTRUCTION, as VCR-ISA-001 input (file header, coq/STATUS.md
        section, and the VCR-ISA-001 roadmap entry): O1 no executor-visible
        unconditional branch (two disjoint program counters; the shipped
        `Br` is `B label`, gale's `Call` rows share the shape); O2 no
        backward branch (loop back-edges unrepresentable; fuel assumes
        forward-only); O3 index-granular pc against BYTE-resolved labels —
        measured in `arm_backend.rs` (real-encoder byte sizes summed, Label
        = 0 B, widths iterated), so the closed #483 mid-instruction landing
        and #740 halved-offset miscompiles are invisible at index
        granularity, the #1021 popcnt shape one level up; O4 no
        compositional state relation — `state_correspondence` is defined
        (Compilation.v) and used by zero theorem statements, measured by
        grep; O5 the arity-1 join register is an allocator decision
        (`result_reg` lazily allocated at the first branch edge,
        `edge_value_move`), where #509/#930 lived. Supply list in
        dependence order: byte-addressed executor with an encoder-derived
        size function admitting negative offsets and executor-visible
        B/BL/Bcc (O1-O3 are ONE decision); step-counted fuel with the
        exec_program_pc sites re-checked (ArmSemantics 20, CorrectnessI32
        27, CorrectnessBrIf 11, Compilation 1); a cross-instruction
        simulation relation; blocktype arity + join register. The
        forward/void/index-granular fragment is statable and was
        deliberately NOT proven: a green Qed blind to #483/#500/#509/#740/
        #930 is the overclaim this artifact forbids.

        REFLECTED SEMANTICALLY IN proof-inventory.json: Block/Loop/Br/End
        move from `unmodeled` to `absent` (modeled, unproven — one tier up,
        still uncovered for a consumer); summary modeled 138->142,
        unmodeled 141->137, absent 0->4, qed 138 and result_correspondence
        63 unchanged, the BrIf row byte-identical. The join gained its ONE
        Rocq-keyword escape (`End_` -> `End`): RED-FIRST, the unpatched
        generator refused `End_` with exit 1 on this tree; `constructor_op`
        strips exactly one underscore from a reserved stem and `Foo_` still
        refuses; `scripts/test_proof_inventory.py` (7 tests, wired in the
        claim-check job) drives both branches and the real tree's rows.

        LEDGER MOVED WITH THE DOCS in this PR: rocq_qed 630->645 in
        claims.yaml, CLAUDE.md and coq/STATUS.md together; `"modeled":
        false` 141->137; new pin SYNTH-BLOCKEND-OBSTRUCTION-1057 (exactly 4
        Qed in the obstruction file, zero `*_correct` names and zero admits
        in the two new files, exactly 4 `absent` rows, the decision quoted
        from STATUS.md). MUTATION-VERIFIED, each planted then restored: a
        planted `Lemma planted_block_correct` in WasmBlocks.v -> red; a
        planted extra `Qed.` in BlockEndObligation.v -> red (and the
        fields-equal cross-check caught it independently); the End row
        hand-flipped `absent` -> `qed` -> red (`derived 3 != documented
        4`); restored -> 62/62 claims hold. `proof_inventory.py --check`
        exit 0, `oracle_wiring_check.py` re-derived on the merged tree
        exit 0.

        NOT CLAIMED: any Block/End correspondence with ARM code; value-
        carrying blocks; If/Else/Return/BrTable/Call (unmodeled rows,
        unchanged). Deferring the ARM half twice, now with the obstruction
        kernel-pinned, is the outcome the artifact named as acceptable.
