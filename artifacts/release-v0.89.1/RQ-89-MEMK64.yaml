artifacts:
  - id: RQ-89-MEMK64
    type: system-req
    release: v0.89.1
    status: implemented
    title: "The i64 load/store family lowers on a non-default memory, so gale's two-domain image compiles under --native-pointer-abi"
    description: >
        #1622's reporter (gale) fuses a supervisor domain into memory 1 of a
        two-memory module and compiles it --relocatable --native-pointer-abi.
        That domain carries 12 i64 accesses on memory 1 (u64 driver fields).
        The multi-memory selector arm lowered only the i32 load/store family
        on memory k > 0, so the functions holding those accesses were
        loud-skipped and #952/#1102 refused the whole object. A loud refusal,
        not wrong code, but it blocked the reporter's image outright.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact — a
        refutation is a legitimate outcome, reported with numbers: build a
        two-memory module with (pagesize 1) extents and gale's 12 accesses,
        compile it on v0.89.0 with --target cortex-m3 --all-exports
        --relocatable --native-pointer-abi, and report how many functions
        compile.
        CITATION: #1622 is where the matter was analysed. #1145 (multi-memory
        isolation) and #406 (multi-memory phase 1) are where the surrounding
        design was analysed; neither is closed by this record. The numbers
        name where it was analysed, not an open scope.
    tags:
      - feature-loop
      - codegen
      - multi-memory
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1622"
      verification-track: execution
      issue-scope: closes
      done-when: >
        manual:2026-12-31 the i64 load/store family on a non-default memory
        compiles under --native-pointer-abi and the plain embedder path on
        ARM --relocatable, and executes bit-identical to wasmtime with both
        memories compared after every call; and the refuting command above is
        RUN FIRST and its result reported either way
      landed: "PR #1623 (c8743968) - #1622 - DELIVERED. The refuting command was run first on v0.89.0 dd2b791a and CONFIRMED the defect: a two-memory (pagesize 1) module with extents 2080 and 5376 bytes and gale's 12 accesses in 11 exports skipped 11 of 12 functions and exited rc 1. On the change, 12 of 12 compile with 0 declines, and __synth_mem_size_0 / __synth_mem_size_1 are 0x820 / 0x1500, the declared extents. select_with_stack's MultiMemory arm lowers i64.load, i64.store, i64.load8/16/32_s/u and i64.store8/16/32 on memory k against the i32 family's __synth_wasm_data_<k> + offset + addr base, with memory 0's #746 pair forms: I64Ldr/I64Str are two word accesses, never LDRD/STRD, so align=4 and byte-unaligned i64 accesses are correct on Cortex-M3. A narrow load fills the high word by sign or zero extension; a narrow store writes the low word. The narrow forms are an if-chain, so no wildcard arm was added. A SECOND DEFECT, silent wrong code, was found by the new oracle and fixed in the same change: infer_i64_locals did not unwrap MultiMemory, so an i64.load from memory 1 feeding local.set promoted the local as i32 and dropped the high word; a unit test pins it. Cosmetic: the CLI memory INFO line prints the declared page size and the initial size in bytes instead of pages x 64 KiB. STILL REFUSED, by name: inline --safety-bounds software|mask on any memory-k access, i64 included (memory k has no size register; a new test pins it), and f32, f64 and v128 on memory k, whose decline now names what IS lowered."
      verified-by: >
        DELIVERED, execution-verified against wasmtime under unicorn. New
        wired oracle scripts/repro/memk_i64_1622_differential.py (ci.yml,
        routed through oracle_run.py): 5484 calls. Per leg it runs 457 calls
        over every i64 width at gale's offsets 0/8/16/24/28/48/108, i64.load
        and i64.store at align=4 and natural alignment, word-aligned,
        byte-unaligned and end-of-memory addresses, a read-modify-write, two
        cross-memory transfers, and four functions that touch i64 ONLY
        through memory 1 (sum6: six live pairs that spill; rev6: six through
        locals; selv: select; cres: an internal call's result). Fixtures:
        gale's (pagesize 1) shape and a 64 KiB-paged one, each under
        --native-pointer-abi and the plain embedder path, on cortex-m3,
        cortex-m4f and cortex-m7. After every call memory 1 is checked against
        its own data segment, both memories are compared byte for byte, every
        access must land inside memory 1's region, and R4-R11, SP and the
        caller's frame must be preserved. RED on v0.89.0 dd2b791a: every
        fixture refuses to compile, 0 calls executed. GREEN on PR #1623: 5484
        of 5484. Potency, from PR #1623: a word-swapped memory-k i64 store
        mutant reds 2796 of 5484; removing the MultiMemory unwrap from
        infer_i64_locals makes rev6 refuse on every leg (96 wrong results on
        the earlier fixture set); a sum6 whose prologue stops saving R8 is
        caught. Out of scope of the oracle, by design: an i64 carried over
        br/br_if (#509) and an i64 call argument (#929) are loud declines on
        every memory. crates/synth-cli/tests/multi_memory_406.rs gains
        i64_access_on_non_default_memory_lowered_1622 and
        i64_access_on_non_default_memory_inline_bounds_refuses_1622, and
        wide_access_on_non_default_memory_loud_skips pins the f32/f64/v128
        decline. REACH, base vs change, measured in PR #1623 by a symtab byte
        census over 2704 modules (spec testsuite, tests/, scripts/repro) on
        cortex-m3 --relocatable, plain and NPA: 0 newly refused, 0 functions
        changed bytes, all 5266 single-memory cells identical. Newly compiled:
        65 distinct functions per path, all in five spec files with an i64
        access on a non-default memory (address1 42, float_memory0 3,
        memory_trap1 11, store0 2, traps0 7). Executed against wasmtime on
        both paths, each file's own rows plus one direct in-bounds call where
        no row ran in bounds: 268 of 268 bit-identical (236 rows, 32 direct
        calls), covering 58 of the 65. The other 7 are address1's *_bad
        exports, whose offset 4294967295 makes every call out of bounds.
        208 assert_trap out-of-bounds rows do not trap in the default
        configuration: the same documented no-trap envelope the i32 memory-k
        family already has (--safety-bounds none). Pins moved with paired
        controls in PR #1623: the oracle wiring check's exact emulation floor
        (oracle_wiring_check.py, declared per oracle), the home-alias audit,
        the selector line ratchet (waiver chained after RQ-89-MEMLAYER6's),
        the multi-memory width-scope pin and the mutation ledger anchors.
        RE-RUN AT RELEASE PREP, 2026-11-05, on the synth 0.89.1 debug binary
        built from the v0.89.1 assembly branch (rebased on df847a16):
        `SYNTH=./target/debug/synth python3
        scripts/repro/memk_i64_1622_differential.py` prints `compared: 5484`
        and `ORACLE: PASS`, rc 0, and `cargo test -p synth-cli --test
        multi_memory_406` passes 23 of 23. The reach census was NOT re-run;
        its figures are cited from PR #1623. #1145 is NOT closed by this record: its
        per-memory isolation obligations are carried by RQ-89-MEMLAYER6
        (issue-scope outlives).
