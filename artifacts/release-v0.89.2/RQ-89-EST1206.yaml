        m7dp, m55; the LLVM-triple aliases map onto these), so the wired
        oracle now runs all of them. A32, F3: this release's fixture on
        cortex-r5 (self-contained, entered at each symbol, not booted; a
        scratch harness not in the repo, see the review's disposition) is
        wrong on 383 of 640 runs on both binaries and on 0 of 640 with PR
