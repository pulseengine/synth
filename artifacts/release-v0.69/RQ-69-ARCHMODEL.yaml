artifacts:
  - id: RQ-69-ARCHMODEL
    type: system-req
    title: "Feature-loop steps 1-2 (spar AADL -> WIT) are N/A again, carried on spar#445 — re-verified at cut with the observed state and date"
    description: >
      CARRIED, NOT FORGOTTEN. #1136 exists because a step marked N/A for the same
      reason three releases running is a backlog item rather than an exemption. The
      blocker is spar#445; at the v0.68 cut it was checked and recorded OPEN, last
      updated 2026-09-03, with no comments.

      THE COUNT IS THE `carried-from` CHAIN, NOT A REMEMBERED ORDINAL. Release
      artifacts only exist from v0.63, so an ordinal like "the eighth N/A" cannot be
      derived from the artifact set and must not be asserted from memory — v0.68
      recorded the chain and the two prose recurrences it can actually cite.

      THE OBLIGATION THIS RELEASE IS THE SAME SMALL ONE: re-verify spar#445 AT THE
      CUT, record the observed state and the UTC date, and extend the chain. If it
      has moved, the artifact stops being carried.
    status: proposed
    release: v0.69
    tags:
      - process
      - carried
      - spar
      # RESTORED at the v0.69 cut (cold review). Every predecessor v0.63-v0.68
      # carries `feature-loop` + `aadl`; this artifact was written without them
      # in the plan PR, and loop_conformance_check's steps-1-2 slot matches on
      # exactly `feature-loop` AND (`aadl`|`spar`) — so the filing that exists
      # to keep this deferral VISIBLE was itself invisible to the gate. That is
      # the lapse #1136 was opened to prevent, one layer up.
      - aadl
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1136"
      disposition: deferred
      carried-from: RQ-68-ARCHMODEL
      done-when: "manual: spar#445 is re-checked at the v0.69 cut with its observed state and the UTC date recorded, and the carried-from chain is extended rather than an ordinal asserted"
      landed: >-
        DEFERRED AGAIN, on a blocker re-verified AT THE CUT rather than
        remembered (#1136).

        OBSERVED 2026-09-18T16:49:14Z, by querying the issue:

          spar#445  state=OPEN  updatedAt=2026-09-03T10:57:37Z  comments=0
          "spar accepts property associations from UNDECLARED property sets
           silently (rc=0)"

        Unchanged since the v0.68 cut recorded it (OPEN, 2026-09-03, 0
        comments). Feature-loop steps 1-2 (spar AADL -> generated WIT) stay
        N/A: a generator whose input language silently accepts a typo'd or
        invented property set cannot be the single source this loop requires,
        because the failure it would introduce is exactly the one this project
        keeps paying for — a green run that checked nothing.

        THE COUNT IS THE CHAIN, DERIVED, NOT AN ORDINAL. Following
        `carried-from` backwards from this artifact: RQ-69 -> RQ-68 -> RQ-67 ->
        RQ-66 -> RQ-65 -> RQ-64 -> RQ-63, which is SEVEN consecutive releases
        (seven RECORDS joined by six `carried-from` links).

        CORRECTED BY THE COLD REVIEW: an earlier draft of this paragraph said
        "release artifacts only exist from v0.63" as the reason no larger
        ordinal is asserted. That is FALSE — `artifacts/release-v0.56.yaml`
        onwards exist, seven minors earlier. The chain still terminates at
        RQ-63-ARCHMODEL because that is the first record carrying no
        `carried-from`, which is the honest reason: the count is what the links
        support, not what the artifact directory happens to contain.
      verified-by: >-
        Re-derivable in two commands. The blocker:
        `gh issue view 445 --repo pulseengine/spar --json state,updatedAt,comments`
        returns OPEN / 2026-09-03T10:57:37Z / 0 at the timestamp above. The
        count: walk `fields.carried-from` from RQ-69-ARCHMODEL backwards over
        `artifacts/release-v0.*/RQ-*-ARCHMODEL.yaml` — SEVEN RECORDS joined by
        SIX links, terminating at RQ-63-ARCHMODEL, which carries none. (An
        earlier draft said "seven links"; the cold review caught the off-by-one.
        Seven consecutive releases is the claim that holds.)

        NOT claimed: that spar#445 is the only thing between this project and a
        generated-WIT pipeline, or that deferring is free. #1136 exists because
        a step marked N/A for the same reason three releases running is a
        backlog item rather than an exemption — and this is the seventh.
