artifacts:
  - id: RQ-83-PINDEBT8
    type: system-req
    release: v0.83
    status: proposed
    title: "The pin-debt ratchet, re-derived, and whether a case-preserving merge still passes silently"
    description: >
      `known_open_pins` is `direction: down` and `known_open_pinned_cases` rides beside it as
      `direction: track`. v0.73's round 2 PROVED the gap: merging two per-function pins into one
      wildcard while SUMMING their cases leaves the total unmoved, so `track` stays silent while
      `known_open_pins` falls and the operator adds the waiver the ratchet's own message instructs them
      to add. That path was executed and every claim held, so a case-preserving pin merge is a
      REVIEW-TIME obligation and not a caught one. This lane re-derives the population and asks whether
      the tripwire's NAME scoping (`^(?:KNOWN|PINNED)`) still leaves a suppression table called
      anything else outside both the tripwire and the ratchet.

      REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
      legitimate outcome, reported with numbers:
      `python3 scripts/claim_check.py claims.yaml --metric` and read the printed pin figures — if
      `known_open_pins` has fallen without a waiver the ratchet moved for a reason this lane must name;
      and plant a byte-identical table under a non-matching name to confirm the NAME scoping gap is
      still live.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1484"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the gap is CONFIRMED with a PAIRED CONTROL the earlier record did not carry. Refuting
        command first: `claim_check.py claims.yaml --metric` reports known_open_pins
        84 against baseline 27, direction down, 6 waivers, and known_open_pinned_cases
        157 tracked. The ratchet has not fallen unwaived, so the premise stands.

        THE NAME-SCOPING GAP IS LIVE AT THE v0.83 CUT. In a detached worktree off
        main, the 12-entry `KNOWN` table in
        `scripts/repro/false_reject_1229_differential.py` was EXTRACTED verbatim
        rather than retyped and cloned with its body asserted BYTE-IDENTICAL, changing
        only the name. Planted as `SUPPRESSED_CASES` the tripwire regex does not match
        and claim_check stays 75/75 rc=0 with known_open_pins unmoved at 84. Planted
        as `KNOWN_EXTRA` the regex matches and claim_check goes 74/75 rc=1 with `count
        drifted: derived 13 != documented 12`. Twelve suppression entries entered the
        tree with BOTH layers silent, and the same bytes under a matching name red the
        gate, so the gap is purely the NAME.

        THE TWO LAYERS FAIL FOR DIFFERENT REASONS, which the paired control separates.
        The ratchet derives from an explicit `tables:` LIST in claims.yaml, so any
        unlisted table is invisible to it whatever its name. The tripwire is the layer
        that exists to catch an unlisted table, and it counts by
        `^(?:KNOWN|PINNED)[A-Z0-9_]*`, so a differently-named table is outside its
        population too. The tripwire counts TABLES and the ratchet counts ENTRIES,
        which is why the regex finds 12 declarations while the ratchet's list names 10
        — and CORRECTED by cold review round 1: BOTH extras are `PINNED_WRONG`, and NO
        `EXPECTED_*` table is in the tripwire's population at all. Re-measured over
        `scripts/repro/**/*.py` the regex matches `KNOWN` x7, `KNOWN_ARM_MISMATCHES`,
        `KNOWN_OPEN`, `KNOWN_OPEN_HITS` and `PINNED_WRONG` x2; the 12 `EXPECTED_*` declaration
        sites across 9 distinct names match it ZERO times, because `^(?:KNOWN|PINNED)` cannot
        match `EXPECTED`. Calling them EXCLUDED implied they were in the population and filtered
        out when they were never in it — an ABSENT key read as a FILTERED
        kinds.

        NOT FIXED, with the reason recorded rather than a longer regex shipped.
        Widening the pattern to every top-level dict would sweep every unrelated table
        in `scripts/repro/` into the pinned population. The honest remedy is an
        explicit inclusion criterion the operator satisfies when adding a suppression
        table, which is a review-time obligation and not a derivable one — the same
        shape CANCELGAP applied to its own no-show residual.
      done-when: "manual:2026-12-31 the pin-debt ratchet, re-derived, and whether a case-preserving merge still passes silently — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
