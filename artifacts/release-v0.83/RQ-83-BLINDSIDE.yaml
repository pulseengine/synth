artifacts:
  - id: RQ-83-BLINDSIDE
    type: system-req
    release: v0.83
    status: proposed
    title: "For every required gate, the direction it CANNOT see — and whether that silence is distinguishable from a pass"
    description: >
      v0.83's THEME MADE CONCRETE. An instrument that takes its reference FROM what it measures is
      blind in exactly the direction that matters, and v0.82 produced four instances: a refusal
      comparing a counter its own loop appended to; a derivation inheriting its own command's pagination
      window; a gate deriving its enforced field set from the idiom it polices; and anchor counts
      measured at the anchor's own tree. This lane derives, per required gate, the direction it cannot
      see and whether that silence reads as a pass. The rule is NOT "stop deriving" — it is that the
      check and the checked need INDEPENDENT sources, and that independence is a property to PROVE.

      REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
      legitimate outcome, reported with numbers:
      `git grep -n 'or ""' -- scripts/ | wc -l` and v0.82's gate-potency record — if every required
      gate already declares its blind direction, the premise is dead.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1484"
      verification-track: manual
      disposition: partial
      verified-by: >
        PARTIAL — the premise survives its refuting command and four blind directions
        are NAMED with measurements, but not all nine required contexts.

        Refuting command first: `git grep -n 'or ""' -- scripts/` returns 45 sites
        across 20 files, so the surface of silent-default coercions is large and the
        premise is not dead. Each such site is a place where an absent value and an
        empty value become indistinguishable.

        FOUR BLIND DIRECTIONS, MEASURED THIS RELEASE rather than surveyed. jq's `//`
        operator misses the EMPTY STRING, and a runner no-show's `runner_name` is `""`
        rather than null, so `// "?"` never fires. `merge_gate.decide()` is PURE over
        the ROLLUP, which carries no job-level `steps` or `runner_name`, so the no-
        show direction is structurally outside its inputs — recorded by CANCELGAP's
        own partial disposition. The status-evidence gate COUNTED four failures while
        PRINTING two, because `failures.extend(_r15)` sat after the print loop;
        verified both ways on ONE tree, 2 printed of 4 counted before #1500 and 4 of 4
        after. And known_open_pins cannot see a suppression table under a non-matching
        name, paired-controlled under PINDEBT8.

        THE COMMON SHAPE, which is the lane's actual finding: in every one of the
        four, the silence is INDISTINGUISHABLE FROM A PASS at the point an operator
        reads it.

        NOT DELIVERED: a per-gate declaration of the blind direction for each of the
        nine required contexts. This lane names four mechanisms, not nine gates, and
        generalising from four to nine is exactly the move the disposition refuses to
        make.
      done-when: "manual:2026-12-31 for every required gate, the direction it cannot see — and whether that silence is distinguishable from a pass — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
