      report whether the report is among them, with the cause named if absent. The 130-of-149 backlog
      is a MAINTAINER DECISION and is not actioned unasked.

      REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
      legitimate outcome, reported with numbers:
      `gh release view v0.82.0 --json assets --jq '[.assets[].name]'` — if a compliance report IS
      attached the first half is satisfied and the lane narrows to the backlog; and
      `python3 scripts/test_compliance_sync.py` (expect 7/7).
