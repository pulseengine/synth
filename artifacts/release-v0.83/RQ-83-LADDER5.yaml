artifacts:
  - id: RQ-83-LADDER5
    type: system-req
    release: v0.83
    status: proposed
    title: "The acceptance ladder, or the auth blocker stated as the human action it is"
    description: >
      The ladder still reads v0.63 with its corpus unmounted. mac.fritz.box refuses every offered key
      and ATTEMPTING PASSWORDS STAYS DECLINED — that is a standing refusal, not an obstacle to work
      around. v0.82 corrected four releases of "refused every offered auth method", which was the WRONG
      FACT: the server offers publickey and the key is not in `authorized_keys`. The blocker is a
      one-line human action. This lane either measures the ladder or states the action, with the
      fingerprints, and does not re-litigate the refusal.

      REFUTING COMMAND, to be RUN BEFORE building on this artifact — a refutation is a
      legitimate outcome, reported with numbers:
      `ssh -o BatchMode=yes -o ConnectTimeout=5 r@mac.fritz.box true; echo rc=$?` and
      `ssh-add -l` — if rc=0 the append happened and the ladder is measurable; the fingerprints in the
      ladder header must match what `ssh-add -l` prints, or the header is stale.
    tags:
      - feature-loop
      - process
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1432"
      verification-track: manual
      disposition: deferred
      verified-by: >
        BLOCKED OUTSIDE THIS REPOSITORY. Measured from the file rather than from the
        issue: `docs/status/ACCEPTANCE_LADDER.md` opens `# Acceptance ladder — v0.63`
        and `**Measured 2026-09-06** on synth at e3a09ac2`. Derived from the tag list,
        NINETEEN minor versions are tagged after v0.63.

        WHY THERE IS NO OUTCOME: re-measuring needs the named 243-module corpus, whose
        last known location is `/Volumes/Work/corpora/wasm-243` on host
        `mac.fritz.box`. `/Volumes/Work` is measured NOT MOUNTED on this machine, the
        host refuses the offered keys, and ATTEMPTING PASSWORDS STAYS DECLINED. The
        real blocker is a one-line `authorized_keys` append on that host, a maintainer
        action outside this repository.

        AND THE DIRECTION OF THE KNOWN NEAR-MISS IS RECORDED CORRECTLY, because a
        first draft of this paragraph INVERTED it. The ladder's own text says a v0.78
        lane "nearly produced a published claim that the corpus was unobtainable; it
        is not lost, it is unmounted" — the near-miss was declaring the corpus LOST,
        not declaring it present. The inversion would have ratified exactly the
        reading that paragraph exists to prevent, and it was caught by reading the
        line rather than citing a paraphrase of it.

        NO SUBSTITUTE MEASUREMENT IS PUBLISHED. A ladder measured over a DIFFERENT
        corpus set beside the old one as if it were a trend is the #1286 defect. So
        the ladder keeps its v0.63 date and its stated staleness, which is a true
        statement, rather than gaining a false freshness.
      done-when: "manual:2026-12-31 the acceptance ladder, or the auth blocker stated as the human action it is — delivered with measured numbers, or REFUTED with the measurement that refutes it; and the refuting command above is RUN FIRST and its result reported either way"
