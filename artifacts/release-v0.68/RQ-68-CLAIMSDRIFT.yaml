artifacts:
  - id: RQ-68-CLAIMSDRIFT
    type: system-req
    title: "Documents that claim what the code does not do — f32 min/max, a link mode that always fails, superseded acceptance rates, a size ratio from an estimate, a stale Spectre policy, feature flags that do not build"
    description: >
      VERIFIED ON 9e519fec unless noted. The code is right in each case; the prose is
      wrong, and no gate reads the prose.

        #1285  FEATURE_MATRIX line 46 lists f32 "min/max" as lowering via VFP. Both
               selectors decline: `F32Min not supported on ARM32: the available
               lowering is not WASM NaN/±0-correct` — measured on cortex-m4f,
               self-contained and --relocatable.
        #1294  `synth compile --cortex-m --link` fails every time: synth passes its
               own ET_EXEC output to arm-none-eabi-ld, which refuses it ("cannot use
               executable file ... as input to a link"). README lists --link as
               Implemented. Fix the path or stop listing it; the artifact decides with
               evidence which one.
        #1286  CLAUDE.md quotes 531/805 (66 %), 113 (14 %), 13 (1.6 %) as live
               figures. They are marked SUPERSEDED by RQ-64-SCOPEGAP (#1085) in
               favour of docs/status/ACCEPTANCE_LADDER.md (a 243-module REACHABLE
               corpus, e.g. AArch64 49/243 = 20.2 %). NOTE THE DENOMINATOR CHANGE:
               the ladder and the 805 figures measure different corpora, so the
               correction cites the ladder rather than restating an "N-times
               overstated" ratio across denominators.
        #1287  docs/status/POC_ACHIEVEMENTS.md headlines "0.85x native code size
               (15% smaller)". The issue reports that figure came from an ESTIMATED
               baseline and measures 1.64x today; the re-measurement is re-derived
               before the doc is corrected (a measured number replaces an estimated
               one, never a remembered one).
        #1288  docs/spectre-policy.md — stale citations and missing backend rows;
               verified in lane.
        #1279  `cargo build -p synth-memory --no-default-features` fails (7 errors
               measured; the issue said six), and `--no-default-features` appears in
               no CI job.
    status: proposed
    release: v0.68
    tags:
      - claim-drift
      - docs
      - claim-verification
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: review
      issue: "#1285"
      done-when: "manual: each listed document states only what a command run on the release commit demonstrates, with the command recorded beside the correction; --cortex-m --link either links successfully under an execution check or is no longer listed as implemented; every replaced number is re-measured rather than restated, and where a denominator changed the correction says so; synth-memory builds without default features or the feature is removed, and a CI job builds that configuration"
      disposition: partial
      landed: >-
        PARTIAL — increments 1-4 of the lane (#1285, #1294, #1286, #1287); #1288
        and #1279 remain. Status stays `proposed` with `disposition: partial`.

        #1285 WAS WIDER THAN FILED. The issue named f32 min/max. Re-measured on
        the v0.68 base: `(f32.min x y)` and `(f32.max x y)` decline on cortex-m4f,
        cortex-m7 and cortex-m7dp, self-contained and `--relocatable` — 12 of 12
        combinations — while `f64.{min,max}` lower on cortex-m7dp. The README row
        also called f32 "Complete" with one residual listed, but
        `f32.{ceil,floor,trunc,nearest}` ALSO decline on cortex-m4f and
        cortex-m7dp (the feature matrix already said so; the README did not). So
        the README now lists all six declining f32 operations, and the matrix
        template stops listing min/max as lowering.

        THE MATRIX TEMPLATE's FACT CENSUS REFUSED THE FIRST DRAFT: it introduced
        the bare numbers "12 of 12" and the 0 in "±0", and every number in that
        template must be derived, pinned or declared. Reworded rather than
        exempted — the measured count lives in this record, not as an unpinned
        number in a generated document.

        #1294 — THE LINK PATH WAS NOT BROKEN; THE COMBINATION WAS. Measured on the
        v0.68 base with arm-none-eabi-gcc installed: `--relocatable --link` emits
        an ET_REL object and links it into an ET_EXEC firmware ELF;
        `--cortex-m --link` and `--target cortex-m4 --all-exports --link` both
        emit an ET_EXEC and hand it to the linker, which refuses an executable
        as input — "Linker failed", every time. So the done-when's second branch
        was taken: the self-contained combination is no longer listed as
        implemented. `link_firmware` now reads the artifact's own ELF header and
        refuses ET_EXEC with a diagnostic naming the working combination, BEFORE
        any toolchain lookup, so the refusal is identical with or without a
        cross toolchain and is tested in CI
        (crates/synth-cli/tests/link_refuses_linked_executable_1294.rs). The
        README row now reads "`--relocatable` output only" and still says the
        link itself is not CI-tested, because it is not.

        RED-FIRST: with the refusal block removed, both refusal tests fail — the
        diagnostic never names #1294. A third test is the negative control —
        `--relocatable --link` must never reach the refusal. THE FIRST RUN OF
        THE TESTS WAS FLAKY FOR A REASON IN THE TEST: both wrote the same output
        path from parallel threads of one process, so one compile truncated the
        ELF whose header the other was reading. Each test now owns its output.

        #1286 — REMOVED THE COPY RATHER THAN REFRESHING IT. Both CLAUDE.md sites
        reproduced as filed: the North Star's "reach" invariant and, worse, the
        compliance envelope's instruction to PUBLISH the v0.59 #1017 rates of
        the 805-module corpus, which RQ-64-SCOPEGAP had superseded in favour of
        the acceptance ladder over a different, 243-module reachable corpus.
        Restating the ladder's numbers in CLAUDE.md would only create a second
        copy to rot, and the done-when forbids restating a number without
        re-measuring it, so neither site carries a number now. Both cite
        `docs/status/ACCEPTANCE_LADDER.md` with its date, commit and corpus; the
        envelope adds "re-measure before publishing if the ladder predates the
        build being compared" (it is dated v0.63). The 805-corpus blocker counts
        in the reach invariant went too — a blocker count is not a reach estimate
        (the ladder's own finding), and the conclusion they supported stands
        without them. No cross-denominator ratio is stated anywhere.
        SYNTH-ACCEPTANCE-CITES-LADDER-1286 pins the citation and the ABSENCE of
        the old census's literals in CLAUDE.md. Red-first: re-appending the old
        sentence reds it (2 matches), and removing the citation reds it.

        #1287 — REPRODUCED WITH THE BENCHMARK'S OWN INSTRUMENT. On the v0.68 lane
        binary, `SYNTH=<lane>/debug/synth python3
        scripts/repro/parity_benchmark/run.py --only falcon_axis` measures synth
        AOT (cortex-m4f) at 72 B against arm-none-eabi-gcc 13.2.1 -Os at 44 B:
        1.64x LARGER, not 0.85x. (A first attempt read the symbol size with a
        hand-written pyelftools script and found no `.symtab` on the
        `--all-exports` image — abandoned for the instrument that generates
        artifacts/parity-benchmark.md, per the don't-hand-roll-a-parser rule.)
        The 0.85x was never measured: the page's "native" column was headed
        "Native Est". Following the PROJECT_STATUS.md precedent the page is
        replaced by a pointer to the generated benchmark instead of being
        re-synced, so the measured figure is stated here and in the generated
        report, not on a third surface. SYNTH-POC-SIZE-ESTIMATE-GONE-1287 pins
        the pointer and allows exactly one `0.85x` across the status docs,
        README and CLAUDE.md (the pointer's own sentence naming what it
        retired). Red-first: a second occurrence in README reds it.
