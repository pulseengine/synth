artifacts:
  - id: RQ-68-ONESOURCE
    type: system-req
    title: "Register-contract facts are declared many times across files — CALLEESAVE needed three copies changed, and graph_alloc silently assumes the ORDER of a const array in another crate"
    description: >
      VERIFIED ON 9e519fec: `liveness.rs` declares `const CALLEE_SAVED: [Reg; 5] =
      [R4..R8]` at least twice (lines 4922 and 5056); `liveness.rs:7754` hard-codes
      `ALLOCATABLE_POOL: usize = 9`, a magic number about `ALLOCATABLE_REGS: [Reg; 9]`
      in `instruction_selector.rs:146`; `optimizer_bridge.rs:6950` still says the
      optimized path "must not touch" R9/R10/R11/R12, which v0.67 established is the
      opposite of what it does (#1290). RQ-67-CALLEESAVE had to change three of the
      callee-saved copies to fix one defect (#1270, #1274).

      TWO DIFFERENT FAILURES, NOT ONE, and the fix for the first does not cover the
      second. A SET declared five times drifts when one copy is missed; a single
      source fixes that. But `graph_alloc.rs:99` `caller_saved_prefix` computes
      `take_while(R0..R3).count()` over the pool — it assumes the pool is ORDERED with
      R0-R3 first. Single-sourcing the set leaves that assumption exactly as silent
      (#1280). It needs its own guard: an asserted or typed ordering, with a test that
      reorders the pool and goes red.

      ALSO IN SCOPE, each verified present: `frame_size + 24` hard-codes the prologue
      size in the direct selector's incoming stack-param addressing, commented
      "24 = the fixed push {r4-r8,lr}" (#1273). v0.67 changed what the prologue saves.
      On the DIRECT selector R9-R11 are not allocated, so the push is expected to stay
      24 and the defect is expected to be LATENT — that expectation is VERIFIED FIRST
      by an execution differential with a stack parameter, not assumed. The #649
      globals-table guard is duplicated across the two self-contained image builders
      (`main.rs:7723` and `:9245`, #1283).

      THIS IS A PURE REFACTOR AND IS GATED AS ONE. North Star invariant 1 — derive
      what you check against from the artifact you ship — applied to the register
      contract. Byte-identity over the full corpus, or it does not land.
    status: implemented
    release: v0.68
    tags:
      - register-contract
      - single-source
      - refactor
      - north-star-1
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#1270"
      done-when: "manual: each register-contract set (callee-saved, allocatable pool, caller-saved/argument) is declared once and referenced, with no magic number standing in for another file's array length; caller_saved_prefix's ordering assumption is asserted or typed and a test that reorders the pool goes red; the prologue size used for stack-param addressing is derived from the prologue actually emitted, with #1273 first verified live or latent by an execution differential; the #649 guard exists once; stale must-not-touch comments are corrected; byte-identity holds over the full corpus"
      verified-by: >-
        Per item, the check that fails if it regresses. Byte identity: the lane
        byte-triage (207 corpus modules x 5 configs = 1035 compiles per binary)
        against a baseline binary built from the unmodified 7c514760 tree, run
        after EVERY code increment — 826 byte-identical, 209 identical failures,
        0 return-code / digest / skip-set changes each time. #1273: the stack-
        param addressing now reads reg_contract::DIRECT_PROLOGUE_BYTES, derived
        from the push list the selector emits; SYNTH-EMBEDDER-ABI-RELOCATABLE-1131
        pins both the declaration and the emitting call site, and the CI-wired
        stack_args_503 and i64_stack_param_503 differentials pass on the
        candidate. #1270/#1274/#1280: the sets are declared once in
        reg_contract.rs, composites derived by a const concat that fails to
        compile on a length mismatch; unit tests pin each set's members and
        order; SYNTH-ARCH-REGISTER-POOL now binds the pool's MEMBERS. #1280:
        `a_pool_with_an_argument_register_after_a_callee_saved_one_is_refused`
        FAILS with the ordering assertion backed out. #1283:
        `globals_table_guard_boundary_is_1024_words_1283` pins 1024 words
        accepted / 1025 refused with the unchanged message, and FAILS when the
        limit is planted as 4095. #1290: comments only, each claim checked in
        source. Workspace fmt/clippy/test, claim_check, status_evidence,
        version pins and oracle wiring green on the lane; rivet unchanged.
      landed: >-
        IMPLEMENTED on the lane branch, in seven commits (subjects name #1273,
        #1270, #1274, #1280, #1283, #1290, and #1270 again for the re-anchor).

        #1273 FIRST, AS A MEASUREMENT — LATENT, NOT LIVE. On the base (the
        NOPCLASS head), 133 corpus modules compiled on the direct path
        (--relocatable, cortex-m4): all 349 of 1492 functions that address
        `[sp, ...]` begin with exactly `push.w {r4, r5, r6, r7, r8, lr}`, the
        24 bytes the literal assumed (a capstone census over ELF-symtab
        function bodies). A unicorn-vs-wasmtime probe reusing the CI-wired
        stack-args harness, with stack params read inside a loop over a local
        frame, across if/else arms and a select, and beside i64 locals, matched
        on 9 of 9 vectors; stack_args_503 and i64_stack_param_503 pass. The
        static reason it is latent: ensure_callee_saved_prologue is a no-op
        when an LR-push already exists (always, on the direct path) and
        shrink_callee_saved_saves declines on any SP-relative access. Then the
        literal was replaced: DIRECT_PROLOGUE_PUSH / DIRECT_EPILOGUE_POP are
        derived from the callee-saved pool and DIRECT_PROLOGUE_BYTES from the
        push length, used by the emitter, the four epilogues and the addressing.
        The wide-VFP rung still refuses stack params (its 64-byte VPUSH is not
        in the derived size), and its comment now says exactly that.

        #1270 / #1274 / #1280 — THE SETS. A census over non-test source found
        more copies than the issues listed: callee-saved R4-R8 in eight places
        (including the direct prologue and the optimized path's
        alloc_i32_scratch CANDIDATES and SPILL_ON_EXHAUST_POOL, which must agree
        by their own comments), R4-R11 once, R9-R11 once; the allocatable pool
        three times across two crates plus the magic `ALLOCATABLE_POOL = 9`; the
        argument / call-clobbered family six times. All reference
        synth_synthesis::reg_contract now. Sets that are a DIFFERENT contract
        were left alone and are named so they are not mistaken for misses: the
        graph allocator's 16-register analysis universe and Thumb low-register
        set, liveness's entry seed and register universe, the optimized path's
        R4-R11-then-R3 temp pool, contracts.rs's Verus RESERVED_REGS (includes
        R12), and pools declared inside test modules.

        #1280 — THE ORDER, SEPARATELY. Single-sourcing the set does not protect
        caller_saved_prefix's assumption that R0-R3 come FIRST in the pool; it
        now asserts it, panicking on an argument register past the prefix
        instead of silently returning a shorter prefix the colourer reads as
        "no free caller-saved colours". Red-first as above.

        #1283 — the #649 guard is one function called by both self-contained
        builders, with the 4095-versus-4096 reconciliation written down: the
        last of n words sits at (n-1)*4. #1290 — both "must not touch
        R9/R10/R11/R12" comments rewritten after checking source: the optimized
        path hands out (R8,R9) and (R10,R11), base-CSE hoists into R11 and the
        spill reload loads R12.

        RATCHET: selector_lines_code 20224 -> 20201 (a fall, recorded as a
        value-bound waiver), selector_lines_total 31227 -> 31204.

        LEFT FOR THE RELEASE, STATED: the mutation-survey re-anchor found 3
        sites NOT FOUND because this lane deleted the literals they mutated
        (none is in the CI-replayed subset; the other 34 anchors are exact and
        the summary is byte-identical). Retiring them per the v0.66 precedent
        would re-derive the published survey numbers (sampled 37->34,
        byte-changing 21->19, killed 17->15, silent-changed 15->14), which is a
        decision about a published measurement, not a refactor's.

        DEVIATION: disk was full on the work volume, so the baseline binary was
        built from the clean base tree into the lane's own target dir and
        SNAPSHOTTED (sha256 recorded) before any candidate build, instead of a
        second worktree and target dir; every comparison was snapshot vs
        snapshot. The shared byte_triage.py raced on `flight_seam.wat` vs
        `flight_seam.wasm` (same output stem across threads); the lane used a
        copy keyed by the full file name.
