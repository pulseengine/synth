artifacts:
  - id: RQ-80-NPM
    type: system-req
    release: v0.80
    status: implemented
    title: "The npm package is TEN releases behind and no release check asserts npm publication at all"
    description: >
      FOUND WHILE VERIFYING v0.79.0's PUBLICATION. `@pulseengine/synth` on npm has
      `dist-tags.latest = 0.69.0`; versions 0.70.0 through 0.79.0 are ALL missing. The `Release
      NPM` workflow has failed on every one of its last ten runs (2026-09-22 to 2026-10-01),
      each time at the same step — `Preflight — verify npm auth`.

      THE PREFLIGHT IS NOT THE DEFECT; it is the only part working. It refuses before publishing
      rather than pushing an unauthenticated artifact, so nothing wrong was ever published. The
      defect is that a loud, repeated refusal went unacted on for ten consecutive releases.

      WHY IT STAYED INVISIBLE, which is the part this lane must fix: every release report in that
      period states that THREE release workflows succeeded — `Release`, `Publish to crates.io`,
      `Signing E2E` — and all three genuinely did. `Release NPM` is a FOURTH. Counting three
      successes is true while omitting a fourth that always fails. The exit condition also asks
      only "are the 12 crates in `scripts/publish.rs` live?", which is the cargo surface; npm has
      no equivalent assertion anywhere. So a shipped artifact went missing ten times behind an
      accurate-sounding sentence. Same shape as #924 and as the theme (#1461).

      The credential itself is NOT assumed to be the cause and is not this lane's to rotate —
      whoever holds it should check it; the step's own output names the auth check.

      REFUTING COMMAND: read `dist-tags.latest` from
      `https://registry.npmjs.org/@pulseengine/synth`. If it names a recent release, the gap
      closed without this lane.
    tags:
      - process
      - release-surface
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1460"
      verification-track: manual
      done-when: "contains:scripts/test_loop_conformance_check.py:Step8NpmLive"
      verified-by: >-
        DELIVERED — the assertion exists, it is RED against the real gap, and the gap itself is a
        credential owned outside this repo.
        WHAT LANDED: a `npm live` slot in `loop_conformance_check.py` step 8, deriving the package NAME
        and VERSION from the ref's own `npm/package.json` and requiring `registry.npmjs.org` to serve
        that exact version. Pretag reports NA-BY-MOMENT, because demanding publication before the tag
        would invent evidence; RETRO is where it bites.
        RED-FIRST WAS FREE, measured rather than planted: retro on v0.79.0 reports
        `npm live DERIVED-FAIL @pulseengine/synth@0.79.0 does NOT resolve on npm (HTTP 404)` directly
        beside `crates live DERIVED-PASS 12/12 crates resolve at 0.79.0`. That juxtaposition IS the
        finding — cargo shipped, npm did not, and only cargo was ever asked about.
        PLACED BEFORE THE CRATES BLOCK, deliberately and tested: that block returns early on an
        unreachable registry or an unparseable `CRATES_TO_PUBLISH`, so an npm check appended after it
        would go silent exactly when something else had already gone wrong.
        `Step8NpmLive` carries EIGHT assertions with the HTTP layer stubbed, because a
        network-dependent gate test is a gate that goes quiet when the network does: missing is red,
        present passes, UNREACHABLE is NOT_DERIVED rather than green, an UNBUMPED manifest is red even
        when its stale version IS live (that is precisely how it would otherwise look green), an absent
        or unparseable manifest is NOT_DERIVED, pretag is NA-BY-MOMENT, and npm is still recorded when
        the crates block bails. Proven potent by moving the block after the crates early return: SEVEN
        of the eight red, the eighth being the pretag path which never reaches that code.
        THE GAP IS NOT CLOSED AND IS NOT THIS REPO'S TO CLOSE. `Release NPM` fails at step 4,
        `Preflight — verify npm auth`, with steps 5-8 SKIPPED — so nothing wrong was ever published; the
        preflight is the part working. The log names the cause and the fix exactly: NPM_TOKEN is
        invalid, expired or the wrong type, and npm publish needs a classic Automation token. Rotating
        it is a credential action belonging to the repository owner, who has been asked. Whether it has been
        it. Until then this slot reds in retro, which is TRUE, and that is the whole point: ten releases
        went missing behind reports that accurately said three release workflows succeeded while a
        FOURTH always failed.
