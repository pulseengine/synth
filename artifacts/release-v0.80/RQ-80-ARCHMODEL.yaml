artifacts:
  - id: RQ-80-ARCHMODEL
    type: system-req
    release: v0.80
    status: proposed
    title: "Recurring N/A, eighteenth filing: feature-loop steps 1-2 (spar AADL -> WIT) skipped again, blocker still open"
    description: >
      EIGHTEENTH consecutive skip of feature-loop steps 1-2. THE ORDINAL IS DERIVED BY ARTIFACT
      IDENTITY, NOT BY TAG SET, and stated with the commit it is true at: there are 17 PRIOR
      filings, v0.63 through v0.79 inclusive with no gaps, so this is the EIGHTEENTH, and `ls
      artifacts/release-v*/RQ-*ARCHMODEL*.yaml | wc -l` returns 18 at any commit containing this
      file. Deriving it by tag set is wrong — v0.77's tag-keyed census returned 14 where the
      answer was 15, because v0.65's filing predates the five-tag vocabulary.

      BLOCKER: pulseengine/spar#445 — spar accepts property associations from UNDECLARED property
      sets silently (rc=0), so an invented property is indistinguishable from a satisfied one,
      which is disqualifying for generating WIT from AADL. Re-check its STATE before its body.

      THIS ARTIFACT MUST KEEP BOTH HALVES OF ITS TAG CONJUNCTION. The step 1-2 matcher needs
      `"feature-loop" in tags` AND `tags & {aadl, spar}` AND a non-empty `issue:`. It has gone
      INVISIBLE to the conformance gate three times (v0.65, v0.69, v0.75) because one half or the
      other was dropped, and the whole point of the filing is to keep a deferral VISIBLE.

      REFUTING COMMAND: `gh issue view 445 --repo pulseengine/spar --json state` and
      `python3 -c "import sys; sys.path.insert(0,'scripts'); import loop_conformance_check as L;
      c=L.Check('v0.80.0','pulseengine/synth');
      print(L.find_filed_steps12_decision(c.load_checkout_docs(),'v0.80'))"`.
      THE FORM FIRST PUBLISHED HERE DID NOT RUN, and the reason is worth stating because the obvious
      diagnosis is also wrong. It passed the STRING `'docs'` as the first argument, but the parameter is
      `docs: list[tuple[str, object]]` — a list of (path, parsed-doc) pairs, built by
      `Check.load_checkout_docs()`. Passing a string iterates its CHARACTERS and fails to unpack `'d'`
      into two values, so it raises `ValueError: not enough values to unpack (expected 2, got 1)`. That
      error reads like a tuple-return mistake and is not one: the function returns `dict | None`.
      Invoked correctly it returns RQ-80-ARCHMODEL with `stale=False`, so the CLAIM was always true and
      only the published command was broken. If spar#445 is closed, the deferral's ground is gone; if
      the matcher returns None, the tags are wrong.
    tags:
      - process
      - carried
      - spar
      - aadl
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1136"
      disposition: partial
      verification-track: manual
      done-when: "manual:2026-10-31 the eighteenth filing exists with BOTH the feature-loop tag and a spar/aadl tag so the step 1-2 matcher sees it, the ordinal is derived by artifact identity with the commit stated, and spar#445's STATE is re-checked and recorded"
      verified-by: >-
        PARTIAL. The deferral is FILED and re-verified; feature-loop steps 1-2 are skipped again.
        THE ORDINAL IS DERIVED BY ARTIFACT IDENTITY, not by tag set, and stated with where it is true:
        `ls artifacts/release-v*/RQ-*ARCHMODEL*.yaml | wc -l` returns 18 on this tree, v0.63 through
        v0.80 with no gaps, so this is the EIGHTEENTH consecutive filing. Deriving it by tag set is the
        v0.77 error, which returned 14 where the answer was 15 because v0.65's filing predates the
        five-tag vocabulary.
        THE MATCHER CAN SEE IT, checked rather than assumed, because this filing has gone invisible
        three times (v0.65, v0.69, v0.75) by losing one half of its tag conjunction:
        `find_filed_steps12_decision(docs, "v0.80")` returns RQ-80-ARCHMODEL with `stale=False`. Both
        halves are present — `feature-loop` AND `spar`/`aadl` — plus a non-empty `issue:`.
        THE BLOCKER IS RE-CHECKED, state before body: pulseengine/spar#445 is OPEN, last updated
        2026-09-03. spar accepts property associations from UNDECLARED property sets silently (rc=0), so
        an invented property is indistinguishable from a satisfied one, which is disqualifying for
        generating WIT from AADL.
        PARTIAL rather than delivered because the filing is the whole deliverable and the underlying
        steps remain undone for the eighteenth release. Saying so is the point of the recurring filing.
