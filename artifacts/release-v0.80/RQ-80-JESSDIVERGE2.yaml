artifacts:
  - id: RQ-80-JESSDIVERGE2
    type: system-req
    release: v0.80
    status: proposed
    title: "The mechanism has been wrong TWICE — not identity, not a lagged attitude: a SIGN error in the translational sub-vector"
    description: >
      CARRIED, and REWRITTEN A SECOND TIME at 2026-10-02 because the reporter refuted the mechanism
      this artifact asserted. THAT IS THE HEADLINE: this lane's named mechanism has been wrong TWICE
      — first "an identity rotation", then "a lagged or stale attitude read" — and both were caught
      by measurement rather than by review. It is the clearest case in the release for running a
      refuting command before building on an artifact, and the done-when below is written so a third
      wrong mechanism cannot be built on quietly.

      THE LAGGED ATTITUDE IS REFUTED, and the reporter retracted their own hypothesis on their own
      evidence. They built a QEMU TCG memory tracer (QEMU 11.1.1 accepts `--plugin` and ships none,
      so it had to be written) and found the persistent quaternion at wasm offset `0xac18` is
      BIT-IDENTICAL between ARM and wasmtime at ticks 1, 2, 3, 15 and 16. A stale or lagged attitude
      would show at that offset. It does not. The attitude STATE agrees across every tick boundary;
      only what is computed FROM it diverges.

      SO THE ORACLE SHAPE THIS ARTIFACT PREVIOUSLY REQUIRED IS WRONG and is withdrawn rather than
      left to be built. The previous done-when demanded a join sweep over "a value written this
      iteration and read after a call INSIDE A LOOP". The reporter states plainly that is not where
      this is, at least not for the quaternion. Building it would have spent the lane on the wrong
      instrument.

      THE SIGNATURE, which is what replaces the mechanism, from a whole-memory diff of both runtimes
      (the module is fused `--memory shared` and the image maps linmem at `0x20000000`, so the same
      offset means the same thing on both sides): SIX fields differ in the return area and ALL SIX
      disagree in SIGN — `pos-n/e/d` and `vel-n/e/d`, exactly the translational sub-vector. What
      AGREES is exactly the quaternion, the gyro passthrough and the innovation. Classified rather
      than counted: 744 MASKED (ARM still holds the harness's `0xdeadbeef` paint where wasmtime
      zero-inits; NEITHER wrote them, and counting them would be a vacuous positive), ZERO OMITTED
      STORES, 11 ULP-CLOSE and 217 DIVERGENT. Zero omitted stores is load-bearing: the lowering is
      not DROPPING writes, it computes different values. And the fit `vel-d(n)/(n*g*dt)` = 1.0000 to
      1.0003 over sixteen ticks, so ARM's `vel-d` is UNCOMPENSATED GRAVITY.

      THE LINK BASE IS DERIVED, and it is this lane's own contribution so far. The reporter supplied
      pc-level data and explicitly refused to guess the function mapping ("AFD-127 was exactly that
      mistake, an inferred field layout reported as computed"). `D = +0x2e4`, so
      `linked_addr = cascade.o .text offset + 0x2e4`. The first attempt — treating the pcs as
      `cascade.o` offsets directly — put them on non-instruction boundaries and on `movw r5, #0x0`
      as a "quaternion read", which is that same error one level over, so it was not reported.
      The derivation instead required all nine pcs to land on instructions whose KIND matches the
      role given (six loads, three stores): 285 offsets land on some instruction and the kind filter
      leaves exactly ONE.

      AND THE OPERANDS CONFIRM IT INDEPENDENTLY, which is stronger than the 1-in-285: the stream
      computes `movw r12, #0xac10` / `#0xac14` / `#0xac18` then `ldr.w r3, [r11, r12]`, and those
      literals ARE the reporter's traced offsets, including `0xac18`. Only access KINDS were fed into
      the search, never the addresses. All nine pcs fall inside `ekf@0.10.0#estimate`; the six reads
      are integer `ldr.w rX, [r11, rY]` through the linear-memory base, which independently
      corroborates this release's structural pass (zero f32 instructions in that function touch
      `r11`). Incidentally `0xac10` is compared against 0 then written `0xFFFFFFFF` and `0xac14` is
      compared against 1, while only `0xac18` crosses into a float register — tag/flag words ahead of
      a payload, consistent with the reporter's layout rather than inferred onto it.

      WHERE IT IS NOT: the state. WHERE TO LOOK: the translational computation. The 208-word run
      `0x2000ac9c`-`0x2000afd8` is read by pcs `0x2250`/`0x2274`/`0x2298`, which map to
      `.text+0x1f6c`/`+0x1f90`/`+0x1fb4`. Given the gravity fit, the question is where gravity is
      subtracted — or is not.

      WHAT REMAINS SETTLED, so it is not re-derived: the RETURN-ABI class (#1450) stays ELIMINATED and
      the reporter independently agrees with the reasoning. The VFP frame-slot class is eliminated at
      byte granularity (132 bytes written, 132 read, matched sets, zero double-width accesses).
      Caller-saved S-register clobber is NOT SUPPORTED but NOT eliminated, because that analyser's
      POSITIVE CONTROL CAME BACK EMPTY — and the reporter's zero-omitted-stores result is independent
      of it either way. The v0.79 home-alias elimination still rests on an in-session sweep nothing in
      the tree reproduces.

      TWO LIMITS THE REPORTER STATED ABOUT THEIR OWN INSTRUMENT, carried rather than queried: value
      identity only works for DISTINCTIVE values, and 15,193 of 15,295 stored values go to <= 8
      addresses, so the tracer CANNOT see a stale copy of the TICK-1 quaternion, which is the identity
      (1,0,0,0) — ticks 2 onward are covered and "no stale copy" is a claim about those. And their
      first predicate returned 54,251 events over 1,662 address pairs including symmetric ones,
      reported as "the predicate is not specific" rather than as 1,662 defects.

      VERSION, settled and no longer worth re-checking: 0.79.0 lowers this module BYTE-IDENTICALLY to
      0.77.0 across every artifact, controlled by showing the two compilers genuinely differ
      (`4b29826f` vs `3913abee`, self-reporting 0.77.0 and 0.79.0). Scoped to this module with these
      flags.

      RULE 4 BINDS AND IS NOT SOFTENED BY ANY OF THE ABOVE: committing an oracle is NOT progress on
      #1436. Only naming the defect is. The link base is useful to the reporter and still is not
      progress on their build.

      REFUTING COMMAND — and this artifact is the reason the rule exists, so run all three parts.
      READ THE THREAD'S NEWEST COMMENT FIRST: this description has been overtaken twice, and both
      times the new evidence arrived between ticks. Then `gh api
      repos/pulseengine/jess/contents/repro/synth-1436` must still list the two modules. Then
      `grep -rl 1436 scripts/repro/ crates/*/tests/`; if that is non-empty an oracle already landed and
      this lane starts from the disassembly instead.
    tags:
      - correctness
      - reach
      - external-report
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1436"
      disposition: partial
      landed: "PR #1464 — the withdrawal of the refuted lagged-attitude mechanism (and with it the loop-shaped oracle the previous done-when required), plus the derived link base D=+0x2e4 which makes the reporter's pc dataset usable. The earlier #1463 batch carried no #1436 work. The defect is NOT named, so this is an increment and not the lane."
      verification-track: manual
      done-when: "manual:2026-10-31 the instruction or pass that computes the translational sub-vector with the wrong SIGN is NAMED, by reading .text+0x1f6c onward (link base D=+0x2e4) against the reporter's traced values for the 208-word run, or the lane states plainly that it did not reach the cause AND says what it tried; the previously-required loop-shaped join sweep is WITHDRAWN as refuted and must NOT be built to satisfy this; any oracle that does land must discriminate a SIGN error in the translational computation, red-first, and the v0.79 home-alias elimination is either re-established on evidence in the tree or WITHDRAWN"
      verified-by: >-
        PARTIAL, and the part delivered is a WITHDRAWAL plus one measurement — not the lane.
        WITHDRAWN: the lagged-attitude mechanism, refuted by the reporter on their own tracer evidence
        (the persistent quaternion at wasm offset 0xac18 is bit-identical between ARM and wasmtime at
        ticks 1, 2, 3, 15 and 16), and with it the previously-required loop-shaped join sweep, which the
        done-when now forbids as a way to satisfy this artifact. A second wrong mechanism removed from
        the plan is worth more than a third built on.
        DELIVERED: the link base `D = +0x2e4`, so `linked_addr = cascade.o .text offset + 0x2e4`, which
        makes the reporter's whole pc dataset usable. They supplied pcs and explicitly refused to guess
        the mapping. Derived by requiring all nine pcs to land on instructions whose KIND matches their
        stated role — 285 offsets land on some instruction, the kind filter leaves exactly ONE — and then
        CONFIRMED independently by the operands, which compute `movw r12, #0xac10`/`#0xac14`/`#0xac18`
        before `ldr.w r3, [r11, r12]`: those literals ARE the traced offsets, and only access KINDS were
        fed into the search. Posted to the thread.
        NOT DELIVERED: the defect is NOT NAMED. Rule 4 binds — the link base is useful to the reporter
        and is still not progress on their build. The translational computation is where to look next:
        the 208-word run 0xac9c-0xafd8, read by pcs 0x2250/0x2274/0x2298 -> .text+0x1f6c/+0x1f90/+0x1fb4,
        with ARM's vel-d fitting UNCOMPENSATED gravity at 1.0000-1.0003 over sixteen ticks.
