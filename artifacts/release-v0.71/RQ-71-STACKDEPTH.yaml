artifacts:
  - id: RQ-71-STACKDEPTH
    type: system-req
    title: "A --relocatable object says how much LINEAR MEMORY to reserve and nothing about native stack — guess low and the failure is silent memory corruption with a bit-exact correct result"
    description: >
      cpetig, #1341, 2026-09-19, on PX4/NuttX 12.12.0 (px4_fmu-v6xrt, i.MX RT1170,
      cortex-m7). The export returned the CORRECT ANSWER EVERY TIME — bit-identical
      to the same component under wasmtime — and then the system crashed somewhere
      unrelated, differently on each run, with a float-looking bit pattern written
      over an RTOS pointer. This is the silent-wrongness class synth exists to
      refuse, arriving through the one channel synth does not police.

      [REPORTER-ONLY] Bracketed on their module, only `STACK_MAIN` varying:
      1984 B faults, 4032 B clean, 16320 B clean. Guard bands of 32768 B below and
      4096 B above linear memory were UNTOUCHED and the register contract was intact
      at fault time, so the export did not write outside the memory it was given —
      it overran its own task stack.

      WHY THE EMBEDDER CANNOT DERIVE IT TODAY. Summing every frame allocation in the
      object gives 1456 bytes across 18 frames, largest single frame 232 — which
      suggests 1984 is ample, and it is not. Without the call graph the sum is both
      the wrong quantity AND an underestimate.

      THE REPORTER'S PROPOSED MECHANISM IS UNSOUND AS STATED, AND THAT IS THE
      FINDING THAT SHAPES THIS LANE. They wrote: "If `--emit-wcet` already walks the
      call graph, the same traversal would yield the depth." The TRAVERSAL is right
      — `wcet_compose.rs` is a memoized DFS over the direct call graph with exactly
      the honest declines this needs (recursion, any cycle, `call_indirect`,
      external calls, a declined callee propagating UP). The ARITHMETIC IS NOT.
      It composes `total = own + Σ_site multiplier × callee_total`, where
      `multiplier` is the call site's PROVEN EXECUTION COUNT, so a callee invoked
      inside a proven 1000-trip loop is counted 1000×. That is correct for cycles
      and catastrophically wrong for stack: a callee invoked 1000 times
      SEQUENTIALLY costs 1000× the cycles and ONE× the stack. Stack depth is a MAX
      over the call tree, not a trip-weighted sum.

      Over-reporting is NOT the safe direction it looks like. An embedder told to
      reserve 2 MB for a 2.3 KB requirement stops believing the number, and a
      number nobody believes is worse than no number, because it displaces the
      investigation that would have found the real one.

      MEASURED, not assumed: `grep -rn 'frame_size' crates/synth-backend/src/wcet_*.rs`
      returns NOTHING. The composer carries `own_cycles`, not frame sizes, so the
      intermediate needs `frame_size` threaded onto it. This is a SIBLING pass
      sharing the DFS and the decline residuals, not a field added to an existing
      one.

      ALSO MEASURED, and it narrows the ask: synth already has the vocabulary.
      `crates/synth-cli/src/shadow_budget.rs` defines
      `StackDepthBound::{Bytes, Unbounded, Unknown}` and
      `BudgetSource::ProvenStackDepth`, and `main.rs` adapts scry's `StackBound`
      into it. But that bound is scry's analysis of the WASM module funding the
      SHADOW-STACK budget on the self-contained path — a different stack on a
      different path. The TYPE and its trichotomy are the right shape and should be
      reused rather than reinvented; the number is new.

      AND THE DOCUMENTATION ASK IS ALREADY HALF-MET. #1341's item 3 asks for a line
      in `docs/embedder-abi-relocatable-arm.md` under "Region requirements". That
      section exists and already says, under **Stack**: "plain AAPCS — the embedder
      owns placement and size; `--stack-layout` is refused with `--relocatable`
      precisely because the linker/harness owns the layout". The gap is not that
      the words are missing; it is that no NUMBER is offered and the words are not
      reachable from the compile output. Deliver items 1/2, not 3.

      WHAT WOULD MAKE THIS WRONG TO BUILD: if a reachable `call_indirect` makes the
      module unboundable, the answer is a LOUD DECLINE naming why — never a number
      that is silently a lower bound, which would reproduce the exact defect being
      reported. cpetig's module reports `call_indirect` count 0, so it is boundable;
      the deliverable must still decline honestly for the ones that are not.

      THE MACHINE'S HALF OF THIS IS `file:scripts/repro/stack_depth_1341.py`. The full obligation is:
      synth reports a per-export maximum native stack depth for a --relocatable object, derived as a MAX over the call tree (never trip-weighted), reusing StackDepthBound's Bytes|Unbounded|Unknown trichotomy; PROVEN against an executed oracle that measures actual peak SP on a bounded fixture and shows the reported bound is >= it and within a stated factor; and a module with a reachable call_indirect LOUD-DECLINES with the reason named rather than emitting a lower bound
      The predicate cannot express all of that — it checks that the artefact
      EXISTS, not that it is right. It is still worth having: v0.70 measured
      that four releases running declared 100% `manual:` done-when, which R3
      can never fire on, and printed that as though it were evaluation.


      DELIVERED. `--emit-stack-depth` writes a `synth-stack-v1` sidecar
      (`<output>.stack.json`) with a per-export maximum native stack depth, or a
      NAMED decline. The composition is `own + MAX over the call tree`; each
      function's own cost is read off the EMITTED STREAM by a walker that tracks
      the running SP delta and takes the maximum over every instruction
      boundary, so a transient push inside an encoder expansion counts without
      enumerating which ops those are.

      THE THREE WAYS TO COUNT, MEASURED IN-REPO on the committed
      `stack_depth_branch_1341.wat` (four functions; `top` calls `a` and `b`,
      both call `leaf`):

        leaf   push { r4, lr }        =  8   sub sp ABSENT   frame   8
        a      push.w { r4-r8, lr }   = 24   sub sp #0x20    frame  56
        b      push.w { r4-r8, lr }   = 24   sub sp #0x20    frame  56
        top    push.w { r4-r8, lr }   = 24   sub sp #0x20    frame  56

        (a) the reporter's sum of `sub sp` only :  96 B  UNDER by 24 (20%)
        (b) a naive sum of every frame          : 176 B  OVER  by 56 (46%)
        (c) TRUTH: max over root-to-leaf paths  : 120 B

      (a) is the DANGEROUS direction and misses THREE things, each measured
      rather than argued. The prologue moves SP in up to three separate steps —
      `push.w {r4-r8,lr}` (24 B, always), `vpush {d8-d15}` (64 B, conditional),
      and `sub sp` — and `sub sp` IS EMITTED ONLY WHEN `frame_size > 0`, so
      `leaf` consumes 8 bytes while being invisible to that grep. And the
      immediate is printed in HEX: `#0x20` is 32, which a `#[0-9]+` regex reads
      as `0`. That last one is not hypothetical — the first measuring command
      written FOR THIS ARTIFACT had exactly that bug and reported "sum: 0".

      THE FIGURE DEPENDS ON THE LINK MODE, AND THAT IS LEGITIMATE. The oracle's
      first version asserted `--relocatable` and self-contained builds report the
      same number. They do not: 8/64/64/120 against 16/72/72/128 on the same
      fixture. `--relocatable` forces the DIRECT selector (#197); the optimized
      path's LEAF prologue costs 8 more bytes. So the number is a property
      of THE BUILD YOU SHIP and an embedder must read it from their own object —
      the oracle now asserts the two paths agree on WHICH functions are
      boundable, and lets the figures differ.

      CORRECTED BY THE v0.71 COLD REVIEW. This said "8 more bytes PER FRAME",
      which is false and causally wrong. Re-measured from the two sidecars on one
      tree: 8/64/120 against 16/72/128. The delta is a CONSTANT +8 arising in the
      zero-frame LEAF (`func_0`: 8 -> 16) and propagating once up the chain. Were
      it per-frame, `top` — whose chain carries three frames — would differ by
      more than 8; it differs by exactly 8. The non-leaf own-frames are 56 in
      BOTH modes (`push.w {r4-r8,lr}` + `sub.w sp,sp,#0x20`, identical). The
      CONCLUSION the sentence supported is unaffected and still holds: the number
      is a property of the build you ship.

      THE DECLINE SET IS NOT THE WCET ONE, and reusing it would have been a
      silent mistake. `WcetDecline` carries `Loop`, `LoopedExpansion`,
      `UnmodeledOp` and `UnresolvedBranch`; none affects stack depth, because a
      loop body reuses one frame every trip. A data-dependent loop is
      WCET-unbounded and perfectly stack-bounded — riding on the WCET decline
      would have refused a bound for most real modules, the reporter's control
      loop included. So this is a sibling pass sharing only the DFS shape.

      EVIDENCE — the oracle, which found two of its own author's errors:
        - `scripts/repro/stack_depth_1341.py`, CI-wired, 6 emulations. RED-FIRST
          against the pre-feature binary (`rc=1`, "unexpected argument
          `--emit-stack-depth`").
        - Both bounded fixtures report 128 B against a measured peak of 128 B —
          slack ZERO. The bound is not merely sound here, it is exact.
        - `call_indirect` DECLINES with that reason named. It reaches the stream
          as `ldr rN,[pc,#..]` + `blx rN`, not as a `CallIndirect` pseudo-op, so
          the catch-all was declining it as `unknown-sp-move` — safe, and wrong:
          it tells an embedder the walker got confused rather than that their
          call graph is unresolvable. The oracle demanded the accurate reason.
        - The oracle also wrongly required that NOTHING in an unboundable module
          be bounded. The leaves of the `call_indirect` fixture are perfectly
          boundable; only the EXPORT matters. Both corrections are recorded in
          the script rather than quietly applied.
        - 7 `synth-backend` unit tests, including
          `composition_takes_the_max_over_branches_not_the_sum`, which is the one
          that would catch a regression to the WCET composer's arithmetic.

      NOT CLAIMED, and #1341 ASKED FOR TWO THINGS — this ships ONE of them.
      The reporter's list was: (1) report the depth at compile time, (2) record
      it IN THE OBJECT so a build step can assert the embedder's region against
      it rather than a human copying a number, (3) document it.

        (1) DONE — the `synth-stack-v1` sidecar and a compile-time line.
        (2) NOT DONE. There is no ELF note section carrying the figure, so a
            build step must read the sidecar beside the object rather than the
            object itself. That is weaker than asked: a sidecar can be lost,
            stale, or not copied alongside the `.o`. Recorded as the follow-up
            it is, not folded into the delivery.
        (3) ALREADY HALF-MET BEFORE THIS WORK and unchanged:
            `docs/embedder-abi-relocatable-arm.md` "Region requirements" already
            said under **Stack** that the embedder owns placement and size. What
            was missing was a NUMBER, which (1) now supplies.

      The reporter's own module is an issue attachment and is not in this
      repository, so their 1984/4032 B bracketing stays [REPORTER-ONLY]; this
      release does not restate it as re-derived. What IS re-derivable is the
      committed fixture set and the executed oracle.
    status: implemented
    release: v0.71
    tags:
