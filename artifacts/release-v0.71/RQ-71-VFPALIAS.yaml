artifacts:
  - id: RQ-71-VFPALIAS
    type: system-req
    title: "check_vfp_slot_aliasing carries the single-value-per-slot model over the VFP word file — the sibling of v0.70's headline, and NOT known to be clean"
    description: >
      v0.70 fixed `VCR-RA-003` policing a wasm LOCAL'S frame home with a rule that
      only holds for allocator SPILL SLOTS. `check_vfp_slot_aliasing` (#881) carries
      the same premise over the VFP word file, and under the #1069 rung VFP locals
      also get PERMANENT frame homes — the same shape, one tier over. v0.70 left it
      untouched and said so: its traffic is `VStr`/`VLdr`, which the integer check
      never matches.

      THE REFUTING COMMAND WAS RUN, AND IT NARROWED THE CLAIM RATHER THAN
      CONFIRMING IT. Reading `check_vfp_slot_aliasing`: unlike the integer check it
      tracks a VALUE IDENTITY per half — `src_word` plus a `src_version` bumped on
      every def — and treats a provably-identical re-store as benign:

          Some(prev) if !prev.owner_reloaded => {
              if prev.src_word == src_word && prev.src_version == v {
                  prev.shadowed          // same value re-stored: benign
              } else {
                  Some((prev.owner_store, i))
              }
          }

      So the VFP twin ALREADY defends the case the integer check could not: a
      redundant REFRESH of one value. It does NOT defend the #1321 case — a local
      home holding two DIFFERENT values over its lifetime, where `src_version`
      legitimately differs and the store is a `local.set`, not an aliased spill.

      THE LANE IS THEREFORE REAL BUT SMALLER AND SHARPER than "the same class one
      tier over", which is what it would have been scoped as without running the
      command. The only open question is whether a frame-homed VFP local under the
      #1069 rung produces two differently-versioned stores to one half with no
      intervening reload — and if it does, whether the fix is the same SCOPE
      narrowing v0.70 applied (police allocator areas, not local homes) or whether
      the version tracking already makes the narrowing unnecessary.

      START BY TRYING TO BUILD THE RED. If a fixture cannot be constructed that
      makes `check_vfp_slot_aliasing` report `VfpSlotAliased` on a legal
      two-value local home, the class does not exist there and this artifact
      publishes that as a REFUTATION — which is a result, not a failure. v0.70's
      own headline began as a fix that was thrown away; a lane that ends in "we
      looked and it was clean" is cheaper than the same question asked again in
      v0.72.

      THE MACHINE'S HALF OF THIS IS `file:scripts/repro/vfp_alias_881.wat`. The full obligation is:
      a fixture is built that makes check_vfp_slot_aliasing report VfpSlotAliased on a LEGAL two-value VFP local home and the check is narrowed the way VCR-RA-003 was — or the attempt is published as a REFUTATION naming the src_version mechanism that makes the class unreachable, with the fixture that failed to trip it committed either way
      The predicate cannot express all of that — it checks that the artefact
      EXISTS, not that it is right. It is still worth having: v0.70 measured
      that four releases running declared 100% `manual:` done-when, which R3
      can never fire on, and printed that as though it were evaluation.

    status: proposed
    release: v0.71
    tags:
      - vcr
      - checker-model
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      verification-track: differential
      issue: "#881"
      done-when: "file:scripts/repro/vfp_alias_881.wat"
