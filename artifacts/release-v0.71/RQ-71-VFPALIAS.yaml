artifacts:
  - id: RQ-71-VFPALIAS
    type: system-req
    title: "The #881 VFP twin refused a LEGAL wasm program: a frame-homed float local, redefined — the same class as v0.70's headline, and the red WAS buildable"
    description: >
      v0.70 fixed `VCR-RA-003` policing a wasm LOCAL'S frame home with a rule that
      only holds for allocator SPILL SLOTS (#1321, cpetig's `falcon-cascade#step`:
      slot 184 = local 31, 78 writes / 76 reads, refused with no object emitted).
      `check_vfp_slot_aliasing` (#881) carries the same premise over the VFP word
      file, and under the #1069 rung VFP locals also get PERMANENT frame homes.
      v0.70 left it untouched and said so.

      THE PLAN SAID: START BY TRYING TO BUILD THE RED, and publish a REFUTATION if
      it could not be built. IT COULD BE BUILT. The plan's own reading was right
      about the narrow point — the VFP twin tracks a value identity per half
      (`src_word` plus a `src_version` bumped on every def) and so already excuses
      a redundant REFRESH that the integer check could not — and right that this
      says nothing about the #1321 case. It is that second case that is real.

      WHAT WAS MEASURED. Under the #1069 rung `local.set` IS a frame-homed local's
      def and stores straight to its permanent `[sp,#slot]`
      (`instruction_selector.rs`, the `f32_frame`/`f64_frame` arms — "the def IS
      the store"). A legal wasm REDEFINITION therefore writes that home a second
      time with a DIFFERENT value; `src_version` cannot excuse it, and the compile
      was REFUSED:

          VCR-RA-003: register-allocation validation FAILED —
          VfpSpillSlotAliased { slot: 224, first_store: 80,
                                overwriting_store: 83, stale_reload: 122 }
          ... this is a compiler bug, not a program error.

      Three legs per width, one variable — whether the second store carries a new
      value. `redef_none` compiled, `redef_diff` was REFUSED, `redef_same` compiled
      (the `src_version` path, working as designed, which is what proves the red is
      about REDEFINITION and not about re-storing). Refused from 14 homed f32
      locals and from 8 homed f64 — the exact pressure the #1069 rung exists to
      serve, jess's measured `attitude#tick` / `ekf#estimate` wall.

      NOT a miscompile: the failure is a LOUD refusal, no object emitted. It is a
      REACH defect — ordinary wasm that synth declines to compile — and it sat
      behind the rung that was added to accept exactly this pressure.

      THE FIX IS THE SAME IDEA AS v0.70'S AND NOT THE SAME MECHANISM, because the
      mechanism does not transfer. v0.70 scoped the integer check to allocator
      spill AREAS. A range cannot carry the VFP twin: `alloc_vfp_local_frame_slot`
      draws a home from the SAME pool as the operand-stack spills
      (`SpillState::alloc`), so homes and spill slots interleave and are
      range-indistinguishable. The selector therefore ENUMERATES the home halves it
      granted (`vfp_frame_home_halves`, one entry per f32 home and two per f64),
      and the check skips exactly those. Excluding them loses no #331 coverage: a
      home is allocated once and NEVER freed, so the allocator can never hand that
      offset out as a spill slot later — there is no spill there to alias.

      WHY A NARROWING NEEDS MORE EVIDENCE THAN A FIX. It converts a LOUD refusal
      into silence, so "it compiles now" is a fact about the validator, not about
      the emitted code, which had never executed. Four things were required and
      produced: (1) EXECUTION — 84 emulations bit-identical to wasmtime under
      unicorn on `-t cortex-m7dp --relocatable`; (2) a POTENCY GATE inside that
      oracle — `redef_none` is `redef_diff` minus the redefinition, so a STALE home
      read would make the two agree, and the gate asserts they do not (it rejected
      the first input list, where a 24-term product underflowed to 0.0 and made the
      comparison vacuous); (3) POTENCY UNIT PINS on the narrowing itself — one
      aliasing stream under four scopings, proving it is exactly as wide as the set
      it is handed, that `Some(&[])` does NOT silence, and that declaring only an
      f64 home's base half leaves its hi half policed; (4) BYTE IDENTITY — the
      negative control emits the same 692 bytes, sha256 `d961faa6…`, before and
      after, because the narrowing only inspects.

      FILED AS #1354, because #881 / #1069 / #1321 are all closed and a reach
      defect that refuses legal wasm needs a record an outsider can check — the
      same role #1321 played for the integer twin. `issue:` NAMES #1354 AND NOT
      THE LANE'S PLAN NUMBER #881, deliberately: RQ-71-ISSUESCOPE's closure gate
      derives the release's authorised close-set from `fields.issue`, and #881
      is already closed, so leaving it there would authorise a no-op while
      leaving the issue this release actually fixes unauthorised — the gate
      would then red on the tag for closing #1354. Found by running that gate's
      own census against a simulation of the merged tree before cutting.

      COST, RECORDED: the selector ratchet rose 19538 -> 19604 (+66 = 47 comment +
      17 code + 2 blank, re-derived per file), waived in the same PR. No lowering
      decision was added; the lines record a fact the selector already knew so the
      validator can stop being wrong about it.

    status: implemented
    release: v0.71
    tags:
