artifacts:
  - id: RQ-71-ISLANDS
    type: system-req
    title: "synth emits exactly ONE literal pool per function, appended at the end — so any LdrSym more than 4 KB from the end is unreachable by construction and a large function cannot compile"
    description: >
      cpetig, 2026-09-19, on #1331. They CONFIRMED v0.70's f32 static-data fix on
      their own module ("the f32 static-data declines are gone ... the GI-FPU-002
      phase 1b messages from the original report are gone") and named the next wall
      themselves: `LdrSym literal pool out of range (#345)` in a single
      50722-byte function.

      THE LANE AS FIRST FILED WAS MISNAMED, AND THE REFUTING COMMAND IS WHAT FOUND
      THAT. The candidate said "reproduce #345 and see whether the real cause is a
      missing pool FLUSH rather than a range limit". It is the flush.
      `arm_backend.rs:1727` refuses on `imm12 > 0xFFF`, and that refusal is
      CORRECT: Thumb-2 `LDR (literal)` genuinely has a 12-bit unsigned offset, and
      failing cleanly beats miscompiling. There is no bug at the check.

      What broke is the assumption in the comment beside it — "these function
      bodies are far smaller" — combined with `arm_backend.rs:1619`'s placement:
      "the literal pool is appended at the end". One pool per function, at the end,
      means every `LdrSym` further than 4 KB from that end is out of range by
      construction. At 50722 bytes, most of the function is.

      So the deliverable is CONSTANT ISLANDS: intermediate literal pools emitted at
      under-4 KB intervals and branched over, the mechanism LLVM's
      `ARMConstantIslandPass` and GCC's pool handling have both settled on. Choosing
      a well-trodden mechanism matters here specifically because this is on the
      emitted-bytes path.

      NOT CLAIMED, and this is the honest limit of what #1331 can promise: cpetig's
      module is an issue attachment and is NOT in this repository, so their 50722-byte
      function cannot gate anything here. A synthetic fixture that crosses 4 KB
      between an `LdrSym` and the function end is what makes this lane re-derivable
      in-repo at all — RQ-70-FALCONCORPUS's lesson applied BEFORE the fact instead
      of after it. Build the fixture first and confirm it refuses with this exact
      message; if some other mechanism already splits large functions, the lane dies
      before it is written.

      ALSO RECORDED SO THE RANKING IS NOT RE-DERIVED: `--native-pointer-abi` is a
      PREFERENCE blocker for this reporter, not a hard one. Their working route
      today is `--embedder-data-init --embedder-global-init`, which gives rc=0 with
      0 of 21 skipped and a 68374-byte object. v0.70 asked whether the ABI was
      load-bearing and shipped without an answer; the answer arrived by
      demonstration. That is why this is the SECOND must and not the first.

      THE GATING OBLIGATION IS THE EXPENSIVE PART, and it is not negotiable. An
      island is INSERTED CODE on the shipped path. A pool branched over incorrectly
      is a branch into data — the loudest possible miscompile, and precisely the
      class VCR exists to prevent. This needs BOTH a byte-identity differential over
      the corpus for functions that need no island (they must be bit-identical, not
      merely still-correct) AND an execution differential for functions that do.
      Anyone scoping this as a one-line placement change has not read this
      paragraph.

      THE MACHINE'S HALF OF THIS IS `file:scripts/repro/litpool_islands_345.wat`. The full obligation is:
      a committed .wat fixture whose LdrSym sits more than 4 KB from its function end compiles rc=0 where it previously refused with `LdrSym literal pool out of range (#345)`, PROVEN red-first on the pre-fix binary; the corpus is byte-identical for every function that needs no island; and an execution differential covers at least one function that does, so a branch into an island is caught by execution and not by inspection
      The predicate cannot express all of that — it checks that the artefact
      EXISTS, not that it is right. It is still worth having: v0.70 measured
      that four releases running declared 100% `manual:` done-when, which R3
      can never fire on, and printed that as though it were evaluation.


      DEFERRED, WITH THE BLOCKER MEASURED RATHER THAN GUESSED. v0.71 did NOT
      ship constant islands. What it shipped is the class, made reproducible
      in-repo, plus the measurement of why the fix is larger than the plan
      assumed.

      REPRODUCED IN-REPO. `scripts/repro/litpool_islands_345.wat` (609 lines,
      generated dense i64 filler) triggers cpetig's exact error on the exact
      route they use:

        LdrSym literal pool out of range (#345): imm12=5716 > 4095
          for symbol __synth_wasm_data
        (--target cortex-m7 --relocatable --all-exports --native-pointer-abi)

      Their 50722-byte function is an issue attachment and is not in this
      repository, so without this fixture the class would be unreproducible
      here — the RQ-70-FALCONCORPUS criticism of v0.69, applied BEFORE the fact
      instead of after it. The margin is ~40% over the 4095 threshold so
      ordinary codegen drift cannot quietly turn it green.

      WHY THE FIX IS NOT A PLACEMENT CHANGE, measured on this tree:

        - Branch displacements are PRE-COMPUTED UPSTREAM of the encoder, in
          final machine terms. `arm_encoder.rs` says so itself: "offset is
          already the halfword displacement: (target - branch - 4) / 2". Two
          `ArmOp` variants carry them (`BOffset`, `BCondOffset`).
        - There is NO post-encode branch relaxation or fixup pass.
          `grep -nE 'fn [a-z_]*(relax|fixup|patch)'` over `arm_backend.rs` and
          `arm_encoder.rs` finds only literal-pool patching.

      So inserting an island mid-function silently corrupts EVERY branch that
      spans the insertion point, with nothing to repair it. That is worse than
      the "branch into data" hazard this artifact anticipated: it is a branch to
      the WRONG PLACE, silently — the miscompile class VCR exists to prevent.
      The real blocker is a missing branch-relaxation pass over the byte stream,
      which is its own substantial lane on the highest-risk path.

      ONE ALTERNATIVE WAS CHECKED AND IS ALSO INSUFFICIENT. A pool at the
      function START, branched over once, needs NO fixup pass: inserting N bytes
      at offset 0 shifts every body instruction uniformly, so each intra-body
      relative displacement is preserved exactly. But it requires the U=0
      (backward) LDR-literal form, of which synth emits ZERO today, and
      start-pool plus end-pool still only serve accesses within 4 KB of either
      END. A 50722-byte function with accesses throughout genuinely needs N
      islands, which needs the pass.

      WHAT THIS RELEASE DOES INSTEAD, and it is not nothing: the refusal is now
      PINNED by `scripts/repro/litpool_islands_345.py` (CI-wired, with a potency
      control proving the same shape COMPILES with a short body, so the pin is
      the 4 KB range and not an unbuildable fixture). `imm12 > 0xFFF` is the one
      `if` standing between an out-of-range pool word and a load from a wrong
      address; if it is ever loosened, that script goes red. And WHEN ISLANDS
      LAND THE SCRIPT FAILS BY DESIGN, forcing whoever lands them to update this
      artifact rather than leave a stale pin describing a defect that is gone.

      NOT A BLOCKER FOR THE REPORTER, which is why deferring is defensible:
      cpetig ships today via `--embedder-data-init --embedder-global-init`
      (rc=0, 21 functions, 0 skipped, 68374 B). `--native-pointer-abi` is a
      PREFERENCE route for them, established by demonstration in v0.70.
    status: proposed
    release: v0.71
    tags:
      - downstream-blocker
      - external-reporter
      - emitted-bytes
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      verification-track: differential
      issue: "#345"
      disposition: deferred
      # R4: a delivery-shaped commit landed for this artifact, so the
      # increment is RECORDED rather than the status flipped. What landed
      # is the reproduction and the decline pin, NOT constant islands —
      # `disposition: deferred` beside it is the honest pair, and R11
      # accepts `landed:` next to a non-claiming status precisely when a
      # disposition says why it is not claiming.
      landed: "PR #1352. NOT LANDED as a fix. What landed: scripts/repro/litpool_islands_345.wat (reproduces #345 in-repo at imm12=5716 > 4095 on --relocatable --native-pointer-abi) and scripts/repro/litpool_islands_345.py (CI-wired, pins that #345 is a REFUSAL and not a miscompile, with a potency control showing the same shape compiles with a short body). Constant islands are BLOCKED on a post-encode branch-relaxation pass that does not exist: branch displacements are pre-computed upstream as halfwords and nothing repairs them after an insertion."
      # NOT `file:...litpool_islands_345.wat`: that fixture is committed by THIS
      # release, so such a predicate would evaluate TRUE while the lane is
      # deferred and nothing is fixed — a done-when that cannot fail. The
      # predicate names the FIX instead, and is FALSE today by construction.
      done-when: "contains:scripts/repro/litpool_islands_345.py:ISLANDS HAVE LANDED"
