artifacts:
  - id: RQ-71-MUTANTDRIFT
    type: system-req
    title: "A mutant pinned by file:line:col is silently invalidated by any edit ABOVE it, and the resulting red reads as a coverage regression"
    description: >
      MEASURED at the v0.70 cut by hitting it. The `mutation survey` job went RED on
      the release PR while main (da110b89) and c18c185e / 1da8c4c0 / bd65e450 were
      all GREEN on the same job — so the red belonged to the PR, not to the runners.
      That question was asked first, and it is the only reason the next step was
      diagnosis rather than a retry.

      IT WAS NOT A COVERAGE REGRESSION. The failing step is named "Replay the
      pinned mutant subset (controls must die, survivors must reproduce)", which is
      exactly what a coverage regression looks like.

      `docs/status/mutation_survey.json` pins every mutant by `file:line:col`. The
      subset entry `R4-shared/REG/liveness.rs:7346:36` targeted
      `let aapcs_dead_at_return = [Reg::R2, Reg::R3, Reg::R12, Reg::LR];`. v0.70's
      `policed` fix and its red-first test added +27/-5 lines to `liveness.rs`.

      CORRECTED BY THE v0.71 COLD REVIEW, twice, and both corrections are this
      artifact's own subject turned on itself.

      (1) This said the +27/-5 was "ALL ABOVE that line". It was not. The commit
      has exactly two hunks — `@@ -5733,11 +5733,15 @@` (+9/-5, net +4, ABOVE)
      and `@@ -18313,6 +18317,24 @@` (+18, inside `mod tests`, FAR BELOW). Only
      +4 shifted the pin, which is exactly why it moved 7346 -> 7350 and not
      7346 -> 7368. The total was right and the attribution was right; the
      DISTRIBUTION was asserted rather than read, and had it been true the
      arithmetic would not have matched the observed drift.

      (2) This said "line 7346 NOW holds `let ends_in_return = matches!(`". True
      at the v0.70 cut, false on the tree being cut: 7346 now holds
      `relaxed_exit: bool,` and 7350 holds `eprintln!(`. The subset entry itself
      is now `R4-shared/REG/liveness.rs:7404:36`, moved by v0.71's OWN re-anchor
      after RQ-71-VFPALIAS inserted 162 lines into this file — the remedy this
      artifact documents, applied to this artifact's own example, one release
      later. A present-tense line citation is a drifting anchor in prose, which
      is the whole finding.

      THE LEDGER IS CONTENT-RECOVERABLE AND THE REMEDY ALREADY EXISTS. Every mutant
      stores its `before` text, and `reanchor` re-locates by it — its own docstring
      says "the id embeds the line number, so a shifted site must be re-resolved
      rather than trusted". It fixed this cleanly: 5 sites moved, 0 not found, and
      nothing re-baselined (mutants 34 -> 34, controls 3 -> 3, ci_subset 10 -> 10,
      UNTESTED 4 -> 4, claim_check 75/75).

      THE DEFECT IS THAT NOTHING CONNECTS THE TWO. Refuting command, run:
      `grep -c reanchor .github/workflows/ci.yml` = **0**. CI never reanchors, and
      the failure message names neither line drift nor the remedy. So any PR that
      inserts a line above a pinned site gets a red that reads as lost coverage —
      and the obvious "fix", `pin-subset`, would silently RE-BASELINE coverage
      instead of re-locating a site. A gate whose failure mode invites the wrong
      repair is worse than one that simply fails.

      This is the same shape as v0.70's own `.wat` header, which counted the lines
      the hunk writing it had just added: an anchor that quietly means something
      else after an unrelated edit.

      THE MACHINE'S HALF OF THIS IS `contains:.github/workflows/ci.yml:reanchor`. The full obligation is:
      the CI replay re-locates each pinned mutant by its stored `before` text before replaying, and reports drift AS DRIFT (`site moved 7346 -> 7350, re-anchored`) rather than as a survivor failing to reproduce; PROVEN by inserting a line above a pinned site and showing the job stays green while naming the move, and by showing a genuine coverage regression still reds
      The predicate cannot express all of that — it checks that the artefact
      EXISTS, not that it is right. It is still worth having: v0.70 measured
      that four releases running declared 100% `manual:` done-when, which R3
      can never fire on, and printed that as though it were evaluation.


      REFUTED. The premise was wrong, and it was wrong because it was built on a
      STEP NAME instead of a log line.

      THE CLAIM: "a drifted anchor reds saying 'controls must die, survivors must
      reproduce', which READS AS A COVERAGE REGRESSION ... the failure names
      neither line drift nor the remedy."

      MEASURED ON THIS TREE — it names BOTH:

        - `enumerate_sites()` keys live sites by an id embedding the line number,
          so a stale anchor simply does not resolve. Verified: the ci_subset's 10
          entries all resolve today, and the same id with its line shifted by +8
          resolves to `None`. That takes the branch which reports
          "<id>: site no longer exists on this tree (re-anchor the ledger)" —
          the remedy, in the message.
        - `Edit.__enter__` independently raises "site drifted: <id>" and prints
          --have-- against --want--, so the wrong text is shown, not inferred.

      WHAT I ACTUALLY SAW IN v0.70 was the step's NAME, because the run was still
      in progress when I asked for its log and `gh run view --log-failed`
      returned "logs will be available when it is complete". I inferred the
      message from the title and wrote the inference down as a measurement. That
      is the same error class this release keeps finding, committed by the
      artifact that was supposed to fix a reporting problem.

      SO THE PROPOSED FIX WOULD HAVE MADE THINGS WORSE. Having CI re-anchor
      automatically means either mutating a committed ledger from CI, or turning
      a real drift into a green run. A loud red that names the remedy is the
      better behaviour, and it already shipped.

      WHAT SURVIVES, and it is small and real: the step NAME was the one
      genuinely misleading surface — a drifted anchor is not a survivor failing
      to reproduce — and the remedy COMMAND was not written anywhere a reader
      landing on that step would see it. Both are fixed:

        - the step is renamed to include "anchors must still resolve — a drifted
          anchor reds here and is re-anchored, not re-baselined";
        - the exact command (`python3 scripts/mutation_survey.py reanchor`) and
          the `pin-subset` trap are recorded at the step, together with the
          check that distinguishes a re-location from a re-baseline: the
          mutants/controls/ci_subset/UNTESTED counts must be UNCHANGED;
        - `Edit`'s drift message now names the remedy and the trap too, for
          anyone who reaches drift by another path.

      `grep -c reanchor .github/workflows/ci.yml` was 0 and is now 1 — but as
      DOCUMENTATION at the point of failure, not as an automatic re-anchor,
      which is the thing this artifact set out to build and should not.
    status: proposed
    release: v0.71
    tags:
      - gate-potency
      - release-gate
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: differential
      issue: "#1189"
      disposition: refuted
      # R4: the squash commit for this artifact is delivery-shaped, so the
      # increment is RECORDED rather than the status flipped — what landed is
      # a REFUTATION plus two documentation fixes, not the feature the
      # artifact proposed. `disposition: refuted` beside it is what R11 wants
      # next to a non-claiming status.
      landed: "PR #1353. NOT LANDED as the proposed feature — the premise was REFUTED. What landed: the measurement showing a drifted anchor already reports \"site no longer exists on this tree (re-anchor the ledger)\" and \"site drifted: <id>\" with have-vs-want; the step renamed so a drifted anchor is not read as a survivor failing to reproduce; and the remedy command plus the pin-subset trap recorded at the step. CI deliberately does NOT auto-re-anchor: that would mutate a committed ledger from CI or mask real drift."
      # A REFUTATION CANNOT HAVE A MECHANICAL DONE-WHEN, and trying to give it
      # one is what R3 caught. The deliverable is a FINDING, not an artefact,
      # so no file's existence can mean "this was refuted" — the `contains:`
      # predicate went TRUE the moment the remedy was documented, and R3
      # correctly read that as a `proposed` status under-reporting shipped
      # work. Flipping to `implemented` is not available either: R11 forbids
      # `disposition: refuted` beside a claiming status, and rightly.
      # `manual:` is the shape v0.69 used for RQ-69-PROSEGATE, the previous
      # refutation, and it is the honest one.
      done-when: "manual: the premise is tested against the LOG rather than the step name — a drifted anchor must be shown to already name both the drift and the remedy, and CI must NOT auto-re-anchor (which would mutate a committed ledger from CI or mask real drift)"
