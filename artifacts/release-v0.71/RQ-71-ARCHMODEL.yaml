artifacts:
  - id: RQ-71-ARCHMODEL
    type: system-req
    title: "The AADL/spar step is N/A for the NINTH consecutive release — spar#445 re-verified at the cut, and the chain WALKED rather than recalled"
    description: >
      The recurring N/A, filed again rather than waved off. Two things the v0.71
      plan demanded at the cut, both done by measurement:

      SPAR#445 RE-VERIFIED 2026-09-23, with the date recorded rather than the
      memory of a date. `gh issue view 445 --repo pulseengine/spar`: state OPEN,
      created 2026-09-03, **last updated 2026-09-03** — untouched for twenty days.
      Title: "spar accepts property associations from UNDECLARED property sets
      silently (rc=0) — a typo'd or invented property is indistinguishable from a
      satisfied one". A model whose property associations are accepted silently
      cannot carry an architecture claim, which is why this step stays N/A rather
      than being performed badly.

      THE COUNT IS THE `carried-from` CHAIN — AND THE FIRST VERSION OF THIS
      ARTIFACT DID NOT WALK IT. Corrected by the v0.71 cold review. What stood
      here claimed "THE COUNT IS THE CHAIN, WALKED" while citing
      `grep -rln ARCHMODEL artifacts/` — a FILENAME grep, not a chain walk — and
      this artifact carried no `carried-from` field at all, so the chain ran
      v0.63..v0.70 and stopped. That breaks RQ-70-ARCHMODEL's own done-when
      verbatim: "the carried-from chain is extended rather than an ordinal
      asserted". Asserting the ordinal is precisely what the predecessor
      forbade, and this artifact's title asserted it.

      FIXED IN THE FIELD, NOT THE PROSE: `carried-from: RQ-70-ARCHMODEL` is now
      set, so the chain reaches this artifact and the count is derivable by
      walking `fields.carried-from` back to the v0.63 head. Walked:
      v0.71 -> v0.70 -> v0.69 -> v0.68 -> v0.67 -> v0.66 -> v0.65 -> v0.64 ->
      v0.63 (chain head, no carried-from) = NINE. The number was right; the
      method claimed for it was not, which is the harder defect to see.

      The filename grep's exceptions, now COMPLETE (the earlier list named two of
      four): v0.62's RQ-62-LOOPCONFORM, v0.68's RQ-68-STATUSGATE and v0.70's
      RQ-70-DONEWHEN all MENTION ARCHMODEL without being one, and the
      `_release.yaml` hits from v0.64 on are plan prose.

      AND THE SENTENCE THAT KEEPS COMING BACK IS NOT WRITTEN HERE. "Release
      artifacts only exist from v0.63" is FALSE and is not restated: measured on
      this tree, `artifacts/release-v0.56.yaml` through `release-v0.60.yaml` exist
      as single files, and `release-v0.61/` onward as directories. The chain begins
      at v0.63 because that is when ARCHMODEL was FIRST FILED, not because
      artifacts began then. That sentence was retracted in RQ-69-ARCHMODEL and CAME
      BACK in RQ-70-ARCHMODEL — because that artifact was written from its
      predecessor's SHAPE rather than its predecessor's CORRECTION — and v0.70's
      cold review caught it the second time. A retraction that lives only in last
      release's prose is one copy-paste from being un-retracted, so the refutation
      is restated here with the command that produces it.

      THE TAGS ARE LOAD-BEARING AND ARE CHECKED, NOT ASSUMED.
      `loop_conformance_check`'s steps-1-2 slot matches an artifact tagged
      `feature-loop` AND (`aadl` | `spar`) carrying a `fields.issue`. v0.69's
      equivalent LOST its `feature-loop` tag, so the filing whose entire purpose is
      keeping a deferral VISIBLE became invisible to the gate, and the release read
      DOES-NOT-CONFORM until the cold review found it. This artifact carries
      `[process, carried, spar, aadl, feature-loop]` — the same set that passed
      NA-FILED in v0.70 — deliberately and not by inheritance.

    status: proposed
    release: v0.71
    tags:
      - process
      - carried
      - spar
      - aadl
      - feature-loop
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      verification-track: manual
      issue: "#1136"
      carried-from: RQ-70-ARCHMODEL
      landed: "PR #1358. NOT LANDED as a fix — spar#445 is still OPEN (created 2026-09-03, last updated 2026-09-03, re-verified 2026-09-23), so the AADL/spar step stays N/A for a ninth consecutive release. What landed is the INCREMENT: the state re-verified AT THE CUT with the date recorded, and `carried-from: RQ-70-ARCHMODEL` ADDED so the chain is walked rather than an ordinal asserted — which is what RQ-70-ARCHMODEL's own done-when required and this artifact had failed to do."
      disposition: deferred
      done-when: "manual: spar#445 re-verified at the v0.71 cut (OPEN, created 2026-09-03, last updated 2026-09-03, checked 2026-09-23), the `carried-from` chain is EXTENDED by this artifact (carried-from: RQ-70-ARCHMODEL) and walks back to the v0.63 head = nine consecutive releases, and loop_conformance_check reports the steps-1-2 slot NA-FILED naming this artifact"
