artifacts:
  - id: RQ-81-PAGESIZE3
    type: system-req
    release: v0.81
    status: proposed
    title: "Honour (pagesize 1) end to end, or decline it loudly — no backend reads the declared page size today"
    description: >
      CARRIED from v0.79/v0.80, and v0.80 declined to half-deliver it on a stated ground that
      still holds: the failure mode of a partial delivery is a SILENT OVER-GRANT, which is
      #1315's own defect class. `crates/synth-core/src/wasm_decoder.rs:118` computes
      `self.initial_pages * 65536` and ignores `page_size_log2` ENTIRELY, so a `(pagesize 1)`
      module accepted without the rest of the change is handed 65536x the memory it declared,
      with no diagnostic.

      THE LEGAL SET IS EXACTLY {1, 65536} and this is settled from this repo's OWN vendored
      suite, not a third-party validator: `custom-page-sizes-invalid.wast` asserts
      `(pagesize 32)` INVALID by name. 65536 is the default, so the entire capability is
      `(pagesize 1)` — byte-granular sizing. The reporter's ">= 32 B power of two" scoping was
      spec-invalid and must not be re-adopted.

      HONOURING IT CHANGES EMITTED CODE on three backends, which is why this is not a decoder
      patch. Four `memory.size` lowering sites divide or shift by a hardcoded 65536: ARM
      `LSR #16`, RV32 `li rd, bytes / 65536`, AArch64 `limit_bytes / 65536`. Scope MEASURED at
      28 shipped sites and 6 test sites; the broad 233-site figure an earlier pass produced is
      a TRAP, dominated by false positives — do not re-derive scope from a naive grep.

      ALSO IN SCOPE, and cheap: #1339 — custom page size is refused only by the CLI, so a
      caller of the PUBLISHED `synth-core` still gets in. A refusal that lives in one front end
      is not a refusal.

      THE ORACLE ALREADY LANDED. `scripts/repro/pagesize_oracle_1441.py` is CI-wired, carries
      28 assertions, PROBES for the capability and AUTO-STRENGTHENS when it appears, asserting
      EXACTLY ONE of two modes holds. Read its behaviour before touching it — it compiles
      TWO-memory modules deliberately, because a single-memory module emits no
      `__synth_mem_*` symbols for it to read.

      REFUTING COMMAND: `python3 scripts/repro/pagesize_oracle_1441.py` and
      `grep -n "page_size_log2" -r crates/`. If the oracle reports the capability MODE rather
      than the refusal mode, the capability has landed and this premise is dead.
    tags:
      - feature
      - carried
      - reach
      - memory
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: software
      priority: must
      issue: "#1441"
      verification-track: manual
      done-when: "manual:2026-11-30 REWRITTEN AT DELIVERY because the SECOND of this artifact's two alternatives is REFUTED by a recorded downstream decision, not by effort: what is required instead is the refutation stated with gale's own words and the citation that carries them, the fact that the relocation was BUILT AND REVERTED, the reason the stated refuting command could not catch this, and gale's architectural correction recorded so a future lane aims at the right target"
      disposition: refuted
      # A NOTE ON THIS ARTIFACT'S OWN done-when, raised by cold-review round 1 and
      # recorded rather than argued away. It begins "REWRITTEN AT DELIVERY", and a
      # criterion rewritten to enumerate what was in fact delivered CANNOT FAIL —
      # which is the opposite of what a done-when is for. The rewrite is defensible
      # here only because the ORIGINAL criterion became unachievable by definition:
      # it asked for the capability or a synth-core decline, and the second is the
      # remedy the downstream refused in writing, so no honest work could satisfy it.
      # RQ-81-COMPLIANCE took the better path on the same tree — it kept its
      # criterion VERBATIM and recorded a tag-time obligation instead of rewriting
      # it to something satisfiable today. That is the model; this is the exception,
      # and the exception should be rarer than two artifacts in one release.
      verified-by: >-
        REFUTED, AND THE REFUTATION IS A RECORDED DOWNSTREAM DECISION. This artifact offered two
        alternatives: implement the capability, or DECLINE it in synth-core rather than only in the
        CLI so a library caller cannot get a silent over-grant. The second is the one a downstream
        consumer has already ASKED NOT TO HAVE, and the record is eleven releases old.
        gale answered on #1145 on 2026-09-22, quoted in RQ-71-PAGELIB: "Refused or honoured?
        HONOURED — and please do not spend the effort on relocating the refusal. Refusing in the
        library closes a door gale wants open. The CLI refusal you shipped is exactly right as an
        interim, because it converts a silent wrong answer into a loud one, and gale only uses the
        CLI." RQ-71-PAGELIB's own title states the conclusion — do not move it into synth-core — and
        its body says shipping the move "would have been the exact error v0.68 already made once".
        I BUILT IT ANYWAY, THEN REVERTED IT, and that is recorded rather than quietly dropped. The
        relocation was written and working: `refuse_custom_page_size` moved into
        `synth-core::wasm_decoder` as the single implementation, the CLI reduced to a one-line
        delegation with its copy DELETED, both byte-size accessors guarded so neither could silently
        return 65536 for a one-byte memory, and seven new tests green including a positive control
        that a default memory is still accepted and a twin assertion for `max_bytes`. All of it is
        reverted: synth-core contains zero refusals, the CLI owns the diagnostic again, both crates
        build. The work is not the deliverable; the decision is.
        THE STATED REFUTING COMMAND COULD NOT CATCH THIS, which is the lesson worth carrying. It
        asks whether the oracle reports the capability mode and whether `page_size_log2` has
        readers — both of which say only "the capability has not landed", and both of which HELD.
        Neither can see that one of the two offered remedies is forbidden. What caught it was
        sweeping for stale citations of the function being moved, which surfaced
        `artifacts/release-v0.71/RQ-71-PAGELIB.yaml` by name. A refuting command for a lane whose
        remedy touches a published crate boundary must also re-read the DOWNSTREAM answer, not only
        re-measure the code.
        WHAT WOULD RE-OPEN IT, unchanged from v0.71 and re-verified rather than recalled: a library
        consumer of the published `synth-core` crate that is NOT gale. The layering gap is real — a
        library caller still gets a declared custom page size silently ignored — and it still has no
        occupant. Closing it now would have to be undone when gale's own `pagesize` work lands.
        ONE NEW MEASUREMENT KEPT FROM THE REVERTED WORK, because it is true independently of where
        the rule lives: `WasmMemory::max_bytes()` has ZERO callers in the workspace and over-reports
        in exactly the same way as `initial_bytes()`, which has NINE live call sites (ten textual
        occurrences, one of which is inside a comment at `synth-cli/src/main.rs:4644`). A fix applied to one of that
        pair and not the other is the twin-check shape this programme has already had to correct
        twice, so whichever lane eventually honours the declaration must move both.
        AND GALE'S ARCHITECTURAL CORRECTION, restated because it changes what a future lane should
        aim at and a refutation that drops it wastes the consultation: ARMv7-M PMSA needs
        power-of-two regions >= 32 bytes, ARMv6-M >= 256 (measured on a G031K8, MPU_TYPE
        0x00000800). "The win is not byte-exactness. It is getting the declared extent below 64 KiB
        at all."
        AND THAT NOTE IS ABOUT MPU REGIONS, NOT PAGE SIZES — the first draft of this paragraph
        contradicted this artifact's OWN description and the cold review caught it. The description
        states, correctly, that a ">= 32 B power of two" PAGE scoping is SPEC-INVALID and must not be
        re-adopted: `custom-page-sizes` permits exactly two page sizes, 1 and 65536, so there is no
        such thing as a 32-byte page to honour. gale's >= 32 B figure is the ARMv7-M PMSA region
        granularity the EMBEDDER programs, which is a different quantity. What survives from the
        consultation is the sentence above — the win is getting the declared extent below 64 KiB at
        all — and `(pagesize 1)` is the only spec-legal way to ask for that. That, not the
        relocation and not a 32-byte page, is the shape of the next page-size lane.
        THE FIRST ALTERNATIVE WAS NOT ATTEMPTED AND IS NOT CLAIMED: honouring the declaration is 28
        shipped sites plus an execution differential. THE REFUTING COMMAND RAN AND THE PREMISE
        HOLDS, and this is stated from the POPULATED checkout rather than from a worktree: the
        oracle exits 0 with `PASS: pagesize oracle, 28 assertions`, reporting `17 spec-invalid sizes
        all refused`, `explicit65536 accepted`, and `(pagesize 1): REFUSED, diagnostic still cites
        #1315 — capability ABSENT`. That is the REFUSAL mode, which is exactly what the refuting
        command said would keep the premise alive.
        A FIRST DRAFT SAID THE ORACLE "REFUSED TO RUN", AND THAT WAS TRUE OF THE WRONG SUBJECT. It
        refuses in a fresh `git worktree`, where the `custom-page-sizes` spec suite submodule is
        uninitialised — a property of THAT CHECKOUT, not of the oracle. Reporting a dependency
        refusal as the lane's evidence when the oracle in fact executes and passes would have hidden
        the stronger result. The second half also holds: `page_size_log2` has readers in exactly two
        files, the CLI refusal and the decoder field.
