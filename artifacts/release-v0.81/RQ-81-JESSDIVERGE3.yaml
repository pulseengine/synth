artifacts:
  - id: RQ-81-JESSDIVERGE3
    type: system-req
    release: v0.81
    status: implemented
    title: "The translational sub-vector: the gravity-compensation addend contributes nothing — find where it is absent, zeroed, or on the wrong axis"
    description: >
      CARRIED, and the mechanism has been wrong TWICE — first "an identity rotation", then
      "a lagged or stale attitude read" — both caught by MEASUREMENT rather than review, the
      second by the reporter's own QEMU TCG memory tracer. THAT HISTORY IS THE REASON THIS
      ARTIFACT'S REFUTING COMMAND MUST BE RUN FIRST. Do not re-adopt either mechanism.

      WHERE IT STANDS. The persistent quaternion at wasm offset 0xac18 is BIT-IDENTICAL
      between ARM and wasmtime at ticks 1, 2, 3, 15 and 16, and over an extended 1024-tick
      run. The attitude STATE agrees across every tick boundary; only what is computed FROM
      it diverges. SIX fields differ in the return area and ALL SIX disagree in SIGN, over
      exactly the translational sub-vector (pos-n/e/d, vel-n/e/d). What AGREES is exactly the
      quaternion, the gyro passthrough and the innovation. Classified rather than counted:
      744 masked (ARM holds the harness's 0xdeadbeef paint where wasmtime zero-inits — neither
      wrote them, and counting them would be a vacuous positive), 0 OMITTED STORES (the
      lowering is not dropping stores; it computes different values), 11 ULP-close, 217
      divergent. The fit `vel-d(n)/(n*g*dt)` = 1.0000..1.0003 over sixteen ticks says ARM's
      vel-d is UNCOMPENSATED GRAVITY, and at 64x the horizon the ratio reaches 1.0086 with the
      estimator believing it is descending at 10.1 m/s having fallen 5.18 m, against the free-fall
      integral 1/2*g*t^2 = 5.14 m.

      THE SIGN PATTERN IS THE SIGNATURE, NOT THE MECHANISM, and the distinction binds this lane.
      The reporter explicitly DECLINED "therefore the sign of the rotation, or of the gravity
      subtraction, is wrong", on the ground that THE MAGNITUDES DIFFER TOO, so it is not a pure
      inversion. What they DO name is ONE MISSING OR ZERO-VALUED ADDEND — exactly what the
      free-fall integral predicts. Whether the addend is ABSENT, ZEROED, or LANDING ON ANOTHER
      AXIS needs synth's disassembly, and a lane that goes looking for a flipped sign bit is
      looking for the wrong thing. v0.80's own artifact made this mistake in its TITLE and
      `done-when` and was corrected by its cold review.

      WHERE TO LOOK, and v0.80 derived this so v0.81 does not have to. The link base is
      D = +0x2e4, so `linked_addr = cascade.o .text offset + 0x2e4`, derived by requiring all
      nine of the reporter's pcs to land on instructions whose KIND matches their stated role
      (6 reads must be loads, 3 writes must be stores) — 285 offsets land on instructions and
      the kind filter leaves exactly ONE — and confirmed independently by the operands
      (`movw r12, #0xac10`/`#0xac14`/`#0xac18` then `ldr.w r3, [r11, r12]`). All nine pcs fall
      inside `ekf@0.10.0#estimate`. The 208-word run 0xac9c-0xafd8 is read by pcs
      0x2250/0x2274/0x2298 -> .text+0x1f6c/0x1f90/0x1fb4. Read those three sites against the
      reporter's traced values.

      ELIMINATED, and not to be re-opened without new evidence: the return-ABI class (#1450),
      the VFP frame-slot class (byte-level 132/132, self-validating), and the lagged attitude.
      NOT SUPPORTED but NOT eliminated: caller-saved S-register clobber — the analyser's
      POSITIVE CONTROL WAS EMPTY, and the reason (synth reloads f32 from the frame rather than
      holding it across a call) is itself the finding.

      THE FOUR CONDUCT RULES BIND THIS LANE. Rule 4 in particular: hardening the oracle around
      this defect is NOT progress on it. The lane owes a named cause, or a plain statement that
      it did not reach one and what it tried.

      REFUTING COMMAND: re-read the issue thread before building anything —
      `gh issue view 1436 --json comments --jq '.comments[-6:][].body'` — and attribute by BODY
      PREFIX, never by `author.login`, because the reporter relays through a shared account.
      The module is committed at `repro/synth-1436/` on jess main (c.wasm d854e5bb..,
      c.loom.wasm 791ab6b5..) with a QEMU recipe; no board is needed. If the thread names a
      mechanism this artifact does not, the artifact is wrong again and must be rewritten
      before work starts.
    tags:
      - bug
      - carried
      - external-report
      - miscompile
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: software
      priority: must
      issue: "#1436"
      # RQ-81-JESSDIVERGE3 delivered ITS scope — the three named mechanisms are
      # refuted against the module's own bytes, and the oracle that proves it is
      # re-runnable. The ISSUE is the broader question, and it is UNANSWERED: the
      # lowered module still diverges and the vehicle still integrates
      # uncompensated gravity. #1436 is also an EXTERNALLY REPORTED defect —
      # `author.login` is avrabe, but the body opens `**[jess]`, so an
      # author-based filter reads it as internal and is structurally blind.
      #
      # WITHOUT THIS FIELD THE TAG WOULD HAVE CLOSED IT. `status: implemented` is
      # CLAIMING, and a claiming status is exactly what `authorised_close_set`
      # reads as "this release may close the issue" — so satisfying R3 silently
      # armed the closer. That is conduct rule 4 breached by machine: a release
      # whose only work on an open externally reported defect was hardening the
      # oracle around it does not count as progress on it.
      issue-scope: outlives
      verification-track: manual
      done-when: "contains:scripts/repro/jessdiverge3_gravity_faithful_1436.py:ABSENT, ZEROED and WRONG-AXIS are all refuted"
      verified-by: >-
        REFUTED: all three mechanisms this artifact named are refuted, and #1436 ITSELF REMAINS
        OPEN AND UNEXPLAINED. The artifact asked which of ABSENT, ZEROED or LANDING ON ANOTHER AXIS
        the gravity-compensation addend suffers. Measured against the module's own bytes: NONE OF
        THE THREE. What is refuted is this release's HYPOTHESIS, not the reporter's defect — the
        vehicle still integrates uncompensated gravity and nothing here makes that better. The lane
        did not reach the cause and says so rather than promoting a refutation into an explanation.
        NO `landed:` AND NO CLAIM OF PROGRESS ON THE DEFECT, deliberately. The conduct rule is that
        a release whose only work on an externally reported defect was hardening the oracle around
        it does not count as progress on it. Eliminating three mechanisms narrows the search; it
        does not move the reporter's blocker, and this artifact must not read as if it did.
        WHAT WAS MEASURED, both sides DERIVED and neither hand-copied. The input applies gravity in
        three parallel terms — `localA + localB * 9.81` stored to offsets 940, 936, 944 in that
        order — and the ARM contains exactly three matching `vldr/vldr/movw+movt/vmov/vmul/vadd/str`
        blocks storing to 940, 936, 944 in that same order, with the correct constant and the
        addend on the correct side of the product. The neighbouring `f32.store offset=932` and
        `i32.store offset=980` match as well, which is what shows the window is ALIGNED rather than
        coincidentally similar. An ABSENT addend would lose the `vadd`, a ZEROED one its operand,
        and a WRONG AXIS would permute the three offsets. None of that is present.
        THE REFUTATION IS RE-RUNNABLE, which is the only reason it counts as evidence: shipped as
        `scripts/repro/jessdiverge3_gravity_faithful_1436.py`, deriving both sides from a `.wat` and
        an objdump listing rather than asserting a remembered result, so the reporter — who has the
        module and the hardware — can run it. NEGATIVE-CONTROLLED by injecting each of the three
        mechanisms plus a dropped term, and a derived population of ZERO is a REFUSAL rather than a
        pass. 9 of 9 self-tests, and the matcher is shown to IGNORE a mul-add by a different
        constant so a green cannot come from matching the wrong block.
        THE INSTRUMENT THAT WOULD HAVE LIED, recorded because it nearly did. A byte search for
        `9.81` as a little-endian f32 finds 6 occurrences in the wasm and ZERO in `cascade.o` —
        which reads exactly like "synth dropped the constant" and is meaningless: synth materializes
        an f32 constant as a `movw`/`movt` IMMEDIATE PAIR, never as literal-pool bytes. Proven by
        the same search on `0.001`, which reports 0 in an object that demonstrably materializes it
        22 times, one of them disassembled by hand at `.text+0x1fc4`. The shipped oracle matches the
        instruction pair for this reason.
        WHERE THE DIVERGENCE MUST THEREFORE BE, stated as the next measurement and not as a cause:
        the expression is right and reads from the right slots, so what remains is the VALUE a
        multiplicand slot holds AT RUN TIME — `[sp,#152]`, `[sp,#208]`, `[sp,#232]`. A static
        comparison cannot see that; the reporter's existing memtrace plugin can, windowed to those
        three slots. A FOURTH mechanism is now the live one: the addend is computed, and one of its
        operands is wrong.
        AND A LIVENESS CHECK THAT CAME BACK EMPTY, reported because an empty result is not a pass:
        all six operand slots are both written and read, so "a slot read but never written" is
        refuted too. The reason it cannot fire here is the one this programme already recorded —
        synth reloads from the frame, so every slot has a writer.
        NOT CLAIMED. This compares the gravity-compensation site ONLY. The pcs the reporter traced
        (`.text+0x1f6c/+0x1f90/+0x1fb4`, link base D=+0x2e4) are a DIFFERENT computation — `mem[X]
        += sN` accumulations, and at `+0x1fb4` `mem[0xad18] += (s2 * mem[sp+152]) * 0.001`, where
        `0x3a83126f` is exactly dt = 1 ms. Those are not checked by the oracle and no claim is made
        about them.
        ALSO CHECKED AND CLEAN, so it is not left as a loose thread: the two `i64.store`s beside the
        gravity block are lowered correctly. `i64.const 2147483648 -> offset 972` writes low word
        `0x80000000` then high `0`, and `i64.const -9223372036854775808 -> offset 964` writes low
        `0` then high `0x80000000`. That looked like a word swap until the second constant was read
        rather than assumed from its neighbour; it is i64 MIN and the order is right.
        THE PREMISE WAS RE-CHECKED BEFORE ANY WORK, as the artifact demands: the last six comments
        on the thread name no mechanism this artifact does not, attributed BY BODY PREFIX
        (`**[jess]**` for the reporter's four, `**[synth release loop]**` for ours), and both module
        digests verify against the reporter's own `SHA256SUMS.txt`. Lowered with synth 0.79.0 using
        the reporter's compile line; `estimate` reproduces at 15300 bytes, the figure in the thread.
