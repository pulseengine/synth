artifacts:
  - id: RQ-81-SILENT
    type: system-req
    release: v0.81
    status: implemented
    title: "OUT OF POPULATION IS INDISTINGUISHABLE FROM COMPLIANT — an artifact that reports nothing, and a verdict no rule classifies"
    description: >
      R11 exists to catch an artifact that says too little about its own delivery, and it
      cannot see an artifact that says nothing at all. Its failure branch is
      `elif landed_txt and status not in CLAIMING and not disp:` — it requires `landed:`
      to be NON-EMPTY, so it fires on "you recorded a landing but did not say why you are
      not claiming" and is silent on "you recorded nothing", which is strictly less
      information. The rule's own error text names the incident it was written for
      (v0.67 cut with all seven artifacts `proposed`, #1250) — and v0.67's artifacts were
      silent in exactly the way the rule cannot see.

      THE EVIDENCE IS IN v0.80's OWN HISTORY, not only in #1458's v0.79 table. TWO v0.80
      `must` artifacts — RQ-80-PAGESIZE2 and RQ-80-WIDEFILE3 — reached the release
      candidate with no `verified-by:` and no `disposition:`, with every structured gate
      green at that commit. They were caught by a human re-reading the exit condition and
      fixed in a record PR. A gate that needs an operator to remember it is not a gate.

      AND THE SAME HOLE EXISTS ONE LEVEL IN, inside the gate v0.80 shipped for exactly this
      subject (#1476, found by v0.80's own cold review and verified before filing).
      `verdict_prose_check.py` is an ALLOW-LIST of thirteen tokens: six COMPLETE, seven
      INCOMPLETE. A `verified-by:` whose leading word is anything else LEAVES THE POPULATION
      rather than failing. Four escapes are constructible beside a contradicting status —
      `NOT LANDED`, `DONE`, `NOT-DELIVERED`, `CLOSED` — and `NOT LANDED` is the sharpest,
      because the module deliberately excludes a bare leading `NOT` and the consequence (NOT +
      any COMPLETE word is unclassified) is written down nowhere. `--census` DOES print the
      unclassified leads, and the live tree already has several, but NO GATE READS THE CENSUS.
      Measured beside it: `NOT_A_VERDICT` is INERT (every member is already outside
      COMPLETE u INCOMPLETE, so deleting the branch changes no verdict and passes all ten unit
      tests), and the COMPLETE-beside-disposition branch — the half the motivating 28196ec7
      instance is named for — is DEAD on the live population, because R11 reds that combination
      first and 0 of the 539 pinned at the v0.80.0 anchor can reach it (`ANCHOR_PROGRAMME`; the LIVE count at this commit is 550).

      SO THE LANE IS ONE SUBJECT, NOT TWO. A silent artifact and an unclassified verdict are
      the same defect wearing different clothes: both leave the population, and leaving the
      population is indistinguishable from passing. Fix the class, not the two instances.

      DELIVERABLE, and either outcome is a result: a rule that REDS a release artifact
      which reports no outcome, AND makes an unclassified verdict lead VISIBLE rather than
      silent — red-first on a real commit, then green — or a REFUTATION
      carrying the census of how many artifacts across every shipped release the rule
      would red on day one, with the reason the bar cannot be moved honestly. v0.80's
      SENTENCE lane is the template for shipping it; RQ-74-STALEMSG is the template for
      refusing to (it measured 363 sites its proposed tripwire would have outlawed).

      SCOPE CARE, learned twice. The rule must be scoped to the RELEASE WINDOW, not to
      every artifact ever filed: 293 unscoped programme artifacts exist and they are
      silent BY DESIGN until a release scopes them (RQ-62-ROADMAPGATE). A rule that reds
      those is the gate nobody can move. And the population must be DERIVED, not pinned —
      a population of zero is a REFUSAL, not a pass.

      REFUTING COMMAND: `python3 scripts/status_evidence_check.py` at the ref, then
      `python3 -c "import yaml,pathlib;
      [print(p.name, 'SILENT') for p in sorted(pathlib.Path('artifacts/release-v0.80').glob('RQ-*.yaml'))
      if not (yaml.safe_load(p.read_text())['artifacts'][0]['fields'].keys() & {'verified-by','disposition','landed'})]"`.
      If that prints nothing for the CURRENT release, the gate has nothing to catch TODAY
      and the lane must say so rather than planting a fixture — the red-first then has to
      come from real history, the way SENTENCE used `28196ec7`.
    tags:
      - process
      - gate
      - traceability
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1458"
      # #1476 is the same class one level in: the gate v0.80 shipped for this
      # subject has its own out-of-population hole. Folded here rather than
      # filed as a sibling lane, because the fix is one mechanism.
      verification-track: manual
      done-when: "contains:scripts/test_loop_conformance_check.py:test_red_first_on_real_history_5ad2662f"
      verified-by: >-
        DELIVERED, both halves, and the implementation was RESHAPED TWICE BY MEASUREMENT before it landed.
        HALF ONE — AN ARTIFACT THAT REPORTS NOTHING. `artifacts_reporting_nothing()` in
        loop_conformance_check.py reports a release artifact carrying none of `verified-by`, `disposition` or
        `landed`, wired as step 3's `reported outcome` slot. RED-FIRST ON REAL HISTORY, not a planted
        fixture: at 5ad2662f — main immediately before the v0.80 record PR — it returns
        (11, ['RQ-80-PAGESIZE2', 'RQ-80-WIDEFILE3']), two `must` artifacts silent with every structured gate
        green; at 6950aa99, one commit later, it returns (11, []). Both are asserted in
        test_loop_conformance_check.py and both SKIP LOUDLY on a shallow clone rather than passing.
        WHY IT LIVES AT THE TAG AND NOT IN status_evidence_check, which is the design decision and was
        settled by measurement rather than taste: a `proposed` artifact has no outcome fields BY
        CONSTRUCTION, so the same rule on every PR reds every PLANNING PR. Measured on v0.81's own planning
        PR the moment it landed: 11 of 11 artifacts silent, every one legitimately so. The answerable
        question is not "is an artifact silent" but "did this release SHIP one", and only the cut can ask it.
        The zero-artifact case is already refused above the slot (the #1064 shape), so a pass here cannot be
        vacuous for want of a population.
        HALF TWO — A VERDICT NO SET CLASSIFIES (#1476). `leading_verdict` returns None for TWO different
        situations — "this opening is not a verdict" and "this verdict word is unknown" — and that
        conflation IS the hole: an escape is indistinguishable from a legitimate opening.
        `unclassified_lead()` separates them, and step 3's `verdict classified` slot reds on an escape. The
        sets are IMPORTED from the shipped module, never mirrored, and an import failure reports NOT-DERIVED
        rather than passing.
        THE MEASUREMENT RESHAPED THIS HALF. A red-on-any-unclassified-lead rule would have red SIX innocent
        artifacts on day one: over 181 artifacts carrying a non-empty `verified-by` (derived by scanning
          `artifacts/release-v*/*.yaml`), the live unclassified openings are
        exactly CLASSIFICATION, TRIAGE, EVERY ATTRIBUTION, ADDED, BYTE IDENTITY and RULE — one occurrence
        each, all in v0.65..v0.77, and none of them a verdict about the work. That is the RQ-74-STALEMSG trap:
        a gate nobody can move honestly is a gate they route around. So the six were added to NOT_A_VERDICT
        as MEASURED EXCLUSIONS, and the DANGEROUS escapes are deliberately not there — `NOT LANDED`, `DONE`,
        `NOT-DELIVERED` and `CLOSED` all still red, asserted individually.
        AND THAT MAKES #1476's OTHER FINDING RESOLVE ITSELF. `NOT_A_VERDICT` was INERT: every member was
        already outside COMPLETE u INCOMPLETE, so its branch was followed by a path returning None anyway, and
        deleting it changed no verdict and passed all ten unit tests. It is now LOAD-BEARING — it is the list
        that separates a declared non-verdict from an escape — and a test removes a member to show the same
        prose becomes a reported escape. The documented intent and the behaviour finally agree.
        NON-INVASIVE, PROVEN ON ONE TREE rather than argued: with and without the six additions, the existing
        gate reports the SAME population and the SAME census. The additions change no verdict and no
        population; they only give `unclassified_lead` a declared non-verdict list.
        THE ABSOLUTE FIGURES IN THE FIRST DRAFT WERE STALE, and the cold review caught it. It said
        "population 54 and census 175" — measured BEFORE v0.81's own eleven artifacts recorded their
        outcomes, each of which adds one to both. Re-derived at this commit: the gate reports
        population 65, and 181 of 196 artifacts carry a non-empty `verified-by`. A count is
        invalidated by the edit that writes it, and this release wrote eleven of them. What the
        sentence ASSERTS is the invariant — identical with and without the six additions — and that
        holds at either count.
        AND THE RULE WAS POTENT AGAINST THE SUITE ITSELF, which is the evidence I did not plan for. The new
        slot red an existing fixture, RQ-61-X, that modelled a "green v0.61 shape" with no outcome — accurate
        under the old rules and incomplete once reporting an outcome became part of green. The FIXTURE
        changed, not the rule, and the factory gained an optional `verified_by` used only where a fixture must
        model green; fixtures modelling FAILING shapes stay silent deliberately. Reverting that fixture on a
        copy reds ReleaseShapeReplay, so the slot is not vacuous.
        NOT DELIVERED, AND SAID SO: the COMPLETE-beside-disposition branch is still DEAD on the live
        population (R11 reds that combination first; 0 of the 539 pinned at the v0.80.0 anchor can reach it (`ANCHOR_PROGRAMME`; the LIVE count at this commit is 550)). It is left alone rather
        than given a synthetic pre-0.67 fixture, because a test that can only be reached by constructing an
        artifact the gates forbid is evidence about the fixture and not about the branch.
