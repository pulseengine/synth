artifacts:
  - id: RQ-81-SHEXIT
    type: system-req
    release: v0.81
    status: implemented
    title: "merge_gate.py's sh() discards every subprocess exit code — the v0.73 review fixed ONE of six call sites"
    description: >
      `scripts/merge_gate.py:45` defines `sh()` as `subprocess.run(args, capture_output=True,
      text=True).stdout.strip()` — no `returncode`, no `check=True` — so a command that FATALS
      returns the empty string, indistinguishable from one that succeeded with no output. This is
      the "checker succeeds about work it never did" class, in the gate the merge ritual runs.

      THE CLASS WAS ALREADY UNDERSTOOD HERE, WHICH IS THE POINT. The v0.73 cold review round 2
      found this exact bug and fixed it in `squash_fidelity` (`:90-103`), which calls
      `subprocess.run` directly and refuses on a non-zero rc, with a comment naming the incident:
      a `git diff` that fatalled yielded an empty string, which read as 0 lines, which read as
      FAITHFUL. The narrowing was applied to the instance, not to the class — the twin-check
      shape, recorded in this programme's own memory.

      GRADED RATHER THAN LISTED, because a report naming every call site would be WRONG and two
      of the three first suspected turned out guarded:
      `:317` `d["baseRefOid"].startswith(sh("git","rev-parse","origin/main")[:8])` — a failed
      rev-parse gives `""[:8] == ""` and `str.startswith("")` is UNCONDITIONALLY TRUE, so
      `baseRefOid_agrees` cannot be False. MITIGATED and deliberately so: `decide()` reports it
      BESIDE CHECK2 and its comment says it is not the check. It misleads a reader; it passes no
      gate.
      `:68` `behind = int(sh("git","rev-list","--count", ...) or "0")` — a failed rev-list gives
      `behind = 0`, reading as "branch current". Narrowed by `current` also requiring
      `merge-base --is-ancestor`, whose rc IS checked, so a git-wide failure reds. The live
      window is rev-list failing while merge-base succeeds.
      `:600` the required-context list — NOT an exposure, checked and refuted: CHECK1 is
      `bool(REQUIRED_CONTEXTS) and set(required) == set(REQUIRED_CONTEXTS) and not missing`, so an
      empty list fails the set equality and is reported as `absent_from_api`. The empty case is
      guarded on purpose, and it is the pattern the other sites want.

      AND THE REASON ITS OWN TESTS CANNOT SEE IT, which makes the red-first cheap. `merge_gate.py`
      IS tested — a CI-wired `--self-test` (ci.yml:580) proven potent by mutation against three
      named failure modes, plus `test_merge_gate_callsite.py` (ci.yml:588). But the self-test
      BUILDS ITS OWN REPOSITORY with a known shape, deliberately, because an earlier version read
      the ambient repo and passed locally while failing in CI — and in that fixture EVERY GIT
      COMMAND SUCCEEDS. A fixture that guarantees the subprocess works cannot discriminate "the
      subprocess failed" from "it returned nothing". So the new scenario is the EXISTING fixture
      with a command made to fatal, asserting a REFUSAL.

      DO NOT LAND THIS IN A RELEASE WHOSE OWN MERGES RUN THROUGH THIS GATE without the oracle
      first. v0.80 deliberately did not: the defect was found at its cut, PR #1473's verdict was
      hand-checked instead (rev-list rc=0 returning 0, merge-base rc=0, baseRefOid equal to
      origin/main, contract_size 9 — a genuine reading), and the change was deferred rather than
      made to the instrument mid-measurement.

      REFUTING COMMAND: `sed -n '45,47p' scripts/merge_gate.py` and
      `grep -n 'sh(' scripts/merge_gate.py | grep -v 'def sh'`. If `sh()` reads a returncode, this
      premise is dead. Then `python3 scripts/merge_gate.py --self-test` — if it already exercises a
      failing subprocess, the coverage half is dead too.
    tags:
      - process
      - gate
      - release
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1474"
      verification-track: manual
      done-when: "contains:scripts/merge_gate.py:sh() ITSELF raises on a non-zero exit"
      verified-by: >-
        DELIVERED. `sh()` raises `CommandFailed` on a non-zero exit, the one deliberately tolerant
        site is named at the site, the `startswith("")` tautology is gone, and the hermetic
        self-test now carries a scenario in which a real git command FATALS and the gate REFUSES.
        THE RED-FIRST, MEASURED BOTH WAYS on the same file. Post-fix `--self-test` is 0 failures.
        The SAME file with only `sh()`'s body reverted to the pre-fix one-liner is 2 FAILURES, and
        the failure text is the finding: `SHEXIT: sh() ITSELF raises on a non-zero exit — ... the
        gate REFUSES instead of returning a verdict — returned (False, 0) from a command that
        exited 128`. Not an error: a TUPLE the caller reads as data, whose `behind == 0` is the
        "not stale" answer, produced by `git rev-list --count` that computed nothing.
        BOTH PAIRED CONTROLS STAY GREEN IN BOTH CONFIGURATIONS, which is what attributes the two
        reds to the property rather than to the fixture: `sh()` on a SUCCEEDING command still
        returns stdout (a helper that raised on success would be an outage, not a fix), and
        `sh_unchecked` still tolerates the same failure silently.
        THE SECOND FAILURE MODE WAS WORSE THAN THE REPORT SAID, and it is measured rather than
        reasoned: at the `baseRefOid` site a failing `rev-parse` gives `""[:8] == ""` and
        `str.startswith("")` is True for every string, so `base_agrees` was a reported boolean that
        could not be False. It now compares FULL 40-character shas — both sides are full by
        construction (gh prints `baseRefOid` in full, `rev-parse` prints in full), checked against
        live PR #1480 where both are 40 characters and the old and new shapes agree.
        AN HONEST NON-RESULT, recorded because it cost one iteration and is the release's own theme
        one level in. Hardening `branch_currency` to refuse EMPTY output as well made the
        downstream assertion non-discriminating: two guards over one input mean a `CommandFailed`
        out of `branch_currency` is no longer attributable to `sh()`, since either layer produces
        it. So the exit-code contract is now pinned AT the helper, where only `sh()` can satisfy
        it, and the comment beside it says why. Defence in depth weakened the proof before it
        strengthened the code.
        AND A FAILED POSITIVE CONTROL THAT WAS A HARNESS BUG, NOT A RESULT: the first red-first run
        printed NO SHEXIT lines at all. The cause was running the reverted copy from `/tmp`, where
        `merge_gate.py` cannot import its `ci_pool_tripwire` sibling — a `ModuleNotFoundError`
        reported as "the scenario does not red" would have been this release's theme committed by
        the lane that exists to close it. Re-run beside its sibling, it reds.
        THE WHOLE CALL-SITE POPULATION IS NOW CHECKED, not just the one the report led with: SIX live
        sites, derived by excluding the definition, the docstring and the self-test — `:118`
        (`rev-list --count`), `:373` and `:736` (`gh pr view` -> `json.loads`), `:389`
        (`rev-parse origin/main`), `:743` (`git fetch refs/pull/N/head`) and `:755` (the
        required-contexts read). The first draft said FIVE and omitted `:755`, which is the very
        site the description had discussed. None needed tolerance — a failed `gh pr view` previously
        produced `json.loads("")` and an ugly traceback, and now produces GATEREFUSED exit 2, which
        `merge_ritual.sh` already reads. `CommandFailed` joins `GateRefusal` in `main()`'s handler,
        so a failed command can never reach the `GATEOK` print.
        NOT LANDED INTO A LIVE MEASUREMENT: written in an isolated `git worktree`, because
        `merge_ritual.sh` executes `scripts/merge_gate.py` FROM THE REPO ROOT on every poll, so
        editing it in the main checkout while #1480's ritual was waiting would have fed
        half-finished code to the gate judging another PR. The v0.80 deferral in this artifact's
        own premise was made for the same reason; this is that deferral honoured.
        BOTH CI STEPS OVER THIS FILE PASS: `--self-test` (ci.yml:617) 0 failures, and
        `test_merge_gate_callsite.py` (ci.yml:625) 0 failures. The first draft cited 583/591, which
        were correct at v0.80.0 and are mid-sentence comment lines at this commit — a line number is
        a fact about a tree, so it has to be re-derived in the tree being shipped.
