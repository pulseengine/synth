artifacts:
  - id: RQ-81-RUNNERBLAME
    type: system-req
    release: v0.81
    status: proposed
    title: "A REQUIRED check reddened by a runner that never ran a step is indistinguishable from a content failure"
    description: >
      A self-hosted runner failed every job it picked up with ZERO steps recorded, and reddened
      the REQUIRED `Rivet Validation` check on a PR whose content was clean. The signature is
      unambiguous once you look for it and invisible if you do not: a passing `Rivet Validation`
      takes ~16 seconds and records 11 steps; the failing one burned 10 minutes and recorded NONE,
      so it never reached the rivet commands at all. The failure is the runner, not the diff.

      THE SCOPE IS SYNTH'S SIDE OF IT, DELIBERATELY. This lane does NOT ask infra to route around
      a runner, does not disable a required check, and does not retarget one — retargeting a
      REQUIRED check is recorded as NOT SAFE. The maintainer's recorded non-action on the
      neighbouring runner-health issue binds by analogy: silencing a detector is not fixing a
      fault. What this lane owes is ATTRIBUTION — the merge ritual must be able to say "this red
      is the runner" with evidence, rather than an operator reasoning it out each time from a
      duration and a hunch.

      WHAT THAT MEANS CONCRETELY: `steps == 0` on a job whose sibling runs on other PRs record a
      consistent step count is derivable from the Actions API, and the merge ritual already reads
      check runs by name and derives run ids from `details_url` (it cannot trust
      `gh run list --commit SHA`). A ritual that reports `RUNNER-SUSPECT <job> steps=0 runner=<name>
      (siblings record N)` beside its CHECK3 verdict turns a recurring half-hour of manual
      forensics into a line of output — and, importantly, does NOT auto-merge past it. The red
      stays red; what changes is that the operator is told where to look.

      THE FAILURE MODE TO AVOID IS THE OBVIOUS ONE: a rule that treats `steps=0` as benign would
      let a genuinely broken job through. The verdict is ADVISORY DIAGNOSIS, never a merge
      permission, and the lane must demonstrate that it does not relax CHECK3.

      REFUTING COMMAND: pick a recent REQUIRED check failure and ask the API for its steps —
      `gh api repos/pulseengine/synth/actions/runs/<id>/jobs --jq '[.jobs[] | {name, conclusion,
      runner_name, steps: (.steps|length)}]'`. If every failing job records a non-zero step count,
      the signature is absent from current history and the lane must say so rather than building a
      detector for a shape it cannot demonstrate.
    tags:
      - process
      - ci
      - gate
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1451"
      disposition: refuted
      verification-track: manual
      done-when: "manual:2026-11-30 REWRITTEN AT DELIVERY because the premise was REFUTED by this lane's own refuting command: the steps=0 signature is absent from current history, so a detector for it cannot be red-first gated and must not be built. What is required instead is the REFUTATION recorded with its numbers (failed jobs examined, steps==0 count, the window, and 01-5's own failed-job count), the issue's own stated refuting observation shown SATISFIED by a named job id, and the surviving observation — that a steps=0 failure is indistinguishable from a content failure in the default `gh pr checks` view — stated as still-true-but-not-demonstrable rather than silently dropped"
      verified-by: >-
        REFUTED, by this lane's own refuting command, and the issue refuted ITSELF by the criterion it
        wrote down. #1451's body says: "Refuting observation: any job completing successfully on
        `pulseengine-ci-01-5`, with steps > 0. One such job and this diagnosis is wrong." That job exists.
        THE MEASUREMENT, two independent ways rather than one lucky sample. Job 110992202896 on
        pulseengine-ci-01-5 at 2026-10-02T19:21:49Z: conclusion=success, 11 steps, and it reached the
        compiler — step 4 `Record the resolved toolchain (RQ-80-TOOLCHAIN)` and step 6 `Run clippy` both
        succeeded at rustc 1.99.0. Then the whole recent window, because one job proves only one job: over
        100 runs spanning 2026-10-02..2026-10-07, 31 failed, and across those 231 FAILED JOBS the count of
        jobs recording steps==0 is ZERO. 01-5 contributed SIX of those failed jobs and every one records
        steps. So this is NOT "01-5 went quiet so we cannot tell" — it is actively serving work and failing
        some of it, and none of it exhibits the shape.
        WHAT IS REFUTED IS THE GENERALISATION, NOT THE ORIGINAL OBSERVATION. The two steps=0 jobs that
        motivated the filing were real and remain in the record (`Rivet Validation` and `Rust-test Line
        Coverage`, both on 01-5, both zero steps). What is false is "01-5 is wedged" and "every future job
        assigned to it fails the same way and the steps=0 count on it keeps rising". It recovered; the count
        stopped at two.
        SO NO DETECTOR WAS BUILT, AND THAT IS THE DELIVERABLE. A RUNNER-SUSPECT diagnosis gated on steps==0
        cannot be red-first proven against a history that contains no instance, and this programme's own rule
        is that a gate which cannot be shown to fire is the gate-that-cannot-fail class. Building it anyway
        would have produced an untestable check plus a sentence claiming it works. The refuting command asked
        for exactly this outcome in advance: "if every failing job records a non-zero step count, the
        signature is absent from current history and the lane must say so rather than building a detector for
        a shape it cannot demonstrate."
        THE OBSERVATION THAT OUTLIVES THE DIAGNOSIS, recorded so it is not lost with the refutation: a
        steps=0 failure is still indistinguishable from a content failure in `gh pr checks`, which reports
        only `fail`. The step count is what separates them and it is not in the default view. That gap is
        real independently of whether any runner is currently wedged, and it is NOT demonstrable today, so it
        is stated as an open observation rather than converted into a lane.
        AND ONE CONSEQUENCE FOR THE ISSUE, which is deliberately NOT acted on here. #1451 stays OPEN. A
        refuted lane is not a delivery, so `issue_closure_check` would read any closure as unauthorised — the
        precise failure that #1430 describes and that RQ-81-R11CONFLICT carries. Closing it to tidy the board
        would manufacture that failure. The measurement is posted on the thread instead, so the stale
        diagnosis is corrected where a reader will meet it.
