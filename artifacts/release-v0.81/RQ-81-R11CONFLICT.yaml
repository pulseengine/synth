artifacts:
  - id: RQ-81-R11CONFLICT
    type: system-req
    release: v0.81
    status: implemented
    title: "Two committed gates give CONTRADICTORY instructions for a refuted artifact — neither is wrong on its own terms"
    description: >
      `issue_closure_check.py` and `status_evidence_check.py` R11 instruct the operator to do
      opposite things about one artifact, and following either one reds the other. Found by
      running BOTH at the v0.77 cut rather than trusting a green history.

      THE SHAPE. #1243 is CLOSED and was fixed in v0.66.0. v0.77 scoped it as a `must`, found it
      already delivered, and RQ-77-FLOORREGEX records `disposition: refuted`. Then:
      `issue_closure_check` says `CLOSED BUT NOT AUTHORISED` and instructs "Reopen it, or name it
      in the artifact that delivered it". Taking the second remedy — flipping the artifact to a
      claiming status so it "names" the delivery — gives
      `R11 ... status implemented claims the outcome holds but disposition: refuted says it does
      not — pick one`. R11 IS RIGHT: an artifact that delivered a refutation must not claim the
      outcome holds. So the gate that wants a claiming status and the gate that forbids one are
      both correct, and the operator is left to choose which gate to lie to.

      WHY IT IS A `should` AND NOT A `must`: it is a correctness defect in the release machinery
      with no user-visible effect, and it fires only on the narrow combination "issue closed, fix
      shipped in an EARLIER release, artifact refuted in a LATER one". But that combination is
      becoming common — this programme ships refutations deliberately — and an operator forced to
      pick a gate to lie to will eventually pick the wrong one.

      WHAT A FIX LOOKS LIKE, named without being prescribed: `issue_closure_check` already has an
      `issue-scope` vocabulary and `prior_attribution` (built from every earlier release, added by
      v0.80's CLOSEGATE lane). A third remedy — "an earlier release accounts for it, and the later
      artifact records a refutation" — is derivable from data both gates already have. The fix must
      not be "loosen R11": R11's rule is the correct one.

      NOTE THE QUOTING HAZARD, which has fired for real. `issue_closure_check`'s own vocabulary is
      `CLOSED BUT NOT AUTHORISED` / `HELD OPEN BY vX.Y BUT CLOSED`, so quoting its output NEXT TO a
      bare issue reference ARMS GitHub's closer. Any commit message, PR body or issue comment in
      this lane must BREAK THE ADJACENCY.

      REFUTING COMMAND: `python3 scripts/issue_closure_check.py --release v0.77.0 --since-tag
      v0.76.0 --allow-unclosed` and `python3 scripts/status_evidence_check.py`. If the first no
      longer reports a non-authorised closure for that release, v0.80's CLOSEGATE work already
      resolved it and this premise is dead — check BEFORE building on it.
    tags:
      - process
      - gate
      - traceability
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1430"
      verification-track: manual
      done-when: "contains:scripts/issue_closure_check.py:THE MOST RECENT DECISION GOVERNS"
      verified-by: >-
        DELIVERED, BOTH DIRECTIONS, AND R11 IS UNTOUCHED. Running BOTH gates at the v0.77 cut now
        gives ONE consistent remedy: `issue_closure_check` 0 failures and `status_evidence_check`
        exit 0 on the same tree. Before: 8 failures and 1 respectively, with no way to satisfy both.
        DIRECTION 2, THE NAMED CONFLICT, IS ONE EXPRESSION. `authorised_close_set` read
        `held_open if iscope == "outlives" else (authorised if status in CLAIMING else None)`, so a
        non-claiming artifact could only reach `authorised` by claiming — which R11 correctly reds
        beside `disposition: refuted`. A third branch now authorises a REFUTING artifact that also
        declares `issue-scope: closes`, no claiming status required. RQ-77-FLOORREGEX declares it
        and #1243 is authorised; R11's rule is not altered by one character.
        SCOPED TO `refuted` ONLY, with the controls to prove it: `deferred` and `partial` beside
        `closes` authorise NOTHING, a refutation ALONE authorises nothing, and `outlives` still
        outranks the new branch. Those four controls pass against the pre-fix gate too, which is
        what attributes the single red to the new rule rather than to the fixture.
        THE REMEDY AS THE ARTIFACT SKETCHED IT DOES NOT WORK, measured rather than assumed. This
        artifact proposed deriving it from "an earlier release accounts for it". `prior_attribution`
        at v0.77 covers 73 issues and #1243 is NOT among them — and the reason is structural, not an
        oversight: #1243 WAS FILED AFTER v0.66.0 SHIPPED THE FIX, so no earlier artifact could ever
        have named it. A remedy that cannot fire on the case it was written for is not a remedy, so
        the shipped one is an EXPLICIT declaration instead.
        DIRECTION 1 TURNED OUT TO BE A WINDOW BUG, and finding that changed the fix. `closed_since`
        built `closed:>={tag}` with NO UPPER BOUND, so auditing a release that is already history
        swept in every LATER release's closure wave. Of the 8 failures at v0.77.0, SEVEN — #1431,
        #1435, #1440, #1454, #1456, #1459, #1461 — are named by delivered artifacts in v0.78, v0.79
        and v0.80 and were closed by THOSE rituals. They were never v0.77's closures. This is the
        SAME defect `prior_attribution` patches at the LOWER edge, which is the strongest evidence
        it is a real one: the window had a model of when closures happen at one end and none at the
        other. The upper edge is now DERIVED as the release tag above the audited one.
        IT CANNOT NARROW THE LIVE GATE, and the reason is structural rather than careful: for the
        release being CUT there is no tag above it, so the bound is open and the behaviour is
        identical. MEASURED on the invocation the tag ritual ACTUALLY makes, which
        `scripts/tag_release.sh:149` fixes as `--release "$VER" --since-tag "$VER"
        --allow-unclosed`: 0 failures before and after the change.
        THE FIRST DRAFT NAMED THE WRONG COMMAND AND ROUND 2 CAUGHT IT. It cited
        `--release v0.81.0 --since-tag v0.80.0` with "0 failures", and that command yields FOUR
        failures at rc=1 — they are `AUTHORISED BUT STILL OPEN` warnings promoted to failures because
        `--allow-unclosed` was omitted. The INVARIANCE claim holds either way (identical counts with
        the old and new script), but a failure count without its invocation is not a measurement —
        which is what this artifact says two paragraphs further down, about a different number. The authorised COUNT is not an invariant and the first draft quoted it as one: it
        said "1 authorised / 5 closed", measured before this release's other lanes recorded their
        verdicts. At the cut it is 4 authorised / 2 held open / 5 closed — the two held open are the
        issues declared to outlive their artifacts. What is unchanged by the window bound is the
        FAILURE count, which is what the non-weakening claim is about.
        `later_attribution` SHIPS TOO, AND IT IS NOT REDUNDANT. The window bound removes those
        closures from the population; attribution EXPLAINS them when an operator widens the window
        on purpose, which is exactly how all 8 were found. Both paths verified on the same tree:
        bounded gives 6 closed / 0 failures, `--until-tag none` gives 13 closed / 0 failures.
        THE PRECEDENCE BUG I SHIPPED IN MY OWN FIRST DRAFT, recorded because it is the very failure
        this lane exists to remove and it took real history to catch. The draft let ANY later refusal
        outrank ANY later authorisation. v0.78 declared `issue-scope: outlives` on #1440 and v0.80
        then DELIVERED it (RQ-80-RITUAL3) — hold open, continue, deliver, close is the normal
        progression — and the draft emitted "Reopen it" for a correctly-closed issue. That would have
        been this file's FOURTH near-reopening, caused by the fix for the third. Corrected to
        ascending, so the two functions differ in ONE CHARACTER, `>` where the other has `<`.
        AND THE SAME BLINDNESS ONE LEVEL IN, found by auditing every release rather than the one in
        the report: the `HELD OPEN BUT ALREADY CLOSED` mirror loop did not consult the later set
        either, so auditing v0.78.0 demanded a reopening of #1440 whose work shipped in v0.80. A
        hold-open is a statement about one release's scope, not a promise for all time. Every release
        v0.77.0 through v0.81.0 now audits with 0 failures; v0.78.0 alone went from 6 to 0.
        RED-FIRST, MEASURED PER HALF so each number is attributable. Reverting ONLY
        `status_evidence_check.py`: 1 failure, the third-remedy assertion, with all four controls
        still green. Neutering `later_attribution` to return `{}` while keeping everything else: 10
        failures across both forward directions — and that figure was UNREPRODUCIBLE AS STATED,
        because it did not name the invocation. Re-derived per invocation with `later_attribution`
        returning `{}`: v0.77.0 widened 7 failures, v0.78.0 widened 6, v0.78.0 bounded 1, every other
        bounded audit 0. The claim the sentence needs is that the forward directions are covered,
        which holds at 7; a failure count without its invocation is not a measurement. Full fix: 0
        failures across all of them, and the sibling suite
        `test_status_evidence_check.py` is 119 tests OK.
        AN HONEST NOTE ON ONE ASSERTION'S POTENCY: `later_attribution is EMPTY for the release being
        cut` stays GREEN against the neutered probe, because `{}` trivially satisfies it. It pins the
        non-weakening property against a FUTURE change to the version comparison, not against this
        one, and saying so is better than counting it among the ten.
        AN EXISTING TEST WAS REPAIRED, NOT DELETED, and the distinction matters. "a LATER release's
        artifact does not attribute" asserted the property by checking that CLOSED BUT NOT AUTHORISED
        fires — conflating the property with one verdict. The property is that the later artifact must
        not land in the AUTHORISED map; it is now asserted on that map directly, where no rewording
        can make it vacuous, with a comment recording why the verdict moved to a warning.
