artifacts:
  - id: RQ-81-WIDEFILE4
    type: system-req
    release: v0.81
    status: implemented
    title: "Root-cause the vfp-wide-file SIGN error before re-adding the pool-grow retry v0.78 built and reverted"
    description: >
      CARRIED from v0.78/v0.79/v0.80. The wide-file ladder rung is the only rung with no
      pool-grow retry, because v0.78 BUILT the retry (~20 lines), measured it on its own
      execution oracle, found the newly-accepted code SIGN-WRONG, and reverted. Re-adding the
      retry without a named cause would ship a silent miscompile to buy a reach number — the
      exact trade this project exists to refuse.

      ONE MECHANISM IS ELIMINATED, by v0.80, and it is eliminated rather than merely
      unsupported. The VABS-instead-of-VMOV hypothesis is DEAD: `VMOV.F32 Sd,Sm` is
      0xEEB00A40 and `VABS.F32 Sd,Sm` is 0xEEB00AC0, a difference of bit 7 — and for a VFP
      TWO-REGISTER op the register fields are D=bit22, Vd=15:12, M=bit5, Vm=3:0, so bit 7 is
      STRUCTURALLY UNREACHABLE from any register field. A wrong register number cannot produce
      a VABS. The positive control came back empty and the REASON WAS THE RESULT.
      (For a three-register op bit 7 IS the N qualifier; that is a different encoding class and
      does not rescue the hypothesis.)

      CANDIDATES, listed WITHOUT assertion because this artifact has already been wrong about
      a mechanism once: the selector choosing a different op; `F32Copysign`'s expansion, which
      really does use VABS at `crates/synth-backend/src/arm_encoder.rs:7310` but may not be
      reached by the product nest; a spill/reload of the wrong frame slot. Each is a
      hypothesis to be killed or confirmed by reading EMITTED BYTES, not arms.

      WHAT WOULD SETTLE IT: re-apply v0.78's retry on a scratch branch, run
      `scripts/repro/vfp_local_pressure_1069_differential.py`, and DISASSEMBLE the
      newly-accepted function rather than inferring from the differential's verdict. A
      narrowing owes EXECUTION evidence — "it compiles now" is a fact about the validator.

      THE TRIPWIRE IS ALREADY ARMED and must stay armed:
      `wide60_declines_and_the_ladder_dies_on_the_wide_file_rung_1426` reds the moment stage 3
      gains a grow retry, so a future reach grab cannot land silently. Do not weaken it to
      make room; move it in the same PR with a written reason, or leave it.

      THE REACH ON OFFER IS SIX LOCALS, wall 60 -> 66 — not twelve. Stating the real figure is
      part of the lane, because an inflated one is how a silent miscompile gets justified.

      REFUTING COMMAND: `grep -n "wide60_declines" -r scripts/ tests/ crates/` and
      `git log --oneline -S"pool grow retry" -- crates/synth-backend/` . If the tripwire is
      gone, or a retry has landed since, this premise is dead — check BEFORE building on it.
    tags:
      - bug
      - carried
      - reach
      - vfp
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: software
      priority: must
      issue: "#1439"
      # The lane's scope was "root-cause it, OR state plainly what was killed and
      # how" — delivered: two more mechanisms are dead and one candidate remains.
      # The ISSUE is that the rung emits SIGN-WRONG CODE, and that is still true:
      # the cause is not named, the pool-grow retry was deliberately not re-added,
      # and the wide60 tripwire is still armed. Closing it would claim a fix that
      # does not exist, so the issue outlives this artifact's delivery.
      issue-scope: outlives
      verification-track: manual
      done-when: "contains:scripts/repro/vfp_local_pressure_1069_differential.py:discriminator for #1439, not decoration"
      verified-by: >-
        REFUTED: the MECHANISM CLASS is settled — the sign loss is an ABS, not a NEG — and one
        mis-encoding route is dead. The cause is NOT named, the EMITTER is NOT identified, the retry
        is NOT re-added, and #1426 remains a silent miscompile held behind a decline.
        THIS VERDICT WAS WEAKER THAN ITS FIRST DRAFT, which claimed "the three candidates are now
        ONE". Round 1 of the cold review falsified the enumeration that claim rested on, and the
        correction is recorded here rather than quietly adjusted: see WHAT WAS WRONG below.
        THE DISCRIMINATOR WAS ALREADY IN v0.78's OWN DATA AND NOBODY HAD READ IT AS ONE. That is the
        finding. The failure is `got ^ want == 0x8000_0000` with magnitudes BIT-IDENTICAL, so exactly
        one factor's sign is wrong — 60 factors share the parameter's sign, 60 is EVEN, the true
        product is POSITIVE, and an odd number of sign contributions is what produces the observed
        negative. Only two operations do that with the magnitude untouched: an `abs` (clears the
        sign) or a `neg` (flips it). For a NEGATIVE input the two are INDISTINGUISHABLE —
        `abs(-x)` and `neg(-x)` both give `+x`.
        SO THE POSITIVE ROWS DECIDE IT, and the oracle already had seven of them. `VALS` holds 7
        positive and 6 negative values, and v0.78 recorded the failing set as EXACTLY the six
        negatives — `-0.0, -1.0, -0.25, -3.14159265, -1e30, -inf` — with no positive row failing. A
        `neg` would have corrupted the positives too. It is an ABS. The mechanism class is settled
        from data that was sitting in the record for three releases.
        AND THE 2-REGISTER MIS-ENCODING ROUTE DIES, checked rather than assumed. If an `abs` is
        executing, either a `VABS` is genuinely emitted or a `VMOV` is MIS-ENCODED into one.
        `VMOV.F32 Sd,Sm` is 0xEEB00A40 and `VABS.F32 Sd,Sm` is 0xEEB00AC0, a difference of bit 7,
        and for a 2-REGISTER VFP op bit 7 is opc3, not a register field — v0.80 established that a
        wrong register NUMBER cannot reach it. What v0.80 did not check is whether the ENCODER puts
        a register there by a transposed shift. It does not: all three `VMOV.F32 Sd,Sm` emitters
        (`arm_encoder.rs:2416`, `:7257`, `:7274`) use `(n << 5)`/`(m << 5)`, and the shared
        `encode_vfp_2reg` (`:9059`) builds `base | (d << 22) | (vd << 12) | (m << 5) | vm` — bit 7
        untouched on every 2-register path.
        SCOPED TO 2-REGISTER OPS, AND THE FIRST DRAFT WAS NOT. It said "every `<< 7` in that file is
        an A32 shift-immediate, a different encoding class". That is FALSE and was self-refuting,
        because this artifact's own description already concedes that for a THREE-register op bit 7
        IS the N qualifier. MEASURED: 43 lines in `arm_encoder.rs` contain `<< 7`, and at least NINE
        are VFP register fields — `:7617` is literally `(n << 7) | (m << 5)`. The claim that
        survives is the narrow one about the 2-register encoder, which is the only one the argument
        needs; the sweeping version was an unforced error in the load-bearing step.
        WHAT SURVIVES is a genuinely emitted `VABS`, and the CANDIDATE SET IS NOT NARROWED TO ONE.
        The first draft said the sole scalar-f32 `VABS` emitter is the `F32Copysign` expansion at
        `arm_encoder.rs:7305-7311`. MEASURED, and false: `0xEEB00AC0` occurs THREE times —
        `:1992` and `:6322`, both lowering `ArmOp::F32Abs` (a first-class selector op, on two
        different encoder paths), and `:7310` inside the copysign expansion. `ArmOp::F32Abs` is the
        more plausible emitter of the two by a wide margin, and the first draft did not mention it.
        AND THE SOURCE CONTAINS NO abs AT ALL, which makes the question sharper rather than
        answered. `scripts/repro/vfp_local_pressure_1069.wat` has ZERO `f32.abs`, ZERO
        `f32.copysign` and ZERO `f32.neg` against 71 `f32.mul`. So whatever emits the abs emits it
        with NO source operator to justify it — none of the three emitters should be reachable from
        a pure product nest. "Three candidates become one" is WITHDRAWN: what is settled is the
        mechanism CLASS, not its site.
        TWO CANDIDATES REMAIN EXCLUDED, and for a reason the enumeration error does not touch: the
        selector choosing a different op, and a spill/reload of the wrong frame slot, are both ruled
        out by the magnitude being BIT-IDENTICAL — either would move magnitude bits, not only the
        sign bit.
        NOT REACHED, STATED PLAINLY: whether the copysign expansion is actually emitted in the
        wide60 nest. That needs v0.78's retry re-applied on a scratch branch and the newly-accepted
        function DISASSEMBLED, which this lane did not do. A narrowing owes execution evidence and
        this one has none — the candidate is identified by elimination and by the only available
        emitter, not by a byte read.
        THE DISCRIMINATOR IS PINNED SO IT CANNOT BE LOST, which is the shippable part. The
        conclusion rests entirely on `VALS` spanning both signs, and nothing said so — a future edit
        trimming it to "the interesting cases" would delete the evidence silently. The differential
        now ASSERTS at least four values of each sign with the reasoning written beside it.
        NEGATIVE-CONTROLLED: with the positive rows removed it fails with `Got 0 positive and 6
        negative`, rc=1.
        THE TRIPWIRE IS STILL ARMED AND THE RETRY IS STILL ABSENT, re-verified rather than recalled:
        `git log -S"pool grow retry" -- crates/synth-backend/` is EMPTY, `wide60_declines_and_the_
        ladder_dies_on_the_wide_file_rung_1426` is present and the suite is 10/10 green. Nothing was
        weakened to make room.
        THE REACH ON OFFER IS SIX LOCALS, wall 60 -> 66, restated because the artifact asks for the
        real figure and an inflated one is how a silent miscompile gets justified.
