artifacts:
  - id: RQ-81-LADDER3
    type: system-req
    release: v0.81
    status: proposed
    title: "The acceptance ladder is sixteen releases stale — reach still has no live number"
    description: >
      CARRIED from v0.78/v0.79/v0.80, undelivered three times for the SAME reason, which is
      stated here rather than rediscovered. `docs/status/ACCEPTANCE_LADDER.md` is headed
      "Acceptance ladder — v0.63", measured 2026-09-06 at `e3a09ac2`. CLAUDE.md's own rule:
      "If the ladder predates the build being compared, re-measure before publishing." So
      every statement about synth's reach made today is a statement about a tree from
      2026-09-06, and the compliance envelope requires the acceptance rate beside any
      performance comparison, per rung, with its date and commit.

      THE BLOCKER IS ENVIRONMENTAL, NAMED, AND NOT A CODE PROBLEM. The 243-module corpus is
      EXTERNAL to this repo, last known at `/Volumes/Work/corpora/wasm-243`. `/Volumes/Work` is
      not mounted; `mac.fritz.box` resolves and port 22 is OPEN but returns
      `Permission denied (publickey,password,keyboard-interactive)`. ATTEMPTING PASSWORDS STAYS
      DECLINED. The provenance half was already fixed by v0.78 — the ladder header and
      `partial_census_1017.py --help` both now say the corpus is external and name its last
      known absolute path — so the next attempt is cheap, and what remains is a human action.

      WHAT THIS LANE OWES, given it cannot measure: either the measurement (if the volume
      becomes reachable), or the human action NAMED precisely enough to be performed —
      which key to install where, or which host to mount — rather than a fourth repetition of
      "blocked". A `must` artifact blocked four releases running on an unstated action is the
      accumulation shape this project keeps having to correct.

      THE REACH FLOOR STAYS UNPINNED while the ladder is stale, and the reason is recorded
      rather than omitted: pinning a floor at the v0.63 figures pins a number measured sixteen
      releases ago, and pinning a cost CEILING alone would let a release buy cost wins with
      reach losses and stay green.

      AND ONE HONESTY REQUIREMENT THE FILE ALREADY MEETS: a rung that CANNOT move is labelled
      structurally inert, never reported as a measured `+0`. The `+no-optimize` rung is in that
      state — every ladder invocation passes `--relocatable`, which forces the direct selector.

      REFUTING COMMAND: `head -8 docs/status/ACCEPTANCE_LADDER.md`, then
      `ls -d /Volumes/Work 2>&1`, then
      `git tag --list 'v0.*' --sort=creatordate | awk 'f;/v0.63.0/{f=1}' | wc -l`. If the
      volume is mounted, the block is gone and the lane is a measurement; if the header names a
      recent release, this premise is dead.
    tags:
      - process
      - carried
      - reach
      - measurement
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: must
      issue: "#1432"
      verification-track: manual
      done-when: "manual:2026-11-30 either the ladder is re-measured on the shipping tree by the committed tool with its own date and commit, or the lane names the SPECIFIC human action that would unblock it (which key installed where, or which host mounted) rather than restating 'blocked', and records that the reach floor stays unpinned with the reason"
