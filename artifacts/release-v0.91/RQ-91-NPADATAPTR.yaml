artifacts:
  - id: RQ-91-NPADATAPTR
    type: system-req
    release: v0.91
    status: proposed
    title: "A memory-0 address stored in a data segment is relocated, or the module is refused, under the native-pointer ABI"
    description: >
        SILENT MISCOMPILE, gale's first-ranked ask. Under
        --relocatable --native-pointer-abi on ARM, memory 0 is native
        (R11 = 0) and its statics are reached through relocations, but
        initialised data is copied verbatim, so a pointer word stored
        in a data segment (a `&'static str` in a static, a vtable, a
        function-pointer or data-pointer table) still holds a wasm
        address. Code that loads that word and dereferences it reads
        the raw absolute address. The compile exits 0 with no
        diagnostic. Neither existing native-pointer guard sees it: the
        #1568 shape-2 refusal needs a non-zero constant memarg offset
        and the #1604 straddle guard judges constant addresses.
        Delivered through RQ-91-NPAMODEL, not as one more per-shape
        check.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact.
        A refutation is a legitimate outcome, reported with numbers:
        the issue's minimal repro, `(module (memory 5376 (pagesize 1))
        (data (i32.const 0x1000)
        "\11\22\33\44\55\66\77\88\04\10\00\00") (func (export
        "anchor") (result i32) (i32.load (i32.const 0x1000))) (func
        (export "tbl") (result i32) (i32.load (i32.load (i32.const
        0x1008)))))`: compile with `synth compile x.wat -o x.o
        --target cortex-m3 --all-exports --relocatable
        --native-pointer-abi`, then execute every export with Linked
        and run_shape2 from
        scripts/repro/npa_const_addr_differential.py (R11 = 0) against
        wasmtime (a wasmtime Config with wasm_custom_page_sizes on,
        for the pagesize-1 memory). If tbl() returns 0x88776655 or the
        compile refuses with a named diagnostic, it is gone.

        MEASURED 2026-11-08 on main 2945628c (the v0.90.0 tag commit),
        synth 0.90.0 debug build from this tree: LIVE. Compile rc 0,
        no diagnostic, 2 static-data ABS32 relocations. anchor()
        returns 0x44332211, equal to wasmtime (the positive control).
        tbl() faults on an unmapped read (UC_ERR_READ_UNMAPPED; the
        word at 0x1008 is 0x1004, and with R11 = 0 nothing is mapped
        at that absolute address) where wasmtime returns 0x88776655. 1
        of 2 calls equal.

        CITATION: #1672 is where the matter was analysed. The number
        names where it was analysed, not an open scope.
    tags:
      - feature-loop
      - bug
      - wrong-code
      - gale
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1672"
      verification-track: manual
      issue-scope: closes
      done-when: >
        manual:2027-03-31 a module whose memory-0 data segment holds a
        word that is dereferenced as a memory-0 address under
        --native-pointer-abi either executes equal to wasmtime or is
        refused loudly with a named diagnostic, gated by an execution
        differential red before and green after with the anchor
        positive control and a near miss, and with the newly refused
        count over the repo corpus stated — delivered with an
        execution-verified result where the lane is a wrong-code fix,
        or REFUTED with the measurement that refutes it; and the
        refuting command above is RUN FIRST and its result reported
        either way
