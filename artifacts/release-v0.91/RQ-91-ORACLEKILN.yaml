artifacts:
  - id: RQ-91-ORACLEKILN
    type: system-req
    release: v0.91
    status: implemented
    title: "A Rust execution-oracle harness with kiln as the reference engine, and its first oracle"
    description: >
        FOUNDATION LANE. Under the no-new-Python rule (2026-11-18) synth's
        execution oracles move to Rust, and the maintainer chose kiln,
        PulseEngine's interpreter, as the reference engine in place of
        wasmtime. This artifact delivers the reusable harness and ONE oracle
        that proves it. It ports no existing Python differential; each port
        is its own lane, gated by an equivalence test against the script it
        replaces.

        THE HARNESS, `crates/synth-oracle` (publish = false; a dependency of
        no crate, pinned in claims.yaml SYNTH-UNLINKED-LIBRARIES-1277):
        `reference` runs a wasm export on kiln (git dependency pinned by rev
        fa16dc8d, the commit tag v0.7.3 names) with fuel, an EXACT import
        resolver, and host functions whose calls are logged (an MMIO trace).
        A run returns values, a trap with kiln's code and a message class, a
        Budget, or an engine fault. `emulate` runs synth's compiled function
        under unicorn (Cortex-M0/M3/M4, RV32IMAC as SiFive E31) with AAPCS or
        ILP32 argument setup, seeded callee-saved registers and a balanced-SP
        check (gp and tp too on RV32), and asserts the CPU model it reads back.
        A stop is a TRAP only when the stop path AND the bytes agree on
        exactly the trap synth emits (Thumb `udf` T1; RV32 32-bit `ebreak`)
        AND the PC lies inside the function; any other fault, including
        `udf.w`, `c.ebreak`, `unimp` and `c.unimp` (0x0000, what zero padding
        decodes as), is ILLEGAL; budget overrun is its own outcome, and the
        instruction count is the only bound (no wall-clock timeout).
        WHAT IS COMPARED: return values and trap-versus-return only. So the
        harness REFUSES, with a typed error, what it would otherwise judge
        wrongly: a module with a linear memory (`CaseError::LinearMemory`;
        memory effects are not compared and the emulator image could not
        match kiln's data segments), an f32/f64 parameter or result
        (`EmuError::FloatAbi`, on every core: synth's cortex-m4f passes
        floats in S registers, and no soft-float convention is shown on real
        code), a function with a relocation, stack arguments and multi-value
        results. `compare` holds the value
        rule (i64 both words; NaN equals NaN, otherwise bit-equal) and the
        reference x emulator verdict matrix. `synth` drives the binary
        (`$SYNTH` or a cargo build) and reads function bytes from the ELF
        symbol table, never from disasm text. The engines sit behind the
        crate's `exec` feature, so `cargo test --workspace` builds neither.

        WHAT THE HARNESS FOUND ABOUT ITS OWN EMULATOR, measured here and
        pinned by the control legs: unicorn 2.1.x forces every
        `UC_MODE_MCLASS` CPU to Cortex-M33 whatever model is requested
        (unicorn-engine-sys 2.1.5, qemu/target/arm/cpu.c:2113). The readback
        assertion caught it on the first run (requested 8, read 11). The
        harness therefore uses plain Thumb mode plus the M-profile model,
        which reads back as requested. On RV32 unicorn adds 4 to the PC
        before the interrupt hook for every non-breakpoint exception
        (qemu/accel/tcg/cpu-exec.c), so `unimp` reported its successor; the
        first draft of the trap rule misclassified it as ILLEGAL and the
        trap-idiom control leg caught that too.

        COLD REVIEW 11 (FIX FIRST) AND WHAT CHANGED. F1: on cortex-m4f the
        harness read a float result from R0 while synth returns it in S0, so
        a planted wrong VFP instruction agreed; float signatures are now
        refused. F2: unicorn's wall-clock timeout thread reads a
        process-global clock that every engine init rewrites, and under
        concurrency it stopped healthy runs (52 spurious Budget stops in
        32,000 runs on 8 threads; 4 of 32 suite runs red); the timeout is
        gone, and a committed stress test runs the same 32,000 runs on 8
        threads and requires 0. F3: memory effects were not compared; such
        modules are refused. F4: six guards had no test that could red; each
        now has one. F5: RV32 accepted trap forms synth never emits,
        including `c.unimp` = 0x0000, so a zeroed body "trapped" and agreed;
        only `ebreak` is accepted now, with a zeroed-body control. F7: the CI
        grep is exact. F8: a looping start function now ends on the fuel
        budget, and the no-dependents pin catches the table and `package =`
        forms.

        The job lives in .github/workflows/oracle-kiln.yml, not ci.yml: ci.yml
        is at its size ceiling (a 514,837-byte ci.yml was rejected as a workflow
        file issue with 0 jobs, run 44505673142; 511,836 bytes still ran).
        THE CI JOB'S FIRST RUN (run 44587233237, runner
        pulseengine-ci-01-11) built unicorn and kiln on the pool, so the
        cmake/bindgen setup works there, and was CANCELLED at its 45-minute
        timeout: one sweep leg took 28 minutes. Measured cause, in an aarch64
        Ubuntu VM: kiln's `Module::from_kiln_module` ran once per CASE (~12 ms
        there, against microseconds for decode, instantiation and execution;
        the runner spent ~470 ms per case), and unicorn was a Debug C build.
        The fix caches the converted module per worker thread (every call
        still gets a fresh engine and instance, so no state crosses calls),
        runs kiln on one long-lived worker per calling thread, and builds
        unicorn, unicorn-engine and synth-oracle at opt-level 3 in the dev
        profile. The whole exec suite went from 123 s to 4.3 s on a Mac and
        runs in 14-20 s in a 4-CPU Linux VM. synth was not the cost (one
        compile per target per test, ~12 ms each) and stays a debug build.
        The sweep and the 8-thread stress test hold one lock, so they never
        overlap. The job's timeout is 25 minutes, derived from these
        measurements. Its first passing run on the pool is still to come.

        LICENCE, a maintainer decision (2026-11-18): unicorn-engine is
        GPL-2.0, accepted here as "GPL-2.0 in an unpublished test-only harness; never linked into the synth binary or any published crate". Recorded in deny.toml; the
        two facts it rests on (no dependents, publish = false) are pinned in
        claims.yaml SYNTH-UNLINKED-LIBRARIES-1277.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact:
        `SYNTH=./target/debug/synth cargo test -p synth-oracle --features
        exec -- --nocapture`. Any failing test, or a sweep line other than
        `ORACLE kiln-probe: 6048 cases agree across 2 legs, 72 trap/trap`,
        refutes it.
    tags:
      - feature-loop
      - oracle
      - verification
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1741"
      verification-track: execution
      issue-scope: outlives
      done-when: >
        manual:2027-03-31 the Rust harness in crates/synth-oracle runs a
        wasm export on kiln and the compiled function under unicorn, and
        judges the pair; its first oracle executes a probe set on cortex-m3
        and rv32imac with every case agreeing, and its potency legs (a
        planted wrong reference, a planted illegal instruction, a dropped
        i64 high word, a budget overrun offered as a trap) each red. The
        support-level lanes of #1741 then run their execution oracles on it,
        and every ported Python differential is gated by an equivalence test
        against the script it replaces.
      landed: "v0.91 ORACLEKILN - #1741 - DELIVERED, FOUNDATION ONLY: crates/synth-oracle (reference on kiln v0.7.3, emulate on unicorn 2.1.5, compare, synth/ELF driver) and the first oracle, crates/synth-oracle/tests/kiln_probe_oracle.rs, run by the new `oracle-kiln` CI job. No Python differential is ported yet."
      verified-by: >
        DELIVERED as the foundation, execution-verified. The probe oracle
        compiles 22 embedded probes (i32 arithmetic, compares, if/else,
        loop, br_table, i64 results, div/rem, unreachable) for cortex-m3
        and rv32imac --relocatable and runs 21 of them on 144 argument
        pairs on each leg: 6048 cases, all AGREE with kiln, 72 of them
        trap on both sides (IntegerDivideByZero and Unreachable). POTENCY,
        each a committed test: kiln running i32.sub for the compiled
        i32.add gives exactly 120 of 144 disagreements per leg (add equals
        sub only when the second operand is 0 or 0x80000000); a planted
        undefined encoding, BKPT, VFP-on-M3 (ARM) and a reserved encoding,
        ecall, F-on-E31 (RV32), and the trap forms synth never emits (udf.w;
        c.ebreak, unimp, c.unimp), are each ILLEGAL and Disagree, while the
        trap synth emits (udf; ebreak) planted at +0 and +4 is a trap at its
        own PC, and a zeroed div_u body never agrees with kiln's trap; dropping
        the high word of an i64 result reds 266 of 266 nonzero-high cases
        per leg; kiln out of fuel and unicorn out of instructions are each
        Budget, never Trap, and no Budget pairing agrees. The 22nd probe,
        `spin`, is that budget probe. GUARDS, each with a committed test
        that reds without it: callee-saved, gp/tp and SP (hand-built
        objects), the relocation read and refusal (a real call on both legs),
        the stop-path-and-bytes trap rule and the in-function PC (unit test
        on the pure rule), kiln message classification through
        `reference::classify`, the result-count check, the multi-value,
        float and linear-memory refusals, and fuel on the start function.
        STRESS: 32,000 concurrent runs of add(2,3) on 8 threads, 0 not
        Values(5) (the same stress gave 52 spurious Budget stops with the
        old wall-clock timeout). MUTATION SURVEY, REVIEW_11's 26 mutants
        re-anchored to the new code plus 7 for the fixes, run against the
        committed tests: 32 of 33 killed. The survivor is m21 (the readback
        comparison dropped), which the review classes as equivalent: the
        test asserts the readback itself and m17 (`Mode::MCLASS`) is
        killed. Of the review's 26: 25 killed (was 18). EQUIVALENCE (one-off, not a gate): the
        3024 kiln reference outcomes were re-run on wasmtime 48.0.0 (Python)
        and 0 diverged; the trap classes pair as IntegerDivideByZero /
        INTEGER_DIVISION_BY_ZERO (24) and Unreachable / UNREACHABLE (12).
        WHY outlives: #1741 is the push to raise every planned backend
        through the support levels, each lane with an execution oracle red
        on main and green on the fix. This lane builds the Rust harness
        those oracles run on, against kiln; it raises no backend's level and
        ports no existing oracle.
