      landed: "v0.91 X86ALU - #1741 - DELIVERED: rules.rs (52 rows), the selector's shape routines, eight instruction forms in inst.rs/encoder.rs, i64 signatures in backend.rs; the x86-64 runner in synth-oracle (emulate/x86_64.rs) and tests/x86_64_alu_kiln_oracle.rs; op surface 3 -> 59 of 198. #1741 stays open (outlives)."
      verified-by: >
        DELIVERED, execution-verified under emulation. RED/GREEN: with SYNTH
        naming a binary built from the stack base 4dd56c1d, all 9 tests of
        x86_64_alu_kiln_oracle.rs fail and 57 of 57 op groups are reported
        as not compiling (`unsupported wasm op`, or a refused i64 signature);
        on this branch all 9 pass. EXECUTION: 43,587 cases, all AGREE with
        kiln under unicorn QEMU64 and all return values on both sides: i32
        arithmetic 9944 over 11 ops, i32 compares 9040 over 10, i64
        arithmetic 9526 over 11, i64 compares 8660 over 10, and 6417 over
        15 groups of conversions, select, constants and drop. Each binary op
        runs in ten operand shapes (eleven for i32, the eleventh on wrapped
        i64 parameters): the both-parameters shape over every pair of 22 edge
        values plus 40 seeded random pairs, the others over 22 fixed edge
        pairs plus 16 seeded random ones. POTENCY, committed tests: kiln
        running lt_u for the compiled lt_s, and the image's `setl` rewritten
        to `setb`, each disagree on exactly the vectors whose sign bits
        differ; the rcx restore overwritten with a nop reds the
        four-parameter probe on exactly the vectors where the count differs
        from parameter 3; `i64.extend_i32_u` rebuilt as a 64-bit move reds
        every vector. MUTANTS, run once on this tree, not committed: 30
        source mutants of rules.rs, selector.rs and encoder.rs (a wrong
        condition, shift, extension or operand order; sub marked commutative;
        the rcx save dropped, narrowed or skipped; select's test widened or
        its cmov narrowed or inverted; a 64-bit move of an i32; a missing
        movzbl; wrong constant forms; a dropped REX) each rebuilt into synth
        and run against the execution oracle: 29 red. The thirtieth, a
        `setCC` on `sil`/`dil` without its REX prefix, cannot be reached from
        the selector (it only ever writes `setCC` to a temporary) and is red
        in E1 and E2 only. One of the 29 (a drop that does not free its
        temporary) survived the first run and is killed by a probe added for
        it. RUNNER: 13 mutants of emulate/x86_64.rs (stack, flags, scratch
        or unused arguments not poisoned; a zero upper half in an i32
        argument or in the callee-saved seeds; callee-saved, rsp, the
        caller's frame or the direction flag not checked; the result read
        at the wrong width; the CPU model not pinned): 13 red, each in a
        named committed test. ENCODER: E1 11,969 of 11,969 forms byte-equal to
        llvm-mc 22.1.8 (every form at both operand sizes over all 16 x 16
        register pairs, all ten conditions, eight boundary immediates per
        immediate form), and the REX.B-dropped control disagrees on exactly
        the 5,984 forms that set REX.B; E2/E3 decode the same 11,969 forms
        and the .text of every probe object, read back out of the emitted ELF
        with the object crate, to the requested text and length under
        iced-x86 1.22.0 inside x86-64-v1. One spelling difference is stated
        in the test rather than normalised: iced prints `setbb %al` where
        LLVM reads `setb %al`. DECLINES: 35 shapes through the API (the eight
        div/rem ops, three bit counts, unreachable, loop, if, local.tee, a
        value stack of four, f64 and v128 signatures among them) plus the
        CLI's, each naming its cause with no object written. OTHER BACKENDS:
        no Rust source outside the x86-64 crate, its CLI path
        (x86_64_cli.rs), the oracle crate and the op-parity test's x86 leg
        changed; the five ARM and AArch64 oracles of the lane gate report
        the same measured counts on main 6641efec and on this branch, and
        the spec compile census matches its pins for all five targets. NOT VERIFIED HERE: the x86_64-oracle
        workflow has not run, so E1 against ubuntu-24.04's older llvm-mc and
        the native leg (the object linked by GNU ld and run on an x86-64
        host, extended here from 105 to 504 cases) are unexecuted; the
        oracle-kiln job on the self-hosted pool has not run; no x86-64 code
        ran on real silicon; Bazel was not built; rivet is not installed on
        this host, so the artifact was not validated by rivet.
