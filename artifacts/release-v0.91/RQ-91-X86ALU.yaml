artifacts:
  - id: RQ-91-X86ALU
    type: system-req
    release: v0.91
    status: implemented
    title: "`-b x86_64` lowers straight-line i32/i64 integer code in leaf functions; locals, control flow, calls, division and memory are still refused by name"
    description: >
        Lane X2 of the x86-64 backend plan (VCR-X86-001), on top of the X1
        skeleton (RQ-91-X86SKEL). `synth compile m.wat -b x86_64
        [--relocatable]` now lowers LEAF functions of STRAIGHT-LINE integer
        code with at most six i32/i64 parameters and at most one i32/i64
        result: `local.get` of a parameter, `i32.const`/`i64.const`, and for
        both widths add, sub, mul, and, or, xor, shl, shr_s, shr_u, rotl,
        rotr, the ten compares and `eqz`; `i32.extend8_s/16_s`,
        `i64.extend8_s/16_s/32_s`, `i64.extend_i32_s/u`, `i32.wrap_i64`;
        `select`, `drop`, `nop`, `return`. The derived op surface
        (artifacts/x86_64-op-surface.json) goes from 3 to 59 of 198 probed
        op shapes.

        WHICH INSTRUCTION AN OP BECOMES IS A TABLE (crates/
        synth-backend-x86_64/src/rules.rs, 52 rows: the wasm op, its operand
        type, and one of eight lowering shapes). The selector holds one
        routine per shape and reads the table; it has no per-op arm for these
        ops. The plan asks for that form so a model can later be generated
        from the shipped table. NO PROOF IS CLAIMED: x86-64 has no Rocq model
        (VCR-X86-001 costs 2 and 3) and stays at support level L3.

        THE CONTRACT THE SELECTOR KEEPS. Parameters stay in `rdi, rsi, rdx,
        rcx, r8, r9` and are read-only; temporaries are `rax, r10, r11`; a
        value stack deeper than three temporaries is REFUSED, never spilled.
        Every i32 op uses the 32-bit operand size, and bits 63:32 of an i32
        value are unspecified wherever it lives: `i32.wrap_i64` therefore
        emits nothing, and `i64.extend_i32_u` re-zeroes with a 32-bit `mov`.
        A compare always materialises 0 or 1 (`cmp; setCC; movzbl`); no value
        is kept in EFLAGS across a wasm op. A variable shift needs its count
        in `cl`: with at most three parameters `rcx` is free and is written;
        with four or more it holds parameter 3, which is used in place when
        it is the count and otherwise saved to a temporary (all 64 bits) and
        restored after the shift. That save and restore is the only write to
        an argument register. Nothing writes `rbx, rbp, rsp, r12-r15`, and
        there is still no store at all.

        WHAT IS STILL REFUSED, BY NAME, WITH NO OBJECT WRITTEN: `local.set`,
        `local.tee` and non-parameter locals (frames are lane X3); `block`,
        `loop`, `if`, `br*`, `unreachable` (X5); `call` (X6); globals,
        memory, tables; every float op and float or reference signature; and
        DIVISION AND REMAINDER, deliberately: x86 `div`/`idiv` raise #DE on a
        zero divisor and on INT_MIN / -1, where wasm traps on the first and
        `rem_s` returns 0 on the second, so a bare `idiv` would be a wrong
        trap. They wait for explicit guards that stop on `ud2` (X4), as do
        `clz`/`ctz`/`popcnt`, whose one-instruction encodings are above the
        baseline ISA level.

        THIS IS LANE X2, NOT THE WIDER "i32 CORE". The lane brief offered an
        i32 core with locals, control flow and direct calls as the fallback
        when the plan names no next step. The plan (X86_PLAN.md section 1.3
        and lane X2) does name it: the i32 AND i64 straight-line ALU. Locals
        are X3, control flow X5 (after the shared control-frame extraction
        S1, which the plan says must not be written as a copy of AArch64's),
        calls X6. None of those is in this lane.

        THE EXECUTION ORACLE'S x86-64 RUNNER is now its own function
        (crates/synth-oracle/src/emulate/x86_64.rs), after the AArch64 runner
        of #1745, and is stricter than the X1 path it replaces: besides the
        poisoned upper halves, unused argument registers and `rax/r10/r11`,
        it poisons the whole stack mapping and the arithmetic flags (CF, PF,
        AF, ZF, SF, OF set at entry), and on return it checks, besides
        `rbx/rbp/r12-r15` in all 64 bits and `rsp`, that the direction flag
        is clear and that no byte of the caller's frame was written. The
        shared ARM/RV32 runner loses its x86 arms and is otherwise as on
        main.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact: with a
        synth built from this branch, `SYNTH=<that binary> cargo test -p
        synth-oracle --features exec --test x86_64_alu_kiln_oracle --
        --nocapture` must print the five `ORACLE x86_64-alu` lines (9944,
        9040, 9526, 8660 and 6379 cases) and pass 9 tests; with SYNTH naming
        a binary built from the stack base 4dd56c1d the same command must
        fail all 9, every op group reported as not compiling. `cargo test -p
        synth-backend-x86_64 -- --nocapture` must print `E1: 11969 forms
        byte-equal to` (when llvm-mc is present) and `E2: 11969 forms decode`.

        CITATION: #1741 is the architecture-support issue this lane is one
        step of. It stays open: x86-64 is at L3, and locals, division,
        control flow, calls, globals and memory remain.
