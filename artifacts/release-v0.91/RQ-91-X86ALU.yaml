    fields:
      req-type: functional
      priority: should
      issue: "#1741"
      verification-track: execution
      issue-scope: outlives
      done-when: >
        manual:2027-03-31 `synth compile -b x86_64 --relocatable` lowers
        leaf functions of straight-line i32/i64 integer code (const,
        local.get of a parameter, add, sub, mul, and, or, xor, shifts,
        rotates, compares, eqz, extensions, wrap, select, drop, return);
        every instruction form the encoder has is byte-equal to llvm-mc and
        decodes under iced-x86 inside the baseline ISA level; execution
        agrees with kiln under unicorn pinned to QEMU64 on every case of the
