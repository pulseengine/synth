artifacts:
  - id: RQ-91-WRONGCODECENSUS
    type: system-req
    release: v0.91
    status: implemented
    title: "A re-runnable census of the open wrong-code issues, each row with an executed or read-off status"
    description: >
        BET A, STEP 1 of the v0.92 plan ("wrong code, with a number"): the
        week-one census. Homed in v0.91 because the release that carries the
        local lane stack is undecided; it can be re-homed.

        WHAT WAS COUNTED. All 88 issues open at the population snapshot
        (2026-11-20T00:34:42Z, `gh issue list --repo pulseengine/synth
        --state open --limit 300`, highest #1755) were read in full, not by
        title, and each was put in exactly one class: wrong-code (exit 0 and
        the output is wrong: a value, a call binding, a spurious trap, an
        instruction the declared target cannot execute, or an export silently
        dropped from the object), loud decline or missing feature,
        machinery/docs/tooling, or unclear (no defined right answer: #1207 is
        an invalid module, #1450 a return convention no contract states). 35
        are wrong-code. The population is a typed list, because a test may
        not reach the network; a new issue needs a row, and the oracle-kiln
        workflow reds when an open issue titled as wrong code is not in the
        census.

        WHAT WAS MEASURED. Each wrong-code issue's own repro was run on main
        3dc31524 plus the unmerged oracle-kiln and x86objplan stack. The
        result is LIVE-WRONG, FIXED, NOW-DECLINES or CANNOT-REPRO. The census
        is the Rust test crates/synth-oracle/tests/wrong_code_census.rs.
        Twenty-nine rows are measured in the test: 21 run the issue's repro on
        kiln and on unicorn, with imports served to kiln and stubbed at the
        relocated call in the emulator; 2 (#1745, #1747) run on a unicorn
        arm64 runner against kiln; and 6 read the property the issue names
        (a binding, an ISA extension and e_flags, dropped export symbols, a
        refusal's named diagnostic, a library encoding). Every measured row
        asserts its status exactly, both ways, and a result it cannot decide
        reds as RE-MEASURE, never as FIXED. Six rows (#1568, #1604, #1661,
        #1672, #1676, #1684) need linear memory and a link step; they cite the
        CI-wired scripts/repro oracle, which the test does NOT re-run: it
        checks the oracle is wired and still pins the row's result (the exact
        --expect line, the named refusal, or the executed-comparison floor).
        The markdown table in docs/status/WRONG_CODE_CENSUS.md is generated
        from the rows and checked byte-for-byte without the engines, in the
        workspace Test job.

        HARNESS EXTENSION. crates/synth-oracle's emulator links calls on
        request: with EmuConfig::stubs set, an ARM function's R_ARM_THM_CALL
        relocations are resolved in the emulator's copy of .text, to a
        function in the same .text (transitively) or to a host stub for an
        undefined import. The stub clobbers r1-r3 and r12. Without stubs a
        relocation refuses the run as before. Guards, each with a test that
        reds without it: no stub gives NeedsLink; a stub for another symbol
        gives Unlinkable; a linked --relocatable call agrees with kiln and the
        stub sees the marshalled arguments (11, 22); a clobbering stub
        poisons a result read from r1; and the Thumb `bl` encoder has a unit
        test in both directions. Controls: the LIVE rows #1696, #1699, #1754
        and #1755 agree with kiln on the paths their issues name as correct,
        so each can print FIXED.

        RESULT: LIVE-WRONG 9 (#1696, #1699, #1744, #1745, #1746, #1747, #1752,
        #1754, #1755), FIXED 20, NOW-DECLINES 6, CANNOT-REPRO 0. LIVE-WRONG
        on cortex-m4 with default flags: 4. #1696: the optimized path keeps
        no value across an import call. #1699: the meld dispatch fallback
        passes no wasm arguments. #1754: select overwrites a parameter's home
        on the direct selector, which default flags reach whenever a function
        routes there (an i64 local is enough). #1755: optimized-path import
        calls never marshal their arguments. The plan's kill threshold (more
        than a quarter of the rows no-oracle or not-reproduced) is not
        reached: 0 of 35.

        CLOSURE CANDIDATES. The FIXED and NOW-DECLINES rows are fixed on main
        and still open, because closure is release-based. Nothing was closed
        and nothing was posted. #1691's reporter attachment must be re-run
        before it is closed on this row.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact:
        `SYNTH=./target/debug/synth cargo test -p synth-oracle --features exec
        --test wrong_code_census -- --nocapture`. A failing test, or a summary
        line other than `WRONG-CODE CENSUS: 29 rows measured: 9 LIVE-WRONG, 18
        FIXED, 2 NOW-DECLINES; 6 rows cited`, refutes it.
    tags:
      - oracle
      - verification
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1741"
      verification-track: execution
      issue-scope: outlives
      done-when: >
        manual:2027-03-31 every open wrong-code issue has a census row with an
        executed, read-off or cited-oracle status on a named commit, produced
        by one command and re-run at the tag; the markdown table is generated
        from the rows and checked.
      landed: "v0.91 WRONGCODECENSUS - #1741 - DELIVERED: crates/synth-oracle/tests/wrong_code_census.rs (35 rows: 29 measured in the test, 6 cited and checked wired), the emulator's opt-in call linking with import stubs, and the generated table docs/status/WRONG_CODE_CENSUS.md, run by the oracle-kiln job."
      verified-by: >
        DELIVERED, execution-verified on the census commit. Exec rows: every
        call agrees with kiln on the 17 FIXED exec rows (#1205 351 calls,
        #1711 117, #1712 117, #1716 234, #1721 234, #1691 98 over the issue's
        own fixture, and others), and the 4 LIVE exec rows disagree (#1696 13
        of 13 calls, #1755 118 of 118, #1754 4 of 6, #1699 1 of 118). arm64:
        #1747 leaves the poisoned s0/d0 unwritten on all 9 calls; #1745's
        compile_module panics on the block shape (debug) and returns the
        caller's x1 for a zero-initialised local. Structural: #1744 (remu and
        RVC e_flags on rv32i), #1746 (`a` missing on ARM, RV32 and AArch64)
        and #1752 read LIVE; #1191 and #1698 refuse naming their issue; #1677
        reads the CMSIS SIZE values. Cited oracles, all passing on the census
        commit: npa_const_addr_matrix_1568 (162 cells, 0 wrong),
        npa_model_differential (62 compared; #1604, #1661, #1672 and #1684
        refused by name), imported_global_slots_rq91 (40 checks, 0
        failures). PAIRED CONTROL (run on the first census commit 3783ed47,
        whose probes for these rows are unchanged): the test with SYNTH
        pointed at a v0.90.0 build reds on exactly 15 rows, each measured
        LIVE-WRONG where the census records FIXED or NOW-DECLINES: #1191,
        #1241, #1691, #1698, #1710 to #1717, #1720, #1721 and #1739. Not
        paired: #1205, #1210, #1214 and #1226 were fixed before v0.90.0;
        their scripts/repro pin oracles carry the historical red. The LIVE
        rows are paired the other way, on the paths their issues name as
        correct (the controls test). COLD REVIEW 16 (FIX FIRST) is addressed
        in the second commit: #1754 and #1755 added, #1746 reclassified, the
        cited rows checked, the structural rows executed or made unable to
        read FIXED on an unexplained change, #1698 checked by diagnostic, and
        the population snapshot recorded. WHY outlives: #1741 is the
        support-level push; the census is the population Bet A's count is
        measured against, and it raises no backend's level.
