      priority: should
      issue: "#1741"
      verification-track: execution
      issue-scope: outlives
      done-when: >
        manual:2027-03-31 `synth compile -b x86_64 --relocatable` emits a SysV
        ELF64 ET_REL with .note.GNU-stack for leaf i32 functions of local.get,
        i32.add and return, whose every instruction is byte-equal to llvm-mc
