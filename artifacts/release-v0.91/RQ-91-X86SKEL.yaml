      landed: "v0.91 X86SKEL - #1741 - DELIVERED: crates/synth-backend-x86_64 (inst, encoder, selector, backend) registered as `-b x86_64`; .note.GNU-stack in the shared ELF64 writer; synth-oracle x86-64 mode (QEMU64 pinned, SysV, ud2-at-RIP); E1 llvm-mc, E2/E3 iced-x86, decline and kiln execution oracles. #1741 stays open (outlives)."
      verified-by: >
        DELIVERED, execution-verified under emulation. RED/GREEN: on the
        stack base (f7a77f2e, control built from it) `-b x86_64` exits 1
        "Unknown backend 'x86_64'" and the four compiling tests of
        x86_64_kiln_oracle.rs fail on it; on this branch all 9 pass.
        EXECUTION: 8 probes (add, add3, ret_early, id, second, sum6, rsum,
        void) over 12 vectors, 877 cases, all AGREE with kiln under unicorn
        QEMU64 (model read back). POTENCY, each a committed test: kiln running
        i32.sub for the compiled add, and the emitted image mutated add -> sub
        (01 -> 29), each give exactly 120 of 144 disagreements; a planted ud2
        is a trap at its own RIP while 06, 0F 0F FF, ud0, ud1 and a #DE from
        div by zero are ILLEGAL; xor of each of rbx, rbp, r12-r15, an
        upper-half-only rotate of rbx, and an rsp left 8 low are each an ABI
        violation, while r10/r11 clobbers are not; a 64-bit move of a poisoned
        i32 argument into an i64 result is visible; `lzcnt` runs as bsr (1 ->
        0) and popcnt faults on the pinned model, while unicorn's default
        model runs lzcnt (1 -> 31). ENCODER: E1 513 of 513 forms byte-equal to
        llvm-mc 22.1.8, and the REX.B-dropped control disagrees on exactly the
        256 high-destination forms; E2/E3 decode every probe object's .text
        and every form to the requested text and length inside x86-64-v1,
        with lzcnt, popcnt, tzcnt, a dropped REX.B and a truncated instruction
        each refused. DECLINES: 20 shapes plus invalid wasm through the API and 10 through
        the CLI, each naming its cause, with no object written; `nop`
        compiles (the stated exception). PINS:
        x86_selector_lines_code (track, 250) and x86_ops_lowered (up, 3) each
        red claim_check when moved by one (+1 line; i32.add relabelled
        declined); x86_selector_wildcard_arms_code (down, 1) added after
        REVIEW_13. EMULATOR MUTANTS (REVIEW_13's 13, re-run on this tree with
        its script): 13 of 13 red. The three that survived the review — r10/r11
        not poisoned, callee-saved seeded with a zero upper half, unused
        argument registers not poisoned — are each killed by
        potency_scratch_unused_args_and_upper_seed_are_poisoned (`movl %r10d,
        %eax`, `movl %r11d, %eax`, `movl %esi, %eax` in a one-parameter
        function, and `movl %ebx, %ebx` which changes only rbx's upper half). BYTE IDENTITY: 590 inputs (scripts/repro, tests, examples)
        x 13 invocations (AArch64 ELF and Mach-O, ARM default, m3/m4/m0/r5
        relocatable, --cortex-m image, RV32 plain and relocatable) = 7670 of
        7670 identical in exit code, object bytes and stderr between the stack
        control and this branch; NEGATIVE CONTROL: the same run against a
        binary with the AArch64 note switched on reds 916 (229 in each of the
        four AArch64 ELF modes, Mach-O and every other backend unchanged).
        NOT VERIFIED HERE: the x86_64-oracle workflow (llvm-mc on
        ubuntu-24.04's older LLVM, the native GNU ld link and its GNU_STACK
        control) and the oracle-kiln job with arch_x86 on the self-hosted
        pool have not run; no x86-64 code ran on real silicon; Bazel was not
        built.
