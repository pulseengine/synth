artifacts:
  - id: RQ-91-MPUENFORCE
    type: system-req
    release: v0.91
    status: implemented
    title: "Per-memory MPU isolation is enforced by code synth emits, or the embedder obligation stays the only enforcement and says so"
    description: >
        gale's second-ranked ask: the MPU-enforcement half of #1145.
        v0.62 shipped the per-memory region table and v0.68 the
        `--safety-bounds mpu --embedder-mpu` acknowledgement, so the
        isolation gale demonstrated on Renode and on STM32WB55 silicon
        is embedder-programmed: synth emits no MPU programming on any
        path. The self-contained path, which owns startup, still
        declines a module with more than one memory. The ask is
        synth-emitted enforcement: an MPU region per memory programmed
        by code synth emits, on a path that compiles multi-memory.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact.
        A refutation is a legitimate outcome, reported with numbers:
        compile the #1145 two-memory module `(module (memory $a 1)
        (memory $b 1) (data $da (memory $a) (i32.const 0) "tenantA")
        (data $db (memory $b) (i32.const 0) "tenantB") (func (export
        "read_a") (param i32) (result i32) (i32.load8_u $a (local.get
        0))) (func (export "read_b") (param i32) (result i32)
        (i32.load8_u $b (local.get 0))) (func (export "write_a")
        (param i32 i32) (i32.store8 $a (local.get 0) (local.get 1))))`
        with `--target cortex-m3 --all-exports` four ways: `--cortex-m
        --safety-bounds mpu`; `--relocatable --embedder-data-init
        --safety-bounds mpu`; the same plus `--embedder-mpu`; and
        `--relocatable --embedder-data-init` alone. `cmp` the last two
        objects and `nm` the acknowledged one.

        MEASURED 2026-11-08 on main 2945628c (the v0.90.0 tag commit),
        synth 0.90.0 debug build from this tree: LIVE. Self-contained:
        rc 1 (`a module with 2 linear memories cannot be compiled into
        a self-contained image — there is only ONE runtime
        linear-memory base (R11)`). Relocatable without the
        acknowledgement: rc 1 (`requires --embedder-mpu. synth emits
        NO MPU programming`). Relocatable with it: rc 0, and the
        object is byte-identical to the one compiled with no
        --safety-bounds; it carries __synth_mem_base_1,
        __synth_mem_count (2) and __synth_mem_size_0/1, and nothing
        that programs the MPU.

        RE-MEASURED 2026-11-08 on main eab66646 by the lane, synth
        0.90.0 debug build: LIVE, the same four results. Self-contained
        rc 1, relocatable `mpu` rc 1, with `--embedder-mpu` rc 0, plain
        rc 0; the last two objects are byte-identical (sha256
        2924574f...cf4db) and carry no MPU-register literal. The `nm`
        listing also shows `__synth_mem_region_0` and
        `__synth_mem_region_1` (0x10000 each, from #1441), which the
        paragraph above does not list.

        DECISION, by the embedder: on 2026-11-08 gale chose the route
        "the embedder obligation stays the enforcement". gale's verified
        `switch_to_partition` and its `gust:mpu/regs` seam stay the ONLY
        MPU writer; synth emits no register writes and no routine,
        because synth is build-time and outside the flight TCB. The
        lane's design had already found that synth-owned enforcement
        means a synth-owned supervisor: per-context granting needs the
        tenant to run unprivileged and a privileged switch at every
        tenant boundary, and programming all N regions at boot is the
        failure gale's own first two-tenant attempt hit. synth instead
        delivers FACTS as data for gale's build-time gate, which proves
        each domain's grant SUFFICIENT and MINIMAL: per-function and
        per-export memory sets, per-memory bounds read back from the
        object, and an opt-in PMSAv7 placement.

        #1145 STAYS OPEN: this record is `issue-scope: outlives`.
        gale's closure criteria, verbatim as relayed on 2026-11-08:
        (a) the facts and the layout option are in a released synth that
        a pinned varve layer carries; (b) on that pin, gale's census and
        the 56/56 run are byte-identical on its real image, and the
        memfacts sidecar's sha256 matches the object; (c) gale's own
        acceptance pair passes on Renode and silicon: tenant
        unprivileged, CONTROL.nPRIV read back, a write into supervisor
        memory faults with the HM verdict, and the same write lands with
        protection off.

        SYNTH'S OWN RESIDUALS on #1145, not delivered here:
        `__synth_mem_used_N` (a used-extent high-water symbol); the #398
        per-memory data-base contract; the QEMU mps2 cross-region fault
        pair; and an imported memory 0 beside a defined memory 1, which
        does not compile today (the memory-1 access declines). That last
        one is not gale's shape: gale defines both memories and exports
        memory 1.

        CITATION: #1145 is where the matter was analysed. The number
        names where it was analysed, not an open scope.
    tags:
      - feature-loop
      - multi-memory
      - mpu
      - gale
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1145"
      verification-track: manual
      issue-scope: outlives
      landed: "PR #1681 - #1145 - DELIVERED on the route the embedder chose: the embedder obligation stays the enforcement, and synth delivers facts. The refuting command was RUN FIRST on main eab66646 and was LIVE (rc 1, rc 1, rc 0, rc 0; the acknowledged object byte-identical to the plain one, no MPU-register literal). New: `--emit-memory-facts` writes the synth-memfacts-v1 sidecar `<output>.memfacts.json` on ARM --relocatable --all-exports for a multi-memory module. Per function it gives direct_memories (the static memory indices of loads, stores, memory.fill and both sides of memory.copy), direct_calls, direct_call_indirect and sits_in_domains. It gives the DIRECT reading direct_multi_memory, direct_domains and direct_spans_domains, whose role is the key for gale's supervisor-only assertion: a body that itself touches two domains is an adapter and must be supervisor code. It gives the TRANSITIVE reading memories, multi_memory, domains and spans_domains, whose role is the key for the reachability / boundary census: tenant_call reaching both domains is a true finding (the closure over the direct call graph; call_indirect widens to every memory and sets via_call_indirect). It also gives imports_called. The report adds cross_domain_edges, one entry per call site whose callee's call tree reaches a domain the caller does not sit in. Each entry gives kind, caller, callee, the site (function_index, op_index, wasm_offset) and caller_domains / callee_domains. Every import call is listed, with empty callee domains; a call_indirect counts as reaching every domain, consistent with the sets. Cutting exactly those edges leaves every function's reach inside the domains it sits in, which is what gale's gate checks. A field_roles map carries each reading's role in every sidecar. Per memory it gives size_bytes, pmsav7_region_bytes, base (symbol and section, register r11, or native under --native-pointer-abi), section_align, section_bytes, pmsav7_subregions_enabled, pmsav8_granule_bytes and domain, each read back from the written object. `--memory-domain NAME=K[,K...]` supplies the domain map; nothing hard-codes meld's 1:1 mapping, and a partial or overlapping map refuses. Before writing, the emitter cross-checks the module against the object: the functions are exactly the func_N bodies, and every relocation in a body's own code against memory k's base or size symbol (k >= 1) must find k in its direct set. It is a sidecar and not a section because a section would change the object bytes and a linker merges same-named sections across inputs. Code: crates/synth-core/src/memory_facts.rs (pure derivation, plus the placement helper the follow-on --mpu-layout lane uses) and crates/synth-cli/src/memory_facts_emit.rs (read-back, cross-check, write); main.rs only gains the two flags and the post-compile call, so no image builder is touched. synth still emits no MPU programming on any path. PR #1683 - #1145 - DELIVERED: the opt-in --mpu-layout pmsav7|pmsav7-srd placement, gale's third item. It lays out every .synth.wasm_mem_k (k >= 1) as a legal PMSAv7 region. It keeps v0.68's base alignment (already the region size) and pads only the section SIZE: to the whole power-of-two region (pmsav7), or to the region's subregion granule, region / 8 for regions >= 256 B (pmsav7-srd; the sidecar's pmsav7_subregions_enabled says how many low subregions to keep). It refuses by name on a single-memory module, on a module importing a memory and on a memory no single region covers. __synth_mem_size_k, memory.size and the software guard still read the declared size. Memory 0 stays the embedder's to place. It threads one parameter through compile_command, compile_all_exports and build_relocatable_elf, and is a separate PR so it can rebase over the image-builder unification. The #1145 disposition comment is the maintainer's to post."
      verified-by: >
        DELIVERED, execution-verified. Wired oracle
        scripts/repro/memory_facts_1145_differential.py, `emulations >=
        2197`, imports its fixtures from the oracles that own them
        (multi_memory_bulk_1145, npa_multi_memory_1145,
        memk_bulk_oob_1619 and memk_i64_1622) plus the #1145 two-tenant
        and #406 modules. It makes 2197 wasmtime-non-trapping calls over
        26 fixture/mode legs (plain, --native-pointer-abi,
        --safety-bounds software and gale's own --safety-bounds mpu
        --embedder-mpu), with 2257 data accesses attributed by PC to
        their func_N body. Every access is in that body's
        direct_memories and in the export's memories. The sets equal the
        source oracles' hand-written tables (per function for bulk and
        #1622, per export for NPA). Each export's memories equal what its
        calls touched; this is gated, with only call_indirect excepted.
        On this run every executed body's observed set also equalled its
        direct_memories. The object is byte-identical with and without
        the flag, and object_sha256 is its sha256. The bounds equal the
        object's own symbols and section headers, read with pyelftools.
        Six named refusals are covered, including an imported memory 0
        beside a defined memory 1, which does not compile today, so no
        sidecar yet carries `imported: true`. The domain leg pins both
        readings: transitive spans_domains holds copy01, copy10,
        copy_static, func_2 and tenant_call; direct_spans_domains holds
        the same without tenant_call. It also pins the call edges
        tenant_call -> func_2 -> func_0, func_1. CROSS-DOMAIN EDGES, on the
        adapter fixture executed with --memory-domain tenant=0
        --memory-domain supervisor=1. cross_domain_edges is exactly the one
        known crossing, tenant_call (func 3) -> func_2, caller [tenant],
        callee [supervisor, tenant]. Its site (func 3, op 9, wasm offset
        0x113) is checked against the wasm bytes independently of synth's
        decoder: it is `call 2`. Every executed caller-to-callee transition
        (3 distinct, by a block hook on function entries) whose callee
        reaches beyond the caller's domains is a listed edge. Cutting the
        listed edges leaves every function's reach inside sits_in_domains.
        Dropping the edge reds that cut check. A planted code mutant that
        drops every non-import edge is caught three ways: the executed
        crossing is unlisted, the cut check fails, and the exact edge list
        differs. RED, measured: run with
        a binary built from eab66646 plus the unlinked #1678 mpu.rs
        change, every compile fails with `unexpected argument
        '--emit-memory-facts'` and the oracle exits 1. Floor control: the
        2183 floor the oracle carried with the layout legs reds this
        facts-only oracle (`VACUOUS: 2179 calls`); with the edge legs the
        oracle measures and declares 2197. Potency: the in-script
        mutated sidecar (one observed memory removed) reds on all five
        fixtures it runs on. A planted mutant attributing memory-k loads
        and stores to memory 0 is refused at compile time by the
        relocation cross-check on 25 compiles. A planted mutant dropping
        memory 0 from bare loads and stores, which no relocation can show,
        is caught by execution alone with 130 ISOLATION lines. Unit
        tests: seven in synth-core memory_facts and two CLI integration
        tests in crates/synth-cli/tests/memory_facts_1145.rs. This is
        unicorn emulation of the SUFFICIENCY of the sets, and unicorn
        models no MPU. It is not containment evidence; containment stays
        gale's Renode and STM32WB55 matched pair. The QEMU mps2 fault pair
        is not built in v0.91.
        --mpu-layout (PR #1683): the same oracle's two layout legs use
        the #406 module, whose memory 1 is 3 pages. With pmsav7 its section
        is align 0x40000 and size 0x40000; with pmsav7-srd it is align
        0x40000 and size 0x30000, and the sidecar says 6 subregions.
        Execution still equals wasmtime, and without the flag the v0.68
        shape (align 0x40000, size 0x30000) is unchanged. Three more named
        refusals: one memory, an imported memory and an unknown layout. A
        third integration test, mpu_layout_pads_only_the_memory_section_1145,
        also checks that .text does not move. The oracle declares
        `emulations >= 2201`. RED, measured: against the facts-only binary
        every --mpu-layout compile fails with `unexpected argument
        '--mpu-layout'`.
      done-when: >
        manual:2027-03-31 either a multi-memory module compiles on a
        path where synth emits the MPU programming (one region per
        memory, granted per execution context), gated by a
        cross-region fault criterion executed on an emulator and
        reported against gale's silicon criterion, or the maintainer
        records why the embedder obligation stays the enforcement, and
        #1145's disposition is updated to match — delivered with an
        execution-verified result where the lane is a wrong-code fix,
        or REFUTED with the measurement that refutes it; and the
        refuting command above is RUN FIRST and its result reported
        either way
