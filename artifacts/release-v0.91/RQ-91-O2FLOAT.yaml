artifacts:
  - id: RQ-91-O2FLOAT
    type: system-req
    release: v0.91
    status: implemented
    title: "An if arm that ends in a br, br_table, return or unreachable no longer leaves its dead values for the code after the if on ARM"
    description: >
        SILENT MISCOMPILE, reported by cpetig as #1691. `synth compile
        pruned-O2.wasm --target cortex-m7 --relocatable --all-exports
        --embedder-data-init --embedder-global-init` exits 0 with no warning,
        and the 4th `step` call returns four f32 values about 1e-3 off
        wasmtime 50.0.1 (`3f1649f3 3f175bbd 3f16c13d 3f17c5b2` against
        `3f162d43 3f177b90 3f16ded6 3f17a4f7`). The unoptimized module and
        `wasm-opt -O3` are correct.

        THE DEFECT. The direct selector (`select_with_stack`, the only ARM
        selector) keeps a simulated operand stack. A value-carrying `br`
        lands its value in the target join but leaves it ON that stack (it is
        peeked, not popped, `instruction_selector.rs` `edge_value_move`).
        Wasm's stack is polymorphic after the transfer; the simulated one is
        not, so the dead tail of an arm leaves values above the arm's entry
        height. #1215 discarded them at a plain block's `end`, but the `if`
        arms never consulted its `dead_prefix`: the `End` of an else-less if
        dropped nothing, `Else` forgot that the then arm was dead, and the
        `End` of an if/else whose arms left different counts published the
        dead arm's values beside the live arm's results. The code after the if
        then read a dead arm's register instead of the value beneath the if.
        In cpetig's module that is `func_2`, a biquad coefficient builder:
        `f32.const 1; block (result f32) ... if ... f32.const 0; br 1 end ...
        end; f32.sub` subtracted from the dead `0.0`, not from `1.0`. The
        class is not float-specific (the i32 twin returns 0 where wasmtime
        returns 99) and covers every ARM profile and rung (cortex-m3/m4/m4f/
        m7/m7dp relocatable and self-contained, cortex-r5 A32); RV32 and
        AArch64 have their own selectors and are not affected. When a dead
        arm happened to leave exactly the if's arity, the junk acted as a
        placeholder and the output was already correct, which is why the
        spec suite (#1636) never saw it: no spec function consumes a value
        from beneath a dead arm's leftover.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact. A
        refutation is a legitimate outcome, reported with numbers: compile
        `(module (func (export "f") (param i32) (result i32) i32.const 100
        block (result i32) local.get 0 i32.eqz if i32.const 1 br 1 end
        i32.const 7 end i32.sub))` with `synth compile x.wat --target
        cortex-m4 --relocatable --all-exports -o x.o` and with `--target
        cortex-r5`, and call `f` under unicorn with R0 = 0 and R0 = 5. Both
        equal to wasmtime (99 and 93) refutes it.

        MEASURED 2026-11-10 on main 0d22bafe, synth 0.90.0 debug build: LIVE.
        rc 0, no warning; f(0) = 0 and f(5) = -7 on cortex-m4 (Thumb-2) and on
        cortex-r5 (A32), against wasmtime's 99 and 93. The emitted `subs r6,
        r3, r4` reads r3, the dead arm's `i32.const 1`, instead of r1 (100).

        CITATION: #1691 is where the matter was filed; the analysis is in
        this record and its PR. #1215 is where the block-level rule this
        applies to the if arms was analysed; it is closed. #1426 and #1102
        are the loud declines the leaked VFP values also caused (below); they
        name where those declines were analysed, not open scopes.
    tags:
      - feature-loop
      - bug
      - wrong-code
      - selector
      - external-reporter
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1691"
      verification-track: execution
      issue-scope: closes
      done-when: >
        manual:2027-03-31 every if arm that ends in a br, br_table, return or
        unreachable leaves nothing the code after the if reads, on every ARM
        profile and rung, executed against wasmtime at i32, i64, f32 and f64;
        a dead arm that reaches below the if's entry height is refused
        loudly; red before and green after, with each of the three join sites
        and the refusal mutated alone; the reporter's module replays equal to
        wasmtime; and what changes bytes or newly refuses is counted over the
        spec suite and the tracked .wat/.wasm files
      landed: "PR #1694 - #1691 - DELIVERED: a wrong-code fix, not a refusal. The refuting command was RUN FIRST on main 0d22bafe and the defect was LIVE (values above). Fix, in select_with_stack: #1215's dead-code rule is applied to the if arms at their three join sites. `Else` records whether the then arm ended unreachable before resetting `dead_prefix`; the `End` of an else-less parameter-free if drops what a dead then arm left above the checkpoint; the `End` of an if/else publishes only the LIVE arm's results when a dead arm left a count other than the if's arity (both dead: nothing for a void if, the arm that left the arity for a result-typed one, else a loud refusal; and an unbranched both-dead if hands its parent the live prefix, as #1215 does for a block). Every case the old code already got right (a dead arm that left exactly the arity, the parameter-taking else-less if, no dead arm) is byte-identical. Dead code that consumed or rewrote a value below the if's entry height is refused with `#1691: unreachable code after a br/br_table/return/unreachable in an if arm consumed or rewrote an operand-stack value BELOW the if's entry height`."
      verified-by: >
