artifacts:
  - id: RQ-91-X86OBJPLAN
    type: system-req
    release: v0.91
    status: implemented
    title: "The relocatable object plan and ELF64 RELA writer are shared, with the addend taken from each instruction site"
    description: >
        Lane X1a of the x86-64 backend plan (R1 in its reuse table). The
        container-independent object plan (ObjectPlan, PlannedSymbol,
        PlannedReloc, plan_object, defined_symbol_names) and the ELF64 ET_REL
        writer lived in crates/synth-backend-aarch64/src/elf.rs. A second 64-bit
        backend would have had to copy them. They now live in
        crates/synth-core/src/object_plan.rs, and the AArch64 elf.rs is a wrapper
        that supplies what is A64: e_machine 183, the 4-byte .text alignment and
        the relocation-type map. The Mach-O writer still consumes the same plan.

        THE ADDEND IS PER INSTRUCTION, NOT PER KIND. The plan proposed a machine
        descriptor carrying "relocation type and addend per RelocKind". The cold
        review measured that this is wrong on x86-64: R_X86_64_PC32 needs -4
        under `movq cell(%rip), %rax`, -5 under `cmpl $7, glob(%rip)` and -8
        under `movl $7, glob(%rip)`. So CodeRelocation carries an `addend`,
        stated where the instruction is encoded (CodeRelocation::site), the plan
        copies it into PlannedReloc::addend, and the ELF writer writes that
        value to r_addend. The machine descriptor (ElfMachine) has no addend
        field. Every AArch64 site states 0. The REL-container writers (ARM ELF32)
        and the RV32 builder do not read the field and their sites set 0. The
        Mach-O writer cannot express an addend (no ARM64_RELOC_ADDEND pair), so
        it now asserts the addend is 0 instead of dropping it.

        No x86 code is in this lane.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact: build
        synth (--features riscv) at main 265235dc and at this branch in separate
        target directories, then compile every .wat/.wasm/.wast under
        scripts/repro and tests with both, in four AArch64 invocations (-b
        aarch64; -b aarch64 --all-exports; --target cortex-a53 --relocatable
        --all-exports as ELF and as --object-format macho), and compare exit
        code, object bytes, sidecar bytes and stderr. Any difference refutes it.
        Also `cargo test -p synth-core --lib object_plan`.

        CITATION: #1741 is the architecture-support issue this lane is one step
        of. It stays open: the x86-64 backend itself is later lanes.
    tags:
      - feature-loop
      - refactor
      - backend
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: should
      issue: "#1741"
      verification-track: execution
      issue-scope: outlives
      done-when: >
        manual:2027-03-31 the object plan and the ELF64 RELA writer exist once,
        in synth-core, and every AArch64 object (ELF and Mach-O, relocatable and
        self-contained invocations) is byte-identical to main's; a relocation's
        addend is the one its instruction site states, and no per-kind addend
        exists anywhere in the shared API.
      landed: "v0.91 X86OBJPLAN - #1741 - DELIVERED: ObjectPlan/plan_object/defined_symbol_names and the ELF64 ET_REL writer moved to synth_core::object_plan; aarch64 elf.rs keeps only e_machine, .text alignment and the R_AARCH64 type map; CodeRelocation::addend carries the site's addend into PlannedReloc and r_addend. #1741 stays open (outlives)."
      verified-by: >
        DELIVERED, byte-identity verified. Two binaries, main 265235dc and the
        branch, built in separate target directories (md5 differ). Over 295
        inputs (every .wat/.wasm/.wast under scripts/repro and tests) and four
        AArch64 invocations each: 1180 of 1180 invocations identical in exit
        code and object bytes, 0 stderr differences after normalising the OS
        thread id of one caught panic that also differs between two runs of
        main itself; 808 objects and 808 safety-manifest sidecars, all
        byte-identical. 202 objects per invocation, 66 of them with a
        .rela.text. NEGATIVE CONTROL: r_addend written as addend+1 in the shared
        writer turned 198 of 1180 red (the 66 relocation-carrying objects in
        the three ELF invocations; Mach-O does not use that path), then
        reverted. Unit tests: four in object_plan.rs, including three sites of
        ONE kind with addends -4, -5 and -8 that must reach the plan and
        r_addend unchanged; forcing the plan's addend to 0 turns two of them
        red. The ARM determinism gate run across the two binaries: 312 of 312
        compared outputs identical. The aarch64-oracle job's run blocks pass on
        the branch except the qemu-user leg, which needs qemu-aarch64 (not on
        this host) and fails the same way on main.
