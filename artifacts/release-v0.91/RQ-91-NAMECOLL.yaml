artifacts:
  - id: RQ-91-NAMECOLL
    type: system-req
    release: v0.91
    status: implemented
    title: "A called import whose symbol collides with anything the object defines or references now refuses, on every backend"
    description: >
        SILENT MISCOMPILE, found by the #1696 lane in spec imports.wast module 7
        and linking.wast module 1, and filed as #1698. Every object builder
        rewrites an import call's `func_N` label to the import's wasm FIELD
        name (the #173/#197 contract, ported to RV32 by #871 and AArch64 by
        #1017) and emits it `SHN_UNDEF` for the embedder. All of them then
        resolved that name among the object's OWN definitions, and the
        definition won: ARM Thumb-2 and A32 in `build_relocatable_elf`
        (`sym_indices.get(&effective)`), RV32 by name in
        `RiscVElfBuilder::build_object_with_globals`, and AArch64 in
        `plan_object`, whose comment called the skip "ARM parity". So
        `(import "env" "get")` beside `(export "get")` bound the import call
        to the module's own export, rc 0, with no undefined symbol. The same
        held for an import named after a `func_N` label, after
        `__synth_globals` (a call into DATA), after the AArch64 funcref table
        (also through a table-slot trampoline), and after an `__aeabi_*`
        helper synth itself calls. Two imports of one field from different
        modules collapsed onto one undefined symbol. On ARM, an export named
        `func_0` captured import 0's label, and an import field equal to
        another import's `func_M` label captured that import's calls. A real
        linker given the host function fails with `multiple definition`.
        Given nothing, it links and runs the wrong function. No embedder
        could use such an object.

        THE DECISION (option (c), approved by the coordinator): REFUSE,
        never rename. The plain field name IS the embedder ABI (Zephyr's
        `k_spin_lock`; gale, kiln and falcon link field names), so mangling
        every import (option (a)) or renaming the colliding export (option
        (b)) changes what embedders link against. A refusal changes nothing
        for a non-colliding module. FOLLOW-UP, not built: an opt-in
        `--import-symbol-prefix` for anyone who needs such a module to link.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact. A
        refutation is a legitimate outcome, reported with numbers: compile
        `(module (import "env" "get" (func $imp (result i32))) (func (export
        "get") (result i32) i32.const 7) (func (export "use_import") (result
        i32) call $imp))` with `synth compile nc.wat --all-exports -o nc.o`
        and each of `--target cortex-m4 --relocatable`, `--target cortex-m4
        --cortex-m`, `--target cortex-r5 --relocatable`, `-b riscv
        --relocatable` and `-b aarch64 --relocatable`. Host-link it with a
        stub for every `SHN_UNDEF` symbol (`env.get` returns 42), resolve
        every relocation through the object's own symtab, and run
        `use_import` under unicorn against wasmtime. A result of 42, or a
        refusal, on every config refutes it.

        MEASURED 2026-11-11 on main 52add192, synth 0.90.0 debug build: LIVE
        on all five. rc 0 and no warning on each; `use_import()` = 7
        (wasmtime 42), and the `get` relocation (R_ARM_THM_CALL, R_ARM_CALL,
        R_RISCV_CALL_PLT, R_AARCH64_CALL26) bound the DEFINED `get`, with 0
        undefined symbols. The paired control with the export renamed `get7`
        returned 42 on all five, with `get` `SHN_UNDEF`. `arm-none-eabi-ld`
        with a stub defining `get` failed `multiple definition of 'get'`, and
        without one it linked rc 0. The `--cortex-m` request produces the same
        ET_REL for an import-carrying module. The single-function
        `--func-name get --relocatable` path bound a self-named shim to
        itself.

        CITATION: #1698 is where the matter was filed; the analysis is in
        this record and its PR.
    tags:
      - feature-loop
      - bug
      - wrong-code
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1698"
      verification-track: execution
      issue-scope: closes
      done-when: >
        manual:2027-03-31 on ARM Thumb-2 and A32, RV32 and AArch64 (direct
        calls and funcref-table trampolines), a CALLED import whose field
        name equals a symbol the object defines, equals an external it
        references for another purpose, or is shared by imports from two
        different modules is refused, naming the import and the symbol. The
        defined set comes from each builder's own symbol table. An uncalled
        import and a same-(module, field) pair refuse nothing. The paired
        control executes equal to wasmtime before and after, red before and
        green after, with a planted mutant per leg. What newly refuses and
        what changes bytes is counted over the repo, gale, kiln and the
        spec suite.
      landed: "PR #1700 (branch v091-namecoll) - #1698 - DELIVERED: a wrong-code fix by refusal. The refuting command was RUN FIRST on main 52add192 and the defect was LIVE (values above). Fix: synth_core::import_symbols::check_called_import_symbols holds the rule. Each builder supplies its own defined set: ARM sym_indices before any external is added, RV32 RiscVElfBuilder::defined_symbol_names (which its own relocation resolution now uses), AArch64 elf::defined_symbol_names (which plan_object now uses). On ARM an import label is also resolved by wasm index before any name lookup, and kept out of the defined map, which fixes the func_0-export and func_M-field captures without a refusal. The plain-field ABI is unchanged; --import-symbol-prefix is a recorded follow-up, not built."
      verified-by: >
        DELIVERED, execution-verified. New wired oracle
        scripts/repro/import_name_collision_1698_differential.py (ci.yml,
        through oracle_run.py, `emulations >= 39`, 39 measured). The harness
        host-links each object through its own symtab and runs it under
        unicorn against wasmtime. MATCH legs: the paired control (export
        renamed) on cortex-m4 relocatable and --cortex-m, cortex-r5, RV32
        and AArch64; an import field equal to another import's `func_M`
        label; an export named `func_0`; an uncalled import beside a
        same-named export; and one (module, field) imported twice. Each
        MATCH object is symbol-pinned with pyelftools: every called import is
        STB_GLOBAL SHN_UNDEF, and its call relocations carry the ISA's call
        type and name it. REFUSE legs (20): the #1698 module on all five
        configs, the single-function shim, an import named `func_1`, the same
        field from two modules, `__synth_globals` (native-pointer ARM, RV32,
        AArch64), `__aeabi_l2f` on cortex-m4f, and two AArch64 table-slot
        imports. Each must exit non-zero, name the import and the symbol, and
        write no object. RED on main 52add192: 24 failures, among them
        `use_import() = 7, wasmtime 42` on all five configs, `use_b() = 42,
        wasmtime 99` (func_M capture) and `use_import() = 7, wasmtime 42`
        (func_0 capture) on cortex-m4 and cortex-r5, and every refusal leg
        compiled rc 0. GREEN on the branch: 59 checks, 0 failures. Potency,
        six planted source mutants, each rebuilt, run and restored: deleting
        the ARM check reds 10 checks; checking export names only reds 2 (the
        func_N leg); dropping the cross-module check reds 4; keying on
        DECLARED instead of called imports reds 2 (the uncalled-import
        control); dropping the AArch64 table leg reds 2; deleting the RV32
        check reds 4. Unit tests: 6 for the rule
        (synth-core import_symbols), defined_symbol_names_are_the_placed_symbols_1698
        (RV32), defined_symbol_names_are_what_the_plan_places_1698
        (AArch64), and the synth-cli integration test
        import_name_collision_1698 (refusal on four backends, the control's
        undefined GLOBAL `get` with one relocation targeting it). REACH, per
        invocation, base 52add192 against the branch with --all-exports
        --allow-skipped-exports on {cortex-m4 relocatable, --cortex-m,
        cortex-r5, RV32, AArch64}: 12,620 invocations over the repo's 297
        tracked modules, gale's 13 (9 on gale main 1866eff9 and 4 fused
        modules from the #1682 hand-off), kiln main 78457622's 6 and the 2,208
        spec modules. 0 changed bytes. 13 newly refused, all spec and all
        with the #1698 diagnostic: imports.7 x 5 configs, linking.1 x 5,
        linking.43 x 3 (RV32 declines that export earlier). They are exactly
        the modules that bound wrongly before; 2,960 are byte-identical and
        9,647 emit no object on either binary. gale under its own flags
        (--native-pointer-abi --relocatable on cortex-m3 and cortex-m7dp, 26
        invocations) is byte-identical; a name census found 0 collisions in
        gale's 13 modules, kiln's 5 or the repo's 295. falcon was NOT
        measured: its repo returns 404 to GET and the #1318 modules need
        approval to fetch again. The spec compile census (all 257 files, every
        leg) holds its pins: imports.wast, linking.wast and linking1.wast
        already refuse as whole modules before reaching a builder.
