        target: BR-001
    fields:
      req-type: functional
      priority: should
      issue: "#1741"
      verification-track: execution
      issue-scope: outlives
      done-when: >
        manual:2027-03-31 one command writes a north-star-input.O1.json that
        validates against pulseengine.eu's schema and is complete, with
        reach, execution_match, wcet and hardware_run facts for cortex-m4 and
        cortex-m7dp, each number executed in the run, each executed fact
        guarded by an in-run negative control, and each `pass` stating what
        it means; zero executed vectors reads ran=false; the file is
        generated in CI and uploaded as an artifact, and release.yml
        attaching it to the signed SHA256SUMS is an owner decision recorded
        here.
      landed: "v0.91 TARGETRECORD - #1741 - DELIVERED: crates/synth-oracle target-record binary, synth_oracle::{image, record, probes, cycles}, the vendored consumer schema, tests/target_record.rs, .github/workflows/target-record.yml; REVIEW_17 findings 1-9 addressed. release.yml NOT edited (owner-gated). #1741 stays open (outlives)."
      verified-by: >
        DELIVERED, execution-verified locally on the v092-stack2 lane stack,
        synth 0.90.0, M-series Mac, one command. cortex-m4: reach 16 of 257
        (fraction 0.0623; regression gate at floor 16 holds), execution_match
        3024 executed, 3024 matched, 0 wrong, 0 inconclusive, 36 trap/trap
        all `udf`, model id 9, boot contract asserted (R11 0x20000100, R10
        0x10000, entry `add`), controls red (120 of 120 planted-reference
        disagreements, an ILLEGAL planted encoding); wcet 20 of 22 bounded
        (floor 20), 2 `loop` declines, max bound 353 cycles, no bound below
        its priced cost, control red (a bound of 10 against `add`'s priced 11
        rejected). cortex-m7dp: reach 26 of 257 (fraction 0.1012; floor 26
        holds), execution_match 3024 / 3024 / 0 on model id 10 (controls
        red), wcet ran=true pass=false, 22 of 22 `unsupported-core`, value
        null. Both hardware_run ran=false.
        CYCLE PRICING CROSS-CHECKED: the Rust pricing's worst case per bounded
        cortex-m4 function equals REVIEW_17's independent Python script
        (cyc.py, capstone-decoded, same TRM table) on all 20 functions, 0
        differences (add 11, select_max 22, div_u 27, i64_lt_s 49, ...).
        RED ON THE BASE, GREEN HERE: the three broken startups REVIEW_17 found
        passing (R10/R11 initialisation NOPed, R11's movt corrupted, the
        entry literal 0xDEADBEEF; 3024 agree each at 77d1b0a7) now fail to
        boot with "boot contract broken", and tests/target_record.rs pins
        all three. A 4-cycle bound for `add`, which the instruction-count
        check passed at 77d1b0a7, fails (unit test). 1 bounded of 22 against
        the floor fails, a corpus with no git commit fails, and
        `2026-13-45T99:99:99Z` is rejected (unit tests).
        Tests: 20 lib unit tests (record: schema-valid and complete record;
        completeness refusals; zero vectors never a pass and never omitted;
        each fail rule; "no control" stated, never "planted"; the validator's
        schema and range rejections; the vendored sha256; the output name;
        RFC 3339; cycles: classification, an 11-cycle call against a
        4-instruction count, skipped IT instructions counted, an unmodelled
        transfer refused), the binary's version-derivation test, and three
        end-to-end tests (the binary on cortex-m4 with an empty corpus as an
        explicit partial record; a subset without --partial and a misnamed
        output refused before anything is written; the broken startups).
        NOT YET SHOWN: a run of target-record.yml on the pool, and the record
        regenerated at a tag.
        WHY outlives: #1741 raises every planned backend through the support
        levels; this lane makes the O1 reading of two targets derivable and
        raises no level.
