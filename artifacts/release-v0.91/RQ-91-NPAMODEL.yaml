artifacts:
  - id: RQ-91-NPAMODEL
    type: system-req
    release: v0.91
    status: implemented
    title: "Native-pointer address provenance is decided once and checked by one emitted-stream validator, and the per-shape checks are deleted"
    description: >
        THEME: the native-pointer address-model refactor. Every
        native-pointer release since the shadow-stack rebasing (#739)
        has added one more per-shape check: the constant-address guard
        and matrix (#1568), the cross-segment offset fold (#1580), the
        straddle guard (#1604), the shape-2 dynamic-offset refusal
        (#1568). Each was locally correct and each left residuals that
        the next release found (RQ-91-NPARESID1568,
        RQ-91-NPARESID1604, RQ-91-NPADATAPTR, RQ-91-NPASWBOUNDS),
        because the selector judges shapes, not where an address came
        from. The refactor decides each memory-0 value's provenance
        (wasm offset, relocated static, native pointer) once, adds one
        validator over the emitted stream that refuses any access
        whose provenance is not native, and DELETES the per-shape
        npa_* checks it subsumes. Success is measured by checks
        deleted, not added. MUST because it is the vehicle for gale's
        first-ranked silent classes.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact.
        A refutation is a legitimate outcome, reported with numbers:
        count the shipped per-shape checks and their helpers. `git
        grep -n -E '^[[:space:]]*(pub(\(crate\))? )?fn npa_' --
        crates/synth-synthesis/src crates/synth-core/src
        crates/synth-cli/src` (POSIX classes: git grep -E has no `\s`,
        and with it this command prints a false 2), keeping only hits
        above each file's `#[cfg(test)] mod tests` line
        (instruction_selector.rs 10444, backend.rs 1079, main.rs
        11202); then `git grep -n -E
        'npa_(const_addr_guard|region_straddle_guard|dynamic_static_offset_accesses)\('
        -- crates` for the refusal checks, whose output holds their
        definitions and their call sites. Then run the five wired
        native-pointer oracles through scripts/oracle_run.py:
        npa_const_addr_differential.py, npa_const_addr_matrix_1568.py
        --expect ok=99,refused=63,guard=59,wrong=0,
        npa_offset_cross_segment_1580_differential.py,
        npa_straddle_1604_differential.py and
        npa_multi_memory_1145_differential.py.

        MEASURED 2026-11-08 on main 2945628c (the v0.90.0 tag commit),
        synth 0.90.0 debug build from this tree: LIVE, the state the
        refactor starts from. The first command prints 16 lines; 1 is
        a test (backend.rs:1142, inside its test module), leaving 15
        shipped `fn npa_*` definitions: 13 in
        crates/synth-synthesis/src/instruction_selector.rs
        (npa_region_of, npa_baked_const_addr, npa_operand_producer,
        npa_memarg_offset_mut, npa_effective_addr_rewrite,
        npa_address_operands, npa_simple_push, npa_address_consumer,
        npa_local_const_plan, npa_const_addr_guard, npa_region_name,
        npa_region_straddle_guard,
        npa_dynamic_static_offset_accesses), 1 in synth-core
        backend.rs (npa_static_region) and 1 in synth-cli main.rs
        (npa_multi_memory_plan); the test module and the mcdc
        harness's npa_plan_gate is outside the searched paths. The
        second command prints 6 lines: the 3 refusal-check definitions
        (instruction_selector.rs 8930, 9126, 9259) and their 3 call
        sites, npa_const_addr_guard and npa_region_straddle_guard from
        select_with_stack.rs 65 and 68,
        npa_dynamic_static_offset_accesses from main.rs 5521. The five
        oracles each exit 0 on this tree: that is the byte-identity
        and execution baseline the refactor must keep.

        CITATION: #739, #1568, #1604, #1672 and #1661 are where the
        matter was analysed. The numbers name where it was analysed,
        not an open scope. #1684 is the i64-constant finding this lane
        made and filed; it is OPEN, and this record's refusal addresses it
        for v0.91, hence `issue-scope: closes`.
    tags:
      - feature-loop
      - refactor
      - wrong-code
      - gale
      - subtraction
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#739, #1684"
      verification-track: execution
      issue-scope: closes
      landed: "PR #1682 - #739 - DELIVERED. Memory-0 address provenance under --relocatable --native-pointer-abi is decided ONCE per module by Provenance::memory0_plan, which extends the #1145 pass in crates/synth-core/src/npa_multi_memory.rs (one graph walk, read by both). It names the constants to relocate or refuses the module with a named diagnostic: npa-data-pointer, npa-dynamic-static-offset, npa-static-observed, npa-static-unrelocatable, npa-region-straddle, npa-double-relocation, npa-end-pointer-compare, npa-i64-static-const, npa-software-bounds. The emitted ARM stream is checked by arm_backend::npa_stream_validate (npa-addr-validate, fatal). Deleted: 12 of the 13 selector fn npa_* and synth-core npa_static_region, the three refusal call sites, the CLI shape-2 loop and the #1619 memory-0-side refusal."
      verified-by: >
        DELIVERED, execution-verified. The refuting command, re-run on the
        branch: `fn npa_*` above each test module drops from 15 to 5
        (npa_baked_const_addr in the selector; npa_offset_folds and
        npa_split_layout in synth-core; npa_multi_memory_plan and the new
        npa_provenance in main.rs); the refusal grep prints 0 lines (0 of the
        3 checks, 0 call sites). HONEST SIZE: the grep falls partly by MOVING
        logic. Over crates/ the diff is about +1930 / -1020 lines: the
        selector (instruction_selector.rs + select_with_stack.rs) -677 net
        (claims.yaml selector_lines_code 21715 -> 21038, a FALL, waiver bound;
        wildcard arms 53 -> 52), the CLI shape-2 loop and synth-core
        npa_static_region deleted, while synth-core npa_multi_memory.rs grows
        by +1369 (the decision, its docs and the moved #1580 fold) and
        arm_backend.rs by +216 (the validator and a grow-fold re-key). It is a
        net addition of lines and a net DELETION of decision sites: the three
        selector guards, the local plan, the shape-2 matcher and the #1619
        memory-0-side refusal become one decision plus one validator. The five native-pointer
        oracles plus memk_bulk_oob_1619 exit 0 on the branch; three had refusal
        rows that now compile and are EXECUTED instead (pins moved with paired
        controls: npa_const_addr_differential 47 -> 65 emulations,
        npa_multi_memory_1145 51 -> 62, the matrix 99/63/59 -> 158 ok / 4
        refused / 0 npa-guard / 0 wrong, eab66646 measuring the old pin and
        failing the new one; under RQ-91-EMUFLOOR's per-oracle protocol
        each oracle's own `ci-checks: emulations` header carries its floor
        and `oracle_wiring_check.py --floor-base` sees these three as raised
        or new, never shrunk). Byte identity: the census of every tracked .wat/.wasm (268 files x cortex-m3 and cortex-m7dp, --relocatable --native-pointer-abi --all-exports --allow-skipped-exports) is 517 of 536 rows byte-identical to eab66646; the same census without --native-pointer-abi is 536 of 536 identical. The 19 that move: 13 rows where eab66646 skipped a function on a per-shape guard (or compiled nothing) and the branch compiles it (bulk_local_clobber_677, bulk_mask_679, home_alias_class_1189_promo, i64_width_vstack_mem_946, vcr_reach_001_i64_pair on both targets; f64_369, aarch64_align_f32_switch_1231 and spill_slot_alias_1321 on cortex-m7dp), 2 where it now refuses the whole module instead of skipping the same function (self_contained_data_758, the same straddle, now npa-region-straddle), and 4 where eab66646 baked a constant address raw (popcnt_r11_clobber_1021 pc_store: base returns 0 where wasmtime returns 1, branch equal; call_indirect_275_selfcontained: the store address now carries its relocation). Executing the changed modules against wasmtime: every i32 export, 108 calls on cortex-m3 with 3 divergent, all call_indirect_275's entry, which this harness cannot dispatch on base or branch either, and 105 calls on cortex-m7dp with 0 divergent; f64_369's 34 i32-signature exports and aarch64_align_f32_switch_1231's f32 export on cortex-m7dp, 0 divergent. spill_slot_alias_1321 is not valid wasm to wasmtime (a register-pressure fixture) and has no reference to execute against. Every object the six pre-existing native-pointer oracles compiled on eab66646 is byte-identical on the branch (recorded through a hashing wrapper around SYNTH). New oracle
        scripts/repro/npa_model_differential.py: 33 emulations, PASS on the
        branch, 19 failures on eab66646. Planted mutants, each red: the
        decision's relocation disabled (npa-addr-validate refuses the arith,
        inregion and below-SP rows), the #1672 refusal disabled (datap_neg and
        str_neg compile), the straddle check disabled (straddle_neg compiles).
        Newly refused over the repo corpus: 0 modules that compiled cleanly on
        eab66646 (the 2 self_contained_data_758 rows were already skipping the
        same function). Newly refused outside the corpus, a stated COST: `while
        p != 0x2008` where a segment DOES start at 0x2008 (the endptr probe's
        end_sp_adjacent) executed correctly on eab66646 (0x3) and is now
        refused by npa-end-pointer-compare, which refuses the comparison
        whichever region follows the segment.
        R1 BOUNDARY RULE (found probing R1; gale decided it). On the split
        layout a constant one past a memory-0 segment's end resolves to the
        START of the region holding that address. gale's image is that case
        in that sense (adjacent segments [2048, 2056) and [2056, 2057), a flag
        at 2056 read and written by offset), so the resolution stays: the
        gale-shaped fixtures (single-memory, npa_model_differential
        gale_boundary; two-memory, npa_multi_memory_1145 gale_boundary) are
        byte-identical to eab66646 on cortex-m3 and cortex-m7dp (4 of 4
        objects) and execute equal to wasmtime. Because gale's segments are
        adjacent, "start of the next region" and "end of the previous
        segment" are the same address there, so these fixtures pin that the
        resolution is unchanged, not which of the two meanings it implements.
        The narrow refusal, npa-end-pointer-compare (#1604): the boundary
        constant as an OPERAND OF A COMPARISON, directly or through a local or
        select, or through `i64.extend_i32_{s,u}`, or an `i64.const` equal to
        it; the i32 and i64 eq/ne/lt/le/gt/ge forms, signed and unsigned.
        Rows, each compiled on eab66646 and wrong there, each refused on the
        branch: end_cmp_neg (`while p != END`, 0x1043 where wasmtime returns
        0x3), end_ltu_neg (`p < END`, 0x1043), end_i64_neg (an i64 comparison
        of the extended END, 0x1043), end_i64c_neg (against `i64.const END`, a
        fault), end_scalar_neg (a counter compared with 0x2008: every constant
        in the stack-pointer window is relocated on the split layout, so
        eab66646 compared the counter with a native address and never stopped
        where wasmtime returns 8200). Near miss interior_cmp (the same walk
        against 0x2008 inside one segment) executes equal, byte-identical to
        eab66646. COST, stated: the probe end_sp_adjacent (`while p != 0x2008`
        where a segment does start at 0x2008) executed correctly on eab66646
        (0x3) and is now refused: the rule refuses the comparison whichever
        region follows. Over the repo census the refusal fires on 0 modules.
        npa_model_differential.py at this point: 33 emulations, PASS on the
        branch, 19 failures on eab66646 (15 at b5239dab plus the four new
        refusal rows; 42 and 21 after #1684 below).
        Planted mutants, each red: the comparison refusal disabled (the five
        end_* rows compile); the refusal widened to plain address use
        (gale_boundary refused in both oracles, and mem1_walk); the #1145
        raw-constant filter removed (mem1_walk refused, below).
        MEMORY 1 IS NOT AFFECTED, measured. The split layout and this rule are
        memory 0's only. In the two-memory gale fixture the memory-1 panic
        path's `i32.load8_u $m1 (i32.const 0x808)` carries one R_ARM_ABS32
        against __synth_wasm_data_1 with addend 0 (0x808 stays a raw memory-1
        offset), equal on eab66646 and the branch. A memory-1 pointer walked
        with `while p != 0x808`, where 0x808 is one past a memory-1 segment AND
        one past a memory-0 segment (npa_multi_memory_1145 mem1_walk), compiles
        and executes equal to wasmtime. What keeps the refusal off it is a
        companion change in this amendment: the constants the #1145 layering
        keeps RAW (memory-k offsets inside memory 0's window, the plan's
        raw_consts) are no longer counted as memory-0 statics by
        Provenance::memory0_plan (main.rs passes them in). Removing that
        filter refuses mem1_walk; it does not move panic1.
        npa_multi_memory_1145: 62 emulations (51 at eab66646), PASS.
        OPTION (d), measured: keep wasm-adjacent memory-0 segments adjacent in
        the native layout. For gale's shape it ALREADY holds: the object's
        __synth_wasm_seg_0 is at .data+0x0 and __synth_wasm_seg_1 at .data+0x8,
        because the packer places each segment 4-aligned in declaration order
        and segment [2048, 2056) is 8 bytes. It is not guaranteed in general:
        segments [2048, 2051) and [2051, 2052) are packed at .data+0x0 and
        .data+0x4 (a 1-byte pad), equal on eab66646 and the branch. Over the
        repo census (536 objects with the flag) 0 objects hold a wasm-adjacent
        memory-0 pair, so the corpus cannot show either way; the counter was
        checked potent on the two probes above (1 adjacent, 1 not). VERDICT:
        (d) is byte-identical for gale's fixture and for this corpus, but as a
        guarantee it means dropping the 4-byte alignment pad between
        wasm-adjacent segments, which moves bytes for any module with an
        unaligned-length adjacent pair. It is NOT landed here; it is recorded
        as the follow-on that needs gale's sign-off. gale's real image
        (seg 6 -> seg 7) is adjacent under today's packing iff segment 6's
        length is a multiple of 4 and segment 7 is declared next; gale's census
        on this head is the confirmation.
        #1684, REFUSED (maintainer decision): an `i64.const` in the static
        window that is not a boundary, compared with an extended static
        pointer (`i64.eq (i64.extend_i32_u p) (i64.const 0x2008)` over one
        segment [0x2000, 0x2010)), was silently wrong on eab66646 (a fault
        where wasmtime returns 0x3) because i64 constants are never relocated.
        New module-level refusal npa-i64-static-const (#1684): an i64.const in
        memory 0's static window [min(lowest segment, stack-pointer init),
        memory-0 size) that reaches a memory-0 address over the directed value
        flows, or is a comparison operand against a static-derived pointer
        (looking through `i64.extend_i32_*`). Only in modules that have a
        static region (R2 modules have no window). Rows i64_static_cmp_neg
        (eab66646 compiled it and faulted) and i64_static_addr_neg (eab66646
        refused it for an unrelated reason) are refused. Controls, each EXEC
        equal to wasmtime and byte-identical to eab66646: an i64.const outside
        the window compared with a static pointer (i64_outside_ctl), one inside
        it used as a plain scalar (i64_scalar_ctl), compared with a host value
        (i64_hostcmp_ctl), and an i64 counter with an in-window bound
        (i64_counter_ctl). A planted mutant disabling the refusal turns both
        refusal rows red. npa_model_differential.py: 42 emulations, PASS on
        the branch, 21 failures on eab66646 (its header floor rises 33 ->
        42 with it). Relocating i64
        constants properly is the follow-on.
        The delta-execution figures above were measured on an earlier branch
        binary; they still hold because those modules' census hashes are
        identical between that binary and this head (536 of 536 rows with the
        flag, re-run on this head).
      done-when: >
        manual:2027-03-31 memory-0 address provenance under
        --native-pointer-abi is decided in one place and checked by
        one validator over the emitted stream; the per-shape refusal
        checks it subsumes are deleted, and the count of shipped `fn
        npa_*` definitions and refusal call sites goes DOWN from the
        measurement above; the five native-pointer oracles named above
        stay at exit 0 with their objects byte-identical where they
        compiled before; #1672's repro goes from red to green or to a
        loud refusal; and the newly refused count over the repo corpus
        is stated — delivered with an execution-verified result where
        the lane is a wrong-code fix, or REFUTED with the measurement
        that refutes it; and the refuting command above is RUN FIRST
        and its result reported either way
