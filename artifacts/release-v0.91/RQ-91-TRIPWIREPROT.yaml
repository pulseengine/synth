artifacts:
  - id: RQ-91-TRIPWIREPROT
    type: system-req
    release: v0.91
    status: proposed
    title: "The ci_pool_tripwire drift cross-check runs on the runner, or its absence there is a red"
    description: >
        Carried. ci_pool_tripwire.py cross-checks its pinned required
        contexts against branch protection by calling `gh api
        .../branches/main/protection/required_status_checks/contexts`.
        On the CI runner that read is unavailable (no gh, or a token
        that cannot read protection), the function returns None, and
        the check prints UNAVAILABLE and passes. So in CI the drift
        cross-check is vacuous: it has only ever bitten when run
        locally.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact.
        A refutation is a legitimate outcome, reported with numbers:
        fetch the Claim Check job log of the latest ci.yml run on main
        (`gh run list --workflow ci.yml --branch main --limit 1`, then
        `gh api --allow-escape-sequences
        repos/pulseengine/synth/actions/jobs/ID/logs`) and grep
        `ci-pool:`. A line reading `pinned required contexts match
        branch protection` refutes it.

        MEASURED 2026-11-08 on main 2945628c (the v0.90.0 tag commit),
        synth 0.90.0 debug build from this tree: LIVE. Run 42422979955
        on 2945628c, Claim Check job 128555197210: `ci-pool: live
        required-context list UNAVAILABLE (no gh, no network, or no
        token) — the pinned contract above still ran; only the drift
        cross-check is skipped`, then `ci-pool: 0 failure(s)`.

        CITATION: #1636 is where the matter was analysed. The number
        names where it was analysed, not an open scope. It is closed,
        so `issue-scope: closes` authorises nothing; the record
        answers the residual it names, not the issue.
    tags:
      - feature-loop
      - process
      - ci
      - gate-potency
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: process
      priority: should
      issue: "#1636"
      verification-track: manual
      issue-scope: closes
      done-when: >
        manual:2027-03-31 the drift cross-check reads protection on
        the runner (a token that can read it, through REST without gh)
        or the job fails loudly when it cannot, proven by a paired
        control: a planted drift reds in CI, not only locally —
        delivered with an execution-verified result where the lane is
        a wrong-code fix, or REFUTED with the measurement that refutes
        it; and the refuting command above is RUN FIRST and its result
        reported either way
