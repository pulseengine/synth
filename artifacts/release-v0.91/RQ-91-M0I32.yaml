      landed: "v0.91 M0I32 - #1301 - DELIVERED AS NARROWED (i32 core and structured control flow at the selector's base rung only; register-pressure recovery rungs, memory, calls, i64 arithmetic, division, bit counts, floats and stack-passed parameters stay loud declines; #1754 pinned known-wrong): 104 of the 104 i32 probes of crates/synth-oracle/tests/armv6m_i32_oracle.rs and 51 of the 112 probes of armv6m_1301_differential.py compile for cortex-m0 and cortex-m0plus; gale's wdg-thin compiles 5 of the 5 call-free functions synth compiles from it (stack base: 1). #1301 stays open."
      verified-by: >
        DELIVERED AS NARROWED, execution-verified, after cold review 15
        (FIX FIRST: F1 wrong code on the recovery rungs). RED ON THE STACK
        BASE, GREEN ON THE BRANCH. The Rust oracle
        crates/synth-oracle/tests/armv6m_i32_oracle.rs (run by the
        `oracle-kiln` job, `--features exec`) compiles 104 embedded i32
        probes (constants of every materialization shape, add/sub around
        every immediate-encoding limit, register binops, shifts and rotates
        by register and immediate, all eleven compares and immediate
        compares, select, if/else, nested if, block+br_if, loops, two
        br_tables incl. gale's wdg_unlock shape, early return, unreachable,
        frame locals, gale's wdg_lock / wdg_is_running bodies, conditional
        branches beyond +-254 B forward and backward, and five reviewer fuzz
        functions that reach the `rd == rm` rules) and 20 decline probes
        (division, bit counts, i64 arithmetic, calls, memory, globals, five
        parameters, the reviewer's r1-r4 and a pool-grow shape that only a
        recovery rung selects, and a scratch-live shape), each decline
        checked for its cause. Branch: accepted exactly 104, declined
        exactly 20; 18980 probe x vector cases run on kiln and on unicorn's
        Cortex-M0 model (model id read back; R4-R11 preserved, SP balanced)
        and ALL AGREE: 18938 value comparisons, 21 trap/trap. Every accepted
        function decodes as ARMv6-M against the frozen LLVM table and the
        cortex-m0plus .text equals the cortex-m0 .text. #1754 (pre-existing
        `select` defect, not fixed here): on the lane's base its two shapes
        compiled and were wrong on exactly 75 and 150 of 216 vectors, pinned
        both ways; on the tree rebased onto main d6fff037 (batch 1's fix
        underneath) both measure 0 of 216. Stack
        base f7a77f2e: 6 of 7 tests RED (11 of 104 accepted). With kiln's
        converted module cached (ORACLEKILN, carried as its own commit) the
        whole test takes about 45 s locally (was 12-13 min).

        POTENCY. Planted IT, CBZ, MOVW, `mov r8,r0`, `mov r12,r0` and a
        16-bit LDR literal are each seen by the decode leg; a cortex-m3
        `and.w` is ILLEGAL on the M0 model; kiln running le_s for lt_s
        disagrees on exactly the 21 equal vectors. The five mutants cold
        review 15 found surviving are each RED against a mutant binary: far
        B<cond> not inverted (1323 cases disagree), far B<cond> off by one
        halfword (545), commutative rule with rd == rm (1631),
        shift-by-register with rd == rm != rn (15), scratch treated as
        always dead (the d_scratch_live decline pin). The `Ror #imm` and
        `Mvn #imm` rules the review found unreachable are deleted.

        PRESSURE FUZZ (the reviewer's gen15.py / fuzz15.py, unchanged, on
        NEW seeds, reference wasmtime, unicorn Cortex-M0 model): cortex-m0
        seeds 21000-21099 over 9 profiles, 5401 accepted functions, 75614
        cases; cortex-m0plus seeds 22000-22049, 2870 functions, 40180 cases;
        0 mismatches, 0 illegal instructions. One 25-module `loops` chunk was
        lost to the macOS unicorn+wasmtime SIGBUS flake (6 retries), so the
        counts are lower bounds. r1-r4 decline naming the `spill` rung; the
        reviewer measured 0 mismatches and 91 % -> 79 % acceptance on his
        seeds with the same interim rule.

        THE PYTHON ORACLE scripts/repro/armv6m_1301_differential.py. Leg E:
        8 -> 51 accepted on both targets, all executed against wasmtime.
        Fixture 3 -> 7 accepted. Corpus leg C: 90 objects, 413 functions
        executed (94 / 417 before F1 declined the recovery rungs), no
        disagreement. F5: a budget vector (wasmtime out of fuel) now passes
        ONLY when unicorn also runs out of its own budget (a return is a
        disagreement, comparator table updated), and the budget vectors are
        pinned EXACTLY per function (110 vectors over 35 functions), not by a
        ceiling. VALUE-COMPARISONS 666 -> 5472; `# ci-checks: emulations`
        783 -> 5715. PAIRED CONTROL: the edited script on the stack base
        binary FAILS (accepted 3 / 8, 666 comparisons, 783 emulations, 1
        budget function); on the branch it PASSES.

        BYTE IDENTITY, stack base vs branch (md5-distinct binaries), re-run
        after the F1-F7 changes: 277 md5-distinct tracked .wat/.wasm x 16
        non-ARMv6-M configurations, 4432 compiles, 0 return-code and 0
        output-byte differences (1 stderr difference: the panic thread id of
        a pre-existing aarch64 panic on if_arm_dead_value_1691.wat). The
        reviewer's independent run: 1,057 modules x 19 configurations, 0.

        GALE wdg-thin (gust_wdg_thin.loom.wasm, sha256 7f427194...d770d),
        unchanged by F1 (all base rung): of the 13 functions synth compiles
        from it, 5 are call-free (wdg_lock, wdg_is_running, __rust_alloc,
        __rust_realloc, the no-alloc shim) and all 5 compile for cortex-m0
        (stack base: 1). The 8 others each contain a call and decline. The
        module defines 15 functions; the 2 synth compiles on no target are
        neither exported nor called (one, the empty
        __link_custom_section_describing_imports, is a table element; the
        module has no call_indirect). Counted over the whole module, 6
        functions are call-free and 5 compile.
