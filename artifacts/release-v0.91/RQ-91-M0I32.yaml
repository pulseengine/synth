      req-type: functional
      priority: must
      issue: "#1301"
      verification-track: execution
      issue-scope: outlives
      done-when: >
        manual:2027-03-31 cortex-m0 and cortex-m0plus compile i32
        arithmetic, constants, compares, select and block / loop / if / br /
        br_if / br_table / return to ARMv6-M code under the accepted register
        contract (pool R0-R6, scratch R7, no R12 write, no R8), every
        accepted probe agreeing with kiln on unicorn's Cortex-M0 model and
        decoding as ARMv6-M, red on the stack base, with every non-v6-M
        target byte-identical.
      landed: "v0.91 M0I32 - #1301 - DELIVERED AS NARROWED (i32 core and structured control flow only; memory, calls, i64 arithmetic, division, bit counts, floats and stack-passed parameters stay loud declines): 96 of the 96 i32 probes of crates/synth-oracle/tests/armv6m_i32_oracle.rs and 51 of the 112 probes of armv6m_1301_differential.py compile for cortex-m0 and cortex-m0plus; gale's wdg-thin compiles 5 of the 5 call-free functions synth compiles from it (stack base: 1). #1301 stays open."
      verified-by: >
        DELIVERED AS NARROWED, execution-verified. RED ON THE STACK BASE,
        GREEN ON THE BRANCH. The new Rust oracle
        crates/synth-oracle/tests/armv6m_i32_oracle.rs (run by the
        `oracle-kiln` job, `--features exec`) compiles 96 embedded i32
        probes (constants of every materialization shape, add/sub around
        every immediate-encoding limit, register binops, shifts and rotates
        by register and immediate, all eleven compares and immediate
        compares, select, if/else, nested if, block+br_if, two loops,
        two br_tables incl. gale's wdg_unlock shape, early return,
        unreachable, frame locals, gale's wdg_lock / wdg_is_running bodies)
        and 14 decline probes for cortex-m0 and cortex-m0plus. Branch: the
        accepted set is exactly the 96 and the declined set exactly the 14,
        each with the ARMv6-M diagnostic; 16108 probe x vector cases run on
        kiln and on unicorn's Cortex-M0 model (model id read back by the
        harness; R4-R11 checked preserved, SP balanced) and ALL AGREE: 16066
        value comparisons, 21 trap/trap. Every accepted function decodes as
        ARMv6-M against the frozen LLVM table (756 halfwords; no 32-bit but
        BL, no LDR literal, no write to R8-R12), and the cortex-m0plus .text
        equals the cortex-m0 .text. Stack base f7a77f2e's binary: 5 of 6
        tests RED (11 of 96 accepted). POTENCY, each a test: planted IT,
        CBZ, MOVW, `mov r8,r0`, `mov r12,r0` and a 16-bit LDR literal are
        each seen by the decode leg; a cortex-m3 `and.w` is ILLEGAL on the
        M0 model and correct on the M3 model; kiln running le_s for the
        compiled lt_s disagrees on exactly the 21 equal vectors.

        THE PYTHON ORACLE scripts/repro/armv6m_1301_differential.py, pins
        moved as DATA only, with the paired control. Leg E (112 probes):
        8 -> 51 accepted on both targets, all 51 executed on the M0 model
        against wasmtime. Fixture: 3 -> 7 accepted (big, bits, mul, lt join
        inc, sub3, ext8); divu, callinc and ld decline in the lowering's
        rule table. Corpus leg C: 94 objects, 417 functions executed, no
        disagreement; 106 vectors are budget (wasmtime out of fuel on
        argument-counted loops the lowering now accepts), ceiling 5 -> 106.
        VALUE-COMPARISONS 666 -> 5520; `# ci-checks: emulations` 783 ->
        5763. PAIRED CONTROL: the same edited script on the stack base
        binary FAILS (rc 1: accepted 3 / 8, 666 comparisons, 783
        emulations — exactly the old pins); on the branch it PASSES.

        BYTE IDENTITY, stack base f7a77f2e vs branch (md5-distinct
        binaries): 277 md5-distinct tracked .wat/.wasm x 16 non-ARMv6-M
        configurations (cortex-m3/m4/m4f/m7/m7dp/m55 relocatable, m4f
        --cortex-m, m3 --no-optimize image and relocatable, m4f
        --safety-bounds software, cortex-r5, m7 and m4f
        --native-pointer-abi, default A32, rv32imac, aarch64), 4432 compiles:
        0 return-code and 0 output-byte differences; 1 stderr difference,
        the panic thread id of a pre-existing aarch64 panic on
        if_arm_dead_value_1691.wat (identical message on both).

        GALE wdg-thin (gust_wdg_thin.loom.wasm, sha256 7f427194...d770d):
        of the 13 functions synth compiles from it, 5 are call-free (wdg_lock,
        wdg_is_running, __rust_alloc, __rust_realloc, the no-alloc shim) and
        all 5 compile for cortex-m0 (stack base: 1, the empty shim). The 8
        others each contain a BL (import or internal call) and decline in the
        rule table, as this lane intends. The module defines 15 functions;
        the 2 synth compiles on no target are neither exported nor called
        (one, the empty __link_custom_section_describing_imports, is a
        table element; the module has no call_indirect). Counted over the
        whole module, 6 functions are call-free and 5 compile.
