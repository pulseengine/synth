artifacts:
  - id: RQ-91-M0I32
    type: system-req
    release: v0.91
    status: implemented
    title: "ARMv6-M (Cortex-M0/M0+) lowers i32 arithmetic, constants, compares, select and structured control flow to 16-bit ARMv6-M code"
    description: >
        The first real ARMv6-M lowering (lane M0-1 of the v0.91 M0 plan).
        Refs #1301 (the ARMv6-M target) and #1741 (the Rust oracle harness).
        Before it, cortex-m0 / cortex-m0plus had NO lowering: the ARMv7-M
        selector and encoder ran and the ARMv6-M byte check refused every
        function containing a non-v6-M instruction, so a constant, a compare,
        a three-register AND or a push of R8 refused the whole function.

        THE REGISTER CONTRACT (accepted by the owner via gale notice
        20261118T091556-9870f8): on ARMv6-M synth allocates R0-R6 only, uses
        R7 as its lowering scratch (callee-saved, pushed when used), writes no
        R12 and allocates no R8; R9-R11 keep their ARMv7-M roles and are not
        touched in this lane. Implemented as: an `excluded` register list on
        the direct selector's temp and pair allocators (R7, R8 on v6-M,
        empty elsewhere); the range re-allocator handed the R0-R6 pool; local
        promotion and the spill re-homing pass off on v6-M (both pick from
        R4-R8); and, in the lowering, a whole-function rename of any value a
        later pass still placed in R7/R8 to a register the function never
        names, then R12 -> R7.

        THE LOWERING (`crates/synth-backend/src/armv6m_lower.rs`, a rule table
        on the final allocated ArmOp stream, run only for ARMv6-M, between
        `finish_allocated_stream` and branch resolution). Constants become a
        MOVS / LSLS / ADDS #imm8 / MVNS sequence (at most 7 instructions; no
        literal pool, the 16-bit pool load stays refused). SetCond (an IT
        block) becomes the branch diamond `b<c> L1; movs rd,#0; b L2; L1:
        movs rd,#1; L2:` (REVIEW_2 M2: both straight-line rewrites destroy
        the compare's flags). SelectMove becomes `b<!c> L; mov rd, rm; L:`.
        Three-register data processing becomes `mov rd, rn; <op>S rd, rm`
        with the explicit flag-setting variants (`Ands`, `Orrs`, `Eors`,
        `Muls`, `Lsls`, `Lsrs`, `Asrs`, `Movs`, `Mvns`). Immediates beyond
        the 16-bit forms go through rd or the R7 scratch (refused if R7 is
        live there). The prologue / epilogue save exactly the callee-saved
        registers the body names, padded so the push keeps its size in any
        function that addresses SP. Every op outside the table is refused,
        naming it: `ARMv6-M lowering, RQ-91-M0I32 (#1301): no ARMv6-M rule
        for ...`. The v6-M encoder mode (`ArmEncoder::new_armv6m`) adds the
        16-bit `ldr/str rt,[sp,#imm8*4]`, `add/sub sp,#imm7*4`, `adds/subs
        rdn,#imm8`, `<shift>S rdn, rm` forms and turns an out-of-range
        conditional branch into `b<!c> +0; b.n target` (the same 4 bytes as
        the wide form it replaces). br_table needs no rule of its own: the
        direct selector already emits it as a compare-and-branch chain.

        WHAT STAYS DECLINED, LOUDLY: linear memory and globals (R9-R11),
        calls (BL), i64 arithmetic (I64* ops, Adds/Subs carry chains),
        division and remainder, clz/ctz/popcnt, floats, stack-passed
        parameters (no execution oracle sets them up yet), and EVERY
        function the selector's `base` rung cannot select (see REGISTER
        PRESSURE below). Two division shapes compile because the selector
        never emits a divide for them: `i32.div_u` by a power-of-two
        constant (a shift) and a foldable `i32.rem_s` (a constant). Seven
        i64 shapes lower ENTIRELY to the i32 rules and compile: i64
        and/or/xor, extend_i32_u, identity, i64 `select` and
        `if (result i64)`; the reviewer's fuzz executed all seven (1,608
        functions, both result words) with 0 mismatches.

        REGISTER PRESSURE (cold review 15 F1, the blocker of the first
        push). On ARMv6-M, code selected on the direct selector's
        exhaustion-recovery rungs returned wrong values: 100 of 39,627
        accepted fuzz functions (81 `spill`, 19 `pool-grow`), by two
        mechanisms in that pre-existing code: a reload landing in the
        register of an operand just popped (the #973 class; 105 plain
        `pop_operand` sites remain in select_with_stack.rs) and a spill
        stored on one if-arm but reloaded after the join. The R0-R6 pool
        sends ARMv6-M functions onto those rungs about twice as often as
        cortex-m3. The lowering table does not cover what the selector
        hands it, so `compile_wasm_to_arm` now DECLINES, on ARMv6-M, every
        function whose winning rung is not `base`, naming the rung. Cost,
        measured by the reviewer on the same seeds: acceptance on the
        pressure-heavy fuzz profiles falls from 91 % to 79 %, with 0
        mismatches (29 before). The real fix (reserve every popped operand
        at the multi-pop sites; make an arm's spill visible at the join) is
        the selector's, and re-enables the rungs behind a pressure fuzz.

        #1754 (cold review 15 F2), `select` overwriting a parameter's home
        register while the parameter is still on the operand stack, was
        pre-existing in the ARM direct selector and not fixed by this lane.
        On the lane's own base its two reduced ARMv6-M shapes compiled and
        were pinned, exact both ways, as known-wrong by the Rust oracle
        (`KNOWN_1754`). The ARM direct-selector fix landed underneath in
        v0.92 wrong-code batch 1 (#1767); on the tree rebased onto main
        d6fff037 both pins measure 0 of 216 vectors wrong, and the oracle
        pins that 0 exactly.

        ON THE TREE THIS LANDS ON (v0.92, RQ-92-WDGTHIN, Refs #1741): the
        figures in this record are this lane's own branch, measured before
        two later changes. The #1754 fix (v0.92 wrong-code batch 1) is
        underneath: both pinned shapes were re-measured at 0 of 216 vectors
        wrong, the `KNOWN_1754` pin is gone and they are accepted probes
        (`s1754_b1`, `s1754_b1b`). Direct calls are lowered, so the two call
        probes left this oracle's decline module for
        `armv6m_call_oracle.rs`. The oracle's counts on that tree are 106
        accepted, 18 declined, 19412 cases, 19370 value comparisons, 21
        trap/trap: measured first on the M0L2 lane's pre-restack base
        (60d4d499, batch 1 + M0I32) and re-measured unchanged on the tree
        restacked onto v092-m0i32 f4ccf064 (main d6fff037, batch 2
        underneath), where the call oracle's figures (32 accepted, 5
        declined, 484 steps, 638 host calls, 594 halfwords, 54 BL) are also
        unchanged.

        FAIL-CLOSED BEHIND IT. `armv6m::check_bytes` still checks every
        encoded instruction, and now also refuses any 16-bit MOV/ADD that
        writes R8-R12 (`ReservedWrite`). The NZCV verifier runs on every
        ARMv6-M function; the explicit flag-setting variants declare no flag
        result, so every flag they write must be dead.

        STATED LIMITS. `Add`/`Sub` keep the flag-PRESERVING model and are
        encoded as the flag-setting 16-bit ADDS/SUBS, as the ARMv7-M encoder
        already does for imm3 and register forms; the NZCV verifier holds
        those writes to "dead" (R1). No Rocq model of the v6-M rules. No
        WCET (the profile still declines `unsupported-core`). Prologues may
        save a pad register (R2/R3) to keep a push's size, and leaf
        functions that name no callee-saved register still get a two-
        instruction `push {r3, lr}` / `pop {r3, pc}` (cost for the WCET
        lane). The forward scratch-liveness scan is sound only because R12
        (renamed R7) is never live across a label; that invariant is now
        checked on every function (refusal otherwise) and unit-tested.
        `Ror #imm` and `Mvn #imm` have no rule: the direct selector never
        emits either, and the untested rules were deleted.
