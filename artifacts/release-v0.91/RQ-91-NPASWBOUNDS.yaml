artifacts:
  - id: RQ-91-NPASWBOUNDS
    type: system-req
    release: v0.91
    status: implemented
    title: "In-bounds memory-0 accesses do not trap under the native-pointer ABI with software bounds"
    description: >
        WRONG BEHAVIOUR, the other direction from a missing trap: a
        correct program is stopped. Under --native-pointer-abi
        --safety-bounds software, memory 0's accesses and bulk ops
        compare a NATIVE pointer against R10, memory 0's size in
        bytes. The guard is meant for a wasm offset, so an in-bounds
        access traps whenever the native address exceeds the size.
        RQ-91-NPAMODEL is the natural fix: guard the wasm offset
        before the native relocation, or refuse the flag pair.

        REFUTING COMMAND, to be RUN BEFORE building on this artifact.
        A refutation is a legitimate outcome, reported with numbers:
        with run_leg and the three-memory MEMS from
        scripts/repro/memk_bulk_oob_1619_differential.py, add `(func
        (export "fill0") (param i32 i32 i32) (memory.fill $m0
        (local.get 0) (local.get 1) (local.get 2)))`, `copy00`
        (memory.copy $m0 $m0), `st0` (i32.store $m0) and `ld0`
        (i32.load $m0), and run the in-bounds calls fill0(n:0x100,
        0xab, 0x40), copy00(n:0x200, n:0x100, 0x20), st0(n:0x300,
        0x12345678), ld0(n:0x300) (`n:` is a memory-0 offset passed as
        its native address) in the software/npa leg (`--safety-bounds
        software --native-pointer-abi`) and, as the control, the
        none/npa leg. Every call equal to wasmtime in the software/npa
        leg, or a refusal of the flag pair, refutes it.

        MEASURED 2026-11-08 on main 2945628c (the v0.90.0 tag commit),
        synth 0.90.0 debug build from this tree: LIVE. software/npa: 0
        of 4 in-bounds calls equal; every call traps (UDF) where
        wasmtime returns, the loads and the store as well as fill and
        copy. Control none/npa: 4 of 4 equal, ld0 returning 0x12345678
        as wasmtime does.

        CITATION: #1661 is where the matter was analysed. The number
        names where it was analysed, not an open scope.
    tags:
      - feature-loop
      - bug
      - wrong-behaviour
      - gale
    links:
      - type: derives-from
        target: BR-001
    fields:
      req-type: functional
      priority: must
      issue: "#1661"
      verification-track: execution
      issue-scope: closes
      landed: "branch v091-npamodel - #1661 - DELIVERED AS A LOUD REFUSAL of the flag pair for modules that touch memory 0: npa-software-bounds (#1661), module-level. A module that touches only memory k keeps its memory-k guard (memk_bulk_oob_1619's software/npa leg stays green)."
      verified-by: >
        DELIVERED as a refusal, execution-verified. Red at eab66646: the
        refuting command's software/npa leg compiled and trapped 0 of 4
        in-bounds calls equal. On the branch the same module is refused rc 1
        naming function fill0's memory.fill; the none/npa control stays 4 of 4.
        npa_model_differential.py swb_neg is refused; memk_bulk_oob_1619 (214
        emulations, its software/npa leg on memory k only) and the 1145 oracle
        (safety_sw_xcopy, safety_mask_mem0 refused with the new name;
        safety_mask on a memory-1-only module still reaches the per-memory mask
        decline) pass.
      done-when: >
        manual:2027-03-31 an execution differential against wasmtime
        over in-bounds and out-of-bounds memory-0 loads, stores, fill,
        copy and init under --native-pointer-abi --safety-bounds
        software is green, or the flag pair is refused with a named
        diagnostic; red before and green after — delivered with an
        execution-verified result where the lane is a wrong-code fix,
        or REFUTED with the measurement that refutes it; and the
        refuting command above is RUN FIRST and its result reported
        either way
