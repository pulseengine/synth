    title: "The architecture model step of the feature loop is filed for v0.91, not inherited"
    description: >
        The feature loop's architecture steps (spar AADL model and the
        WIT derived from it) have been marked not applicable release
        after release; a recurring not-applicable is a backlog item,
        not an exemption. This record files it for v0.91. Its blocker
        is spar#445 (undeclared property sets are accepted silently).

        REFUTING COMMAND, to be RUN BEFORE building on this artifact.
        A refutation is a legitimate outcome, reported with numbers:
        `python3 scripts/recurring_na_filing_check.py` and `gh -R
        pulseengine/spar issue view 445 --json state,updatedAt`. A
        current filing or the step performed, or spar#445 closed,
        changes the disposition.

        MEASURED 2026-11-08 on main 2945628c (the v0.90.0 tag commit),
        synth 0.90.0 debug build from this tree: FILED, NOT PERFORMED.
        spar#445 is OPEN, last updated 2026-09-03; #1136 is OPEN, last
        updated 2026-09-22. Before the anchor moved the filing check
        passed on v0.90's filing (`steps-1-2 filing VISIBLE:
        RQ-90-ARCHMODEL11 ... scoped to v0.90`); this record is the
        v0.91 filing it looks for once the anchor is v0.90.0.

        CITATION: #1136 is where the matter was analysed. The number
        names where it was analysed, not an open scope.
