  # ---------------------------------------------------------------------------
  # #879 — the gpio-thin oracle's CI wiring, pinned so it cannot be silently
  # UN-wired again (it sat un-wired for two releases while its size claim
  # headlined v0.50.1 and v0.52.0). Pins the script + the pinned real-driver
  # fixture, capstone in the job's dep install (the mask census disassembles
  # .text), and the CI-side NON-ZERO check-count assertion (exit 0 alone is
  # not trusted — the "0 ops accepted PASS" lesson).
  # ---------------------------------------------------------------------------
  - id: SYNTH-GPIO-846-ORACLE-CI-WIRED
    doc: .github/workflows/ci.yml
    text: "scripts/repro/gpio_thin_846_differential.py"
    evidence:
      - kind: file-exists
        path: scripts/repro/gpio_thin_846_differential.py
      - kind: file-exists
        path: scripts/repro/gpio_thin_846.loom.wasm
      - kind: verbatim
        text: "pip install wasmtime unicorn pyelftools capstone"
      - kind: verbatim
        text: 'grep -q "^#846 CHECKS=285/285" gpio846.out'
      # The scope caveat must travel WITH the gate. The gpio differential is
      # blind to gpio_configure's surviving `mode << 2` mask (the driver's own
      # `>u 6` guard discards the shift result exactly when the mask matters —
      # verified by force-eliding it: 490 B object, gate still all-matching).
      # Pinning the cross-reference keeps a future reader from mistaking this
      # gate for the guard on that site.
      # Single-LINE substring on purpose: a multi-line pin would also encode
      # the comment's wrap column and break on a harmless re-wrap.
      - kind: verbatim
        text: "red with 6 mismatches under the same mutation."

  # ---------------------------------------------------------------------------
  # VCR-MEM-004 / #901 — the SoftwareBoundsChecker cost claim.
  #
  # `synth-memory/src/bounds.rs` carried "~25-40% overhead" as a bare assertion
  # for its whole life, and #901's whole premise is that verification pays for
  # itself against exactly that number. So the doc now states a MEASURED cost,
  # and this entry pins the doc's numbers to the constants the byte gate
  # asserts against real compiled bytes. Change the lowering and the gate's
  # constants move; move them without updating the doc and this reddens.
  #
  # What is pinned is the CAPABILITY (a measured guard tax and a measured
  # recovery on a named fixture), never an issue number — a closed issue would
  # let the ledger green-confirm a false residual (the v0.53 lesson).
  # ---------------------------------------------------------------------------
  - id: SYNTH-PROVEN-SAFE-901-MEASURED
    doc: crates/synth-memory/src/bounds.rs
    text: "138 B (+147 %) and 40 instructions"
    evidence:
      - kind: verbatim
        text: "recovers 80 B (58 % of the tax)"
      - kind: file-exists
        path: crates/synth-cli/tests/proven_safe_bounds_901.rs
      - kind: file-exists
        path: scripts/repro/proven_safe_bounds_901_differential.py
      - kind: file-exists
        path: scripts/repro/proven_safe_bounds_901.wat
      # The doc's 138 B tax and 80 B recovery ARE the gate's constants.
      - kind: count-eq
        pattern: "const TAX_ALL_8: usize = 138;"
        glob: "crates/synth-cli/tests/proven_safe_bounds_901.rs"
        expect: 1
      - kind: count-eq
        pattern: "const SAVED_PROVEN_5: usize = 80;"
        glob: "crates/synth-cli/tests/proven_safe_bounds_901.rs"
        expect: 1
      # Fail-closed is the deliverable: the refusal must stay in the ingestion.
      - kind: count-eq
        pattern: "REFUSED — module_sha256 mismatch"
        glob: "crates/synth-core/src/proven_safe.rs"
        expect: 1

  # ---------------------------------------------------------------------------
  # #890 — the ORACLE-WIRING surface, generalized. SYNTH-GPIO-846-ORACLE-CI-WIRED
  # above pins ONE script's CI wiring by hand; that is the instance-at-a-time
  # shape this entry replaces. `scripts/repro/*.py` are synth's execution
  # oracles, and 69 of 150 were referenced by NO workflow while nothing in the
  # tree told a forgotten gate from an intentionally-manual one. Every script now
  # carries a `# ci-status:` declaration and `scripts/oracle_wiring_check.py`
  # (claim-check CI job) PROVES every `wired` one is actually wired — that check
  # is mechanical and needs no ledger. What a header CANNOT express is the
  # ratchet on the totals, which is what this entry is:
  #
  #   * wired   >= 145 — a FLOOR. The oracle surface must not be emptied by
  #                      deleting harnesses instead of fixing them.
  #   * manual  <=   7 — a CEILING on the legitimate escape hatch (4 measurement,
  #                      2 scratch, 1 external-input; itemized in the doc). An
  #                      eighth needs a conversation, not a commit.
  #   * unwired <=   0 — a CEILING OF ZERO on known debt. A new oracle that is
  #                      not wired is a RED BUILD, not a backlog entry.
  #
  # Lower the manual ceiling when one is wired; never raise it to green a build.
  # ---------------------------------------------------------------------------
  - id: SYNTH-ORACLE-WIRING-890
    doc: scripts/repro/ORACLE_WIRING.md
    text: "**145 wired**"
    evidence:
      - kind: file-exists
        path: scripts/oracle_wiring_check.py
      - kind: count-min                      # the surface must not be emptied
        pattern: '^# ci-status: wired'
        glob: ['scripts/repro/*.py', 'scripts/repro/*.sh']
        min: 145
      - kind: count-max                      # the legitimate escape hatch
        # 7 -> 8 (RQ-59-PARTIALCENSUS #1017). The doc says an eighth needs a
        # CONVERSATION, not a commit, so here it is, recorded where the next
        # person raising this ceiling will read it.
        #
        # partial_census_1017.py is a CENSUS the maintainer scoped to MEASURE
        # AND STOP: it re-derives the one-function-blocks-module share over a
        # corpus's full decline set so the --allow-partial decision has a
        # number instead of an intuition. It has no expected values and no
        # verdict — there is nothing for CI to fail on — and its input is the
        # 805-module real-world corpus (#1017) that CI does not carry. Wiring
        # it would mean inventing an assertion the artifact was explicitly
        # scoped not to make.
        #
        # It is the same KIND as the four `measurement` entries already here
        # (size_attribution_390, local_promotion_headroom,
        # vcr_dec_001_join_alloc_measure, ...): a report whose numbers are
        # judged by a human, whose SUBJECT is gated elsewhere. The behaviour
        # this one measures — a declined function declining its whole module —
        # is gated by the wired decline-honesty oracles, not by this script.
        #
        # What would make this the WRONG call: if the census ever grows an
        # expected value or a pass/fail verdict, it stops being a measurement
        # and must be wired instead of counted here.
        pattern: '^# ci-status: manual'
        glob: ['scripts/repro/*.py', 'scripts/repro/*.sh']
        max: 8
      - kind: count-max                      # known debt: zero, and it stays zero
        pattern: '^# ci-status: unwired'
        glob: ['scripts/repro/*.py', 'scripts/repro/*.sh']
        max: 0
      - kind: verbatim                       # the doc must carry the manual budget
        text: "**8 manual**"
      - kind: verbatim
        text: "**0 unwired**"

  # ---------------------------------------------------------------------------
  # #910 — what a wired oracle ATTESTS. SYNTH-ORACLE-WIRING-890 above pins that
  # a step RUNS each oracle; it says nothing about what that step checks, and
  # measured on the #890 result, 152 of 160 oracle steps asserted only the
  # process exit code. Exit 0 cannot tell "emulated 240 vectors" from "the loop
  # never ran", so every `wired` oracle now declares a `# ci-checks:` floor that
  # scripts/oracle_run.py enforces per run.
  #
  # The CAPABILITY pinned here (deliberately not an issue number — a ledger
  # pinned to a closed issue green-confirms a false residual, the v0.53 burn):
  #
  #   * every wired oracle carries a floor      — count-min 151 declarations
  #   * the execution population does not shrink — count-min 147 `emulations`
  #                                                declarations, and the summed
  #                                                floor is ratcheted in CI by
  #                                                --min-emulation-floor
  #   * the `none` escape hatch stays at ONE     — count-max 1. A second oracle
  #                                                that can bind to nothing needs
  #                                                a conversation, not a commit.
  #
  # Floors are `>=`, so adding a fixture cannot redden a step; the ratchet
  # direction is UP. Lower the recorded minimum only when the evidence genuinely
  # weakened — never to green a build.
  # ---------------------------------------------------------------------------
  - id: SYNTH-ORACLE-CHECK-FLOORS-910
    doc: scripts/repro/ORACLE_WIRING.md
    text: "**322,754 emulator entries**"
    evidence:
      - kind: file-exists
        path: scripts/oracle_run.py
      - kind: file-exists
        path: scripts/oracle_evidence.py
      - kind: count-min                      # every wired oracle declares a floor
        pattern: '^# ci-checks: '
        glob: ['scripts/repro/*.py', 'scripts/repro/*.sh']
        min: 151
      - kind: count-min                      # the EXECUTION population, per script
        pattern: '^# ci-checks: emulations >= '
        glob: ['scripts/repro/*.py', 'scripts/repro/*.sh']
        min: 147
      - kind: count-max                      # the "nothing can be bound" hatch
        pattern: '^# ci-checks: none'
        glob: ['scripts/repro/*.py', 'scripts/repro/*.sh']
        max: 1
      - kind: verbatim                       # the doc carries the per-mode split
        text: "**147 oracles**"
      - kind: verbatim
        text: "Reported per mode and never summed across modes."
      - kind: verbatim                       # the itemized weak-floor list stays
        text: "## The oracles whose floor is weak, itemized"

  # ---------------------------------------------------------------------------
  # #910 — the THIRD surface carrying this number: the FEATURE_MATRIX template.
  #
  # Found while adding the #916 and #901 oracles: ORACLE_WIRING.md and ci.yml
  # were pinned, the generated matrix was NOT, so the ledger reported 42/42 HOLD
  # while the matrix still read "133 oracles assert 294,914". A number quotable
  # in a shipped doc and bound to no gate is the #880 defect exactly — the gate
  # checked the matrix against its RENDER, never its CONTENT.
  #
  # Pinned on the TEMPLATE, not the rendered file: the render is generated
  # (`--emit-status`), so pinning the output would be satisfiable by a
  # regeneration that faithfully reproduces wrong prose.
  # ---------------------------------------------------------------------------
  - id: SYNTH-ORACLE-CHECK-FLOORS-910-MATRIX
    doc: scripts/templates/feature_matrix.md.tmpl
    text: "**147 oracles assert 322,754 emulator"
    evidence:
      - kind: file-exists
        path: scripts/oracle_run.py
      - kind: count-min                      # same population the other two pin
        pattern: '^# ci-checks: emulations >= '
        glob: ['scripts/repro/*.py', 'scripts/repro/*.sh']
        min: 147

  # ---------------------------------------------------------------------------
  # #910 — the CI side of the same claim, pinned so the doc's number and the
  # number the gate actually enforces cannot drift apart, and so the routing
  # cannot be quietly undone (unrouting a step would restore exit-status-only
  # assertion while every other surface still claimed a floor).
