  # ===========================================================================
  # RQ-58-METRIC (#242) — THE SUBTRACTION METRIC.
  #
  # Epic #242 exists to REPLACE the patch-accreting code generator. Measured
  # v0.42.0 -> v0.57.0 it went the other way and nothing noticed, because
  # nothing measured it. Re-derived independently for this ledger (per-tag,
  # `git show <tag>:<file>`; the `_code` region ends at `#[cfg(test)] mod
  # tests`, which occurs exactly once and is asserted to):
  #
  #   tag        lines_total  lines_code  wild_total  wild_code  dsl_rules
  #   v0.42.0         24,909      14,694          89         51         40
  #   v0.45.0         27,179      16,072          99         56         50
  #   v0.50.0         28,419      17,283          99         56         50
  #   v0.54.0         29,551      18,415         105         62         50
  #   v0.57.0         29,616      18,480         105         62         50
  #
  # Read the CODE column: +3,786 hand-written lines (+25.8%) against +10 rules,
  # and the rules have been flat since v0.45.0 — TWELVE releases, not the seven
  # first reported. The growth is not test growth: the test module grew 10,215
  # -> 11,136 over the same span, a fifth of the code growth.
  #
  # DIRECTION IS THE POINT. Ceilings must FALL; the floor must RISE; `value:`
  # must EQUAL the live derivation so no slack is expressible; an improvement
  # must be BANKED into `baseline:`; growth is allowed but costs a `waivers:`
  # entry bound to the new value with a written reason. Full semantics and the
  # honest residual: the RQ-58-METRIC block in scripts/claim_check.py. The
  # predicate is unit-tested (scripts/test_claim_check.py, 32 cases, wired in
  # the claim-check job) because this release's thesis is that the CHECKERS are
  # where the defects are, and this is a new checker.
  # ===========================================================================
  - id: SYNTH-SUBTRACTION-SELECTOR
    doc: CLAUDE.md
    text: "It is done when the hand-written arm it"
    evidence:
      # THE LOAD-BEARING PIN: hand-written lowering code, test module excluded.
      # RQ-58-RETIRE (delete the arms the 50 DSL rules replaced) is measured
      # here, and so is any lane that adds an arm without deleting one.
      # RQ-58-RETIRE (v0.58): first downward movement — the 50 DSL rules'
      # superseded hand-written arms deleted (36 flag-guarded sites across
      # both selectors) plus the then-dead SYNTH_SEL_DSL lever, each deletion
      # byte-identity-gated (688-row corpus manifest + 10 frozen anchors).
      # 18,582 -> 17,897; banked. The former #992 waiver (to: 18582) is
      # deleted with the re-bank — a surviving waiver above the new baseline
      # would be a standing licence to grow back to it.
      - kind: ratchet
        name: selector_lines_code
        direction: down
        value: 18907
        baseline: 17897
        waivers:
          - to: 18907
            reason: >-
              RQ-60-VFPPRESSURE increment 1 (#1069, #869): +619 lines — the
              AEABI builtin route for the six i64/f32-typed conversion family
              members on SINGLE-precision FPU targets (m4f/m7, --relocatable).
              A function with NO f64 in its WASM signature was declined for
              "needing f64" because the #869 inline lowering runs on
              double-precision machinery; the route (__aeabi_l2f/ul2f/
              f2lz/f2ulz, base-AAPCS core-register calls, zero VFP pressure)
              is the one #869's acceptance comment specified and jess #1069
              measured as the m4f blocker. Growth, not substitution, by
              design: the m7dp inline path is byte-frozen (anchors + a
              pre/post cmp on the minimal repro), so nothing could be
              deleted in exchange — this is new reach on targets where the
              family had NO lowering at all. Gated red-first
              (tests/aeabi_i64_float_1069.rs: declined -> routed with named
              builtin + pinned Udf guard geometry) and by the
              aeabi_i64_float_1069_differential.py execution differential
              (unicorn + spec-exact builtin stubs vs wasmtime, trap rows
              executed).
            reason: >-
              RQ-59-I64SHIFT (#1048): +10 lines in select_default — the
              i64.clz/ctz/popcnt arm now emits its own explicit
              `Movw R1, #0` result-hi zero (plus the comment saying why),
              because the encoder expansions' implicit `MOV rnhi, #0` was
              DELETED: it was aimed at the result's high half but wrote the
              OPERAND's home high register, an executed miscompile on the
              direct selector (clz_reread(0xDEADBEEF00000001) returned 0x1 —
              hi limb wiped; i64_operand_clobber_1048_differential.py, 54/105
              vectors red before, 105/105 green after, 3 legs incl. A32).
              Soundness fix moving a hidden write to an explicit selector op,
              not a new lowering decision; the Rocq/SMT pseudo-op models
              always specified the rd-only behavior the bytes now have.
          - to: 18278
            reason: >-
              RQ-59-SUBTRACT (#242, increment 6): the residual above baseline
              FELL 18,291 -> 18,278 (-13) — the sign-extension family's five
              hand-written emissions (sws I32Extend8S/16S Sxtb/Sxth pushes,
              the sws I64Extend{8,16,32}S construction match incl. its
              `_ => unreachable!()`, sd's five fixed-register vec arms) were
              deleted in favour of the five new Rocq-proved rules, costing
              +21 lines of rule-delegation scaffolding against -33 deleted.
              Byte-identity gated: 704-row corpus manifest (176 fixtures x 4
              configs incl. pinned declines, sign_extend_family.wat ADDED
              first because the prior corpus had zero extendN_s coverage)
              identical to the pre-deletion baseline; 10/10 frozen anchors.
              The residual above baseline it carries forward is the two
              waived v0.59 soundness growths (#989 WAR guard, #990
              domination walk) minus this fall, re-derived from the tree.
              The final -1 is the same lane delegating select_default's
              I64ExtendI32S / I32WrapI64 hand-written pseudo constructions
              to their existing increment-5 rules (structurally identical
              ArmOp values; I64ExtendI32U REFUSED — its rule lowers to the
              MOV+MOVW pair, different bytes, hand-written arm stays).
          - to: 18291
            reason: >-
              MERGE OF TWO INDEPENDENTLY-WAIVED GROWTHS. RQ-59-WARALIAS (#989)
              measured 17,961 -> 18,134 (+173) and RQ-59-ZEROINIT (#990)
              measured 17,961 -> 18,118 (+157); both were correct against the
              v0.58 base and NEITHER is correct once both land. The deltas
              compose exactly (17,961 + 173 + 157 = 18,291), re-derived from
              the merged tree rather than carried over from either branch.
              The gate caught this: a waiver is bound to its value, so two
              waived growths do not silently authorise their sum. Both
              underlying growths are the ARM soundness fixes this release
              leads with — a WAR home-register snapshot guard and a
              domination-precise zero-init classifier — each gated by an
              executed unicorn-vs-wasmtime differential that was RED before
              the fix.
          - to: 18118
            reason: >-
              RQ-59-ZEROINIT (#990): the shared `read_before_write_locals`
              zero-init classifier's LINEAR first-access rule was an EXECUTED
              info-disclosure miscompile — a `local.set` on one arm of a
              `br_if`/`if`/`br_table` suppressed the #457 zero-init without
              dominating the merge-point read, so the skipping path returned
              previous-frame stack bytes (measured: 0xDEADBEEF poison on ARM
              AND RV32, brif_local_zeroinit_990_{arm,riscv}_differential.py,
              22/34 -> 34/34). The +157 is the domination walk that replaces
              it (branch-target pre-scan + scope-stack with block/loop/if-
              intersection propagation, precision the VCR-RA-003 holder model
              itself demanded — the coarse draft tripped SpillSlotAliased on
              RV32) plus its doc contract. Soundness fix, not a new lowering
              decision; oracle-gated red-first per the #973 template.
          - to: 17961
            reason: >-
              RQ-58-SPLIT (#242) unit 2: pure relocation of the direct /
              production path (`select_with_stack`, 7,754 lines moved with
              ZERO token changes) into
              instruction_selector/select_with_stack.rs. The +23 is module
              plumbing only (sibling doc header, `use super::*;`, impl
              wrapper, parent `mod` decl) — zero new lowering decisions,
              byte-identity gated (10/10 frozen anchors).
          - to: 17938
            reason: >-
              RQ-58-SPLIT (#242): pure relocation of the pattern-match /
              fallback path (`select()` + `select_default`, 2,503 lines
              moved verbatim) out of the monolith into
              instruction_selector/select_default.rs. The +26 is module
              plumbing only — the sibling's module doc header,
              `use super::*;`, the `impl InstructionSelector` wrapper, and
              the parent's `mod select_default;` declaration — zero new
              lowering decisions, byte-identity gated (10/10 frozen
              anchors). The family glob (b37994da) counts the sibling, so
              the relocation itself reads as ±0.
          - to: 17912
            reason: >-
              RQ-58-WILDCARD (#946): wasm_stack_effect's `_ => (0, 0)`
              wildcard — which absorbed ~92 WasmOp variants and was hiding an
              EXECUTED miscompile (if/br_if/br_table conditions,
              memory.copy/fill operands and call arguments never left the i64
              width-inference stack; unicorn returned 32/0 where wasmtime
              returns 1) — was replaced by a fully-enumerated 279-variant
              match, and infer_i64_locals grew the call-argument pops plus
              their threading. +94 lines of stated-per-variant decisions in
              exchange for one silent absorber: exactly the
              lines-for-exhaustiveness trade this release wants, gated by
              tests/selector_stack_effect_no_wildcard_946.rs (no catch-all
              regrowth, every variant named) and the executed
              i64_width_vstack_946 fixtures. Wildcard ceiling fell 56 -> 55
              in the same PR. RQ-58-SELDSL then took back 79 of the +94
              (17,991 -> 17,912): 24 new Rocq-proved rules (51-74) deleted
              the hand-written imm-fold/conversion/select emissions, each
              byte-identity-gated — the residual 15 above baseline is the
              #946 enumeration, still justified as stated above.
          - to: 18134
            reason: >-
              RQ-59-WARALIAS (#989): the executed local.set/local.tee WAR
              miscompile — `local.get` of a register-homed local pushed the
              HOME register by reference, and a later write to the SAME
              local destroyed it (war_set returned 200 for every input, 44
              wrong vectors across 4 exports). +173 lines are the
              `snapshot_home_reg_aliases` guard (the ARM analogue of RV32's
              #472 `snapshot_aliases`) plus its four call sites in the
              LocalSet/LocalTee register-homed arms — new SOUNDNESS
              decisions, zero wildcards, gated by the executed
              war_aliasing_989_arm_differential (110 wrong vectors -> 0,
              both ARM legs) and the corpus sweep's both-direction ratchet
              (the four #989 KNOWN_ARM_MISMATCHES entries deleted).
      # The whole-file figures the release plan and the sibling lanes quote. An
      # unpinned quoted number is the drift class this release is about — but
      # they are `track`, not `down`, and the distinction is deliberate. Both
      # include the file's TEST MODULE, so a PR that only adds test coverage
      # moves them; requiring a WAIVER for that would file "added 40 lines of
      # tests" next to "grew the patch pile" in the same list, and a waiver
      # channel full of noise is one nobody reads. `track` still forbids slack
      # — the ledger must carry the live number — it just declines to assert a
      # direction for a mixed population. Nothing is lost: total minus code IS
      # the test module, and code is pinned `down`.
      - kind: ratchet
        name: selector_lines_total
        direction: track
        # 29839 -> 28495 (RQ-58-RETIRE): -685 code-region lines (the arm
        # deletions) and -659 test-module lines (the four mirror-pin tests,
        # vacuous once the hand-written mirror was gone — the
        # VcrSelRulesGenCheck precedent).
        # 28495 -> 28599 (RQ-58-WILDCARD #946): +94 code (the waived
        # wasm_stack_effect enumeration above) +10 test module (the
        # threaded infer_i64_locals/compute_local_layout test call sites).
        # 28599 -> 28533 (RQ-58-SELDSL): -79 code (24 new rules deleted the
        # imm-fold/conversion/select hand-written emissions) +13 test module
        # (the reworked #258 fold pin asserts each half separately).
        # 28533 -> 28559 (RQ-58-SPLIT unit 1): +26 module plumbing for the
        # select_default.rs relocation (see the lines_code waiver above);
        # the 2,503 moved lines themselves are ±0 under the family glob.
        # 28559 -> 28582 (RQ-58-SPLIT unit 2): +23 module plumbing for the
        # select_with_stack.rs relocation; the 7,754 moved lines are ±0.
        # 28582 -> 28755 (RQ-59-WARALIAS #989): +173 code, all in the
        # snapshot_home_reg_aliases WAR guard + its four call sites (see the
        # lines_code waiver); zero test-module movement.
        # 28912 -> 28899 (RQ-59-SUBTRACT increment 6): -13 code (the
        # sign-extension family arm deletions + the select_default
        # width-conversion delegation, see the lines_code waiver);
        # zero test-module movement.
        # 28899 -> 28929 (RQ-59-I64SHIFT #1048): +10 code — select_default's
        # explicit i64 bit-count result-hi zero, replacing the encoder
        # expansions' operand-clobbering implicit `MOV rnhi, #0` (see the
        # lines_code waiver) — PLUS +20 test module, the #1048 operand-clobber
        # assertions in instruction_selector.rs (all past the `#[cfg(test)]
        # mod tests` marker, so the DIRECTED lines_code ceiling correctly does
        # not see them: adding test coverage must never cost a waiver).
        # 28929 -> 29553 (RQ-60-VFPPRESSURE increment 1, #1069): +619 code —
        # the AEABI builtin route for the i64<->f32 conversion family on
