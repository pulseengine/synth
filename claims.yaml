        glob: ['.github/workflows/*.yml']
        min: 160
      - kind: count-min                      # per-job measured-evidence ledgers
        pattern: 'oracle_evidence\.py'
        glob: ['.github/workflows/*.yml']
        min: 37
      - kind: verbatim
        text: "ORACLE_EVIDENCE_JSONL: oracle-evidence.jsonl"

  # ---------------------------------------------------------------------------
  # #910 — the coverage instrument says its SCOPE. The job was `Code Coverage`,
  # a name implying whole-system coverage for a measurement of the Rust test
  # suite alone; the differentials spawn an UNINSTRUMENTED subprocess from other
  # jobs and are structurally invisible to it. Pinned so the scope caveat cannot
  # be dropped while the number stays quotable — a green-but-meaningless number
  # is worse than a red one.
  # ---------------------------------------------------------------------------
  - id: SYNTH-COVERAGE-SCOPE-910
    doc: .github/workflows/ci.yml
    text: "name: Rust-test Line Coverage (unit + integration only)"
    evidence:
      - kind: verbatim                       # the caveat travels WITH the number
        text: "**Do not add them together.**"
      - kind: verbatim
        text: "UNINSTRUMENTED process"

  - id: SYNTH-COVERAGE-SCOPE-910-README
    doc: README.md
    text: "<b>Rust-test line coverage only</b>"
    evidence:
      - kind: verbatim                       # the badge alt-text matches the scope
        text: "[![Rust-test line coverage]"
