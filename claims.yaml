# claims.yaml — synth's load-bearing documentation claims, bound to evidence.
#
# Per the pulseengine-claude `claim-verification` skill: a README is a claim
# about the system — the same species as a requirement, pointing the other way.
# CI runs `scripts/claim_check.py claims.yaml`; drift = red.
#
# DESIGN (since the claim-surface extension PR):
#
#   * Numbers live in ONE machine-derived artifact — `artifacts/status.json`,
#     emitted from the `status_fields:` derivations below by
#     `scripts/claim_check.py claims.yaml --emit-status` and STALENESS-GATED
#     (the committed file must equal re-derivation, byte for byte). README
#     badges (shields.io dynamic-JSON) and the GENERATED
#     `docs/status/FEATURE_MATRIX.md` surface them; README/linked-doc prose
#     stays number-free.
#   * Qualitative prose claims ("all i32/i64 ops have T1 proofs", "f64
#     complete", "verified" wording) stay in prose ONLY when pinned here as
#     pattern-claims.
#   * CLAUDE.md and coq/STATUS.md still hand-carry headline numbers (they are
#     working documents, not README-linked marketing surface); their numbers
#     stay count-eq-pinned so a proof landing must update doc + ledger in the
#     same PR.
#   * The README's linked-doc surface is closed: every relative .md link must
#     be claim-covered, generated, or allowlisted with a rationale
#     (`readme_link_coverage:` below).
#   * GitHub repo metadata (description/topics) is pinned under
#     `repo_metadata:` and checked by `scripts/repo_metadata_check.py`
#     (CI step in the claim-check job; API failure = loud SKIP, never a
#     false red).
#
# When a proof lands / a rule lands / a roadmap status changes: regenerate the
# derived artifacts (`--emit-status`), and update CLAUDE.md/coq/STATUS.md AND
# this ledger in the same PR. Never "fix" a red gate by loosening the ledger
# while leaving a prose overclaim in place.
#
# Not bound here (deliberately — runtime-derived, gated elsewhere): the
# 141/141 ordeal-vs-Z3 agreement and 139/139 validator counts (re-derived by
# the CI `verify` job that actually runs them), the wasm spec-suite compile
# rate (CI-tracked), and cycle/size numbers (gale silicon + differential
# jobs).

# -----------------------------------------------------------------------------
# status_fields — the derivations behind artifacts/status.json (the single
# machine-derived numbers artifact). Each field is re-computed from source on
# every claim_check run; the committed status.json and the generated
# docs/status/FEATURE_MATRIX.md must match exactly.
# -----------------------------------------------------------------------------
status_fields:
  version:
    kind: capture
    file: Cargo.toml
    pattern: '^version = "([^"]+)"'   # [workspace.package].version (pin-swept)
  rocq_qed:
    kind: count
    pattern: 'Qed\.'
    glob: ['coq/Synth/**/*.v']
  rocq_admitted:
    kind: count
    pattern: 'Admitted\.'
    glob: ['coq/Synth/**/*.v']
  rocq_admit_tactics:
    kind: count
    pattern: '^\s*admit\.'
    glob: ['coq/Synth/**/*.v']
  rocq_axioms:
    kind: count
    pattern: '^\s*(?:Axiom|Parameter) '
    glob: ['coq/Synth/**/*.v']
  sel_dsl_rules:
    kind: count
    pattern: '^rule_'
    glob: ['coq/vcr_sel_rules.manifest']
  sel_dsl_rule_qed:
    kind: count
    pattern: '^(?:Theorem|Lemma) rule_\w+_correct'
    glob: ['coq/Synth/Synth/VcrSelRules.v']
  sel_dsl_pilot_qed:
    kind: count
    pattern: 'Qed\.'
    glob: ['coq/Synth/Synth/VcrSelPilot.v']
  sail_bridge_qed:
    kind: count
    pattern: 'Qed\.'
    glob: ['coq/Synth/ARM/SailArmBridge.v']
  # -- ISA-model basis (#867): the #682-class trusted base, made countable.
  # STATIC textual classification (a heuristic, labelled as one): a rule
  # theorem is "stated against the simplified model" iff its conclusion runs
  # the flat ArmSemantics.v executor on the rule's sequence — the literal
  # `exec_program (rule_` text in VcrSelRules.v. What this can miss: a theorem
  # phrased through an alias of exec_program, or a future Sail-basis theorem
  # that ALSO mentions exec_program; today neither exists, and the companion
  # invariants in SYNTH-ISA-MODEL-BASIS (rule-theorem count == simplified-basis
  # conclusion count, zero SailArmBridge imports) pin that.
  sel_rules_simplified_basis:
    kind: count
    pattern: 'exec_program \(rule_'
    glob: ['coq/Synth/Synth/VcrSelRules.v']
  # ArmRefinement.v's ASSUMED simplified->Sail connection, itemized:
  # `Admitted.` + `admit.` tactics + the opaque `Axiom sail_exec_instr`.
  # The number that should only shrink (toward real Sail-generated semantics).
  arm_refinement_assumed_connection:
    kind: count
    pattern: '(?:Admitted\.)|(?:^\s*admit\.)|(?:^\s*(?:Axiom|Parameter) )'
    glob: ['coq/Synth/ARM/ArmRefinement.v']
  # The simplified model's OWN axiomatic surface: float/conversion bit-level
  # operations taken on faith inside the very model the proofs execute.
  arm_semantics_axioms:
    kind: count
    pattern: '^\s*(?:Axiom|Parameter) '
    glob: ['coq/Synth/ARM/ArmSemantics.v']
  # -- #867 phase 2: model-coverage tier counts, read from the COMMITTED
  # artifacts/model-coverage.json (whose freshness vs re-derivation is gated
  # by `scripts/model_coverage_audit.py --check` in the claim-check CI job —
  # so these counts cannot go stale OR be hand-edited without a red build).
  # Tier names are unique to the arm_instr universe in that artifact.
  isa_model_bridge_validated:
    kind: count
    pattern: '"tier": "bridge-validated"'
    glob: ['artifacts/model-coverage.json']
  isa_model_simplified_only:
    kind: count
    pattern: '"tier": "simplified-only"'
    glob: ['artifacts/model-coverage.json']
  # THE COMPLEMENT (the #867 headline): modelled ISA behaviours NO proof
  # exercises — the candidate list for the next silent miscompile.
  isa_model_uncovered:
    kind: count
    pattern: '"tier": "uncovered"'
    glob: ['artifacts/model-coverage.json']
  wasmcert_bridge_qed:
    kind: count
    pattern: 'Qed\.'
    glob: ['coq/Synth/WASM/WasmCertBridge.v']
  kani_harnesses:
    kind: count
    pattern: '#\[kani::proof\]'
    glob: ['crates/**/*.rs']
  verus_spec_fns:
    kind: count
    pattern: '^pub open spec fn '
    glob: ['crates/synth-synthesis/src/contracts.rs']
  # -- RQ-58-MIRRORS (#242): the A32 no-wildcard tripwire's universe size.
  #
  # FOUND STALE BY THIS LANE: the feature matrix said "221-variant no-wildcard
  # tripwire" while BOTH tripwire constants said 222 — a doc number that had
  # already rotted, sitting behind a green 43/43, in the release whose subject
  # is doc rot. Substituting it means the sentence tracks the constant.
  #
  # The constant itself is DOUBLE hand-maintained on purpose (two independent
  # soundness tripwires, each re-scanning `rules.rs` against its own copy), and
  # `wcet_sp_no_wildcard_946.rs` says "bump ARM_OP_VARIANT_COUNT here AND in
  # a32_no_silent_nop_615.rs". SYNTH-A32-TRIPWIRE-UNIVERSE below pins the two
  # copies to EACH OTHER with `fields-equal`, so the reminder is now a check.
  a32_tripwire_variants:
    kind: capture
    file: crates/synth-backend/tests/a32_no_silent_nop_615.rs
    pattern: '^const ARM_OP_VARIANT_COUNT: usize = (\d+);'
  a32_tripwire_variants_sp_leg:
    kind: capture
    file: crates/synth-backend/tests/wcet_sp_no_wildcard_946.rs
    pattern: '^const ARM_OP_VARIANT_COUNT: usize = (\d+);'

  # -- RQ-58-MIRRORS (#242): the aarch64 op surface, derived from the REAL
  # selector rather than from text ABOUT it.
  #
  # HISTORY, because the replacement is the point. This used to be
  # `aarch64_selector_ops`: distinct `WasmOp::` tokens in selector.rs before
  # `mod tests`. That measures which op names APPEAR in a file, which is a
  # proxy for "handled" — an op named only inside a decline arm would have
  # counted as handled. The three fields below come instead from
  # `artifacts/aarch64-op-surface.json`, which the cross-backend op-parity
  # oracle EMITS by running `select_typed_cf_calls` on every `WasmOp`
  # representative (`a64_op_surface_artifact_is_fresh_242`, freshness-gated in
  # the Test job; 0 representatives may fall through unprobed).
  #
  # MEASURED at the swap: the retired grep and the new probe both produce 185,
  # so the render did not move — a strictly stronger derivation replacing a
  # weaker one, byte-invisible. The weaker one was DELETED, not kept alongside
  # (v0.58's subtraction rule).
  #
  # NOT treated as corroboration, deliberately: 185 distinct `WasmOp::` tokens
  # and 185 lowering probe labels are DIFFERENT UNIVERSES (197 labels total,
  # and one label such as `simd (grouped)` covers several variants). The
  # equality is almost certainly coincidence, which is why it is not pinned
  # with `count-same` — a false 1:1 invariant is exactly the kind of gate this
  # release exists to stop shipping.
  aarch64_ops_probed:
    kind: count
    pattern: '"op": '
    glob: ['artifacts/aarch64-op-surface.json']
  aarch64_ops_lowered:
    kind: count
    pattern: '"status": "lowered"'
    glob: ['artifacts/aarch64-op-surface.json']
  aarch64_ops_declined:
    kind: count
    pattern: '"status": "declined"'
    glob: ['artifacts/aarch64-op-surface.json']
  # The op-level decline LIST itself, substituted into the feature matrix.
  # This is what stops the aarch64 decline enumeration being hand-typed prose
  # that went stale twice in v0.57.
  aarch64_declined_ops:
    kind: json-list
    file: artifacts/aarch64-op-surface.json
    list: ops
    where:
      status: declined
    field: op
    wrap: '`'
    join: ', '

  # ---------------------------------------------------------------------------
  # RQ-58-METRIC (#242) — THE SUBTRACTION METRIC.
  #
  # Derived ONCE here; the directed `kind: ratchet` pins under `claims:` name
  # these fields instead of carrying their own regexes, so the gate cannot
  # mirror-drift from the numbers it publishes.
  #
  # WHY REGION-SCOPED, and it is the load-bearing design choice. The plan of
  # record quotes whole-file figures (29,616 lines, 105 `_ =>` arms). Re-derived
  # here, 43 of those 105 arms and 11,136 of those lines are in the file's OWN
  # TEST MODULE. A ceiling on the whole file would therefore (a) let a lane
  # "make progress" by deleting test arms, and (b) fire on every PR that adds
  # test coverage — training everyone to bump the ledger reflexively, which is
  # how a ratchet rots into a formality. Both figures are pinned: the `_code`
  # ones (measured before `#[cfg(test)] mod tests`) are where the hand-written
  # lowering decisions actually live; the `_total` ones are pinned because the
  # release plan and the sibling lanes quote them, and an unpinned quoted number
  # is the drift class this whole release is about.
  #
  # `\n` counts newlines == `wc -l`, verified against the real file (29,616 /
  # 18,480). The wildcard pattern is line-anchored on purpose: `Some(_) =>` and
  # a `_ =>` inside comment prose must not count as match arms (regression-
  # tested in scripts/test_claim_check.py).
  # RQ-58-SPLIT (#242): these four fields measure the selector FAMILY — the
  # root file PLUS everything under crates/synth-synthesis/src/
  # instruction_selector/ — summed, not the one hardcoded path they measured
  # before the split. The single-file version would have let a pure relocation
  # (move 5,000 lines to a sibling module) collapse the ceiling while the
  # number of hand-maintained decisions was UNCHANGED: a green gate certifying
  # progress that did not happen, the exact vacuous-checker class this repo
  # keeps finding. Family-summed, a relocation inside the family is ±0 by
  # construction and only DELETION registers as progress. The `_code` fields
  # use `before_missing: whole-file` because split-out siblings carry no test
  # module (their whole text IS code); the root file keeps its marker, and a
  # mangled root marker still reddens loudly because every pin below demands
  # `value:` EQUAL the live derivation (see _region in scripts/claim_check.py).
  selector_lines_total:
    kind: count
    pattern: '\n'
    glob: ['crates/synth-synthesis/src/instruction_selector.rs',
           'crates/synth-synthesis/src/instruction_selector/**/*.rs']
  selector_lines_code:
    kind: count
    pattern: '\n'
    glob: ['crates/synth-synthesis/src/instruction_selector.rs',
           'crates/synth-synthesis/src/instruction_selector/**/*.rs']
    before: "#[cfg(test)]\nmod tests"
    before_missing: whole-file
  selector_wildcard_arms_total:
    kind: count
    pattern: '^[ \t]*_ =>'
    glob: ['crates/synth-synthesis/src/instruction_selector.rs',
           'crates/synth-synthesis/src/instruction_selector/**/*.rs']
  selector_wildcard_arms_code:
    kind: count
    pattern: '^[ \t]*_ =>'
    glob: ['crates/synth-synthesis/src/instruction_selector.rs',
           'crates/synth-synthesis/src/instruction_selector/**/*.rs']
    before: "#[cfg(test)]\nmod tests"
    before_missing: whole-file
  # The "generate, don't mirror" inventory, counted in FILES (`unit: files`)
  # because that is the population the plan states and the unit a mirror is
  # retired in. STATIC TEXTUAL CLASSIFICATION, labelled as the heuristic it is
  # (same disclosure as `sel_rules_simplified_basis` above): it finds files that
  # SAY they carry a mirror / a hand-maintenance obligation, which is a proxy
  # for files that HAVE one. It over-counts prose ("the encoder mirrors the
  # operand order") and cannot see an unlabelled mirror at all — #974's three
  # copies of `referenced_locals` were found by a human, not by this.
  mirror_marker_files:
    kind: count
    pattern: '(?i)mirror'
    glob: ['crates/**/*.rs']
    unit: files
  # The RANKED subset, and the one RQ-58-MIRRORS should actually drive down: a
  # file that states a keep-in-sync OBLIGATION, whatever wording it uses. 23
  # files; 17 of them also say "mirror" (the intersection), 6 state the
  # obligation without the word. "hand-maintained" alone — the plan's figure —
  # is 11, a strict subset of these 23.
  mirror_obligation_files:
    kind: count
    pattern: '(?i)hand-maintained|hand-written mirror|keep(?:s|ing)? in sync|must (?:agree|stay in sync|match)|second source of truth|forget to update'
    glob: ['crates/**/*.rs']
    unit: files

  # Names, not numbers — const is allowed here, but the supporting crates must
  # exist on disk or the derivation fails.
  backends:
    kind: const
    value:
      - arm-thumb2-cortex-m
      - arm-a32-cortex-r5
      - riscv32-rv32imac
      - aarch64-a64
    require:
      - crates/synth-backend
      - crates/synth-backend-riscv
      - crates/synth-backend-aarch64

# =============================================================================
# RQ-58-MIRRORS (#242) — THE MIRROR INVENTORY, ranked by rot-risk.
#
# A named unconverted mirror is a known risk; an unnamed one is the next #975.
# This block names them ALL, converted and unconverted, so the unconverted ones
# are a register rather than a discovery.
#
# COUNTS, re-derivable (the spec's figures reproduce exactly, and their scope
# is worth stating because it excludes where the costliest drift happened):
#   git ls-files 'crates/*' | grep '\.rs$' | xargs grep -lIi mirror            -> 57
#   ... | xargs grep -lIi hand-maintained                                      -> 11
#   ... | xargs grep -lIi 'single source of truth'                             ->  1
# Repo-wide, over ALL tracked text files, the same three greps give 125 / 22 / 8.
# The 68 files outside crates/**/*.rs include scripts/ (18) and docs (18) —
# where the FEATURE_MATRIX template rot actually lived.
#
# DISCRIMINATOR: does a stale copy give a wrong ANSWER (a miscompile, a
# wrongly-passed verification, a wrongly-green gate, a wrong decline) or only a
# wrong DOC? Ranked wrong-answer-and-unguarded first.
#
# --- TIER 1 · wrong ANSWER, nothing mechanically checked it ------------------
#  1. count_params x3 backends .......................... CONVERTED this lane
#     was: arm_backend.rs:214 / riscv backend.rs:383 / aarch64 backend.rs:202,
#     three byte-equivalent copies of an UNSOUND read-before-write heuristic.
#     now: synth_core::count_params_heuristic + SYNTH-COUNT-PARAMS-SINGLE-SOURCE
#     (byte-identical over 512 objects; count-max 0 anti-regrowth tripwire).
#  2. aarch64 decline list: code vs FEATURE_MATRIX ...... CONVERTED this lane
#     was: hand-typed template prose; went stale TWICE in v0.57 and named a
#     SHIPPED capability as a decline. now: artifacts/aarch64-op-surface.json
#     emitted from the real selector, substituted as {{aarch64_declined_ops}}.
#  3. ARM_OP_VARIANT_COUNT x2 tripwire files ............ CONVERTED this lane
#     a32_no_silent_nop_615.rs:33 / wcet_sp_no_wildcard_946.rs:38, guarded only
#     by a comment ("bump ... here AND in ..."). A desync disables one soundness
#     tripwire while the other stays green. now: SYNTH-A32-TRIPWIRE-UNIVERSE
#     (fields-equal, value-level).
#  4. all_wasm_op_representatives() ..................... CONVERTED this lane
#     cross_backend_op_parity.rs:706. A hand-maintained Vec mirroring the WasmOp
#     enum; classify() is compiler-enforced complete but does NOT force a Vec
#     entry, and never covered DELETION. Once this file began EMITTING the
#     op-surface artifact from that Vec, a missing op became silently absent
#     from a derived doc. now: representatives_cover_every_wasm_op_variant_242
#     pins len() to the enum's own declaration (279 == 279), with a >=250
#     non-vacuity floor on the parse.
#  5. exec_trap_subset_op allowlist <-> encode_op arms <-> the test's re-list
#     .................................................... NOT CONVERTED
#     synth-verify/src/arm_semantics.rs:2804 + its encode_op match + tests/
#     arm_semantics_isa_faithfulness_923.rs:1435, whose own doc says "one
#     hand-maintained mirror guarding another". The v0.57 drift allowlisted Rsb
#     (emitted by the default-on Rocq-proved rule_i32_rotl) and two trunc ops to
#     arms that did not exist. MITIGATED by ArmState::unmodeled re-checking at
#     runtime (loud, not preventive) — the two hand lists remain.
#  6. shrink_callee_saved_saves <-> body_uses_callee_saved allowlists
#     liveness.rs:4993 / :5431 — "mirrors shrink's allowlist exactly", twice.
#     A prologue save elided for a register the body uses. Guard: the comment.
#  7. liveness.rs ResolvedBranchGeometry's `Label = 0` table (:7745) vs the
#     estimator, which has no arm for it — a third byte-size opinion the
#     estimator_encoder_agreement oracle does not cover.
#  8. reg_effect <-> rewrite_op positional mirror (liveness.rs:3494) — checked
#     by a mutual-consistency oracle (:11518) with "no third ground truth".
#
# --- TIER 2 · wrong ANSWER, a named mechanical check exists ------------------
#  9. estimate_arm_byte_size <-> ArmEncoder::encode — estimator_encoder_
#     agreement.rs, exhaustive, empty gap allowlist. The best-defended mirror
#     in the repo and the model for #4.
# 10. RV32 emitted_byte_size <-> assemble_function sizing — checked by a
#     3-size-class sample, NOT exhaustive over RiscVOp.
# 11. WCET cycle literals: wcet.rs <-> claims.yaml SYNTH-WCET-CYCLE-MODEL <->
#     wcet_bound_gate.rs literals. Pins the literal TEXT, not the derivation.
# 12. sel_dsl::RULES <-> coq/vcr_sel_rules.manifest <-> VcrSelRules.v — largely
#     CONVERTED by #667 (the .v re-exports generated Gen.rule_X); the manifest
#     is a third hand-maintained file, checked both ways.
# 13. synth-verify/src/trap.rs <-> ordeal::trap taxonomy — structural drift
#     fails to compile, semantic drift does not.
# 14. shadow_budget.rs StackDepthBound <-> scry's StackBound — a deliberately
#     dep-free re-declaration of another tool's three-valued result. Unchecked.
# 15. WasmOp matched exhaustively in 5 places, ArmOp in 9 — pairwise checks
#     only, no transitive closure. synth-verify's two reference models are not
#     parity-checked against any selector.
#
# --- TIER 3 · wrong DOC ------------------------------------------------------
# 16. FEATURE_MATRIX template numbers — the 21 `unchecked` entries below ARE
#     this tier, itemized with rationales. One of them (221 vs 222) was already
#     STALE when this lane found it and is now derived.
# 17. known_divergences() prose "**18 entries** — the number below. Keep this
#     line in step with the array" (cross_backend_op_parity.rs:810). The array's
#     staleness IS asserted; the sentence's is not. Correct today (18 == 18).
# 18. ORACLE_WIRING.md "**145 wired**" — pinned by count-MIN 145, so the prose
#     can silently UNDERSTATE as oracles are added. Same shape for "7 manual".
# 19. scripts/publish.rs CRATES_TO_PUBLISH <-> workspace members <-> docs/
#     release-process.md — checked only at release time.
# 20. RV32 startup.rs / linker_script.rs / pmp.rs "Mirrors synth-backend::..."
#     — parallel implementations of emitted C and linker text; unchecked.
# 21. safety/stpa/system-constraints.yaml:92,112 — a cross-REPO three-way ABI
#     mirror (meld/kiln), asserted as a constraint and checked by nothing here.
#
# --- ALREADY CONVERTED before this lane (cite as patterns, do not re-do) -----
#   * wcet.rs op_cost / op_mnemonic — exhaustive no-wildcard match + Debug-
#     derived mnemonics: "no second source of truth to forget to update".
#   * expansion_validator.rs — validates the literal emitted bytes, so there is
#     no hand copy of the expansion to drift.
#   * oracle_wiring_check.py — IMPORTS oracle_run.py's declaration parser
#     instead of re-implementing it.
#   * synth_core::referenced_locals (#974), rewrite_memory_grow_zero.
#   * artifacts/status.json, model-coverage.json, aarch64-op-surface.json —
#     committed derived artifacts under a byte-equality freshness gate.
# =============================================================================

# -----------------------------------------------------------------------------
# feature_matrix_facts — RQ-58-MIRRORS (#242). The EXHAUSTIVENESS half of the
# template-vs-code gate.
#
# `check_generated_fresh` compares the RENDER to the TEMPLATE, never the
# template to the CODE. The repo already had the right mechanism for the second
# half (#880: a claim whose `doc:` is the template), but nothing said which
# assertions it covered — so an unpinned number looked exactly like a pinned
# one, and v0.57 shipped three stale ones behind a green 43/43.
#
# `check_template_facts` now requires EVERY number in the template to be one of
# DERIVED ({{field}}), PINNED (a template-doc claim), UNCHECKED (declared
# below, with a rationale) or MASKED (an identifier token, declared below with
# a `why:`). Anything else is red. Dead entries and dead masks are red too, so
# the ledger cannot rot in the other direction.
#
# WHAT THIS GATE DOES **NOT** DO, stated plainly: it does not prove a pinned or
# unchecked claim TRUE. It proves every assertion was classified on purpose and
# fails closed on new ones. The `unchecked` list below IS the honest inventory
# of what remains unverified — read it as the risk register, not as noise.
# -----------------------------------------------------------------------------
feature_matrix_facts:
  # NON-VACUITY floors. An EMPTY template classifies perfectly, so the cheapest
  # way to green an exhaustiveness gate is to delete the assertions. These are
  # `>=` floors on the two buckets that represent real verification; adding
  # coverage never reddens, the ratchet direction is UP.
  floors:
    derived: 25            # {{field}} substitutions re-derived every run
    pinned: 12             # spans pinned by a claim whose doc: is the template

  # Identifier-shaped tokens that carry a digit but assert nothing measurable.
  # This list is the RESIDUAL TRUST in the exhaustiveness gate: a real fact
  # hidden behind one of these patterns would go unclassified and unnoticed, so
  # every mask is narrow and says why.
  masks:
    - pattern: '#\d+'
      why: GitHub issue/PR reference — a stable identifier, never a measurement
    - pattern: '\bv\d+\.\d+(?:\.\d+)?\b'
      why: release-version reference (v0.53); the live version is {{version}}
    - pattern: '\b[iuf](?:8|16|32|64)\b'
      why: WASM/Rust scalar type-width token (i32, i64, f32, f64) — a type name
    - pattern: '\bv128\b'
      why: the WASM SIMD value-type name; a type, not a count of anything
    - pattern: '§[\d.]+'
      why: WebAssembly specification section reference (§4.4.8) — a citation
    - pattern: 'IEEE 754-\d+'
      why: the name of an IEEE standard revision, not a derived quantity
    - pattern: '\bT[123]\b'
      why: proof-tier names T1/T2/T3 defined in coq/STATUS.md — labels
    - pattern: '(?:VCR|RQ)-[A-Z0-9]+(?:-[A-Z0-9]+)+'
      why: rivet artifact identifiers (VCR-SEL-005, VCR-A64-CF-001) — names
    - pattern: '\bAAPCS\d*\b|\bR_[A-Z0-9_]+\b|:lo12:'
      why: ABI, ELF relocation and assembler-operator names — ISA identifiers
    - pattern: '\bcortex-[a-z0-9]+\b|\brv32[a-z]*\b|\besp32c3\b|\bRV32IMAC\b|\bM3\b|\bM4\b|\bM7\b|\bM4F\b'
      why: target/profile names (cortex-m4f, rv32imac, esp32c3) — hardware names
    - pattern: '\bAArch64\b|\bA64\b|\bA32\b|\bThumb-2\b|\bx28\b|\bR9\b|\bR11\b|\bIP0\b'
      why: architecture and architectural-register names — ISA identifiers
    - pattern: '0x[0-9A-Fa-f]+'
      why: hex literals name an encoding (the 0xFC prefix), not a measurement
    - pattern: '\bmemory (?:0\b|k>0\b|k\b)|grow\((?:0|n>0)\)|(?<![\w])[−-]1\b|÷0|\[0\]\[brk|exits? 0\b|\b1:1\b'
      why: WASM/POSIX semantics written inline (grow(0) ≡ size, memory k>0,
        returns -1, exits 0, a 1:1 correspondence, the null table slot [0]) —
        the digits are part of an operation's definition, not a measurement
    - pattern: 'extend(?:8|16|32)_s|extend8/16/32_s|trunc_sat_f(?:32|64)_[su]|convert_i(?:32|64)_[su]|reinterpret_[if](?:32|64)|wrap_i64|promote_f32|demote_f64|load(?:8|16|32)_[su]|store(?:8|16|32)\b'
      why: WASM operator NAMES whose spelling embeds a width (i64.extend8_s,
        i32.trunc_sat_f64_u) — op names, never counts
    - pattern: 'phases? \d(?:[–-]\d)?\b|milestone \d\b|phase \d\b|lane L\d\b|Tiers? \d\b'
      why: work-item labels (phase 3, milestone 4, lane L3) — ordinals, not data
    - pattern: '\bO\(n\)|\bINT_MIN\b|\bNaN\b|1e30\b|\bfunc_N\b|\bu32\b'
      why: notation appearing in prose (O(n), 1e30, func_N) — symbols, not counts

  # ---------------------------------------------------------------------------
  # UNCHECKED — the honest residual. Each entry is an assertion in the template
  # that NO derivation covers. A named unconverted mirror is a known risk; an
  # unnamed one is the next #975.
  # ---------------------------------------------------------------------------
  unchecked:
    - text: "`>8`"
      rationale: >
        The AAPCS64 register-argument limit. It is a constant of the ABI rather
        than of synth, and the code expresses it as a slice length rather than a
        named const, so there is nothing to re-derive against today.
    - text: "past 16 targets"
      rationale: >
        `BR_TABLE_MAX_TARGETS` IS a named const and IS asserted == 16 by
        `br_table_subshape_asymmetry_882`, but no status field exposes it, so
        the template's copy is not re-derived. The cheapest remaining
        conversion: publish the const as a status field.
    - text: "an 8-byte slot"
      rationale: >
        The aarch64 globals slot width. Expressed as arithmetic on offsets in
        selector.rs rather than a named constant, so there is no token to
        re-derive; naming the constant is the prerequisite for pinning it.
    - text: "i32 (19 ops) + i64 (22 ops)"
      rationale: >
        The WasmCert-Coq fragment sizes. The Qed total IS derived
        ({{wasmcert_bridge_qed}}); the per-fragment op split is not separately
        countable from the .v file without a convention marking each op's
        theorems, which does not exist yet.
    - text: "5 of 8 sites proven ⇒ 232 → 152 B (80 B, 58 % of the guard tax) and 70 → 45 executed instructions"
      rationale: >
        A MEASUREMENT from one #901 fixture run, not a property of the tree. Its
        oracle re-measures it in CI; reproducing the number inside claim_check
        would mean re-running a compile from a doc gate. Left as a dated
        measurement, deliberately.
    - text: "502 -> 494 B, 3 -> 1 masks"
      rationale: >
        Same class as the #901 measurement above — a gpio-thin fixture size
        recorded from a differential run, re-measured by its own oracle rather
        than by this doc gate.
    - text: "the 7 `manual` scripts"
      rationale: >
        Pinned only by a count-MAX of 7 in SYNTH-ORACLE-WIRING-890, so the prose
        can silently overstate if the real number falls. The count-max protects
        the budget, not the sentence.
    - text: "**152 of the\n  160** workflow steps"
      rationale: >
        A historical measurement of the pre-#910 state ("asserted nothing beyond
        the exit code"). It describes a tree that no longer exists, so there is
        nothing live to re-derive it from; it is narrative by construction.
    - text: "exactly 8 asserted a printed verdict or count"
      rationale: >
        Part of the same pre-#910 historical measurement above.
    - text: "7 assert a printed count, 9 assert compilations, and 1"
      rationale: >
        The per-mode split of oracle floor declarations. Countable in principle
        (`# ci-checks: stdout|compiles|none` headers) but not exposed as status
        fields; the emulations leg IS pinned by SYNTH-ORACLE-CHECK-FLOORS-910.
    - text: "reads ~42 %"
      rationale: >
        A coverage percentage produced by `cargo llvm-cov` in a different CI
        job. Approximate by intent (the "~"), and re-deriving it here would mean
        running the coverage tool from a doc gate.
    - text: "`Holds 431 / NotAttempted 202 / Violated 0` over 633 corpus functions"
      rationale: >
        A VCR-VER-004 corpus measurement whose own text says the counts GROW as
        lanes add fixtures — the invariant is `Violated 0`, which its CI floor
        asserts; the two absolute counts are a dated snapshot.
    - text: "~68 % of the shipping path"
      rationale: >
        Derived from the 431/633 snapshot above; same class, same reason.
    - text: "so 87 of `ArmOp`'s 222\n    variants"
      rationale: >
        The #923 before-state. `ArmOp` variants ARE countable, but "87 modeled
        as no-ops" describes the code BEFORE the fix and cannot be re-derived
        from the tree that shipped it. Historical by construction.
    - text: "unmodeled set to **73** (41 MVE\n    vector ops; 32 others"
      rationale: >
        The CURRENT unmodeled count, and the one genuinely worth converting:
        `encode_op`'s decline arm could emit its own universe the way the
        aarch64 op surface now does. Named as the next conversion, not done in
        this lane.
    - text: "Those 73 now DECLINE"
      rationale: >
        Restates the 73 above in the same paragraph; converts with it.
    - text: ">8-arg / i64-arg / multi-value calls decline loudly"
      rationale: >
        The RISC-V call-marshalling arity limit. Same class as the aarch64 `>8`
        entry: an ABI constant expressed as a slice length, with no named
        constant in the code to re-derive the sentence from.
    - text: "(0 against the Sail-derived one)"
      rationale: >
        An assertion that ZERO rule theorems are stated against the Sail-derived
        model. It is the complement of {{sel_rules_simplified_basis}}, which IS
        derived, but the complement itself has no derivation — a Sail-basis
        theorem could land and this sentence would not notice.
    - text: "leaves 0 undeclared and 0 unwired scripts"
      rationale: >
        Pinned by SYNTH-ORACLE-WIRING-890's count-max 0 — but that claim's doc:
        is ORACLE_WIRING.md, so the pin covers the OTHER copy of this sentence,
        not this one. A textbook instance of the class this release is about.
    - text: "the invariant is `Violated 0`"
      rationale: >
        The VCR-VER-004 corpus invariant. Its CI job asserts it on every run;
        nothing re-derives the sentence in this doc, and there is no status
        field carrying the validator's Violated count.
    - text: "18/18 declined"
      rationale: >
        The v0.58 empirical probe of the module/shape-level aarch64 declines.
        Not a function of a WasmOp, so it is outside the derived op-surface
        artifact; converting it needs a probe harness per shape claim, named as
        follow-up work in this lane's report.

# -----------------------------------------------------------------------------
# readme_link_coverage — the README-linked .md surface is CLOSED. A linked doc
# must be claim-covered (some claim's `doc:`), listed as generated, or
# allowlisted here WITH a rationale. New links fail CI until classified.
# -----------------------------------------------------------------------------
readme_link_coverage:
  generated:
    - docs/status/FEATURE_MATRIX.md         # rendered by --emit-status; staleness-gated
  unpinned_ok:
    - path: CHANGELOG.md
      rationale: append-only release narrative; historical record, no live current-state claims
    - path: CONTRIBUTING.md
      rationale: process document; carries no capability or verification claims
    - path: docs/spectre-policy.md
      rationale: normative policy statement reviewed per lowering-rule PR; qualitative, no derived counts
    - path: docs/architecture/SYNTH_LOOM_RELATIONSHIP.md
      rationale: qualitative two-tier (loom optimizes / synth compiles) design note; no derived counts
    - path: docs/requirements/REQUIREMENTS.md
      rationale: forward-looking requirements draft (marked Draft in the doc); aspirational by nature, not a current-state claim surface
    - path: scripts/repro/vcr_ver_001_gate.md
      rationale: frozen repro evidence transcript for VCR-VER-001; existence pinned by SYNTH-VCR-VER-001-DEMONSTRATED

# -----------------------------------------------------------------------------
# repo_metadata — the GitHub About surface (description + topics), pinned
# verbatim. `scripts/repo_metadata_check.py` fetches the live values and fails
# on mismatch (API/network failure = loud SKIP so a flake can't block merges).
# -----------------------------------------------------------------------------
repo_metadata:
  repo: pulseengine/synth
  description: "Synth — WebAssembly-to-native compiler for ARM Cortex-M/R (Thumb-2/A32), RISC-V RV32, and AArch64, with mechanized Rocq correctness proofs, per-compilation translation validation, and sound WCET bounds. Part of the PulseEngine toolchain."
  topics:
    - aarch64
    - arm
    - compiler
    - embedded
    - formal-verification
    - pulseengine
    - riscv
    - rust
    - wcet
    - webassembly

claims:
  # ---------------------------------------------------------------------------
  # README badges — the number surface. The README carries NO hand-typed proof
  # counts; it carries shields.io dynamic-JSON badges whose JSONPath queries
  # must point at fields status.json actually derives. History: was
  # "298 Qed / 8 Admitted" prose while the tree held 470; prose numbers are
  # now banned from the README entirely.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # RQ-58-MIRRORS (#242) — the A32 tripwire universe, pinned copy-to-copy.
  #
  # `ARM_OP_VARIANT_COUNT` is deliberately declared TWICE: `a32_no_silent_nop_615`
  # (the silent-NOP tripwire) and `wcet_sp_no_wildcard_946` (the may_move_sp
  # tripwire) each re-scan `rules.rs` against their own copy, so two independent
  # instruments assert the universe rather than one. The cost of that
  # independence is a hand-maintained mirror whose only guard was a comment
  # ("bump ... here AND in a32_no_silent_nop_615.rs"). A desync silently
  # disables one soundness tripwire while the other stays green.
  #
  # `fields-equal` makes the comment a check. It compares VALUES, so unlike a
  # count-same over a literal it cannot go vacuously green if both copies are
  # edited to the same wrong number.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # RQ-58-MIRRORS (#242) — count_params: three copies collapsed to one, and the
  # collapse made permanent.
  #
  # #974 centralised `referenced_locals` (the FIX) and left `count_params` (the
  # UNSOUND heuristic it replaced on the declared-count path) as three
  # byte-equivalent private copies, one per backend. Three copies of an unsound
  # rule is the worse case: a correction applied to one silently does not reach
  # the other two.
  #
  # Collapsed to `synth_core::count_params_heuristic`. Proven behaviour-
  # preserving by byte-identity: 512 objects over scripts/repro/*.wat x
  # {cortex-m4, self-contained --cortex-m, --relocatable, rv32, aarch64},
  # md5-identical before and after.
  #
  # THE NEEDLE WAS COUNTED BEFORE AND AFTER (v0.56's lesson: a mutation test
  # that never mutated printed `ok`). Byte-identity over a sweep that never
  # REACHES the moved code proves nothing, and this heuristic only runs on the
  # no-declared-count path. Negative control: make the function return a
  # constant 7 and re-run the same sweep — 174 of 510 hashes MOVE (and 2
  # compiles fail outright). So the sweep genuinely exercises it on ~34 % of
  # the corpus, and the zero-diff result is evidence rather than an artifact of
  # dead code.
  #
  # The count-max leg is the anti-regrowth tripwire: `let mut first_access` is
  # the heuristic's distinctive local, so a backend re-growing a private copy
  # reddens rather than quietly re-triplicating.
  # ---------------------------------------------------------------------------
  # ===========================================================================
  # COMPLIANCE ENVELOPE — what the DEFAULT configuration does and does not do.
  # Added after the wasm2c-performance findings (Narayan, UT Austin) showed
  # competitors' numbers flattered by undisclosed non-compliance. The lesson is
  # not "they cheated" — it is that a compliance envelope stated only in a
  # maintainer's head becomes a comparison that misleads in one's own favour.
  # synth's default emits NO out-of-bounds trap; that is a deliberate bare-metal
  # mode, and it must be stated wherever performance or "verified" claims live.
  # This pin exists so the default cannot change silently: it asserts BOTH that
  # the default is None AND that the doc says so.
  # ===========================================================================
  - id: SYNTH-SAFETY-BOUNDS-DEFAULT-ENVELOPE
    doc: CLAUDE.md
    text: "--safety-bounds"
    evidence:
      - kind: count-eq                       # the default really is None
        pattern: 'safety_bounds: SafetyBounds::None'
        glob: ['crates/synth-core/src/backend.rs']
        expect: 1
      - kind: count-min                      # and the doc states the envelope
        pattern: 'no out-of-bounds trap'
        glob: ['CLAUDE.md']
        min: 1

  - id: SYNTH-COUNT-PARAMS-SINGLE-SOURCE
    doc: crates/synth-core/src/wasm_op.rs
    text: "pub fn count_params_heuristic"
    evidence:
      - kind: count-eq                       # exactly ONE definition, repo-wide
        pattern: 'pub fn count_params_heuristic'
        glob: ['crates/**/*.rs']
        expect: 1
      - kind: count-max                      # no backend may re-grow a copy
        pattern: 'let mut first_access'
        glob: ['crates/synth-backend/src/**/*.rs',
               'crates/synth-backend-riscv/src/**/*.rs',
               'crates/synth-backend-aarch64/src/**/*.rs']
        max: 0
      - kind: verbatim                       # the unsoundness stays NAMED
        text: "UNSOUND, deliberately kept and deliberately named"

  - id: SYNTH-A32-TRIPWIRE-UNIVERSE
    doc: scripts/templates/feature_matrix.md.tmpl
    text: "no-wildcard tripwire"
    evidence:
      - kind: fields-equal
        names: [a32_tripwire_variants, a32_tripwire_variants_sp_leg]
      - kind: status-field
        name: a32_tripwire_variants
      - kind: file-exists
        path: crates/synth-backend/tests/a32_no_silent_nop_615.rs
      - kind: file-exists
        path: crates/synth-backend/tests/wcet_sp_no_wildcard_946.rs

  - id: SYNTH-README-STATUS-BADGES
    doc: README.md
    text: "artifacts/status.json"
    evidence:
      - kind: verbatim                       # badge query → derived field, 1:1
        text: "query=%24.rocq_qed"
      - kind: status-field
        name: rocq_qed
      - kind: verbatim
        text: "query=%24.rocq_admitted"
      - kind: status-field
        name: rocq_admitted
      - kind: verbatim
        text: "query=%24.sel_dsl_rules"
      - kind: status-field
        name: sel_dsl_rules

  # ---------------------------------------------------------------------------
  # Headline Rocq proof counts — CLAUDE.md and coq/STATUS.md still hand-carry
  # them (working docs); count-eq keeps doc + ledger moving together.
  # ---------------------------------------------------------------------------
  - id: SYNTH-PROOF-COUNT-CLAUDE-MD
    doc: CLAUDE.md
    text: "623 Qed / 2 Admitted"
    evidence:
      - kind: count-eq
        pattern: 'Qed\.'
        glob: ['coq/Synth/**/*.v']
        expect: 623
      - kind: count-eq
        pattern: 'Admitted\.'
        glob: ['coq/Synth/**/*.v']
        expect: 2

  - id: SYNTH-PROOF-COUNT-STATUS-MD
    doc: coq/STATUS.md
    text: "623 Qed / 2 Admitted"
    evidence:
      - kind: count-eq                       # headline + Total line must both agree
        pattern: '623 Qed / 2 Admitted'
        glob: ['coq/STATUS.md']
        expect: 2
      - kind: count-eq
        pattern: 'Qed\.'
        glob: ['coq/Synth/**/*.v']
        expect: 623
      - kind: count-eq
        pattern: 'Admitted\.'
        glob: ['coq/Synth/**/*.v']
        expect: 2
      - kind: count-eq                       # the "+2 admit. tactics" disclosure
        pattern: '^\s*admit\.'
        glob: ['coq/Synth/**/*.v']
        expect: 2

  # ---------------------------------------------------------------------------
  # The admit breakdown the README discloses — per-file, so a new admit
  # anywhere (or a silent move between files) is visible, not just the total.
  # The prose statement is qualitative ("0 division admits"); the per-file
  # numbers live HERE, not in prose.
  # ---------------------------------------------------------------------------
  - id: SYNTH-ADMIT-BREAKDOWN
    doc: README.md
    text: "0 division admits"
    evidence:
      - kind: count-eq
        pattern: 'Admitted\.'
        glob: ['coq/Synth/Synth/CorrectnessI32.v']
        expect: 0
      - kind: count-eq
        pattern: 'Admitted\.'
        glob: ['coq/Synth/Synth/Compilation.v']
        expect: 0
      - kind: count-eq
        pattern: 'Admitted\.'
        glob: ['coq/Synth/Synth/CorrectnessSimple.v']
        expect: 0
      - kind: count-eq
        pattern: 'Admitted\.'
        glob: ['coq/Synth/ARM/ArmRefinement.v']
        expect: 2
      - kind: no-new                         # both admit. tactics live here
        pattern: '^\s*admit\.'
        glob: ['coq/Synth/ARM/ArmRefinement.v']
        recorded: 2

  # "0 i64 admits" (README + CLAUDE.md) — i64 T1 parity must not regress.
  - id: SYNTH-I64-ZERO-ADMITS
    doc: README.md
    text: "0 i64 admits"
    evidence:
      - kind: count-max
        pattern: 'Admitted\.'
        glob: ['coq/Synth/Synth/CorrectnessI64*.v']
        max: 0

  # The intro's scope claim: T1 for i32+i64 selection, T2-only for float/SIMD.
  - id: SYNTH-T1-SCOPE
    doc: README.md
    text: "cover the i32 and i64 instruction selection with result-correspondence (T1) proofs"
    evidence:
      - kind: file-exists
        path: coq/Synth/Synth/CorrectnessI32.v
      - kind: file-exists
        path: coq/Synth/Synth/CorrectnessI64.v
      - kind: verbatim                       # the honest scoping must stay next to it
        text: "float/SIMD selection has existence-only (T2) proofs"

  # ---------------------------------------------------------------------------
  # f32/f64 capability — the README stated "rejected loudly" three releases
  # after real VFP lowering shipped (v0.41 f32, v0.43 f64, #369 closed). The
  # claim binds the prose to selector anchors AND keeps the honest residual
  # (#782: trunc_sat undecoded + a pressure-dependent f32 class) next to it.
  # ---------------------------------------------------------------------------
  - id: SYNTH-F32-F64-VFP
    doc: README.md
    text: "scalar f32/f64 via VFP on FPU targets"
    evidence:
      - kind: count-eq                       # a real f64 arithmetic lowering arm
        pattern: 'F64Add \| F64Sub \| F64Mul \| F64Div => \{'
        glob: ['crates/synth-synthesis/src/instruction_selector.rs']
        expect: 1
      - kind: verbatim                       # the honest residual stays adjacent
        # THIRD occupant of this pin, and the churn is the lesson. It was "#782"
        # until the v0.53 #880 audit (that issue closed across v0.49–v0.52 while
        # the README still called it open), then "#881" — which v0.53's OWN L1
        # lane closed 14 h AFTER the doc-honesty lane had already landed, so the
        # release very nearly shipped citing three issues it had just fixed.
        #
        # Root cause: a pin naming an ISSUE NUMBER goes stale the instant that
        # issue is fixed, and since claim_check only asserts the phrase is
        # PRESENT, it then GREEN-CONFIRMS a false residual — the ledger defends
        # the defect instead of catching it. Pin the CAPABILITY GAP instead of
        # its tracker: this phrase becomes false exactly when the gap closes,
        # which is the property a residual pin was always supposed to have.
        text: "single-precision FPUs"

  # call_indirect: self-contained dispatch shipped v0.47 (#275 closed) with a
  # red-first execution differential; the README must not regress to either the
  # old loud-decline wording or an unevidenced blanket claim.
  - id: SYNTH-CALL-INDIRECT-SELFCONTAINED
    doc: README.md
    text: "self-contained `--cortex-m` dispatch via a PC-relative flash funcref table since v0.47 (#275)"
    evidence:
      - kind: file-exists
        path: scripts/repro/call_indirect_275_selfcontained_execution_differential.py
      - kind: file-exists
        path: scripts/repro/call_indirect_275_selfcontained_execution.wat

  # ---------------------------------------------------------------------------
  # ARCHITECTURE.md — validity-checked in the claim-surface extension PR
  # (April-era single-backend + benchmark-relic content removed). The pins
  # below hold the load-bearing structural statements to the tree.
  # ---------------------------------------------------------------------------
  - id: SYNTH-ARCH-BACKENDS
    doc: ARCHITECTURE.md
    text: "four backends"
    evidence:
      - kind: file-exists
        path: crates/synth-backend
      - kind: file-exists
        path: crates/synth-backend-riscv
      - kind: file-exists
        path: crates/synth-backend-aarch64
      - kind: verbatim
        text: "| AArch64 (host-native) | `synth-backend-aarch64` | A64 |"

  # The register-allocation description was WRONG for months ("R0-R12 for
  # temporaries" — R12 is encoder scratch, R9/R10/R11 are reserved bases; the
  # #212/#215 corruption class). Bind the prose to the actual pool constant.
  - id: SYNTH-ARCH-REGISTER-POOL
    doc: ARCHITECTURE.md
    text: "Allocatable pool: R0–R8"
    evidence:
      - kind: count-eq
        pattern: 'const ALLOCATABLE_REGS: \[Reg; 9\] = \['
        glob: ['crates/synth-synthesis/src/instruction_selector.rs']
        expect: 1
      - kind: verbatim
        text: "R12 (encoder scratch — never allocated)"

  # The honesty rule the whole doc leans on: undecodable ops loud-skip.
  - id: SYNTH-ARCH-LOUD-DECLINE
    doc: ARCHITECTURE.md
    text: "declines loudly"
    evidence:
      - kind: count-eq                       # the deliberate-ignore predicate
        pattern: 'fn is_intentionally_ignored'
        glob: ['crates/synth-core/src/wasm_decoder.rs']
        expect: 1

  # ---------------------------------------------------------------------------
  # "verified"/"implemented" wording — bound to the roadmap yaml's status
  # field, never free-floating prose. rivet's status lifecycle is the source.
  # ---------------------------------------------------------------------------
  # NOTE (v0.57 README portal): the README no longer RESTATES per-item VCR
  # statuses — it points at epic #242 and the roadmap yaml instead, because
  # restating them is precisely how three of these drifted stale while the
  # machine-derived badges stayed correct. Claims that pinned the deleted
  # README prose were re-pointed to CLAUDE.md, which still makes the claim in
  # prose; the EVIDENCE is unchanged, so the gate lost no strength. The old
  # SYNTH-VCR-RA-001-VERIFIED was dropped outright rather than re-pointed —
  # the -CLAUDE-MD twin below already asserts the identical yaml-field.
  - id: SYNTH-VCR-RA-001-VERIFIED-CLAUDE-MD
    doc: CLAUDE.md
    text: "`VCR-RA-001` allocator with Belady spilling — **verified,"
    evidence:
      - kind: yaml-field
        path: artifacts/verified-codegen-roadmap.yaml
        id: VCR-RA-001
        field: status
        equals: verified

  - id: SYNTH-VCR-VER-001-DEMONSTRATED
    doc: CLAUDE.md
    text: "DEMONSTRATED (implemented, evidence in"
    evidence:
      - kind: yaml-field
        path: artifacts/verified-codegen-roadmap.yaml
        id: VCR-VER-001
        field: status
        equals: implemented
      - kind: file-exists
        path: scripts/repro/vcr_ver_001_gate.md

  # VCR-VER-002 (#166): trap-preservation gate over ordeal 0.9's trap module.
  # in-progress, not implemented. LIVE (derived-ARM-trap-term) classes now:
  # i32 div/rem, i64 div/rem (#756, field-derived), unreachable, i32
  # load/store (all widths), call_indirect, i32.trunc_f32_s/u, i32.trunc_f64_s/u
  # (#756, D-register guard). i64.trunc_f32/f64 SHIP a guarded lowering since
  # #869, but their symbolic ARM-side wiring (F64 compare/decompose chain) is
  # the named residual — classifier unit-gated + EXECUTION-gated (the #869
  # differential runs every trap row under unicorn), not yet derived-term VC.
  # Phase B (ordeal 0.9.1, ordeal#59/TR-020): float→int trunc trap class
  # covered — trunc_op/trap_trunc wrapper + #709 boundary-table eval gate.
  - id: SYNTH-VCR-VER-002-STATUS
    doc: artifacts/verified-codegen-roadmap.yaml
    text: "Trap-preservation VC catches dropped WASM traps (i32+i64 div/rem, memory OOB, call_indirect, unreachable, float→int trunc); live-validator wiring in progress"
    evidence:
      - kind: yaml-field
        path: artifacts/verified-codegen-roadmap.yaml
        id: VCR-VER-002
        field: status
        equals: proposed
      - kind: file-exists
        path: crates/synth-verify/src/trap.rs
      - kind: file-exists
        path: crates/synth-verify/tests/trap_preservation.rs

  # VCR-VER-003 (#777 / #757): per-compilation static-data addressing validator.
  # Concrete byte-equality (NOT SMT): every static-data reloc resolves to the
  # runtime-correct byte (active segments applied in declaration order,
  # later-wins). In synth-core so it runs on EVERY compilation (default
  # `--features riscv`, not `verify`). Non-vacuous red-first gate: same validator
  # Mismatch on .position() (the #757 bug) / Consistent on .rposition().
  #
  # Phase 2 (#777 follow-ups, v0.47): (a) SPANNED reloc check — the mixed split
  # validates every runtime-covered byte of a conservatively-widened access
  # (MAX_ACCESS_BYTES) against the SHIPPED packed init blob (the
  # staggered-overlap straddle phase 1 silently miscompiled is now refused);
  # (b) the self-contained #758 ROM image is packed by the shared
  # declaration-order packer and validated unconditionally against the
  # reconstructed runtime image; (c) RV32 active segments SHIP since v0.48
  # (#798): packed as .wasm_data records (declaration order, startup copies
  # to __linear_memory_base + off at reset), the emitted blob READ BACK via
  # served_image_from_records and hard-error-validated against the runtime
  # image (the v0.47 drop-warning is gone; de-vacuated control_step
  # differential + full-boot unicorn oracle gate the runtime side);
  # (d) AArch64 N/A for THIS validator: it has linear-memory load/store since
  # #851 but no active DATA SEGMENTS / packed init blob, so there is nothing for
  # the static-data addressing VC to validate (the follow-on that adds data-seg
  # init is where this becomes applicable). The
  # count-eq pins below hold the wiring UNCONDITIONAL: exactly one
  # spanned-validator call on the mixed split, exactly one ROM-image and one
  # RV32 served-image (read-back) call.
  - id: SYNTH-VCR-VER-003-STATUS
    doc: artifacts/verified-codegen-roadmap.yaml
    text: "Static-data addressing VC catches the overlapping-segment wrong-segment miscompile (#757) at compile time on every module"
    evidence:
