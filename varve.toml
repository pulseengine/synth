# synth's toolchain pin — see `varve docs pins`.
# The realm supplies both the registry and the trust root, so no environment
# variable is needed; varve-realms.toml beside this file is authoritative.
#
# CLIENT-VERSION FLOOR: varve >= 0.33.0 to resolve this file. 0.32.0 and
# earlier HARD-REFUSE the `retired-roots` field in varve-realms.toml below
# ("unknown field `retired-roots`, expected one of `registry`, `mirrors`,
# `trust-root`, `trust-root-file`, `signed-index`") — measured RQ-66-VARVE /
# #1236. Install the floor additively (`sh install.sh` from a
# pulseengine/varve release, default ~/.varve/bin) rather than replacing
# whatever ambient `varve` you have; see `varve which`/`varve verify` (both
# exit 1 on PATH shadowing, REQ-SHADOW-001) before trusting an ambient copy.
manifest-version = 1

[toolchain]
realm   = "pulseengine"
channel = "rolling"
layer   = "2026.10.9"
# Digest-pinned as `varve docs pins` recommends: byte-exact freezing, and
# constant-time resolution. Re-derived (NEVER copied) from `varve install`'s own
# output — see RQ-66-VARVE / #1236.
#
# v0.83: 2026.09.2 -> 2026.10.9. 2026.09.2's support window ENDED 2026-10-09 and
# the 2026.09 line's anti-rollback mark had advanced past it, which is exactly
# what the advisory federated-graph job reported: "layer presents counter 3 but
# the 2026.09 line's high-water mark is 4". Deterministic refusal, not flake —
# the per-runner variance in #1422 is each runner's own cached line-status.
#
# 2026.10.9 is the line's HIGH-WATER, bounded at both ends rather than guessed:
# the realm's SIGNED INDEX states greatest counter 10, 2026.10.9 IS counter 10,
# and 2026.10.10 returns "source has no layer". A first probe that searched
# DOWNWARD from a guessed ceiling of 2026.10.3 stopped at the first success and
# would have pinned six layers short.
digest  = "sha256:65b8c9dd4c64bb01c3123a037e7c35aa502d97955ce9df1821aa43fb4e289e77"
