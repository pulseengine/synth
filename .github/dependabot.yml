version: 2
# One PR per logical release across all directories: version-locked families
# (wasm-tools, wasmtime) and all github-actions pins in / must not split into
# one PR per directory. (Learned from loom/witness/mcp/relay/rules_wasm_component,
# where one release arrived as 4-8 PRs.)
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # For dtolnay/rust-toolchain the ref IS the rustc version. The MC/DC
      # structural-coverage job pins @1.96.1 as a MEASUREMENT constant (its
      # floors are counts over std-inlined lowered wasm); dependabot #984
      # bumped it to 1.100.0 as if it were an action version and silently
      # changed the measured compiler with no re-measure. Bumps to that pin
      # are only valid inside a PR that re-measures and restates the floors,
      # so dependabot must not touch this action. (Its other refs here are
      # @stable/@nightly, which dependabot never bumps anyway.)
      - dependency-name: dtolnay/rust-toolchain
    groups:
      # All github-actions pins in / arrive as ONE PR. Groups are per
      # updates-entry (dependabot rejects a top-level `groups:`), and a group
      # inherits its entry's ecosystem, so no package-ecosystem key here.
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # Version-locked families: one PR per release, not one per crate.
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
          - "wast"
          - "walrus"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
