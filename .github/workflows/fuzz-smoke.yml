# Fuzz smoke — short cargo-fuzz run (~60s / target) on every PR + push to main.
#
# Catches new panics / unencodable instructions / silent op drops in the
# WASM → IR → ARM lowering pipeline. Long-budget runs (1h / target with
# corpus persistence) are out of scope for #82; this is the smoke gate.
#
# Target list mirrors fuzz/Cargo.toml `[[bin]]` entries. Add a new
# fuzz_target there → add the binary name to `TARGETS` in the run step's env
# (the step fails if the two lists differ), and to `GATING` if it must block.
#
# Refs: issue #82, issue #93 (silent-drop class).

name: Fuzz Smoke

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    # ONE job, four targets in sequence. This was a 4-way matrix: each leg
    # installed nightly, restored fuzz/target and installed cargo-fuzz to run
    # one 60 s target (119 rust-cpu minutes over 12 runs, 2026-11-19/20). The
    # targets share one fuzz crate, so one job pays that setup and the
    # dependency build once.
    #
    # What is kept: all four targets, 60 s of fuzzing each
    # (`-max_total_time=60`), the seeded corpus, the crash upload, each
    # target's former 10-minute ceiling (`timeout 600` around its build and
    # run), and the GATING SPLIT the matrix expressed with `continue-on-error`:
    #   - GATING targets pass clean today; a failure fails this job.
    #   - EXPLORATION targets keep finding real bugs faster than they are
    #     closed; a failure is a `::warning::`, a line in the step summary and
    #     an uploaded crash, and does NOT fail the job. Promote one to GATING
    #     once its bug list stabilises.
    # Every target runs whatever the others did: nothing exits the loop early.
    # The log and the step summary name each target with `pass`, `FAIL` or
    # `exploration-FAIL`, so a red job says which target broke.
    #
    # Check name: the matrix reported `<target> (60s)` per leg; this job
    # reports one check. Going back to four legs is a small change: add
    # `strategy.matrix.target`, name the job "${{ matrix.target }} (60s)",
    # and set the step's TARGETS to `${{ matrix.target }}` (the step already
    # takes its lists from env and loops over whatever it is given; drop the
    # `cargo fuzz list` equality, which is about the whole set).
    name: "Fuzz smoke — 4 targets (60s each)"
    # Match ci.yml: rust-cpu self-hosted pool, with ubuntu-24.04 fallback if
    # the pool is unavailable (cargo-fuzz needs Linux for libfuzzer-sys ASan).
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-fuzz

      - name: Run each fuzz target for 60s
        id: fz
        env:
          # Every target this job runs. Must equal fuzz/Cargo.toml's `[[bin]]`
          # set (checked below).
          TARGETS: wasm_ops_lower_or_error wasm_to_ir_roundtrip_op_coverage i64_lowering_doesnt_clobber_params encoder_no_panic
          # The subset whose failure fails the job. `wasm_ops_lower_or_error`
          # is gating again: it was demoted in PR #117 because wasm_to_ir's
          # inst_id-as-vreg-slot model crashed on Drop / LocalSet / Store /
          # Block shapes; the slot_stack refactor (issue #121) closed those,
          # and `ir_to_arm`'s `get_arm_reg` now returns `Result` instead of
          # panicking, so its contract ("lower or Err, never panic") holds.
          # The other two targets are exploration:
          # `i64_lowering_doesnt_clobber_params` finds real bugs faster than
          # we fix them (tracked as follow-up issues); `encoder_no_panic` is
          # encoder-level corner cases, not silicon-blocking.
          GATING: wasm_ops_lower_or_error wasm_to_ir_roundtrip_op_coverage
        # Force the GNU target — cargo-fuzz defaults to musl on Linux,
        # whose statically-linked libc is incompatible with ASan
        # (libfuzzer-sys turns ASan on by default). The GNU target has
        # a dynamic libc and works correctly.
        #
        # We seed the corpus from `fuzz/seed_corpus/<target>/` (checked into
        # git) so known-crash inputs are always replayed — see PR #117 which
        # introduced `seed_corpus/wasm_ops_lower_or_error/seed-pr117-i32divs-
        # empty-stack`. Without seeding, a regression that re-introduces the
        # panic might be missed if libfuzzer doesn't rediscover the exact
        # input within 60s.
        run: |
          set -uo pipefail
          read -ra T <<< "$TARGETS"
          read -ra G <<< "$GATING"
          # The list must be exactly fuzz/Cargo.toml's `[[bin]]` set: a target
          # added there and not here would never be fuzzed.
          have="$(cargo +nightly fuzz list | sort | xargs)"
          want="$(printf '%s\n' "${T[@]}" | sort | xargs)"
          if [ -z "$have" ] || [ "$have" != "$want" ]; then
            echo "::error::fuzz targets in fuzz/Cargo.toml ($have) are not the ones this job runs ($want)"
            exit 1
          fi
          # Every GATING name must be a target, or a typo would silently make
          # a gating target exploration.
          for g in ${G[@]+"${G[@]}"}; do
            case " ${T[*]} " in
              *" $g "*) ;;
              *) echo "::error::GATING names '$g', which is not in TARGETS"; exit 1 ;;
            esac
          done
          mkdir -p fuzz/artifacts fuzz/corpus
          n=0
          failed_gating=""
          failed_explore=""
          for tgt in "${T[@]}"; do
            n=$((n + 1))
            kind=exploration
            case " ${G[*]-} " in *" $tgt "*) kind=gating ;; esac
            echo "::group::${tgt} (60s, ${kind})"
            mkdir -p "fuzz/corpus/${tgt}"
            if [ -d "fuzz/seed_corpus/${tgt}" ]; then
              if ! cp -n fuzz/seed_corpus/"${tgt}"/* "fuzz/corpus/${tgt}/"; then
                echo "note: seeding ${tgt} copied nothing new (cp -n returned non-zero)"
              fi
            fi
            rc=0
            timeout 600 cargo +nightly fuzz run "${tgt}" \
              --target x86_64-unknown-linux-gnu \
              -- -max_total_time=60 -print_final_stats=1 || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "FUZZ ${tgt} (${kind}): pass" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$kind" = gating ]; then
              echo "::error::gating fuzz target ${tgt} failed (exit ${rc}; 124 is the 10-minute ceiling)"
              echo "FUZZ ${tgt} (${kind}): FAIL (exit ${rc})" | tee -a "$GITHUB_STEP_SUMMARY"
              failed_gating="${failed_gating} ${tgt}"
            else
              echo "::warning::exploration fuzz target ${tgt} failed (exit ${rc}; 124 is the 10-minute ceiling) — recorded, not fatal"
              echo "FUZZ ${tgt} (${kind}): exploration-FAIL (exit ${rc})" | tee -a "$GITHUB_STEP_SUMMARY"
              failed_explore="${failed_explore} ${tgt}"
            fi
          done
          # Every listed target must have run: a loop that ran none would be
          # green about nothing.
          if [ "$n" -eq 0 ] || [ "$n" -ne "${#T[@]}" ]; then
            echo "::error::ran ${n} fuzz targets, expected ${#T[@]}"
            exit 1
          fi
          if [ -n "${failed_gating}${failed_explore}" ]; then
            echo "any_failed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "FUZZ-SMOKE targets=${n} gating-failed=[${failed_gating# }] exploration-failed=[${failed_explore# }]" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed_gating" ]; then
            exit 1
          fi

      - name: Upload crash artifacts
        # Keyed on the step's own output, not `failure()`: an exploration
        # failure leaves the job green and must still upload its crash.
        if: always() && steps.fz.outputs.any_failed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crash
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 30
          if-no-files-found: ignore
