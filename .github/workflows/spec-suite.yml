# RQ-61-SPECCLAIM (#1095): the job that makes the README / FEATURE_MATRIX
# "spec test suite" rows TRUE. Before this workflow existed, both docs
# advertised a "CI-tracked compile rate" that no job produced — and no
# workflow checked out submodules, so tests/spec-testsuite was EMPTY on every
# runner. Two layers of non-vacuity:
#   1. `submodules: recursive` on checkout (the suite is a submodule);
#   2. scripts/spec_compile_census.py hard-fails unless it finds exactly the
#      pinned number of .wast files — so if this checkout ever regresses to
#      empty, the job goes RED instead of reporting a vacuous 0/0 success.
# The census keeps declines separate from errors (a decline is not a failure)
# and exact-pins every bucket per backend; proven able to fail at authoring
# (empty dir + off-by-one pin both exit 1 — evidence in PR #1095 thread).
#
# The COMPILE census is NOT in the required-check set: a new required
# context that fails to run deadlocks all merges. Advisory-but-red-visible,
# like the other oracle jobs. The EXECUTION job at the end of this file
# (#1636) IS required: the maintainer added `spec-suite execution (#1636)` to
# branch protection in v0.90, and ci_pool_tripwire.py's REQUIRED_CONTEXTS pins
# it (its deadlock guard resolves it in THIS file).
name: Spec Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # #910: the per-job measured-evidence ledger the oracle driver appends to.
  ORACLE_EVIDENCE_JSONL: oracle-evidence.jsonl

jobs:
  spec-compile-census:
    name: spec-suite compile census (#1095)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Load-bearing: without this the suite directory is empty and the
          # census would measure nothing. The script's 257-file floor is the
          # backstop that turns that state red.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-spec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-spec-
            ${{ runner.os }}-cargo-
      - name: Build synth (riscv feature covers all three census backends)
        run: cargo build --features riscv --bin synth
      # RQ-89-CENSUSFLOAT (#1609): "all backends" includes two ARM FPU legs
      # (arm_m4f, arm_m7dp). The `arm` leg is --cortex-m = cortex-m3, NO FPU,
      # which declines every f32/f64 function, so without these legs no float
      # lowering on ARM is ever compiled here. Same binary, no new deps.
      - name: Run spec-suite compile census (exact-pinned, all backends)
        run: python3 scripts/spec_compile_census.py
      # RQ-65-MVPCORE (#1017) / #1225: the census above measures the
      # SINGLE-MODULE path for a one-module .wast (what every execution oracle
      # compiles) and the refusing multi-module merge for the rest. This step
      # is what makes the first half TRUE: every single-module .wast in the
      # suite (and every tests/wast fixture) must compile to exactly the bytes
      # its module compiles to alone, on all three backends. Red on the
      # pre-#1225 driver (arm 49 / riscv 33 / aarch64 56 mismatches — dropped
      # data segments, an R9 the startup never wrote, i64 parameter pairs
      # mis-homed), so the census's `ok` there was a property of an
      # unexecuted path. Same checkout, same binary, same 257-file floor.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      # pyelftools for the declared-page-size oracle below: it reads the #1145
      # region table from the SYMTAB (never from disasm text, #850/#489). This
      # workflow had NO pip step at all, so the oracle's first two wired runs
      # died on absent tooling — `wasm-tools` (removed as a dependency) and then
      # `elftools`. Same form as ci.yml's oracle jobs; the
      # `--break-system-packages` fallback is load-bearing on newer runners.
      - name: Python deps for the page-size oracle
        run: pip install pyelftools || pip install --break-system-packages pyelftools
      - name: Single-module .wast == its module alone, byte for byte (#1225)
        run: |
          set -euo pipefail
          python3 scripts/oracle_run.py \
            scripts/repro/wast_single_module_path_identity_1225.py | tee /tmp/identity.log
          # NON-VACUITY, asserted here as well as inside the script (its
          # compared-pairs floor), so neither can go quiet alone.
          grep -qE '^#1225 CHECKS=[1-9][0-9]{2,} single-module .wast files compared across 3 backend' /tmp/identity.log
          grep -q '^RESULT: PASS' /tmp/identity.log
      # RQ-79-PAGESIZE (#1441): the oracle that must land BEFORE `(pagesize 1)` is
      # honoured. IT LIVES HERE AND NOT IN ci.yml FOR A MEASURED REASON: it DERIVES
      # the spec-permitted page sizes from tests/spec-testsuite, which is a SUBMODULE
      # that only this workflow checks out (`submodules: recursive`, above). Wired
      # into ci.yml's trap-semantics-oracle job instead, the directory would be EMPTY
      # and the oracle would red on its own absent-suite floor — the same emptiness
      # this workflow's header says it was created to fix.
      # Derived, not hardcoded: the legal set is {1, 65536}, which REFUTED the lane's
      # first scoping of "powers of two >= 32 B" — `(pagesize 32)` is asserted
      # INVALID by name in custom-page-sizes-invalid.wast. Live today with the
      # capability ABSENT: every spec-invalid size is refused, the default is accepted
      # with 0x10000 per memory in the #1145 region table, and `(pagesize 1)`'s
      # refusal must still cite #1315 — a refusal that stops explaining itself fails
      # here rather than passing. It AUTO-STRENGTHENS when the capability lands (the
      # mode is PROBED, not switched by hand) to assert `__synth_mem_size_N` == the
      # declared BYTE count plus a new `__synth_mem_region_N` == that count rounded up
      # to a power of two >= 32, the ARMv7-M PMSA constraint. Two-memory fixtures
      # throughout: a single-memory module emits no `__synth_mem_*` symbols at all, so
      # the size legs would be vacuous while still printing PASS.
      - name: Run declared-page-size oracle (#1441, spec-derived)
        run: |
          set -euo pipefail
          SYNTH=./target/debug/synth python3 scripts/oracle_run.py \
            scripts/repro/pagesize_oracle_1441.py | tee /tmp/pagesize.log
          # NON-VACUITY asserted HERE as well as inside the script, so neither
          # can go quiet alone: the derived legal set must be the two the
          # proposal permits, and the assertion count must not thin.
          grep -qE '^spec suite: 2 legal \[1, 65536\], [0-9]{2,} invalid' /tmp/pagesize.log
          grep -qE '^PASS: pagesize oracle, [0-9]{2,} assertions' /tmp/pagesize.log
      - name: Differential evidence ledger (#910)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/oracle_evidence.py "$ORACLE_EVIDENCE_JSONL" --min-oracles 1

  # RQ-90-SPECEXEC (#1636): the suite EXECUTED, not only compiled. Every
  # top-level `assert_return` / `assert_trap` in the 257 files is accounted
  # for on two Cortex-M legs (cortex-m4 default; cortex-m7dp with
  # `--safety-bounds software`), booted through each image's own
  # Reset_Handler under unicorn and held to the .wast's own expected result:
  # pass, fail, or not-representable WITH A REASON — and per (leg, file) the
  # three must sum to the file's directive count, so a dropped directive is
  # red. Every failing directive is pinned by (leg, file, line, col) in the
  # script's KNOWN table (claims.yaml `known_open_pin_tables`), exact in both
  # directions: a new failure is red, and a pinned directive that now passes
  # is red until its entry is removed.
  #
  # BUILT TO BE A REQUIRED CONTEXT. Its own job, a static `name:` (the
  # context string), no matrix, no `paths:` filter (a required check skipped
  # by a path filter never reports and blocks merges), no concurrency
  # cancellation (a cancelled check satisfies the merge gates), and the
  # reference engine + emulator PINNED so the exact baseline cannot move with
  # a floating `pip install`. Deterministic: the garbage machine states are
  # seeded from (leg, file, module position). It IS required since v0.90 —
  # the maintainer's branch-protection action; renaming it, giving it an `if:`,
  # a matrix or a path filter now deadlocks every merge, and
  # ci_pool_tripwire.py / runner_redundancy_check.py fail on each of those.
  spec-suite-execution:
    name: spec-suite execution (#1636)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Load-bearing: the suite is a submodule. The script's 257-file and
          # directive-total pins turn an empty checkout RED.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-specexec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-specexec-
            ${{ runner.os }}-cargo-
      # The SAME build the baseline was measured on (and the census job's, so
      # the cache is shared). synth-test is the SECOND parser: its Rust
      # `wast`-crate count of every file's assert_return directives must equal
      # the script's own census.
      - name: Build synth and synth-test
        run: |
          cargo build --features riscv --bin synth
          cargo build -p synth-test --bin synth-test
      # Pinned to the interpreter the baseline was measured on: the garbage
      # machine states come from a seeded `random.Random`, and a floating
      # "3.x" would make the reproducibility of that stream an assumption.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Install emulation deps (reference engine PINNED)
        run: pip install wasmtime==48.0.0 unicorn==2.1.4 pyelftools || pip install --break-system-packages wasmtime==48.0.0 unicorn==2.1.4 pyelftools
      - name: Execute the spec suite's assert_return / assert_trap directives (#1636)
        run: |
          set -euo pipefail
          SYNTH=./target/debug/synth SYNTH_TEST=./target/debug/synth-test \
            python3 scripts/oracle_run.py \
            scripts/repro/spec_exec_1636_differential.py | tee /tmp/specexec.log
          # NON-VACUITY, asserted here as well as inside the script, so
          # neither can go quiet alone: both legs executed, the second parser
          # agreed on every file it parses, and the verdict line printed.
          grep -qE '^  \[cortex-m4\] executed [1-9][0-9]{3,} = ' /tmp/specexec.log
          grep -qE '^  \[cortex-m7dp\] executed [1-9][0-9]{3,} = ' /tmp/specexec.log
          grep -qE '^  second parser \(synth-test stats\): 25[0-9] files agree, 0 disagree' /tmp/specexec.log
          grep -qE '^#1636 EXECUTED=[1-9][0-9]{4,} directives across 2 legs' /tmp/specexec.log
          grep -q '^RESULT: PASS' /tmp/specexec.log
      - name: Differential evidence ledger (#910)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/oracle_evidence.py "$ORACLE_EVIDENCE_JSONL" --min-oracles 1
