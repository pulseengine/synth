name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # #910: where scripts/oracle_run.py appends one JSON record per oracle it
  # drives. Workflow-level so no oracle job can forget it; jobs that run no
  # oracle simply never create the file.
  ORACLE_EVIDENCE_JSONL: oracle-evidence.jsonl

jobs:
  test:
    name: Test
    # NOTE: stays on ubuntu-latest for now. It originally moved here from
    # [self-hosted, linux, x64, rust-cpu] because z3-sys's C++ build exhausted
    # the smithy runners' temp disk — that pressure is gone (#553: synth-verify
    # defaults to the pure-Rust ordeal engine, z3 is behind the off-by-default
    # `z3-solver` feature), so moving back is a possible follow-up.
    runs-on: ubuntu-latest
    # Outer wall-clock guard (#849). This job ran 4-6 h and timed out on the
    # GitHub default on EVERY run for three days because nothing anywhere
    # bounded a solver query. The per-query deadline in synth-verify
    # (`SYNTH_ORDEAL_DEADLINE_MS`, #848) is the inner floor; this is the outer
    # one, so a future cliff costs one red job in <1 h, not a burned day.
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install llvm-dwarfdump (independent DWARF parser gate, #394)
        # The `--debug-line` DWARF gate's Oracle I
        # (emitted_dwarf_verifies_with_llvm_dwarfdump_394) validates synth's
        # emitted `.debug_info`/`.debug_line` with the INDEPENDENT LLVM parser
        # (`llvm-dwarfdump --verify`), not gimli::read. That test FAILS (never
        # skips) when the tool is absent, so it must be present here. The `llvm`
        # package provides the unversioned `llvm-dwarfdump` on PATH.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm
          llvm-dwarfdump --version
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run tests
        # Full workspace, synth-verify included (#553 steps 3/4): with ordeal as
        # the default solver there is no z3-sys / C++ build on the default
        # feature set, so the long-standing `--exclude synth-verify` (the #306
        # disk-exhaustion workaround) is gone. The z3-solver feature path is
        # covered by the dedicated `Z3 Verification` differential job below.
        run: cargo test --workspace
      - name: WCET bound gate (#778 — sound static WCET incl. phase-3/4/5)
        # The soundness gate for --emit-wcet: bound >= actual on loop-free +
        # const-loop fixtures, EXACT-literal composed bounds over the direct call
        # graph (leaf->mid->root; a callee in a proven loop counted trip×), and the
        # decline-honesty matrix — recursion (`recursion`), indirect
        # (`indirect-call`), external/import (`call`), and declined-callee
        # (`callee-unbounded`) still LOUD-DECLINE. Phase 4 (#49): a masked
        # single-self-call chain with a VERIFIED depth hint is BOUNDED (derived
        # depth 15, frame_count 16, 752 cyc); a too-low hint / tree (fib) / uncapped
        # countdown / mutual recursion STAY declined with the specific machine
        # reason (hint-below-derived-depth / hint-unverifiable-recursion). Phase 5
        # (#778): a DATA-DEPENDENT masked-ceiling loop bound (`i REL (x & K)`) with a
        # VERIFIED loop_bounds hint is BOUNDED (derived trip = both-endpoints max,
        # source `mask-ceiling`); the count-DOWN case's worst case is the rhs=0
        # endpoint (a single-endpoint seed would undercount); unhinted / too-low /
        # UNMASKED `i < param` STAY declined (`loop` + hint-below-derived-trip /
        # hint-unverifiable-induction). Covered by `cargo test --workspace` above;
        # run explicitly so a WCET-soundness regression is unmissable in the log.
        run: cargo test -p synth-cli --test wcet_bound_gate
      - name: Space-consistency invariant (#77 — execution+memory space)
        # The #77 checked property: an inconsistent execution/memory-space
        # pairing (bare-metal + OS-mapped, hosted + physical, FP-requiring space
        # on an FPU-less core) is REJECTED by synth_memory::space::validate().
        # Red-first unit tests (both directions of each invariant); covered by
        # `cargo test --workspace` above, run explicitly so a regression in the
        # space-consistency model is unmissable in the log.
        run: cargo test -p synth-memory --features std 'space::'
      - name: P3 async intrinsic honest-degradation gate (#80)
        # The #80 gate: the ONE lowered async op (error-context.drop) compiles
        # to a field-name BL call site; every declined intrinsic (error-context.new
        # /.debug-message, stream, future, waitable-set, task) LOUD-DECLINES the
        # compile by name. Runs the classifier unit tests + the CLI end-to-end
        # gate so an accidental silent-lower of a declined op is unmissable.
        run: |
          cargo test -p synth-core --lib async_intrinsics
          cargo test -p synth-cli --features riscv --test async_intrinsics_gate

  clippy:
    name: Clippy
    # RQ-61-CICAP (#1062) increment 2. The z3-sys disk pressure that forced
    # ubuntu-latest is gone (#553), and this job is plain cargo — no external
    # toolchain, unlike Z3/Bazel/Kani, which the artifact holds back until
    # their toolchains are proven on this pool.
    #
    # Why rust-cpu is safe for a REQUIRED context: three jobs already run
    # there, and increment 1's `synth-provenance-v1 reconciliation gate`
    # has been green on it for 5/5 consecutive main runs. The job NAME is
    # unchanged, so the required context still reports — a failure would
    # block PRs (recoverable by revert, whose own CI runs the reverted
    # config) rather than DEADLOCK them, which is what a renamed or
    # never-running required context would do.
    #
    # Capacity, sampled rather than read off one instant (the correction in
    # #1062): across 10 samples over ~9 minutes with 2-5 runs QUEUED, the
    # self-hosted pools were idle throughout - rust-cpu 2/7 falling to 0/7,
    # lean-mem 0/4, light 0/1 - while 56 of 65 job definitions (86.2%) queued
    # against the GitHub-hosted quota. An earlier point reading of 7/7 was a
    # merge-wave transient and is corrected on the issue.
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check

  pin-sweep:
    name: Version Pin Sweep
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v7
      # Issue #145: fail at PR time if [workspace.package].version drifts from
      # any intra-workspace path-dep `version =` pin or MODULE.bazel — the
      # v0.7.0-class desync that breaks release.yml + publish at tag-push time.
      - name: Check intra-workspace version pins
        run: python3 scripts/check_version_pins.py
      - uses: dtolnay/rust-toolchain@stable
      # #924: the OTHER lockfile failure. `check_version_pins.py` above asserts
      # every workspace member is in Cargo.lock at the workspace version — that
      # catches a lock left BEHIND at the previous release. It does not catch a
      # lock whose versions are all correct but which is stale in a different
      # way: a dependabot manifest bump that orphans a transitive entry.
      #
      # That one is not theoretical. `main` was red on VCR-VER-004 from
      # 3eec0d37 (wit-component 0.254->0.255) until 2026-08-12, because an
      # orphaned `wasm-encoder 0.254.0` entry meant the first cargo invocation
      # in any job regenerated the lock and its `git diff --exit-code` cleanup
      # assert failed. The oracle in that job PASSED; only the tree-restore
      # check went red, in a job with nothing to do with dependencies.
      #
      # `--locked` is the direct check: it fails if the lock would need
      # updating. Usable here because every path dep is intra-workspace — a
      # repo with sibling-repo path deps has inherent lock churn and cannot
      # use it. `cargo metadata` resolves without compiling, so this is fast.
      - name: Cargo.lock is consistent with the manifests (#924)
        run: |
          cargo metadata --locked --format-version 1 > /dev/null || {
            echo "::error::Cargo.lock is stale. Run 'cargo metadata' and commit the result."
            exit 1
          }

  claim-check:
    name: Claim Check
    # claim-verification gate: README/CLAUDE.md/coq/STATUS.md load-bearing
    # claims (proof counts, "verified" wording, DSL rule coverage, trusted-base
    # sizes) are pinned in claims.yaml and RE-DERIVED from source here — a
    # hand-maintained number that drifts from the tree fails the build.
    # When a proof/rule lands, update the docs AND claims.yaml together.
    #
    # Since the claim-surface extension, the same script run ALSO
    #  * staleness-gates the machine-derived artifacts/status.json (the README
    #    badges' data source) and the GENERATED docs/status/FEATURE_MATRIX.md —
    #    regenerate with `python3 scripts/claim_check.py claims.yaml
    #    --emit-status` and commit the result;
    #  * closes the README linked-doc surface (every relative .md link must be
    #    claim-covered, generated, or allowlisted with a rationale).
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the status-evidence gate (RQ-60-FLIPCOUPLE, #1064)
      # scans first-parent commit SUBJECTS for delivery commits ("RQ-N-FOO:
      # ..." must be acknowledged by RQ-N-FOO's artifact). A shallow checkout
      # would scan one subject and pass vacuously; the gate's in-script
      # delivery floor (28) turns that into a RED, and this line is what
      # keeps it green the honest way.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure PyYAML
        run: python3 -c "import yaml" || python3 -m pip install --user pyyaml
      - name: Re-derive documentation claims (+ generated-artifact staleness + link surface)
        run: python3 scripts/claim_check.py claims.yaml
      # RQ-58-METRIC (#242) — THE SUBTRACTION METRIC. Epic #242 exists to
      # REPLACE the patch-accreting code generator; measured v0.42.0 -> v0.57.0
      # it went the other way (selector non-test code 14,694 -> 18,480 lines,
      # verified rules flat at 50 since v0.45.0) and nothing noticed, because
      # nothing measured it. The `kind: ratchet` pins in claims.yaml are
      # DIRECTED (ceilings must fall, the rule floor must rise) and SLACK-FREE
      # (the ledger must carry the live number exactly), so adding a
      # hand-written lowering arm without deleting one is red.
      #
      # `--metric` prints the table with each pin's delta from baseline, so the
      # trend is readable in the job log and not only in a failed assertion —
      # and it FAILS if the pin population is empty, because deleting a ceiling
      # must never be the cheapest way to satisfy it.
      #
      # Lives in the already-REQUIRED claim-check job for the same reason the
      # oracle-wiring gate below does: a brand-new job is not a required
      # context on main, so it could sit red for weeks blocking nothing.
      - name: Subtraction metric — directed ratchets on the patch pile (RQ-58-METRIC, #242)
        run: python3 scripts/claim_check.py claims.yaml --metric
      # The gate that polices the checkers does not get to be the unchecked
      # one. v0.57 found 5 of its 10 defects in checking machinery; this drives
      # the ratchet predicate and the region/counting primitives through every
      # branch, including the ones that must PASS. Mutation-verified at
      # authoring: stubbing check_ratchet to return no failures kills 18 of 32.
      - name: Unit-test the claim-check engine itself (RQ-58-METRIC, #242)
        run: python3 scripts/test_claim_check.py
      # #965 RQ-59-MINORHOLD: the dependabot 0.x-minor hold classifier is a
      # NEW checker, and new checkers are new defect surfaces (five releases
      # running found the defect in checking machinery). Table-driven potency
      # test — breaking 0.x-minors (the #938 `object` and ordeal specimens),
      # 0.0.x, majors, prereleases, downgrades, unparseable/empty metadata
      # (the pre-#965 fail-open hole) and grouped updates must HOLD; 0.x
      # patches and >=1.0 minors must AUTOMERGE, because a gate that blocks
      # everything is as useless as one that blocks nothing.
      # Mutation-verified at authoring: 5/5 seeded classifier mutations red
      # the suite (transcript in the RQ-59-MINORHOLD PR). Lives in the
      # already-REQUIRED claim-check job for the standing reason: a brand-new
      # job is not a required context on main, so it could sit red blocking
      # nothing.
      - name: Unit-test the dependabot 0.x-minor hold classifier (RQ-59-MINORHOLD, #965)
        run: python3 scripts/test_dependabot_minor_hold.py
      # #867: coverage OF the ISA semantics model. Re-derives
      # artifacts/model-coverage.json (static heuristic, documented in the
      # script) and fails if the committed artifact is stale or hand-edited;
      # prints the COMPLEMENT — modelled ISA behaviours no proof exercises —
      # loudly in the job log. The tier counts flow into status.json via
      # claims.yaml, so this step is what keeps those numbers honest.
      - name: Model-coverage artifact freshness + uncovered-complement report (867)
        run: python3 scripts/model_coverage_audit.py --check
      # RQ-60-CFOBLIG (#1057): the WASM-op -> correctness-theorem manifest
      # (artifacts/proof-inventory.json) that consumers read INSTEAD of
      # guessing theorem names from rule kinds (the brif_correct fused-name
      # class: a CamelCase->snake_case guess misses 29 of 138 constructors).
      # Since RQ-61-WASMOP (schema v2) its universe is the shipped WasmOp
      # enum, so an op with no Rocq constructor is a modeled:false ROW, not a
      # missing row. Re-derives the manifest from coq/Synth/**/*.v plus
      # crates/synth-core/src/wasm_op.rs and fails if the
      # committed artifact is stale or hand-edited — a renamed/added/removed
      # theorem or WasmOp variant without a regenerated manifest is RED here,
      # not discovered downstream. Its Qed re-count is additionally pinned
      # EQUAL to the ledger's independent rocq_qed derivation
      # (SYNTH-PROOF-INVENTORY-CROSSCHECK-1057, fields-equal), and its
      # variant count EQUAL to the tripwire test's hand-pinned
      # WASM_OP_VARIANT_COUNT (SYNTH-PROOF-INVENTORY-UNIVERSE-1057), so the
      # readers of either source cannot silently disagree. Lives in the
      # already-REQUIRED claim-check job for the standing reason above.
      - name: Proof-inventory manifest freshness (RQ-60-CFOBLIG, #1057)
        run: python3 scripts/proof_inventory.py --check
      # #890: the ORACLE-WIRING gate. scripts/repro/*.py are the execution
      # oracles; 69 of 150 were referenced by no workflow at all and nothing
      # distinguished "manual by design" from "forgotten". Every script now
      # declares `# ci-status: wired|manual|unwired`, a `wired` declaration is
      # VERIFIED against this file (the "green board, inert gate" defect), and
      # an undeclared script is a hard failure so new oracles must CHOOSE.
      #
      # This gate lives in the already-REQUIRED claim-check job on purpose: a
      # brand-new job is not a required context on main, so it could be red for
      # weeks without blocking anything — which is the same failure mode the
      # gate exists to kill.
      #
      # ANTI-VACUITY: it must not become the thing it polices.
      #   * `set -euo pipefail` EXPLICITLY. A bare `| tee` reports tee's status
      #     (always 0), and — found by mutating this very step — `pipefail`
      #     WITHOUT `-e` is not enough either: the script's status is its LAST
      #     command's, so the inert-gate mutation greened the step while the
      #     gate itself printed FAIL and exited 1. Actions' default shell is
      #     `bash -e`, but this step does not lean on that default.
      #   * The verdict is re-derived from the summary the gate WROTE, not from
      #     exit 0: a non-empty script set, a non-zero wired count, zero
      #     undeclared, zero wired-but-unreferenced, and zero failures.
      # #910 adds `--min-emulation-floor`: the summed `# ci-checks: emulations`
      # floors, i.e. the emulator entries the wired oracle surface ASSERTS on
      # every CI run. It is a RATCHET (direction: up) and a separate population
      # from the `Rust-test Line Coverage` percentage — which cannot see any of
      # it, because the oracles run the compiler as an uninstrumented
      # subprocess from other jobs. The literal below is pinned in claims.yaml
      # against the same number in scripts/repro/ORACLE_WIRING.md, so the gate
      # and the doc cannot drift apart.
      # RQ-56-CITE / #911 — the SAME shape as the oracle-wiring gate below, on
      # the artifacts surface, which never had one. `cargo test -- <filter>`
      # exits 0 when the filter matches NOTHING, so a rivet artifact could claim
      # verification by a test that does not exist. v0.55.0 shipped two such
      # citations; a post-release sweep found them, no gate did.
      #
      # Scoped to CLAIMING statuses (implemented/verified/accepted): under
      # draft/proposed a forward-looking citation is a plan, and flagging it
      # would make this gate noisy. A noisy gate gets ignored — that is how
      # codecov/patch stopped being read (#923).
      - name: Artifact citation gate — no artifact claims a test that does not exist (911)
        run: |
          set -euo pipefail
          python3 scripts/artifact_citation_check.py | tee /tmp/artifact-cites.log
          # Non-vacuity: assert it examined a NON-EMPTY population rather than
          # merely exiting 0 over nothing.
          grep -qE '^artifact citations: [1-9][0-9]* cited filters over [1-9][0-9]* test names' \
            /tmp/artifact-cites.log

      # RQ-60-FLIPCOUPLE / #1064 — the status-evidence gate. v0.58 made
      # release readiness a QUERY over rivet statuses, and SEVEN measured
      # instances across v0.59/v0.60 showed nothing ties "the code landed" to
      # "the artifact says so" — six stale `proposed` over shipped code, one
      # premature `implemented` over an unmet definition of done. Both
      # directions are the same substitution ("the PR merged" read as "the
      # stated outcome holds"), so every release artifact >= v0.60 now
      # declares `done-when` evidence and every id-first delivery commit must
      # be acknowledged by its artifact. Full rules + stated residuals in the
      # script's docstring; all seven instances are replayed as fixtures by
      # the unit test below on every run.
      #
      # Lives in the already-REQUIRED claim-check job for the standing
      # reason: a brand-new job is not a required context on main, so it
      # could sit red for weeks blocking nothing.
      - name: Status-evidence gate — a release status must agree with the evidence on main (1064)
        run: |
          set -euo pipefail
          python3 scripts/status_evidence_check.py | tee /tmp/status-evidence.log
          # Non-vacuity: re-derive the verdict from the summary the gate
          # WROTE — non-empty artifact population, a non-zero delivery-commit
          # scan, predicates actually evaluated, zero failures. R7 (#1085,
          # evidence-release archaeology) LOUDLY SKIPS in-script when history
          # or tags are missing rather than passing silently; the `(0
          # skipped)` + >= 1 checks pinned HERE are what turn that loud skip
          # into a CI red — fetch-depth: 0 above provides the history AND the
          # tags this depends on.
          grep -qE '^status-evidence: [1-9][0-9]* artifacts across [1-9][0-9]* release files, [1-9][0-9]* delivery commits matched, [1-9][0-9]* done-when predicates evaluated, [1-9][0-9]* release-scope archaeology checks \(0 skipped\), 0 failures$' \
            /tmp/status-evidence.log
          # #1119 (RQ-61-R4BLIND): the R4-issue/R10 window scan must have
          # RUN — a SKIPPED window line (no git, tags not fetched) fails
          # this numeric match, so the in-script loud skip becomes a CI red
          # exactly like R7's.
          grep -qE '^status-evidence-window: [0-9]+ delivery-shaped commits since v[0-9]+\.[0-9]+' \
            /tmp/status-evidence.log
      # The gate that polices the statuses does not get to be the unchecked
      # one (six releases running found the defect in the CHECKER). This
      # replays all seven measured miss instances — reconstructed from the
      # real historical statuses at d656fb8a/e1a7b57d/f1e2e7bc/3267e0d3/
      # f8036ec1/e6a3b27a plus the reverted VFPPRESSURE flip — and asserts
      # the gate reds on each, plus green/red controls for every rule.
      - name: Unit-test the status-evidence gate — seven-instance replay (1064)
        run: python3 scripts/test_status_evidence_check.py

      # RQ-62-LOOPCONFORM (#1136): the standing release authorization is
      # conditional on the release running the feature loop, and
      # scripts/loop_conformance_check.py is the gate that DERIVES that
      # conformance (release trees + check-run conclusions + tag workflow
      # runs + crates.io) instead of trusting the cutter's say-so. The
      # conformance check itself gates the TAG moment, not the merge path
      # (its scope bound), so it is deliberately NOT run per-PR — but the
      # checker does not get to be the unchecked one: this replays its
      # derivation branches on fixtures (both red corpora shapes, the
      # verdict's own vacuity refusal) exactly like the mcdc/status-evidence
      # potency tests above.
      - name: Unit-test the loop-conformance gate — corpora replay (1136)
        run: python3 scripts/test_loop_conformance_check.py

      - name: Oracle wiring gate — every repro script declares a CI status (890)
        run: |
          set -euo pipefail
          python3 scripts/oracle_wiring_check.py --json /tmp/oracle-wiring.json --list \
            --min-emulation-floor 322754 \
            | tee /tmp/oracle-wiring.log
          python3 - <<'PY'
          import json, sys
          s = json.load(open("/tmp/oracle-wiring.json"))["summary"]
          bad = [k for k, v in (("total<100", s["total"] < 100),
                                ("wired==0", s["wired"] < 1),
                                ("undeclared", s["undeclared"]),
                                ("wired_unreferenced", s["wired_unreferenced"]),
                                ("checks_undeclared", s["checks_undeclared"]),
                                ("emulation_floor<100000",
                                 s["emulation_floor"] < 100000),
                                ("failures", s["failures"])) if v]
          if bad:
              sys.exit(f"oracle-wiring gate VACUOUS or DRIFTED {bad}: {s}")
          print(f"oracle-wiring gate is non-vacuous: it classified {s['total']} "
                f"scripts, {s['wired']} of them wired, {s['manual']} manual, "
                f"{s['unwired']} unwired-debt, 0 inert, and every wired oracle "
                f"declares a check floor ({s['emulation_floor']} emulator "
                f"entries asserted across "
                f"{s['checks_by_mode']['emulations']['scripts']} of them).")
          PY
      # The GitHub About surface (description + topics) is pinned verbatim in
      # claims.yaml's repo_metadata section. API/network failure = LOUD SKIP
      # (exit 0) so a flake can't block merges; a real mismatch = red.
      - name: Repo metadata check (description + topics)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/repo_metadata_check.py claims.yaml

  verify:
    name: Z3 Verification
    # #553 steps 3/4: this is now the ONLY job that pulls in z3 (feature
    # `z3-solver`) — the trusted-reference differential oracle, not the default
    # engine. SYNTH_SOLVER_DIFF=1 routes every query through BOTH engines
    # (ordeal + Z3); any decided-verdict disagreement is a hard error. Do not
    # delete this job: it is the standing cross-check that keeps the pure-Rust
    # default honest.
    # Links the SYSTEM libz3 (`sudo apt-get install -y libz3-dev`): the
    # `z3-solver` feature no longer enables `static-link-z3`, so z3-sys links
    # `-lz3` (via its `#[link(name="z3")]`) against the apt-installed shared
    # library instead of compiling z3 from source OR downloading a prebuilt —
    # this removes the flaky `z3-sys build.rs` GitHub download (HTTP 403/502)
    # that blocked releases. Stays on ubuntu-latest for `sudo` (smithy runners
    # have no sudo); move once libz3-dev is in the smithy toolchains role.
    runs-on: ubuntu-latest
    # Outer wall-clock guard (#849) — this job hung for 4-6 h alongside `test`
    # on the same unbounded 64-bit bvsrem/bvurem queries. Inner floor: the
    # per-query deadline (`SYNTH_ORDEAL_DEADLINE_MS`, #848), applied to the Z3
    # oracle too.
    timeout-minutes: 45
    env:
      SYNTH_SOLVER_DIFF: "1"
      # Point z3-sys bindgen at the apt header (libz3-dev installs it here);
      # without this it would fall back to the crate's wrapper.h + pkg-config
      # include path. Set explicitly so the system-link path is unambiguous.
      Z3_SYS_Z3_HEADER: /usr/include/z3.h
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system Z3 (shared lib + headers; no from-source/download)
        run: sudo apt-get update && sudo apt-get install -y libz3-dev
      - name: Run verification tests (differential ordeal vs Z3)
        run: cargo test -p synth-verify --features z3-solver,arm
      - name: Run comprehensive verification (differential ordeal vs Z3)
        run: cargo test -p synth-verify --test comprehensive_verification --features z3-solver,arm

  coverage:
    # RENAMED from "Code Coverage" (#910). The old name implied whole-system
    # coverage; the job measures ONE population — the Rust test suite, in-process,
    # under llvm-cov instrumentation.
    #
    # What it CANNOT see, structurally: the execution differentials. Those spawn
    # `$SYNTH` as a SEPARATE, UNINSTRUMENTED process, from OTHER jobs entirely
    # (`repro sweep-*`, `trap-semantics oracle`, the per-issue oracles). An
    # uninstrumented subprocess emits no profile data, so none of that execution
    # reaches this percentage. That is why backend.rs — almost pure ELF emission,
    # exercised end-to-end on every differential — reads ~42 % here.
    #
    # Consequence, stated so nobody has to rediscover it: this number UNDERSTATES
    # the testing that exists, and it is NOT a completeness measure. The
    # differential population is reported separately and in its own unit —
    # asserted executed checks, see scripts/oracle_run.py and the
    # `oracle-evidence-ledger` job. Do not add them together.
    #
    # Not a required status check on `main` (verified before renaming: renaming a
    # required context deadlocks every merge until protection is updated).
    name: Rust-test Line Coverage (unit + integration only)
    needs: [test]
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (LCOV)
        # synth-verify is no longer excluded (#553): the default feature set is
        # pure Rust (ordeal), so its tests run under llvm-cov like any crate.
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --exclude synth-qemu \
            --exclude synth-backend-awsm --exclude synth-backend-wasker
      - name: Say what this number does and does not measure (#910)
        # The scope note travels WITH the number. Reading the percentage off the
        # job summary and reading this are the same act, which is the only way a
        # caveat survives being quoted.
        run: |
          set -euo pipefail
          test -s lcov.info
          {
            echo "### Rust-test line coverage — SCOPE (#910)"
            echo
            echo "Measures: \`cargo llvm-cov --workspace\` — the **Rust test suite**, in-process."
            echo
            echo "Does **not** measure: the execution differentials"
            echo "(\`scripts/repro/*.py\`). They spawn \`\$SYNTH\` as a separate,"
            echo "UNINSTRUMENTED process, from other jobs — no profile data reaches"
            echo "this figure. \`backend.rs\` reads ~42 % here while being exercised"
            echo "end-to-end by nearly every differential."
            echo
            echo "So this number **understates** the testing that exists, and is"
            echo "**not** a completeness measure. The differential population is"
            echo "reported separately, in executed checks, by the"
            echo "\`oracle evidence ledger\` job. **Do not add them together.**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  kani:
    name: Kani Verification
    # Stays on ubuntu-latest: Kani-CBMC bundle is not yet provisioned
    # in the smithy toolchains role (tracked in playbook out-of-scope
    # table). Move once smithy ships kani-verifier + CBMC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Kani
        run: cargo install --locked kani-verifier && cargo kani setup
      - name: Run Kani proofs
        run: cargo kani -p synth-backend --tests
        timeout-minutes: 30

  rivet:
    name: Rivet Validation
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cache the rivet-cli BINARY keyed on its pinned version, NOT on Cargo.lock.
      # The old key (hashFiles Cargo.lock) invalidated on every release version
      # bump, forcing a full rebuild of rivet-cli's HiGHS C++ dependency — which
      # filled a self-hosted runner's disk and red-failed the v0.14.0 release
      # (No space left on device). Version-keying means a Cargo.lock change no
      # longer triggers the rebuild; the cached binary is reused.
      - name: Cache rivet-cli binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/rivet
          key: ${{ runner.os }}-rivet-cli-v0.23.0
      # PIN rivet to a release tag (was `--branch main`, unpinned). Unpinned, an
      # upstream schema/behaviour bump silently reddened the gate on unchanged
      # artifacts (rivet 0.15.0 promoted a WARN→ERROR, #229). v0.23.0 (adds configurable
      # release-readiness ready-when/coverage, check verification-evidence, trace-results) is validated clean on this repo's
      # artifacts before pinning — the exact CI gate below run locally under
      # v0.23.0 gives non-xref ERROR 0, same as v0.22.0. Skip
      # the (expensive) build entirely on a cache hit.
      - name: Install rivet (pinned v0.23.0)
        run: |
          if ! rivet --version 2>/dev/null | grep -q "0.23.0"; then
            cargo install --force --git https://github.com/pulseengine/rivet --tag v0.23.0 rivet-cli
          fi
      - name: Validate artifacts
        # THIS GATE HAD TWO HOLES, and v0.55 (#893) found them by finding two
        # OURS-not-theirs errors sitting in a green tree. Both are fixed below;
        # both fixes are red-first — replay this step's logic against the
        # pre-fix artifacts and it reports 2, against the fixed ones 0.
        #
        #  (1) `^  ERROR:` anchored on two-space-indented lines. rivet prefixes
        #      SOME diagnostics with the source file instead
        #      (`gale-integration.yaml: ERROR: …`), so that whole class was
        #      invisible here — including "artifact id X is declared more than
        #      once … the second definition silently overwrites the first",
        #      which is how GI-FPU-002 could be `implemented` in one file and
        #      `proposed` in another with this job green. Now every line
        #      containing `ERROR:` is considered.
        #  (2) The exemption `targets '.*:.*' which does not exist` exempted ANY
        #      target containing a colon — including `synth:396`, i.e. OUR OWN
        #      repo prefix. A `synth:`-prefixed target that does not resolve is
        #      not a cross-repo link into an un-rivet'd sibling; it is a broken
        #      link in our own graph (there, an issue NUMBER written where an
        #      artifact id belongs). Exemption is now "any prefix EXCEPT ours".
        #
        # Deliberately still exempt: kiln/gale/sigil/scry/jess/witness/loom/meld
        # targets, because those repos have no rivet project at the configured
        # path and the errors are unresolvable from this repo. Not an allowlist —
        # the rule is structural ("a foreign prefix"), so a new sibling repo does
        # not need this file edited, and our own prefix can never slip back in.
        run: |
          sed -i '/^externals:/,$d' rivet.yaml
          rivet validate 2>&1 | tee /tmp/rivet-output.txt
          grep -E "ERROR:" /tmp/rivet-output.txt > /tmp/rivet-errors.txt || true
          # Everything that is NOT a foreign-prefix broken link, ...
          grep -vE "targets '[A-Za-z0-9_.-]+:[^']*' which does not exist" /tmp/rivet-errors.txt \
            | grep -v "missing '.*' link to" > /tmp/rivet-ours.txt || true
          # ... plus foreign-looking links that actually carry OUR prefix.
          grep -E "targets 'synth:[^']*' which does not exist" /tmp/rivet-errors.txt >> /tmp/rivet-ours.txt || true
          NON_XREF=$(grep -c . /tmp/rivet-ours.txt || true)
          if [ "${NON_XREF:-0}" -gt 0 ]; then
            echo "::error::Found $NON_XREF rivet validation errors that are OURS (not cross-repo):"
            cat /tmp/rivet-ours.txt
            exit 1
          fi
          if [ -s /tmp/rivet-errors.txt ]; then
            echo "::warning::Cross-repo link errors present (expected — external projects need rivet init)"
          fi
          # ------------------------------------------------------------------
          # #1064 NON-VACUITY FLOOR — a skipped artifact source must not pass.
          #
          # release-v0.59.yaml carried non-schema top-level keys ('metadata:',
          # 'requirements:'); rivet's generic-yaml loader skipped the WHOLE
          # file, and this job stayed GREEN because an invisible file
          # contributes zero errors — all 16 RQ-59-* artifacts were absent
          # from the graph the release-readiness query runs over. The
          # ERROR-grep above can never catch that class: validation did LESS
          # work and reported nothing (same shape as #1012 one level up).
          #
          # So pin a FLOOR on artifacts loaded — the discipline
          # scripts/oracle_run.py applies to emulation counts: the number may
          # only rise. When a PR ADDS artifacts, raise the floor in the same
          # PR (the visible-diff rule). A measured value BELOW the floor
          # means an artifact source went invisible; that is the defect —
          # never lower the floor to pass.
          #
          # Floor measured 2026-08-26 under the pinned rivet v0.23.0 with the
          # externals block stripped (this job's own conditions, above):
          # 463 local artifacts, release-v0.59.yaml's 16 included. Re-measured
          # after #1056 merged RQ-59-GLOBALINIT to main: 464, v0.59's 17 included.
          # 464 -> 472 when release-v0.60.yaml landed its 8 artifacts.
          # 472 -> 473: #1071 added SWVER-025 without raising the floor;
          # tightened here rather than left slack (a floor only fails BELOW
          # itself, so 473-measured vs 472-pinned would have passed quietly).
          # 473 -> 479: v0.61's six artifacts, the FIRST release to use the
          # per-requirement directory layout (#1059). Verified empirically on
          # the pinned rivet 0.23.0 before bumping — the count moved by exactly
          # six and all six ids are visible in `rivet list`, so the directory
          # is really being recursed rather than silently skipped (#1064).
          # 479 -> 484: the five newly-triaged issues scoped into v0.61
          # (#1095 spec-suite claim, #1097 mv oracle, #1055 fuzz window,
          # #1040 A32 reloc type, #1080 extraction snapshots). An open issue
          # with no rivet artifact is invisible to the release plan and
          # resurfaces as a cut-time surprise — the issue-hunt anti-pattern.
          # 484 -> 486: #1102 (rv32 dangling synth_func_N on a declined
          # internal, exit 0) and #1100 (MC/DC report-side floors are
          # layout-coupled), both triaged in the same wave that found them.
          # 486 -> 495. Two independent additions landed in the same
          # release and both are additive:
          #   +1  RQ-61-ORACLEFLOOR (#1113, PR #1112) — the decline-half floor
          #   +8  the #1091 v0.60 backfill pilot (VER060-001..008,
          #       artifacts/sys-verification-v0.60.yaml) transcribing the
          #       evidence the RQ-60-* artifacts already name into typed
          #       `verifies` links.
          # 496 -> 509: #1091 increment 2 — sys-verification-v0.61.yaml adds
          # 13 evidence-transcription artifacts (VER061-001..013), one per
          # implemented RQ-61-* requirement. Re-measured under the pinned
          # rivet 0.23.0, externals stripped: 509, and the count moved by
          # exactly the 13 ids visible in `rivet list`.
          # Measured, not computed: the live count is re-derived below and
          # this pin is the value it reports.
          ARTIFACT_FLOOR=519
          MEASURED=$(rivet list 2>/dev/null | grep -Eo '^[0-9]+ artifacts$' | tail -1 | cut -d' ' -f1)
          echo "artifact-load floor=$ARTIFACT_FLOOR measured=${MEASURED:-<none>}"
          if [ -z "$MEASURED" ]; then
            echo "::error::rivet list printed no '<N> artifacts' count line — the artifact-load floor cannot be measured. Treating as RED, not green (#1064)."
            exit 1
          fi
          if [ "$MEASURED" -lt "$ARTIFACT_FLOOR" ]; then
            echo "::error::Artifacts loaded fell below the floor ($MEASURED < $ARTIFACT_FLOOR). An artifact source file is being skipped or mis-parsed (#1064) — find it; do not lower the floor."
            exit 1
          fi
      # ------------------------------------------------------------------
      # #1091 V-CLOSURE FLOOR — `rivet coverage` must ASSERT, not print.
      #
      # release-execution names the traceability completeness gate as THE
      # release blocker, and it had never fired: this step ran
      # `rivet coverage`, which printed `sys2-has-verification 61/165`
      # into a log nobody reads and EXITED 0 at any percentage — 60/60
      # release artifacts across v0.56–v0.60 carried no linked
      # sys-verification while the job stayed green. Third instance of a
      # validator reporting success about work it never did (#1012, #1064).
      #
      # NOT "unverified work": the verification EXISTS (unicorn execution
      # differentials, ld.lld-linked run evidence, Rocq proofs with
      # red-first transcripts, mutation-killed gates). What was missing is
      # the TYPED `verifies` LINK that makes it queryable by the trace
      # graph. This floor pins the covered count so links, once added,
      # cannot silently rot away again.
      #
      # Same discipline as ARTIFACT_FLOOR above: the number may only rise,
      # and a PR that adds coverage raises the floor in the same PR (the
      # visible-diff rule). Floor measured 2026-09-01 under the pinned
      # rivet v0.23.0 with the externals block stripped (this job's own
      # conditions): sys2-has-verification 61 covered of 165 system-reqs.
      # 61 -> 69 in the same PR: the #1091 v0.60 backfill pilot added 8
      # sys-verification artifacts (VER060-001..008) transcribing the
      # evidence the RQ-60-* artifacts already name; re-measured 69/165
      # (41.8%) under the same conditions.
      # 69 -> 82: #1091 increment 2 — sys-verification-v0.61.yaml links the
      # 13 implemented RQ-61-* artifacts (VER061-001..013). Re-measured
      # 82/167 (49.1%) under the same conditions (pinned 0.23.0, externals
      # stripped). DECIDED under #1091, recorded here because this comment
      # is where the "per-release backfill discipline" was delegated to:
      # from v0.60 on, every release's artifacts get transcription links in
      # the PR wave that implements them; the 52 pre-v0.60 release
      # artifacts (v0.56-v0.59) are EXEMPT — they predate the mandatory
      # done-when/verified-by fields (RQ-60-FLIPCOUPLE), so linking them is
      # archaeology (~15-25 h measured), not transcription (~5-10
      # min/artifact measured twice). Their verification exists in their
      # release notes; it is not queryable by the trace graph, and that is
      # a recorded limitation, not a debt being serviced.
      #
      # WHAT THIS FLOOR CAN DETECT: a lost `verifies` edge (deleted, or
      # spliced away — the #1059 shape); a sys-verification source file
      # going invisible to the loader (the #1064 shape — covered drops by
      # that file's whole contribution); a rivet output/rule rename (the
      # row disappears → unmeasurable → RED, never green).
      # WHAT IT CANNOT DETECT, stated so nobody reads more into it:
      # (a) NEW system-reqs landing without verification — the DENOMINATOR
      # grows, the ratio decays, and this covered-count floor does not
      # move; that direction is owned by the per-release backfill
      # discipline decided under #1091, not by this pin. (b) a
      # sys-verification artifact whose cited evidence is weak, stale, or
      # restated prose — the floor counts typed links; judging the
      # evidence lives in scripts/status_evidence_check.py and review.
      #
      # RED-FIRST (2026-09-01, locally under the pinned 0.23.0): pinned at
      # 62 with 61 measured, this step exits 1 with the below-floor error;
      # at 61 it exits 0; on output missing the sys2 row entirely, the
      # unmeasurable branch exits 1.
      - name: Check coverage (asserting — #1091)
        run: |
          set -o pipefail
          SYS2_VERIFIED_FLOOR=82
          rivet coverage 2>&1 | tee /tmp/rivet-coverage.txt
          COVERED=$(awk '$1 == "sys2-has-verification" && $2 == "system-req" {print $3; exit}' /tmp/rivet-coverage.txt)
          echo "sys2-has-verification floor=$SYS2_VERIFIED_FLOOR covered=${COVERED:-<none>}"
          if ! [ "$COVERED" -ge 0 ] 2>/dev/null; then
            echo "::error::rivet coverage printed no parseable 'sys2-has-verification' covered count — the V-closure floor cannot be measured. Treating as RED, not green (#1064, #1091)."
            exit 1
          fi
          if [ "$COVERED" -lt "$SYS2_VERIFIED_FLOOR" ]; then
            echo "::error::system-reqs with a linked sys-verification fell below the floor ($COVERED < $SYS2_VERIFIED_FLOOR). A verifies edge was lost or a verification source file went invisible (#1091) — find it; do not lower the floor."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Rivet Federated Graph — ADVISORY (deliberately NOT in the required set).
  #
  # #1012: the required job above validates ONLY the synth-local half (it strips
  # the externals block), so the entire federated half of the trace graph was
  # unchecked — six dead `path: /Volumes/Home/...` entries poisoned resolution
  # for months and nothing noticed. This job owns the federated half: it syncs
  # the sibling repos and validates every cross-repo traces-to link.
  #
  # WHY ADVISORY, stated as the tradeoff it is: resolving the federated graph
  # makes network access AND seven sibling repos' current heads a CI dependency
  # (`rivet sync` tracks `ref: main` — rivet has no `sync --locked` mode, so the
  # committed rivet.lock pins for reproducibility/impact tooling but does not
  # pin what CI fetches). A sibling deleting an artifact synth links to SHOULD
  # turn this red — that is a real broken trace — but it must not block synth
  # merges that didn't cause it, and a GitHub/network hiccup must not deadlock
  # the queue. So: visible red, non-blocking. Promote to required only if it
  # stays quiet long enough to earn it (and then only with a lock-pinned sync).
  #
  # WHY rivet v0.32.0 HERE while the job above stays on v0.23.0: this is a NEW
  # pin for a NEW job, not a silent bump of the existing gate — sync/lock and
  # the broken-cross-ref accounting this job exists to exercise are what
  # matured after 0.23.0, and the in-tree rivet.lock was written by 0.32.0.
  # Installed under its OWN --root: both jobs share self-hosted runners, and
  # ~/.cargo/bin/rivet is shared machine state — clobbering versions would make
  # the two jobs re-build rivet-cli (HiGHS C++) on alternating runs, the exact
  # disk-filling failure the binary cache above exists to prevent.
  # ---------------------------------------------------------------------------
  rivet-federated:
    name: Rivet Federated Graph (advisory)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache rivet-cli 0.32.0 binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/rivet-0.32/bin/rivet
          key: ${{ runner.os }}-rivet-cli-v0.32.0
      - name: Install rivet 0.32.0 (own root — never clobbers the 0.23.0 at ~/.cargo/bin)
        run: |
          if ! ~/.cargo/rivet-0.32/bin/rivet --version 2>/dev/null | grep -q "0.32.0"; then
            cargo install --force --git https://github.com/pulseengine/rivet --tag v0.32.0 --root ~/.cargo/rivet-0.32 rivet-cli
          fi
      - name: Sync externals (network — clones the 7 sibling repos)
        # #1143: AUTHENTICATE FOR QUOTA, NOT FOR ACCESS. All seven siblings are
        # PUBLIC, so this clone needs no permission — but GitHub rate-limits
        # ANONYMOUS git traffic, and hard from datacenter address space, which
        # is exactly where the self-hosted fleet lives. A throttled response
        # makes git fall back to interactive auth, and on a tty-less runner
        # that surfaces as the confusing
        #   fatal: could not read Username for 'https://github.com'
        # — which reads like a permissions failure and is not one. This job had
        # been failing that way on EVERY commit since 2026-09-02, so the
        # federated graph went unvalidated for a whole release while the job
        # sat advisory-red. Independently corroborated: the same limiter hit
        # unrelated infrastructure elsewhere in the same period.
        #
        # GITHUB_TOKEN is repo-scoped and that is fine — we need the
        # authenticated RATE LIMIT, not cross-repo permission. The rewrite is
        # scoped to this step's git invocations rather than persisted.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          trap 'git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf || true' EXIT
          ~/.cargo/rivet-0.32/bin/rivet sync
      - name: Validate the federated graph
        # Exit code IS the gate (rivet validate exits non-zero on FAIL). tee'd
        # under pipefail so the log keeps the full diagnostic list.
        run: |
          set -o pipefail
          ~/.cargo/rivet-0.32/bin/rivet validate 2>&1 | tee /tmp/rivet-federated.txt
      - name: Non-vacuity guard — resolution must actually have run
        # The #1012 signature was "FAIL (50 errors, ..., 0 broken cross-refs)":
        # zero broken cross-refs beside dozens of link errors because rivet
        # never RESOLVED the graph (dead paths), not because it was clean. A
        # validator reporting N errors and 0 <thing the errors are about> has
        # usually not gotten far enough to look. Guard: a resolved graph loads
        # external artifacts that link back to synth ("Cross-repo backlinks:
        # N"), and N was 1032 at authoring — if resolution ever silently stops
        # again, N reads 0 and this step goes red even though validate PASSed.
        run: |
          BACKLINKS=$(grep -oE 'Cross-repo backlinks: [0-9]+' /tmp/rivet-federated.txt | grep -oE '[0-9]+' | head -1)
          echo "Cross-repo backlinks: ${BACKLINKS:-0}"
          if [ "${BACKLINKS:-0}" -eq 0 ]; then
            echo "::error::Federated resolution appears NOT to have run (0 cross-repo backlinks loaded) — the #1012 poisoned-resolution signature. A green validate above is vacuous in this state."
            exit 1
          fi

  bazel:
    name: Bazel Build & Proofs
    # Stays on ubuntu-latest: needs Nix + Bazel + Rocq via Bazel
    # (none provisioned on smithy; tracked in playbook out-of-scope
    # table for both Bazel and Rocq).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build Rust via Bazel
        run: bazel build //crates:synth
      - name: Verify Rocq proofs
        run: bazel test //coq:verify_proofs
      - name: Run Renode emulation tests
        # #945: `|| [ $? -eq 4 ]` swallows Bazel exit 4 = NO TESTS MATCHED, so
        # this step passed while selecting nothing. Keep tolerating a genuinely
        # empty Renode matrix (the emulator is not always available), but SAY so
        # rather than reporting a silent pass — an unreachable gate that prints
        # nothing is the class this release exists to remove.
        #
        # NOTE (updated by #1095): this target tree still references
        # `tests/spec-testsuite` ZERO times — but that is no longer the gap it
        # recorded. The official-suite compile census the docs advertise is
        # produced by `.github/workflows/spec-suite.yml` (the only workflow
        # that checks out the submodule), exact-pinned in
        # `scripts/spec_compile_census.py` with a 257-file non-vacuity floor.
        # `|| rc=$?`, NOT a bare `rc=$?` on the next line: GitHub runs `run:`
        # under `bash -e`, so a non-zero `bazel test` aborts the step BEFORE the
        # capture — which is exactly how the first attempt at this fix failed,
        # with the very exit 4 it was written to report.
        run: |
          set -uo pipefail
          rc=0
          bazel test //tests/renode/... --test_tag_filters=wast || rc=$?
          if [ "$rc" -eq 4 ]; then
            echo "::warning::renode wast matrix selected ZERO tests (bazel exit 4)"
            echo "  This step is TOLERATED-EMPTY, not passing on evidence."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
        timeout-minutes: 10

  wast-conformance-oracle:
    name: WAST conformance — the assertions are EXECUTED (#928)
    # RQ-56-CONF (#928). tests/wast/ carries 381 `assert_return` and 2
    # `assert_trap`, and until this job NONE of them were checked: the only CI
    # path over those files asserted that `synth compile` exits 0 and discarded
    # the expected values. The backend's primary correctness suite graded "did
    # an ELF come out", not "is it right" — the exit-0 vacuity class (#911) on
    # the correctness suite itself, and why three silent miscompiles (#929,
    # #930, #931) shipped and were found from outside.
    #
    # Isolated job for the same reason as cmp-select: unicorn/wasmtime are
    # pip-installed here ONLY, so `cargo test --workspace` is not taxed with a
    # C-library build graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build synth
        run: cargo build -p synth-cli
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install emulation deps
        run: pip install wasmtime unicorn pyelftools
      - name: Execute the wast assertions (#928)
        run: |
          set -euo pipefail
          python scripts/oracle_run.py \
            scripts/repro/wast_conformance_928_differential.py | tee /tmp/wastconf.log
          # NON-VACUITY, the whole point of this gate: a green result must mean
          # assertions RAN. A floor is asserted here as well as inside the
          # script so neither can go quiet alone.
          grep -qE '^#928 CHECKS=[0-9]+/[1-9][0-9]{2,}' /tmp/wastconf.log
          grep -q '^RESULT: PASS' /tmp/wastconf.log
      - name: Differential evidence ledger (#910)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/oracle_evidence.py "$ORACLE_EVIDENCE_JSONL" --min-oracles 1

  cmp-select-oracle:
    name: cmp-select two-move execution oracle
    # VCR-ORACLE-001 (#242, #428): EXECUTE the cmp->select two-move arm under
    # unicorn (faithful Thumb-2 IT-block predication) and diff flag-off vs flag-on
    # vs wasmtime. This is the runtime validation gale's #428 measurement showed no
    # real fixture provides (the two-move arm is reachable but runtime-dead on real
    # code). Isolated job: unicorn/wasmtime are pip-installed here ONLY, so the main
    # `cargo test --workspace` gate is NOT taxed with a C-library build graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build synth
        run: cargo build -p synth-cli
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
