      - name: i64.div_s(INT64_MIN,-1) overflow-trap differential (#633)
        run: python scripts/oracle_run.py scripts/repro/i64_divs_overflow_633_differential.py
      - name: i64 global.get/set pair differential (#643, both selectors)
        run: python scripts/oracle_run.py scripts/repro/i64_globals_643_differential.py
      - name: i64 pair-exhaustion spill differential (#587)
        run: |
          SYNTH_SPILL_ON_EXHAUST=1 ./target/debug/synth compile scripts/repro/i64_pair_exhaust_587.wat -o /tmp/pe587.elf --target cortex-m4
          python scripts/oracle_run.py scripts/repro/i64_pair_exhaust_587_differential.py /tmp/pe587.elf
      - name: i64.popcnt scratch-restore clobber differential (#632)
        run: python scripts/oracle_run.py scripts/repro/i64_popcnt_632_differential.py
      - name: i64 shr_u/shr_s single-function path differential (#599)
        run: python scripts/oracle_run.py scripts/repro/i64_shr_599_differential.py
      - name: i64 expansion operand-clobber differential (#1048, 3 legs incl. A32)
        run: python scripts/oracle_run.py scripts/repro/i64_operand_clobber_1048_differential.py
      - name: i64 high-register zero-fill differential (#916)
        run: |
