      - name: RV32 i32 local-promotion differential (#472)
        run: |
          ./target/debug/synth compile scripts/repro/rv32_local_promotion_472.wat -b riscv --target riscv32imac --relocatable --all-exports -o /tmp/promo.o
          python scripts/oracle_run.py scripts/repro/rv32_local_promotion_472_riscv_differential.py /tmp/promo.o
      - name: RV32 signed-div-const overflow-guard clobber (#232)
        run: |
          ./target/debug/synth compile scripts/repro/signed_div_const.wasm -b riscv -t rv32imac --all-exports --relocatable -o /tmp/sdiv.o
          python scripts/oracle_run.py scripts/repro/signed_div_const_riscv_differential.py /tmp/sdiv.o
      - name: RV32 u64-unpack differential (#313)
        run: |
          ./target/debug/synth compile scripts/repro/u64_unpack_inlined.wat -b riscv -t rv32imac --all-exports --relocatable -o /tmp/u64_rv32.elf
          python scripts/oracle_run.py scripts/repro/u64_unpack_riscv_differential.py
      # #910: close the job with what it EXECUTED. Asserts every oracle
      # met its declared floor AND that the expected number of them
      # reported at all — a step deleted, commented out, or skipped by an
      # early exit leaves the ledger short, which is a red job rather than
      # a quietly smaller number. Also writes the measured totals to the
      # step summary, per unit, never summed.
      - name: Differential evidence ledger (#910)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/oracle_evidence.py "$ORACLE_EVIDENCE_JSONL" --min-oracles 11

  repro-sweep-arm-corpus-oracle:
    name: "repro sweep — ARM corpus (#973: CI never compiled these for ARM)"
    # RQ-58-SELECT973, the second half and the larger one. #973 — `select` on an
    # i64-comparison condition returning the then-arm on every vector where the
    # else-arm was due — was found only because a lane compiled
    # `scripts/repro/*.wat` for ARM BY HAND. Nothing in CI did that. The
    # `repro-sweep-*` jobs above run hand-listed oracles, each pinned to the one
    # fixture its issue was about, so a fixture written for RV32 or aarch64 never
    # reached the ARM backend even when its shape is backend-independent.
    # `rv32_cmp_select_472.wat` carried the #973 shape as `sel_cmp_i64` since
    # v0.11 and no ARM build ever saw it — MEASURED: run against the PRE-fix
    # binary this sweep reports 7 wrong vectors for exactly that export, so the
    # leg is red-first against the defect it was built for, using a fixture that
    # was already in the tree.
    #
    # Two phases, because compiling alone would NOT have caught #973 (it compiled
    # perfectly and returned the wrong number): a no-wildcard COMPILE census over
    # every fixture, then an EXECUTION differential against wasmtime over every
    # all-i32 export of every module pure enough to emulate faithfully.
    #
    # Turning this on surfaced 48 pre-existing wrong vectors unrelated to #973 —
    # #989 (a local.set/tee clobbers a live local.get of the same local) and #990
    # (a local written on one arm of a br_if is never zero-inited, so the merge
    # reads uninitialised stack). They are LISTED by name against their issue
    # inside the harness and ratcheted in both directions, not narrowed away.
    runs-on: ubuntu-latest
    env:
      SYNTH: ./target/debug/synth
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build synth
        run: cargo build -p synth-cli
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # Deliberately NO wabt. Both oracles here assemble `.wat` with wasmtime's
      # OWN assembler (`wasmtime.wat2wasm` / `Module.from_file`), so the
      # reference side is ONE toolchain: what parses and what runs cannot
      # disagree, and the executed population does not depend on the runner's
      # wabt build. That host-dependency class (#850/#881) is the one thing a
      # never-before-run job discovers the hard way.
      - name: Install emulation deps
        run: pip install wasmtime unicorn pyelftools capstone
      - name: "#973 i64-cmp select execution differential (both ARM legs)"
        run: python scripts/oracle_run.py scripts/repro/select_i64cmp_973_arm_differential.py
      - name: "#989 local.set/tee WAR-aliasing execution differential (both ARM legs)"
        run: python scripts/oracle_run.py scripts/repro/war_aliasing_989_arm_differential.py
      - name: "ARM corpus sweep — compile census + execution differential (#973)"
        run: python scripts/oracle_run.py scripts/repro/arm_corpus_sweep_973.py
      # #910: close the job with what it EXECUTED. Asserts every oracle
      # met its declared floor AND that the expected number of them
      # reported at all — a step deleted, commented out, or skipped by an
      # early exit leaves the ledger short, which is a red job rather than
      # a quietly smaller number. Also writes the measured totals to the
      # step summary, per unit, never summed.
      - name: Differential evidence ledger (#910)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/oracle_evidence.py "$ORACLE_EVIDENCE_JSONL" --min-oracles 3

  repro-sweep-wcet-oracle:
    name: repro sweep — WCET bound soundness cross-checks (phases 2-6)
    # #890: the SOUNDNESS evidence for --emit-wcet. The cargo gate
    # (wcet_bound_gate.rs) pins the bounds analytically; these five harnesses
    # are the only thing that EXECUTES the fixtures under unicorn and checks
    # `bound_cycles >= executed_instructions`, i.e. that the bound synth
    # publishes is actually an upper bound. They were unwired — the soundness
    # claim in CLAUDE.md rested on a hand-run script.
    # SYNTH must be ABSOLUTE here: these harnesses chdir into a temp dir.
    runs-on: ubuntu-latest
    env:
      SYNTH: ${{ github.workspace }}/target/debug/synth
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build synth
        run: cargo build -p synth-cli
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install emulation deps
        run: pip install wasmtime unicorn pyelftools capstone
      - name: Install wabt (wat2wasm — required by the newly-wired oracles)
        # #890: these oracles were never CI-run, so their host deps were never
        # discovered. wat2wasm is absent on the runner and several fixtures
        # build their .wasm from .wat at test time (the #850/#881 class).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends wabt
      - name: WCET phase-2 const-loop bound soundness (#778)
        run: python scripts/oracle_run.py scripts/repro/wcet_phase2_778_unicorn_soundness.py
      - name: WCET phase-3 inter-procedural composition soundness (#778)
        run: python scripts/oracle_run.py scripts/repro/wcet_phase3_778_compose_soundness.py
      - name: WCET phase-4 bounded-recursion soundness (#49)
        run: python scripts/oracle_run.py scripts/repro/wcet_phase4_49_recursion_soundness.py
      - name: WCET phase-5 masked-ceiling loop soundness (#778)
        run: python scripts/oracle_run.py scripts/repro/wcet_phase5_778_masked_loop_soundness.py
      - name: WCET phase-6 I64Const/I64Ldr/I64Str leaf soundness (#936)
        run: python scripts/oracle_run.py scripts/repro/wcet_phase6_936_i64_leaf_soundness.py
      - name: WCET phase-7 I32WrapI64/I64ExtendI32S/U conversion soundness (RQ-59-WCETI64, #936)
        run: python scripts/oracle_run.py scripts/repro/wcet_phase7_936_i64_conv_soundness.py
      # #910: close the job with what it EXECUTED. Asserts every oracle
      # met its declared floor AND that the expected number of them
      # reported at all — a step deleted, commented out, or skipped by an
      # early exit leaves the ledger short, which is a red job rather than
      # a quietly smaller number. Also writes the measured totals to the
      # step summary, per unit, never summed.
      - name: Differential evidence ledger (#910)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/oracle_evidence.py "$ORACLE_EVIDENCE_JSONL" --min-oracles 6

  mcdc-structural-coverage:
    name: MC/DC structural coverage over synth's decision logic (RQ-57-MCDC, #912)
    # #912 asked for MC/DC and sat N/A for six releases on a SURFACE argument:
    # `witness` measures MC/DC on a Wasm artifact and synth emits ARM/RV32/A64
    # machine code, so "run witness on synth's output" is a category error.
    # True about the OUTPUT — and irrelevant, because the decisions that ship a
    # miscompile are in synth's own Rust, which compiles to Wasm fine.
    #
    # This job builds `synth-mcdc-harness` (a thin ROW DRIVER — it calls the
    # REAL pub fns, it re-implements nothing) for wasm32-wasip1, drives one
    # truth-table row per `witness run --invoke-with-args`, and scores the
    # result over synth's OWN functions only.
    #
    # WHY THE MODULE-WIDE PERCENTAGE IS NOT THE GATE: a wasip1 link drags in
    # wasi-libc and Rust std, so the raw figure is `3/770 full MC/DC` and says
    # nothing about synth. And a ratio cannot notice a DELETED condition —
    # removing one makes the percentage IMPROVE. scripts/mcdc_gate.py scores by
    # DEMANGLED FUNCTION (witness's source_file is an inlined-DWARF basename and
    # is unreliable — upstream witness#179) and floors COUNTS.
    #
    # RED-FIRST (verified locally before this job was written, both mutations
    # restored byte-identical afterwards):
    #   (a) delete the #871 condition `|| rs2 == Reg::RA` from the RV32
    #       allocation validator -> 20/144/63/3 becomes 19/142/54/2; all four
    #       floors trip. The CONDITION-COUNT drop is the signal a ratio misses.
    #   (b) drop ONE truth-table row (`ra_validate:14`) -> conditions stay 144
    #       but proved falls 63->62 and fully-proved decisions 3->2. Two
    #       mutations, two distinct failure paths.
    #
    # PINNED: witness v0.42.0 and the workspace's stable toolchain. The scored
    # numbers were identical under witness 0.28.0 and 0.42.0 (14 minor versions
    # apart), so the measurement is not tracking the tool's phrasing. If a
    # toolchain bump changes std inlining and moves the counts, RE-MEASURE and
    # state the new baseline — never lower a floor to go green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # PINNED, deliberately, unlike every other job here: the floors are counts
      # of decisions and conditions RECONSTRUCTED FROM LOWERED WASM, so they are
      # sensitive to how `std` inlines. `@stable` is a moving target and a Rust
      # release could red this gate with no code change. Bumping this version is
      # allowed — it obliges a RE-MEASURE of the floors, not a lowering.
      #
      # RESTORED to 1.96.1: dependabot #984 auto-bumped this to 1.100.0 as an
      # "action version" — but for dtolnay/rust-toolchain the ref IS the rustc
      # version, so the bump silently changed the measured compiler with no
      # re-measure of the floors, defeating the pin's whole purpose. Every
      # baseline in scripts/mcdc_gate.py and scripts/repro/mcdc_912_gate.md is
      # a 1.96.1 measurement. Do not let dependabot move this line: a bump is
      # only valid inside a PR that re-measures and restates the floors.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-wasip1
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-mcdc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mcdc-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install witness (pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.witness"
          gh release download v0.42.0 --repo pulseengine/witness \
            --pattern 'witness-v0.42.0-x86_64-unknown-linux-gnu.tar.gz' \
            --dir "$HOME/.witness"
          tar xzf "$HOME/.witness"/witness-v0.42.0-*.tar.gz -C "$HOME/.witness"
          "$HOME/.witness/witness" --version
      # The row drivers must reach the outcomes their doc comments claim. A
      # driver that returned one verdict for every row would make the whole
      # MC/DC run vacuous while still printing a number.
      - name: Row-driver sanity gate (host)
        run: cargo test -p synth-mcdc-harness
      # witness#208/#990: the BRANCH_POPULATION check is a NEW checker born of
      # a checker defect — it ships with its own committed potency tests
      # (drop/grow/unpinned red-and-name-the-function, REPIN guard text,
      # exact-match green, unscored-noise green), same rule as
      # scripts/test_claim_check.py for the RQ-58-METRIC ratchet.
      - name: BRANCH_POPULATION checker unit tests (witness#208 potency)
        run: python3 scripts/test_mcdc_gate.py
      # Invoked through `bash`, not as `./…`: scripts/ is mode 644 in this repo
      # (cf. scripts/oracle_run.py), so an `exec` form exits 126 on a fresh
      # checkout even though it runs fine locally after a `chmod`.
      - name: Run the MC/DC rows under witness
        run: WITNESS="$HOME/.witness/witness" bash scripts/mcdc_run.sh target/mcdc
      - name: Score synth's own decisions against the declared floors
        run: |
          set -euo pipefail
          python3 scripts/mcdc_gate.py target/mcdc | tee /tmp/mcdc.log
          # Non-vacuity: the gate must have SCORED something. A scoping change
          # that matched zero functions would otherwise print an empty table
          # and fail the floors for the wrong reason — or, worse, a future
          # `--report-only` slip would print PASS over nothing.
          grep -qE '^TOTAL +[0-9]+' /tmp/mcdc.log
          grep -q '^PASS: all MC/DC floors met' /tmp/mcdc.log
      - name: Publish the truth tables and gap rows
        if: always()
        run: |
          {
            echo "### MC/DC over synth's own decision logic (#912)"
            echo
            echo "Scored by DEMANGLED FUNCTION, not by file — witness's"
            echo "\`source_file\` is an inlined-DWARF basename (witness#179)."
            echo "The module-wide percentage is NOT this gate: a wasip1 link"
            echo "pulls in wasi-libc + std."
            echo
            echo '```'
            cat /tmp/mcdc.log 2>/dev/null || echo "(gate did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcdc-evidence
          path: |
            target/mcdc/report.txt
            target/mcdc/report.json
            target/mcdc/rollup.txt
            # witness#208/#990: the manifest is the attribution map AND the
            # stable branch-population surface — without it the inventory
            # behind a floor movement cannot be audited from the artifact.
            target/mcdc/instrumented.wasm.witness.json
