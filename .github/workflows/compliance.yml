name: Compliance report

# Publishes synth-vX.Y.Z-compliance-report.tar.gz to each GitHub Release so
# pulseengine.eu's fetch-reports surfaces it on the Reports page.
#
# RQ-81-COMPLIANCE (#1453): IT IS NO LONGER DECOUPLED, AND THE OLD COMMENT HERE
# SAID THE OPPOSITE. It read "Decoupled from release.yml on purpose: triggers on
# release publish, is additive, and cannot affect the existing release flow if it
# fails" — and that design is exactly what made this workflow stop running for
# forty-four consecutive releases without a single red check.
#
# WHY, MEASURED over all 148 releases: `release: types: [published]` is the only
# real trigger, and GitHub does not start workflow runs for events raised by
# `GITHUB_TOKEN` — a deliberate, SILENT recursion guard. `release.yml` publishes
# with `gh release create` under the default token, so the event never fires.
# This workflow has run exactly 19 times EVER: 1 `workflow_dispatch` and 18
# `release` events, and all 18 correspond to releases a USER published. Zero runs
# since 2026-07-15. 129 of 148 releases carry no report, 44 of them consecutively
# from the newest. Nothing was red, because a workflow that never starts has no
# conclusion to be red.
#
# So `release.yml` now CALLS this workflow (`workflow_call`) after the release is
# created, which is a different trigger and no new credential. The alternative —
# publishing with a PAT so a user raises the event — was rejected: it is a
# long-lived secret this repo would have to hold, and it would re-enable the
# recursion the guard exists to prevent for EVERY workflow listening on release
# events. #1460 is the standing reminder of what a credential-dependent release
# step costs.
#
# AND IT CAN NOW FAIL THE RELEASE PATH, deliberately, because a gate that cannot
# fail is this programme's recurring defect. Stated precisely so the next reader
# is not misled: the release's binaries are already uploaded by the time this
# runs, so a failure does NOT un-publish them — it turns the release WORKFLOW
# red and visible instead of silently producing nothing. `workflow_dispatch`
# remains, and it is how a missing report gets regenerated for an older tag.
#
# NOTE: rivet-version pins the rivet binary used to validate/export synth's
# artifacts. Bump it if a future schema needs a newer rivet.

on:
  release:
    types: [published]
  # RQ-81-COMPLIANCE (#1453): called by release.yml after the release is created,
  # because the `release: published` event above is never raised for a release
  # published under GITHUB_TOKEN. Same job, different trigger, no new secret.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to generate the report for (e.g. v1.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)generate the report for (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  compliance:
    name: Generate compliance report
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REL_TAG}"
          case "$TAG" in v*) ;; *) echo "::error::tag '$TAG' must start with v"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # RQ-82-COMPLIANCE2 (#1453): THE TRIGGER WAS FIXED AND THE JOB STILL PRODUCED
      # NOTHING. v0.81 made this workflow reachable (it ran on the v0.81.0 tag for
      # the first time ever, 7 steps) and it then FAILED at `Generate compliance
      # report`, so `Upload report to release` SKIPPED and v0.81.0 carries 13 assets
      # with no compliance tarball. DERIVED, not inferred: the single `actions/checkout`
      # above gives the job synth ONLY, while `rivet.yaml` declares SEVEN externals
      # whose clones live under `.rivet/repos/<prefix>` — a path that is GITIGNORED
      # (.gitignore:62) and therefore cannot arrive with any checkout. rivet then
      # reports `could not load externals: IO error` and every cross-repo `traces-to`
      # target reads as dangling. That is the #1012 signature: link errors BESIDE
      # unloaded externals mean resolution never ran, not that the links are broken.
      #
      # THE PATTERN IS NOT NEW — it is lifted from ci.yml's federated-graph job,
      # #1143. AUTHENTICATE FOR QUOTA, NOT FOR ACCESS: all seven siblings are PUBLIC,
      # so no permission is needed, but GitHub rate-limits ANONYMOUS git traffic and
      # a throttled response makes git fall back to interactive auth, surfacing on a
      # tty-less runner as `fatal: could not read Username for 'https://github.com'`
      # — which reads like a permissions failure and is not one. GITHUB_TOKEN is
      # repo-scoped and that is fine; the authenticated RATE LIMIT is the point. The
      # rewrite is scoped to this step and removed on exit rather than persisted.
      - name: Sync rivet externals (network — the 7 PUBLIC sibling repos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          trap 'git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf || true' EXIT
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PYEOF'
          import pathlib, shutil, subprocess, sys, yaml

          # DERIVED from rivet.yaml, so adding an external never needs a second
          # edit here. A hand-written mirror of this list is the drift the North
          # Star forbids.
          ext = (yaml.safe_load(pathlib.Path("rivet.yaml").read_text()) or {}).get("externals") or {}
          if not ext:
              sys.exit("REFUSE: rivet.yaml declares NO externals — a zero population "
                       "here would make this step succeed while syncing nothing, and "
                       "the report would be generated against an unresolved graph.")
          root = pathlib.Path(".rivet/repos")
          root.mkdir(parents=True, exist_ok=True)

          def resolved(dest):
              """A directory EXISTING is not a synced external.

              The first version of this step tested `dest.exists()`, so an EMPTY
              `.rivet/repos/<prefix>` counted as synced. v0.82's cold review
              demonstrated it: two empty dirs printed `synced 2 of 2`, rc=0 — the
              exact condition this step exists to refuse. A real clone carries a
              git dir AND at least one artifact-bearing file.
              """
              return (dest / ".git").exists() and any(dest.rglob("*.yaml"))

          for name, cfg in sorted(ext.items()):
              dest = root / (cfg.get("prefix") or name)
              if resolved(dest):
                  continue
              if dest.exists():
                  # present but unresolved: `git clone` would fail "already exists",
                  # so the stale tree is removed rather than silently accepted.
                  shutil.rmtree(dest)
              r = subprocess.run(["git", "clone", "--depth", "1", "--branch",
                                  cfg.get("ref") or "main", cfg["git"], str(dest)],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit(f"REFUSE: clone of {name} failed rc={r.returncode}: "
                           f"{r.stderr.strip()[-400:]}")

          # NON-VACUITY, RE-DERIVED FROM THE FILESYSTEM rather than counted by the
          # loop above. The original compared `len(cloned)` against `len(ext)` where
          # `cloned` was appended to by that same loop — a counter the loop
          # increments can only ever EQUAL the population, so the check was
          # unreachable by construction. Reading the tree back gives the check a
          # source independent of the thing it checks.
          missing = sorted(n for n, c in ext.items()
                           if not resolved(root / (c.get("prefix") or n)))
          got = len(ext) - len(missing)
          if missing:
              sys.exit(f"REFUSE: {got} of {len(ext)} externals RESOLVED; "
                       f"UNRESOLVED: {', '.join(missing)}")
          print(f"synced {got} of {len(ext)} externals: "
                f"{', '.join(sorted(ext))}")
          PYEOF

      - name: Generate compliance report
        id: report
        uses: pulseengine/rivet/.github/actions/compliance@v0.40.0
        with:
          theme: dark
          rivet-version: v0.37.0
          include-data-formats: true
          report-label: ${{ steps.tag.outputs.tag }}
          archive: 'true'
          archive-name: synth-${{ steps.tag.outputs.tag }}-compliance-report

      - name: Upload report to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_PATH: ${{ steps.report.outputs.archive-path }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${ARCHIVE_PATH:-}" ] || [ ! -f "$ARCHIVE_PATH" ]; then
            echo "::error::compliance action produced no archive-path"; exit 1
          fi
          gh release upload "$TAG" "$ARCHIVE_PATH" --clobber
          echo "::notice title=Compliance report::uploaded $(basename "$ARCHIVE_PATH")"
