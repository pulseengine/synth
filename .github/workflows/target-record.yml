# The target record: synth's half of North Star O1 (RQ-91-TARGETRECORD,
# Refs #1741; consumer seam pulseengine.eu#393).
#
# Its own workflow file, not a ci.yml job: ci.yml sits at GitHub's ~512 KB
# workflow-file limit (a 514,837-byte ci.yml was rejected with 0 jobs, run
# 44505673142).
#
# ONE command (`target-record`, a Rust binary in crates/synth-oracle) writes
# `north-star-input.O1.json`, validated against pulseengine.eu's
# `data/north-star/input.schema.json` (vendored byte-identically in
# crates/synth-oracle/schema/, sha256 pinned by a unit test), and this job
# uploads it as a workflow artifact. Every number in it is executed in this
# run: reach over the pinned spec testsuite, execution_match of the probe set
# on the linked self-contained image under the target's unicorn CPU model
# against kiln, and the --emit-wcet sidecar cross-checked against executed
# instruction counts. hardware_run is always ran=false: synth runs no silicon.
#
# RELEASE ATTACHMENT IS NOT WIRED HERE, deliberately: release.yml is an
# owner-gated pipeline. How it would be wired is recorded in
# artifacts/release-v0.91/RQ-91-TARGETRECORD.yaml (a job on the tag ref that
# runs this same command and uploads the file, and one `find ... -exec cp`
# line in "Flatten release assets", so the file lands in SHA256SUMS.txt BEFORE
# cosign signs it). `wsc verify-chain` is NOT used as a gate anywhere
# (sigil#395: it passes a one-bit-flipped component).
#
# The schedule regenerates the record on main for each monthly North Star
# layer; a layer with no new release carries the last tag's version with a
# new generated_at.
#
# NOT a required context, so it can be added and renamed freely.

name: Target record (O1)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  target-record:
    name: Target record — north-star-input.O1.json (RQ-91-TARGETRECORD)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    # Builds as oracle-kiln does (~5 min), then 4 x 257 corpus compiles and
    # 2 x 3024 executed vectors plus the controls. Measured locally on an
    # M-series Mac: see the artifact's verified-by. 40 min is a generous
    # ceiling for the pool, not a measurement of it.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Load-bearing: reach's corpus is the spec testsuite submodule.
          # An empty checkout makes reach ran=false, never a passing row.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          # Its own key (two jobs saving one key race); restores from
          # oracle-kiln's, which builds the same unicorn and kiln.
          key: ${{ runner.os }}-target-record-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-record-
            ${{ runner.os }}-oracle-kiln-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      # The same unicorn build tools as oracle-kiln.yml (cmake, ninja,
      # libclang from pip wheels; bindgen pointed at gcc's include dir).
      - name: Install unicorn's build tools (cmake, ninja, libclang)
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || pip install cmake || pip install --break-system-packages cmake
          command -v ninja >/dev/null || command -v make >/dev/null || pip install ninja || pip install --break-system-packages ninja
          pip install libclang || pip install --break-system-packages libclang
          loc=$(pip show libclang | sed -n 's/^Location: //p')
          lib=$(find "$loc/clang/native" -name 'libclang*.so*' | head -n 1)
          test -n "$lib"
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          gccinc=$(gcc -print-file-name=include)
          test -f "$gccinc/stdarg.h"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$gccinc" >> "$GITHUB_ENV"
      - name: Build synth (riscv is a default feature; rv32imc reach needs it)
        run: cargo build -p synth-cli
      - name: Generate north-star-input.O1.json
        run: |
          set -euo pipefail
          SYNTH="$PWD/target/debug/synth" cargo run -q -p synth-oracle --features exec \
            --bin target-record -- --out north-star-input.O1.json \
            --require-pass cortex-m4/execution_match \
            --require-pass cortex-m7dp/execution_match \
            --require-pass cortex-m4/wcet \
            2>&1 | tee "$RUNNER_TEMP/target-record.log"
          # NON-VACUITY, exact: every target's four facts are present, the
          # record validated, and the zero-vector rule held where nothing ran.
          test "$(grep -c '^FACT ' "$RUNNER_TEMP/target-record.log")" = 16
          grep -qx 'RECORD north-star-input.O1.json schema-valid, 16 facts' "$RUNNER_TEMP/target-record.log"
          grep -qx 'FACT cortex-m4/execution_match: ran=true pass=true control_red=true' "$RUNNER_TEMP/target-record.log"
          grep -qx 'FACT cortex-m7dp/execution_match: ran=true pass=true control_red=true' "$RUNNER_TEMP/target-record.log"
          grep -qx 'FACT cortex-m4/hardware_run: ran=false pass=false control_red=false' "$RUNNER_TEMP/target-record.log"
          grep -qx 'FACT cortex-m0plus/execution_match: ran=false pass=false control_red=false' "$RUNNER_TEMP/target-record.log"
      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: north-star-input.O1
          path: north-star-input.O1.json
          if-no-files-found: error
