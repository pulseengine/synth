# Rust execution oracle on kiln (RQ-91-ORACLEKILN, Refs #1741).
#
# Its own workflow file, not a ci.yml job: ci.yml sits at about 511 KB, and a
# branch that grew it to 514,837 bytes made GitHub reject the whole file
# ("workflow file issue", 0 jobs, run 44505673142) while 511,836 bytes still
# ran. New oracle jobs belong in their own workflow files.

name: Oracle (kiln)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  oracle-kiln:
    name: Rust execution oracle — kiln reference vs unicorn (RQ-91-ORACLEKILN)
    # Refs #1741. The FIRST oracle on `crates/synth-oracle`, the Rust harness
    # that replaces the Python differentials (no new Python, 2026-11-18). The
    # reference engine is kiln (PulseEngine's interpreter, git dep pinned by
    # rev to tag v0.7.3), not wasmtime. The engines sit behind the crate's
    # `exec` feature so `cargo test --workspace` (the required Test job) never
    # builds them: unicorn is a cmake + bindgen C build. This job is the only
    # place they are built, linted and run.
    #
    # The test compiles an embedded probe set for cortex-m3 AND rv32imac,
    # requires every probe x vector to AGREE with kiln, and carries four
    # potency legs that must stay red-capable: a planted wrong reference, a
    # planted illegal instruction, a dropped i64 high word, and a budget
    # overrun that must never count as a trap.
    #
    # NOT a required context, so it can be added and renamed freely.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    # MEASURED, not guessed. The first run on the pool (run 44587233237,
    # runner pulseengine-ci-01-11) built in about 4 minutes (synth 1m06s,
    # clippy 1m12s, the test build 1m41s) and then spent 28 minutes on ONE
    # sweep leg: kiln re-converted the module for every case
    # (Module::from_kiln_module, ~12 ms in an aarch64 Linux VM, ~470 ms per
    # case on the runner) and unicorn was a Debug C build. With the converted
    # module cached and unicorn built optimized, the whole test takes 4.3 s on
    # an M-series Mac and 14-20 s in a 4-CPU Linux VM. Allowance: ~5 min of
    # builds plus the test at 20x the VM time (~7 min) is ~12 min; 25 is
    # about 2x that.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-oracle-kiln-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-oracle-kiln-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      # unicorn-engine-sys builds unicorn with cmake and ALWAYS generates its
      # bindings with bindgen, which loads libclang. This is the first job to
      # compile C on the smithy pool, which has no sudo, so cmake, ninja and
      # libclang come from pip wheels and LIBCLANG_PATH points bindgen at the
      # wheel's copy. The libclang wheel carries NO headers, and unicorn.h
      # includes the compiler's <stdarg.h>/<stdbool.h>, so bindgen is pointed
      # at gcc's own include directory (REVIEW_11 F6). PROVEN on the pool by
      # its first run (run 44587233237): unicorn and kiln built.
      - name: Install unicorn's build tools (cmake, ninja, libclang)
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || pip install cmake || pip install --break-system-packages cmake
          command -v ninja >/dev/null || command -v make >/dev/null || pip install ninja || pip install --break-system-packages ninja
          pip install libclang || pip install --break-system-packages libclang
          loc=$(pip show libclang | sed -n 's/^Location: //p')
          lib=$(find "$loc/clang/native" -name 'libclang*.so*' | head -n 1)
          test -n "$lib"
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          gccinc=$(gcc -print-file-name=include)
          test -f "$gccinc/stdarg.h"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$gccinc" >> "$GITHUB_ENV"
          cmake --version
      - name: Build synth
        run: cargo build -p synth-cli
      - name: Clippy (synth-oracle with the engines)
        run: cargo clippy -p synth-oracle --features exec --all-targets -- -D warnings
      - name: kiln probe oracle (cortex-m3 + rv32imac, with potency legs) + #1450 control
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/oracle-kiln.log"
          SYNTH="$PWD/target/debug/synth" cargo test -p synth-oracle --features exec \
            -- --nocapture 2>&1 | tee "$log"
          # NON-VACUITY, EXACT: the artifact's counts (RQ-91-ORACLEKILN). A
          # shrunk probe set or vector list reds here as well as in the test.
          grep -qx 'ORACLE kiln-probe: 6048 cases agree across 2 legs, 72 trap/trap' "$log"
          grep -qx 'stress: 32000 concurrent runs of add(2,3), 0 not Values(5)' "$log"
          # Exact per binary (RQ-91-TARGETRECORD): 15 kiln_probe_oracle.rs;
          # 20 the lib's unit tests (8 before the target record added the
          # record and cycles modules); 3 tests/target_record.rs (the binary
          # end to end, refusals, the boot contract); 1 the target-record
          # binary's own unit test.
          grep -qE '^test result: ok\. 15 passed; 0 failed' "$log"
          grep -qE '^test result: ok\. 20 passed; 0 failed' "$log"
          grep -qE '^test result: ok\. 3 passed; 0 failed' "$log"
          grep -qE '^test result: ok\. 1 passed; 0 failed' "$log"
          # Refs #1754 (tests/select_home_alias_1754.rs): select must not
          # overwrite a register still on the operand stack. Four
          # direct-selector legs and the optimized-path control, plus the
          # routing witness and the frozen pre-fix bytes that must stay red.
          grep -qx 'ORACLE select-1754: 880 cases agree across 5 legs' "$log"
          grep -qE '^test result: ok\. 3 passed; 0 failed' "$log"
          # #1745: the LIBRARY entry point, `Backend::compile_module`, on all
          # three backends (no `synth` binary is involved), the paired
          # `compile_function` control, and the AArch64 runner's guards.
          grep -qx 'ORACLE 1745 a64 compile_module: 54 of 54 cases agree' "$log"
          grep -qx 'ORACLE 1745 a64 compile_function (control): 54 of 54 cases agree' "$log"
          grep -qx 'ORACLE 1745 a64 stale caller config: 27 of 27 cases agree' "$log"
          grep -qx 'ORACLE 1745 arm compile_module: 135 of 135 cases agree' "$log"
          grep -qx 'ORACLE 1745 arm vfp compile_module: 15 of 15 cases agree' "$log"
          grep -qx 'ORACLE 1745 rv32 compile_module: 30 of 30 cases agree, 4 refused' "$log"
          grep -qE '^test result: ok\. 13 passed; 0 failed' "$log"
          # #1450: the multi-result refusal's EXECUTED control. The single-
          # result twins of the refused export agree with kiln on cortex-m4
          # and rv32imac, and the refusal itself is seen on both.
          grep -qx 'ORACLE multi-result-1450: 56 single-result control cases agree across 2 legs' "$log"
          grep -qE '^test result: ok\. 3 passed; 0 failed' "$log"
