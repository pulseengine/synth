# Rust execution oracle on kiln (RQ-91-ORACLEKILN, Refs #1741).
#
# Its own workflow file, not a ci.yml job: ci.yml sits at about 511 KB, and a
# branch that grew it to 514,837 bytes made GitHub reject the whole file
# ("workflow file issue", 0 jobs, run 44505673142) while 511,836 bytes still
# ran. New oracle jobs belong in their own workflow files.

name: Oracle (kiln)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  oracle-kiln:
    name: Rust execution oracle — kiln reference vs unicorn (RQ-91-ORACLEKILN)
    # Refs #1741. The FIRST oracle on `crates/synth-oracle`, the Rust harness
    # that replaces the Python differentials (no new Python, 2026-11-18). The
    # reference engine is kiln (PulseEngine's interpreter, git dep pinned by
    # rev to tag v0.7.3), not wasmtime. The engines sit behind the crate's
    # `exec` feature so `cargo test --workspace` (the required Test job) never
    # builds them: unicorn is a cmake + bindgen C build. This job is the only
    # place they are built, linted and run.
    #
    # The test compiles an embedded probe set for cortex-m3 AND rv32imac,
    # requires every probe x vector to AGREE with kiln, and carries four
    # potency legs that must stay red-capable: a planted wrong reference, a
    # planted illegal instruction, a dropped i64 high word, and a budget
    # overrun that must never count as a trap.
    #
    # NOT a required context, so it can be added and renamed freely.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    # MEASURED, not guessed. The first run on the pool (run 44587233237,
    # runner rust-cpu-runner-11) built in about 4 minutes (synth 1m06s,
    # clippy 1m12s, the test build 1m41s) and then spent 28 minutes on ONE
    # sweep leg: kiln re-converted the module for every case
    # (Module::from_kiln_module, ~12 ms in an aarch64 Linux VM, ~470 ms per
    # case on the runner) and unicorn was a Debug C build. With the converted
    # module cached and unicorn built optimized, the whole test takes 4.3 s on
    # an M-series Mac and 14-20 s in a 4-CPU Linux VM. Allowance: ~5 min of
    # builds plus the test at 20x the VM time (~7 min) is ~12 min; 25 is
    # about 2x that.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch)
        with:
          components: clippy
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-oracle-kiln-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-oracle-kiln-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      # unicorn-engine-sys builds unicorn with cmake and ALWAYS generates its
      # bindings with bindgen, which loads libclang. This is the first job to
      # compile C on the smithy pool, which has no sudo, so cmake, ninja and
      # libclang come from pip wheels and LIBCLANG_PATH points bindgen at the
      # wheel's copy. The libclang wheel carries NO headers, and unicorn.h
      # includes the compiler's <stdarg.h>/<stdbool.h>, so bindgen is pointed
      # at gcc's own include directory (REVIEW_11 F6). PROVEN on the pool by
      # its first run (run 44587233237): unicorn and kiln built.
      - name: Install unicorn's build tools (cmake, ninja, libclang)
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || pip install cmake || pip install --break-system-packages cmake
          command -v ninja >/dev/null || command -v make >/dev/null || pip install ninja || pip install --break-system-packages ninja
          pip install libclang || pip install --break-system-packages libclang
          loc=$(pip show libclang | sed -n 's/^Location: //p')
          lib=$(find "$loc/clang/native" -name 'libclang*.so*' | head -n 1)
          test -n "$lib"
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          gccinc=$(gcc -print-file-name=include)
          test -f "$gccinc/stdarg.h"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$gccinc" >> "$GITHUB_ENV"
          cmake --version
      - name: Build synth
        run: cargo build -p synth-cli
      - name: Clippy (synth-oracle with the engines)
        run: cargo clippy -p synth-oracle --features exec --all-targets -- -D warnings
      - name: kiln oracles (probe sweep; import call boundary; potency legs) + #1450 control
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/oracle-kiln.log"
          SYNTH="$PWD/target/debug/synth" cargo test -p synth-oracle --features exec \
            -- --nocapture 2>&1 | tee "$log"
          # NON-VACUITY, EXACT: the artifact's counts (RQ-91-ORACLEKILN). A
          # shrunk probe set or vector list reds here as well as in the test.
          grep -qx 'ORACLE kiln-probe: 6048 cases agree across 2 legs, 72 trap/trap' "$log"
          grep -qx 'stress: 32000 concurrent runs of add(2,3), 0 not Values(5)' "$log"
          # Exact per binary (RQ-91-TARGETRECORD): 15 kiln_probe_oracle.rs;
          # 24 the lib's unit tests (8 at the base; +12 the target record's
          # record and cycles modules; +4 v0.92 batch 1's hosted/synth/value
          # units — 20 on main, 12 on the batch branch, 24 measured on the
          # rebased tree); 3 tests/target_record.rs (the binary end to end,
          # refusals, the boot contract); 1 the target-record binary's own
          # unit test.
          grep -qE '^test result: ok\. 15 passed; 0 failed' "$log"
          grep -qE '^test result: ok\. 24 passed; 0 failed' "$log"
          grep -qE '^test result: ok\. 3 passed; 0 failed' "$log"
          grep -qE '^test result: ok\. 1 passed; 0 failed' "$log"
          # Refs #1754 (tests/select_home_alias_1754.rs): select must not
          # overwrite a register still on the operand stack. Four
          # direct-selector legs and the optimized-path control, plus the
          # routing witness and the frozen pre-fix bytes that must stay red.
          grep -qx 'ORACLE select-1754: 880 cases agree across 5 legs' "$log"
          grep -qE '^test result: ok\. 3 passed; 0 failed' "$log"
          # #1745: the LIBRARY entry point, `Backend::compile_module`, on all
          # three backends (no `synth` binary is involved), the paired
          # `compile_function` control, and the AArch64 runner's guards.
          grep -qx 'ORACLE 1745 a64 compile_module: 54 of 54 cases agree' "$log"
          grep -qx 'ORACLE 1745 a64 compile_function (control): 54 of 54 cases agree' "$log"
          grep -qx 'ORACLE 1745 a64 stale caller config: 27 of 27 cases agree' "$log"
          grep -qx 'ORACLE 1745 arm compile_module: 135 of 135 cases agree' "$log"
          grep -qx 'ORACLE 1745 arm vfp compile_module: 15 of 15 cases agree' "$log"
          grep -qx 'ORACLE 1745 rv32 compile_module: 39 of 39 cases agree, 2 refused' "$log"
          grep -qE '^test result: ok\. 13 passed; 0 failed' "$log"
          # #1450: the multi-result refusal's EXECUTED control. The single-
          # result twins of the refused export agree with kiln on cortex-m4
          # and rv32imac, and the refusal itself is seen on both.
          grep -qx 'ORACLE multi-result-1450: 56 single-result control cases agree across 2 legs' "$log"
          grep -qE '^test result: ok\. 3 passed; 0 failed' "$log"
          # The import call boundary (Refs #1696, #1755, #1699, #1758):
          # DEFAULT-flags objects of import-carrying modules for cortex-m4,
          # cortex-m3 and cortex-m7dp, linked against clobbering host stubs
          # and executed against kiln. EXACT counts, so a leg or a step that
          # silently drops reds here as well as in the test.
          grep -qx 'ORACLE import-boundary #1696: 60 steps agree across 3 legs, 60 host calls matched' "$log"
          grep -qx 'ORACLE import-boundary #1755: 63 steps agree across 3 legs, 78 host calls matched' "$log"
          grep -qx 'ORACLE import-boundary #1699: 33 steps agree across 3 legs, 33 host calls matched' "$log"
          grep -qx 'ORACLE import-boundary #1758: 60 steps agree across 3 legs x 2 embedders, 6 host calls matched' "$log"
          grep -qx 'ORACLE import-boundary control: 186 steps agree across 3 --relocatable legs, 174 host calls matched' "$log"
          grep -qx 'ORACLE import-boundary structural: 12 default-flags objects are byte-identical to --relocatable' "$log"
          grep -qE '^test result: ok\. 13 passed; 0 failed' "$log"
          # v0.92 batch 1: two test binaries report 13 (compile_module_1745,
          # import_boundary_oracle) and five report 3 (select_home_alias_1754,
          # multi_result_export_1450_oracle, target_record, kiln_no_shared_state,
          # zero_init_wide_local_1762), and one matching line satisfies
          # `grep -q`. Pin how many result lines carry each count.
          test "$(grep -cE '^test result: ok\. 13 passed; 0 failed' "$log")" = 2
          test "$(grep -cE '^test result: ok\. 3 passed; 0 failed' "$log")" = 5
          # No kiln state crosses reference runs (memory, globals, tables).
          grep -qx 'test memory_does_not_cross_calls ... ok' "$log"
          grep -qx 'test globals_do_not_cross_calls ... ok' "$log"
          grep -qx 'test tables_do_not_cross_calls ... ok' "$log"
          # v0.92 batch 2, Refs #1762 (tests/zero_init_wide_local_1762.rs): a
          # never-written i64 local is 64 bits wide on RV32 by its
          # declaration. 15 shapes x 4 vectors on rv32imac and on four ARM
          # twin legs; the f64 twin is pinned byte-identical to the executed
          # i64 one; the frozen pre-fix bytes must stay judged wrong. Its
          # result line is one of the five "3 passed" above. The same fix turned
          # three rows of the #1745 RV32 leg from refused or skipped into
          # executed (30 of 30 with 4 refused became 39 of 39 with 2).
          grep -qx 'ORACLE zero-init-1762: 300 cases agree across 5 legs' "$log"
          grep -qx 'ORACLE zero-init-1762 \[rv32imac\]: 0 of 60 wrong; wrong values: \[\]; refused: \[\]' "$log"
          grep -qx 'ORACLE zero-init-1762 rv32 float twins: 2 of 2 byte-identical to the integer twin' "$log"
          # v0.92 batch 2, Refs #1763 (tests/float_local_file_1763.rs): on
          # AArch64 a float local is read and written in the FP register
          # file, so a function returning one writes v0. 25 shapes on
          # cortex-a53 (float parameters included), the 19 and 8 of them
          # that take integer parameters on the cortex-m7dp and cortex-m4f
          # twin legs; a float local as a call argument must be REFUSED; the
          # frozen pre-fix words must stay judged wrong; six exports of the
          # spec suite that the fix makes compile (local_get, local_set,
          # local_tee) run with the suite's own arguments. The only test
          # binary that reports 4 passed.
          grep -qx 'ORACLE float-local-1763: 202 cases agree across 3 legs' "$log"
          grep -qx 'ORACLE float-local-1763 a64 spec exports: 6 of 6 cases agree' "$log"
          test "$(grep -cE '^test result: ok\. 4 passed; 0 failed' "$log")" = 1
          grep -qx 'ORACLE float-local-1763 \[a64\]: 0 of 94 wrong; wrong values: \[\]; refused: \[\]' "$log"
          grep -qx 'ORACLE float-local-1763 a64 call argument: refused (argument 0 is a float)' "$log"
          # v0.92 batch 2, Refs #1761 (tests/wast_merge_call_binding_1761.rs):
          # on a multi-module .wast a call binds within its own module. Five
          # fixtures: 7 steps each, linked and EXECUTED on cortex-m4 and
          # cortex-m3 --relocatable and (the four that call an import) on
          # cortex-m4 default flags, against kiln running one module with the
          # same functions; every call relocation of every ARM and RV32
          # object read back from the relocation and symbol tables; AArch64
          # must REFUSE the four fixtures with an import call and bind the
          # fifth. The only test binary that reports 5 passed.
          grep -qx 'ORACLE wast-merge-1761 execution: 98 steps agree across 14 objects, 48 host calls matched' "$log"
          grep -qx 'ORACLE wast-merge-1761 structure: 47 call sites bound to their own module across 20 objects' "$log"
          grep -qx 'ORACLE wast-merge-1761 a64: 4 fixtures with an import call refused, 1 call site bound in the fixture without one' "$log"
          grep -qx 'ORACLE wast-merge-1761 control: 28 steps agree and 5 import call sites are bound on single-module input' "$log"
          test "$(grep -cE '^test result: ok\. 5 passed; 0 failed' "$log")" = 1
          # RQ-91-M0I32 (#1301): the ARMv6-M i32 lowering on the Cortex-M0 model.
          grep -qx 'ORACLE armv6m-i32: 104 of 104 probes accepted, 20 of 20 decline probes declined, on 2 targets' "$log"
          grep -qx 'ORACLE armv6m-i32: 18980 cases agree on the Cortex-M0 model, 18938 value comparisons, 21 trap/trap' "$log"
          grep -qE '^test result: ok\. 7 passed; 0 failed' "$log"
          grep -qx 'KNOWN #1754 k1754_b1: 75 of 216 vectors wrong' "$log"
          grep -qx 'KNOWN #1754 k1754_b1b: 150 of 216 vectors wrong' "$log"
