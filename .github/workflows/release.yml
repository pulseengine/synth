name: Release

# Release variant: serialize per-tag, never cancel. A cancelled release
# mid-publish leaves the GitHub Release page, build attestations, and
# per-target binary archives in an inconsistent state — better to queue
# than abort. Mirrors the pulseengine/rivet and pulseengine/witness
# release workflows.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag whose initial run failed partway. The tag
  # must already exist; this does not create tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. v0.3.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Cross-platform binary builds ──────────────────────────────────────
  # synth-cli builds with the workspace default (`riscv`) PLUS `verify`
  # (#1000, RQ-58-SHIPVERIFY): every released tarball can run `synth verify`
  # to a real verdict. Historically `verify` pulled z3-sys (vendored C++ Z3
  # build — slow, network-hungry); since #553 it is pure Rust (ordeal
  # engine, re-measured for v0.58: `cargo tree -p synth-cli --features
  # verify` has 0 z3 nodes — Z3 remains a separate `synth-verify/z3-solver`
  # opt-in that never ships here). The smoke step below is the non-vacuity
  # gate: it extracts the just-packaged tarball and asserts `synth verify`
  # reaches a verdict, so dropping this feature flag reds the release run
  # instead of silently regressing the artifact to help-text-only
  # (the 0.55.0/0.57.0 state issue #1000 reported).
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # RQ-71-MUSL (#1349). The gnu assets above are built on ubuntu-latest
          # and carry a GLIBC_2.39 floor — MEASURED on the published v0.70.0
          # x86_64 asset: `ELF 64-bit LSB pie executable, dynamically linked,
          # interpreter /lib64/ld-linux-x86-64.so.2`, max GLIBC_ symbol
          # GLIBC_2.39. That excludes Ubuntu 22.04 (2.35), Debian 12 (2.36),
          # RHEL 9 and Amazon Linux 2023 (2.34), Ubuntu 20.04 (2.31), and
          # Alpine/distroless-static entirely. These binaries are ingested into
          # the varve `pulseengine` realm's rolling layer, and a layer's
          # portability is the MAXIMUM floor across its payloads, so one 2.39
          # payload sets the floor for everything pinned beside it.
          #
          # This target is ADDITIVE on purpose: the gnu assets keep their
          # names, their consumers and their attestation path unchanged, and
          # the static musl build is published ALONGSIDE as the portable
          # payload. Statically linked, so it has no loader and no glibc floor
          # at all rather than a lower one. `--features verify` is pure Rust
          # here (no build.rs, no build-dependencies anywhere in the
          # workspace), which is why this needs no cross container.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          # RQ-72-ARM64MUSL (#1349), the SECOND triple the issue names by name.
          # v0.71 shipped only the x86_64 one, so the arm64 payload still set
          # the varve layer's portability floor that the x86_64 one no longer
          # did — arm64 Alpine and distroless-static were unserved.
          #
          # `os: ubuntu-24.04-arm` is a NATIVE arm64-Linux runner, so this is
          # not a cross entry: `musl-tools` supplies an aarch64 musl-gcc, the
          # build needs no RUSTFLAGS and no cross container, and the smoke test
          # below EXECUTES the tarball directly with no emulator and no
          # sysroot. That is why `cross:` is deliberately absent here.
          #
          # The alternative — cross-building from x86_64 with
          # `-C linker=rust-lld -C link-self-contained=yes` — was MEASURED to
          # work (ci.yml `arm64-musl-portable-asset`, link successful in 199 s
          # with no cross-gcc present) and deliberately NOT taken: it would
          # ship a link that no CI job proves under the flags release.yml
          # actually uses, and it can only be smoke-tested through an
          # emulator. The native entry is proven end-to-end by
          # `arm64-musl-native-execution`, which runs the same host class, the
          # same packages and the same command as this entry.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            musl: true
          # x86_64-apple-darwin cross-compiles on the arm64 macos-14
          # runner — matches pulseengine/rivet and pulseengine/witness
          # (both Rust-workspace CLIs, the closest analogs to synth).
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # RQ-71-MUSL (#1349): `musl-tools` supplies `musl-gcc`, the linker driver
      # rustc invokes for this target. The workspace has no C dependencies and
      # no build.rs, but the target's own libc.a still links through it.
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build synth (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p synth-cli --features verify

      - name: Build synth (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p synth-cli --features verify

      # RQ-71-MUSL (#1349): the ISSUE'S OWN two acceptance commands, executed
      # on the artifact this job just built, BEFORE it is packaged. A portable
      # asset that is silently dynamic, or that picked up a glibc symbol, must
      # redden the release rather than ship and be discovered by a consumer —
      # which is exactly how the 2.39 floor was found in the first place. Run
      # before `strip`, because stripping is what would hide the symbols.
      # RQ-71-MUSL (#1349): the ISSUE'S acceptance property, on the artifact
      # this job just built, BEFORE it is packaged — and read from the ELF
      # rather than from `file`'s wording.
      #
      # CORRECTED after the v0.71 cold review, and this one mattered: the first
      # version grepped `file` for "statically linked", which rustc's musl
      # target NEVER produces (its spec sets crt-static-default AND
      # static-position-independent-executables, so the link is `-static-pie`
      # and `file` reports "static-pie linked"). The gate would have refused a
      # CORRECT artifact — and `create-release` has `needs: [build-binaries]`,
      # so that is not one missing archive, it is NO RELEASE AT ALL. A gate
      # that cannot pass, in the workflow that publishes the release.
      #
      # Runs before `strip`, because stripping is what would hide the symbols.
      - name: Verify the musl asset has no loader and no glibc floor
        if: matrix.musl
        run: python3 scripts/elf_static_check.py "target/${{ matrix.target }}/release/synth"

      - name: Strip binary
        if: ${{ !matrix.cross }}
        run: strip "target/${{ matrix.target }}/release/synth" 2>/dev/null || true

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          # Resolve the version once: tag push -> refs/tags/vX.Y.Z;
          # workflow_dispatch -> the user-supplied tag input. Bound via
          # env: and dereferenced as $VERSION below — never expand
          # ${{ ... }} directly inside run: (command-injection vector).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE="synth-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/synth" staging/
          cp README.md LICENSE staging/ 2>/dev/null || true
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      # ── #1000 non-vacuity gate: the TARBALL can `synth verify` ──────────
      # Extracts the archive packaged above (the artifact a user downloads,
      # not the loose build output) and asserts `synth verify` runs to a
      # REAL verdict on a module the same binary just compiled — exit 0,
      # the verdict line, and a synth-verify-v1 report with >= 1 verified /
      # 0 failed rule kinds. Red direction proven at authoring and re-proven
      # on every push by the fact-spec-oracle CI job's red leg: against a
      # binary built without `--features verify` the script fails with the
      # capability error. Without this step, "we ship the feature" regresses
      # silently to "we ship the help text" — the exact #1000 class.
      #
      # Execution per target, re-derived when the arm64 musl entry landed
      # rather than carried: linux-x86_64-gnu, linux-x86_64-musl,
      # linux-aarch64-MUSL and both macOS tarballs run NATIVELY
      # (x86_64-apple-darwin under Rosetta 2 on the arm64 macos-14 runner,
      # aarch64-linux-musl on the arm64 runner its matrix entry names); only
      # the cross-built aarch64-linux-GNU tarball needs qemu-user, against
      # the gcc-aarch64-linux-gnu sysroot its glibc link requires. All SIX
      # tarballs are EXECUTED, none is exempt — and the arm64 pair is the
      # contrast worth reading: same architecture, and the musl one needs no
      # emulator and no sysroot to be run.
      - name: Install qemu-user + aarch64 sysroot (cross smoke)
        if: matrix.cross
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu

      - name: Smoke-test the packaged tarball runs `synth verify`
        env:
          SYNTH_RUNNER: ${{ matrix.cross && 'qemu-aarch64 -L /usr/aarch64-linux-gnu' || '' }}
        run: |
          set -euo pipefail
          mkdir -p smoke-extract
          tar -xzf "$ARCHIVE" -C smoke-extract
          bash scripts/release_verify_smoke.sh smoke-extract/synth

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # ── Create the GitHub Release: checksums, provenance, signing ─────────
  create-release:
    name: Create GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      # Keyless signing + provenance need an OIDC token; release-asset
      # upload needs contents: write; build provenance attestation
      # needs attestations: write. This block mirrors the permissions
      # set used by the pulseengine/sigil release workflow.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -la release-assets/

      # Phase 6: CycloneDX SBOM for the synth toolchain itself. The
      # SBOM is generated *before* SHA256SUMS so its digest is captured
      # in the checksum manifest; the existing cosign signature over
      # SHA256SUMS.txt transitively covers the SBOM. See docs/sbom.md
      # for the distinction between this and `synth compile --sbom`.
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate toolchain SBOM (CycloneDX)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          # cargo-cyclonedx doesn't proxy cargo's `-p` package-selection flag
          # (caught the hard way on the first v0.6.0 release attempt). Use
          # `--manifest-path` to target synth-cli's Cargo.toml directly; the
          # generated SBOM lands next to that Cargo.toml.
          cargo cyclonedx \
            --manifest-path crates/synth-cli/Cargo.toml \
            --format json \
            --spec-version 1.5
          SBOM_SRC="crates/synth-cli/synth-cli.cdx.json"
          if [ ! -f "$SBOM_SRC" ]; then
            SBOM_SRC=$(find crates/synth-cli -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
          cp "$SBOM_SRC" "release-assets/synth-${BARE}.cdx.json"
          echo "::notice::Toolchain SBOM written to release-assets/synth-${BARE}.cdx.json"
          ls -la release-assets/

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── SLSA build provenance (GitHub-native) ──────────────────────────
      # actions/attest-build-provenance generates an in-toto SLSA v1
      # provenance statement for every binary archive, signs it keyless
      # via Sigstore (Fulcio cert bound to this workflow's OIDC identity),
      # and records it in the Rekor transparency log. Consumers verify
      # with `gh attestation verify <file> --repo pulseengine/synth`.
      # GitHub-native attestation (not the standalone SLSA generator)
      # keeps the workflow self-contained — see docs/release-process.md.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-assets/*.tar.gz"

      # ── Sigstore keyless signing (cosign) ──────────────────────────────
      # Signs SHA256SUMS.txt so a consumer can verify the checksum file
      # itself was produced by this workflow (closes the gap where an
      # attacker who can replace a release asset could also replace the
      # plain checksum file). Mirrors the pulseengine/witness and
      # pulseengine/rivet cosign sign-blob pattern. The .cosign.bundle is
      # the verifier-friendly artifact; .sig + .pem are the detached
      # signature and Fulcio certificate. Verify with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp \
      #       'https://github.com/pulseengine/synth/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer \
      #       'https://token.actions.githubusercontent.com' \
      #     --bundle SHA256SUMS.txt.cosign.bundle \
      #     SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via Sigstore keyless flow."
          ls -la ./*

      - name: Capture build environment
        run: |
          set -euo pipefail
          {
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cosign: $(cosign version 2>&1 | head -1)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt
          cat release-assets/build-env.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted-input safety: the tag name flows in via env: and is
          # dereferenced through $VERSION, never expanded into the shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          # Idempotent: re-running the workflow for an existing release
          # uploads/overwrites assets rather than failing. --clobber lets
          # a re-run replace assets a previous partial run left behind.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION exists; uploading assets"
            gh release upload "$VERSION" --clobber release-assets/*
          else
            echo "::notice::Creating Release $VERSION with assets"
            gh release create "$VERSION" \
              --title "synth $VERSION" \
              --generate-notes \
              release-assets/*
          fi
