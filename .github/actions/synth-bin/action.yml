# Takes the `synth-bin` artifact built once per run by
# ./.github/actions/synth-bin-build and installs it at target/debug/synth,
# where every oracle script already looks. The job must `needs: build-synth`
# and must have checked the repository out first.
#
# VERIFY, THEN USE — AND NEVER REBUILD. Each fingerprint field is compared with
# what THIS job can see for itself: the commit against both GITHUB_SHA and the
# checked-out HEAD, the Cargo.lock digest against the checked-out Cargo.lock,
# profile and features against what this job asks for, and the binary's sha256
# against the bytes that arrived. Any mismatch fails the job. There is no
# fallback build: a job that quietly rebuilt would report green about a binary
# the fingerprint does not describe.
name: Use the shared synth binary
description: Download `synth-bin`, verify its build fingerprint, install target/debug/synth
inputs:
  profile:
    description: The cargo profile this job's evidence is about
    default: dev
  features:
    description: The synth-cli feature set this job's evidence is about
    default: default
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: synth-bin
        path: ${{ runner.temp }}/synth-bin
    - name: Verify the build fingerprint and install target/debug/synth
      shell: bash
      env:
        WANT_PROFILE: ${{ inputs.profile }}
        WANT_FEATURES: ${{ inputs.features }}
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/synth-bin"
        fp="$d/FINGERPRINT"
        test -s "$fp" || { echo "::error::synth-bin carries no FINGERPRINT; refusing an unidentified binary"; exit 1; }
        test -s "$d/synth" || { echo "::error::synth-bin carries no synth binary"; exit 1; }
        field() { sed -n "s/^$1=//p" "$fp"; }
        bad=0
        want() {
          got="$(field "$1")"
          if [ -z "$got" ] || [ "$got" != "$2" ]; then
            echo "::error::synth-bin fingerprint mismatch on $1: artifact says '$got', this job has '$2'"
            bad=1
          fi
        }
        want commit "$GITHUB_SHA"
        want commit "$(git rev-parse HEAD)"
        want cargo_lock_sha256 "$(sha256sum Cargo.lock | cut -d' ' -f1)"
        want profile "$WANT_PROFILE"
        want features "$WANT_FEATURES"
        want synth_sha256 "$(sha256sum "$d/synth" | cut -d' ' -f1)"
        cat "$fp"
        if [ "$bad" != 0 ]; then
          echo "::error::refusing the shared synth binary; this job does NOT rebuild (a silent rebuild would test a binary nobody named)"
          exit 1
        fi
        mkdir -p target/debug
        install -m 755 "$d/synth" target/debug/synth
        target/debug/synth --version
        echo "synth-bin: fingerprint verified, installed at target/debug/synth"
