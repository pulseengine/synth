# Installs cargo-deny as a PINNED prebuilt release binary, checksum-verified.
#
# WHY. `cargo install --locked cargo-deny` compiled it from source on every run
# (98 s measured on 2026-11-20) and took whatever version was newest that day,
# so the advisory gate's tool could change with no commit. The version and the
# tarball's sha256 are now both in this file: bumping the tool is a diff here.
# A checksum mismatch, an unsupported host or a wrong reported version fails
# the job; there is no fallback to building from source.
name: Install cargo-deny (pinned, prebuilt)
description: Download the pinned cargo-deny release tarball, verify its sha256, install it into cargo's bin
inputs:
  version:
    description: cargo-deny release tag
    default: 0.22.0
  sha256:
    description: sha256 of cargo-deny-<version>-x86_64-unknown-linux-musl.tar.gz
    default: 98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786
runs:
  using: composite
  steps:
    - name: Install cargo-deny ${{ inputs.version }}
      shell: bash
      env:
        V: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        host="$(uname -s)-$(uname -m)"
        [ "$host" = Linux-x86_64 ] || { echo "::error::no pinned cargo-deny checksum for $host"; exit 1; }
        t="cargo-deny-$V-x86_64-unknown-linux-musl"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$t.tar.gz" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/$V/$t.tar.gz"
        echo "$SHA256  $RUNNER_TEMP/$t.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$t.tar.gz" -C "$RUNNER_TEMP"
        bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        mkdir -p "$bin"
        install -m 755 "$RUNNER_TEMP/$t/cargo-deny" "$bin/cargo-deny"
        got="$(cargo deny --version)"
        [ "$got" = "cargo-deny $V" ] || { echo "::error::installed '$got', expected 'cargo-deny $V'"; exit 1; }
        echo "$got (sha256 $SHA256)"
