[package]
name = "synth-verify"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SMT translation validation for the Synth compiler (ordeal QF_BV engine; optional Z3 differential oracle)"

[features]
default = ["arm"]
# Optional Z3 backend: differential oracle against the default ordeal engine
# (enable + set SYNTH_SOLVER_DIFF=1 to cross-check every query). Links the
# SYSTEM libz3 (apt `libz3-dev`) via z3-sys pkg-config/`#[link(name="z3")]` —
# no from-source C++ build and no prebuilt download (#553). Not on the default
# build path.
z3-solver = ["z3"]
arm = ["synth-synthesis"]

[dependencies]
# Core dependencies (always required)
synth-core = { path = "../synth-core", version = "0.83.0" }
synth-cfg = { path = "../synth-cfg", version = "0.83.0" }
synth-opt = { path = "../synth-opt", version = "0.83.0" }

# ARM synthesis (optional, behind 'arm' feature)
synth-synthesis = { path = "../synth-synthesis", version = "0.83.0", optional = true }

# Default SMT engine: pure-Rust, certificate-checked QF_BV solver (#553).
# EXACT-PINNED deliberately: for a 0.x solver a MINOR bump is a breaking bump,
# and this dependency IS the verification engine — a solver regression is a
# verification outage (0.12 hung div/rem trap VCs for 4-6h, #849; 0.16 landed
# with no CI run at all, #864). Every bump goes through a dedicated lane:
# build ALL CI feature sets (incl. `z3-solver`), run the solver-heavy suites
# against a wall clock, and read the upstream CHANGELOG — never auto-merge.
# 0.15 adds `check_with_deadline` (#848); 0.16.1 fixes the bvurem hang
# (ordeal#101); 0.17 seals the term enums (`#[non_exhaustive]`, ordeal#104 —
# consumers keep loud catch-alls in term.rs/solver.rs; variant additions are
# CHANGELOG-called-out) and adds opt-in `cadical`/`cert-bundle` features
# (unused here); 0.18 is benches/BMC corpus + internal solver split, with the
# core certified solve path unchanged (verified by this repo's #997 lane).
# 0.22.1 is a SOUNDNESS fix, not a feature bump (GHSA-xfxf-qxr3-435x /
# ordeal#182, synth#1431). Every release 0.2.0..=0.22.0 bit-blasted `bvshl`,
# `bvlshr`, `bvashr` and rotations with too few barrel-shifter stages when the
# operand width is NOT a power of two (3, 5, 12, 24, 48, ...). Affected queries
# could return `Unsat` WITH A CERTIFICATE THAT RE-CHECKS, because the LRAT
# checker certifies the CNF it was handed and the CNF was the wrong encoding --
# a verification outage that looks exactly like a verification success. The
# encoding is byte-identical at widths 1, 2, 4, 8, 16, 32, 64, 128.
#
# SYNTH'S AFFECTEDNESS, measured rather than assumed: every shift/rotate site in
# synth-verify operates on 32- or 64-bit values (ARM register semantics, WASM
# i32/i64), both powers of two. Non-power-of-two widths DO occur -- 11, 23, 31,
# 52, 63 -- but only as `extract` results and equality constants in IEEE-754
# field classification (f64 exponent 11 / mantissa 52, f32 mantissa 23,
# sign-excluded 31 and 63), never as a shift or rotate operand. The bump is
# therefore expected to leave every verdict unchanged, and THAT IS THE TEST:
# the encoding is byte-identical at power-of-two widths, so unchanged verdicts
# are evidence of non-affectedness and ANY changed verdict is the finding.
# Reasoning alone would not have settled it.
ordeal = "=0.22.1"

# Z3: optional differential oracle (feature `z3-solver`) — no longer default.
# Default features only (NO `static-link-z3`/`bundled`): z3-sys links the
# system libz3 (`libz3-dev`) instead of compiling z3 from source or downloading
# a prebuilt — kills the flaky `build.rs` GitHub download (HTTP 403/502, #553).
z3 = { version = "0.21", optional = true }

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Serialization for test cases
serde.workspace = true
serde_json.workspace = true

# Property-based testing
proptest.workspace = true

# For examples and reporting
chrono = "0.4"

[dev-dependencies]
criterion = "0.8"

[[example]]
name = "verification_report"
required-features = ["arm"]
